<!doctype html><html><head><meta charset=utf8><meta name=viewport content="width=device-width,initial-scale=1,viewport-fit=cover"><style>:root{color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}html{scroll-padding-top:env(safe-area-inset-top,0px)}body{margin:0;padding:0;font:14px -apple-system,BlinkMacSystemFont,sans-serif;background:#fff;color:#000}img{max-width:100%}[hidden]:not([hidden=until-found i]){display:none!important}</style></head><body>
<title>ZETA DIVISION Bangkok Survival Guide</title>
<meta name="description" content="An independent Bangkok companion for Japanese-speaking esports players and staff: Thai phrasebook, food explorer, transport, experiences, hidden gems and emergency essentials.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=Noto+Sans+JP:wght@400;500;700;900&family=Noto+Sans+Thai:wght@400;500;600;700&family=Chakra+Petch:ital,wght@0,400;0,500;0,600;0,700;1,700&display=swap" rel="stylesheet">
<style>:root{
  --bg:#090909;--bg2:#141414;--surface:#1d1d1d;--surface2:#242424;
  --gold:#AA8B30;--gold-hi:#D6B65B;--champ:#E9D9A6;
  --text:#F8F8F8;--muted:#A3A3A3;--line:#303030;
  --danger:#e5484d;--ok:#5fbf8a;
  --f-ui:"Inter","Noto Sans KR","Noto Sans Thai",system-ui,-apple-system,"Segoe UI",sans-serif;
  --f-head:"Space Grotesk","Noto Sans KR","Noto Sans Thai",system-ui,sans-serif;
  --r:18px;--r-sm:12px;--gut:16px;--hdr:60px;--bnav:64px;
  --safe-b:env(safe-area-inset-bottom,0px);
  --ease:cubic-bezier(.2,.7,.2,1);
}
*{box-sizing:border-box;margin:0}
html{scroll-behavior:smooth;-webkit-text-size-adjust:100%;color-scheme:dark}
body{background:var(--bg);color:var(--text);font:400 15px/1.6 var(--f-ui);min-height:100svh;overflow-x:hidden;-webkit-font-smoothing:antialiased}
body.noscroll{overflow:hidden}
img{max-width:100%;display:block}
a{color:inherit;text-decoration:none}
button{font:inherit;color:inherit;background:none;border:0;cursor:pointer;-webkit-tap-highlight-color:transparent}
h1,h2,h3,h4{font-family:var(--f-head);line-height:1.12;letter-spacing:-.01em;font-weight:600}
p{color:#d4d4d4}
:focus-visible{outline:2px solid var(--gold-hi);outline-offset:2px;border-radius:6px}
::selection{background:var(--gold);color:#000}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0)}
.ic{flex:none}
.muted{color:var(--muted)}
.gold{color:var(--gold-hi)}
.hide{display:none!important}
.wrap{width:100%;max-width:1240px;margin:0 auto;padding:0 var(--gut)}
@media(min-width:900px){:root{--gut:32px}}

/* ---------- header ---------- */
.hdr{position:sticky;top:0;z-index:50;height:var(--hdr);background:rgba(9,9,9,.82);backdrop-filter:blur(14px) saturate(140%);-webkit-backdrop-filter:blur(14px) saturate(140%);border-bottom:1px solid var(--line)}
.hdr::after{content:"";position:absolute;left:0;right:0;bottom:-1px;height:1px;background:linear-gradient(90deg,transparent,var(--gold) 20%,var(--gold-hi) 50%,var(--gold) 80%,transparent);opacity:.55}
.hdr .wrap{display:flex;align-items:center;height:100%;gap:10px}
.brand{display:flex;align-items:baseline;gap:8px;font-family:var(--f-head);font-weight:700;letter-spacing:.08em;white-space:nowrap}
.brand b{color:var(--gold-hi);font-size:20px;letter-spacing:.14em}
.brand span{font-size:11px;color:var(--muted);letter-spacing:.22em;font-weight:500}
.nav{display:none;gap:2px;margin-left:18px;flex:1}
.nav a{position:relative;padding:8px 11px;font-size:13px;font-weight:500;color:#cfcfcf;letter-spacing:.02em;border-radius:8px;transition:color .2s}
.nav a::after{content:"";position:absolute;left:11px;right:11px;bottom:2px;height:1.5px;background:var(--gold-hi);transform:scaleX(0);transform-origin:left;transition:transform .3s var(--ease)}
.nav a:hover,.nav a.on{color:#fff}.nav a:hover::after,.nav a.on::after{transform:scaleX(1)}
.hdr__r{margin-left:auto;display:flex;align-items:center;gap:6px}
.icon-btn{width:42px;height:42px;display:inline-grid;place-items:center;border-radius:50%;color:#ddd;transition:background .2s,color .2s}
.icon-btn:hover{background:var(--surface);color:var(--gold-hi)}
.langsw{display:flex;border:1px solid var(--line);border-radius:999px;padding:2px;background:var(--bg2)}
.langsw button{padding:5px 12px;font-size:12px;font-weight:600;border-radius:999px;color:var(--muted);min-height:36px}
.langsw button.on{background:var(--gold);color:#0a0a0a}
@media(min-width:1180px){.nav{display:flex}.menu-btn{display:none}}

/* drawer */
.drawer{position:fixed;inset:0;z-index:80;visibility:hidden}
.drawer.open{visibility:visible}
.drawer__scrim{position:absolute;inset:0;background:rgba(0,0,0,.6);opacity:0;transition:opacity .3s}
.drawer.open .drawer__scrim{opacity:1}
.drawer__p{position:absolute;top:0;bottom:0;right:0;width:min(88vw,380px);background:var(--bg2);border-left:1px solid var(--line);padding:18px 16px calc(24px + var(--safe-b));overflow:auto;transform:translateX(100%);transition:transform .35s var(--ease)}
.drawer.open .drawer__p{transform:none}
.drawer h4{font-size:11px;letter-spacing:.22em;color:var(--gold-hi);margin:18px 6px 8px;text-transform:uppercase;font-weight:600}
.drawer a{display:flex;align-items:center;gap:12px;padding:13px 10px;border-radius:12px;font-weight:500;min-height:48px}
.drawer a:hover,.drawer a.on{background:var(--surface);color:var(--champ)}
.drawer a .ic{color:var(--gold-hi)}
.drawer .langsw{margin:6px;width:max-content}

/* bottom nav */
.bnav{position:fixed;left:0;right:0;bottom:0;z-index:60;height:calc(var(--bnav) + var(--safe-b));padding-bottom:var(--safe-b);background:rgba(14,14,14,.92);backdrop-filter:blur(16px);-webkit-backdrop-filter:blur(16px);border-top:1px solid var(--line);display:grid;grid-template-columns:repeat(5,1fr)}
.bnav a,.bnav button{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;font-size:10.5px;font-weight:500;color:var(--muted);min-height:var(--bnav);letter-spacing:.02em;position:relative}
.bnav .on{color:var(--gold-hi)}
.bnav .on::before{content:"";position:absolute;top:0;width:28px;height:2px;background:var(--gold-hi);border-radius:2px}
@media(min-width:1180px){.bnav{display:none}}
main{padding-bottom:calc(var(--bnav) + var(--safe-b) + 24px);min-height:70svh}
@media(min-width:1180px){main{padding-bottom:60px}}

.sos{position:fixed;right:14px;bottom:calc(var(--bnav) + var(--safe-b) + 14px);z-index:55;display:flex;align-items:center;gap:8px;height:48px;padding:0 16px 0 13px;border-radius:999px;background:#b3262b;color:#fff;font-weight:700;font-size:13px;letter-spacing:.06em;box-shadow:0 8px 24px rgba(179,38,43,.45);border:1px solid rgba(255,255,255,.18);transition:transform .2s}
.sos:hover{transform:translateY(-2px)}
@media(min-width:1180px){.sos{bottom:22px;right:22px}}
@media(max-width:420px){.sos span{display:none}.sos{padding:0 13px;width:48px;justify-content:center}}

/* ---------- view transition ---------- */
.view{animation:vin .45s var(--ease) both}
@keyframes vin{from{opacity:0;transform:translateY(14px)}to{opacity:1;transform:none}}
.section{padding:36px 0}
.shead{padding:34px 0 18px}
.kicker{display:inline-flex;align-items:center;gap:10px;font:600 11px var(--f-head);letter-spacing:.28em;text-transform:uppercase;color:var(--gold-hi)}
.kicker::before{content:"";width:28px;height:1px;background:var(--gold)}
.display{font-size:clamp(34px,7.2vw,72px);font-weight:700;letter-spacing:-.025em;margin:12px 0 10px;text-wrap:balance}
.lead{max-width:680px;color:#bdbdbd;font-size:clamp(15px,2vw,18px)}
h2.h2{font-size:clamp(22px,3.4vw,34px);margin:0 0 6px}
.sub{color:var(--muted);font-size:14px;margin-bottom:18px}
.rule{height:1px;background:linear-gradient(90deg,var(--gold),transparent);border:0;margin:28px 0;opacity:.5}
.back{display:inline-flex;align-items:center;gap:6px;color:var(--muted);font-size:13px;margin-top:20px;min-height:40px}
.back:hover{color:var(--gold-hi)}

/* ---------- hero ---------- */
.hero{position:relative;min-height:min(86svh,820px);display:flex;align-items:flex-end;overflow:hidden;isolation:isolate;border-bottom:1px solid var(--line)}
.hero__bg{position:absolute;inset:-4% 0;z-index:-2;background:#0c0c0c center/cover no-repeat;will-change:transform}
.hero::before{content:"";position:absolute;inset:0;z-index:-1;background:linear-gradient(180deg,rgba(9,9,9,.55) 0%,rgba(9,9,9,.35) 30%,rgba(9,9,9,.82) 78%,var(--bg) 100%),linear-gradient(90deg,rgba(9,9,9,.78),transparent 70%)}
.hero__in{padding:90px var(--gut) 28px;width:100%}
.hero h1{font-size:clamp(40px,10.5vw,118px);font-weight:700;letter-spacing:-.035em;line-height:.95;max-width:12ch;text-wrap:balance}
.hero h1 em{font-style:normal;color:var(--gold-hi)}
.hero__tag{font:600 clamp(12px,2.2vw,15px) var(--f-head);letter-spacing:.3em;color:var(--champ);margin:22px 0 14px;display:flex;align-items:center;gap:12px}
.hero__tag::before{content:"";width:44px;height:1px;background:var(--gold-hi)}
.hero p.lead{max-width:560px;color:#d9d9d9;margin-bottom:24px}
.hero__cta{display:flex;flex-wrap:wrap;gap:10px;margin-bottom:34px}
.shimmer{position:absolute;left:0;right:0;bottom:0;height:2px;background:linear-gradient(90deg,transparent,var(--gold-hi),transparent);background-size:40% 100%;background-repeat:no-repeat;animation:shim 5s linear infinite;opacity:.8}
@keyframes shim{from{background-position:-40% 0}to{background-position:140% 0}}
.strip{display:grid;grid-template-columns:repeat(2,1fr);gap:1px;background:var(--line);border:1px solid var(--line);border-radius:var(--r);overflow:hidden;backdrop-filter:blur(10px)}
.strip>*{background:rgba(14,14,14,.86);padding:12px 14px;display:flex;flex-direction:column;gap:2px;min-width:0}
.strip small{font:600 10px var(--f-head);letter-spacing:.2em;color:var(--gold-hi);text-transform:uppercase}
.strip b{font:600 17px var(--f-head);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.strip span{font-size:12px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.strip a{color:#ff8b8f}
@media(min-width:900px){.strip{grid-template-columns:repeat(5,1fr)}}

/* ---------- buttons / chips ---------- */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;min-height:46px;padding:0 20px;border-radius:999px;font-weight:600;font-size:14px;letter-spacing:.04em;transition:transform .2s var(--ease),background .2s,border-color .2s,color .2s;white-space:nowrap}
.btn:active{transform:scale(.97)}
.btn--gold{background:linear-gradient(180deg,var(--gold-hi),var(--gold));color:#0a0a0a;border:1px solid var(--champ)}
.btn--gold:hover{background:var(--champ)}
.btn--ghost{border:1px solid var(--line);background:rgba(255,255,255,.03);color:#eee}
.btn--ghost:hover{border-color:var(--gold);color:var(--champ)}
.btn--sm{min-height:38px;padding:0 14px;font-size:12.5px}
.btn--block{width:100%}
.btn--danger{background:#b3262b;border:1px solid rgba(255,255,255,.2);color:#fff}
.btn[disabled]{opacity:.45;pointer-events:none}
.row{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.row--between{justify-content:space-between}
.chips{display:flex;gap:8px;overflow-x:auto;padding:4px var(--gut) 10px;margin:0 calc(-1 * var(--gut));scrollbar-width:none;scroll-snap-type:x proximity;scroll-padding-inline:var(--gut)}
.chips::-webkit-scrollbar{display:none}
.chips--wrap{flex-wrap:wrap;overflow:visible;margin:0;padding:4px 0 10px}
.chip{flex:none;min-height:40px;padding:0 15px;border-radius:999px;border:1px solid var(--line);background:var(--bg2);font-size:13px;font-weight:500;color:#cfcfcf;display:inline-flex;align-items:center;gap:6px;transition:all .2s;scroll-snap-align:start}
.chip:hover{border-color:var(--gold)}
.chip.on{background:var(--gold);border-color:var(--champ);color:#0a0a0a;font-weight:600}
.chip small{opacity:.7;font-size:11px}
.filters{position:relative;margin-bottom:12px}
.filters h5{font:600 10.5px var(--f-head);letter-spacing:.22em;color:var(--muted);text-transform:uppercase;margin:10px 0 2px}
.search{display:flex;align-items:center;gap:10px;background:var(--bg2);border:1px solid var(--line);border-radius:999px;padding:0 16px;min-height:48px;transition:border-color .2s}
.search:focus-within{border-color:var(--gold)}
.search input{flex:1;background:none;border:0;color:#fff;font:inherit;outline:0;min-width:0;min-height:44px}
.search .ic{color:var(--gold-hi)}
select,input[type=text],input[type=date],input[type=time],input[type=number]{background:var(--bg2);border:1px solid var(--line);border-radius:12px;color:#fff;font:inherit;min-height:46px;padding:0 14px;width:100%}
select:focus,input:focus{border-color:var(--gold);outline:0}
label.f{display:flex;flex-direction:column;gap:6px;font-size:12px;color:var(--muted);letter-spacing:.06em;font-weight:500}
input[type=range]{width:100%;accent-color:var(--gold-hi)}
.tabs{display:flex;gap:4px;border-bottom:1px solid var(--line);overflow-x:auto;scrollbar-width:none;margin-bottom:20px}
.tabs::-webkit-scrollbar{display:none}
.tab{flex:none;padding:13px 16px;font-weight:600;font-size:14px;color:var(--muted);border-bottom:2px solid transparent;margin-bottom:-1px;display:flex;gap:8px;align-items:center;min-height:48px}
.tab.on{color:var(--champ);border-color:var(--gold-hi)}

/* ---------- cards ---------- */
.grid{display:grid;gap:14px}
.grid--cards{grid-template-columns:repeat(auto-fill,minmax(min(100%,270px),1fr))}
.grid--2{grid-template-columns:repeat(auto-fit,minmax(min(100%,340px),1fr))}
.grid--3{grid-template-columns:repeat(auto-fit,minmax(min(100%,260px),1fr))}
.card{position:relative;background:var(--surface);border:1px solid var(--line);border-radius:var(--r);overflow:hidden;display:flex;flex-direction:column;transition:transform .35s var(--ease),border-color .3s,box-shadow .3s;text-align:left}
.card:hover{transform:translateY(-4px);border-color:var(--gold);box-shadow:0 14px 40px rgba(170,139,48,.14)}
.card__b{padding:14px 16px 16px;display:flex;flex-direction:column;gap:7px;flex:1}
.card h3{font-size:18px}
.card .th{font:500 15px var(--f-ui);color:var(--champ)}
.card .meta{display:flex;flex-wrap:wrap;gap:6px 12px;font-size:12.5px;color:var(--muted);align-items:center}
.card p{font-size:13.5px;color:#bbb;display:-webkit-box;-webkit-line-clamp:3;-webkit-box-orient:vertical;overflow:hidden}
.card .heart{position:absolute;top:10px;right:10px;z-index:2}
.card__link{position:absolute;inset:0;z-index:1}
.card .btn,.card .heart{position:relative;z-index:2}
.card .heart{position:absolute}
.tag{display:inline-flex;align-items:center;gap:4px;font-size:11px;font-weight:600;letter-spacing:.04em;padding:3px 9px;border-radius:999px;border:1px solid var(--line);color:#cfcfcf;background:rgba(255,255,255,.03)}
.tag--gold{border-color:var(--gold);color:var(--champ)}
.tag--warn{border-color:#7a3a3d;color:#ff9a9e}
.tag--ok{border-color:#2f6b4c;color:#8fdcb1}
.tags{display:flex;flex-wrap:wrap;gap:6px}
.ph{position:relative;aspect-ratio:4/3;background:#151515;overflow:hidden;width:100%}
.ph img{width:100%;height:100%;object-fit:cover;transition:transform .7s var(--ease)}
.card:hover .ph img{transform:scale(1.06)}
.ph--none,.ph--err{display:grid;place-items:center;background:radial-gradient(circle at 30% 20%,#2a2410,#121212 70%)}
.ph__mono{font:700 56px var(--f-head);color:var(--gold);opacity:.5}
.ph__tag{position:absolute;left:10px;bottom:10px;font-size:10.5px;letter-spacing:.06em;font-weight:600;padding:3px 9px;border-radius:999px;background:rgba(9,9,9,.72);color:var(--champ);border:1px solid rgba(214,182,91,.35);backdrop-filter:blur(6px)}
.ph--err::after{content:attr(data-x)}
.heart{width:40px;height:40px;border-radius:50%;display:grid;place-items:center;background:rgba(9,9,9,.62);backdrop-filter:blur(8px);color:#fff;border:1px solid rgba(255,255,255,.14);transition:transform .2s}
.heart:hover{color:var(--gold-hi)}
.heart.on{color:#ff5470;background:rgba(9,9,9,.8)}
.heart.on svg{fill:currentColor}
.heart.pop{animation:pop .5s var(--ease)}
@keyframes pop{0%{transform:scale(1)}35%{transform:scale(1.4)}70%{transform:scale(.9)}100%{transform:scale(1)}}
.flames{display:inline-flex;gap:3px;vertical-align:middle}
.flames i{width:8px;height:14px;border-radius:50% 50% 50% 50%/65% 65% 35% 35%;background:#3a3a3a}
.flames i.on{background:linear-gradient(180deg,var(--gold-hi),#d9534f)}
.baht{font-weight:600;color:var(--champ)}.baht i{font-style:normal;color:#444}
.credit{display:block;font-size:11px;color:var(--muted);margin-top:8px}
.credit:hover{color:var(--gold-hi)}

/* bento */
.bento{display:grid;gap:12px;grid-template-columns:repeat(2,1fr)}
.tile{position:relative;min-height:150px;border-radius:var(--r);overflow:hidden;border:1px solid var(--line);background:var(--surface);display:flex;flex-direction:column;justify-content:flex-end;padding:16px;isolation:isolate;transition:transform .35s var(--ease),border-color .3s}
.tile:hover{transform:translateY(-3px);border-color:var(--gold)}
.tile .bgimg{position:absolute;inset:0;z-index:-2;width:100%;height:100%;object-fit:cover;opacity:.75;transition:transform .8s var(--ease)}
.tile:hover .bgimg{transform:scale(1.06)}
.tile::before{content:"";position:absolute;inset:0;z-index:-1;background:linear-gradient(180deg,rgba(9,9,9,0) 20%,rgba(9,9,9,.92))}
.tile .n{position:absolute;top:12px;left:14px;font:600 11px var(--f-head);letter-spacing:.2em;color:var(--gold-hi)}
.tile h3{font-size:19px}
.tile small{color:#bdbdbd;font-size:12px;margin-top:3px}
.tile--wide{grid-column:span 2}
.tile--plain{background:linear-gradient(145deg,#1d1a10,#121212)}.tile--plain[href="#/emergency"]{background:radial-gradient(120% 140% at 85% 20%,rgba(179,38,43,.55),transparent 60%),linear-gradient(145deg,#2a0e10,#121212);border-color:rgba(179,38,43,.45)}
@media(min-width:760px){.bento{grid-template-columns:repeat(4,1fr)}.tile{min-height:190px}.tile--tall{grid-row:span 2}.tile--wide{grid-column:span 2}}

/* sheet */
.sheet{position:fixed;inset:0;z-index:90;visibility:hidden}
.sheet.open{visibility:visible}
.sheet__scrim{position:absolute;inset:0;background:rgba(0,0,0,.72);opacity:0;transition:opacity .3s;backdrop-filter:blur(3px)}
.sheet.open .sheet__scrim{opacity:1}
.sheet__panel{position:absolute;left:0;right:0;bottom:0;max-height:94svh;overflow:auto;background:var(--bg2);border:1px solid var(--line);border-bottom:0;border-radius:26px 26px 0 0;transform:translateY(100%);transition:transform .4s var(--ease);outline:0;padding-bottom:calc(24px + var(--safe-b));overscroll-behavior:contain}
.sheet.open .sheet__panel{transform:none}
.sheet__x{position:sticky;top:12px;float:right;margin:12px 12px -52px 0;z-index:5;width:44px;height:44px;border-radius:50%;background:rgba(9,9,9,.75);display:grid;place-items:center;backdrop-filter:blur(8px);border:1px solid var(--line)}
.sheet__body{padding:20px var(--gut) 8px}
.sheet__hero{aspect-ratio:16/10;max-height:46svh}
.sheet__hero .ph{aspect-ratio:auto;height:100%}
.sheet h2{font-size:clamp(26px,5vw,40px);margin-bottom:4px}
@media(min-width:900px){.sheet__panel{left:50%;right:auto;bottom:auto;top:50%;width:min(880px,94vw);max-height:90svh;border:1px solid var(--line);border-radius:26px;transform:translate(-50%,-46%);opacity:0;transition:transform .4s var(--ease),opacity .3s}.sheet.open .sheet__panel{transform:translate(-50%,-50%);opacity:1}.sheet__panel.wide{width:min(1060px,96vw)}}
.facts{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:1px;background:var(--line);border:1px solid var(--line);border-radius:var(--r-sm);overflow:hidden;margin:14px 0}
.facts>div{background:var(--surface);padding:11px 14px}
.facts small{display:block;font:600 10px var(--f-head);letter-spacing:.18em;text-transform:uppercase;color:var(--gold-hi);margin-bottom:3px}
.facts span{font-size:14px}
.blk{margin:18px 0}
.blk h4{font:600 11px var(--f-head);letter-spacing:.22em;text-transform:uppercase;color:var(--gold-hi);margin-bottom:6px}
.blk ul{padding-left:18px;color:#cfcfcf}.blk li{margin:3px 0}
.note{border-left:2px solid var(--gold);background:rgba(170,139,48,.08);padding:10px 14px;border-radius:0 var(--r-sm) var(--r-sm) 0;font-size:13.5px;color:#d9d3bd}
.note--warn{border-color:#b3262b;background:rgba(179,38,43,.1);color:#f0c4c6}

/* toast */
#toast{position:fixed;left:50%;bottom:calc(var(--bnav) + var(--safe-b) + 74px);transform:translate(-50%,20px);z-index:120;display:flex;gap:10px;align-items:center;padding:12px 18px;background:#232016;border:1px solid var(--gold);color:var(--champ);border-radius:999px;font-size:14px;font-weight:500;opacity:0;pointer-events:none;transition:all .35s var(--ease);max-width:92vw;box-shadow:0 10px 30px rgba(0,0,0,.5)}
#toast.show{opacity:1;transform:translate(-50%,0)}
@media(min-width:1180px){#toast{bottom:32px}}

/* search overlay */
.sov{position:fixed;inset:0;z-index:95;background:rgba(9,9,9,.97);visibility:hidden;opacity:0;transition:opacity .25s;overflow:auto}
.sov.open{visibility:visible;opacity:1}
.sov .wrap{max-width:820px;padding-top:16px;padding-bottom:60px}
.sres{display:flex;flex-direction:column;gap:2px;margin-top:14px}
.sres h5{font:600 11px var(--f-head);letter-spacing:.22em;color:var(--gold-hi);text-transform:uppercase;margin:20px 4px 6px}
.sres a{display:flex;gap:12px;align-items:center;padding:10px;border-radius:12px;min-height:56px}
.sres a:hover,.sres a:focus-visible{background:var(--surface)}
.sres .t{font-weight:600}.sres .s{font-size:12.5px;color:var(--muted)}
.sres .thumb{width:46px;height:46px;border-radius:10px;object-fit:cover;background:#1a1a1a;flex:none}

/* welcome */
.welcome{margin:14px 0 0;display:flex;gap:12px;align-items:center;justify-content:space-between;padding:12px 14px 12px 18px;border:1px solid var(--gold);border-radius:var(--r);background:linear-gradient(90deg,rgba(170,139,48,.18),rgba(170,139,48,.04));font:600 12px var(--f-head);letter-spacing:.16em;color:var(--champ)}

/* footer */
.foot{border-top:1px solid var(--line);padding:36px 0 calc(var(--bnav) + var(--safe-b) + 90px);color:var(--muted);font-size:12.5px;background:var(--bg2)}
.foot .brand{margin-bottom:10px}
.foot p{color:var(--muted);max-width:760px;margin:8px 0}
.foot a{color:var(--champ);text-decoration:underline;text-underline-offset:3px}
@media(min-width:1180px){.foot{padding-bottom:50px}}

/* skeleton */
.sk .sk__img,.sk .sk__l{background:linear-gradient(90deg,#1a1a1a,#262626,#1a1a1a);background-size:200% 100%;animation:sk 1.2s linear infinite;border-radius:10px}
.sk__img{aspect-ratio:4/3;border-radius:0!important}.sk__l{height:14px;margin:14px 16px 0}.sk__l.s{width:50%;margin-bottom:16px}
@keyframes sk{to{background-position:-200% 0}}
.empty{text-align:center;padding:56px 20px;border:1px dashed var(--line);border-radius:var(--r);background:var(--bg2)}
.empty__mark{color:var(--gold);margin-bottom:10px;display:grid;place-items:center}
.empty p{color:var(--muted);max-width:420px;margin:6px auto 18px}

/* accordion */
details.acc{border:1px solid var(--line);border-radius:var(--r-sm);background:var(--surface);margin:8px 0;overflow:hidden}
details.acc summary{list-style:none;cursor:pointer;display:flex;align-items:center;gap:12px;padding:14px 16px;font-weight:600;min-height:54px}
details.acc summary::-webkit-details-marker{display:none}
details.acc summary .ic:first-child{color:var(--gold-hi)}
details.acc summary .chev{margin-left:auto;transition:transform .3s}
details.acc[open] summary .chev{transform:rotate(180deg)}
details.acc[open]{border-color:var(--gold)}
.acc__b{padding:0 16px 16px;animation:vin .35s var(--ease)}

/* phrases */
.phr{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:16px;display:flex;flex-direction:column;gap:6px;position:relative}
.phr__en{font-size:12px;color:var(--muted);letter-spacing:.04em}
.phr__th{font:600 26px/1.35 var(--f-ui);color:var(--champ)}
.phr__rom{font-style:italic;color:#d8d8d8}
.phr__ko{font-size:15px}
.phr__ctx{font-size:12.5px;color:var(--muted)}
.phr__act{display:flex;gap:2px;margin:4px -8px -6px;flex-wrap:wrap;align-items:center}
.phr .heart{position:static;background:none;border:0;backdrop-filter:none}
.lvl{font-size:10.5px;font-weight:700;letter-spacing:.1em;text-transform:uppercase;padding:2px 8px;border-radius:999px;border:1px solid var(--line);align-self:flex-start}
.lvl--slang{border-color:#6b5a1f;color:var(--champ)}.lvl--caution{border-color:#b3262b;color:#ff9a9e}.lvl--casual{border-color:#3d4a66;color:#a9bde8}
.tts{display:none}
.has-th-voice .tts{display:inline-grid}
.show-local{position:fixed;inset:0;z-index:110;background:#050505;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:20px;padding:24px;text-align:center}
.show-local .big{font:700 clamp(44px,13vw,150px)/1.25 var(--f-ui);color:#fff;text-wrap:balance}
.show-local .rom{font-size:clamp(18px,4vw,32px);color:var(--gold-hi);font-style:italic}
.show-local .en{color:var(--muted);font-size:clamp(14px,2.6vw,20px)}
.show-local .x{position:absolute;top:14px;right:14px}

/* flashcards */
.fc{perspective:1400px;max-width:560px;margin:0 auto}
.fc__in{position:relative;min-height:320px;transform-style:preserve-3d;transition:transform .6s var(--ease)}
.fc.flip .fc__in{transform:rotateY(180deg)}
.fc__f{position:absolute;inset:0;backface-visibility:hidden;-webkit-backface-visibility:hidden;border:1px solid var(--gold);border-radius:24px;background:linear-gradient(160deg,#1f1c12,#151515);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:10px;padding:24px;text-align:center}
.fc__b{transform:rotateY(180deg)}
.fc .big{font:600 38px/1.3 var(--f-ui);color:var(--champ)}

/* quiz */
.opt{display:block;width:100%;text-align:left;padding:14px 16px;border:1px solid var(--line);border-radius:14px;background:var(--surface);margin:8px 0;min-height:54px;transition:all .2s;font-weight:500}
.opt:hover{border-color:var(--gold)}
.opt.right{border-color:var(--ok);background:rgba(95,191,138,.12)}
.opt.wrong{border-color:var(--danger);background:rgba(229,72,77,.12)}
.bar{height:6px;background:var(--line);border-radius:6px;overflow:hidden}.bar i{display:block;height:100%;background:linear-gradient(90deg,var(--gold),var(--gold-hi));transition:width .5s var(--ease)}

/* roulette */
.rl{display:grid;gap:24px}
@media(min-width:900px){.rl{grid-template-columns:minmax(380px,520px) 1fr;align-items:start}}
.wheelbox{position:relative;width:min(92vw,520px);aspect-ratio:1;margin:0 auto}
.wheelbox canvas{width:100%;height:100%;display:block;filter:drop-shadow(0 12px 40px rgba(170,139,48,.25))}
.pointer{position:absolute;top:-6px;left:50%;transform:translateX(-50%);z-index:3;width:0;height:0;border-left:15px solid transparent;border-right:15px solid transparent;border-top:32px solid var(--champ);filter:drop-shadow(0 2px 4px #000)}
.spin{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);width:24%;aspect-ratio:1;border-radius:50%;z-index:3;background:radial-gradient(circle at 35% 30%,var(--champ),var(--gold-hi) 45%,var(--gold));color:#0a0a0a;font:700 clamp(13px,3.4vw,20px) var(--f-head);letter-spacing:.12em;border:4px solid #0a0a0a;box-shadow:0 0 0 2px var(--gold-hi),0 8px 24px rgba(0,0,0,.6);transition:transform .15s}
.spin:active{transform:translate(-50%,-50%) scale(.94)}
.spin[disabled]{filter:grayscale(.5);cursor:wait}
.result{border:1px solid var(--gold);border-radius:var(--r);overflow:hidden;background:var(--surface);animation:vin .5s var(--ease)}
.result .ph{aspect-ratio:16/10}
.result__b{padding:16px}

/* bingo */
.bingo{display:grid;grid-template-columns:repeat(5,1fr);gap:6px;max-width:640px;margin:0 auto}
.bc{position:relative;aspect-ratio:1;border:1px solid var(--line);border-radius:12px;background:var(--surface);padding:6px;font-size:clamp(9.5px,2.5vw,13px);line-height:1.25;display:flex;align-items:center;justify-content:center;text-align:center;font-weight:500;transition:all .25s;overflow:hidden}
.bc:hover{border-color:var(--gold)}
.bc.on{background:linear-gradient(145deg,var(--gold),#6d5a1d);color:#0a0a0a;border-color:var(--champ);font-weight:700}
.bc.on::after{content:"✓";position:absolute;top:2px;right:5px;font-size:12px}
.bc.line{box-shadow:0 0 0 2px var(--champ),0 0 18px rgba(214,182,91,.6)}
.sparkle{position:fixed;pointer-events:none;z-index:130;width:8px;height:8px;border-radius:50%;background:var(--gold-hi);animation:spark 1.2s var(--ease) forwards}
@keyframes spark{to{transform:translate(var(--dx),var(--dy)) scale(.2);opacity:0}}

/* passport */
.pass{background:linear-gradient(160deg,#17140a,#0e0e0e);border:1px solid var(--gold);border-radius:22px;padding:20px;position:relative;overflow:hidden}
.pass::before{content:"";position:absolute;inset:8px;border:1px solid rgba(214,182,91,.25);border-radius:16px;pointer-events:none}
.stamps{display:grid;grid-template-columns:repeat(auto-fill,minmax(92px,1fr));gap:10px;margin-top:12px}
.stamp{aspect-ratio:1;border:1.5px dashed #4a4a4a;border-radius:50%;display:grid;place-items:center;text-align:center;font-size:10.5px;padding:10px;color:#777;line-height:1.2;transition:all .3s;position:relative}
.stamp.on{border:2px solid var(--gold-hi);color:var(--champ);background:radial-gradient(circle,rgba(214,182,91,.18),transparent 70%);transform:rotate(-6deg);animation:stamp .5s var(--ease)}
@keyframes stamp{0%{transform:scale(2) rotate(-20deg);opacity:0}60%{transform:scale(.9) rotate(-6deg);opacity:1}100%{transform:scale(1) rotate(-6deg)}}
.badge{display:flex;gap:12px;align-items:center;padding:12px;border:1px solid var(--line);border-radius:14px;background:var(--surface);opacity:.5}
.badge.on{opacity:1;border-color:var(--gold)}
.badge__i{width:44px;height:44px;border-radius:50%;display:grid;place-items:center;background:#262626;color:#666}
.badge.on .badge__i{background:linear-gradient(145deg,var(--gold-hi),var(--gold));color:#0a0a0a}

/* planner */
.tl{position:relative;padding-left:26px;display:flex;flex-direction:column;gap:14px}
.tl::before{content:"";position:absolute;left:8px;top:8px;bottom:8px;width:1px;background:linear-gradient(var(--gold),transparent)}
.stop{position:relative;display:grid;grid-template-columns:1fr;background:var(--surface);border:1px solid var(--line);border-radius:var(--r);overflow:hidden}
.stop::before{content:"";position:absolute;left:-23px;top:20px;width:11px;height:11px;border-radius:50%;background:var(--gold-hi);box-shadow:0 0 0 4px rgba(214,182,91,.18)}
.stop .ph{aspect-ratio:16/8}
.stop__b{padding:14px 16px}
.stop__t{font:600 12px var(--f-head);letter-spacing:.16em;color:var(--gold-hi)}
.stop__act{display:flex;flex-wrap:wrap;gap:6px;margin-top:10px}
.travel{font-size:12px;color:var(--muted);padding:2px 0 0 4px;display:flex;gap:8px;align-items:center}
@media(min-width:720px){.stop{grid-template-columns:240px 1fr}.stop .ph{aspect-ratio:auto;height:100%;min-height:170px}}
.form{display:grid;gap:14px;grid-template-columns:repeat(auto-fit,minmax(min(100%,220px),1fr))}
.panel{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:18px}
.panel--gold{border-color:var(--gold);background:linear-gradient(160deg,#1c180c,#161616)}
.preset{display:flex;flex-direction:column;gap:4px;align-items:flex-start;text-align:left;padding:14px 16px;border:1px solid var(--line);border-radius:var(--r);background:var(--surface);transition:all .25s;min-height:96px}
.preset:hover,.preset.on{border-color:var(--gold-hi);background:#1f1b0e}
.preset b{font:600 15px var(--f-head);letter-spacing:.03em}.preset small{color:var(--muted);font-size:12.5px;line-height:1.45}
.preset .n{font:600 10.5px var(--f-head);color:var(--gold-hi);letter-spacing:.2em}

/* tables / misc */
.cmp{width:100%;border-collapse:collapse;font-size:13.5px;min-width:560px}
.cmp th,.cmp td{padding:11px 12px;border-bottom:1px solid var(--line);text-align:left;vertical-align:top}
.cmp th{font:600 10.5px var(--f-head);letter-spacing:.18em;text-transform:uppercase;color:var(--gold-hi);background:var(--bg2);position:sticky;top:0}
.scroll-x{overflow-x:auto;border:1px solid var(--line);border-radius:var(--r-sm);background:var(--surface)}
.meter{display:inline-flex;gap:3px}.meter i{width:12px;height:6px;border-radius:2px;background:#383838}.meter i.on{background:var(--gold-hi)}
.num{display:flex;align-items:center;gap:14px;padding:16px 18px;border:1px solid var(--line);border-radius:var(--r);background:var(--surface);min-height:76px;transition:all .2s}
.num:hover{border-color:#b3262b;background:#201212}
.num b{font:700 34px var(--f-head);color:#ff8b8f;min-width:90px;letter-spacing:.02em}
.num span{color:#ddd;font-size:14px}
.card-th{background:#050505;border:1px solid var(--gold);border-radius:var(--r);padding:20px;text-align:center;display:flex;flex-direction:column;gap:6px;align-items:center}
.card-th .big{font:700 clamp(30px,7vw,52px)/1.3 var(--f-ui);color:#fff;text-wrap:balance}
.mapbox{height:min(68svh,640px);border-radius:var(--r);border:1px solid var(--line);overflow:hidden;background:#111}
.leaflet-popup-content-wrapper{background:#1d1d1d;color:#eee;border:1px solid var(--gold);border-radius:14px}
.leaflet-popup-tip{background:#1d1d1d}.leaflet-popup-content{margin:12px 14px;font:13px/1.5 var(--f-ui)}
.leaflet-popup-content a{color:var(--champ)}
.pin{width:26px;height:26px;border-radius:50% 50% 50% 0;transform:rotate(-45deg);background:var(--gold-hi);border:2px solid #0a0a0a;box-shadow:0 2px 8px rgba(0,0,0,.6);display:block}
.pin i{display:block;width:8px;height:8px;margin:6px;border-radius:50%;background:#0a0a0a}
.pin--saved{background:#ff5470}
.kv{display:grid;grid-template-columns:auto 1fr;gap:6px 16px;font-size:14px}.kv dt{color:var(--muted)}.kv dd{margin:0}
.split{display:grid;gap:22px}@media(min-width:900px){.split{grid-template-columns:1.15fr .85fr}}
.stat{font:700 36px var(--f-head);color:var(--champ)}
.vibe-card{border:1px solid var(--gold);border-radius:24px;padding:26px;background:radial-gradient(circle at 80% 0,#2b2310,#101010 65%);text-align:center}
.vibe-card h2{font-size:clamp(30px,7vw,48px);color:var(--champ);margin:8px 0}
.mtx{display:grid;gap:10px}
.hood-hero{position:relative;min-height:min(60svh,520px);display:flex;align-items:flex-end;isolation:isolate;overflow:hidden;border-bottom:1px solid var(--line)}
.hood-hero .bgimg{position:absolute;inset:0;z-index:-2;width:100%;height:100%;object-fit:cover}
.hood-hero::before{content:"";position:absolute;inset:0;z-index:-1;background:linear-gradient(180deg,rgba(9,9,9,.3),rgba(9,9,9,.95))}
.hood-card{min-height:240px}
.route{counter-reset:r;list-style:none;padding:0}
.route li{counter-increment:r;position:relative;padding:8px 0 14px 44px;border-left:1px dashed var(--gold);margin-left:14px}
.route li::before{content:counter(r);position:absolute;left:-15px;top:6px;width:28px;height:28px;border-radius:50%;background:var(--gold-hi);color:#0a0a0a;font:700 13px var(--f-head);display:grid;place-items:center}
.route li:last-child{border-color:transparent}
@media(prefers-reduced-motion:reduce){*,*::before,*::after{animation-duration:.01ms!important;animation-iteration-count:1!important;transition-duration:.01ms!important;scroll-behavior:auto!important}.shimmer{display:none}}
@media print{.hdr,.bnav,.sos,.foot{display:none}}

/* compact language control on phones (full switcher lives in the menu + home strip) */
.langcycle{display:none;align-items:center;gap:6px;height:36px;padding:0 12px;border-radius:999px;border:1px solid var(--gold);background:rgba(170,139,48,.14);color:var(--champ);font-weight:600;font-size:12.5px}
@media(max-width:600px){.hdr .langsw{display:none}.langcycle{display:inline-flex}.hdr__r{gap:2px}}
@media(max-width:400px){.brand span{display:none}}

.skip:focus{position:fixed;left:12px;top:12px;width:auto;height:auto;clip:auto;z-index:200;padding:12px 18px;background:var(--gold);color:#0a0a0a;border-radius:999px;font-weight:700}
/* hero fallback when no photo is available (offline / not yet cached) */
.hero__bg:not([style]){background:radial-gradient(900px 520px at 78% 18%,rgba(170,139,48,.30),transparent 62%),radial-gradient(600px 400px at 10% 90%,rgba(214,182,91,.10),transparent 60%),linear-gradient(160deg,#17130a,#090909 72%)}

.leaflet-container{background:#141414!important}.mapbox{position:relative}

/* required styles */

.leaflet-pane,
.leaflet-tile,
.leaflet-marker-icon,
.leaflet-marker-shadow,
.leaflet-tile-container,
.leaflet-pane > svg,
.leaflet-pane > canvas,
.leaflet-zoom-box,
.leaflet-image-layer,
.leaflet-layer {
	position: absolute;
	left: 0;
	top: 0;
	}
.leaflet-container {
	overflow: hidden;
	}
.leaflet-tile,
.leaflet-marker-icon,
.leaflet-marker-shadow {
	-webkit-user-select: none;
	   -moz-user-select: none;
	        user-select: none;
	  -webkit-user-drag: none;
	}
/* Prevents IE11 from highlighting tiles in blue */
.leaflet-tile::selection {
	background: transparent;
}
/* Safari renders non-retina tile on retina better with this, but Chrome is worse */
.leaflet-safari .leaflet-tile {
	image-rendering: -webkit-optimize-contrast;
	}
/* hack that prevents hw layers "stretching" when loading new tiles */
.leaflet-safari .leaflet-tile-container {
	width: 1600px;
	height: 1600px;
	-webkit-transform-origin: 0 0;
	}
.leaflet-marker-icon,
.leaflet-marker-shadow {
	display: block;
	}
/* .leaflet-container svg: reset svg max-width decleration shipped in Joomla! (joomla.org) 3.x */
/* .leaflet-container img: map is broken in FF if you have max-width: 100% on tiles */
.leaflet-container .leaflet-overlay-pane svg {
	max-width: none !important;
	max-height: none !important;
	}
.leaflet-container .leaflet-marker-pane img,
.leaflet-container .leaflet-shadow-pane img,
.leaflet-container .leaflet-tile-pane img,
.leaflet-container img.leaflet-image-layer,
.leaflet-container .leaflet-tile {
	max-width: none !important;
	max-height: none !important;
	width: auto;
	padding: 0;
	}

.leaflet-container img.leaflet-tile {
	/* See: https://bugs.chromium.org/p/chromium/issues/detail?id=600120 */
	mix-blend-mode: plus-lighter;
}

.leaflet-container.leaflet-touch-zoom {
	-ms-touch-action: pan-x pan-y;
	touch-action: pan-x pan-y;
	}
.leaflet-container.leaflet-touch-drag {
	-ms-touch-action: pinch-zoom;
	/* Fallback for FF which doesn't support pinch-zoom */
	touch-action: none;
	touch-action: pinch-zoom;
}
.leaflet-container.leaflet-touch-drag.leaflet-touch-zoom {
	-ms-touch-action: none;
	touch-action: none;
}
.leaflet-container {
	-webkit-tap-highlight-color: transparent;
}
.leaflet-container a {
	-webkit-tap-highlight-color: rgba(51, 181, 229, 0.4);
}
.leaflet-tile {
	filter: inherit;
	visibility: hidden;
	}
.leaflet-tile-loaded {
	visibility: inherit;
	}
.leaflet-zoom-box {
	width: 0;
	height: 0;
	-moz-box-sizing: border-box;
	     box-sizing: border-box;
	z-index: 800;
	}
/* workaround for https://bugzilla.mozilla.org/show_bug.cgi?id=888319 */
.leaflet-overlay-pane svg {
	-moz-user-select: none;
	}

.leaflet-pane         { z-index: 400; }

.leaflet-tile-pane    { z-index: 200; }
.leaflet-overlay-pane { z-index: 400; }
.leaflet-shadow-pane  { z-index: 500; }
.leaflet-marker-pane  { z-index: 600; }
.leaflet-tooltip-pane   { z-index: 650; }
.leaflet-popup-pane   { z-index: 700; }

.leaflet-map-pane canvas { z-index: 100; }
.leaflet-map-pane svg    { z-index: 200; }

.leaflet-vml-shape {
	width: 1px;
	height: 1px;
	}
.lvml {
	behavior: none;
	display: inline-block;
	position: absolute;
	}


/* control positioning */

.leaflet-control {
	position: relative;
	z-index: 800;
	pointer-events: visiblePainted; /* IE 9-10 doesn't have auto */
	pointer-events: auto;
	}
.leaflet-top,
.leaflet-bottom {
	position: absolute;
	z-index: 1000;
	pointer-events: none;
	}
.leaflet-top {
	top: 0;
	}
.leaflet-right {
	right: 0;
	}
.leaflet-bottom {
	bottom: 0;
	}
.leaflet-left {
	left: 0;
	}
.leaflet-control {
	float: left;
	clear: both;
	}
.leaflet-right .leaflet-control {
	float: right;
	}
.leaflet-top .leaflet-control {
	margin-top: 10px;
	}
.leaflet-bottom .leaflet-control {
	margin-bottom: 10px;
	}
.leaflet-left .leaflet-control {
	margin-left: 10px;
	}
.leaflet-right .leaflet-control {
	margin-right: 10px;
	}


/* zoom and fade animations */

.leaflet-fade-anim .leaflet-popup {
	opacity: 0;
	-webkit-transition: opacity 0.2s linear;
	   -moz-transition: opacity 0.2s linear;
	        transition: opacity 0.2s linear;
	}
.leaflet-fade-anim .leaflet-map-pane .leaflet-popup {
	opacity: 1;

="lead">${t}</p>`:""}</header>`,Io=(e=6)=>`<div class="grid grid--cards">${Array.from({length:e},()=>'<div class="card sk"><div class="sk__img"></div><div class="sk__l"></div><div class="sk__l s"></div></div>').join("")}</div>`;Fo=null;je=null;Lo=()=>!!je;Se=(e,a="")=>`<button class="icon-btn tts ${a}" data-speak="${s(e)}" aria-label="${o("Hear pronunciation","発音を聞く","\u0E1F\u0E31\u0E07\u0E40\u0E2A\u0E35\u0E22\u0E07")}">${m("volume",18)}</button>`,we=(e,a=160)=>{let t;return(...n)=>{clearTimeout(t),t=setTimeout(()=>e(...n),a)}},xe=(e,a=Math.random)=>{e=[...e];for(let t=e.length-1;t>0;t--){let n=Math.floor(a()*(t+1));[e[t],e[n]]=[e[n],e[t]]}return e},Da=(e,a=Math.random)=>e[Math.floor(a()*e.length)],Ya=(e,a)=>{let n=p=>p*Math.PI/180,i=n(a[0]-e[0]),r=n(a[1]-e[1]),l=Math.sin(i/2)**2+Math.cos(n(e[0]))*Math.cos(n(a[0]))*Math.sin(r/2)**2;return 2*6371*Math.asin(Math.sqrt(l))}});var Qo,No=S(()=>{Qo=[{id:"pad-kra-pao",cat:"classics",name:{en:"Pad Kra Pao",th:"\u0E1C\u0E31\u0E14\u0E01\u0E30\u0E40\u0E1E\u0E23\u0E32",ko:"パッガパオ(バジル炒めご飯)"},rom:"phat ka-phrao",desc:{en:"Minced pork (or chicken) wok-fried at high heat with holy basil, garlic and bird's-eye chilies, served over rice with a crispy fried egg on top. Peppery, savory, a little sweet and the unofficial lunch of Bangkok.",ko:"刻んだ豚肉(または鶏肉)を強火でにんにく、プリッキーヌ、ホーリーバジルと炒めてご飯にのせ、カリカリの目玉焼きをのせた丼です。ピリ辛でしょっぱ甘く、バンコクの人たちの国民的ランチです。"},ingredients:{en:["holy basil (kra pao)","bird's-eye chilies","garlic","minced pork or chicken","oyster sauce","soy sauce","fish sauce","fried egg","jasmine rice"],ko:["ホーリーバジル（ガパオ）","プリッキーヌ（小粒唐辛子）","にんにく","豚または鶏のひき肉","オイスターソース","しょうゆ","ナンプラー","目玉焼き","ジャスミンライス"]},spice:3,price:[50,90],allergens:["egg","soy","fish","shellfish"],pork:"optional",seafood:"optional",veg:"option",tags:["street","local-fav","post-practice","high-protein","late-night","beginner","kr-familiar"],beginner:{en:"The basil is holy basil, which tastes peppery and clove-like, not the sweet basil in Italian food. Pork (moo sap) is the default; chicken (gai), beef (nuea) and crispy pork (moo krob) are common swaps. It is usually spicy, so say \"mai phet\" or \"phet nit noi\" (a little spicy) on your first try. Japanese visitors will feel at home with a donburi topped with a fried egg.",ko:"バジルはイタリア料理で使うスイートバジルではなく、胡椒やクローブのような香りのホーリーバジルです。基本は豚肉(ムー・サップ)ですが、鶏肉(ガイ)、牛肉(ヌア)、カリカリ豚バラ(ムー・クロップ)にも変えられます。たいていかなり辛いので、最初は「マイ・ペット(辛くしないで)」か「ペット・ニット・ノーイ(少しだけ辛く)」と伝えましょう。目玉焼きをのせた丼なので、日本人の口にもよく合います。"},order:{en:'Say the dish, the meat, then "kai dao" for the fried egg. Rice is included.',ko:"メニュー+肉+「カイ・ダーオ(目玉焼き)」の順で言えばOKです。ご飯は基本で付いてきます。",th:"\u0E02\u0E2D\u0E1C\u0E31\u0E14\u0E01\u0E30\u0E40\u0E1E\u0E23\u0E32\u0E2B\u0E21\u0E39\u0E2A\u0E31\u0E1A\u0E44\u0E02\u0E48\u0E14\u0E32\u0E27 \u0E44\u0E21\u0E48\u0E40\u0E1C\u0E47\u0E14{P}",rom:"khor phat ka-phrao moo sap khai dao mai phet {P}"},fact:{en:'Thais are strict about it: real pad kra pao uses holy basil and no vegetables like beans or carrots. If you want long beans in it, ask for "tua fak yao" (yard-long beans) and most stalls will add them.',ko:"タイの人たちはこの料理にかなりこだわりがあります。本場のパッガパオはホーリーバジルを使い、豆やにんじんのような野菜は入れないのが基本です。ささげ(トゥア・ファック・ヤーオ)を入れたいときは別に頼めば、たいていのお店で入れてくれます。"},where:[{name:"Any street stall or made-to-order shop (aharn tam sang)",area:"other",note:{en:"Found on practically every block, often until late evening. Look for a wok on a flaming burner and a stack of egg cartons.",ko:"ほぼどの通りにもあり、夜遅くまで営業しているお店も多いです。炎が上がる強火の中華鍋と、積まれた卵のパックが目印です。"}}],imgQuery:"Pad kra pao",imgAlt:"Phat kaphrao: minced meat stir-fried with holy basil over rice, topped with a fried egg",mapsQuery:"pad kra pao restaurant Bangkok"},{id:"pad-thai",cat:"classics",name:{en:"Pad Thai",th:"\u0E1C\u0E31\u0E14\u0E44\u0E17\u0E22",ko:"パッタイ(タイ風焼きビーフン)"},rom:"phat thai",desc:{en:"Thin rice noodles stir-fried with tamarind, fish sauce and palm sugar, egg, tofu and dried shrimp, then finished with bean sprouts, garlic chives and crushed peanuts. Sweet-sour-savory with a squeeze of lime.",ko:"細い米麺をタマリンド、ナンプラー、ヤシ砂糖のソースで卵、豆腐、干しエビと炒め、もやし、ニラ、砕いたピーナッツをのせます。甘酸っぱくてしょっぱく、ライムを搾るとさらにおいしいです。"},ingredients:{en:["rice noodles (sen chan)","tamarind","fish sauce","palm sugar","egg","firm tofu","dried shrimp","bean sprouts","garlic chives","crushed peanuts","lime"],ko:["米麺（センレック）","タマリンド","ナンプラー","ヤシ砂糖","卵","固い豆腐","干しエビ","もやし","ニラ","砕いたピーナッツ","ライム"]},spice:1,price:[60,150],allergens:["peanut","egg","shellfish","fish","soy"],pork:"no",seafood:"optional",veg:"option",tags:["street","local-fav","beginner","kr-familiar","sweet"],beginner:{en:"The standard recipe already contains dried shrimp and fish sauce even if the topping is chicken, so it is not truly vegetarian unless you ask. It is more sweet-sour than spicy; add chili flakes from the caddy if you want heat. Shrimp (goong sot) is the classic topping. A safe first dish and one many Japanese visitors know from home.",ko:"具が鶏肉でも基本のレシピには干しエビとナンプラーが入っているので、頼まない限りベジタリアン向けではありません。辛いというより甘酸っぱい味なので、辛くしたいときはテーブルの唐辛子粉を足してください。定番の具はエビ(グン・ソット)です。最初の一食として安心で、日本でもすでにおなじみのメニューです。"},order:{en:'Say pad thai plus the topping. Ask for it "ho khai" if you want it wrapped in a thin egg crepe.',ko:"パッタイ+具材を伝えてください。薄い卵焼きで包んだスタイルは「ホー・カイ」と言えばOKです。",th:"\u0E02\u0E2D\u0E1C\u0E31\u0E14\u0E44\u0E17\u0E22\u0E01\u0E38\u0E49\u0E07\u0E2A\u0E14 \u0E44\u0E21\u0E48\u0E43\u0E2A\u0E48\u0E16\u0E31\u0E48\u0E27{P}",rom:"khor phat thai goong sot mai sai thua {P}"},fact:{en:"Pad thai spread as a national dish in the late 1930s and 1940s, when the government promoted noodles and a unified Thai food identity.",ko:"パッタイは1930~40年代に、政府が米麺の消費とタイ料理のアイデンティティを推進したことで国民食として広まりました。"},where:[{name:"Thip Samai (Pad Thai Pratu Pi)",area:"other",note:{en:"Legendary pad thai on Maha Chai Road in the Old Town, open since the 1960s. Known for the egg-wrapped version and long queues at peak hours.",ko:"旧市街のマハーチャイ通りにある伝説的なパッタイのお店で、1960年代から営業しています。卵で包んだパッタイが有名で、ピーク時は行列ができます。"}},{name:"Any street stall in Yaowarat",area:"yaowarat",note:{en:"Evening stalls in Chinatown often serve a cheaper, smokier version.",ko:"チャイナタウンの夜の屋台では、より安くて香ばしい(鍋の香りがする)パッタイが食べられます。"}}],imgQuery:"Pad Thai",imgAlt:"A plate of pad thai with shrimp, bean sprouts, peanuts and a lime wedge",mapsQuery:"Thip Samai Pad Thai Bangkok"},{id:"khao-man-gai",cat:"classics",name:{en:"Khao Man Gai",th:"\u0E02\u0E49\u0E32\u0E27\u0E21\u0E31\u0E19\u0E44\u0E01\u0E48",ko:"カオ・マン・ガイ(タイ風チキンライス)"},rom:"khao man gai",desc:{en:"Tender poached chicken over rice cooked in chicken fat, garlic and ginger, with a cup of clear broth and a punchy dipping sauce of fermented soybean, ginger and chili. Mild, comforting and very filling.",ko:"鶏の脂とにんにく、しょうがで炊いたご飯の上にやわらかく茹でた鶏肉をのせ、澄んだスープと発酵大豆・しょうが・唐辛子のタレを添えます。やさしい味でボリュームもたっぷりの一杯です。"},ingredients:{en:["poached chicken","rice cooked in chicken fat","garlic","ginger","fermented soybean dipping sauce","chili","cucumber","clear broth"],ko:["ゆで鶏","鶏の脂で炊いたご飯","にんにく","しょうが","発酵豆ソース","唐辛子","きゅうり","透き通った鶏スープ"]},spice:1,price:[50,90],allergens:["soy"],pork:"no",seafood:"no",veg:"no",tags:["street","local-fav","post-practice","high-protein","beginner","kr-familiar"],beginner:{en:"Close cousin of Hainanese chicken rice. The sauce is where the flavor is, so spoon it over the chicken and rice. Order boiled (tom), fried (thot) or a mix. The dark cubes in the soup bowl at some shops are chicken blood curd; ask to leave them out if you prefer. Very close to Japanese chicken mizutaki comfort food.",ko:"海南鶏飯のいとこのようなメニューです。味の決め手はタレなので、鶏肉とご飯にたっぷりかけて食べてください。茹で(トム)、揚げ(トート)、半々から選べます。お店によってはスープに鶏の血を固めたものが入っているので、苦手なら抜いてもらってください。日本の鶏の水炊きのようにほっとする味です。"},order:{en:'Ask for khao man gai and choose boiled (tom), fried (thot) or mixed (phasom). Add "phiset" for extra chicken.',ko:"カオ・マン・ガイと言って、茹で(トム)/揚げ(トート)/半々(パソム)から選んでください。「ピセート」を付けると鶏肉を増やしてくれます。",th:"\u0E02\u0E2D\u0E02\u0E49\u0E32\u0E27\u0E21\u0E31\u0E19\u0E44\u0E01\u0E48\u0E15\u0E49\u0E21{P}",rom:"khor khao man gai tom {P}"},fact:{en:"Thai khao man gai comes from the Hainanese chicken rice of Chinese immigrants, but the Thai version adds a fermented-soybean and ginger sauce with chili.",ko:"カオ・マン・ガイは中国・海南からの移民のチキンライスが起源ですが、タイ式は発酵大豆としょうが、唐辛子のタレが独自に発展しました。"},where:[{name:"Go-Ang Kaiton Pratunam",area:"other",note:{en:"Pratunam's famous khao man gai shop near the market; expect a queue at lunch.",ko:"プラトゥーナーム市場の近くにある有名なカオ・マン・ガイのお店です。お昼は行列になることがあります。"}},{name:"Any street stall or food court",area:"other",note:{en:"Easy to find everywhere, usually the cheapest filling meal after training.",ko:"どこでも簡単に見つかり、練習後にしっかり食べるならいちばんコスパのいいメニューです。"}}],imgQuery:"Khao man gai",imgAlt:"Poached chicken sliced over rice with a bowl of soup and dipping sauce",mapsQuery:"khao man gai Bangkok"},{id:"khao-pad",cat:"classics",name:{en:"Khao Pad",th:"\u0E02\u0E49\u0E32\u0E27\u0E1C\u0E31\u0E14",ko:"カオパット(タイ風チャーハン)"},rom:"khao phat",desc:{en:"Thai fried rice wok-tossed with egg, onion, tomato and scallion, seasoned with soy, oyster and fish sauce. Served with cucumber, a lime wedge and chilies in fish sauce (prik nam pla).",ko:"卵、玉ねぎ、トマト、ネギを入れ、醤油、オイスターソース、ナンプラーで強火で炒めたタイのチャーハンです。きゅうり、くし切りライム、唐辛子ナンプラー(プリック・ナンプラー)が付きます。"},ingredients:{en:["jasmine rice","egg","onion","tomato","scallion","soy sauce","oyster sauce","fish sauce","pork, chicken, shrimp or crab"],ko:["ジャスミンライス","卵","玉ねぎ","トマト","小ねぎ","しょうゆ","オイスターソース","ナンプラー","豚肉・鶏肉・エビ・カニ"]},spice:1,price:[50,100],allergens:["egg","soy","fish","shellfish"],pork:"optional",seafood:"optional",veg:"option",tags:["street","local-fav","late-night","beginner","kr-familiar"],beginner:{en:'The mildest "real Thai" plate you can order. Squeeze the lime and spoon on the chilies in fish sauce only if you want salt and heat. Popular proteins are pork (moo), chicken (gai), shrimp (goong) and crab (pu).',ko:"いちばんマイルドな本場のタイ料理のひとつです。ライムを搾って唐辛子ナンプラーをかけると、塩気と辛さが増します。豚肉(ムー)、鶏肉(ガイ)、エビ(グン)、カニ(プー)が人気の具です。日本のチャーハンのようにご飯がパラパラしています。"},order:{en:'Say khao pad plus the protein. Add "mai sai phrik" if you want it with no chili.',ko:"カオパット+具材を伝えてください。唐辛子を抜くなら「マイ・サイ・プリック」を付けてください。",th:"\u0E02\u0E2D\u0E02\u0E49\u0E32\u0E27\u0E1C\u0E31\u0E14\u0E44\u0E01\u0E48 \u0E44\u0E21\u0E48\u0E43\u0E2A\u0E48\u0E1E\u0E23\u0E34\u0E01{P}",rom:"khor khao phat gai mai sai phrik {P}"},fact:{en:'Thais eat fried rice with a fork and spoon, and the cucumber slices on the side are meant to cool each bite. A retro favorite is "khao pad americana", with fried chicken, sausage and a fried egg.',ko:"タイではチャーハンをフォークとスプーンで食べ、添えられたきゅうりは口をさっぱりさせるためのものです。レトロな人気メニューに、フライドチキン、ソーセージ、目玉焼きをのせた「カオパット・アメリカーナ」もあります。"},where:[{name:"Any street stall or shophouse restaurant",area:"other",note:{en:"Standard everywhere; late-night Chinese-Thai places serve it with a crab option.",ko:"どこでもある定番メニューです。夜遅くまで営業しているタイ風中華のお店では、カニ入りのチャーハンもあります。"}}],imgQuery:"Khao pad Thai fried rice",imgAlt:"Thai fried rice with a cucumber slice and lime wedge",mapsQuery:"khao pad fried rice Bangkok"},{id:"pad-see-ew",cat:"classics",name:{en:"Pad See Ew",th:"\u0E1C\u0E31\u0E14\u0E0B\u0E35\u0E2D\u0E34\u0E4A\u0E27",ko:"パッシーユ(醤油炒め麺)"},rom:"phat see-iew",desc:{en:"Wide, flat rice noodles stir-fried in sweet dark soy and light soy sauce with egg and Chinese broccoli (kana), with a smoky char from the wok. Savory-sweet and not spicy.",ko:"幅広の米麺を甘い濃口醤油と薄口醤油、卵、中国ブロッコリー(カナー)と強火で炒め、香ばしい焦げ目をつけます。しょっぱ甘くて辛くありません。"},ingredients:{en:["wide rice noodles (sen yai)","dark soy sauce","light soy sauce","oyster sauce","egg","Chinese broccoli (kana)","garlic","pork, chicken or shrimp"],ko:["幅広の米麺（センヤイ）","濃口しょうゆ","普通のしょうゆ","オイスターソース","卵","カイラン（中国ブロッコリー）","にんにく","豚肉・鶏肉・エビ"]},spice:0,price:[50,100],allergens:["egg","soy","shellfish"],pork:"optional",seafood:"optional",veg:"option",tags:["street","local-fav","beginner","kr-familiar","sweet","post-practice"],beginner:{en:"No chili inside at all; seasoning is up to you with the caddy (sugar, fish sauce, chili vinegar, chili flakes). The slightly sweet soy flavor reminds many Japanese visitors of yakisoba or harusame salad. Pork (moo) is the most common protein.",ko:"中に唐辛子はまったく入っておらず、味はテーブルの調味料(砂糖、ナンプラー、唐辛子酢、唐辛子粉)で自分で整えます。ほんのり甘い醤油味が焼きそばや春雨サラダを思わせるので、日本人にも好まれます。豚肉(ムー)がいちばん一般的な具です。"},order:{en:'Say pad see ew plus the meat. Add "mai sai kai" if you do not want the egg.',ko:"パッシーユ+肉を伝えてください。卵を抜くなら「マイ・サイ・カイ」を付けてください。",th:"\u0E02\u0E2D\u0E1C\u0E31\u0E14\u0E0B\u0E35\u0E2D\u0E34\u0E4A\u0E27\u0E2B\u0E21\u0E39{P}",rom:"khor phat see-iew moo {P}"},fact:{en:'The name just means "stir-fried soy sauce"; "see-iew" comes from the Chinese word for soy sauce, a sign of its Thai-Chinese roots.',ko:"名前は「醤油炒め」という意味です。「シーイウ」は中国語の醤油に由来する言葉で、タイ系中国人の食文化から来ていることを示しています。"},where:[{name:"Any street stall or Chinese-Thai noodle shop",area:"other",note:{en:"Look for a stall with a very hot wok; the char matters. Yaowarat shops are reliable.",ko:"火力の強い中華鍋を使うお店を選びましょう。香ばしさが決め手です。ヤワラートのお店は安心です。"}}],imgQuery:"Pad see ew",imgAlt:"Stir-fried wide rice noodles with Chinese broccoli and egg in dark soy sauce",mapsQuery:"pad see ew restaurant Bangkok"},{id:"pad-kee-mao",cat:"classics",name:{en:"Pad Kee Mao (Drunken Noodles)",th:"\u0E1C\u0E31\u0E14\u0E02\u0E35\u0E49\u0E40\u0E21\u0E32",ko:"パッキーマオ(ドランクン・ヌードル)"},rom:"phat khee mao",desc:{en:"Wide rice noodles stir-fried at ferocious heat with holy basil, garlic, fresh chilies, baby corn and your choice of pork, chicken or seafood. Fiery, herbal and smoky.",ko:"幅広の米麺を強火でホーリーバジル、にんにく、生唐辛子、ベビーコーンと炒め、豚肉・鶏肉・シーフードから具を選びます。香ばしさとハーブの香り、強い辛さが一度に来ます。"},ingredients:{en:["wide rice noodles (sen yai)","holy basil","garlic","bird's-eye chilies","baby corn","green peppercorn or bell pepper","oyster sauce","soy sauce","pork, chicken, or seafood"],ko:["幅広の米麺（センヤイ）","ホーリーバジル","にんにく","プリッキーヌ（小粒唐辛子）","ヤングコーン","青唐辛子またはパプリカ","オイスターソース","しょうゆ","豚肉・鶏肉・シーフード"]},spice:4,price:[60,120],allergens:["soy","shellfish","fish"],pork:"optional",seafood:"optional",veg:"option",tags:["street","late-night","local-fav"],beginner:{en:'Cousin of pad see ew but the dark soy is replaced by chili and basil, so it is much spicier. Ask for "phet nit noi" on a first try. The seafood version (talay) is common at restaurants.',ko:"パッシーユのいとこのような麺ですが、甘い醤油味の代わりに唐辛子とバジルが入るので、ずっと辛いです。最初は「ペット・ニット・ノーイ(少しだけ辛く)」がおすすめです。レストランではシーフード版(タレー)もよくあります。"},order:{en:"Say pad kee mao plus the protein and the spice level.",ko:"パッキーマオ+肉+辛さのレベルを伝えてください。",th:"\u0E02\u0E2D\u0E1C\u0E31\u0E14\u0E02\u0E35\u0E49\u0E40\u0E21\u0E32\u0E2B\u0E21\u0E39 \u0E40\u0E1C\u0E47\u0E14\u0E19\u0E49\u0E2D\u0E22{P}",rom:"khor phat khee mao moo phet noi {P}"},fact:{en:'The name "drunken" is folklore: either it is spicy enough to sober you up, or it is what you cook with whatever is left in the fridge after drinking. It is a classic late-night order.',ko:"「酔っぱらい」という名前は俗説です。酔いが覚めるほど辛いからという説と、お酒を飲んだ後に冷蔵庫に残った材料で作るからという説があります。夜遅くに頼む定番メニューです。"},where:[{name:"Raan Jay Fai",area:"other",note:{en:"Michelin-starred street-food legend on Maha Chai Road known for seafood drunken noodles cooked over charcoal. A splurge with limited seating; check current booking and queue practice before going.",ko:"マハーチャイ通りにあるミシュランの星付き屋台で、炭火で炒めるシーフードのドランクン・ヌードルで有名です。値段は高めで席も少ないので、行く前に予約や待ち方を確認してください。"}},{name:"Any street stall around Yaowarat",area:"yaowarat",note:{en:"Evening wok stalls give a good budget version.",ko:"夜に出る中華鍋の屋台で、コスパのいいバージョンが食べられます。"}}],imgQuery:"Pad kee mao",imgAlt:"Drunken noodles with wide rice noodles, basil and chilies",mapsQuery:"pad kee mao drunken noodles Bangkok"},{id:"khao-kha-moo",cat:"classics",name:{en:"Khao Kha Moo",th:"\u0E02\u0E49\u0E32\u0E27\u0E02\u0E32\u0E2B\u0E21\u0E39",ko:"カオ・カー・ムー(豚足のせご飯)"},rom:"khao kha moo",desc:{en:"Pork trotter slow-braised in a sweet soy and five-spice broth until it falls apart, served over rice with a braised egg, pickled mustard greens and a garlic-chili vinegar sauce.",ko:"豚足を甘い醤油と五香粉のスープでとろとろになるまで煮込み、ご飯の上にのせて、煮卵、高菜漬け、にんにく唐辛子酢ソースを添えます。"},ingredients:{en:["braised pork leg","five-spice soy broth","braised egg","pickled mustard greens","garlic","chili vinegar sauce","rice"],ko:["じっくり煮込んだ豚足","五香粉入りしょうゆ煮汁","煮卵","高菜の漬物（パッカードーン）","にんにく","唐辛子酢ソース","ご飯"]},spice:1,price:[50,100],allergens:["egg","soy"],pork:"yes",seafood:"no",veg:"no",tags:["street","local-fav","post-practice","high-protein","kr-familiar"],beginner:{en:"Rich and gelatinous, a bit like Japanese buta no kakuni but served over rice with a sweet-soy gravy. The pickled greens and the garlic-chili sauce cut through the fat, so use them. The sauce on the side is spicy; the pork itself is not.",ko:"濃厚でぷるぷるとした食感は日本の豚の角煮に少し似ていますが、甘い醤油ダレと一緒にご飯にのせて食べる点が違います。高菜漬けとにんにく唐辛子ソースが脂っこさを抑えてくれるので、ぜひ一緒にどうぞ。ソースは辛いですが、お肉自体は辛くありません。角煮丼のような感覚です。"},order:{en:'Say khao kha moo. You can ask for more skin ("nang") or more lean meat ("nuea").',ko:"カオ・カー・ムーを注文してください。皮(ナン)多めか赤身(ヌア)多めか、好みを伝えることもできます。",th:"\u0E02\u0E2D\u0E02\u0E49\u0E32\u0E27\u0E02\u0E32\u0E2B\u0E21\u0E39 \u0E44\u0E02\u0E48\u0E15\u0E49\u0E21\u0E14\u0E49\u0E27\u0E22{P}",rom:"khor khao kha moo khai tom duay {P}"},fact:{en:'A Thai-Chinese braise: the "pa lo" style stew is the same family of cooking as Chinese lu-wei, simmered in a pot that is sometimes decades old.',ko:"タイ系中国人の煮込み料理です。中国の「滷味(ルーウェイ)」と同じ系統で、数十年使い続けているスープを継ぎ足して使うお店もあります。"},where:[{name:"Any khao kha moo cart around Yaowarat",area:"yaowarat",note:{en:"Chinatown stalls specialize in braised pork; look for the big pot with pork legs on display.",ko:"チャイナタウンの屋台は煮込み豚肉の専門店が多いです。大きな鍋に豚足が並んでいるお店を探しましょう。"}}],imgQuery:"Khao kha moo",imgAlt:"Braised pork leg over rice with a boiled egg and pickled greens",mapsQuery:"khao kha moo Bangkok"},{id:"khao-moo-daeng",cat:"classics",name:{en:"Khao Moo Daeng",th:"\u0E02\u0E49\u0E32\u0E27\u0E2B\u0E21\u0E39\u0E41\u0E14\u0E07",ko:"カオ・ムー・デーン(タイ風チャーシュー丼)"},rom:"khao moo daeng",desc:{en:"Sliced Thai-Chinese red roast pork (char siu style) over rice with sweet brown sauce, often with crispy pork belly, Chinese sausage and cucumber.",ko:"タイ風の中華チャーシュー(赤く焼いた豚肉)を薄切りにしてご飯にのせ、甘い茶色のソースをかけます。カリカリの豚バラ、中華ソーセージ、きゅうりを一緒にのせるお店が多いです。"},ingredients:{en:["red roast pork (moo daeng)","crispy pork belly (moo krob)","Chinese sausage (goon chiang)","sweet brown sauce","cucumber","egg","rice"],ko:["赤い焼き豚（ムーデーン）","カリカリ豚バラ（ムークロープ）","中華ソーセージ（クンチアン）","甘い茶色のソース","きゅうり","卵","ご飯"]},spice:0,price:[50,90],allergens:["soy","egg"],pork:"yes",seafood:"no",veg:"no",tags:["street","local-fav","post-practice","high-protein","beginner","kr-familiar","sweet"],beginner:{en:'Totally non-spicy and sweet, which makes it a safe pick for picky eaters. Order "moo daeng moo krob" to get both roast and crispy pork. The chili vinegar on the table is optional.',ko:"まったく辛くなく甘いので、好き嫌いのある人にも安心です。「ムー・デーン・ムー・クロップ」と頼むと、チャーシューとカリカリ豚バラの両方をのせてくれます。テーブルの唐辛子酢はお好みで。豚丼が好きな人にはよく合います。"},order:{en:'Ask for khao moo daeng; add "moo krob" for crispy pork and "kai tom" for an egg.',ko:"カオ・ムー・デーンと言って、カリカリ豚バラは「ムー・クロップ」、卵は「カイ・トム」を追加してください。",th:"\u0E02\u0E2D\u0E02\u0E49\u0E32\u0E27\u0E2B\u0E21\u0E39\u0E41\u0E14\u0E07\u0E2B\u0E21\u0E39\u0E01\u0E23\u0E2D\u0E1A{P}",rom:"khor khao moo daeng moo krob {P}"},fact:{en:"Shops hang the glossy roast pork in the window. In Bangkok's Chinatown many are family shops that have run for generations.",ko:"お店ごとにつやつやの焼き豚をガラス窓に吊るしています。バンコクのチャイナタウンには、何代も続く家族経営のお店がたくさんあります。"},where:[{name:"Any roast-meat shop around Yaowarat",area:"yaowarat",note:{en:"Look for glossy roast pork and crispy pork hanging in the window.",ko:"ガラス窓につやつやのチャーシューとカリカリ豚バラが吊るされているお店を探しましょう。"}}],imgQuery:"Khao moo daeng",imgAlt:"Red roast pork slices with crispy pork and Chinese sausage over rice",mapsQuery:"khao moo daeng Yaowarat Bangkok"},{id:"khao-soi",cat:"classics",name:{en:"Khao Soi",th:"\u0E02\u0E49\u0E32\u0E27\u0E0B\u0E2D\u0E22",ko:"カオ・ソーイ(北部風カレー麺)"},rom:"khao soi",desc:{en:"Northern Thai curry noodle soup: egg noodles in a rich, mildly spicy coconut-curry broth with chicken or beef, topped with crispy fried noodles and served with pickled mustard greens, shallot and lime.",ko:"タイ北部風のカレー麺です。濃厚でほんのり辛いココナッツカレースープに卵麺と鶏肉か牛肉を入れ、カリカリに揚げた麺をのせます。高菜漬け、エシャロット、ライムが添えられます。"},ingredients:{en:["egg noodles","coconut curry broth","chicken or beef","crispy fried noodles","pickled mustard greens","shallot","lime","chili oil"],ko:["卵麺","ココナッツカレースープ","鶏肉または牛肉","カリカリに揚げた麺","高菜の漬物","エシャロット","ライム","唐辛子油"]},spice:2,price:[70,130],allergens:["gluten","egg","fish","shellfish"],pork:"optional",seafood:"no",veg:"no",tags:["local-fav","beginner","kr-familiar"],beginner:{en:"Creamy, slightly sweet and not too hot, with the crunchy noodles on top for texture. Squeeze lime and add the pickled greens a little at a time. A bit like a curry udon. Curry paste often contains shrimp paste, so it is not strictly vegetarian.",ko:"クリーミーでほんのり甘く、それほど辛くありません。上にのった揚げ麺がカリカリの食感のアクセントです。ライムと高菜漬けは少しずつ入れながら食べましょう。カレーうどんに少し似ています。カレーペーストにはカピ(エビ味噌)が入っていることが多く、厳密にはベジタリアン向けではありません。"},order:{en:"Say khao soi plus chicken (gai) or beef (nuea).",ko:"カオ・ソーイ+鶏肉(ガイ)か牛肉(ヌア)を伝えてください。",th:"\u0E02\u0E2D\u0E02\u0E49\u0E32\u0E27\u0E0B\u0E2D\u0E22\u0E44\u0E01\u0E48{P}",rom:"khor khao soi gai {P}"},fact:{en:"Khao soi comes from Chiang Mai and the north, with Burmese and Yunnan-Muslim influences. Bangkok has many Lanna-style restaurants that serve it.",ko:"カオ・ソーイはチェンマイをはじめとする北部の料理で、ミャンマーや雲南ムスリムの影響を受けています。バンコクにも北部風(ランナー)のお店がたくさんあります。"},where:[{name:"Northern Thai (Lanna) restaurants in Ari and Thonglor",area:"ari",note:{en:"Look for Lanna-style places for the most authentic bowl.",ko:"本場に近い味を食べるなら、ランナー料理のお店がおすすめです。"}}],imgQuery:"Khao soi",imgAlt:"A bowl of khao soi with crispy noodles on top and lime on the side",mapsQuery:"khao soi restaurant Bangkok"},{id:"rad-na",cat:"classics",name:{en:"Rad Na",th:"\u0E23\u0E32\u0E14\u0E2B\u0E19\u0E49\u0E32",ko:"ラートナー(あんかけ焼き麺)"},rom:"rat na",desc:{en:"Wide rice noodles pan-charred until smoky, then covered in a thick savory gravy with Chinese broccoli and pork, chicken or seafood. Silky, glossy and gently salty.",ko:"幅広の米麺をフライパンで焼いて香ばしさを出した後、中国ブロッコリーと豚肉・鶏肉・シーフード入りのとろみのあるあんをかけます。なめらかでつややかで、ほどよい塩気です。"},ingredients:{en:["wide rice noodles (sen yai)","Chinese broccoli","fermented soybean","tapioca-thickened gravy","pork, chicken, or seafood","garlic"],ko:["幅広の米麺（センヤイ）","カイラン（中国ブロッコリー）","発酵豆","でんぷんでとろみをつけたソース","豚肉・鶏肉・シーフード","にんにく"]},spice:0,price:[60,110],allergens:["soy","fish"],pork:"optional",seafood:"optional",veg:"option",tags:["street","local-fav","beginner","kr-familiar","late-night"],beginner:{en:"Rad na means \"pour over the top\". It is mild and comforting; add chili vinegar (prik nam som) for brightness. Reminiscent of Japanese ankake noodles with thick gravy.",ko:"ラートナーは「上からかける」という意味です。やさしくほっとする味で、酸っぱい唐辛子酢(プリック・ナム・ソム)を足すと味がきりっとします。とろみのあるあんが日本のあんかけ焼きそばを思わせます。"},order:{en:"Say rad na plus pork (moo), chicken (gai) or seafood (talay).",ko:"ラートナー+豚肉(ムー)、鶏肉(ガイ)、シーフード(タレー)を伝えてください。",th:"\u0E02\u0E2D\u0E23\u0E32\u0E14\u0E2B\u0E19\u0E49\u0E32\u0E2B\u0E21\u0E39 \u0E40\u0E2A\u0E49\u0E19\u0E43\u0E2B\u0E0D\u0E48{P}",rom:"khor rat na moo sen yai {P}"},fact:{en:"The best versions char the noodles first, so the gravy meets slightly burnt rice noodle edges. It is a Thai-Chinese classic found in Yaowarat shophouses.",ko:"おいしいお店は麺を先に少し焦がすように焼くので、あんが香ばしい麺の縁と合わさります。ヤワラートのタイ系中国人のお店でよく見かける定番です。"},where:[{name:"Any Chinese-Thai shophouse restaurant in Yaowarat",area:"yaowarat",note:{en:"Many evening shophouse kitchens serve it; look for a smoking wok at the front.",ko:"夜に営業しているショップハウスの食堂でよく出しています。店先で煙が上がっている中華鍋が見えるお店を探しましょう。"}}],imgQuery:"Rat na",imgAlt:"Wide rice noodles topped with thick gravy and Chinese broccoli",mapsQuery:"rad na restaurant Bangkok"},{id:"thai-sukiyaki",cat:"classics",name:{en:"Thai Sukiyaki (Suki Nam / Suki Haeng)",th:"\u0E2A\u0E38\u0E01\u0E35\u0E49",ko:"タイスキ(スキー・ナーム / スキー・ヘーン)"},rom:"suki nam / suki haeng",desc:{en:"A Thai-Chinese hot pot: glass noodles, greens, egg and your choice of meat and seafood in a light broth (suki nam) or stir-fried dry (suki haeng), eaten with a tangy red chili-fermented tofu dipping sauce.",ko:"タイ風の中華鍋料理です。春雨、野菜、卵、肉やシーフードをあっさりスープで煮る(スキー・ナーム)か、汁なしで炒めて(スキー・ヘーン)、酸味と辛みのある赤いタレにつけて食べます。"},ingredients:{en:["glass noodles","napa cabbage and morning glory","egg","sliced pork, beef or chicken","shrimp, squid, fish balls","suki dipping sauce (chili, fermented tofu, garlic)"],ko:["春雨","白菜・空芯菜","卵","豚肉・牛肉・鶏肉","エビ・イカ・魚のすり身","スキーソース（唐辛子、発酵豆腐、にんにく）"]},spice:2,price:[100,350],allergens:["egg","soy","fish","shellfish","sesame"],pork:"optional",seafood:"optional",veg:"option",tags:["local-fav","post-practice","high-protein","kr-familiar"],beginner:{en:"Not the Japanese beef sukiyaki. Think of it as a light, clean-tasting nabe or shabu-shabu. The dipping sauce is the point: spoon it over everything. Great for groups because you order the platters to share.",ko:"日本の牛肉のすき焼きとは別物です。あっさりした鍋やしゃぶしゃぶに近い料理です。ポイントは赤いタレなので、食べるたびにたっぷりつけてください。盛り合わせを頼んでシェアしやすく、グループでの食事にぴったりです。"},order:{en:'Choose soup (nam) or dry (haeng), then pick your meat and a platter. Say "mai phet" if you want the sauce mild.',ko:"スープ(ナーム)か炒め(ヘーン)かを選んでから、肉と盛り合わせを選んでください。タレをマイルドにしたいときは「マイ・ペット」と言ってください。",th:"\u0E02\u0E2D\u0E2A\u0E38\u0E01\u0E35\u0E49\u0E19\u0E49\u0E33\u0E2B\u0E21\u0E39{P}",rom:"khor suki nam moo {P}"},fact:{en:"Thai suki is a very popular family and group meal, and chains made it a staple in malls. The sauce recipe is a closely guarded signature at each chain.",ko:"タイのスキーは家族やグループの食事の定番で、チェーン店のおかげでショッピングモールならどこにでもあります。タレのレシピは各チェーンの企業秘密です。"},where:[{name:"Coca Restaurant (Coca Suki)",area:"siam",note:{en:"Long-running Thai suki chain with Siam-area and mall branches; reliable for groups.",ko:"長い歴史のあるタイスキのチェーンで、サイアム周辺やショッピングモールに店舗があります。グループで行くのにおすすめです。"}}],imgQuery:"Thai suki",imgAlt:"Thai suki hot pot with glass noodles, vegetables and a red dipping sauce",mapsQuery:"Coca Suki Bangkok"},{id:"tom-yum-noodles",cat:"classics",name:{en:"Tom Yum Noodles",th:"\u0E01\u0E4B\u0E27\u0E22\u0E40\u0E15\u0E35\u0E4B\u0E22\u0E27\u0E15\u0E49\u0E21\u0E22\u0E33",ko:"トムヤム・クイッティアオ(トムヤム麺)"},rom:"kuay-tiew tom yum",desc:{en:"Rice noodles in a sweet-sour-spicy broth with minced pork, pork or fish balls, sliced pork, lime juice, chili flakes and a handful of crushed peanuts. Bright, tangy and addictive.",ko:"米麺を甘酸っぱくて辛いスープに入れ、豚ひき肉、肉団子・魚のすり身団子、ライム果汁、唐辛子粉、砕いたピーナッツをのせます。爽やかで、クセになる味です。"},ingredients:{en:["rice noodles","minced pork and sliced pork","pork or fish balls","lime juice","chili flakes","crushed peanuts","sugar","fish sauce"],ko:["米麺","豚ひき肉とスライス肉","肉団子・魚団子","ライム果汁","粉唐辛子","砕いたピーナッツ","砂糖","ナンプラー"]},spice:3,price:[50,90],allergens:["peanut","fish"],pork:"yes",seafood:"optional",veg:"no",tags:["street","local-fav","beginner"],beginner:{en:'Different from tom yum goong soup: here the broth is a noodle shop pork broth made sour and spicy at the table. Tell them "mai phet" if you are unsure, then adjust with the caddy.',ko:"トムヤムクンのスープとは別物です。麺屋の豚骨スープを酸っぱく辛く味付けした麺料理です。自信がなければ「マイ・ペット」で頼んで、テーブルの調味料で調整しましょう。"},order:{en:'Say the noodle type, "tom yum", then the meat. Ask for "haeng" for dry.',ko:"麺の種類+「トムヤム」+肉を伝えてください。汁なしは「ヘーン」と言えばOKです。",th:"\u0E02\u0E2D\u0E40\u0E2A\u0E49\u0E19\u0E40\u0E25\u0E47\u0E01\u0E15\u0E49\u0E21\u0E22\u0E33\u0E2B\u0E21\u0E39 \u0E44\u0E21\u0E48\u0E40\u0E1C\u0E47\u0E14{P}",rom:"khor sen lek tom yum moo mai phet {P}"},fact:{en:"Many noodle shops sell this alongside clear soup and boat noodles. The crunchy peanuts on top are a signature touch.",ko:"澄んだスープの麺やボートヌードルと一緒に出している麺屋が多いです。上に散らすピーナッツがトレードマークです。"},where:[{name:"Any noodle shop around Victory Monument",area:"other",note:{en:"The area has dozens of noodle stalls; tom yum noodles are on most menus.",ko:"戦勝記念塔の周辺には麺屋が何十軒もあり、ほとんどのお店のメニューにあります。"}}],imgQuery:"Tom yum noodle",imgAlt:"A bowl of tom yum noodle soup with ground peanuts and coriander",mapsQuery:"tom yum noodles Bangkok"},{id:"yen-ta-fo",cat:"classics",name:{en:"Yen Ta Fo",th:"\u0E40\u0E22\u0E47\u0E19\u0E15\u0E32\u0E42\u0E1F",ko:"イェンターフォー(ピンクヌードル)"},rom:"yen-ta-fo",desc:{en:"The pink noodle soup: rice noodles with fish balls, squid, fried tofu and morning glory in a sweet-sour broth colored by fermented red bean curd. Slightly spicy-tangy and unlike any other bowl.",ko:"ピンク色の麺料理です。米麺に魚のすり身団子、イカ、揚げ豆腐、空心菜を入れ、赤い発酵豆腐で色をつけた甘酸っぱいスープで食べます。ほんのり辛くて酸っぱく、ほかの麺とはまったく違います。"},ingredients:{en:["rice noodles","fermented red bean curd","fish balls","squid","fried tofu","morning glory","fried wonton","lime","chili"],ko:["米麺","赤い発酵豆腐","魚のすり身","イカ","揚げ豆腐","空芯菜","揚げワンタン","ライム","唐辛子"]},spice:1,price:[50,90],allergens:["fish","shellfish","soy","gluten"],pork:"optional",seafood:"yes",veg:"no",tags:["street","local-fav"],beginner:{en:'The pink color is natural and comes from fermented red bean curd, not food dye. The flavor is tangy and a little funky if you are new to fermented tofu. Some shops add pork blood cubes; say "mai ao leuat" to skip.',ko:"ピンク色は赤い発酵豆腐から出る天然の色で、着色料ではありません。発酵豆腐に慣れていないと、風味が少しクセに感じるかもしれません。お店によっては豚の血の塊が入るので、抜くなら「マイ・アオ・ルアット」と言ってください。"},order:{en:'Say yen ta fo and the noodle type. Add "haeng" for the dry style, which comes with a small side of broth.',ko:"イェンターフォー+麺の種類を伝えてください。汁なしスタイルは「ヘーン」を付けると、少量のスープが別に出てきます。",th:"\u0E02\u0E2D\u0E40\u0E22\u0E47\u0E19\u0E15\u0E32\u0E42\u0E1F\u0E40\u0E2A\u0E49\u0E19\u0E40\u0E25\u0E47\u0E01 \u0E44\u0E21\u0E48\u0E43\u0E2A\u0E48\u0E40\u0E25\u0E37\u0E2D\u0E14{P}",rom:"khor yen-ta-fo sen lek mai sai leuat {P}"},fact:{en:"It is a Thai-Chinese noodle that became popular street food. The soup's color is why Thais call it the pink noodle.",ko:"タイ系中国人の麺が屋台料理として定着したものです。スープの色から「ピンクヌードル」とも呼ばれます。"},where:[{name:"Any noodle shop around Victory Monument",area:"other",note:{en:"Easy to find at busy noodle alleys.",ko:"にぎやかな麺屋街で簡単に見つかります。"}}],imgQuery:"Yen ta fo",imgAlt:"A bowl of yen ta fo: pink noodle soup with fish balls, fried tofu and morning glory",mapsQuery:"yen ta fo noodles Bangkok"},{id:"boat-noodles",cat:"classics",name:{en:"Boat Noodles (Kuay Teow Reua)",th:"\u0E01\u0E4B\u0E27\u0E22\u0E40\u0E15\u0E35\u0E4B\u0E22\u0E27\u0E40\u0E23\u0E37\u0E2D",ko:"ボートヌードル(クイッティアオ・ルア)"},rom:"kuay-tiew reua",desc:{en:"A dark, intensely savory pork or beef noodle soup, thickened and enriched with blood, spiced with garlic and served in tiny bowls. Very bold, and since the bowls are tiny, most people eat three to five at a time.",ko:"豚や牛の血を入れてとろみをつけ、濃厚に煮込んだ麺料理です。にんにくとスパイスの風味が強く、小さな器で出てくるので、たいてい3~5杯ずつ食べます。"},ingredients:{en:["rice noodles","dark spiced broth with blood","pork or beef","meatballs","morning glory","bean sprouts","crispy pork rind","fried garlic"],ko:["米麺","豚の血入りの濃厚スパイススープ","豚肉または牛肉","肉団子","空芯菜","もやし","カリカリの豚皮","揚げにんにく"]},spice:3,price:[15,40],allergens:["soy","fish"],pork:"yes",seafood:"no",veg:"no",tags:["street","local-fav"],beginner:{en:"The price is per bowl, and each bowl is only a few spoonfuls. The broth is thick with blood, which tastes deep and slightly earthy; if that worries you, try yen ta fo or tom yum noodles first. Most shops put the crispy pork rind on the table. Even beef versions typically use blood.",ko:"値段は一杯ごとで、一杯は数口分の量です。スープに血が入っていて、深みがありほんのり土っぽい味なので、心配ならまずイェンターフォーやトムヤム麺から試してみてください。たいていのお店はカリカリの豚皮をテーブルに置いています。牛肉版でも普通は血を使います。"},order:{en:'Say how many bowls, the noodle type and the meat. Ask "mai ao leuat" to skip the pig\u2019s blood in the broth.',ko:"何杯か、麺の種類、肉を伝えてください。スープに入れる豚の血を抜くなら「マイ・アオ・ルアット」と言ってください。",th:"\u0E02\u0E2D\u0E01\u0E4B\u0E27\u0E22\u0E40\u0E15\u0E35\u0E4B\u0E22\u0E27\u0E40\u0E23\u0E37\u0E2D\u0E2B\u0E21\u0E39 \u0E40\u0E2A\u0E49\u0E19\u0E40\u0E25\u0E47\u0E01 \u0E2A\u0E32\u0E21\u0E0A\u0E32\u0E21{P}",rom:"khor kuay-tiew reua moo sen lek saam chaam {P}"},fact:{en:"The bowls are tiny because the first vendors sold from boats on Bangkok's canals, where a small bowl was easier to pass across the water and spilled less.",ko:"器が小さいのは、もともとバンコクの運河で舟の上から売っていたからです。水の上で渡しやすく、こぼれにくかったのです。"},where:[{name:"Boat Noodle Alley, Victory Monument",area:"other",note:{en:"Famous alley beside Victory Monument packed with boat noodle shops. Best around lunch and evening.",ko:"戦勝記念塔の隣にボートヌードルのお店が集まる有名な路地です。お昼と夕方がいちばんにぎわいます。"}}],imgQuery:"Boat noodles Thailand",imgAlt:"Several small bowls of Thai boat noodles",mapsQuery:"Boat Noodle Alley Victory Monument Bangkok"},{id:"khao-tom",cat:"classics",name:{en:"Khao Tom",th:"\u0E02\u0E49\u0E32\u0E27\u0E15\u0E49\u0E21",ko:"カオ・トム(タイ風お粥スープ)"},rom:"khao tom",desc:{en:"Rice simmered in a light, clear broth, eaten with a spread of salty, sour and fried side dishes. A late-night classic at Thai-Chinese eateries, plain and soothing.",ko:"澄んだあっさりしたスープでご飯を煮た、雑炊のような料理です。しょっぱいものや酸っぱいもの、揚げ物などのおかずをいろいろ添えて食べます。中華系の夜食屋の定番で、胃にやさしい味です。"},ingredients:{en:["rice in clear broth","pork or fish or shrimp","ginger","fried garlic","egg","preserved radish","side dishes (stir-fried veg, salted egg)"],ko:["透き通ったスープで煮たご飯","豚肉・魚・エビ","しょうが","揚げにんにく","卵","大根の漬物","おかず（野菜炒め、塩漬けアヒル卵など）"]},spice:0,price:[40,150],allergens:["egg","soy","fish"],pork:"optional",seafood:"optional",veg:"option",tags:["late-night","local-fav","beginner","kr-familiar"],beginner:{en:'Unlike jok, the rice grains stay whole and the broth is thin. Share a few dishes ("kap khao") on the side and spoon them into the soup bowl as you go. Prices are for the soup; side dishes are ordered separately.',ko:"ジョークと違ってお米の粒が残っていて、スープがさらさらです。おかず(「ガップ・カーオ」)をいくつか頼んで、スプーンで取りながら食べます。値段はスープの分で、おかずは別注文です。日本のおじやや雑炊のような感覚です。"},order:{en:"Ask for khao tom with the meat or fish you want, then point to side dishes in the display or on the menu.",ko:"カオ・トム+好きな肉や魚を伝えて、おかずはショーケースやメニューを指さして選んでください。",th:"\u0E02\u0E2D\u0E02\u0E49\u0E32\u0E27\u0E15\u0E49\u0E21\u0E1B\u0E25\u0E32{P}",rom:"khor khao tom pla {P}"},fact:{en:"Khao tom restaurants (khao tom kui) are a Bangkok after-midnight tradition where friends order a table of side dishes and eat slowly.",ko:"カオ・トムの食堂(カオ・トム・クイ)はバンコクの深夜の伝統です。友達とおかずをテーブルいっぱいに頼んで、ゆっくり食べます。"},where:[{name:"Late-night khao tom restaurants around Yaowarat",area:"yaowarat",note:{en:"Chinatown has several late-night khao tom shops; look for open-air tables and display counters.",ko:"チャイナタウンには夜遅くまで営業しているカオ・トムのお店がいくつかあります。屋外席とショーケースが目印です。"}}],imgQuery:"Khao tom",imgAlt:"A bowl of Thai rice soup khao tom with side dishes",mapsQuery:"khao tom late night Bangkok"},{id:"jok",cat:"classics",name:{en:"Jok",th:"\u0E42\u0E08\u0E4A\u0E01",ko:"ジョーク(タイ風お粥)"},rom:"jok",desc:{en:"Smooth, thick Thai-Chinese rice porridge with soft pork meatballs, ginger and spring onion, finished with a raw or poached egg and a Chinese fried dough stick for dipping.",ko:"なめらかでとろっとした中華系タイ風のお粥です。やわらかい豚肉団子、しょうが、ネギをのせて、生卵か温泉卵を落とし、中華風揚げパン(パートンコー)をつけて食べます。"},ingredients:{en:["rice porridge","pork meatballs","ginger","spring onion","egg","pepper","Chinese fried dough (pa thong ko)","soy sauce"],ko:["お粥","豚肉団子","しょうが","小ねぎ","卵","こしょう","中華風揚げパン（パートンコー）","しょうゆ"]},spice:0,price:[40,70],allergens:["egg","soy","gluten"],pork:"yes",seafood:"no",veg:"no",tags:["street","beginner","kr-familiar","local-fav","late-night"],beginner:{en:"Very familiar to Japanese visitors: it is basically okayu. The fresh ginger and white pepper give it a clean, warming taste. Breakfast and hangover favorite. Season with a little soy sauce and white pepper at the table.",ko:"日本人にはとてもなじみのある「お粥」です。しょうがと白胡椒がすっきりとした温まる味を出しています。朝食や二日酔いの朝に人気です。テーブルの醤油と胡椒で少し味を足してください。"},order:{en:'Say jok moo and add "kai" for egg. Ask for "pa thong ko" if you want the fried dough to dip.',ko:"ジョーク・ムー(豚のお粥)と言って、卵は「カイ」を追加してください。揚げパンは「パートンコー」と言えばOKです。",th:"\u0E02\u0E2D\u0E42\u0E08\u0E4A\u0E01\u0E2B\u0E21\u0E39\u0E43\u0E2A\u0E48\u0E44\u0E02\u0E48{P}",rom:"khor jok moo sai khai {P}"},fact:{en:"Jok is a classic Thai-Chinese breakfast you can find at shops that open before dawn. Many shops serve it until late morning.",ko:"ジョークは夜明け前から開くタイ系中国人の朝食屋の定番メニューです。午前中遅くまで出しているお店が多いです。"},where:[{name:"Jok Prince",area:"other",note:{en:"Well-known jok shop in the Banglamphu old-town area, a popular breakfast stop.",ko:"バンランプーの旧市街にある有名なジョークのお店で、朝食に人気です。"}}],imgQuery:"Jok Thai congee",imgAlt:"A bowl of Thai rice porridge with pork balls, ginger and egg",mapsQuery:"Jok Prince Bangkok"},{id:"pad-pak-boong",cat:"classics",name:{en:"Pad Pak Boong Fai Daeng",th:"\u0E1C\u0E31\u0E14\u0E1C\u0E31\u0E01\u0E1A\u0E38\u0E49\u0E07\u0E44\u0E1F\u0E41\u0E14\u0E07",ko:"パッ・パクブン・ファイデーン(空心菜炒め)"},rom:"phat phak-boong fai daeng",desc:{en:"Morning glory (water spinach) stir-fried over roaring flames with garlic, chilies and a salty-sweet sauce of fermented soybean and oyster sauce. Crunchy, garlicky and smoky.",ko:"空心菜を強火でにんにく、唐辛子、発酵大豆とオイスターソースですばやく炒めます。シャキシャキでにんにくの香りが強く、香ばしいです。"},ingredients:{en:["morning glory (water spinach)","garlic","bird's-eye chilies","fermented soybean","oyster sauce","fish sauce"],ko:["空芯菜","にんにく","プリッキーヌ（小粒唐辛子）","発酵豆","オイスターソース","ナンプラー"]},spice:2,price:[60,120],allergens:["soy","shellfish","fish"],pork:"no",seafood:"no",veg:"option",tags:["street","local-fav","kr-familiar","late-night"],beginner:{en:"A cheap, fast side vegetable dish that goes with rice. Oyster sauce and fish sauce are standard, so say \"jay\" or \"mai sai nam man hoi\" if you need it vegetarian. Japanese visitors will find the garlicky stir-fried greens a lot like an ohitashi-style side dish, only hotter and more savory.",ko:"ご飯に合う、安くて早い野菜のおかずです。オイスターソースとナンプラーが基本なので、ベジタリアンの場合は「ジェー」または「マイ・サイ・ナムマン・ホーイ(オイスターソース抜き)」と伝えてください。にんにくの香りのする炒め野菜で、おひたしのような副菜の感覚で食べられます。"},order:{en:"Say pad pak boong fai daeng and order rice separately.",ko:"パッ・パクブン・ファイデーンと言って、ご飯は別に注文してください。",th:"\u0E02\u0E2D\u0E1C\u0E31\u0E14\u0E1C\u0E31\u0E01\u0E1A\u0E38\u0E49\u0E07\u0E44\u0E1F\u0E41\u0E14\u0E07 \u0E44\u0E21\u0E48\u0E40\u0E1C\u0E47\u0E14{P}",rom:"khor phat phak-boong fai daeng mai phet {P}"},fact:{en:'Some stalls fling the cooked greens from the wok across the street to a waiter who catches them on a plate. "Fai daeng" means "red fire".',ko:"一部の屋台では、中華鍋で炒めた空心菜を道の向こう側の店員が皿で受け止めるように投げます。「ファイ・デーン」は「赤い火」という意味です。"},where:[{name:"Any street stall or open-air restaurant",area:"other",note:{en:"Common at tam sang (made-to-order) stalls and evening seafood restaurants.",ko:"注文を受けてから作るターム・サン(即席料理)の屋台や、夜のシーフードレストランでよく見かけます。"}}],imgQuery:"Pad pak boong fai daeng",imgAlt:"Stir-fried morning glory with garlic and chilies",mapsQuery:"pad pak boong fai daeng Bangkok"},{id:"gai-pad-med-mamuang",cat:"classics",name:{en:"Gai Pad Med Mamuang",th:"\u0E44\u0E01\u0E48\u0E1C\u0E31\u0E14\u0E40\u0E21\u0E47\u0E14\u
