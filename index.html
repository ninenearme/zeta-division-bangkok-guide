0E21\u0E30\u0E21\u0E48\u0E27\u0E07\u0E2B\u0E34\u0E21\u0E1E\u0E32\u0E19\u0E15\u0E4C",ko:"ガイ・パット・メット・マムアン(カシューナッツ鶏炒め)"},rom:"gai phat met ma-muang him-ma-phan",desc:{en:"Chicken stir-fried with crunchy cashews, dried chilies, onion and scallion in a sweet-savory roasted chili sauce. Mild, nutty and a crowd-pleaser.",ko:"鶏肉をカリカリのカシューナッツ、乾燥唐辛子、玉ねぎ、ネギと甘じょっぱいローストチリソースで炒めます。マイルドで香ばしく、誰でも好きになる味です。"},ingredients:{en:["chicken","cashew nuts","dried chilies","onion","scallion","roasted chili paste (nam prik pao)","oyster sauce","soy sauce"],ko:["鶏肉","カシューナッツ","乾燥唐辛子","玉ねぎ","小ねぎ","ローストチリペースト（ナムプリックパオ）","オイスターソース","しょうゆ"]},spice:1,price:[70,130],allergens:["tree-nut","soy","shellfish","fish"],pork:"no",seafood:"no",veg:"option",tags:["local-fav","beginner","kr-familiar","high-protein","post-practice"],beginner:{en:"The dried chilies are for aroma and are usually left on the plate; the dish is mild. It tastes a lot like Chinese-style stir-fried chicken with cashews. Check cashew allergy before ordering.",ko:"乾燥唐辛子は香りづけ用なので、たいていは皿に残して食べますし、全体的にはマイルドです。日本の中華料理の鶏とカシューナッツ炒めによく似た味です。カシューナッツアレルギーがある場合は、注文前に必ず確認してください。"},order:{en:"Say gai pad med mamuang and order rice with it.",ko:"ガイ・パット・メット・マムアンと言って、ご飯も一緒に注文してください。",th:"\u0E02\u0E2D\u0E44\u0E01\u0E48\u0E1C\u0E31\u0E14\u0E40\u0E21\u0E47\u0E14\u0E21\u0E30\u0E21\u0E48\u0E27\u0E07 \u0E44\u0E21\u0E48\u0E40\u0E1C\u0E47\u0E14{P}",rom:"khor gai phat met ma-muang mai phet {P}"},fact:{en:'Cashew in Thai is "med mamuang himmaphan", literally "Himmaphan mango seed", after the mythical forest Himmaphan.',ko:"タイ語でカシューナッツは「メット・マムアン・ヒマパーン」といい、神話の森「ヒマパーン」にちなんだ名前です。"},where:[{name:"Any restaurant serving central Thai dishes",area:"other",note:{en:"Standard on Thai-Chinese restaurant menus and many mall food courts.",ko:"タイ風中華のレストランや多くのショッピングモールのフードコートで定番メニューです。"}}],imgQuery:"Chicken with cashew nuts Thai",imgAlt:"Chicken stir-fried with cashews and dried chilies",mapsQuery:"gai pad med mamuang Bangkok"},{id:"tom-yum-goong",cat:"soups",name:{en:"Tom Yum Goong",th:"\u0E15\u0E49\u0E21\u0E22\u0E33\u0E01\u0E38\u0E49\u0E07",ko:"トムヤムクン(エビの辛酸っぱいスープ)"},rom:"tom yam goong",desc:{en:"Hot and sour soup with prawns, lemongrass, galangal, kaffir lime leaf, mushrooms, chilies and lime. Comes clear (nam sai) or creamy (nam khon) with a rich orange chili-paste slick.",ko:"エビ、レモングラス、ガランガル、コブミカンの葉、きのこ、唐辛子、ライムを入れた酸っぱ辛いスープです。澄んだスープ(ナーム・サイ)かクリーミーなスープ(ナーム・コン)を選べ、ナーム・コンには赤い油が浮かびます。"},ingredients:{en:["prawns","lemongrass","galangal","kaffir lime leaves","mushrooms","bird's-eye chilies","lime juice","fish sauce","chili paste","evaporated milk (nam khon version)"],ko:["エビ","レモングラス","ガランガル","こぶみかんの葉","きのこ","プリッキーヌ（小粒唐辛子）","ライム果汁","ナンプラー","チリペースト","無糖練乳（ナムコン版）"]},spice:4,price:[150,400],allergens:["shellfish","fish","dairy"],pork:"no",seafood:"yes",veg:"no",tags:["local-fav","kr-familiar","high-protein","post-practice"],beginner:{en:"Do not eat the lemongrass, galangal or lime leaves; they flavor the broth. Nam sai is lighter and sharper, nam khon is rounder and a little sweeter. Spoon it over rice. Japanese visitors often enjoy it like a spicy-sour seafood nabe.",ko:"レモングラス、ガランガル、コブミカンの葉は香りづけの材料なので食べません。ナーム・サイは軽くて酸味がはっきりしていて、ナーム・コンはまろやかでほんのり甘いです。ご飯にかけて食べてもおいしいです。日本人には酸っぱ辛いシーフード鍋のように楽しまれています。"},order:{en:"Say tom yum goong plus clear (nam sai) or creamy (nam khon). You usually order a small or large pot to share.",ko:"トムヤムクン+澄んだ(ナーム・サイ)かクリーミー(ナーム・コン)かを伝えてください。たいていは小鍋か大鍋でシェアします。",th:"\u0E02\u0E2D\u0E15\u0E49\u0E21\u0E22\u0E33\u0E01\u0E38\u0E49\u0E07\u0E19\u0E49\u0E33\u0E02\u0E49\u0E19 \u0E44\u0E21\u0E48\u0E40\u0E1C\u0E47\u0E14\u0E21\u0E32\u0E01{P}",rom:"khor tom yam goong nam khon mai phet maak {P}"},fact:{en:'The soup became a global Thai icon. The "nam khon" creamy style is more common in restaurants than at street stalls.',ko:"トムヤムクンはタイを代表する世界的なアイコンになりました。クリーミーな「ナーム・コン」スタイルは、屋台よりレストランのほうが一般的です。"},where:[{name:"Any Thai or seafood restaurant",area:"other",note:{en:"Standard everywhere; seafood restaurants along Yaowarat do big pots with river prawns.",ko:"どこでも定番のメニューです。ヤワラートのシーフードレストランでは、川エビ入りの大きな鍋も出しています。"}}],imgQuery:"Tom yum goong",imgAlt:"A bowl of tom yum goong with prawns, mushrooms and herbs",mapsQuery:"tom yum goong restaurant Bangkok"},{id:"tom-kha-gai",cat:"soups",name:{en:"Tom Kha Gai",th:"\u0E15\u0E49\u0E21\u0E02\u0E48\u0E32\u0E44\u0E01\u0E48",ko:"トムカーガイ(ココナッツ鶏スープ)"},rom:"tom khaa gai",desc:{en:"Chicken simmered in coconut milk with galangal, lemongrass, kaffir lime leaves and mushrooms. Creamy, fragrant and only gently sour, the mild cousin of tom yum.",ko:"鶏肉をココナッツミルクでガランガル、レモングラス、コブミカンの葉、きのこと一緒に煮込んだスープです。クリーミーで香りがよく、酸味は控えめで、トムヤムのマイルドないとこのような存在です。"},ingredients:{en:["chicken","coconut milk","galangal","lemongrass","kaffir lime leaves","mushrooms","lime juice","fish sauce","chili"],ko:["鶏肉","ココナッツミルク","ガランガル","レモングラス","こぶみかんの葉","きのこ","ライム果汁","ナンプラー","唐辛子"]},spice:2,price:[100,250],allergens:["fish"],pork:"no",seafood:"no",veg:"option",tags:["local-fav","beginner","high-protein"],beginner:{en:'"Kha" is galangal, a woody root related to ginger; do not eat the big slices. Soothing and milder than tom yum. A vegetarian version with mushrooms or tofu exists but fish sauce is standard, so ask for it without.',ko:"「カー」はしょうがの仲間のガランガルです。大きな切れ端は食べないでください。トムヤムよりマイルドで、ほっとする味です。きのこや豆腐のベジタリアン版もありますが、ナンプラーが基本なので抜いてもらうよう頼む必要があります。"},order:{en:"Say tom kha gai. A small bowl is one serving; a pot (mor fai) is for sharing.",ko:"トムカーガイを注文してください。小さい器は1人前で、鍋(モー・ファイ)はみんなでシェアする量です。",th:"\u0E02\u0E2D\u0E15\u0E49\u0E21\u0E02\u0E48\u0E32\u0E44\u0E01\u0E48\u0E16\u0E49\u0E27\u0E22\u0E40\u0E25\u0E47\u0E01{P}",rom:"khor tom khaa gai thuay lek {P}"},fact:{en:"Despite the similar name to tom yum, the key flavor is the sweet creaminess of coconut with galangal, not heat.",ko:"トムヤムと名前は似ていますが、ポイントは辛さではなく、ココナッツのやさしい甘さとガランガルの香りです。"},where:[{name:"Any Thai restaurant",area:"other",note:{en:"On nearly every restaurant menu, sold per bowl or per pot.",ko:"ほとんどのレストランのメニューにあり、器または鍋単位で売っています。"}}],imgQuery:"Tom kha gai",imgAlt:"A bowl of tom kha gai coconut soup with chicken and mushrooms",mapsQuery:"tom kha gai restaurant Bangkok"},{id:"green-curry",cat:"soups",name:{en:"Green Curry",th:"\u0E41\u0E01\u0E07\u0E40\u0E02\u0E35\u0E22\u0E27\u0E2B\u0E27\u0E32\u0E19",ko:"グリーンカレー(ゲーン・キアオ・ワーン)"},rom:"kaeng khiao wan",desc:{en:"Chicken, beef or pork in coconut milk with fresh green chili paste, Thai eggplants and Thai basil. Fragrant, creamy, mildly sweet and noticeably hot.",ko:"鶏肉・牛肉・豚肉をココナッツミルクで、青唐辛子ペースト、タイなす、タイバジルと一緒に煮ます。香りがよくクリーミーでほんのり甘いですが、かなり辛いです。"},ingredients:{en:["green curry paste","coconut milk","chicken, beef or pork","Thai eggplants","Thai basil","kaffir lime leaves","fish sauce","palm sugar"],ko:["グリーンカレーペースト","ココナッツミルク","鶏肉・牛肉・豚肉","タイナス","タイバジル","こぶみかんの葉","ナンプラー","ヤシ砂糖"]},spice:3,price:[80,200],allergens:["shellfish","fish"],pork:"optional",seafood:"optional",veg:"option",tags:["local-fav","kr-familiar"],beginner:{en:'"Wan" means sweet, referring to its gentle sweetness against the heat. It is eaten as a soupy curry with rice, not as a soup on its own. Curry paste contains shrimp paste, so a vegetarian version needs a special request.',ko:"「ワーン」は甘いという意味で、辛さの中にほんのり甘みがあることを表しています。スープ状のカレーをご飯にかけて食べ、単独のスープとしては食べません。カレーペーストにカピ(エビ味噌)が入っているので、ベジタリアン版は別にお願いする必要があります。カレー好きなら入門にぴったりです。"},order:{en:"Say green curry plus chicken (gai) and ask for rice.",ko:"グリーンカレー+鶏肉(ガイ)と言って、ご飯も一緒に注文してください。",th:"\u0E02\u0E2D\u0E41\u0E01\u0E07\u0E40\u0E02\u0E35\u0E22\u0E27\u0E2B\u0E27\u0E32\u0E19\u0E44\u0E01\u0E48 \u0E44\u0E21\u0E48\u0E40\u0E1C\u0E47\u0E14\u0E21\u0E32\u0E01 \u0E01\u0E31\u0E1A\u0E02\u0E49\u0E32\u0E27\u0E2A\u0E27\u0E22{P}",rom:"khor kaeng khiao wan gai mai phet maak gap khao suay {P}"},fact:{en:"Green curry is usually the spiciest of Thailand's coconut curries, because the paste uses lots of fresh green chilies.",ko:"グリーンカレーは新鮮な青唐辛子をたくさん使うので、タイのココナッツカレーの中でもいちばん辛いほうです。"},where:[{name:"Any rice-and-curry shop (raan khao gaeng)",area:"other",note:{en:"Point to the pots, choose a curry and get it over rice. Quick and cheap.",ko:"ご飯とおかずのお店(カオ・ゲーン)で鍋を指さしてカレーを選び、ご飯の上にのせてもらいます。早くて安いです。"}}],imgQuery:"Thai green curry",imgAlt:"A bowl of Thai green curry with chicken and eggplants",mapsQuery:"green curry restaurant Bangkok"},{id:"panang-curry",cat:"soups",name:{en:"Panang Curry",th:"\u0E1E\u0E30\u0E41\u0E19\u0E07",ko:"パネーンカレー"},rom:"pha-naeng",desc:{en:"A thick, rich, less soupy curry of red chili paste, ground peanuts and coconut cream, topped with shredded kaffir lime leaf. Sweet-savory and gently spicy.",ko:"赤唐辛子ペースト、すりつぶしたピーナッツ、ココナッツクリームで作る、とろみのある濃厚なカレーです。千切りにしたコブミカンの葉をのせます。甘じょっぱくて、ほんのり辛いです。"},ingredients:{en:["panang curry paste","coconut cream","ground peanuts","pork, beef or chicken","kaffir lime leaf","palm sugar","fish sauce"],ko:["パネンカレーペースト","ココナッツクリーム","挽いたピーナッツ","豚肉・牛肉・鶏肉","こぶみかんの葉","ヤシ砂糖","ナンプラー"]},spice:2,price:[90,220],allergens:["peanut","shellfish","fish"],pork:"optional",seafood:"no",veg:"option",tags:["local-fav","beginner","kr-familiar"],beginner:{en:"Thicker and richer than green curry with nutty depth and little liquid; good over rice. Peanuts are in the sauce, so tell them if you have an allergy. Beef (nuea) and pork (moo) are the classic proteins.",ko:"グリーンカレーよりとろみがあって濃厚で、ピーナッツの香ばしさがあります。汁気が少ないので、ご飯にかけて食べるのにぴったりです。ソースにピーナッツが入っているので、アレルギーがある場合は必ず伝えてください。牛肉(ヌア)と豚肉(ムー)が定番です。"},order:{en:"Say panang plus the meat and order rice.",ko:"パネーン+肉を伝えて、ご飯を注文してください。",th:"\u0E02\u0E2D\u0E1E\u0E30\u0E41\u0E19\u0E07\u0E40\u0E19\u0E37\u0E49\u0E2D \u0E01\u0E31\u0E1A\u0E02\u0E49\u0E32\u0E27\u0E2A\u0E27\u0E22{P}",rom:"khor pha-naeng nuea gap khao suay {P}"},fact:{en:"Its name is often linked to Penang in Malaysia, but its exact origin is debated.",ko:"名前はマレーシアのペナンに由来するという説がありますが、正確な起源は議論が分かれています。"},where:[{name:"Any Thai restaurant",area:"other",note:{en:"Found on most mid-range Thai menus; ask the staff to lower the spice if needed.",ko:"ほとんどの中級のタイ料理店のメニューにあり、辛さはスタッフに調整をお願いできます。"}}],imgQuery:"Phanaeng curry",imgAlt:"Thick red panang curry with beef and kaffir lime strips",mapsQuery:"panang curry restaurant Bangkok"},{id:"massaman-curry",cat:"soups",name:{en:"Massaman Curry",th:"\u0E41\u0E01\u0E07\u0E21\u0E31\u0E2A\u0E21\u0E31\u0E48\u0E19",ko:"マッサマンカレー"},rom:"kaeng mat-sa-man",desc:{en:"A mild, sweet, aromatic curry of beef or chicken with potatoes, onions and peanuts, spiced with cinnamon, cardamom and cumin. Rich, tender and not very hot.",ko:"牛肉か鶏肉をじゃがいも、玉ねぎ、ピーナッツと一緒に、シナモン、カルダモン、クミンのスパイスで煮込んだ、マイルドで甘い香り高いカレーです。濃厚でやわらかく、あまり辛くありません。"},ingredients:{en:["beef or chicken","potatoes","onions","peanuts","coconut milk","massaman curry paste","cinnamon","cardamom","tamarind","palm sugar"],ko:["牛肉または鶏肉","じゃがいも","玉ねぎ","ピーナッツ","ココナッツミルク","マッサマンカレーペースト","シナモン","カルダモン","タマリンド","ヤシ砂糖"]},spice:1,price:[100,250],allergens:["peanut","shellfish","fish"],pork:"no",seafood:"no",veg:"no",tags:["beginner","kr-familiar","high-protein"],beginner:{en:"The mildest Thai curry and a good first pick for kids and picky eaters. The potato and warm spices feel like a Japanese curry with more fragrance. Traditionally made without pork.",ko:"タイのカレーの中でいちばんマイルドなので、入門にぴったりです。じゃがいもと温かみのあるスパイスのおかげで、香りがより豊かな日本のカレーライスに似ています。伝統的には豚肉は使いません。"},order:{en:"Say massaman plus beef (nuea) or chicken (gai) and rice.",ko:"マッサマン+牛肉(ヌア)か鶏肉(ガイ)を伝えて、ご飯を注文してください。",th:"\u0E02\u0E2D\u0E21\u0E31\u0E2A\u0E21\u0E31\u0E48\u0E19\u0E40\u0E19\u0E37\u0E49\u0E2D \u0E01\u0E31\u0E1A\u0E02\u0E49\u0E32\u0E27\u0E2A\u0E27\u0E22{P}",rom:"khor mat-sa-man nuea gap khao suay {P}"},fact:{en:"Its roots are Persian and Indian-Muslim trade influences in southern and central Thailand. It was ranked first in a 2011 CNN reader poll of the world's tastiest foods.",ko:"ペルシャとインド系ムスリムの交易の影響を受けた、南部・中部の料理です。2011年のCNN読者投票で、世界でいちばんおいしい料理の1位に選ばれました。"},where:[{name:"Any Thai restaurant",area:"other",note:{en:"On most tourist-friendly and mid-range menus; also at halal-friendly Muslim shops.",ko:"観光客向けの中級レストランのメニューにはたいていあり、ムスリムのお店でも味わえます。"}}],imgQuery:"Massaman curry",imgAlt:"A bowl of massaman curry with beef, potatoes and peanuts",mapsQuery:"massaman curry restaurant Bangkok"},{id:"yellow-curry",cat:"soups",name:{en:"Yellow Curry",th:"\u0E41\u0E01\u0E07\u0E01\u0E30\u0E2B\u0E23\u0E35\u0E48",ko:"イエローカレー(ゲーン・カリー)"},rom:"kaeng ka-ree",desc:{en:"A mild, golden coconut curry colored with turmeric and curry powder, usually with chicken, potato and onion, a little sweet and the closest Thai curry to Japanese or Korean curry.",ko:"ターメリックとカレー粉で黄色く仕上げた、マイルドなココナッツカレーです。たいてい鶏肉、じゃがいも、玉ねぎが入っていて、ほんのり甘く、日本のカレーライスにいちばん近いタイのカレーです。"},ingredients:{en:["yellow curry paste or curry powder","coconut milk","chicken","potato","onion","turmeric","fish sauce"],ko:["イエローカレーペーストまたはカレー粉","ココナッツミルク","鶏肉","じゃがいも","玉ねぎ","ターメリック","ナンプラー"]},spice:1,price:[80,200],allergens:["shellfish","fish"],pork:"no",seafood:"optional",veg:"option",tags:["beginner","kr-familiar","local-fav"],beginner:{en:'Not to be confused with southern "kaeng leuang", a very different, sour-spicy turmeric fish curry. This one is mild and kid-friendly. Crab or shrimp versions (pu / goong pad pong karee) are a separate stir-fry dish.',ko:"南部の「ゲーン・ルアン」とは別物で、あちらは酸っぱ辛いターメリックの魚のスープです。このカレーはマイルドで子どもでも食べやすいです。カニやエビ版(プー/グン・パット・ポン・カリー)は別の炒め料理です。"},order:{en:"Say yellow curry (kaeng kari) with chicken and rice. You can also eat it with roti.",ko:"イエローカレー(ゲーン・カリー)を鶏肉で注文して、ご飯も一緒に頼んでください。ロティと食べることもできます。",th:"\u0E02\u0E2D\u0E41\u0E01\u0E07\u0E01\u0E30\u0E2B\u0E23\u0E35\u0E48\u0E44\u0E01\u0E48 \u0E01\u0E31\u0E1A\u0E02\u0E49\u0E32\u0E27\u0E2A\u0E27\u0E22{P}",rom:"khor kaeng ka-ree gai gap khao suay {P}"},fact:{en:"Thai kari reflects the old Indian spice trade, using curry powder rather than the fresh herb paste of green curry.",ko:"タイのカリーはインドのスパイス交易の影響で、グリーンカレーのような生ハーブのペーストではなくカレー粉を使います。"},where:[{name:"Any rice-and-curry shop or food court",area:"other",note:{en:"Common at khao gaeng shops and mall food courts.",ko:"カオ・ゲーン(ご飯とおかず)のお店やショッピングモールのフードコートによくあります。"}}],imgQuery:"Thai yellow curry",imgAlt:"A bowl of Thai yellow curry with chicken and potatoes",mapsQuery:"yellow curry restaurant Bangkok"},{id:"gaeng-som",cat:"soups",name:{en:"Gaeng Som",th:"\u0E41\u0E01\u0E07\u0E2A\u0E49\u0E21",ko:"ゲーン・ソム(オレンジ色の酸っぱいカレー)"},rom:"kaeng som",desc:{en:"A thin, orange, sour-spicy curry soup without coconut milk, made with tamarind and chili paste and loaded with vegetables and fish or shrimp. Bright, tangy and sharp.",ko:"ココナッツミルクを使わず、タマリンドとチリペーストで煮込んだ、さらっとしたオレンジ色の酸っぱ辛いカレースープです。野菜と魚またはエビがたっぷり入っていて、爽やかでピリッとした味です。"},ingredients:{en:["tamarind","chili paste","fish or shrimp","cauliflower","cabbage","morning glory","daikon","egg omelet (cha-om)","palm sugar","fish sauce"],ko:["タマリンド","チリペースト","魚またはエビ","カリフラワー","キャベツ","空芯菜","大根","チャオム入りオムレツ","ヤシ砂糖","ナンプラー"]},spice:4,price:[80,180],allergens:["fish","shellfish"],pork:"no",seafood:"yes",veg:"no",tags:["street","local-fav","high-protein"],beginner:{en:"Sour is the main flavor, with strong heat. It is eaten over rice with other dishes, not alone. Good if you like a spicy seafood nabe, though it is much more sour.",ko:"酸味が中心で、辛さも強いです。たいてい他のおかずと一緒にご飯にかけて食べます。辛いシーフード鍋が好きなら気に入るはずですが、ずっと酸っぱいです。"},order:{en:"Point at the pot in a rice-and-curry shop or ask for gaeng som with fish (pla) or shrimp (goong).",ko:"ご飯とおかずのお店では鍋を指さすか、ゲーン・ソム+魚(プラー)またはエビ(グン)と伝えてください。",th:"\u0E02\u0E2D\u0E41\u0E01\u0E07\u0E2A\u0E49\u0E21\u0E01\u0E38\u0E49\u0E07 \u0E40\u0E1C\u0E47\u0E14\u0E19\u0E49\u0E2D\u0E22{P}",rom:"khor kaeng som goong phet noi {P}"},fact:{en:"The sourness comes from tamarind, not vinegar or lime, and it is common to see it with cha-om omelet (acacia-leaf omelet) at Thai home-style shops.",ko:"酸味は酢やライムではなくタマリンドから来ています。タイの家庭料理のお店では、チャオム(アカシアの葉)オムレツを添えた組み合わせをよく見かけます。"},where:[{name:"Any rice-and-curry shop (raan khao gaeng)",area:"other",note:{en:"Common at lunchtime; it often runs out later in the day.",ko:"お昼によくあり、午後遅くには売り切れていることが多いです。"}}],imgQuery:"Gaeng som",imgAlt:"A bowl of orange sour curry soup with fish and vegetables",mapsQuery:"gaeng som restaurant Bangkok"},{id:"som-tum",cat:"spicy",name:{en:"Som Tum",th:"\u0E2A\u0E49\u0E21\u0E15\u0E33",ko:"ソムタム(青パパイヤのサラダ)"},rom:"som tam",desc:{en:"Shredded green papaya pounded in a mortar with chilies, garlic, lime, palm sugar and fish sauce, plus tomato, long beans and peanuts. Crunchy, sour, sweet and spicy all at once.",ko:"千切りにした青パパイヤを、唐辛子、にんにく、ライム、ヤシ砂糖、ナンプラーと一緒に臼で突き、トマト、ささげ、ピーナッツを加えます。シャキシャキで酸っぱくて甘くて辛い味が一度に来ます。"},ingredients:{en:["green papaya","bird's-eye chilies","garlic","lime","palm sugar","fish sauce","tomato","long beans","peanuts","dried shrimp"],ko:["青パパイヤ","プリッキーヌ（小粒唐辛子）","にんにく","ライム","ヤシ砂糖","ナンプラー","トマト","長いんげん","ピーナッツ","干しエビ"]},spice:4,price:[40,80],allergens:["peanut","shellfish","fish"],pork:"no",seafood:"optional",veg:"option",tags:["street","local-fav","kr-familiar","post-practice"],beginner:{en:"Thai-style (som tum thai) is sweeter; the funky Isan version (som tum pla ra) uses fermented fish. Spice is set per order, so say \"phet nit noi\" or \"mai phet\". Dried shrimp and fish sauce are standard, so ask for a vegetarian version. Japanese visitors may find it close to a spicy-sour aemono or tsukemono in spirit.",ko:"タイ中部風(ソムタム・タイ)は甘めで、イサーン風(ソムタム・プラーラー)は発酵魚のクセのある香りがあります。辛さは注文時に決めるので「ペット・ニット・ノーイ」か「マイ・ペット」と言ってください。干しエビとナンプラーが基本なので、ベジタリアン向けは別にお願いしてください。日本の漬物や、酸っぱ辛い和え物のような感覚で食べられます。"},order:{en:'Say som tum thai, the spice level, and "mai sai tua" if no peanuts. Eat with sticky rice (khao niao).',ko:"ソムタム・タイ+辛さ、ピーナッツ抜きなら「マイ・サイ・トゥア」と伝えてください。もち米(カオ・ニアオ)と一緒に食べましょう。",th:"\u0E02\u0E2D\u0E2A\u0E49\u0E21\u0E15\u0E33\u0E44\u0E17\u0E22 \u0E44\u0E21\u0E48\u0E40\u0E1C\u0E47\u0E14 \u0E44\u0E21\u0E48\u0E43\u0E2A\u0E48\u0E16\u0E31\u0E48\u0E27{P}",rom:"khor som tam thai mai phet mai sai thua {P}"},fact:{en:'Som tum came from Laos and the northeast (Isan) and became a Bangkok staple. The "tok tok" sound of the pestle is a street soundtrack.',ko:"ソムタムはラオスとイサーン(北東部)から来て、バンコクの定番料理になりました。臼で突く「トクトク」という音が、通りのBGMです。"},where:[{name:"Somtum Der",area:"other",note:{en:"Well-known Isan restaurant near Saladaeng on Convent Road with a long som tum menu.",ko:"サラデーン近くのコンベント通りにある有名なイサーン料理店で、ソムタムのメニューが豊富です。"}},{name:"Somtum Nua",area:"siam",note:{en:"Popular som tum restaurant in the Siam Square area.",ko:"サイアム・スクエア周辺の人気ソムタム店です。"}},{name:"Any Isan street stall",area:"other",note:{en:"Look for a woman pounding in a clay mortar.",ko:"素焼きの臼で突いている屋台を探しましょう。"}}],imgQuery:"Som tam Thai papaya salad",imgAlt:"Green papaya salad with tomatoes, long beans and peanuts",mapsQuery:"som tum Bangkok"},{id:"larb-moo",cat:"spicy",name:{en:"Larb Moo",th:"\u0E25\u0E32\u0E1A\u0E2B\u0E21\u0E39",ko:"ラープ・ムー(豚ひき肉のサラダ)"},rom:"laap moo",desc:{en:"Minced pork tossed with lime, fish sauce, toasted rice powder, chili flakes, shallots and fresh herbs like mint and spring onion. Sour, salty, nutty and herbal, eaten with sticky rice and raw vegetables.",ko:"豚ひき肉をライム、ナンプラー、炒った米粉、唐辛子粉、エシャロット、ミントやネギなどのハーブで和えます。酸っぱくてしょっぱく、香ばしくハーブの香りがします。もち米と生野菜を添えて食べます。"},ingredients:{en:["minced pork","lime juice","fish sauce","toasted ground sticky rice (khao khua)","chili flakes","shallots","mint","spring onion","cilantro"],ko:["豚ひき肉","ライム果汁","ナンプラー","炒ったもち米粉（カーオクア）","粉唐辛子","エシャロット","ミント","小ねぎ","パクチー"]},spice:4,price:[60,120],allergens:["fish"],pork:"yes",seafood:"no",veg:"no",tags:["local-fav","high-protein","post-practice"],beginner:{en:'Cooked and served lukewarm, not raw. Wrap it in lettuce or cabbage leaves and eat with sticky rice. Ask for "larb mai phet" for a mild batch. Raw versions ("larb dib") exist in the northeast; avoid them unless you know what you are ordering.',ko:"火を通して、ぬるい状態で出てきます。生肉ではありません。レタスやキャベツで包んで、もち米と一緒に食べます。辛さを控えるには「ラープ・マイ・ペット」と言ってください。イサーンには生肉バージョン(「ラープ・ディップ」)もあるので、よく分からないまま頼まないでください。野菜で包んで食べるのに慣れている日本人にも食べやすいです。"},order:{en:"Say larb moo and add sticky rice (khao niao).",ko:"ラープ・ムー+もち米(カオ・ニアオ)を注文してください。",th:"\u0E02\u0E2D\u0E25\u0E32\u0E1A\u0E2B\u0E21\u0E39 \u0E40\u0E1C\u0E47\u0E14\u0E19\u0E49\u0E2D\u0E22 \u0E01\u0E31\u0E1A\u0E02\u0E49\u0E32\u0E27\u0E40\u0E2B\u0E19\u0E35\u0E22\u0E27{P}",rom:"khor laap moo phet noi gap khao niao {P}"},fact:{en:"Larb is a Lao and Isan classic; the toasted rice powder gives the signature nutty crunch.",ko:"ラープはラオスとイサーンの代表的な料理です。炒った米粉が香ばしい食感を出しています。"},where:[{name:"Any Isan (northeastern) restaurant or street stall",area:"other",note:{en:'Look for signs saying "aahaan Isan" with grilled meats and som tum.',ko:"焼き肉とソムタムを出す「イサーン料理」の看板のお店を探しましょう。"}}],imgQuery:"Larb moo",imgAlt:"Minced pork salad larb with herbs and toasted rice powder",mapsQuery:"larb moo Isan restaurant Bangkok"},{id:"nam-tok-moo",cat:"spicy",name:{en:"Nam Tok Moo",th:"\u0E19\u0E49\u0E33\u0E15\u0E01\u0E2B\u0E21\u0E39",ko:"ナムトック・ムー(焼き豚のサラダ)"},rom:"nam tok moo",desc:{en:"Sliced grilled pork (usually neck or shoulder) tossed with lime, fish sauce, chili flakes, toasted rice powder and herbs. Juicy, smoky, sour and herbal.",ko:"焼いた豚肉(普通は首肉や肩肉)を薄切りにして、ライム、ナンプラー、唐辛子粉、炒った米粉、ハーブと和えます。ジューシーで香ばしく、酸っぱくてハーブの香りがします。"},ingredients:{en:["grilled pork","lime juice","fish sauce","chili flakes","toasted rice powder","shallots","mint","spring onion"],ko:["焼き豚","ライム果汁","ナンプラー","粉唐辛子","炒った米粉","エシャロット","ミント","小ねぎ"]},spice:4,price:[80,150],allergens:["fish"],pork:"yes",seafood:"no",veg:"no",tags:["local-fav","kr-familiar","high-protein","post-practice"],beginner:{en:"\"Nam tok\" means waterfall, for the juices that run from the grilled meat. It is like larb but with sliced grilled pork instead of minced pork. Grilled pork with herbs and lettuce is a flavor Japanese visitors will find familiar from grilled pork (butatoro) wrapped in lettuce.",ko:"「ナムトック」は滝という意味で、焼いた肉から肉汁が流れることからついた名前です。ラープに似ていますが、ひき肉の代わりに焼いた豚肉を切って使います。豚トロ焼きをレタスで包んで食べる日本の食べ方になじみがあれば、きっと口に合います。"},order:{en:"Say nam tok moo, the spice level and sticky rice.",ko:"ナムトック・ムー+辛さ+もち米を伝えてください。",th:"\u0E02\u0E2D\u0E19\u0E49\u0E33\u0E15\u0E01\u0E2B\u0E21\u0E39 \u0E40\u0E1C\u0E47\u0E14\u0E19\u0E49\u0E2D\u0E22 \u0E01\u0E31\u0E1A\u0E02\u0E49\u0E32\u0E27\u0E40\u0E2B\u0E19\u0E35\u0E22\u0E27{P}",rom:"khor nam tok moo phet noi gap khao niao {P}"},fact:{en:"The dish is Isan in origin and sits between a grilled meat dish and a salad.",ko:"イサーン発祥の料理で、焼き肉料理とサラダの中間のような存在です。"},where:[{name:"Any Isan restaurant or street stall",area:"other",note:{en:"Usually on the menu with grilled pork neck and som tum.",ko:"たいてい豚の首肉焼きやソムタムと一緒にメニューにあります。"}}],imgQuery:"Nam tok moo",imgAlt:"Grilled pork waterfall salad with herbs and chili",mapsQuery:"nam tok moo Bangkok"},{id:"yum-woon-sen",cat:"spicy",name:{en:"Yum Woon Sen",th:"\u0E22\u0E33\u0E27\u0E38\u0E49\u0E19\u0E40\u0E2A\u0E49\u0E19",ko:"ヤム・ウンセン(春雨サラダ)"},rom:"yam woon sen",desc:{en:"Glass noodle salad tossed in a lime, fish sauce and chili dressing with minced pork, shrimp, squid, celery, tomato and onion, topped with peanuts. Light, tangy and spicy.",ko:"春雨をライム、ナンプラー、唐辛子のドレッシングで、豚ひき肉、エビ、イカ、セロリ、トマト、玉ねぎと和え、ピーナッツをのせます。軽くて酸っぱくて辛いです。"},ingredients:{en:["glass noodles","minced pork","shrimp","squid","celery","tomato","onion","lime","fish sauce","chili","peanuts"],ko:["春雨","豚ひき肉","エビ","イカ","セロリ","トマト","玉ねぎ","ライム","ナンプラー","唐辛子","ピーナッツ"]},spice:4,price:[80,160],allergens:["shellfish","fish","peanut"],pork:"optional",seafood:"yes",veg:"no",tags:["local-fav","kr-familiar"],beginner:{en:"Served cold or room temperature. The glass noodles are the same kind used in Japanese harusame salad but dressed sour and spicy instead. Ask for \"mai phet\" and the kitchen will use fewer chilies.",ko:"冷たいか常温で出てきます。日本の春雨サラダに使う春雨と同じ種類ですが、酸っぱ辛いドレッシングで和えます。辛くしたくないときは「マイ・ペット」と言ってください。"},order:{en:"Say yum woon sen and the protein (talay = seafood).",ko:"ヤム・ウンセン+具材(タレー=シーフード)を伝えてください。",th:"\u0E02\u0E2D\u0E22\u0E33\u0E27\u0E38\u0E49\u0E19\u0E40\u0E2A\u0E49\u0E19\u0E17\u0E30\u0E40\u0E25 \u0E40\u0E1C\u0E47\u0E14\u0E19\u0E49\u0E2D\u0E22{P}",rom:"khor yam woon sen ta-lay phet noi {P}"},fact:{en:'"Yum" is the Thai word for spicy-sour dressed salad, a big category with many versions.',ko:"「ヤム」は酸っぱ辛く和えたタイ風サラダの総称で、種類がとても豊富です。"},where:[{name:"Any Thai restaurant or street stall",area:"other",note:{en:"Often found at evening stalls and restaurants as a shared appetizer.",ko:"夜の屋台やレストランで、みんなでつまむおつまみとしてよく出てきます。"}}],imgQuery:"Yam woon sen",imgAlt:"Glass noodle salad with shrimp and herbs",mapsQuery:"yum woon sen restaurant Bangkok"},{id:"yum-mama",cat:"spicy",name:{en:"Yum Mama",th:"\u0E22\u0E33\u0E21\u0E32\u0E21\u0E48\u0E32",ko:"ヤム・ママー(インスタント麺サラダ)"},rom:"yam ma-ma",desc:{en:"Instant Mama noodles tossed as a salad in lime, fish sauce and chili with minced pork, shrimp, squid, celery and tomato. A salty, sour, crunchy beer snack.",ko:"ママーのインスタント麺をサラダのようにライム、ナンプラー、唐辛子のドレッシングで、豚ひき肉、エビ、イカ、セロリ、トマトと和えます。しょっぱくて酸っぱく、歯ごたえがあってビールのおつまみにぴったりです。"},ingredients:{en:["instant noodles (Mama)","minced pork","shrimp","squid","celery","tomato","shallot","lime juice","fish sauce","chili"],ko:["インスタント麺（ママー）","豚ひき肉","エビ","イカ","セロリ","トマト","エシャロット","ライム果汁","ナンプラー","唐辛子"]},spice:4,price:[70,150],allergens:["gluten","fish","shellfish"],pork:"optional",seafood:"optional",veg:"no",tags:["late-night","local-fav","kr-familiar"],beginner:{en:"A drinking snack (kap klaem), not a soup. Think of a spicy, cold-ish instant-noodle salad. Say \"mai phet\" if you are not sure; this is usually very spicy.",ko:"スープ料理ではなく、お酒のおつまみ(ガップ・クレーム)です。冷たくして食べる辛いインスタント麺のサラダのような感覚です。自信がなければ「マイ・ペット」と言ってください。たいていかなり辛いです。"},order:{en:"Say yum mama, then the toppings and the spice level.",ko:"ヤム・ママー+トッピング+辛さを伝えてください。",th:"\u0E02\u0E2D\u0E22\u0E33\u0E21\u0E32\u0E21\u0E48\u0E32 \u0E40\u0E1C\u0E47\u0E14\u0E19\u0E49\u0E2D\u0E22{P}",rom:"khor yam ma-ma phet noi {P}"},fact:{en:'"Mama" became the generic Thai word for instant noodles, like "Kleenex" for tissues. The brand has been sold in Thailand since the early 1970s.',ko:"「ママー」はタイでインスタント麺全般を指す言葉になりました。ティッシュを「クリネックス」と呼ぶような感覚です。このブランドは1970年代初めから売られています。"},where:[{name:"Any Isan or late-night snack restaurant",area:"other",note:{en:"A bar-snack favorite at open-air eateries that serve beer.",ko:"ビールを出す屋外の食堂で人気のおつまみです。"}}],imgQuery:"Yam Mama Thai instant noodle salad",imgAlt:"Instant noodle salad with shrimp, squid and herbs",mapsQuery:"yum mama restaurant Bangkok"},{id:"pla-rad-prik",cat:"spicy",name:{en:"Pla Rad Prik",th:"\u0E1B\u0E25\u0E32\u0E23\u0E32\u0E14\u0E1E\u0E23\u0E34\u0E01",ko:"プラー・ラート・プリック(揚げ魚の唐辛子ソースがけ)"},rom:"plaa raat phrik",desc:{en:"A whole deep-fried fish crisp on the outside and tender inside, topped with a sticky sweet-sour-spicy chili, garlic and tamarind sauce. Crunchy fins and bold sauce make it a table centerpiece.",ko:"魚を丸ごと揚げて外はカリカリ、中はふっくらに仕上げ、とろりとした甘酸っぱくて辛い唐辛子・にんにく・タマリンドのソースをかけます。カリカリのヒレと濃厚なソースで、食卓の主役になる料理です。"},ingredients:{en:["whole fish (sea bass or tilapia)","chili","garlic","tamarind","palm sugar","fish sauce","shallot","basil"],ko:["魚の丸ごと（スズキまたはティラピア）","唐辛子","にんにく","タマリンド","ヤシ砂糖","ナンプラー","エシャロット","バジル"]},spice:3,price:[180,450],allergens:["fish"],pork:"no",seafood:"yes",veg:"no",tags:["local-fav","high-protein","post-practice","kr-familiar","sweet"],beginner:{en:"Meant to be shared with rice. Break the fish with the spoon and fork, pull flesh from the bones and add sauce. Fried fish with sweet chili sauce is a taste Japanese visitors will like, comparable to fish in sweet-and-sour sauce (amazu-an). Watch for small bones.",ko:"ご飯と一緒にシェアして食べる料理です。スプーンとフォークで魚をほぐして、骨から身を外してソースと一緒に食べます。カリッと揚げた魚に甘酸っぱいソースは、日本の甘酢あんかけに似ていて口に合います。小骨に気をつけてください。"},order:{en:"Say pla rad prik and ask for the fish type (pla kapong = sea bass). Price depends on fish size.",ko:"プラー・ラート・プリックと言って、魚の種類(プラー・カポン=スズキ)を選んでください。値段は魚の大きさによって変わります。",th:"\u0E02\u0E2D\u0E1B\u0E25\u0E32\u0E01\u0E30\u0E1E\u0E07\u0E23\u0E32\u0E14\u0E1E\u0E23\u0E34\u0E01 \u0E15\u0E31\u0E27\u0E40\u0E25\u0E47\u0E01{P}",rom:"khor plaa ka-phong raat phrik tua lek {P}"},fact:{en:"Thais eat the crispy fins and tail too, and a good version is fried hard enough that the skin stays crunchy under the sauce.",ko:"タイの人たちはカリカリのヒレや尾まで食べます。上手なお店は、ソースをかけても皮がカリカリのまま残るようにしっかり揚げます。"},where:[{name:"Any Thai seafood restaurant",area:"other",note:{en:"Most seafood restaurants sell it by fish size; ask staff to confirm the price first.",ko:"ほとんどのシーフードレストランで魚の大きさ別に売っています。先に値段を確認してください。"}}],imgQuery:"Pla rad prik",imgAlt:"Whole fried fish topped with chili sauce",mapsQuery:"pla rad prik seafood restaurant Bangkok"},{id:"yum-kor-moo-yang",cat:"spicy",name:{en:"Yum Kor Moo Yang",th:"\u0E22\u0E33\u0E04\u0E2D\u0E2B\u0E21\u0E39\u0E22\u0E48\u0E32\u0E07",ko:"ヤム・コー・ムーヤーン(焼き豚トロサラダ)"},rom:"yam kho moo yaang",desc:{en:"Charcoal-grilled pork neck sliced and tossed with lime, fish sauce, chili, shallots, tomato, cucumber and fresh herbs. Fatty, smoky, sour and spicy.",ko:"炭火で焼いた豚の首肉を薄切りにして、ライム、ナンプラー、唐辛子、エシャロット、トマト、きゅうり、ハーブと和えます。脂がのっていて香ばしく、酸っぱ辛いです。"},ingredients:{en:["grilled pork neck","lime juice","fish sauce","chili","shallots","tomato","cucumber","mint","lettuce"],ko:["焼いた豚トロ","ライム果汁","ナンプラー","唐辛子","エシャロット","トマト","きゅうり","ミント","レタス"]},spice:4,price:[100,180],allergens:["fish"],pork:"yes",seafood:"no",veg:"no",tags:["local-fav","kr-familiar","high-protein","post-practice","late-night"],beginner:{en:"More vegetables and more dressing than nam tok moo. Pork neck is the same cut Japanese yakiniku shops call toro (butatoro), and the lettuce wrap habit carries over. Good with sticky rice and beer.",ko:"ナムトック・ムーより野菜とドレッシングが多めです。豚の首肉は日本の焼肉屋で豚トロと呼ばれる部位と同じで、レタスで包んで食べる習慣もそのまま通じます。もち米やビールとよく合います。"},order:{en:"Say yum kor moo yang and the spice level, plus sticky rice.",ko:"ヤム・コー・ムーヤーン+辛さ+もち米を伝えてください。",th:"\u0E02\u0E2D\u0E22\u0E33\u0E04\u0E2D\u0E2B\u0E21\u0E39\u0E22\u0E48\u0E32\u0E07 \u0E40\u0E1C\u0E47\u0E14\u0E19\u0E49\u0E2D\u0E22 \u0E01\u0E31\u0E1A\u0E02\u0E49\u0E32\u0E27\u0E40\u0E2B\u0E19\u0E35\u0E22\u0E27{P}",rom:"khor yam kho moo yaang phet noi gap khao niao {P}"},fact:{en:"Pork neck (kor moo yang) is also eaten plain grilled with a spicy dipping sauce (jaew), which is a favorite at Isan grill stalls.",ko:"豚トロ焼き(コー・ムーヤーン)は辛いタレ(ジェーオ)につけて食べることもでき、イサーンの焼き屋台の人気メニューです。"},where:[{name:"Any Isan grill restaurant or street stall",area:"other",note:{en:"Look for charcoal grills with pork neck and sticky rice baskets.",ko:"炭火の豚トロ焼きともち米のかごがあるお店を探しましょう。"}}],imgQuery:"Yam kor moo yang",imgAlt:"Sliced grilled pork neck tossed with herbs, mint and chili dressing",mapsQuery:"yum kor moo yang Isan restaurant Bangkok"},{id:"hoy-tod",cat:"street",name:{en:"Hoy Tod",th:"\u0E2B\u0E2D\u0E22\u0E17\u0E2D\u0E14",ko:"ホイ・トート(シーフードのお好み焼き)"},rom:"hoi thot",desc:{en:"A sizzling pan-fried mussel (or oyster) pancake with egg and a rice-flour batter, crispy at the edges and chewy inside, with bean sprouts and a sweet chili dipping sauce.",ko:"ムール貝(または牡蠣)に卵と米粉の生地をつけて、フライパンでジュージュー焼いたお好み焼き風の料理です。縁はカリカリで中はもちもちで、もやしとスイートチリソースが添えられます。"},ingredients:{en:["mussels or oysters","egg","rice flour and tapioca batter","bean sprouts","spring onion","sweet chili sauce or Sriracha"],ko:["ムール貝または牡蠣","卵","米粉とタピオカの生地","もやし","小ねぎ","スイートチリソースまたはシラチャー"]},spice:1,price:[60,120],allergens:["shellfish","egg","soy"],pork:"no",seafood:"yes",veg:"no",tags:["street","late-night","local-fav","kr-familiar"],beginner:{en:"Two styles: soft and chewy (hoy tod) and extra crispy (hoy tod grop). Think of it as a Japanese okonomiyaki or oyster okonomiyaki. Eat while hot. Oyster versions are pricier than mussel ones.",ko:"もちもちスタイル(ホイ・トート)と、とてもカリカリのスタイル(ホイ・トート・グロップ)の2種類があります。日本のお好み焼きや牡蠣のお好み焼きに似ています。熱いうちに食べてください。牡蠣のほうがムール貝より高いです。"},order:{en:"Say hoy tod with mussels (hoy malaeng phu) or oysters (hoy nang rom) and choose soft or crispy.",ko:"ホイ・トート+ムール貝(ホイ・マレーン・プー)または牡蠣(ホイ・ナーン・ロム)+もちもち/カリカリを伝えてください。",th:"\u0E02\u0E2D\u0E2B\u0E2D\u0E22\u0E17\u0E2D\u0E14\u0E2B\u0E2D\u0E22\u0E41\u0E21\u0E25\u0E07\u0E20\u0E39\u0E48 \u0E01\u0E23\u0E2D\u0E1A\u0E46{P}",rom:"khor hoi thot hoi ma-laeng-phu grop grop {P}"},fact:{en:"It is a Thai-Chinese street-food classic, and Chinatown is the best place to find it freshly fried.",ko:"タイ系中国人の屋台の定番メニューで、揚げたてを食べるならチャイナタウンがいちばんです。"},where:[{name:"Nai Mong Hoi Thod",area:"yaowarat",note:{en:"Well-known oyster omelet and hoy tod shop on Phlap Phla Chai Road near Yaowarat.",ko:"ヤワラート近くのプラーププラーチャイ通りにある、有名な牡蠣オムレツ・ホイ・トートのお店です。"}},{name:"Any street stall in Yaowarat",area:"yaowarat",note:{en:"Evening stalls fry it to order.",ko:"夜の屋台では注文を受けてから焼いてくれます。"}}],imgQuery:"Hoy tod",imgAlt:"Crispy Thai mussel pancake with bean sprouts",mapsQuery:"hoy tod Yaowarat Bangkok"}]});var Ko,Ho=S(()=>{Ko=[{id:"moo-ping",cat:"street",name:{en:"Moo Ping",th:"\u0E2B\u0E21\u0E39\u0E1B\u0E34\u0E49\u0E07",ko:"ムーピン(タイ風豚肉の串焼き)"},rom:"moo ping",desc:{en:"Small skewers of thin-sliced pork marinated in garlic, coriander root, pepper and often coconut milk, grilled over charcoal until sweet and smoky. The classic Bangkok breakfast and snack, usually eaten with a bag of sticky rice.",ko:"にんにく、パクチーの根、胡椒、ココナッツミルクなどに漬けた薄切り豚肉を炭火で焼いた小さな串です。バンコクの人たちの定番の朝ごはんでありおやつで、たいていもち米(カオ・ニアオ)と一緒に食べます。"},ingredients:{en:["pork","garlic","coriander root","white pepper","soy sauce","coconut milk","palm sugar"],ko:["豚肉","にんにく","パクチーの根","白こしょう","しょうゆ","ココナッツミルク","ヤシ砂糖"]},spice:0,price:[10,20],allergens:["soy"],pork:"yes",seafood:"no",veg:"no",tags:["street","local-fav","kr-familiar","beginner","high-protein","post-practice"],beginner:{en:"Sweet-savory and not spicy at all, so it is the safest first street snack. Each stick is small (usually around 10-20 THB), so people order 5-10 sticks plus a 10 THB bag of sticky rice. Many vendors serve a spicy dipping sauce on the side; skip it if you do not want heat.",ko:"甘じょっぱくてまったく辛くないので、最初の屋台グルメにぴったりです。一本が小さい(たいてい10~20バーツ)ので、5~10本にもち米を一袋(約10バーツ)付けて買うのが普通です。辛いタレは別添えのお店が多いので、いらなければ断れば大丈夫です。"},order:{en:"Say the number of sticks and ask for sticky rice.",ko:"串の本数を伝えて、もち米も一緒にお願いしてください。",th:"\u0E02\u0E2D\u0E2B\u0E21\u0E39\u0E1B\u0E34\u0E49\u0E07\u0E2B\u0E49\u0E32\u0E44\u0E21\u0E49 \u0E02\u0E49\u0E32\u0E27\u0E40\u0E2B\u0E19\u0E35\u0E22\u0E27\u0E2B\u0E19\u0E36\u0E48\u0E07\u0E16\u0E38\u0E07{P}",rom:"khor moo ping ha mai, khao niao nueng thung {P}"},fact:{en:"Moo ping stalls often start before sunrise, because for many Bangkokians a bag of sticky rice with moo ping is a grab-and-go breakfast on the way to work or school.",ko:"ムーピンの屋台は日の出前から開いているところが多いです。もち米とムーピンを一袋、出勤や通学の途中に持って行くのがバンコクっ子の定番の朝ごはんなんですよ。"},where:[{name:"Street stalls near BTS/MRT exits and local markets",area:"other",note:{en:"Look for a small charcoal grill and a stack of skewers, mostly in the morning and early evening. Pick the stall with the busiest line.",ko:"炭火のコンロに串が積まれているお店を探してください。主に朝と夕方早めの時間帯が多いです。行列が長いお店がいちばん安心です。"}}],imgQuery:"Moo ping",imgAlt:"Grilled pork skewers (moo ping) on a charcoal grill",mapsQuery:"moo ping grilled pork skewers Bangkok"},{id:"gai-tod",cat:"street",name:{en:"Gai Tod (Thai Fried Chicken)",th:"\u0E44\u0E01\u0E48\u0E17\u0E2D\u0E14",ko:"ガイトート(タイ風フライドチキン)"},rom:"gai tod",desc:{en:"Crispy fried chicken pieces, often Hat Yai style: marinated with spices and served heaped with crunchy fried shallots. Usually eaten with sticky rice and sweet chili sauce.",ko:"スパイスに漬け込んだ鶏肉をカリッと揚げたフライドチキンです。南部ハジャイ風は揚げエシャロットをこんもりのせて出してくれます。たいていもち米とスイートチリソースと一緒に食べます。"},ingredients:{en:["chicken","garlic","coriander root","white pepper","spices","flour batter","fried shallots"],ko:["鶏肉","にんにく","パクチーの根","白こしょう","スパイス","衣","揚げエシャロット"]},spice:0,price:[30,80],allergens:["gluten"],pork:"no",seafood:"no",veg:"no",tags:["street","local-fav","kr-familiar","beginner","high-protein","post-practice"],beginner:{en:"It is lighter and less greasy than Japanese karaage-style fried chicken, with a thin, spiced crust instead of a thick coating. The chicken itself is not spicy; the sweet chili sauce is mild. Pieces are sold individually (wings, thighs, breast), so you can start with one and add more.",ko:"日本の唐揚げより衣が薄くて、油っぽさも控えめです。スパイスの香りがする薄い皮が特徴です。鶏肉自体は辛くなく、スイートチリソースもマイルドな方です。部位ごと(手羽、もも、胸肉)に1個ずつ売っているので、まず1個だけ試してみてもOKです。"},order:{en:"Point at the piece you want and ask for sticky rice too.",ko:"欲しい部位を指さして、もち米もお願いしましょう。",th:"\u0E02\u0E2D\u0E44\u0E01\u0E48\u0E17\u0E2D\u0E14\u0E2B\u0E19\u0E36\u0E48\u0E07\u0E0A\u0E34\u0E49\u0E19 \u0E02\u0E49\u0E32\u0E27\u0E40\u0E2B\u0E19\u0E35\u0E22\u0E27\u0E14\u0E49\u0E27\u0E22{P}",rom:"khor gai tod nueng chin, khao niao duay {P}"},fact:{en:"Hat Yai, a city in southern Thailand, gave the dish its most famous style, and fried chicken with fried shallots is now sold from Bangkok street carts to food courts.",ko:"タイ南部の都市ハジャイが、いちばん有名なスタイルの本場です。今ではバンコクの路上の屋台からフードコートまで、どこでも売っています。"},where:[{name:"Street stalls and market food courts across Bangkok",area:"other",note:{en:"Look for a glass display of golden chicken with fried shallots on top. Pieces are usually sold hot and fresh in the evening.",ko:"揚げエシャロットをのせた黄金色のチキンがガラスケースに並んでいる屋台を探してください。揚げたてのチキンは主に夕方に多いです。"}}],imgQuery:"Gai tod Hat Yai fried chicken",imgAlt:"Thai fried chicken topped with crispy fried shallots",mapsQuery:"Hat Yai fried chicken Bangkok"},{id:"crispy-pork",cat:"street",name:{en:"Crispy Pork (Moo Krob)",th:"\u0E2B\u0E21\u0E39\u0E01\u0E23\u0E2D\u0E1A",ko:"ムークロープ(カリカリ豚バラ)"},rom:"moo krop",desc:{en:"Pork belly roasted or fried until the skin puffs into a crackling shell, then chopped and served over rice or with a spicy dipping sauce. A close cousin, moo tod kratiem, is pork fried with garlic and pepper.",ko:"豚バラ肉を、皮がふくれてカリカリになるまで焼いたり揚げたりした料理です。細かく切ってご飯にのせたり、ピリ辛のタレにつけて食べます。ニンニクとコショウで揚げたムートートクラティアムも、よく似た仲間のメニューです。"},ingredients:{en:["pork belly","salt","garlic","white pepper","dipping sauce (chili, lime, fish sauce)"],ko:["豚バラ肉","塩","にんにく","白こしょう","ソース（唐辛子、ライム、ナンプラー）"]},spice:1,price:[50,100],allergens:[],pork:"yes",seafood:"no",veg:"no",tags:["street","local-fav","kr-familiar","high-protein","post-practice"],beginner:{en:"Think yakiniku pork belly with an extra-crunchy skin. It is salty and rich, and the skin can be hard on teeth if it is very thick. A common street order is rice with crispy pork, often with a fried egg, or pad kra pao moo krob (crispy pork stir-fried with holy basil).",ko:"皮がさらにカリカリな焼肉の豚バラ、と考えるとわかりやすいです。塩気があって脂がのっています。皮がとても厚いとかなり硬いことがあります。よくある注文は、ご飯にのせたムークロープ(目玉焼きをのせることが多い)や、パットガパオ・ムークロープ(カリカリ豚肉のバジル炒め)です。"},order:{en:"Ask for crispy pork over rice, one box.",ko:"カリカリ豚肉のせご飯を1箱ください、と注文しましょう。",th:"\u0E02\u0E2D\u0E02\u0E49\u0E32\u0E27\u0E2B\u0E21\u0E39\u0E01\u0E23\u0E2D\u0E1A\u0E2B\u0E19\u0E36\u0E48\u0E07\u0E01\u0E25\u0E48\u0E2D\u0E07{P}",rom:"khor khao moo krop nueng klong {P}"},fact:{en:"Chinese-style roast pork hanging in the window is a Yaowarat classic, and Thai cooks later adopted crispy pork into everyday dishes like pad kra pao.",ko:"ガラス窓に吊るされた中華風のローストポークは、ヤワラート(チャイナタウン)の代表的な風景です。タイの料理人がこれをパットガパオのような日常のメニューに取り入れて広まりました。"},where:[{name:"Roast-meat and rice shops around Yaowarat",area:"yaowarat",note:{en:"Chinese-Thai shops with hanging roast pork and red pork over rice; usually a lot cheaper than restaurants.",ko:"ローストポークを吊るして、ムーデーン(チャーシュー)丼も出している中華系タイ料理店です。普通のレストランよりずっと安いです。"}}],imgQuery:"Moo krob crispy pork belly",imgAlt:"Chopped crispy pork belly with crackling skin over rice",mapsQuery:"khao moo krob crispy pork rice Bangkok"},{id:"sai-krok-isan",cat:"street",name:{en:"Sai Krok Isan (Northeastern Sausage)",th:"\u0E44\u0E2A\u0E49\u0E01\u0E23\u0E2D\u0E01\u0E2D\u0E35\u0E2A\u0E32\u0E19",ko:"サイクロークイサーン(イサーンソーセージ)"},rom:"sai krok ee-san",desc:{en:"A grilled fermented pork-and-rice sausage from Isan, Thailand's northeast, with a distinctive sour, garlicky tang. Served with raw cabbage, fresh ginger slices and chilies to balance the richness.",ko:"タイ北東部イサーン地方の発酵ソーセージです。豚肉とお米で作られていて、酸味があってニンニクの香りが強いです。生のキャベツ、生姜のスライス、唐辛子が付いてきて、こってり感をやわらげてくれます。"},ingredients:{en:["pork","cooked rice","garlic","salt","pepper"],ko:["豚肉","ご飯","にんにく","塩","こしょう"]},spice:1,price:[10,25],allergens:[],pork:"yes",seafood:"no",veg:"no",tags:["street","local-fav","kr-familiar"],beginner:{en:"It is sour from fermentation, which surprises first-timers; the taste is closer to a tangy salami than to a hot dog. Take a bite of the sausage, then a bite of raw ginger or cabbage. The chilies served alongside are the spicy part; you do not have to eat them.",ko:"発酵させているので酸っぱいです。初めて食べるとちょっと驚くかもしれません。酸味のあるサラミのような味で、ホットドッグのソーセージとはかなり違います。ソーセージをひと口食べたら、生姜やキャベツをひと口、と交互に食べてください。一緒に出てくる唐辛子が辛い部分なので、食べなくても大丈夫です。"},order:{en:"Say how many pieces and ask for the vegetables that come with it.",ko:"何本か伝えて、一緒に付いてくる野菜もお願いしましょう。",th:"\u0E02\u0E2D\u0E44\u0E2A\u0E49\u0E01\u0E23\u0E2D\u0E01\u0E2D\u0E35\u0E2A\u0E32\u0E19\u0E2A\u0E2D\u0E07\u0E2D\u0E31\u0E19 \u0E02\u0E2D\u0E1C\u0E31\u0E01\u0E14\u0E49\u0E27\u0E22{P}",rom:"khor sai krok ee-san song an, khor phak duay {P}"},fact:{en:"In Thai, sai means casing and krok means to stuff; the Isan version is naturally fermented for a day or two, which is where the sour flavor comes from.",ko:"タイ語でサイはソーセージの皮、クロークは詰めるという意味です。イサーン風は1~2日自然発酵させるので、あの独特の酸味が出ます。"},where:[{name:"Isan grill stalls (look for chicken, sausage and sticky rice on a charcoal grill)",area:"other",note:{en:"Often sold alongside grilled chicken (gai yang) and papaya salad (som tam) at Isan food stalls. Evenings are most reliable.",ko:"イサーン料理の屋台では、焼き鶏(ガイヤーン)やソムタムと一緒に売っていることが多いです。夕方の時間帯がいちばん確実です。"}}],imgQuery:"Sai krok Isan",imgAlt:"Grilled Isan sausages served with cabbage, ginger and chilies",mapsQuery:"sai krok isan Bangkok"},{id:"pla-muek-yang",cat:"street",name:{en:"Thai Grilled Squid (Pla Muek Yang)",th:"\u0E1B\u0E25\u0E32\u0E2B\u0E21\u0E36\u0E01\u0E22\u0E48\u0E32\u0E07",ko:"プラームックヤーン(タイ風イカ焼き)"},rom:"pla muek yang",desc:{en:"Whole squid or squid tentacles grilled over charcoal until smoky and chewy, sliced into rings and served with a tangy, spicy seafood dipping sauce. A popular evening street snack.",ko:"イカを丸ごと、または足だけ炭火で焼いて、香ばしさと歯ごたえを活かしたおやつです。輪切りにして、酸味と辛味のあるシーフードソースにつけて食べます。夕方の路上で人気です。"},ingredients:{en:["squid","seafood dipping sauce (chili, garlic, lime, fish sauce, coriander)"],ko:["イカ","シーフードソース（唐辛子、にんにく、ライム、ナンプラー、パクチー）"]},spice:2,price:[40,120],allergens:["shellfish","fish"],pork:"no",seafood:"yes",veg:"no",tags:["street","late-night","high-protein","kr-familiar"],beginner:{en:"Closer to Japanese ika-yaki (grilled squid) than to fried calamari. The dipping sauce is where the heat is, so ask for it on the side if you are unsure. Squid prices vary a lot by size; ask the price before the vendor starts grilling.",ko:"揚げイカよりも日本のイカ焼きに近いです。辛さはソースにあるので、心配なら別添えでお願いしましょう。イカは大きさによって値段がかなり違うので、焼く前に先に値段を聞いてください。"},order:{en:"Order one squid and ask for the sauce on the side.",ko:"イカを1杯注文して、ソースは別添えでお願いしましょう。",th:"\u0E02\u0E2D\u0E1B\u0E25\u0E32\u0E2B\u0E21\u0E36\u0E01\u0E22\u0E48\u0E32\u0E07\u0E2B\u0E19\u0E36\u0E48\u0E07\u0E15\u0E31\u0E27 \u0E41\u0E22\u0E01\u0E19\u0E49\u0E33\u0E08\u0E34\u0E49\u0E21{P}",rom:"khor pla muek yang nueng tua, yaek nam jim {P}"},fact:{en:"Many carts also sell dried squid: it is grilled, then run through a hand-cranked roller to flatten and tenderize it before being torn into strips.",ko:"焼いた干しイカを手回しのローラーに通して平らに柔らかくしてから、裂いて売る屋台も多いです。"},where:[{name:"Night-market and street grill stalls",area:"other",note:{en:"Charcoal-grill carts at night markets and busy evening streets, including Yaowarat's evening food strip.",ko:"夜市や夕方のにぎやかな通りに、炭火のイカ焼きの屋台があります。ヤワラートの夕方の屋台街にも多いです。"}}],imgQuery:"Grilled squid Thailand street food",imgAlt:"Grilled squid on skewers at a Thai street stall",mapsQuery:"pla muek yang grilled squid Bangkok"},{id:"look-chin-pla",cat:"street",name:{en:"Fish Balls (Look Chin Pla)",th:"\u0E25\u0E39\u0E01\u0E0A\u0E34\u0E49\u0E19\u0E1B\u0E25\u0E32",ko:"ルークチン・プラー(タイの魚のつみれ)"},rom:"look chin pla",desc:{en:"Springy balls of ground fish paste sold on skewers (look chin ping), grilled and brushed with sweet chili sauce, or served in noodle soup. Beef, pork and shrimp versions sit next to them at the same stall.",ko:"魚のすり身で作ったプリプリの団子です。串に刺して焼き、スイートチリソースを塗って食べたり、麺の上にのせて食べたりします。同じ屋台に牛肉、豚肉、エビの団子も並んでいます。"},ingredients:{en:["fish paste","tapioca starch","salt","pepper","sweet chili sauce"],ko:["魚のすり身","タピオカでんぷん","塩","こしょう","スイートチリソース"]},spice:1,price:[10,60],allergens:["fish","gluten"],pork:"optional",seafood:"yes",veg:"no",tags:["street","kr-familiar","beginner","local-fav"],beginner:{en:"Like Japanese oden or nerimono skewers but bouncier and denser. Skewers are about 10-15 THB each, bowls of fish-ball noodles about 40-60 THB. Many skewer stalls mix fish, beef and pork balls, so ask which is which if you avoid pork.",ko:"日本のおでんや練り物の串に似ていますが、もっと弾力があって締まっています。串は1本10~15バーツ、魚団子入りの麺は1杯40~60バーツくらいです。1つの屋台で魚、牛肉、豚肉の団子を混ぜて売っていることが多いので、豚肉を避けたい場合は種類を必ず聞いてください。"},order:{en:"Order fish-ball skewers and ask for no chili.",ko:"魚団子の串を注文して、唐辛子は抜きでお願いしましょう。",th:"\u0E02\u0E2D\u0E25\u0E39\u0E01\u0E0A\u0E34\u0E49\u0E19\u0E1B\u0E25\u0E32\u0E2B\u0E49\u0E32\u0E44\u0E21\u0E49 \u0E44\u0E21\u0E48\u0E40\u0E1C\u0E47\u0E14{P}",rom:"khor look chin pla ha mai, mai phet {P}"},fact:{en:"Fish-ball noodles (kuay tiao look chin pla) is a standard cheap lunch across Bangkok, with a clear broth and a splash of vinegar and chili at the table.",ko:"魚団子の麺(クイッティアオ・ルークチン・プラー)は、バンコクのどこでも食べられる安いランチです。透き通ったスープに、テーブルの上の酢と唐辛子を加えて食べます。"},where:[{name:"Street skewer carts and noodle shops",area:"other",note:{en:"Found near schools, markets and BTS/MRT exits. Look for the steamed or fried ball display with sauce bottles.",ko:"学校、市場、BTS/MRTの出口付近によくあります。ソースのボトルと一緒に団子が並んでいる屋台を探してください。"}}],imgQuery:"Look chin Thai fish balls",imgAlt:"Grilled fish ball skewers with sweet chili sauce at a Thai street stall",mapsQuery:"fish ball noodles Bangkok"},{id:"khanom-jeeb",cat:"street",name:{en:"Khanom Jeeb (Thai Steamed Dumplings)",th:"\u0E02\u0E19\u0E21\u0E08\u0E35\u0E1A",ko:"カノムジーブ(タイ風焼売)"},rom:"kha-nom jeeb",desc:{en:"Thai-style siu mai: steamed pork (often with shrimp) dumplings in a thin yellow wrapper, topped with crispy fried garlic and served with sweet soy sauce and chili.",ko:"タイ風のシュウマイです。薄い黄色の皮で豚肉(エビが入るお店もあります)を包んで蒸し、カリカリの揚げニンニクをのせて、甘い醤油とチリソースを添えます。"},ingredients:{en:["ground pork","shrimp (some stalls)","wonton wrapper","fried garlic","sweet soy sauce","chili sauce"],ko:["豚ひき肉","エビ（お店による）","ワンタンの皮","揚げにんにく","甘いしょうゆ","チリソース"]},spice:1,price:[20,50],allergens:["gluten","soy","shellfish"],pork:"yes",seafood:"optional",veg:"no",tags:["street","kr-familiar","beginner"],beginner:{en:"A small snack, sold in a cup or tray of 4-6 pieces. The dumplings are not spicy; the chili sauce is on the side. Many stalls use pork only, but some add shrimp, so ask if you avoid shellfish.",ko:"4~6個ずつカップやトレイに入れて売っている小さなおやつです。餃子自体は辛くなく、チリソースは別に付けてくれます。豚肉だけのお店が多いですが、エビを入れるお店もあるので、甲殻類を避けたい場合は必ず聞いてください。"},order:{en:"One cup of dumplings, no chili.",ko:"シュウマイを1カップ、唐辛子は抜きでお願いします。",th:"\u0E02\u0E2D\u0E02\u0E19\u0E21\u0E08\u0E35\u0E1A\u0E2B\u0E19\u0E36\u0E48\u0E07\u0E16\u0E49\u0E27\u0E22 \u0E44\u0E21\u0E48\u0E40\u0E2D\u0E32\u0E1E\u0E23\u0E34\u0E01{P}",rom:"khor kha-nom jeeb nueng thuay, mai ao phrik {P}"},fact:{en:"Khanom jeeb came to Thailand with Chinese immigrants; it is a take on Cantonese siu mai (\"jeeb\" means pleated), but the street version is topped with fried garlic.",ko:"カノムジーブは中国からの移民が持ち込んだ料理です。広東式点心のシュウマイが元祖で、「ジーブ」はひだを寄せるという意味ですが、タイ式は揚げニンニクをのせます。"},where:[{name:"Street steamer carts and Yaowarat stalls",area:"yaowarat",note:{en:"Steamer carts in markets and around Chinatown; some dim sum restaurants also sell it, at higher prices.",ko:"市場やチャイナタウン周辺の蒸し器の屋台で売っています。点心のお店でも売っていますが、値段は高めです。"}}],imgQuery:"Khanom jeeb Thai steamed dumplings",imgAlt:"Steamed Thai pork dumplings in yellow wrappers topped with fried garlic",mapsQuery:"khanom jeeb steamed dumplings Bangkok"},{id:"kluay-tod",cat:"street",name:{en:"Thai Fried Banana (Kluay Tod)",th:"\u0E01\u0E25\u0E49\u0E27\u0E22\u0E17\u0E2D\u0E14",ko:"クルアイトート(タイ風バナナ揚げ)"},rom:"kluay tod",desc:{en:"Bananas battered with rice flour, coconut and sesame seeds, deep-fried until golden and crunchy outside, soft and sweet inside. Sold in paper bags at carts, often next to fried sweet potato and taro.",ko:"米粉、ココナッツ、ゴマの衣をつけたバナナをカリッと揚げたおやつです。外はサクサク、中は柔らかくて甘いです。紙袋に入れて売っていて、揚げサツマイモやタロイモも一緒に売っているところが多いです。"},ingredients:{en:["banana","rice flour","grated coconut","sesame seeds","sugar"],ko:["バナナ","米粉","細切りココナッツ","ごま","砂糖"]},spice:0,price:[20,50],allergens:["sesame"],pork:"no",seafood:"no",veg:"yes",tags:["street","sweet","local-fav","beginner"],beginner:{en:"Best eaten straight from the fryer while hot and crisp. They get soft and oily if you wait. The bag usually holds 4-8 pieces and is easy to share with teammates.",ko:"揚げたての熱くてカリカリのうちに食べるのが最高です。冷めるとしんなりして油っぽくなります。1袋に普通4~8個入っているので、チームメンバーとシェアするのにぴったりです。"},order:{en:"Ask for one bag of fried bananas.",ko:"バナナ揚げを1袋ください、と頼みましょう。",th:"\u0E02\u0E2D\u0E01\u0E25\u0E49\u0E27\u0E22\u0E17\u0E2D\u0E14\u0E2B\u0E19\u0E36\u0E48\u0E07\u0E16\u0E38\u0E07{P}",rom:"khor kluay tod nueng thung {P}"},fact:{en:"Thais usually use small, sweet 'nam wa' bananas for frying, which hold their shape and sweetness better than the large Cavendish bananas eaten raw.",ko:"揚げ物には小ぶりで甘い「ナムワー」バナナをよく使います。生で食べる大きなキャベンディッシュバナナより、形が崩れにくくて甘みも濃いです。"},where:[{name:"Street fryer carts at markets and near BTS/MRT exits",area:"other",note:{en:"Look for a cart with a wok of oil and trays of fried banana, taro and sweet potato.",ko:"油の鍋のそばに、バナナ、タロイモ、サツマイモの揚げ物が積まれている屋台を探してください。"}}],imgQuery:"Kluay tod fried banana Thailand",imgAlt:"Golden fried bananas in a paper bag at a Thai street stall",mapsQuery:"kluay tod fried banana Bangkok"},{id:"roti",cat:"street",name:{en:"Thai Street Roti (Roti Gluay / Roti Saimai)",th:"\u0E42\u0E23\u0E15\u0E35",ko:"ロティ(タイの屋台ロティ)"},rom:"ro-ti",desc:{en:"A thin, flaky flatbread stretched and fried on a flat griddle by Thai-Muslim vendors, then filled or topped: egg and condensed milk, banana, chocolate, or served as roti saimai with colorful cotton-candy threads. Some Thai-Muslim restaurants also serve roti with curry.",ko:"タイのムスリムの屋台のお兄さんが薄く伸ばして鉄板で焼いてくれるロティです。卵と練乳、バナナ、チョコレートを入れたり、カラフルな綿あめの糸を包んだロティ・サイマイもあります。タイ・ムスリムのレストランでは、カレーと一緒に食べるロティも出しています。"},ingredients:{en:["flour dough","margarine or butter","egg","condensed milk","sugar","cotton-candy threads (saimai)"],ko:["小麦粉の生地","マーガリンまたはバター","卵","練乳","砂糖","綿あめの糸（サイマイ）"]},spice:0,price:[25,100],allergens:["gluten","egg","dairy"],pork:"no",seafood:"no",veg:"option",tags:["street","sweet","late-night","local-fav","beginner"],beginner:{en:"Sweet roti is a dessert snack, not a main meal. It is flaky, buttery and very sweet with condensed milk. Plain roti with egg is less sweet. Roti saimai is sold as thin crepes wrapped around sugar threads. For a savory meal, go to a Thai-Muslim restaurant and order roti with curry. Banana-and-egg roti has its own entry in the desserts section.",ko:"甘いロティは食事というよりデザート系のおやつです。サクサクでバターの香りがして、練乳でとても甘いです。卵だけのロティはそれほど甘くありません。ロティ・サイマイは、薄いクレープで砂糖の糸を包んで出してくれます。食事として食べたいなら、タイ・ムスリムのレストランでカレーと一緒に食べるロティを注文してください。バナナ卵ロティはデザートの項目に別にあります。"},order:{en:"Ask for roti with egg and condensed milk.",ko:"卵と練乳を入れたロティをお願いしましょう。",th:"\u0E02\u0E2D\u0E42\u0E23\u0E15\u0E35\u0E43\u0E2A\u0E48\u0E44\u0E02\u0E48 \u0E43\u0E2A\u0E48\u0E19\u0E21\u0E02\u0E49\u0E19{P}",rom:"khor ro-ti sai khai, sai nom khon {P}"},fact:{en:"Roti saimai is often linked to Ayutthaya and Thai-Muslim roti makers; saimai means silk thread, and the candy threads look like spun silk.",ko:"ロティ・サイマイはアユタヤや、タイ・ムスリムのロティ職人と縁が深いです。サイマイは絹糸という意味で、砂糖の糸が絹のように見えることからその名が付きました。"},where:[{name:"Roti Mataba (Phra Athit Road)",area:"other",note:{en:"A long-established Thai-Muslim restaurant in Phra Athit, Old Town, well known for roti and matabaa (stuffed pan-fried bread) with curry.",ko:"バンコクの旧市街、プラアティット通りにある老舗のタイ・ムスリム料理店です。ロティとカレー、マターバ(具を詰めて焼いたパン)で有名です。"}},{name:"Roti carts at night markets and Khao San Road area",area:"other",note:{en:"Easy to spot by the stretching and flipping on a hot griddle, mostly evenings.",ko:"熱い鉄板で生地を伸ばしてひっくり返す様子で、すぐにわかります。主に夕方に多いです。"}}],imgQuery:"Roti Thai street food",imgAlt:"A roti vendor cooking sweet roti on a griddle at a Bangkok street cart",mapsQuery:"roti Bangkok street cart"},{id:"moo-kratha",cat:"street",name:{en:"Thai BBQ (Moo Kratha)",th:"\u0E2B\u0E21\u0E39\u0E01\u0E23\u0E30\u0E17\u0E30",ko:"ムーガタ(ムーガタ、タイ式焼肉ビュッフェ)"},rom:"moo kra-tha",desc:{en:"A table-top BBQ and hot-pot hybrid: a domed metal pan sits over charcoal or gas, you grill thin-sliced meat on the dome while soup simmers in the moat around it. Most places run as all-you-can-eat buffets, with a self-service counter of meat, seafood, vegetables and noodles.",ko:"テーブルの上で焼いて煮る、タイ式の焼肉と鍋のハイブリッドです。ドーム型の鉄板で肉を焼き、縁のくぼみでスープを煮立てます。ほとんどが食べ放題のビュッフェで、肉、シーフード、野菜、麺をセルフコーナーから取って食べます。"},ingredients:{en:["thin-sliced pork","chicken","seafood","vegetables","glass noodles","egg","seafood dipping sauce (chili, lime, garlic)"],ko:["薄切り豚肉","鶏肉","シーフード","野菜","春雨","卵","シーフードソース（唐辛子、ライム、にんにく）"]},spice:2,price:[199,499],allergens:["soy","fish","shellfish","egg"],pork:"yes",seafood:"optional",veg:"no",tags:["late-night","kr-familiar","high-protein","post-practice","local-fav"],beginner:{en:"It looks like Japanese yakiniku but works differently. Pork is sliced paper-thin and pre-marinated, you cook it on the dome (rub a piece of pork fat on it first to keep it from sticking), and the juices run down into the soup moat, which makes the broth richer as you go. There is no dipping in yakiniku tare or wrapping in lettuce; people dip meat in a spicy-sour seafood sauce instead. Prices usually run roughly 199-499 THB per person depending on the buffet; time limits are common, and some places charge extra for food left on the table. Be ready to smell like smoke afterwards.",ko:"日本の焼肉に似ていますが、やり方が違います。豚肉をごく薄く切って先に味付けしてあり、ドーム型の鉄板の上で焼きます(くっつかないように、まず脂身で油を塗ります)。流れ落ちた肉汁が縁のスープに混ざって、だんだん濃くなっていきます。焼肉のタレにつけたりレタスで包んだりする文化はなく、代わりに辛くて酸っぱいシーフードソースにつけて食べます。ビュッフェは普通1人199~499バーツくらいで、利用時間の制限がよくあり、食べ残しに追加料金がかかるお店もあります。食べたあとは服に煙のにおいが付くので覚悟してくださいね。"},order:{en:"Ask for a buffet for a set number of people.",ko:"何名か伝えて、ビュッフェで注文しましょう。",th:"\u0E02\u0E2D\u0E2B\u0E21\u0E39\u0E01\u0E23\u0E30\u0E17\u0E30\u0E1A\u0E38\u0E1F\u0E40\u0E1F\u0E15\u0E4C\u0E2A\u0E35\u0E48\u0E17\u0E35\u0E48{P}",rom:"khor moo kra-tha buffet si thi {P}"},fact:{en:"Moo kratha literally means pork pan, and it is a casual group meal for friends and families, usually eaten in the evening in open-air or semi-open restaurants.",ko:"ムーガタは文字どおり豚肉のフライパンという意味です。友達や家族が集まって食べる気軽なグループ向けの食事で、主に夕方に屋外や半屋外のお店で食べます。"},where:[{name:"Moo kratha buffet restaurants across Bangkok",area:"other",note:{en:"Search Google Maps for moo kratha buffet near your hotel or venue. Many open in the evening and stay open late.",ko:"宿泊先や会場の近くで、Googleマップでムーガタのビュッフェを検索してみてください。夕方から開いて、遅くまで営業しているお店が多いです。"}}],imgQuery:"Moo kratha Thai barbecue",imgAlt:"A domed Thai moo kratha grill with meat and soup on a table",mapsQuery:"moo kratha buffet Bangkok"},{id:"mango-sticky-rice",cat:"desserts",name:{en:"Mango Sticky Rice",th:"\u0E02\u0E49\u0E32\u0E27\u0E40\u0E2B\u0E19\u0E35\u0E22\u0E27\u0E21\u0E30\u0E21\u0E48\u0E27\u0E07",ko:"マンゴースティッキーライス(カオニャオ・マムアン)"},rom:"khao niao ma-muang",desc:{en:"Ripe sweet mango slices beside warm sticky rice cooked in sweetened coconut milk, finished with a drizzle of salty-sweet coconut cream and often crispy mung beans. Thailand's best-known dessert.",ko:"よく熟した甘いマンゴーのそばに、ココナッツミルクで炊いた温かいもち米を添えて、塩気のある甘いココナッツクリームとカリカリの緑豆をトッピングします。タイを代表するデザートです。"},ingredients:{en:["ripe mango","glutinous rice","coconut milk","sugar","salt","crispy mung beans"],ko:["よく熟したマンゴー","もち米","ココナッツミルク","砂糖","塩","カリカリの緑豆"]},spice:0,price:[60,200],allergens:[],pork:"no",seafood:"no",veg:"yes",tags:["street","sweet","local-fav","kr-familiar","beginner"],beginner:{en:"Mango season peaks roughly March to June; outside that window mango is imported or less sweet, so quality varies. A portion is a decent size, so share one between two people after a big dinner. The coconut cream on top is mildly salty, which is intentional.",ko:"マンゴーの旬はだいたい3~6月です。それ以外の時期は甘さが控えめだったり輸入マンゴーだったりして、味に差があります。1皿がかなり大きいので、たくさん食べた夕食のあとは2人でシェアしても十分です。上にかけたココナッツクリームがちょっとしょっぱいのは、わざとそうしています。"},order:{en:"Ask for one portion of mango sticky rice.",ko:"マンゴースティッキーライスを1皿お願いしましょう。",th:"\u0E02\u0E2D\u0E02\u0E49\u0E32\u0E27\u0E40\u0E2B\u0E19\u0E35\u0E22\u0E27\u0E21\u0E30\u0E21\u0E48\u0E27\u0E07\u0E2B\u0E19\u0E36\u0E48\u0E07\u0E17\u0E35\u0E48{P}",rom:"khor khao niao ma-muang nueng thi {P}"},fact:{en:"The mango is traditionally a sweet variety such as nam dok mai, and the rice is soaked and steamed before being mixed with coconut milk, which is why it is both sticky and rich.",ko:"マンゴーは普通ナムドクマイのような甘い品種を使い、もち米は水に浸けて蒸してからココナッツミルクと混ぜます。だからモチモチなのに濃厚な味になります。"},where:[{name:"Mae Varee",area:"thonglor",note:{en:"A well-known fruit and mango sticky rice shop on Sukhumvit Soi 55 (Thonglor), famous for ripe mango in season. Expect a line at peak times.",ko:"トンロー(スクンビット通りソイ55)にある、有名なフルーツとマンゴースティッキーライスのお店です。旬のマンゴーで有名で、ピーク時間は行列ができます。"}},{name:"Market dessert stalls (e.g., Chatuchak Weekend Market)",area:"other",note:{en:"Many stalls sell packaged portions to take away. Price depends on mango size and season.",ko:"持ち帰り用にパックして売っている屋台が多いです。値段はマンゴーの大きさと季節によって変わります。"}}],imgQuery:"Mango sticky rice",imgAlt:"A plate of mango sticky rice with sliced mango and coconut cream",mapsQuery:"mango sticky rice Bangkok",geoQuery:"Mae Varee, Sukhumvit 55, Bangkok"},{id:"coconut-ice-cream",cat:"desserts",name:{en:"Coconut Ice Cream",th:"\u0E44\u0E2D\u0E28\u0E01\u0E23\u0E35\u0E21\u0E01\u0E30\u0E17\u0E34",ko:"ココナッツアイスクリーム(アイスクリーム・カティ)"},rom:"ai-sa-khrim ka-ti",desc:{en:"Creamy ice cream made from coconut milk, scooped into a cup, coconut shell or sweet bun, with toppings such as sticky rice, peanuts, sweet corn and red beans. Much lighter and less sugary than most Western ice cream.",ko:"ココナッツミルクで作った、なめらかなアイスクリームです。カップ、ココナッツの殻、または甘いパンに入れて、もち米、ピーナッツ、スイートコーン、小豆などのトッピングをのせてくれます。普通のアイスクリームより軽くて甘さ控えめです。"},ingredients:{en:["coconut milk","sugar","peanuts","sticky rice","sweet corn","red beans"],ko:["ココナッツミルク","砂糖","ピーナッツ","もち米ご飯","スイートコーン","小豆"]},spice:0,price:[30,80],allergens:["peanut","gluten"],pork:"no",seafood:"no",veg:"yes",tags:["street","sweet","local-fav","beginner"],beginner:{en:"Toppings are optional: the usual set is peanuts, sticky rice, corn and jelly. If you have a peanut allergy, say so clearly; all toppings sit in open trays. The bread-bun version contains wheat. Ice cream melts quickly in the heat, so eat it fast.",ko:"トッピングは自由です。普通はピーナッツ、もち米、コーン、ゼリーをのせてくれます。ピーナッツアレルギーがある場合は必ず伝えてください。トッピングは開けたままの容器に一緒に置かれています。パンに挟むタイプには小麦が入っています。暑くてすぐ溶けるので、早めに食べてくださいね。"},order:{en:"Ask for coconut ice cream with toppings, no peanuts if needed.",ko:"ココナッツアイスにトッピングをのせてください、とお願いしましょう。ピーナッツがダメなら抜いてもらってください。",th:"\u0E02\u0E2D\u0E44\u0E2D\u0E15\u0E34\u0E21\u0E01\u0E30\u0E17\u0E34\u0E2A\u0E2D\u0E07\u0E25\u0E39\u0E01 \u0E44\u0E21\u0E48\u0E43\u0E2A\u0E48\u0E16\u0E31\u0E48\u0E27{P}",rom:"khor ai-tim ka-ti song luk, mai sai thua {P}"},fact:{en:"In Thailand, 'ai-tim' (from 'ice cream') is the casual word for ice cream, and vendors often scoop it into a hot-dog bun, a unique Thai street style.",ko:"タイ語ではアイスクリームを気軽に「アイティム」と呼びます。ホットドッグのパンにアイスを挟んでくれるのも、タイならではの屋台スタイルです。"},where:[{name:"Chatuchak Weekend Market",area:"other",note:{en:"Coconut ice cream stalls are a regular sight around the market; weekend crowds are big and midday is very hot, so be prepared.",ko:"チャトゥチャック市場の中に、ココナッツアイスの屋台がよくあります。週末は人が多くて昼間は暑いので、覚悟して行ってください。"}}],imgQuery:"Thai coconut ice cream",imgAlt:"Scoops of Thai coconut ice cream with roasted peanuts",mapsQuery:"coconut ice cream Chatuchak Bangkok"},{id:"khanom-krok",cat:"desserts",name:{en:"Khanom Krok (Coconut Pancakes)",th:"\u0E02\u0E19\u0E21\u0E04\u0E23\u0E01",ko:"カノムクロック(ココナッツパンケーキ)"},rom:"kha-nom krok",desc:{en:"Bite-size coconut-rice pancakes cooked in a hot cast-iron mold with half-sphere hollows: crisp and caramelized at the edges, creamy and custardy in the middle. Often topped with scallion, corn or taro.",ko:"半球形のくぼみがある熱い鉄の型で焼いた、一口サイズのココナッツ米粉のパンケーキです。縁はカリッとキャラメル状で、中はクリーミーなカスタードのようです。青ねぎ、コーン、タロイモのトッピングが定番です。"},ingredients:{en:["rice flour","coconut milk","sugar","scallion","corn or taro (optional)"],ko:["米粉","ココナッツミルク","砂糖","小ねぎ","とうもろこしまたはタロイモ（お好みで）"]},spice:0,price:[20,45],allergens:[],pork:"no",seafood:"no",veg:"yes",tags:["street","sweet","local-fav","beginner"],beginner:{en:"Usually sold as 6-8 halves, pressed together in pairs. The scallion version is sweet-salty; the plain one is purely sweet. Eat them warm; they harden as they cool.",ko:"半分の形を6~8個、2つずつ合わせて1パックで売っています。青ねぎ入りは甘じょっぱく、プレーンは甘いだけです。温かいうちに食べてください。冷めると硬くなります。"},order:{en:"One box of khanom krok, please.",ko:"カノムクロックを1箱ください。",th:"\u0E02\u0E2D\u0E02\u0E19\u0E21\u0E04\u0E23\u0E01\u0E2B\u0E19\u0E36\u0E48\u0E07\u0E01\u0E25\u0E48\u0E2D\u0E07{P}",rom:"khor kha-nom krok nueng klong {P}"},fact:{en:"Krok means mortar in Thai, named after the shape of the hollowed cooking mold that looks like a stone mortar.",ko:"「クロック」はタイ語で臼を意味します。半球形のくぼみがある型が石臼のような形をしているので、この名が付きました。"},where:[{name:"Street and market stalls",area:"other",note:{en:"Made fresh to order in a small cast-iron mold on a cart. Common in the afternoon and evening.",ko:"屋台の小さな鉄の型で、注文を受けてから焼いてくれます。午後と夕方によく見かけます。"}}],imgQuery:"Khanom krok",imgAlt:"Khanom krok, small coconut-rice pancakes, cooking in a dimpled pan",mapsQuery:"khanom krok Bangkok"},{id:"bua-loy",cat:"desserts",name:{en:"Bua Loy (Rice Balls in Coconut Milk)",th:"\u0E1A\u0E31\u0E27\u0E25\u0E2D\u0E22",ko:"ブアロイ(ココナッツミルクのもち米団子)"},rom:"bua loi",desc:{en:"Chewy glutinous rice balls, often colored with pandan or purple sweet potato, floating in warm, lightly sweet and salty coconut milk. Commonly topped with a soft-boiled egg or taro.",ko:"パンダンや紫芋で色を付けたモチモチのもち米団子が、温かくて甘じょっぱいココナッツミルクに浮かんでいます。半熟卵やタロイモをのせて食べることもあります。"},ingredients:{en:["glutinous rice flour","coconut milk","palm sugar","salt","egg (optional)","taro or sweet potato"],ko:["もち米粉","ココナッツミルク","ヤシ砂糖","塩","卵（お好みで）","タロイモまたはさつまいも"]},spice:0,price:[30,70],allergens:["egg"],pork:"no",seafood:"no",veg:"yes",tags:["sweet","local-fav","kr-familiar"],beginner:{en:"Served warm, which is a nice change on a cool evening. If you want to avoid egg, ask for no egg: it is usually an optional add-on. The chewy balls are similar to the shiratama in Japanese zenzai, but the soup here is coconut milk, not sweet red bean.",ko:"温かい状態で出てくるので、涼しい夕方にぴったりです。卵が苦手なら抜いてもらってください。普通は追加で選べるトッピングです。モチモチの団子は日本のぜんざいの白玉に似ていますが、汁が小豆ではなくココナッツミルクという点が違います。"},order:{en:"One bowl of bua loy with egg.",ko:"ブアロイを1杯、卵入りでお願いします。",th:"\u0E02\u0E2D\u0E1A\u0E31\u0E27\u0E25\u0E2D\u0E22\u0E43\u0E2A\u0E48\u0E44\u0E02\u0E48\u0E2B\u0E19\u0E36\u0E48\u0E07\u0E16\u0E49\u0E27\u0E22{P}",rom:"khor bua-loi sai khai nueng thuay {P}"},fact:{en:"Bua loy literally means floating lotus, because the round balls float up in the soup like lotus blossoms on a pond.",ko:"ブアロイは文字どおり「浮かぶ蓮」という意味です。丸い団子が、池に浮かぶ蓮の花のようにスープに浮かび上がるからです。"},where:[{name:"Dessert shops and market stalls around Yaowarat",area:"yaowarat",note:{en:"Chinatown's dessert shops and food stalls often serve warm sweet soups, including bua loy.",ko:"チャイナタウンのデザート屋さんや屋台では、ブアロイのような温かくて甘いスープ系デザートをよく出しています。"}}],imgQuery:"Bua loy Thai dessert",imgAlt:"A bowl of colorful bua loy rice balls in coconut milk",mapsQuery:"bua loy Thai dessert Bangkok"},{id:"lod-chong",cat:"desserts",name:{en:"Lod Chong",th:"\u0E25\u0E2D\u0E14\u0E0A\u0E48\u0E2D\u0E07",ko:"ロートチョン(パンダン風味の米粉麺ココナッツデザート)"},rom:"lot chong",desc:{en:"Short green pandan-flavored rice-flour noodles served over shaved ice in sweet coconut milk, usually with palm sugar syrup. Cool, fragrant and slippery.",ko:"パンダンの香りがする緑色の米粉麺(短くてプルプル)を、かき氷と甘いココナッツミルクに入れたデザートです。パームシュガーのシロップを添えて、冷たくて香り高く、つるんとしています。"},ingredients:{en:["rice flour","pandan","coconut milk","palm sugar syrup","shaved ice"],ko:["米粉","パンダン","ココナッツミルク","ヤシ砂糖シロップ","かき氷用の氷"]},spice:0,price:[25,60],allergens:[],pork:"no",seafood:"no",veg:"yes",tags:["sweet","local-fav"],beginner:{en:"The noodles are soft, slippery and mildly sweet, closer to a drink with a chew than a noodle dish. If you have tried cendol in Singapore or Malaysia, it is a close cousin.",ko:"麺は柔らかくてつるつるで、ほんのり甘く、麺料理というよりモチモチ食感のある飲み物のようです。シンガポールやマレーシアのチェンドルを食べたことがあれば、その親戚のようなデザートです。"},order:{en:"One bowl of lod chong, please.",ko:"ロートチョンを1杯ください。",th:"\u0E02\u0E2D\u0E25\u0E2D\u0E14\u0E0A\u0E48\u0E2D\u0E07\u0E2B\u0E19\u0E36\u0E48\u0E07\u0E16\u0E49\u0E27\u0E22{P}",rom:"khor lot-chong nueng thuay {P}"},fact:{en:"Lod chong means to pass through a gap, because the noodles are traditionally pressed through a perforated tool into water to form short strands.",ko:"ロートチョンは「隙間を通り抜ける」という意味です。生地を穴の開いた道具で押して水に落とし、短い麺を作るからです。"},where:[{name:"Dessert counters in markets and food courts",area:"other",note:{en:"Often sold in sets with other sweet toppings. Bowls are small, so people often order two desserts.",ko:"ほかのトッピングとセットで売っていることが多いです。器が小さいので、デザートを2種類ずつ頼む人も多いです。"}}],imgQuery:"Lod chong Thai dessert",imgAlt:"Lod chong: green pandan rice-flour noodles in iced coconut milk",mapsQuery:"lod chong Thai dessert Bangkok"},{id:"banana-roti",cat:"desserts",name:{en:"Thai Banana Roti",th:"\u0E42\u0E23\u0E15\u0E35\u0E01\u0E25\u0E49\u0E27\u0E22",ko:"バナナロティ(タイ風バナナパンケーキ)"},rom:"ro-ti kluay",desc:{en:"A thin flaky roti folded around sliced banana and egg, fried on a griddle, chopped into pieces and drizzled with sweetened condensed milk. Chocolate or Nutella is a common upgrade.",ko:"薄くてパリッとしたロティでバナナのスライスと卵を包み、鉄板で焼いて、切り分けて練乳をかけてくれます。チョコレートやヌテラの追加が定番です。"},ingredients:{en:["roti dough","banana","egg","sweetened condensed milk","chocolate sauce (optional)"],ko:["ロティ生地","バナナ","卵","練乳","チョコレートソース（お好みで）"]},spice:0,price:[30,70],allergens:["gluten","egg","dairy"],pork:"no",seafood:"no",veg:"option",tags:["street","sweet","late-night","beginner","local-fav"],beginner:{en:"A very sweet, warm street dessert; one portion is fine to share between two people. If you do not want egg or chocolate, say so before it is fried. The vendor cooks it to order, so it takes a few minutes. The savory roti-with-curry option is in the street section under Roti.",ko:"とても甘くて温かい屋台デザートです。1皿を2人でシェアしても十分です。卵やチョコレートが苦手なら、焼く前に伝えてください。注文を受けてから焼くので、数分かかります。カレーと食べるしょっぱいロティは、屋台フードのロティの項目を見てください。"},order:{en:"Roti with banana and egg, with chocolate if you like.",ko:"バナナと卵入りのロティをください。お好みでチョコレートも追加できます。",th:"\u0E02\u0E2D\u0E42\u0E23\u0E15\u0E35\u0E01\u0E25\u0E49\u0E27\u0E22\u0E43\u0E2A\u0E48\u0E44\u0E02\u0E48 \u0E43\u0E2A\u0E48\u0E0A\u0E47\u0E2D\u0E01\u0E42\u0E01\u0E41\u0E25\u0E15{P}",rom:"khor ro-ti kluay sai khai, sai chok-ko-laet {P}"},fact:{en:"A big-city staple in the evenings: watching the vendor stretch the dough thin, flip it in the air and fold it is part of the experience.",ko:"夕方になると、街のあちこちで出会えます。屋台のお兄さんが生地を薄く伸ばして、空中で投げて折りたたむ姿を見るのも楽しみのひとつです。"},where:[{name:"Roti carts around Khao San Road and night markets",area:"other",note:{en:"One of the most common street desserts in tourist areas. Many carts stay open into the evening.",ko:"観光エリアでいちばんよく見かける屋台デザートです。夕方まで開いている屋台が多いです。"}}],imgQuery:"Roti kluay banana roti Thailand",imgAlt:"Roti with banana, folded and drizzled with condensed milk",mapsQuery:"banana roti Bangkok"},{id:"thai-shaved-ice",cat:"desserts",name:{en:"Thai Shaved Ice (Nam Kaeng Sai)",th:"\u0E19\u0E49\u0E33\u0E41\u0E02\u0E47\u0E07\u0E43\u0E2A",ko:"ナムケンサイ(タイ風かき氷)"},rom:"nam khaeng sai",desc:{en:"A bowl of shaved ice with a choice of toppings (jellies, red beans, sweet corn, taro, palm seed, sweet potato) and flavored syrup, often finished with a drizzle of sweetened condensed milk. Café versions also borrow Japanese-style kakigori.",ko:"かき氷の上に、ゼリー、小豆、スイートコーン、タロイモ、パームシード、サツマイモなどのトッピングを選んで、甘いシロップと練乳をかけて食べるかき氷です。カフェでは日本風のかき氷スタイルも一緒に出しています。"},ingredients:{en:["shaved ice","sweet syrup","evaporated or condensed milk","jellies","red beans","sweet corn","taro","palm seed"],ko:["かき氷用の氷","甘いシロップ","練乳（無糖または加糖）","ゼリー","小豆","スイートコーン","タロイモ","パームの実"]},spice:0,price:[30,200],allergens:["dairy"],pork:"no",seafood:"no",veg:"yes",tags:["sweet","kr-familiar","local-fav"],beginner:{en:"Street-style nam kaeng sai is coarser and cheaper (about 30-70 THB) than the fluffy kakigori of Japanese dessert cafés, and it is built around chewy toppings and bright syrups rather than fluffy ice. Bangkok dessert cafés also serve Japanese-style kakigori, usually 120-250 THB. They are similar in spirit but not identical. Ice and toppings are the main hygiene question; stick to busy shops.",ko:"屋台のナムケンサイは、日本のデザートカフェのふわふわかき氷より氷が粗くて安いです(30~70バーツ)。ふわふわの氷ではなく、モチモチのトッピングとカラフルなシロップが中心です。バンコクのデザートカフェでは日本風のかき氷も出していて、値段は普通120~250バーツです。似た雰囲気ですが、同じではありません。衛生面が気になるなら、お客さんの多いお店を選んでください。"},order:{en:"Ask for shaved ice and pick the toppings; ask for less sweet.",ko:"かき氷を注文して、トッピングを選びましょう。甘さ控えめでとお願いしてもOKです。",th:"\u0E02\u0E2D\u0E19\u0E49\u0E33\u0E41\u0E02\u0E47\u0E07\u0E43\u0E2A\u0E2B\u0E19\u0E36\u0E48\u0E07\u0E16\u0E49\u0E27\u0E22 \u0E2B\u0E27\u0E32\u0E19\u0E19\u0E49\u0E2D\u0E22{P}",rom:"khor nam-khaeng-sai nueng thuay, wan noi {P}"},fact:{en:"Classic Thai shaved ice is often drizzled with a bright red 'nam daeng' syrup, usually sala-flavored, a sweet taste a bit like cream soda.",ko:"昔ながらのタイのかき氷には、鮮やかな赤い「ナムデーン」シロップをかけることが多いです。たいていサラ味で、クリームソーダのような甘さです。"},where:[{name:"Dessert caf\xE9s and malls around Siam",area:"siam",note:{en:"Siam's shopping malls and Siam Square have many dessert caf\xE9s, including bingsu-style shops.",ko:"サイアムのショッピングモールとサイアムスクエアに、かき氷スタイルのお店を含めてデザートカフェがたくさんあります。"}},{name:"Market and food-court dessert counters",area:"other",note:{en:"The cheapest, most traditional Thai version, often with a choice of toppings in glass trays.",ko:"いちばん安くて伝統的なタイ式です。ガラスのケースに入ったトッピングを選んでのせます。"}}],imgQuery:"Nam khaeng sai Thai shaved ice dessert",imgAlt:"Thai shaved ice dessert with colorful toppings and syrup",mapsQuery:"Thai shaved ice dessert Bangkok"},{id:"thai-milk-tea",cat:"drinks",name:{en:"Thai Milk Tea (Cha Yen)",th:"\u0E0A\u0E32\u0E40\u0E22\u0E47\u0E19",ko:"チャーイェン(タイミルクティー)"},rom:"cha yen",desc:{en:"Strongly brewed black tea spiced with star anise and other spices, sweetened with sugar and condensed milk, poured over ice and topped with evaporated milk. Famously orange, creamy and very sweet.",ko:"八角などのスパイスを入れて濃く煮出した紅茶に、砂糖と練乳を入れて氷の上に注ぎ、無糖練乳(エバミルク)をのせます。オレンジ色で、クリーミーで、とても甘いです。"},ingredients:{en:["Thai black tea mix","sugar","condensed milk","evaporated milk","ice"],ko:["タイ式紅茶ミックス","砂糖","練乳","無糖練乳","氷"]},spice:0,price:[25,80],allergens:["dairy"],pork:"no",seafood:"no",veg:"yes",caffeine:!0,tags:["street","sweet","local-fav","beginner"],beginner:{en:"Very sweet by default; one cup can have as much sugar as a dessert. Say 'wan noi' (less sweet) or 'mai sai nam tan' (no sugar added; condensed milk still sweetens it). Street cups cost about 25-45 THB, caf\xE9s 60-100 THB. The orange color comes largely from the tea mix, which often contains food coloring.",ko:"基本はとても甘いです。1杯にデザート並みの砂糖が入っていることもあります。「ワーンノーイ」(甘さ控えめ)または「マイサイ・ナムターン」(砂糖抜き)と伝えてください。練乳が入るので、完全に甘くなくなるわけではありません。屋台の1杯は25~45バーツ、カフェは60~100バーツです。オレンジ色は、ほとんどが茶葉ミックスに入っている着色料のおかげです。"},order:{en:"Thai iced tea, less sweet.",ko:"タイ風アイスミルクティーを、甘さ控えめでお願いします。",th:"\u0E02\u0E2D\u0E0A\u0E32\u0E40\u0E22\u0E47\u0E19\u0E2B\u0E27\u0E32\u0E19\u0E19\u0E49\u0E2D\u0E22{P}",rom:"khor cha yen wan noi {P}"},fact:{en:"Thai milk tea is Thailand's best-known drink abroad, and in Bangkok it is poured into tall plastic cups from street carts and sold in sealed plastic bags at many stalls.",ko:"チャーイェンは海外でいちばん有名なタイの飲み物です。バンコクでは、屋台で大きなプラスチックカップやビニール袋に入れて売っています。"},where:[{name:"Street drink carts and caf\xE9s across Bangkok",area:"other",note:{en:"Look for the big plastic tubs of orange tea and a stack of cups.",ko:"オレンジ色のお茶が入った大きな容器と、カップが積まれている屋台を探してください。"}}],imgQuery:"Thai iced tea",imgAlt:"A glass of orange Thai iced milk tea",mapsQuery:"Thai iced tea Bangkok"},{id:"oliang",cat:"drinks",name:{en:"Oliang (Thai Iced Black Coffee)",th:"\u0E42\u0E2D\u0E40\u0E25\u0E35\u0E49\u0E22\u0E07",ko:"オーリアン(タイ風アイスブラックコーヒー)"},rom:"o-liang",desc:{en:"Strong Thai-style black coffee, brewed through a cloth filter, sweetened with sugar and served over ice. Traditional blends can include roasted grains, giving it a deep, toasty flavor. No milk by default.",ko:"布のフィルターで濃く淹れたタイ式ブラックコーヒーに砂糖を入れて、氷と一緒に出します。伝統的なブレンドには炒った穀物が入っていることもあり、香ばしい味わいです。基本はミルクなしで飲みます。"},ingredients:{en:["Thai-style coffee blend","sugar","ice"],ko:["タイ式コーヒーブレンド","砂糖","氷"]},spice:0,price:[20,60],allergens:[],pork:"no",seafood:"no",veg:"yes",caffeine:!0,tags:["street","sweet","local-fav"],beginner:{en:"Not as bitter as an Americano, but very sweet unless you ask. It is the Thai answer to iced black coffee, and the flavor is stronger and earthier than a typical caf\xE9 coffee. Say 'wan noi' or 'mai sai nam tan' for less sugar.",ko:"アメリカーノほど苦くはありませんが、頼まなければとても甘いです。タイ式のアイスブラックコーヒーで、普通のカフェのコーヒーより濃くて香ばしいです。甘さを控えるには「ワーンノーイ」か「マイサイ・ナムターン」と伝えてください。"},order:{en:"Oliang, less sweet.",ko:"オーリアンを、甘さ控えめでお願いします。",th:"\u0E02\u0E2D\u0E42\u0E2D\u0E40\u0E25\u0E35\u0E49\u0E22\u0E07\u0E2B\u0E27\u0E32\u0E19\u0E19\u0E49\u0E2D\u0E22{P}",rom:"khor o-liang wan noi {P}"},fact:{en:"The name comes from Teochew Chinese for black and cold, reflecting the Chinese-Thai coffee shop culture of old Bangkok.",ko:"名前は、中国の潮州語で「黒くて冷たい」という意味から来ています。昔のバンコクの中華系コーヒー店の文化を伝えています。"},where:[{name:"Old-style coffee stalls and Chinese-Thai coffee shops",area:"yaowarat",note:{en:"Common in Yaowarat and other older neighborhoods.",ko:"ヤワラートのような古い街並みの地域でよく見かけます。"}}],imgQuery:"Oliang Thai iced coffee",imgAlt:"A glass of Thai iced black coffee (oliang)",mapsQuery:"oliang Thai iced coffee Bangkok"},{id:"thai-coffee",cat:"drinks",name:{en:"Thai Coffee (Kafae Boran / Kafae Yen)",th:"\u0E01\u0E32\u0E41\u0E1F\u0E42\u0E1A\u0E23\u0E32\u0E13 / \u0E01\u0E32\u0E41\u0E1F\u0E40\u0E22\u0E47\u0E19",ko:"カフェー・ボーラン / カフェー・イェン(タイコーヒー)"},rom:"ka-fae bo-ran / ka-fae yen",desc:{en:"Old-style Thai coffee is brewed strong through a cloth sock filter and mixed with condensed milk. Kafae boran is the traditional (hot or iced) cup; kafae yen is the iced version you see at every drink cart.",ko:"昔ながらのタイコーヒーは、布のフィルターで濃く淹れて練乳を入れます。カフェー・ボーランは昔ながらの一杯(ホットまたはアイス)で、カフェー・イェンはどのドリンク屋台でも見かけるアイスコーヒーです。"},ingredients:{en:["robusta coffee blend","condensed milk","sugar","evaporated milk","ice"],ko:["ロブスタコーヒーブレンド","練乳","砂糖","無糖練乳","氷"]},spice:0,price:[25,80],allergens:["dairy"],pork:"no",seafood:"no",veg:"yes",caffeine:!0,tags:["street","sweet","local-fav"],beginner:{en:"Strong, sweet and creamy; it has a lot of sugar and caffeine, so one cup in the afternoon is plenty. Say 'wan noi' for less sweet. Caf\xE9 coffees (Americano, latte) are priced much higher (about 70-150 THB) than street cups.",ko:"濃くて甘くてクリーミーです。砂糖もカフェインも多いので、午後は1杯で十分です。甘さを控えるには「ワーンノーイ」と伝えてください。カフェのコーヒー(アメリカーノ、ラテ)は、屋台の1杯よりずっと高いです(約70~150バーツ)。"},order:{en:"Iced Thai coffee, less sweet.",ko:"アイスのタイコーヒーを、甘さ控えめでお願いします。",th:"\u0E02\u0E2D\u0E01\u0E32\u0E41\u0E1F\u0E40\u0E22\u0E47\u0E19\u0E2B\u0E27\u0E32\u0E19\u0E19\u0E49\u0E2D\u0E22{P}",rom:"khor ka-fae yen wan noi {P}"},fact:{en:"'Boran' means ancient or old-fashioned, referring to the traditional cloth-sock brewing method that coffee shops in Thailand have used for generations.",ko:"「ボーラン」は昔ながらという意味です。タイのコーヒー店が代々使ってきた、布のフィルターで淹れる方法を指しています。"},where:[{name:"Street coffee carts and traditional coffee shops",area:"other",note:{en:"Look for the cloth filter hanging over a metal pot; typical at morning stalls and older shops.",ko:"金属のポットの上に布のフィルターが掛かっているお店を探してください。朝の屋台や古いお店でよく見かけます。"}}],imgQuery:"Thai iced coffee",imgAlt:"A glass of Thai iced coffee with condensed milk",mapsQuery:"Thai coffee kafae boran Bangkok"},{id:"coconut-water",cat:"drinks",name:{en:"Coconut Water (Nam Maprao)",th:"\u0E19\u0E49\u0E33\u0E21\u0E30\u0E1E\u0E23\u0E49\u0E32\u0E27",ko:"ココナッツウォーター(ナム・マプラーオ)"},rom:"nam ma-phrao",desc:{en:"Fresh water from young green coconuts, usually served chilled in the whole coconut, or poured over ice in a cup. Lightly sweet and refreshing in the heat; you can scoop out the soft flesh with a spoon afterwards.",ko:"若い緑のココナッツから取れる新鮮な水です。冷やしたココナッツをそのまま出してくれたり、カップに氷と一緒に注いでくれたりします。ほんのり甘くて、暑いときにさわやかです。飲み終わったあとは、柔らかい果肉をスプーンですくって食べられます。"},ingredients:{en:["young coconut water","coconut flesh (optional)"],ko:["若いココナッツの水","ココナッツの果肉（お好みで）"]},spice:0,price:[30,80],allergens:[],pork:"no",seafood:"no",veg:"yes",caffeine:!1,tags:["street","beginner","post-practice","local-fav"],beginner:{en:"Naturally mildly sweet with no added sugar when fresh from a whole coconut. Bottled or blended versions can be sweetened. Ask for the coconut to be opened so you can eat the flesh. It is a good option for rehydrating in the heat, but it is not an electrolyte-engineered sports drink.",ko:"丸ごとのココナッツからそのまま注いでもらえば、砂糖なしでほんのり甘いです。ボトル入りやミキサーで作った飲み物には、砂糖が入っていることがあります。果肉も食べられるように、ココナッツを開けてもらいましょう。暑いときの水分補給にはいいですが、電解質を調整したスポーツドリンクではありません。"},order:{en:"One chilled coconut, please.",ko:"冷たいココナッツを1つください。",th:"\u0E02\u0E2D\u0E21\u0E30\u0E1E\u0E23\u0E49\u0E32\u0E27\u0E40\u0E22\u0E47\u0E19\u0E2B\u0E19\u0E36\u0E48\u0E07\u0E25\u0E39\u0E01{P}",rom:"khor ma-phrao yen nueng luk {P}"},fact:{en:"The aromatic 'nam hom' coconut variety is prized in Thailand for its naturally sweet water and fragrance.",ko:"タイでは、香りが良くて自然な甘さの「ナムホーム」という品種のココナッツウォーターが評価されています。"},where:[{name:"Coconut vendors at markets, parks and tourist areas",area:"other",note:{en:"Common at fruit stands and in markets such as Chatuchak. Check the price before ordering at tourist spots.",ko:"フルーツの屋台や、チャトゥチャックのような市場でよく見かけます。観光地では、注文する前に値段を確認してください。"}}],imgQuery:"Young coconut water Thailand",imgAlt:"A chilled green coconut with a straw",mapsQuery:"fresh coconut water Bangkok"},{id:"sugarcane-juice",cat:"drinks",name:{en:"Sugarcane Juice (Nam Oi)",th:"\u0E19\u0E49\u0E33\u0E2D\u0E49\u0E2D\u0E22",ko:"サトウキビジュース(ナム・オーイ)"},rom:"nam oi",desc:{en:"Fresh sugarcane pressed through a roller on the spot, poured over ice and served in a plastic cup or bag. Naturally sweet, grassy and refreshing.",ko:"サトウキビをローラーで搾ってその場で作るジュースです。氷と一緒にプラスチックカップやビニール袋に入れてくれます。自然な甘さで、草のような香りがしてさわやかです。"},ingredients:{en:["sugarcane juice","ice","sometimes a pinch of salt or lime"],ko:["サトウキビジュース","氷","ときどき塩ひとつまみまたはライム"]},spice:0,price:[15,40],allergens:[],pork:"no",seafood:"no",veg:"yes",caffeine:!1,tags:["street","sweet","local-fav"],beginner:{en:"Sweet on its own with no syrup needed, so you cannot make it unsweetened. It is hard to judge portions: a small cup is plenty. Watch it being made and choose a stall with a clean press and fresh ice.",ko:"シロップなしでも甘いので、甘さを抜くことはできません。小さなカップ1杯で十分です。その場で搾っているか、機械と氷が清潔かを見て選びましょう。"},order:{en:"One sugarcane juice, please.",ko:"サトウキビジュースを1杯ください。",th:"\u0E02\u0E2D\u0E19\u0E49\u0E33\u0E2D\u0E49\u0E2D\u0E22\u0E2B\u0E19\u0E36\u0E48\u0E07\u0E41\u0E01\u0E49\u0E27{P}",rom:"khor nam oi nueng kaew {P}"},fact:{en:"Sugarcane juice stalls are easy to spot from the stacked cane stalks and the noisy roller press next to the cart.",ko:"屋台の横に積まれたサトウキビの茎と、うるさいローラー式の搾り機ですぐに見つかります。"},where:[{name:"Street carts at markets and near BTS/MRT exits",area:"other",note:{en:"Usually a cart with cane stalks stacked at the side.",ko:"横にサトウキビの茎を積んでいる屋台が普通です。"}}],imgQuery:"Sugarcane juice Thailand street",imgAlt:"Fresh sugarcane juice in a plastic cup with ice",mapsQuery:"sugarcane juice Bangkok"},{id:"butterfly-pea-lemonade",cat:"drinks",name:{en:"Butterfly Pea Lemonade",th:"\u0E19\u0E49\u0E33\u0E2D\u0E31\u0E0D\u0E0A\u0E31\u0E19\u0E21\u0E30\u0E19\u0E32\u0E27",ko:"バタフライピー・レモネード(ナム・アンチャン・マナーオ)"},rom:"nam an-chan ma-nao",desc:{en:"A blue herbal drink made from butterfly pea flowers (anchan) that turns purple or pink when lime juice is added. Sweet-sour, light and floral.",ko:"バタフライピー(アンチャン)の花で作った青いハーブドリンクです。ライム果汁を入れると紫色やピンク色に変わります。甘酸っぱくて軽く、花の香りがします。"},ingredients:{en:["butterfly pea flowers","lime juice","sugar syrup","ice"],ko:["バタフライピーの花","ライム果汁","シュガーシロップ","氷"]},spice:0,price:[20,120],allergens:[],pork:"no",seafood:"no",veg:"yes",caffeine:!1,tags:["sweet","beginner"],beginner:{en:"Street cups cost about 20-40 THB; caf\xE9 versions with soda or sparkling water cost around 70-120 THB. The flower itself has almost no flavor; the taste comes from the lime and sugar. Often served as a blue drink with a lime wedge so you can change the color yourself.",ko:"屋台のカップは20~40バーツ、ソーダや炭酸水を入れたカフェ版は70~120バーツくらいです。花自体はほとんど味がなく、味はライムと砂糖から来ています。ライムのくし切りを別に付けて、自分で色を変えて楽しめるお店もあります。"},order:{en:"Butterfly pea lemonade, less sweet.",ko:"バタフライピー・レモネードを、甘さ控えめでお願いします。",th:"\u0E02\u0E2D\u0E19\u0E49\u0E33\u0E2D\u0E31\u0E0D\u0E0A\u0E31\u0E19\u0E21\u0E30\u0E19\u0E32\u0E27\u0E2B\u0E27\u0E
