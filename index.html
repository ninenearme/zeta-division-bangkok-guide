ng one.",ko:"壊れたケーブルや、スマホの写真を見せましょう。たいてい合うものを持ってきてくれます。"},level:"polite"},{id:"team-multi-discount",cat:"team",en:"Can I get a discount if I buy several?",th:"\u0E16\u0E49\u0E32\u0E0B\u0E37\u0E49\u0E2D\u0E2B\u0E25\u0E32\u0E22\u0E0A\u0E34\u0E49\u0E19\u0E25\u0E14\u0E44\u0E14\u0E49\u0E44\u0E2B\u0E21{Q}",rom:"tha sue lai chin lot dai mai {Q}",ko:"何個か買ったら安くなりますか?",ctx:{en:"When buying multiple items for a team. Works at markets and independent shops, rarely at fixed-price chains.",ko:"チーム用に複数買うときに使います。市場や個人商店では通じますが、定価制のチェーン店ではまず通じません。"},level:"polite"},{id:"team-tax-invoice",cat:"team",en:"Tax invoice, please",th:"\u0E02\u0E2D\u0E43\u0E1A\u0E01\u0E33\u0E01\u0E31\u0E1A\u0E20\u0E32\u0E29\u0E35\u0E14\u0E49\u0E27\u0E22{P}",rom:"khor bai gam-gap pha-see duai {P}",ko:"税務用の領収書(タックスインボイス)をお願いします",ctx:{en:"For company expense claims. Ask before paying; some shops need the company name and tax ID and cannot issue later.",ko:"会社の経費精算に必要なときに使います。支払う前に頼みましょう。会社名と税務情報が必要で、後からは発行できない店もあります。"},level:"polite"},{id:"team-book-van",cat:"team",en:"I\u2019d like to book a van for 8 people",th:"\u0E15\u0E49\u0E2D\u0E07\u0E01\u0E32\u0E23\u0E08\u0E2D\u0E07\u0E23\u0E16\u0E15\u0E39\u0E49\u0E2A\u0E33\u0E2B\u0E23\u0E31\u0E1A\u0E41\u0E1B\u0E14\u0E04\u0E19{P}",rom:"tong-gan jong rot-too sam-rap paet khon {P}",ko:"8人乗りのバンを予約したいです",ctx:{en:"For a group transfer. Tell them the date, time, pickup point and number of bags too.",ko:"グループ移動用です。日付、時間、ピックアップ場所、荷物の数も一緒に伝えましょう。"},level:"polite"},{id:"team-van-price",cat:"team",en:"How much for the van?",th:"\u0E23\u0E16\u0E15\u0E39\u0E49\u0E23\u0E32\u0E04\u0E32\u0E40\u0E17\u0E48\u0E32\u0E44\u0E2B\u0E23\u0E48{Q}",rom:"rot-too ra-kha tao-rai {Q}",ko:"バンはいくらですか?",ctx:{en:"Confirm the total price first, including tolls, waiting time and any extra charge.",ko:"高速料金、待機時間、追加料金を含めた総額を先に確認しましょう。"},level:"polite"},{id:"team-driver-wait",cat:"team",en:"Can you wait for us a moment?",th:"\u0E0A\u0E48\u0E27\u0E22\u0E23\u0E2D\u0E2A\u0E31\u0E01\u0E04\u0E23\u0E39\u0E48\u0E44\u0E14\u0E49\u0E44\u0E2B\u0E21{Q}",rom:"chuai ro sak-khroo dai mai {Q}",ko:"少し待っていただけますか?",ctx:{en:"Asking a driver to wait while the team loads equipment or finishes.",ko:"チームが機材を積み込んだり、用事を済ませたりするまで、運転手さんに待ってもらうときに使います。"},level:"polite"},{id:"team-table-eight",cat:"team",en:"A table for eight, please",th:"\u0E02\u0E2D\u0E42\u0E15\u0E4A\u0E30\u0E2A\u0E33\u0E2B\u0E23\u0E31\u0E1A\u0E41\u0E1B\u0E14\u0E04\u0E19{P}",rom:"khor to sam-rap paet khon {P}",ko:"8名の席をお願いします",ctx:{en:"For group meals. Large groups should call ahead or arrive off-peak.",ko:"グループでの食事のときに使います。大人数の場合は事前に電話するか、混む時間を避けましょう。"},level:"polite"},{id:"team-order-for-group",cat:"team",en:"I\u2019d like to order food for ten people",th:"\u0E02\u0E2D\u0E2A\u0E31\u0E48\u0E07\u0E2D\u0E32\u0E2B\u0E32\u0E23\u0E2A\u0E33\u0E2B\u0E23\u0E31\u0E1A\u0E2A\u0E34\u0E1A\u0E04\u0E19{P}",rom:"khor sang a-han sam-rap sip khon {P}",ko:"10人分の料理を注文したいです",ctx:{en:"For catering or a big delivery order. Ask for the cooking time, then confirm allergies or dietary needs.",ko:"ケータリングや大量のデリバリー注文に使います。調理時間を聞いて、アレルギーや食事制限も確認しましょう。"},level:"polite"},{id:"team-split-bill",cat:"team",en:"Can we split the bill?",th:"\u0E02\u0E2D\u0E41\u0E22\u0E01\u0E1A\u0E34\u0E25\u0E44\u0E14\u0E49\u0E44\u0E2B\u0E21{Q}",rom:"khor yaek bin dai mai {Q}",ko:"別々に会計できますか?",ctx:{en:"When a group wants to pay separately. Some places do not split, so ask early.",ko:"グループで別々に支払いたいときに使います。分割払いできない店もあるので、早めに聞きましょう。"},level:"polite"},{id:"team-pay-together",cat:"team",en:"We\u2019ll pay together",th:"\u0E08\u0E48\u0E32\u0E22\u0E23\u0E27\u0E21\u0E01\u0E31\u0E19{P}",rom:"jai ruam gan {P}",ko:"まとめて払います",ctx:{en:"One person pays the whole bill for the group.",ko:"1人がグループ全員の会計をまとめて払うときに使います。"},level:"polite"},{id:"team-meet-lobby",cat:"team",en:"Let\u2019s meet in the lobby at 10",th:"\u0E40\u0E08\u0E2D\u0E01\u0E31\u0E19\u0E17\u0E35\u0E48\u0E25\u0E47\u0E2D\u0E1A\u0E1A\u0E35\u0E49\u0E15\u0E2D\u0E19\u0E2A\u0E34\u0E1A\u0E42\u0E21\u0E07{P}",rom:"jer gan thee lop-bee ton sip mong {P}",ko:"10時にロビーで会いましょう",ctx:{en:"Coordinating with local staff or drivers. Thai time words: 10 am = sip mong chao (10 morning).",ko:"現地のスタッフや運転手と約束をするときに使います。タイ語の時間表現:午前10時=「シップ モーン チャーオ(10時 朝)」。"},level:"polite"},{id:"team-on-my-way",cat:"team",en:"On my way",th:"\u0E01\u0E33\u0E25\u0E31\u0E07\u0E44\u0E1B{P}",rom:"gam-lang pai {P}",ko:"向かっています",ctx:{en:"A short update when you are heading to a meeting point.",ko:"待ち合わせ場所に向かう途中で、簡単に知らせるときに使います。"},level:"polite"},{id:"team-arrived",cat:"team",en:"I\u2019ve arrived",th:"\u0E21\u0E32\u0E16\u0E36\u0E07\u0E41\u0E25\u0E49\u0E27{P}",rom:"ma thueng laeo {P}",ko:"着きました",ctx:{en:"Message or call to a driver, host or teammate when you have reached the meeting point.",ko:"待ち合わせ場所に着いたとき、運転手、ホスト、チームメイトにメッセージや電話で知らせるときに使います。"},level:"polite"},{id:"team-sorry-late",cat:"team",en:"Sorry for being late",th:"\u0E02\u0E2D\u0E42\u0E17\u0E29\u0E17\u0E35\u0E48\u0E21\u0E32\u0E0A\u0E49\u0E32{P}",rom:"khor thot thee ma chaa {P}",ko:"遅れてすみません",ctx:{en:"When you arrive after the agreed time. Bangkok traffic is a known cause, but a short apology is still polite.",ko:"約束の時間より遅れて着いたときに使います。バンコクの渋滞はよくある理由ですが、一言謝るのが礼儀です。"},level:"polite"},{id:"team-postpone",cat:"team",en:"Can we change the time?",th:"\u0E02\u0E2D\u0E40\u0E25\u0E37\u0E48\u0E2D\u0E19\u0E40\u0E27\u0E25\u0E32\u0E44\u0E14\u0E49\u0E44\u0E2B\u0E21{Q}",rom:"khor luean we-la dai mai {Q}",ko:"時間を変更してもいいですか?",ctx:{en:"Politely ask to move a pickup or booking. Give notice as early as possible.",ko:"ピックアップや予約の時間変更を丁寧にお願いするときに使います。できるだけ早く伝えましょう。"},level:"polite"}],Ta=[{id:"q-hello",phraseId:"hello",type:"meaning",q:{en:"What does this mean?",ko:"どういう意味でしょう?"},th:"\u0E2A\u0E27\u0E31\u0E2A\u0E14\u0E35{P}",rom:"sa-wat-dee {P}",options:[{en:"Thank you",ko:"ありがとうございます"},{en:"Hello",ko:"こんにちは"},{en:"I\u2019m sorry",ko:"ごめんなさい"},{en:"Delicious",ko:"おいしいです"}],answer:1,explain:{en:"Sa-wat-dee is hello (and goodbye). Add khrap (men) or kha (women) for politeness.",ko:"「サワッディー」は「こんにちは」(さようならにも使います)です。丁寧にするには、男性は「クラップ」、女性は「カー」をつけます。"}},{id:"q-not-spicy",phraseId:"not-spicy",type:"meaning",q:{en:"What does this mean?",ko:"どういう意味でしょう?"},th:"\u0E44\u0E21\u0E48\u0E40\u0E1C\u0E47\u0E14{P}",rom:"mai phet {P}",options:[{en:"Not spicy",ko:"辛くしないでください"},{en:"No ice",ko:"氷抜きでお願いします"},{en:"No pork",ko:"豚肉抜きでお願いします"},{en:"Not sweet",ko:"甘くしないでください"}],answer:0,explain:{en:'"Mai" means not, "phet" means spicy. Related phrases: mai sai nam-khaeng (no ice), mai sai moo (no pork).',ko:"「マイ」は「~ない」、「ペット」は「辛い」という意味です。氷抜きは「マイ サイ ナムケン」、豚肉抜きは「マイ サイ ムー」です。"}},{id:"q-use-meter",phraseId:"use-meter",type:"situation",q:{en:"You get into a street taxi and the driver quotes a high fixed price. What do you say?",ko:"流しのタクシーに乗ったら、運転手さんが高い定額料金を言ってきました。なんと言いますか?"},options:[{en:"Please stop here",ko:"ここで止めてください"},{en:"Turn left",ko:"左に曲がってください"},{en:"Is it far?",ko:"遠いですか?"},{en:"Please use the meter",ko:"メーターを使ってください"}],answer:3,explain:{en:'"Poet mi-ter duai {P}" asks the driver to turn on the meter. If they refuse, politely get out and find another taxi, or use Grab.',ko:"「ペット ミッター ドゥアイ」は、メーターを入れてほしいというお願いです。断られたら、丁寧に降りて別のタクシーに乗るか、Grabを使いましょう。"}},{id:"q-how-much",phraseId:"how-much",type:"meaning",q:{en:"What does this mean?",ko:"どういう意味でしょう?"},th:"\u0E2D\u0E31\u0E19\u0E19\u0E35\u0E49\u0E40\u0E17\u0E48\u0E32\u0E44\u0E2B\u0E23\u0E48{Q}",rom:"an-nee tao-rai {Q}",options:[{en:"Where is this?",ko:"これはどこですか?"},{en:"Is this spicy?",ko:"これは辛いですか?"},{en:"How much is this?",ko:"これはいくらですか?"},{en:"Can I try this on?",ko:"これ、試着してもいいですか?"}],answer:2,explain:{en:'"An-nee" = this one, "tao-rai" = how much. Point at the item while asking.',ko:"「アン ニー」は「これ」、「タオライ」は「いくら」です。商品を指さしながら聞きましょう。"}},{id:"q-allergy",phraseId:"allergy-peanut",type:"situation",q:{en:"You have a true peanut allergy and are about to order pad thai. What should you say?",ko:"ピーナッツアレルギーがあるのに、パッタイを注文しようとしています。なんと言うべきでしょう?"},options:[{en:"Delicious",ko:"おいしいです"},{en:"I\u2019ll have this one",ko:"これにします"},{en:"I\u2019m allergic to peanuts",ko:"ピーナッツアレルギーがあります"},{en:"Extra rice, please",ko:"ご飯を追加でお願いします"}],answer:2,explain:{en:'"Phae thua li-song" means allergic to peanuts. Use "mai sai" (no adding) only for preferences, not for real allergies.',ko:"「ペー トゥア リソン」は「ピーナッツアレルギー」という意味です。「マイ サイ(入れないで)」は好みの場合だけで、本当のアレルギーには「ペー」を使いましょう。"}},{id:"q-help",phraseId:"help",type:"meaning",q:{en:"What does this mean?",ko:"どういう意味でしょう?"},th:"\u0E0A\u0E48\u0E27\u0E22\u0E14\u0E49\u0E27\u0E22{P}",rom:"chuai duai {P}",options:[{en:"Help!",ko:"助けて!"},{en:"Excuse me",ko:"すみません(ちょっと失礼します)"},{en:"Please wait",ko:"待ってください"},{en:"Hurry up",ko:"急いでください"}],answer:0,explain:{en:'"Chuai duai" is the all-purpose cry for help. Emergency numbers: police 191, ambulance 1669, tourist police 1155.',ko:"「チュアイ ドゥアイ」は助けを求めるときの万能フレーズです。緊急番号:警察191、救急1669、ツーリストポリス1155。"}},{id:"q-check-please",phraseId:"check-please",type:"situation",q:{en:"You finish dinner and want to pay. What do you say to the waiter?",ko:"夕食を食べ終えて会計をしたいです。店員さんになんと言いますか?"},options:[{en:"Menu, please",ko:"メニューをください"},{en:"One more, please",ko:"もう1つください"},{en:"Check, please",ko:"お会計をお願いします"},{en:"Plain water, please",ko:"お水をください"}],answer:2,explain:{en:'"Kit ngoen duai" is a common way to ask for the bill. You can also raise a hand and say "check bin".',ko:"「キット グン ドゥアイ」は会計をお願いするときの定番の言い方です。手を挙げて「チェック ビン」と言ってもOKです。"}},{id:"q-jueng",phraseId:"slang-jueng",type:"meaning",q:{en:"A young Thai friend sees your outfit and says this. What does it mean?",ko:"タイの友達が私の服を見て、こう言いました。どういう意味でしょう?"},th:"\u0E08\u0E36\u0E49\u0E07",rom:"jueng",options:[{en:"I\u2019m hungry",ko:"お腹すいた"},{en:"That\u2019s boring",ko:"つまらない"},{en:"I\u2019m confused",ko:"何を言っているのかわからない"},{en:"Wow, stunning!",ko:"わあ、すごくかっこいい!"}],answer:3,explain:{en:'"Jueng" is trendy slang for amazed or stunning. Use it with friends, not in formal situations.',ko:"「ジューン」は、感動したりかっこいいと思ったときの流行語です。友達同士で使い、改まった場では避けましょう。"}},{id:"q-555",phraseId:"slang-555",type:"meaning",q:{en:"A Thai teammate types this in the chat. What are they doing?",ko:"タイ人のチームメイトがチャットにこう書き込みました。何をしているのでしょう?"},th:"555",rom:"ha ha ha",options:[{en:"Asking for 555 baht",ko:"555バーツを要求している"},{en:"Laughing",ko:"笑っている(www)"},{en:"Saying goodbye",ko:"別れの挨拶"},{en:"Calling the police",ko:"警察に通報している"}],answer:1,explain:{en:"Thai \"five\" sounds like \"ha\", so 555 = \"ha ha ha\", the Thai version of Japanese \"www\".",ko:"タイ語の数字の「5」は「ハー」と読むので、555は「ハハハ」です。タイ版の「www」です。"}},{id:"q-mai-pen-rai",phraseId:"mai-pen-rai",type:"situation",q:{en:"You bump into someone and say sorry. They smile and answer this. What does it mean?",ko:"誰かにぶつかって謝ったら、笑顔でこう返されました。どういう意味でしょう?"},th:"\u0E44\u0E21\u0E48\u0E40\u0E1B\u0E47\u0E19\u0E44\u0E23{P}",rom:"mai pen rai {P}",options:[{en:"No problem / it\u2019s okay",ko:"大丈夫です / 問題ありません"},{en:"I don\u2019t understand",ko:"わかりません"},{en:"You owe me money",ko:"お金を返してください"},{en:"Please come again",ko:"またいらしてください"}],answer:0,explain:{en:'"Mai pen rai" is the relaxed "it\u2019s fine, don\u2019t worry". It reflects Thai culture of staying calm.',ko:"「マイペンライ」は「大丈夫、気にしないで」という、ゆったりした言葉です。落ち着きを大切にするタイ文化が表れています。"}},{id:"q-mueng-goo",phraseId:"caution-mueng-goo",type:"situation",q:{en:"A hotel receptionist helps you. Which kind of words should you NEVER use with her?",ko:"ホテルのスタッフが手伝ってくれています。この人には絶対に使ってはいけない言葉はどれでしょう?"},th:"\u0E21\u0E36\u0E07 / \u0E01\u0E39",rom:"mueng / goo",options:[{en:"Polite endings (khrap / kha)",ko:"丁寧な語尾(クラップ/カー)"},{en:"\u201CKhun\u201D for you",ko:"相手を「クン」と呼ぶ"},{en:"Rude pronouns (mueng / goo)",ko:"乱暴な代名詞(ムン/グー)"},{en:"Thank you (khop khun)",ko:"「コップクン」でお礼を言う"}],answer:2,explain:{en:"Mueng / goo are coarse pronouns only for very close friends. Using them with staff or elders is insulting.",ko:"「ムン/グー」は、とても親しい友達同士だけで使う乱暴な代名詞です。スタッフや年上の人に使うと侮辱になります。"}},{id:"q-check-in",phraseId:"check-in",type:"situation",q:{en:"You arrive at the hotel front desk after a long flight. What do you say?",ko:"長いフライトの後、ホテルのフロントに着きました。なんと言いますか?"},options:[{en:"Extra towels, please",ko:"タオルを追加でください"},{en:"I lost my room key",ko:"部屋の鍵をなくしました"},{en:"What is the Wi-Fi password?",ko:"Wi-Fiのパスワードは何ですか?"},{en:"I\u2019d like to check in",ko:"チェックインをお願いします"}],answer:3,explain:{en:'"Khor chek-in {P}" is the standard phrase. Keep your passport ready.',ko:"「コー チェックイン」が基本のフレーズです。パスポートを準備しておきましょう。"}},{id:"q-slow-down",phraseId:"slow-down",type:"situation",q:{en:"You are on a motorbike taxi and the rider is going too fast. What do you say?",ko:"バイクタクシーに乗ったら、運転手がスピードを出しすぎています。なんと言いますか?"},options:[{en:"Go straight",ko:"まっすぐ行ってください"},{en:"Please slow down",ko:"もう少しゆっくり走ってください"},{en:"Can you go to Siam Paragon?",ko:"サイアム・パラゴンまで行ってもらえますか?"},{en:"Please wait a moment",ko:"少し待ってください"}],answer:1,explain:{en:'"Chaa long noi {P}" asks the driver to go slower. Also hold on and wear the helmet.',ko:"「チャー ロン ノーイ」は、ゆっくり走ってほしいというお願いです。しっかりつかまって、ヘルメットもかぶりましょう。"}},{id:"q-tueng",phraseId:"slang-tueng",type:"meaning",q:{en:"After a great play a Thai friend shouts this. What does it mean?",ko:"ナイスプレーの後、タイの友達がこう叫びました。どういう意味でしょう?"},th:"\u0E15\u0E36\u0E07",rom:"tueng",options:[{en:"Impressive / intense",ko:"すごい / やばい"},{en:"Too slow",ko:"遅すぎる"},{en:"I\u2019m sleepy",ko:"眠い"},{en:"Please repeat",ko:"もう一度言って"}],answer:0,explain:{en:'"Tueng" is casual slang praising something impressively strong. Common in gaming talk.',ko:"「トゥン」は、圧倒的に強いことを褒めるカジュアルなスラングです。ゲームの会話でよく使います。"}},{id:"q-lost-way",phraseId:"lost-way",type:"situation",q:{en:"You cannot find your hotel and ask a shopkeeper for help. Which phrase fits?",ko:"ホテルが見つからず、お店の人に助けを求めます。合うフレーズはどれでしょう?"},options:[{en:"Delicious",ko:"おいしいです"},{en:"Check, please",ko:"お会計をお願いします"},{en:"I\u2019m lost",ko:"道に迷いました"},{en:"Thank you very much",ko:"本当にありがとうございます"}],answer:2,explain:{en:'"Long thang" = lost (my way). Show your hotel name on the phone for faster help.',ko:"「ロン ターン」は「道に迷った」という意味です。ホテル名をスマホで見せると、より早く助けてもらえます。"}},{id:"q-kreng-jai",phraseId:"slang-kreng-jai",type:"meaning",q:{en:"A Thai colleague says this when you offer to carry their bag. What do they mean?",ko:"カバンを持ちますよと言ったら、タイ人の同僚がこう言いました。どんな気持ちでしょう?"},th:"\u0E40\u0E01\u0E23\u0E07\u0E43\u0E08",rom:"kreng jai",options:[{en:"I\u2019m angry at you",ko:"あなたに怒っています"},{en:"I\u2019m very hungry",ko:"とてもお腹がすいています"},{en:"I don\u2019t know the way",ko:"道がわかりません"},{en:"I don\u2019t want to trouble you",ko:"ご迷惑をかけたくないので遠慮します"}],answer:3,explain:{en:'"Kreng jai" is the feeling of not wanting to burden others. Offer once more kindly.',ko:"「クレンチャイ」は、人に負担をかけたくない気持ちです。もう一度やさしく勧めてみましょう。"}},{id:"q-split-bill",phraseId:"team-split-bill",type:"situation",q:{en:"Your group wants to pay separately at a restaurant. What do you ask?",ko:"レストランで、グループで別々に会計したいです。なんと聞きますか?"},options:[{en:"We\u2019ll pay together",ko:"まとめて払います"},{en:"Can we split the bill?",ko:"別々に会計できますか?"},{en:"A table for eight",ko:"8名の席をお願いします"},{en:"One more, please",ko:"もう1つください"}],answer:1,explain:{en:'"Khor yaek bin dai mai" asks to split the bill. Ask early since some places do not.',ko:"「コー ヤェク ビン ダイ マイ」は、別々に会計できるかという意味です。できない店もあるので、早めに聞きましょう。"}},{id:"q-heat-up",phraseId:"heat-it-up",type:"situation",q:{en:"You buy a rice box at 7-Eleven and want it hot. What do you say?",ko:"セブン-イレブンでお弁当を買って、温めてほしいです。なんと言いますか?"},options:[{en:"Please heat it up",ko:"温めてください"},{en:"No bag needed",ko:"袋は要りません"},{en:"Receipt, please",ko:"レシートをください"},{en:"Can I pay by card?",ko:"カードで支払えますか?"}],answer:0,explain:{en:'"Un hai noi" = heat it up for me. The staff will use the microwave. Say "mai ao thung" if you do not need a bag.',ko:"「ウン ハイ ノーイ」は「温めてください」という意味です。店員さんが電子レンジを使ってくれます。袋が要らないときは「マイ アオ トゥン」と言いましょう。"}},{id:"q-fire",phraseId:"fire",type:"meaning",q:{en:"You hear shouts in the hotel hallway. What does this mean?",ko:"ホテルの廊下でこんな叫び声が聞こえました。どういう意味でしょう?"},th:"\u0E44\u0E1F\u0E44\u0E2B\u0E21\u0E49{P}",rom:"fai mai {P}",options:[{en:"Lights are off",ko:"電気が消えました"},{en:"Please be quiet",ko:"静かにしてください"},{en:"Fire!",ko:"火事だ!"},{en:"Breakfast is ready",ko:"朝食の準備ができました"}],answer:2,explain:{en:'"Fai mai" means fire. Leave the building and call 199.',ko:"「ファイ マイ」は「火事」という意味です。建物から出て、199に電話しましょう。"}},{id:"q-late-checkout",phraseId:"late-checkout",type:"situation",q:{en:"Your flight is in the evening and you want to keep the room longer. What do you ask?",ko:"フライトが夜なので、部屋をもっと長く使いたいです。なんと聞きますか?"},options:[{en:"Can you store my luggage?",ko:"荷物を預かってもらえますか?"},{en:"What time does breakfast start?",ko:"朝食は何時からですか?"},{en:"Please call a taxi for me",ko:"タクシーを呼んでください"},{en:"Can I check out late?",ko:"レイトチェックアウトはできますか?"}],answer:3,explain:{en:'"Khor chek-out sai dai mai" asks for late check-out. Ask the evening before; fees may apply.',ko:"「コー チェックアウト サーイ ダイ マイ」は、レイトチェックアウトを尋ねる言葉です。前日の夜に聞いて、追加料金がかかるか確認しましょう。"}},{id:"q-saep",phraseId:"slang-saep",type:"meaning",q:{en:"A som tam vendor grins and says this after you finish. What is the vendor saying?",ko:"ソムタムを食べ終えると、屋台の人がにっこり笑ってこう言いました。何と言っているのでしょう?"},th:"\u0E41\u0E0B\u0E48\u0E1A",rom:"saep",options:[{en:"Too expensive",ko:"高すぎます"},{en:"Tasty (and spicy)",ko:"辛くておいしいでしょ"},{en:"We are closed",ko:"閉店です"},{en:"Please pay now",ko:"今すぐ払ってください"}],answer:1,explain:{en:'"Saep" is the Isan word for tasty, used nationwide for spicy street food.',ko:"「セープ」はイサーン地方の「おいしい」という意味の言葉で、辛い屋台料理に全国で使われています。"}},{id:"q-mai-wai-laeo",phraseId:"slang-mai-wai-laeo",type:"meaning",q:{en:"A friend watching a hilarious clip says this while laughing. What does it mean?",ko:"おもしろい動画を見ていた友達が、笑いながらこう言いました。どういう意味でしょう?"},th:"\u0E44\u0E21\u0E48\u0E44\u0E2B\u0E27\u0E41\u0E25\u0E49\u0E27",rom:"mai wai laeo",options:[{en:"I can\u2019t take it (so funny)",ko:"もう無理(おもしろすぎる)"},{en:"The clip is a lie",ko:"その動画は嘘だ"},{en:"Let\u2019s go home",ko:"家に帰ろう"},{en:"I want some water",ko:"水が飲みたい"}],answer:0,explain:{en:'"Mai wai laeo" is a feeling-overload phrase: laughing, tired or touched. Context decides.',ko:"「マイ ワイ レーオ」は、感情があふれたときの言葉です。笑いすぎ、疲れた、感動したのどれもあり得るので、状況で判断します。"}},{id:"q-book-van",phraseId:"team-book-van",type:"situation",q:{en:"You must move eight people from the hotel to an event. What do you say to a car company?",ko:"ホテルからイベント会場まで8人で移動しなければなりません。車の会社になんと言いますか?"},options:[{en:"Please stop here",ko:"ここで止めてください"},{en:"I\u2019d like to book a van for 8 people",ko:"8人乗りのバンを予約したいです"},{en:"How far is it?",ko:"どのくらい遠いですか?"},{en:"I\u2019ll get off here",ko:"ここで降ります"}],answer:1,explain:{en:'"Rot-too" is a van. Confirm date, time, pickup point, luggage and total price including tolls.',ko:"「ロットゥー」はバンのことです。日付、時間、ピックアップ場所、荷物、高速料金込みの総額を確認しましょう。"}},{id:"q-wai",phraseId:"wai-greeting",type:"situation",q:{en:"A hotel guest older than you wais as you greet them. What is the best response?",ko:"年上のホテルの宿泊客が、挨拶しながらワイをしてきました。いちばんいい対応はどれでしょう?"},options:[{en:"Wai back with a small bow and say hello",ko:"軽くお辞儀をしながらワイで返して挨拶する"},{en:"Ignore it",ko:"無視する"},{en:"Point at them and laugh",ko:"指をさして笑う"},{en:"Shout \u201C555\u201D",ko:"「555」と叫ぶ"}],answer:0,explain:{en:"Return a wai with a small bow. It is the Thai version of a respectful Japanese bow (ojigi).",ko:"軽くお辞儀をしながらワイで返しましょう。日本の丁寧なお辞儀に近いです。"}},{id:"q-khop-khun",phraseId:"thank-you",type:"meaning",q:{en:"The taxi driver hands you your bag. What do you reply with?",ko:"タクシーの運転手さんがカバンを渡してくれました。なんと返しますか?"},th:"\u0E02\u0E2D\u0E1A\u0E04\u0E38\u0E13{P}",rom:"khop khun {P}",options:[{en:"Sorry",ko:"ごめんなさい"},{en:"Hello",ko:"こんにちは"},{en:"Goodbye forever",ko:"永遠にさようなら"},{en:"Thank you",ko:"ありがとうございます"}],answer:3,explain:{en:'"Khop khun" is thank you. Add "mak" (very) for extra thanks.',ko:"「コップクン」は「ありがとう」です。「マーク(とても)」をつけると、より感謝の気持ちが伝わります。"}},{id:"q-less-sweet",phraseId:"less-sweet",type:"situation",q:{en:"Thai iced tea is normally very sweet. You want it less sweet. What do you say?",ko:"タイ・ミルクティーはたいてい甘すぎるほど甘いです。甘さを控えめにしたいとき、なんと言いますか?"},options:[{en:"Less sweet, please",ko:"甘さ控えめでお願いします"},{en:"Extra rice, please",ko:"ご飯を追加でお願いします"},{en:"Eat here",ko:"ここで食べます"},{en:"No coriander, please",ko:"パクチー抜きでお願いします"}],answer:0,explain:{en:'"Waan noi" = a little sweet. You can also say "mai waan" for no sweetness at all.',ko:"「ワーン ノーイ」は「少しだけ甘く」という意味です。まったく甘くしたくないときは「マイ ワーン」と言います。"}}]});var Ge,oa,Ua,Ja,Xo=S(()=>{Ge=[{id:"bts-skytrain",name:{en:"BTS Skytrain",ko:"BTSスカイトレイン",th:"\u0E23\u0E16\u0E44\u0E1F\u0E1F\u0E49\u0E32\u0E1A\u0E35\u0E17\u0E35\u0E40\u0E2D\u0E2A"},how:{en:"Elevated trains over the busiest central areas (Siam, Asok, Phrom Phong, Thonglor, Ari, Mo Chit, Saphan Taksin). Two main lines, Sukhumvit and Silom, meet at Siam. You tap in with a card or single-journey card, ride, and tap out at your destination station.",ko:"サイアム、アソーク、プロンポン、トンロー、アーリー、モーチット、サパーンタクシンなど、バンコクの中心部の混雑エリアを走る高架電車です。主な路線はスクンビット線とシーロム線で、サイアム駅で交わります。カードや1回券をタッチして乗り、降りる駅でもう一度タッチして出ます。"},pay:{en:"Rabbit card or a single-journey card. Official BTS pages say the ticket machines take coins and QR payment (some machine types also take banknotes). Reports in late 2026 say BTS gates do not yet read foreign bank cards, so do not count on tapping a credit card here. Check at the station.",ko:"ラビットカードか1回券を使います。BTS公式ページによると、券売機は硬貨とQR決済に対応していて、機種によっては紙幣も使えます。2026年末時点の報道では、BTSの改札はまだ海外発行の銀行カードに対応していないため、クレジットカードのタッチは当てにしないでください。駅で確認しましょう。"},cost:{en:"Fare depends on the number of stations travelled, so a short hop costs less than a cross-town trip. Single-journey cards and Rabbit cards are priced on the same distance logic. Use the official fare calculator or Google Maps for the exact price.",ko:"乗る駅の数(距離)によって運賃が変わります。1~2駅の近い距離は安く、市内を横断すると高くなります。正確な金額はBTS公式の運賃計算機かGoogleマップで確認しましょう。"},pros:[{en:"Skips Bangkok traffic completely, so travel time is predictable.",ko:"バンコクの渋滞をまったく避けられるので、移動時間が読みやすいです。"},{en:"Air-conditioned, very clear signage in English, and stops right next to major malls.",ko:"エアコンがよく効いていて、英語の案内がわかりやすく、主要なショッピングモールのすぐ隣に駅があります。"},{en:"Cheap compared with taxis for most central trips.",ko:"市内のほとんどの区間で、タクシーよりずっと安いです。"}],cons:[{en:"Crowded at rush hours and big events; large bags and equipment cases are awkward.",ko:"ラッシュ時や大きなイベントのときはとても混みます。大きな荷物や機材ケースは持ち込みにくいです。"},{en:"Separate ticket from MRT and Airport Rail Link, so changing systems means new gates and a new fare.",ko:"MRTやエアポートレールリンクとは切符が別です。乗り換えるときは、いったん改札を出て入り直し、運賃も改めて払います。"},{en:"Stairs and long walkways at some stations; the last stretch to a venue can be hot and humid.",ko:"駅によっては階段や長い連絡通路があり、会場までの最後の道のりは暑くて蒸すことがあります。"}],tips:[{en:"Carry coins or small notes or set up QR payment before queueing at the machine.",ko:"券売機の列に並ぶ前に、硬貨や小額紙幣を用意するか、QR決済を準備しておきましょう。"},{en:"A Rabbit card saves time at the machines when you ride several times a day.",ko:"1日に何度も乗るなら、ラビットカードがあると券売機に並ばなくて済むので楽です。"},{en:"Check the exit number on Google Maps before you tap out so you land on the right side of the road.",ko:"改札を出る前にGoogleマップで出口番号を確認しておくと、道の反対側に出てしまうのを防げます。"}],safety:[{en:"Pickpockets work crowded platforms and carriages; keep phones and wallets in front pockets or a zipped bag.",ko:"混雑したホームや車内にはスリがいることがあります。スマホと財布は前ポケットかファスナー付きのバッグに入れましょう。"},{en:"Stay behind the yellow line and let people exit before boarding.",ko:"黄色い線の後ろで待ち、降りる人が先に出てから乗りましょう。"}],apps:[{name:"Google Maps",note:{en:"Shows BTS routes, exits and walking transfers.",ko:"BTSの経路、出口、乗り換えの徒歩区間まで表示してくれます。"}},{name:"BTS SkyTrain (official site route and fare tool)",note:{en:"Fare and journey-time planner on the official site.",ko:"公式サイトの運賃と所要時間の検索機能が使えます。"}}],official:{name:"BTS Skytrain official site",url:"https://www.bts.co.th/eng/index.html"},mistakes:[{en:"Assuming a bank card or an MRT/Airport Rail Link ticket will open BTS gates.",ko:"銀行カードやMRT、エアポートレールリンクの切符でBTSの改札が開くと思い込むこと。"},{en:"Leaving a station by the wrong exit and walking a long way around in the heat.",ko:"間違った出口から出て、暑い中を長々と遠回りして歩くこと。"}],ratings:{speed:5,comfort:4,cost:4,easeForFirstTimers:4},bestFor:{en:"Central trips between Siam, Asok, Phrom Phong, Thonglor, Ari and Mo Chit, especially at rush hour.",ko:"サイアム、アソーク、プロンポン、トンロー、アーリー、モーチットの間を移動するとき、特にラッシュ時に最適です。"},source:{name:"BTS official ticket machine page",url:"https://www.bts.co.th/eng/tickets/ticket-machine.html",checked:"2026-11-17"}},{id:"mrt",name:{en:"MRT Subway",ko:"MRT地下鉄",th:"\u0E23\u0E16\u0E44\u0E1F\u0E1F\u0E49\u0E32 MRT"},how:{en:"Underground and elevated metro run by BEM (Blue and Purple lines) and other operators (Yellow and Pink lines). The Blue Line loops through Sukhumvit, Silom, Hua Lamphong and Chatuchak Park. Gates are tap-in, tap-out.",ko:"BEMが運営するブルー線とパープル線、ほかの会社が運営するイエロー線とピンク線があります。ブルー線はスクンビット、シーロム、フアランポーン、チャトゥチャックパークをぐるりと回るように走ります。改札は乗るときも降りるときもタッチします。"},pay:{en:"On the Blue and Purple lines the official BEM page says contactless (EMV) bank cards work at the gates: credit cards from any Thai or international issuer (Visa, Mastercard, UnionPay) are accepted, while debit cards are limited to certain Thai issuers. The Yellow Line operator lists foreign debit cards too. Use the same single card to enter and exit, and tap only one card. News reports say old stored-value MRT cards stopped working on Blue/Purple on 1 June 2026, and single-journey tokens are expected to be replaced by QR tickets from 1 January 2027. Confirm at the station.",ko:"ブルー線とパープル線では、BEM公式ページによるとEMV非接触の銀行カードを改札にそのままタッチできます。タイ国内外のVisa、Mastercard、UnionPayのクレジットカードは使えますが、デビットカードは一部のタイの銀行発行のものに限られます。イエロー線の運営会社のページには、海外発行のデビットカードも使えると書かれています。乗るときと降りるときは同じカード1枚だけをタッチしてください。旧MRTのチャージ式カードは2026年6月1日からブルー線とパープル線で使えなくなり、1回券のトークンは2027年1月1日からQRチケットに変わる予定との報道があります。現地で必ず確認してください。"},cost:{en:"Distance-based fare charged when you tap out. Fare levels have been revised several times in 2025-26 and promotions change, so check the official site or app instead of relying on any number you read.",ko:"距離に応じて、降りるときに運賃が精算されます。2025~26年に運賃やプロモーションが何度も変わっているので、どこかで見た数字を信じず、公式サイトやアプリで確認しましょう。"},pros:[{en:"Cold air-con and no traffic; stations are often right under malls and offices.",ko:"エアコンが涼しく、渋滞もありません。駅がショッピングモールやオフィスビルの真下にあることも多いです。"},{en:"Contactless bank cards on the Blue and Purple lines mean no ticket queue for many visitors.",ko:"ブルー線とパープル線は非接触カードをそのままタッチできるので、切符を買う列に並ばなくて済む場合が多いです。"},{en:"Reaches places the BTS does not, such as Hua Lamphong, Chinatown area and Benjakitti area (QSNCC).",ko:"BTSが行かないフアランポーン、チャイナタウン方面、ベンジャキティ公園方面(QSNCC駅)まで行けます。"}],cons:[{en:"Not integrated with the BTS: you exit, walk and re-enter with a new payment.",ko:"BTSとは運賃が統合されていません。いったん降りて歩き、あらためて支払ってから入り直す必要があります。"},{en:"Card rules are different per line and operator; debit cards and foreign cards can be rejected.",ko:"路線や運営会社ごとにカードの規定が違い、デビットカードや海外発行のカードは拒否されることがあります。"},{en:"Long underground escalators and exits; carrying heavy cases is tiring.",ko:"地下のエスカレーターや出口が長く、重いケースを持っての移動は大変です。"}],tips:[{en:"Test your card with a short ride on day one. If the gate shows red, try another card or ask staff.",ko:"初日に短い区間を1回乗って、カードが使えるか確認しましょう。ゲートが赤く光ったら、別のカードを使うか、スタッフに聞いてください。"},{en:"Enter and exit with the same card; a different card at exit can lead to a penalty charge.",ko:"乗るときと降りるときは同じカードを使ってください。別のカードをタッチすると、ペナルティ的な料金がかかることがあります。"},{en:"Ask your card issuer about foreign-transaction fees and make sure contactless is enabled in your app.",ko:"カード会社に海外決済手数料を問い合わせ、アプリで非接触決済がオンになっているか確認しましょう。"}],safety:[{en:"Keep your bag in front of you in packed carriages.",ko:"混んだ車内ではカバンを前に抱えましょう。"},{en:"Do not eat or drink inside the paid area or on trains; it is not allowed and can be fined.",ko:"改札内や車内での飲食は禁止です。罰金を取られることがあります。"}],apps:[{name:"Google Maps",note:{en:"Shows MRT stations, exit numbers and changes.",ko:"MRTの駅、出口番号、乗り換え経路を表示してくれます。"}},{name:"MangMoom EMV (mangmoomemv.com)",note:{en:"Optional trip history and registration for EMV cards.",ko:"EMVカードの利用履歴の確認や登録ができます(任意)。"}}],official:{name:"BEM MRT EMV contactless page",url:"https://metro.bemplc.co.th/EMV-Contactless?lang=en"},mistakes:[{en:"Tapping two cards (or a card and a phone) at once at the gate.",ko:"改札に、カード2枚(またはカードとスマホ)を重ねてタッチすること。"},{en:"Assuming the same card rules apply on every MRT line.",ko:"どのMRT路線でも同じカード規定が適用されると思い込むこと。"}],ratings:{speed:5,comfort:4,cost:4,easeForFirstTimers:4},bestFor:{en:"Trips to Chatuchak, Sukhumvit, Silom, Chinatown and Benjakitti Park when you want air-con and predictable timing.",ko:"チャトゥチャック、スクンビット、シーロム、チャイナタウン、ベンジャキティ公園など、涼しくて時間が正確な移動をしたいときにおすすめです。"},source:{name:"BEM EMV page and EBM Yellow Line EMV page",url:"https://metro.bemplc.co.th/EMV-Contactless?lang=en",checked:"2026-11-17"}},{id:"grab",name:{en:"Grab (ride-hailing car)",ko:"Grab(配車アプリ)",th:"\u0E41\u0E01\u0E23\u0E47\u0E1A"},how:{en:"Book a car in the Grab app, see the route and an upfront price, and follow the driver on the map. Larger-car options (such as XL or van types when shown in the app) exist for groups. Airports have marked Grab pickup points.",ko:"Grabアプリで車を呼ぶと、ルートと事前の料金が表示され、地図上で運転手さんの位置を追えます。アプリに表示されれば、XLやバンなどの大きな車も選べるので、グループにおすすめです。空港にはGrab専用の乗り場があります。"},pay:{en:"Cash or a card linked in the app, depending on what the app offers for your account. Foreign cards sometimes fail on first use, so add and test the payment method before you land.",ko:"アプリが提供する方法に応じて、現金か登録したカードで支払います。海外のカードは最初に拒否されることがあるので、到着前に支払い方法を登録してテストしておきましょう。"},cost:{en:"Price is shown upfront and moves with distance, traffic and demand. Expressway tolls and airport fees may be added. Compare the app price with a metered taxi for the same trip.",ko:"距離、交通状況、需要によって料金が変わり、呼ぶ前に見積もり料金が表示されます。高速道路料金や空港利用料が加算されることがあります。同じ区間のタクシーのメーター料金と比べてみましょう。"},pros:[{en:"Destination is typed in the app, so there is no language barrier and no haggling.",ko:"目的地をアプリに入力するので、言葉が通じなくても大丈夫で、値段交渉も要りません。"},{en:"Door-to-door with luggage and air-con; larger cars available for groups.",ko:"荷物を積んで、エアコンの効いた車でドアツードアで行けて、グループ向けの大きな車もあります。"},{en:"Trip details and driver info are recorded in the app.",ko:"移動の記録と運転手の情報がアプリに残るので安心です。"}],cons:[{en:"Prices jump in rain and rush hour, and cars can be slow to arrive.",ko:"雨の日やラッシュ時は料金が上がり、配車も遅くなることがあります。"},{en:"Pickup spots in big malls and hotels can be confusing, so drivers sometimes cancel.",ko:"大きなショッピングモールやホテルは乗車場所がわかりにくく、運転手にキャンセルされることもあります。"},{en:"Traffic is still traffic: a short distance can take a long time.",ko:"渋滞は渋滞のままなので、近い距離でも時間がかかることがあります。"}],tips:[{en:"Check the plate number and driver photo in the app before you get in.",ko:"乗る前に、アプリに表示されたナンバープレートと運転手の写真を必ず確認しましょう。"},{en:"Drop a pin at a clear pickup point (mall entrance number, hotel gate) and message the driver in the app chat.",ko:"ショッピングモールの出入口番号やホテルの入口など、わかりやすい場所にピンを立てて、アプリのチャットで運転手に知らせましょう。"},{en:"For groups with equipment cases, book an XL or van option earlier than you think you need it.",ko:"機材ケースがあるグループは、XLやバンのオプションを、必要だと思うより早めに呼びましょう。"}],safety:[{en:"Use the in-app share-trip and emergency features; sit in the back seat if travelling alone at night.",ko:"アプリの移動共有機能と緊急機能を使い、夜に1人で乗るときは後部座席に座りましょう。"},{en:"Only get into the car that matches the app. Do not accept offers from drivers who approach you outside.",ko:"アプリに表示された車にだけ乗りましょう。外から声をかけてくる運転手の提案は断ってください。"}],apps:[{name:"Grab",note:{en:"Car, XL and bike options; payment and trip sharing.",ko:"車、XL、バイクのオプションと、決済、移動共有の機能があります。"}},{name:"Google Maps",note:{en:"Cross-check the route and the pickup pin.",ko:"ルートと乗車ピンをダブルチェックしましょう。"}}],official:{name:"Grab Thailand",url:"https://www.grab.com/th/"},mistakes:[{en:"Not adding a working payment method before arrival.",ko:"到着前に、使える支払い方法を登録しておかないこと。"},{en:"Waiting at the wrong gate or level at a mall or airport instead of the Grab pickup point.",ko:"空港やショッピングモールで、Grabの乗車場所ではない場所や階で待ってしまうこと。"}],ratings:{speed:3,comfort:5,cost:3,easeForFirstTimers:5},bestFor:{en:"Groups, late nights, rain, and trips with luggage or equipment.",ko:"グループ、深夜、雨の日、荷物や機材があるときにおすすめです。"},source:{name:"Thailand Business News: ride-hailing oversight (8 platforms incl. Grab, Bolt)",url:"https://www.thailand-business-news.com/law/330996-thailand-to-tighten-oversight-of-app-based-ride-hailing-services",checked:"2026-11-17"}},{id:"bolt",name:{en:"Bolt (ride-hailing)",ko:"Bolt(配車アプリ)",th:"\u0E42\u0E1A\u0E25\u0E17\u0E4C"},how:{en:"A Grab-like app: request a car (and in some areas a bike), see the price and driver, and track the ride. Availability and prices differ from Grab at any given time, so it is useful as a second app.",ko:"Grabに似たアプリです。車(地域によってはバイクも)を呼ぶと、料金と運転手の情報が表示され、ルートを追えます。時間帯によってGrabと料金や配車状況が違うので、2つ目のアプリとして入れておくと便利です。"},pay:{en:"Cash or card options shown in the app. Add and test a foreign card before you need it.",ko:"アプリに表示される現金またはカードのオプションで支払います。必要になる前に、海外のカードを登録してテストしておきましょう。"},cost:{en:"Upfront price based on distance and demand; often a little different from Grab for the same trip. Tolls and airport pickup fees may apply.",ko:"距離と需要に応じて事前に料金が決まります。同じ区間でもGrabと少し違うことがよくあります。高速料金や空港の乗車料金がかかることがあります。"},pros:[{en:"Good for price-checking against Grab when both are available.",ko:"両方使えるときは、Grabと料金を比べるのに便利です。"},{en:"App-based destination entry avoids language problems.",ko:"目的地をアプリに入力するので、言葉の問題がありません。"},{en:"Trip recorded in-app with driver and plate details.",ko:"運転手とナンバープレートの情報がアプリに記録されます。"}],cons:[{en:"Regulatory status has been in the news in 2026, so availability can change; do not make it your only option.",ko:"2026年に規制に関する報道があったため、利用できるかどうかが変わる可能性があります。唯一の手段として頼らないでください。"},{en:"Fewer cars than Grab in some areas and at peak times.",ko:"地域やピーク時間帯には、Grabより車が少ないことがあります。"},{en:"Airport pickup points may be less clearly set up than for Grab.",ko:"空港の乗車場所が、Grabほどわかりやすく整っていないことがあります。"}],tips:[{en:"Keep both Grab and Bolt installed and compare before booking.",ko:"GrabとBoltの両方を入れておいて、呼ぶ前に比べましょう。"},{en:"Always match the plate number and photo in the app.",ko:"アプリに表示されたナンバープレートと写真を、必ず照らし合わせましょう。"},{en:"If a driver asks you to cancel and pay cash outside the app, decline and cancel yourself.",ko:"運転手がアプリの予約をキャンセルして、現金で払おうと言ってきたら、断って自分でキャンセルしましょう。"}],safety:[{en:"Share your trip with a friend and use the in-app safety tools.",ko:"友達に移動を共有し、アプリの安全機能を使いましょう。"},{en:"Be extra careful with app motorbike rides: helmets, traffic and travel insurance exclusions.",ko:"アプリのバイク配車は特に注意しましょう。ヘルメット、交通状況、旅行保険の補償対象外になるかどうかを確認してください。"}],apps:[{name:"Bolt",note:{en:"Request and track rides.",ko:"車を呼んで、追跡できます。"}},{name:"Grab",note:{en:"Back-up if Bolt has no cars nearby.",ko:"Boltに近くの車がいないときの代替手段です。"}}],official:{name:"Bolt",url:"https://bolt.eu/"},mistakes:[{en:"Relying on Bolt alone without a back-up app.",ko:"代替アプリなしでBoltだけに頼ること。"},{en:"Agreeing to an off-app price with the driver.",ko:"運転手とアプリ外で料金を決めてしまうこと。"}],ratings:{speed:3,comfort:4,cost:4,easeForFirstTimers:4},bestFor:{en:"A second ride-hailing option for price comparison and back-up.",ko:"料金比較や代替手段として使える、2つ目の配車アプリにおすすめです。"},source:{name:"TTR Weekly: Bolt confirms continued operations in Thailand (May 2026); Thailand Business News (Sep 2026)",url:"https://www.ttrweekly.com/site/2026/05/bolt-confirms-continued-operations-in-thailand/",checked:"2026-11-17"}},{id:"metered-taxi",name:{en:"Metered Taxi",ko:"メーター式タクシー",th:"\u0E41\u0E17\u0E47\u0E01\u0E0B\u0E35\u0E48\u0E21\u0E34\u0E40\u0E15\u0E2D\u0E23\u0E4C"},how:{en:"Flag a taxi on the street or use a taxi queue at malls, hotels and airports. The meter should be switched on at the start of the trip. Show the Thai destination card or a map on your phone.",ko:"道で流しのタクシーを拾うか、ショッピングモール、ホテル、空港のタクシー乗り場を利用します。出発時にメーターを入れてもらう必要があります。タイ語の目的地カードか、スマホの地図を見せましょう。"},pay:{en:"Cash in small notes is safest. Some taxis accept card or QR, but do not count on it. Expressway tolls are paid by the passenger.",ko:"小額紙幣の現金がいちばん安全です。カードやQRが使えるタクシーもありますが、期待しないでください。高速道路料金は乗客が払います。"},cost:{en:"Meter fare = a starting fare plus distance and a waiting rate when traffic crawls. Add tolls, and at airports an official surcharge. Official rate tables change, so check the Department of Land Transport.",ko:"メーター料金は、初乗り料金に距離と、渋滞でのろのろ走るときの待機料金が加わる仕組みです。さらに高速料金と、空港では公式の追加料金が加算されます。公式の料金表は変わることがあるので、陸運局(DLT)で確認しましょう。"},pros:[{en:"Available everywhere, 24 hours, and usually fine for short trips.",ko:"どこでも24時間つかまえられて、短い距離なら基本的に問題ありません。"},{en:"Cheap for groups of 3-4 when the meter runs honestly.",ko:"メーターを正しく入れてくれれば、3~4人で割り勘すると安いです。"},{en:"No app, SIM or card needed.",ko:"アプリもSIMもカードも要らずに乗れます。"}],cons:[{en:"Drivers sometimes refuse short trips or trips through heavy traffic.",ko:"近い距離や渋滞がひどい区間は、運転手に乗車拒否されることがあります。"},{en:"Some drivers will not use the meter and quote a fixed price.",ko:"メーターを入れずに、定額料金を言ってくる運転手がいます。"},{en:"Language gap; trunk space is limited for equipment cases.",ko:"言葉が通じないことがあり、トランクが小さくて機材ケースが入らないことがあります。"}],tips:[{en:"Say or show: meter please (see phrases). If the driver says no, get out and take the next one.",ko:"「メーターを入れてください」と言うか、見せましょう(フレーズ集参照)。断られたら、降りて次のタクシーに乗りましょう。"},{en:"Have your hotel or destination name in Thai and a pin on a map.",ko:"ホテルや目的地のタイ語の名前と、地図のピンを用意しておきましょう。"},{en:"Carry 20/50/100 baht notes; many drivers do not have change for 500 or 1,000.",ko:"20、50、100バーツ札を用意しましょう。500バーツや1,000バーツ札はお釣りがない運転手が多いです。"}],safety:[{en:"Note the taxi plate or take a photo; keep valuables on your lap, not in the trunk.",ko:"ナンバープレートをメモするか写真を撮り、貴重品はトランクではなく膝の上に置きましょう。"},{en:"Report problems to the Tourist Police (1155).",ko:"トラブルがあったら、ツーリストポリス(1155)に通報しましょう。"}],apps:[{name:"Google Maps",note:{en:"Check the route and the estimated distance.",ko:"ルートと距離を確認しましょう。"}},{name:"Grab",note:{en:"Some regular taxis are bookable in ride-hailing apps; options change.",ko:"配車アプリで一般のタクシーを呼べることもありますが、オプションは変わります。"}}],official:{name:"Department of Land Transport (DLT)",url:"https://www.dlt.go.th/"},mistakes:[{en:"Getting in and starting a long trip without the meter on.",ko:"メーターを倒さないまま長距離を走り出すこと。"},{en:"Paying with a large note and not checking the change.",ko:"大きなお札で払って、おつりを確認しないこと。"}],ratings:{speed:3,comfort:4,cost:3,easeForFirstTimers:3},bestFor:{en:"Short trips when you have no data, or when a Grab car is not available.",ko:"データ通信ができないときや、Grabが捕まらないときの近距離移動に便利です。"},source:{name:"AOT Suvarnabhumi public taxi page",url:"https://suvarnabhumi.airportthai.co.th/service/transportation/detail/304",checked:"2026-11-17"}},{id:"motorcycle-taxi",name:{en:"Motorcycle Taxi",ko:"バイクタクシー",th:"\u0E21\u0E2D\u0E40\u0E15\u0E2D\u0E23\u0E4C\u0E44\u0E0B\u0E04\u0E4C\u0E23\u0E31\u0E1A\u0E08\u0E49\u0E32\u0E07"},how:{en:"Riders in numbered orange vests wait at soi entrances, station exits and busy corners. You agree on the price first, put on the helmet and sit behind the rider. You can also book an app bike.",ko:"番号入りのオレンジ色のベストを着たライダーが、ソイの入口、駅の出口、にぎやかな交差点で待っています。先に値段を決めて、ヘルメットをかぶり、後ろに乗ります。アプリでバイクを呼ぶこともできます。"},pay:{en:"Cash, agreed before you ride. App rides are paid in the app.",ko:"乗る前に決めた金額を現金で払います。アプリのバイクはアプリで決済します。"},cost:{en:"Usually a negotiated price per short trip, and it rises with distance and time of day. No official fare table to rely on.",ko:"たいてい短い距離ごとに値段交渉をして決めます。距離や時間帯によって上がります。当てになる公式の料金表はありません。"},pros:[{en:"Fastest way to cross heavy traffic and to reach the end of a long soi.",ko:"渋滞をすり抜けるのも、長いソイの奥まで行くのも一番速い方法です。"},{en:"Useful for the last kilometre from a station.",ko:"駅から目的地までのラストワンキロに便利です。"},{en:"No app needed for short hops.",ko:"近い距離ならアプリなしでも乗れます。"}],cons:[{en:"Higher crash risk than any other mode, and many travel insurance policies limit cover.",ko:"ほかの移動手段より事故のリスクが高く、旅行保険で補償が制限されることも多いです。"},{en:"Not suitable for luggage, equipment cases or rain.",ko:"荷物や機材ケースがあるときや雨の日には向きません。"},{en:"Price is negotiated, so first-timers often overpay.",ko:"値段を交渉する必要があるので、初めてだとぼったくられやすいです。"}],tips:[{en:"Agree on the price before you get on and ask the rider to slow down.",ko:"乗る前に値段を決めて、ゆっくり走ってほしいと伝えましょう。"},{en:"Always wear the helmet and keep your bag between you and the rider.",ko:"ヘルメットは必ずかぶり、バッグは自分とライダーの間に挟みましょう。"},{en:"Use it only for short trips; for anything long take a car.",ko:"短い距離だけ利用して、長い距離は車に乗りましょう。"}],safety:[{en:"Check your travel insurance for motorbike exclusions before riding.",ko:"乗る前に、旅行保険のバイク関連の免責条件を確認しましょう。"},{en:"Do not ride after drinking, in heavy rain, or on expressways.",ko:"飲酒後、豪雨のとき、高速道路区間では乗らないでください。"}],apps:[{name:"Grab (bike option)",note:{en:"Where available; rider and price are shown in the app.",ko:"利用できるエリアでは、アプリにライダーと料金が表示されます。"}},{name:"Google Maps",note:{en:"Show the rider the pin on your phone.",ko:"ライダーにスマホで地図のピンを見せましょう。"}}],official:{name:"Department of Land Transport (DLT)",url:"https://www.dlt.go.th/"},mistakes:[{en:"Riding without agreeing the price first.",ko:"先に値段を決めずに乗ること。"},{en:"Using a motorbike taxi with big bags or equipment.",ko:"大きなバッグや機材を持ってバイクタクシーに乗ること。"}],ratings:{speed:5,comfort:1,cost:4,easeForFirstTimers:2},bestFor:{en:"A short last-mile hop for travellers who are comfortable with the risk and have no luggage.",ko:"リスクを受け入れられて荷物がないときの、近いラストワンマイルの移動だけにおすすめです。"}},{id:"public-bus",name:{en:"Public Bus (BMTA)",ko:"市内バス (BMTA)",th:"\u0E23\u0E16\u0E40\u0E21\u0E25\u0E4C"},how:{en:"Bangkok's bus network is large but confusing for beginners. Buses show route numbers, and a conductor on most buses comes to you to collect the fare. Tell them your stop or show it on a map.",ko:"バンコクのバスは路線が多く、初めては分かりにくいです。バスには路線番号が付いていて、ほとんどのバスでは車掌さんが来て運賃を集めます。降りるバス停を伝えるか、地図で見せましょう。"},pay:{en:"Cash is the default and the most reliable. Card or mobile payment is only on some buses, so treat it as something to test, not to rely on.",ko:"現金が基本で、いちばん確実です。カードやモバイル決済は一部のバスだけなので、期待せずに試してみる程度にしましょう。"},cost:{en:"Fare depends on the bus type (regular, air-con, expressway) and distance. Check the BMTA fare table or ask the conductor; do not rely on numbers from old blog posts.",ko:"運賃はバスの種類(普通、エアコン付き、高速道路ルート)と距離で変わります。BMTAの運賃表を確認するか、車掌さんに聞きましょう。古いブログの金額は当てにしないでください。"},pros:[{en:"Very cheap and reaches places the rail network does not.",ko:"とても安くて、地下鉄やBTSが行かない場所まで行けます。"},{en:"Good for seeing the city street by street.",ko:"街並みを眺めながら街を感じるのにぴったりです。"},{en:"Some airport routes link straight to rail or major hubs.",ko:"空港行き路線の一部は、鉄道や主要なターミナルまで直通です。"}],cons:[{en:"Slow in traffic, hot, and often crowded.",ko:"渋滞すると遅く、暑くて、混みます。"},{en:"Route changes and unclear stop names; few English signs.",ko:"路線変更が多く、バス停の名前が分かりにくく、英語の案内が少ないです。"},{en:"Hard with luggage or equipment cases.",ko:"荷物や機材ケースを持って乗るのは大変です。"}],tips:[{en:"Use ViaBus or Google Maps to see the route number and live bus positions.",ko:"ViaBusやGoogleマップで、路線番号とバスのリアルタイムの位置を確認しましょう。"},{en:"Keep small notes and coins ready, and tap the bell early.",ko:"小額のお札と小銭を用意して、早めにブザーを押しましょう。"},{en:"Board quickly and move away from the door; buses may not wait long.",ko:"バスはあまり長く待ってくれないので素早く乗り、乗ったらドアの前から離れましょう。"}],safety:[{en:"Watch pockets on crowded buses and keep your bag in front.",ko:"混んだバスではポケットに気をつけて、バッグは前に抱えましょう。"},{en:"Hold the rail; buses brake suddenly.",ko:"急ブレーキが多いので、手すりをしっかり持ちましょう。"}],apps:[{name:"ViaBus",note:{en:"Route numbers, stops and live bus positions (planning only, not payment).",ko:"路線番号、バス停、バスのリアルタイムの位置が分かります(計画用で、決済機能はありません)。"}},{name:"Google Maps",note:{en:"Basic route planning with buses.",ko:"バスを含む基本的な経路検索ができます。"}}],official:{name:"Bangkok Mass Transit Authority (BMTA)",url:"https://www.bmta.co.th/"},mistakes:[{en:"Boarding the wrong direction because the route number is the same both ways.",ko:"路線番号が往復で同じなので、反対方向のバスに乗ってしまうこと。"},{en:"Having only large notes when the conductor arrives.",ko:"車掌さんが来たときに、大きなお札しかないこと。"}],ratings:{speed:2,comfort:2,cost:5,easeForFirstTimers:2},bestFor:{en:"Budget travel and a few simple routes you have checked in advance.",ko:"事前に確認しておいた簡単な路線で、安く移動したいときに向いています。"},source:{name:"Nation Thailand: DMK transport guide (A1/A2/A3/A4 routes)",url:"https://www.nationthailand.com/news/general/40073046",checked:"2026-11-17"}},{id:"chao-phraya-boat",name:{en:"Chao Phraya River Boat",ko:"チャオプラヤー川ボート",th:"\u0E40\u0E23\u0E37\u0E2D\u0E14\u0E48\u0E27\u0E19\u0E40\u0E08\u0E49\u0E32\u0E1E\u0E23\u0E30\u0E22\u0E32"},how:{en:"Long commuter boats run along the Chao Phraya River between Nonthaburi and Sathorn, stopping at piers near Wat Arun, the Grand Palace area and Sathorn (change there for the free Asiatique shuttle boat). Boats are colour-coded by flag (orange, yellow, green-yellow, red) with different stopping patterns.",ko:"チャオプラヤー川沿いを、ノンタブリーからサトーンまで走る通勤用ボートです。ワット・アルン、王宮周辺、サトーン船着き場(アジアティークの無料シャトルボートへ乗り換え)に停まります。オレンジ、黄、黄緑、赤の旗で路線と停まる場所が分かれています。"},pay:{en:"Pay on board or at the pier. Fares on the official page on the check date were flat per route (Orange 19, Yellow 24, Red 33 THB), but they changed several times in 2026, so confirm at the pier before you board.",ko:"船着き場か船の上で払います。確認した日の公式ページでは路線ごとの均一料金(オレンジ19、黄24、赤33バーツ)でしたが、2026年に何度も変わっているので、乗る前に船着き場で確認してください。"},cost:{en:"Mostly a flat fare per flag line (Green-Yellow is by section). Prices have been adjusted several times in 2026; check the operator's table. Tourist or private boats are priced separately.",ko:"旗の路線ごとの均一料金が基本です(黄緑は区間制)。2026年に何度も改定されているので、運営会社の料金表を確認してください。観光用やチャーターのボートは料金が別です。"},pros:[{en:"Beats traffic and gives a free river view; great for Old Town sights.",ko:"渋滞を避けられて、川の景色も楽しめます。旧市街の観光にぴったりです。"},{en:"Very cheap per trip.",ko:"1回の乗車がとても安いです。"},{en:"Connects to BTS Saphan Taksin via Sathorn pier.",ko:"サトーン船着き場からBTSサパーンタクシン駅につながっています。"}],cons:[{en:"Limited hours and no night service; a schedule change in 2026 was posted by the operator.",ko:"運行時間が限られていて、夜間運行はありません。2026年にも運行ダイヤの変更が告知されました。"},{en:"Boarding is fast and steps are steep; hard with bags.",ko:"乗り降りが速く、階段も急なので、荷物があると大変です。"},{en:"Pier names can confuse; some piers are closed for renovation.",ko:"船着き場の名前が紛らわしく、一部は改修工事で閉鎖されています。"}],tips:[{en:"Check the flag colour on the boat and whether it stops at your pier before boarding.",ko:"乗る前に、ボートの旗の色と、降りたい船着き場に停まるかを確認しましょう。"},{en:"Go early in the day for Old Town; the sunset ride is popular and crowded.",ko:"旧市街へは朝早めに行きましょう。夕暮れの時間帯は人気で混みます。"},{en:"Check the operator's current timetable before you plan a return trip.",ko:"帰りの計画を立てる前に、運営会社の最新の時刻表を確認しましょう。"}],safety:[{en:"Mind the gap between boat and pier and follow the staff's whistle.",ko:"船と船着き場の隙間に注意して、スタッフの笛の合図に従いましょう。"},{en:"Keep bags on your lap and do not lean over the rail.",ko:"バッグは膝の上に置き、手すりから身を乗り出さないでください。"}],apps:[{name:"Google Maps",note:{en:"Shows piers and the walking link from BTS.",ko:"船着き場と、BTS駅からの徒歩ルートが分かります。"}},{name:"Chao Phraya Express Boat site",note:{en:"Official route, flag and timetable pages.",ko:"路線、旗、時刻表を確認できる公式ページです。"}}],official:{name:"Chao Phraya Express Boat",url:"https://www.chaophrayaexpressboat.com/chaophrayaexpressboat?lang=en"},mistakes:[{en:"Getting on a boat that skips your pier.",ko:"降りたい船着き場に停まらないボートに乗ること。"},{en:"Planning a late return after the last boat.",ko:"最終のボートのあとまで遅く帰る計画を立てること。"}],ratings:{speed:3,comfort:3,cost:5,easeForFirstTimers:3},bestFor:{en:"Old Town sightseeing: Wat Arun, Grand Palace area and riverside days.",ko:"ワット・アルン、王宮周辺、川沿いの日程など、旧市街の観光に向いています。"},source:{name:"Chao Phraya Express Boat official site",url:"https://www.chaophrayaexpressboat.com/chaophrayaexpressboat?lang=en",checked:"2026-11-17"}},{id:"airport-rail-link",name:{en:"Airport Rail Link (ARL)",ko:"エアポート・レール・リンク (ARL)",th:"\u0E41\u0E2D\u0E23\u0E4C\u0E1E\u0E2D\u0E23\u0E4C\u0E15 \u0E40\u0E23\u0E25 \u0E25\u0E34\u0E07\u0E01\u0E4C"},how:{en:"Rail line from Suvarnabhumi Airport (Level B1 of the main terminal) into the city, with interchange options at Makkasan (for MRT Phetchaburi) and Phaya Thai (for BTS). It runs separately from BTS and MRT.",ko:"スワンナプーム空港(メインターミナルのB1階)から市内へ向かう鉄道です。マッカサン(MRTペッブリー駅へ接続)とパヤータイ(BTSへ接続)で乗り換えできます。BTS、MRTとは別に運行されています。"},pay:{en:"The state news service reported that debit and credit cards with the contactless symbol can be tapped at all ARL gates from 8 November 2025, alongside tokens and Smart Pass. Foreign card acceptance is not detailed, so carry a backup (cash for tokens).",ko:"タイ政府の報道によると、2025年11月8日から、すべてのARL駅の改札で、非接触マーク付きのクレジットカード・デビットカードをタッチして乗れるようになり、トークンやスマートパスも引き続き使えます。海外のカードが使えるかは詳しく出ていないので、現金(トークン用)も用意しましょう。"},cost:{en:"Distance-based fare by destination station. Exact fares and journey times are not listed here, so check the station display or Google Maps.",ko:"降りる駅までの距離で運賃が変わります。正確な運賃と所要時間はここには載せていないので、駅の案内板やGoogleマップで確認してください。"},pros:[{en:"Avoids road traffic between the airport and central stations.",ko:"空港から市内中心部まで、道路の渋滞を避けられます。"},{en:"Fixed route and predictable operating hours (05:30-24:00 per AOT).",ko:"ルートが決まっていて、運行時間(AOT基準で05:30〜24:00)も決まっています。"},{en:"Cheaper than a taxi for one or two people with light bags.",ko:"荷物が軽い1〜2人なら、タクシーより安いです。"}],cons:[{en:"You still need a transfer to BTS or MRT, plus a new fare and a walk.",ko:"BTSやMRTに乗り換える必要があり、新たに運賃を払って歩くことになります。"},{en:"Stairs and walkways with big cases are tiring, especially at interchange stations.",ko:"大きなケースを持って階段や連絡通路を移動するのは大変です。特に乗り換え駅で。"},{en:"Does not run overnight.",ko:"夜通しの運行はありません。"}],tips:[{en:"At Suvarnabhumi follow signs to B1 for the train.",ko:"スワンナプームでは、B1階の案内表示に従って電車乗り場へ行きましょう。"},{en:"For hotels near BTS Phaya Thai, Makkasan or Phetchaburi, this is usually the simplest option.",ko:"BTSパヤータイ、マッカサン、ペッブリー付近のホテルなら、たいていいちばんシンプルです。"},{en:"Keep a small amount of cash for tokens in case your card is not accepted.",ko:"カードが使えない場合に備えて、トークン用の少額の現金を持っておきましょう。"}],safety:[{en:"Keep an eye on bags on busy trains.",ko:"混んでいるときはバッグに気をつけましょう。"},{en:"Do not accept help from strangers at the ticket gates.",ko:"改札で知らない人の手助けは受けないでください。"}],apps:[{name:"Google Maps",note:{en:"Station choice and transfers to BTS/MRT.",ko:"駅の選び方と、BTS・MRTへの乗り換えルートが分かります。"}},{name:"Era One call center (+66 2 091 1595)",note:{en:"Number listed by AOT for ARL information.",ko:"AOTがARLの問い合わせ用として案内している番号です。"}}],official:{name:"AOT Suvarnabhumi - Ways to transport (lists ARL)",url:"https://suvarnabhumi.airportthai.co.th/service/airport-guide/detail/Transportation_BKK"},mistakes:[{en:"Assuming BTS or MRT tickets work on the Airport Rail Link.",ko:"BTSやMRTの切符がエアポート・レール・リンクでも使えると思い込むこと。"},{en:"Choosing ARL for a big group with equipment cases and long transfers.",ko:"機材ケースが多く乗り換えが長い大人数のグループが、ARLを選ぶこと。"}],ratings:{speed:4,comfort:3,cost:4,easeForFirstTimers:4},bestFor:{en:"Solo travellers and small groups with light luggage heading to central stations.",ko:"荷物が軽い一人旅や少人数で、市内中心の駅へ向かうときに向いています。"},source:{name:"Thai government news (PRD): ARL contactless ticketing; AOT BKK transport page",url:"https://thailand.prd.go.th/en/content/category/detail/id/2078/iid/439307",checked:"2026-11-17"}},{id:"suvarnabhumi-transfer",name:{en:"Suvarnabhumi Airport transfers (BKK)",ko:"スワンナプーム空港からの移動 (BKK)",th:"\u0E01\u0E32\u0E23\u0E40\u0E14\u0E34\u0E19\u0E17\u0E32\u0E07\u0E08\u0E32\u0E01\u0E2A\u0E19\u0E32\u0E21\u0E1A\u0E34\u0E19\u0E2A\u0E38\u0E27\u0E23\u0E23\u0E13\u0E20\u0E39\u0E21\u0E34"},how:{en:"Options from the main terminal: public taxi queue on Level 1, Airport Rail Link on B1, Grab at Level 1 Gate 4, AOT Limousine and chartered vehicles, plus public buses and vans from the Public Transportation Center. See AIRPORTS for the step-by-step guide.",ko:"メインターミナルからは、1階の公式タクシー乗り場、B1階のエアポート・レール・リンク、1階4番ゲートのGrab、AOTリムジンとチャーター車、公共交通センターの路線バスとバンが利用できます。手順ごとの案内はAIRPORTSセクションをご覧ください。"},pay:{en:"Taxi: meter, a 50 THB airport surcharge to the driver and tolls. Rail Link: card or tokens. Grab: in app. AOT Limousine: walk-in booking at the Level 2 counters.",ko:"タクシーはメーター料金に空港追加料金50バーツを運転手に払い、通行料は乗客負担です。エアポート・レール・リンクはカードかトークン、Grabはアプリ、AOTリムジンは2階カウンターでその場で予約します。"},cost:{en:"Taxi: meter + 50 THB surcharge + tolls. AOT Limousine lists starting rates by car class (from 550 THB for an eco sedan to 1,300 THB for a luxury sedan, as published by AOT). Rail Link, bus and Grab are distance-based or app-priced.",ko:"タクシーはメーター料金+空港追加料金50バーツ+通行料です。AOTリムジンは車のクラスごとに開始料金が公表されています(エコノミーセダン550バーツから高級セダン1,300バーツまで、AOT案内)。レール・リンク、バス、Grabは距離やアプリの料金によって変わります。"},pros:[{en:"Official counters and queue systems at the airport reduce taxi touting.",ko:"空港の公式カウンターと順番待ちの仕組みがあるので、客引きのタクシーを避けられます。"},{en:"AOT lists 9-seat vans and a 27-seat LimoBus for groups.",ko:"AOTの案内には、グループ向けの9人乗りバンと27人乗りのリムバスがあります。"},{en:"Several modes are available 24 hours (taxi, Grab, AOT Limousine).",ko:"タクシー、Grab、AOTリムジンなど、24時間使える手段がいくつかあります。"}],cons:[{en:"Taxi queues and Grab pickup can be slow at peak arrivals.",ko:"到着が集中すると、タクシー乗り場の列やGrabの乗車が遅くなります。"},{en:"Traffic into the city can be heavy; time estimates vary.",ko:"市内へ向かう道が混むことがあり、所要時間は変わります。"},{en:"Charter vehicle desks have limited hours (some stop in the evening).",ko:"チャーター車のカウンターは営業時間が限られています(夕方に閉まるところもあります)。"}],tips:[{en:"For groups with equipment cases, use a van, Grab XL or a pre-booked airport transfer.",ko:"機材ケースのあるグループは、バン、Grab XL、事前予約の空港送迎を使いましょう。"},{en:"If you pre-book, confirm the vehicle size, luggage capacity and where the driver meets you.",ko:"事前予約をするなら、車のサイズ、荷物の積載量、運転手との待ち合わせ場所を確認しましょう。"},{en:"Get a queue ticket at the official taxi counter and ignore touts in the arrivals hall.",ko:"公式タクシーカウンターで順番待ちの券をもらい、到着ホールの客引きは無視しましょう。"}],safety:[{en:"Use only official taxi, Grab, AOT or pre-booked services; do not accept rides from people who approach you.",ko:"公式のタクシー、Grab、AOT、事前予約のサービスだけを使い、声をかけてくる人の車には乗らないでください。"},{en:"Insist on the meter and keep receipts.",ko:"必ずメーターを使わせて、レシートを受け取りましょう。"}],apps:[{name:"Grab",note:{en:"Level 1 Gate 4 outer curb pickup per AOT.",ko:"AOTの案内では、1階4番ゲートの外側の道路で乗車します。"}},{name:"Google Maps",note:{en:"Compare routes and traffic.",ko:"経路と交通状況を比べましょう。"}}],official:{name:"AOT Suvarnabhumi - Ways to transport",url:"https://suvarnabhumi.airportthai.co.th/service/airport-guide/detail/Transportation_BKK"},mistakes:[{en:"Joining the taxi queue without checking vehicle size for a large group.",ko:"大人数のグループが、車のサイズを確認せずにタクシーの列に並ぶこと。"},{en:"Paying a driver who quotes a flat price instead of using the meter.",ko:"メーターを使わず定額料金を提示してくる運転手に払うこと。"}],ratings:{speed:3,comfort:4,cost:3,easeForFirstTimers:4},bestFor:{en:"Anyone arriving at BKK; choose by group size and luggage.",ko:"BKKに到着するすべての人が対象です。人数と荷物に合わせて選びましょう。"},source:{name:"AOT Suvarnabhumi - Ways to transport",url:"https://suvarnabhumi.airportthai.co.th/service/airport-guide/detail/Transportation_BKK",checked:"2026-11-17"}},{id:"don-mueang-transfer",name:{en:"Don Mueang Airport transfers (DMK)",ko:"ドンムアン空港からの移動 (DMK)",th:"\u0E01\u0E32\u0E23\u0E40\u0E14\u0E34\u0E19\u0E17\u0E32\u0E07\u0E08\u0E32\u0E01\u0E2A\u0E19\u0E32\u0E21\u0E1A\u0E34\u0E19\u0E14\u0E2D\u0E19\u0E40\u0E21\u0E37\u0E2D\u0E07"},how:{en:"From DMK you can take BMTA airport buses (A1-A4), the Red Line train via a skywalk from Terminal 2, a metered taxi from the queue, Grab from the marked pickup, or a prearranged transfer. Details are in AIRPORTS.",ko:"DMKからは、BMTAの空港バス(A1〜A4)、第2ターミナルから連絡通路でつながるレッドライン、タクシー乗り場のメータータクシー、決められた乗り場のGrab、事前手配の送迎が利用できます。詳しくはAIRPORTSセクションをご覧ください。"},pay:{en:"Buses: cash. Red Line: tickets at station (card options may be limited; confirm). Taxi: meter plus the airport surcharge and tolls. Grab: in app.",ko:"バスは現金、レッドラインは駅で切符を買います(カード対応は限られる場合があるので確認してください)。タクシーはメーター+空港追加料金+通行料、Grabはアプリ決済です。"},cost:{en:"A news report (Nov 2026) listed bus fares of 30 THB for A1 (Mo Chit) and A2 (Victory Monument) and 50 THB for A3 (Lumphini) and A4 (Sanam Luang). Taxi: meter + 50 THB surcharge per the airport site + tolls. Red Line is distance-based (the operator lists 1.50 THB per km). Confirm all prices on site.",ko:"2026年11月の報道では、A1(モーチット)とA2(戦勝記念塔)は30バーツ、A3(ルンピニー)とA4(サナームルアン)は50バーツと紹介されました。タクシーは空港サイトによるとメーター+追加料金50バーツ+通行料です。レッドラインは距離制です(運営会社の案内ではkmあたり1.50バーツ)。現地で必ず確認してください。"},pros:[{en:"Red Line connects to the MRT Blue Line at Krung Thep Aphiwat.",ko:"レッドラインで、クルンテープ・アピワットでMRTブルーラインとつながっています。"},{en:"A1 reaches the Mo Chit area where BTS and MRT meet.",ko:"A1は、BTSとMRTが交わるモーチット周辺まで行きます。"},{en:"Grab has a service counter and pickup areas.",ko:"Grabのカウンターと乗車エリアがあります。"}],cons:[{en:"Bus routes and schedules were reported inconsistently, and the A2 route changed in 2024.",ko:"バスの路線と時刻表は資料によって違っていて分かりにくく、A2は2024年に路線が変わりました。"},{en:"Taxi and Grab queues can be long at peak flights.",ko:"フライトが集中すると、タクシーとGrabの列が長くなります。"},{en:"Public transport is hard with large cases.",ko:"大きなケースがあると、公共交通は大変です。"}],tips:[{en:"For groups with equipment, pre-book a van or take Grab XL instead of the bus.",ko:"機材があるグループは、バスではなく、バンを事前予約するかGrab XLに乗りましょう。"},{en:"Check the Red Line operating hours (the airport guide lists 05:00-24:00).",ko:"レッドラインの運行時間を確認しましょう(空港の案内では05:00〜24:00)。"},{en:"A free shuttle between DMK and BKK exists only for connecting passengers with proof of onward flight.",ko:"DMKとBKKの間の無料シャトルは、乗り継ぎで次の航空券の証明がある乗客だけが利用できます。"}],safety:[{en:"Use the airport's official taxi queue and meter; ignore touts.",ko:"空港の公式タクシー乗り場とメーターを使い、客引きは無視しましょう。"},{en:"Watch bags on buses and trains.",ko:"バスや電車ではバッグに気をつけましょう。"}],apps:[{name:"Grab",note:{en:"Pickup areas at Gates 3-4 (T1) and 11-14 (T2) per the Nov 2026 guide.",ko:"2026年11月の案内では、第1ターミナルは3〜4番、第2ターミナルは11〜14番ゲートが乗車エリアです。"}},{name:"ViaBus",note:{en:"Bus routes and live positions.",ko:"バスの路線とリアルタイムの位置です。"}}],official:{name:"Don Mueang Airport transport page",url:"https://www.donmueangairport.com/en/transportation"},mistakes:[{en:"Choosing the bus with big equipment cases.",ko:"大きな機材ケースを持ってバスを選ぶこと。"},{en:"Walking to the Red Line station without checking the skywalk and hours.",ko:"連絡通路と運行時間を確認せずに、レッドラインの駅へ歩いて行くこと。"}],ratings:{speed:3,comfort:3,cost:4,easeForFirstTimers:3},bestFor:{en:"Travellers to Mo Chit/Chatuchak or those comfortable with buses; groups should pre-book a vehicle.",ko:"モーチットやチャトチャックへ行く人、バスに慣れている人に向いています。グループは車を事前に予約しましょう。"},source:{name:"Nation Thailand DMK transport guide (3 Nov 2026) and DMK official transport page",url:"https://www.nationthailand.com/news/general/40073046",checked:"2026-11-17"}}],oa=[{id:"bkk",name:{en:"Suvarnabhumi Airport",ko:"スワンナプーム空港",th:"\u0E17\u0E48\u0E32\u0E2D\u0E32\u0E01\u0E32\u0E28\u0E22\u0E32\u0E19\u0E2A\u0E38\u0E27\u0E23\u0E23\u0E13\u0E20\u0E39\u0E21\u0E34"},code:"BKK",overview:{en:"Bangkok's main international airport, east of the city. The Airport Rail Link station is on Level B1 and the official public taxi counter is on Level 1 between Gates 4 and 7. Both the taxi counter and Grab pickup are open 24 hours per AOT.",ko:"市の東にあるバンコクの主要国際空港です。エアポート・レール・リンクの駅はB1階、公式タクシーカウンターは1階の4〜7番ゲートの間にあります。AOTの案内では、タクシーカウンターとGrabの乗車は24時間利用できます。"},options:[{mode:{en:"Public (official) taxi",ko:"公式タクシー"},how:{en:"Go to Level 1, take a queue ticket at the counter or machines (between Gates 4 and 7), and get the taxi assigned to your number.",ko:"1階へ行き、4〜7番ゲートの間のカウンターか発券機で順番待ちの券を取り、番号に合ったタクシーに乗ります。"},pay:{en:"Meter fare + 50 THB airport surcharge (to the driver) + tolls paid by you.",ko:"メーター料金+空港追加料金50バーツ(運転手に)+通行料は自己負担です。"},watchOut:{en:"Do not accept a flat price or an unmarked car; ask for the meter.",ko:"定額料金や表示のない車は断って、メーターを使うように頼みましょう。"}},{mode:{en:"Airport Rail Link",ko:"エアポート・レール・リンク"},how:{en:"Follow signs to Level B1 and enter the ARL gates. Interchange at Phaya Thai (BTS) or Makkasan (MRT Phetchaburi).",ko:"B1階の案内に従ってARLの改札へ行きましょう。パヤータイ(BTS)かマッカサン(MRTペッブリー)で乗り換えられます。"},pay:{en:"Contactless card (reported from 8 Nov 2025) or tokens; hours 05:30-24:00 per AOT.",ko:"非接触カード(2025年11月8日からと報道)かトークンで支払います。AOT基準の運行時間は05:30〜24:00です。"},watchOut:{en:"Interchanges to BTS/MRT need a new fare; cases are hard on stairs.",ko:"BTS・MRTへの乗り換えは新たに運賃が必要で、階段でのケース移動は大変です。"}},{mode:{en:"Grab",ko:"Grab"},how:{en:"Book in the app and walk to Level 1, Gate 4, outer curb.",ko:"アプリで呼んで、1階4番ゲートの外側の道路へ歩いて行きましょう。"},pay:{en:"In app; check tolls and airport fees.",ko:"アプリで決済します。通行料と空港の費用を確認しましょう。"},watchOut:{en:"Match plate and driver; wait only at the pickup area.",ko:"ナンバープレートと運転手を確認して、乗車エリアでだけ待ちましょう。"}},{mode:{en:"AOT Limousine and chartered vans",ko:"AOTリムジンとチャーターバン"},how:{en:"AOT Limousine counters are on Level 2. Chartered 9-seat vans and a 27-seat LimoBus are listed near Gate 8 on Level 1 (limited hours).",ko:"AOTリムジンのカウンターは2階にあります。9人乗りのチャーターバンと27人乗りのリムバスは、1階8番ゲート付近にあり、営業時間は限られています。"},pay:{en:"AOT lists starting rates (from 550 THB eco sedan to 1,300 THB luxury sedan) for the limousine; charter pricing is by operator.",ko:"AOTリムジンは開始料金が公表されていて(エコノミーセダン550バーツから高級セダン1,300バーツ)、チャーターは業者ごとに異なります。"},watchOut:{en:"Confirm the final price, car size and luggage fit before you pay.",ko:"支払う前に、最終的な料金、車のサイズ、荷物が入るかを確認しましょう。"}},{mode:{en:"Public bus or van",ko:"バス・バン"},how:{en:"From the Public Transportation Center: routes include S6/555 to Krung Thep Aphiwat, 554 to Rangsit, and 552B to BTS On Nut. S1 to Khao San leaves from Level 1, Gate 7.",ko:"公共交通センターから、S6/555(クルンテープ・アピワット)、554(ランシット)、552B(BTSオンヌット)などが出ていて、カオサン行きのS1は1階7番ゲートから出発します。"},pay:{en:"Cash; confirm the route and fare on site.",ko:"現金です。路線と運賃は現地で確認しましょう。"},watchOut:{en:"Route lists vary between AOT pages; check the live board.",ko:"AOTのページによって路線リストが違います。現地の案内板を確認しましょう。"}}],steps:[{en:"Clear immigration, collect bags and customs; head to the Arrivals hall.",ko:"入国審査、荷物の受け取り、税関を終えて、到着ホールへ出ましょう。"},{en:"Decide: Airport Rail Link (B1), official taxi (Level 1), Grab (Level 1 Gate 4) or a pre-booked vehicle.",ko:"エアポート・レール・リンク(B1)、公式タクシー(1階)、Grab(1階4番ゲート)、事前予約の車の中から決めましょう。"},{en:"Taxi: go to Level 1, take a queue ticket between Gates 4 and 7, and get in the assigned car.",ko:"タクシーは、1階の4〜7番ゲートの間で順番待ちの券を取り、割り当てられた車に乗りましょう。"},{en:"Show the Thai destination and say meter please; the 50 THB surcharge is normal, tolls are extra.",ko:"タイ語の目的地を見せて「メーターお願いします」と伝えましょう。追加料金50バーツは正規のもので、通行料は別です。"},{en:"Rail Link: follow signs to B1, tap in or buy a token, and plan the BTS/MRT interchange.",ko:"レール・リンクは、B1階の案内に従って、カードをタッチするかトークンを買い、BTS・MRTの乗り換えを事前に決めておきましょう。"},{en:"Groups with cases: use a van, Grab XL or a pre-booked transfer instead of a standard taxi or rail.",ko:"ケースのあるグループは、普通のタクシーや電車の代わりに、バン、Grab XL、事前予約の送迎を使いましょう。"},{en:"Check the hotel address on the map and note the plate number before leaving.",ko:"出発前に、ホテルの住所を地図で確認して、ナンバープレートをメモしましょう。"}],scams:[{en:"Touts in the arrivals hall offering a taxi or fixed price; use the official queue only.",ko:"到着ホールでタクシーや定額料金を勧めてくる客引きは無視して、公式の列だけを使いましょう。"},{en:"Drivers claiming the flag-fall or surcharge is higher than the official figure; the airport surcharge is 50 THB.",ko:"初乗り料金や追加料金が公式の金額より高いと言う運転手の話は信じないでください。空港追加料金は50バーツです。"},{en:"A driver who says the meter is broken.",ko:"メーターが壊れていると言う運転手。"}],official:{name:"AOT Suvarnabhumi - Ways to transport",url:"https://suvarnabhumi.airportthai.co.th/service/airport-guide/detail/Transportation_BKK"}},{id:"dmk",name:{en:"Don Mueang Airport",ko:"ドンムアン空港",th:"\u0E17\u0E48\u0E32\u0E2D\u0E32\u0E01\u0E32\u0E28\u0E22\u0E32\u0E19\u0E14\u0E2D\u0E19\u0E40\u0E21\u0E37\u0E2D\u0E07"},code:"DMK",overview:{en:"Bangkok's older airport, north of the city, mainly used for low-cost and domestic flights. The Red Line station is reached by an elevated walkway from Level 2 of Terminal 2. Buses A1-A4 leave from the Service Hall on Level 1.",ko:"市の北にある古い空港で、主にLCCと国内線が発着します。レッドラインの駅へは、第2ターミナルの2階から高架の連絡通路で行けます。A1〜A4のバスは1階のサービスホールから出ます。"},options:[{mode:{en:"Metered taxi",ko:"メータータクシー"},how:{en:"Take a queue ticket at Gate 8 on Level 1 (Terminal 1) or at the ground-floor taxi area beside Terminal 2 and wait for your number.",ko:"第1ターミナル1階の8番ゲートか、第2ターミナル横の1階のタクシーエリアで順番待ちの券を取り、番号を待ちましょう。"},pay:{en:"Meter + 50 THB airport surcharge (airport site) + tolls.",ko:"メーター料金+空港追加料金50バーツ(空港サイト基準)+通行料です。"},watchOut:{en:"Insist on the meter and do not accept flat prices.",ko:"メーターを使わせて、定額料金は断りましょう。"}},{mode:{en:"Grab",ko:"Grab"},how:{en:"Service counter at Gate 7 on Level 1; pickup areas at Gates 3-4 (T1) and 11-14 (T2), per the Nov 2026 guide.",ko:"1階7番ゲートにカウンターがあり、2026年11月の案内では、第1ターミナルは3〜4番、第2ターミナルは11〜14番ゲートが乗車エリアです。"},pay:{en:"In app; counter hours were reported as 07:00-23:30.",ko:"アプリで決済します。カウンターの営業時間は07:00〜23:30と報道されています。"},watchOut:{en:"Wait at the pickup area, not at the curb.",ko:"道路脇ではなく、指定の乗車エリアで待ちましょう。"}},{mode:{en:"Red Line train",ko:"レッドラインの電車"},how:{en:"Walk to Don Mueang station via the elevated walkway from Level 2 of Terminal 2. Trains go to Krung Thep Aphiwat, where you can change to the MRT Blue Line.",ko:"第2ターミナル2階から高架の連絡通路でドンムアン駅まで歩きます。電車はクルンテープ・アピワットへ行き、そこでMRTブルーラインに乗り換えられます。"},pay:{en:"Distance-based; the operator lists 1.50 THB per km. Hours reported 05:00-24:00. Confirm payment options.",ko:"距離制で、運営会社の案内ではkmあたり1.50バーツです。運行は05:00〜24:00と報道されています。支払い方法は確認してください。"},watchOut:{en:"Need a second ticket for the MRT; walkway is long with big cases.",ko:"MRTは別の切符が必要で、大きなケースを持って歩くには連絡通路が長いです。"}},{mode:{en:"BMTA buses A1-A4",ko:"A1〜A4空港バス"},how:{en:"From the Service Hall, Level 1: A1 to Mo Chit, A2 to Victory Monument, A3 to Lumphini Park, A4 to Sanam Luang (per the Nov 2026 guide).",ko:"1階のサービスホールから、A1(モーチット)、A2(戦勝記念塔)、A3(ルンピニー公園)、A4(サナームルアン)が出ます(2026年11月の案内基準)。"},pay:{en:"Cash; reported 30 THB for A1/A2 and 50 THB for A3/A4.",ko:"現金です。A1・A2は30バーツ、A3・A4は50バーツと報道されています。"},watchOut:{en:"Schedules differ between sources; A2 changed its route in 2024.",ko:"資料によって時刻が違い、A2は2024年に路線が変わりました。"}},{mode:{en:"Pre-booked van or Grab XL",ko:"事前予約のバン、Grab XL"},how:{en:"Arrange a vehicle in advance or book a larger Grab car in the app.",ko:"事前に車を手配するか、アプリで大きめのGrabの車を呼びましょう。"},pay:{en:"Booking terms or app price.",ko:"予約条件かアプリの料金によります。"},watchOut:{en:"Confirm size and luggage space.",ko:"サイズと荷物スペースを確認しましょう。"}}],steps:[{en:"After immigration and baggage claim, exit to the Arrivals area of Terminal 1 (international) or Terminal 2.",ko:"入国審査と荷物受け取りのあと、第1ターミナル(国際線)か第2ターミナルの到着エリアへ出ましょう。"},{en:"Choose: Red Line (walkway from T2 Level 2), A1-A4 bus (Service Hall Level 1), taxi queue or Grab.",ko:"レッドライン(第2ターミナル2階の連絡通路)、A1〜A4バス(1階サービスホール)、タクシー乗り場、Grabの中から選びましょう。"},{en:"Taxi: take a queue ticket at Gate 8 (T1) or the car-park ground floor (T2) and wait for your number.",ko:"タクシーは、第1ターミナルの8番ゲートか第2ターミナルの駐車場1階で順番待ちの券を取り、番号を待ちましょう。"},{en:"Show your Thai destination, ask for the meter, and expect the 50 THB surcharge and tolls.",ko:"タイ語の目的地を見せてメーターを使うように頼みましょう。追加料金50バーツと通行料がかかります。"},{en:"Red Line: walk to the station, check the platform for Krung Thep Aphiwat, then change to the MRT Blue Line with a new fare.",ko:"レッドラインは、駅まで歩いてクルンテープ・アピワット方面のホームを確認し、MRTブルーラインへは新しい運賃で乗り換えましょう。"},{en:"Groups with equipment: use Grab XL or a pre-booked van; avoid buses and long walkways with big cases.",ko:"機材があるグループは、Grab XLか事前予約のバンを使い、大きなケースでバスや長い通路を移動するのは避けましょう。"}],scams:[{en:"Drivers who refuse the meter or ask for a fixed price from the arrivals curb.",ko:"到着エリアの前でメーターを拒否して、定額料金を提示する運転手。"},{en:"Touts offering rides before you reach the official queue.",ko:"公式の列に着く前に、車を勧めてくる客引き。"},{en:"Claims that the airport surcharge is more than the official 50 THB.",ko:"空港追加料金は公式の50バーツより高いという主張。"}],official:{name:"Don Mueang Airport transport page",url:"https://www.donmueangairport.com/en/transportation"}}],Ua={terms:[{en:"Exit",th:"\u0E17\u0E32\u0E07\u0E2D\u0E2D\u0E01",rom:"thang ok",ko:"出口",meaning:{en:"Look for an exit number on signs and maps.",ko:"標識や地図で出口番号を探しましょう。"}},{en:"Platform",th:"\u0E0A\u0E32\u0E19\u0E0A\u0E32\u0E25\u0E32",rom:"chan-cha-la",ko:"ホーム",meaning:{en:"Where you wait for the train.",ko:"電車を待つ場所です。"}},{en:"Buy a ticket",th:"\u0E0B\u0E37\u0E49\u0E2D\u0E15\u0E31\u0E4B\u0E27",rom:"sue tua",ko:"切符を買う",meaning:{en:"Use this when asking where to buy a ticket.",ko:"切符を買う場所を聞くときに使います。"}},{en:"Top up",th:"\u0E40\u0E15\u0E34\u0E21\u0E40\u0E07\u0E34\u0E19",rom:"toem ngoen",ko:"チャージ",meaning:{en:"Add value to a card.",ko:"カードに金額をチャージすることです。"}},{en:"Next station",th:"\u0E2A\u0E16\u0E32\u0E19\u0E35\u0E15\u0E48\u0E2D\u0E44\u0E1B",rom:"sa-tha-ni to-pai",ko:"次の駅",meaning:{en:"Announced on the train before each stop.",ko:"停車前に車内アナウンスで流れます。"}},{en:"Change line",th:"\u0E40\u0E1B\u0E25\u0E35\u0E48\u0E22\u0E19\u0E2A\u0E32\u0E22",rom:"plian sai",ko:"乗り換え",meaning:{en:"Interchange to another line.",ko:"ほかの路線へ乗り換えることです。"}},{en:"Terminus",th:"\u0E1B\u0E25\u0E32\u0E22\u0E17\u0E32\u0E07",rom:"plai thang",ko:"終点",meaning:{en:"End of the line.",ko:"路線の終点です。"}},{en:"Ticket machine",th:"\u0E40\u0E04\u0E23\u0E37\u0E48\u0E2D\u0E07\u0E08\u0E33\u0E2B\u0E19\u0E48\u0E32\u0E22\u0E15\u0E31\u0E4B\u0E27",rom:"khrueang cham-nai tua",ko:"券売機",meaning:{en:"Self-service ticket machine.",ko:"セルフサービスの券売機です。"}},{en:"Ticket office",th:"\u0E2B\u0E49\u0E2D\u0E07\u0E08\u0E33\u0E2B\u0E19\u0E48\u0E32\u0E22\u0E15\u0E31\u0E4B\u0E27",rom:"hong cham-nai tua",ko:"切符売り場",meaning:{en:"Staffed counter for tickets and help.",ko:"係員のいる、切符の販売と案内の窓口です。"}},{en:"Single-journey ticket",th:"\u0E15\u0E31\u0E4B\u0E27\u0E40\u0E17\u0E35\u0E48\u0E22\u0E27\u0E40\u0E14\u0E35\u0E22\u0E27",rom:"tua thiao diao",ko:"1回券",meaning:{en:"One-trip ticket.",ko:"1回乗るための切符です。"}},{en:"Rabbit card",th:"\u0E1A\u0E31\ DMK行きA1バスを使うときに便利です。"}},{place:"Phaya Thai",lines:{en:"BTS Phaya Thai and Airport Rail Link",ko:"BTSパヤータイ・エアポート・レール・リンク"},note:{en:"Easy change from the airport to the BTS; separate fare.",ko:"空港からBTSへの乗り換えが簡単です。運賃は別です。"}},{place:"Sala Daeng / Si Lom",lines:{en:"BTS Sala Daeng and MRT Si Lom",ko:"BTSサラデーン・MRTシーロム"},note:{en:"Walking link for Silom and Lumphini area; separate fares.",ko:"シーロムとルンピニー一帯を歩いてつなぐ通路です。運賃は別です。"}},{place:"Phetchaburi / Makkasan",lines:{en:"MRT Phetchaburi and Airport Rail Link Makkasan",ko:"MRTペッブリー・エアポート・レール・リンク マッカサン"},note:{en:"Reported to link by a skywalk; separate fares.",ko:"スカイウォークでつながっていると報道されていて、運賃は別です。"}},{place:"Saphan Taksin / Sathorn Pier",lines:{en:"BTS Saphan Taksin and Chao Phraya boat at Sathorn",ko:"BTSサパーンタクシン・サトーン船着き場のボート"},note:{en:"Walk to the pier for river boats.",ko:"川のボートに乗るには船着き場まで歩きましょう。"}},{place:"Krung Thep Aphiwat",lines:{en:"SRT Red Line and MRT Blue Line",ko:"SRTレッドライン・MRTブルーライン"},note:{en:"Change here if you came from Don Mueang on the Red Line.",ko:"ドンムアンからレッドラインで来た場合は、ここで乗り換えます。"}}],payment:[{operator:"BTS Skytrain",accepts:{en:"Rabbit card, single-journey card, QR purchase at ticket machines",ko:"ラビットカード、1回券、券売機でのQR決済"},note:{en:"Reports say bank cards are not accepted at the gates yet; confirm at the station.",ko:"まだ改札で銀行のカードは使えないという報道があるので、駅で確認してください。"}},{operator:"MRT Blue and Purple (BEM)",accepts:{en:"EMV contactless Visa/Mastercard/UnionPay (credit cards incl. foreign; debit limited to certain Thai issuers)",ko:"EMV非接触のVisa、Mastercard、UnionPay(海外発行のクレジットカードも可、デビットカードは一部のタイの銀行のみ)"},note:{en:"Use one card, same in and out. Stored-value cards ended June 2026 per news.",ko:"乗るときと降りるときは同じカード1枚を使いましょう。プリペイド式カードは2026年6月に終了したという報道があります。"}},{operator:"MRT Yellow (EBM)",accepts:{en:"EMV contactless; foreign credit and debit cards accepted per the operator page",ko:"EMV非接触。運営会社のページでは海外発行のクレジットカード・デビットカードが使えます"},note:{en:"Transfer discount from Blue Line Lat Phrao with the same card within 30 min.",ko:"ブルーラインのラ
