ne of Southeast Asia's largest malls, with Zen department store, Thai and global fashion, electronics, a big food court and event plazas.",ko:"東南アジアでも指折りの大型モールです。ゼン百貨店、タイ／グローバルファッション、家電、大型フードコート、イベント広場があります。"},budget:2,why:{en:"Broad mid-range shopping, a big food court and an easy meet-up point for groups.",ko:"中価格帯のショッピングが幅広く、フードコートも大きいので、グループの待ち合わせにぴったりです。"},transit:{en:"BTS Chit Lom, connected via skywalk (also walkable via skywalk from BTS Siam, roughly 10 min).",ko:"BTSチットロム駅からスカイウォークでつながっています。BTSサイアム駅からもスカイウォークで歩けます（約10分）。"},korea:{en:"Bigger and more sprawling than Isetan or Takashimaya department stores. Japanese and Korean cosmetics brands and cafes are common. A few big events and shows are held on the front plaza.",ko:"伊勢丹や高島屋などの日本の百貨店よりずっと広くて複雑です。日本や韓国のコスメブランドやカフェも多く、正面広場では大きなイベントやショーが開かれることもあります。"},tags:["mid-range","food-court","fashion","electronics","meetup"],geoQuery:"CentralWorld, Bangkok",mapsQuery:"CentralWorld Bangkok",imgQuery:"CentralWorld Bangkok",imgAlt:"CentralWorld shopping complex in Bangkok seen from the street"},{id:"mbk-center",type:"mall",name:{en:"MBK Center",ko:"MBKセンター",th:"\u0E40\u0E2D\u0E47\u0E21\u0E1A\u0E35\u0E40\u0E04 \u0E40\u0E0B\u0E47\u0E19\u0E40\u0E15\u0E2D\u0E23\u0E4C"},desc:{en:"A classic, crowded Bangkok mall packed with small stalls: phone accessories, cases, souvenirs, clothes, bags and food on the upper floors. Bargaining is normal at many stalls.",ko:"小さな売り場がぎっしり集まった、バンコクの定番ショッピングモールです。スマホケース、アクセサリー、お土産、服、バッグを売っていて、上の階にはフードコートがあります。多くの売り場で値切り交渉ができます。"},budget:1,why:{en:"The cheapest one-stop for souvenirs, phone cases and cables, and gift shopping.",ko:"お土産、スマホケース、ケーブル、プレゼントを一番安く一度に買える場所です。"},transit:{en:"BTS National Stadium, connected directly by skywalk.",ko:"BTSナショナルスタジアム駅からスカイウォークで直結しています。"},korea:{en:"Feels like Ameyoko in Ueno, indoors. Prices can often be negotiated, quality varies a lot and tags are not always fixed. Keep an eye on your bag and phone in crowds, and compare a few stalls before buying electronics. Also be careful with fake branded goods.",ko:"屋内のアメ横のような雰囲気です。値段交渉ができる店が多く、品質の差も大きく、値札が固定でないこともあります。人混みではバッグとスマホに気をつけて、電化製品は何軒か比べてから買いましょう。ブランドのニセモノにも注意してください。"},tags:["bargain","souvenirs","phone-accessories","crowded"],geoQuery:"MBK Center, Bangkok",mapsQuery:"MBK Center Bangkok",imgQuery:"MBK Center Bangkok",imgAlt:"MBK Center shopping mall exterior in Bangkok"},{id:"terminal-21-asok",type:"mall",name:{en:"Terminal 21 Asok",ko:"ターミナル21アソーク",th:"\u0E40\u0E17\u0E2D\u0E23\u0E4C\u0E21\u0E34\u0E19\u0E2D\u0E25 21 \u0E2D\u0E42\u0E28\u0E01"},desc:{en:"A mid-range mall themed like an airport terminal, with each floor styled after a world city (Tokyo, London, San Francisco...). It has a big food court and a lot of small fashion shops.",ko:"空港ターミナルをテーマにした中価格帯のモールです。フロアごとに東京、ロンドン、サンフランシスコなど世界の都市をテーマに飾られていて、フードコートと小さなファッションショップがたくさんあります。"},budget:2,why:{en:"Photogenic, affordable, and with a food court that is cheap compared with other central malls.",ko:"写真映えして、値段も手頃で、フードコートが他の都心のモールより安いです。"},transit:{en:"BTS Asok and MRT Sukhumvit (the mall sits on the Asok intersection, connected by walkways).",ko:"BTSアソーク駅とMRTスクンビット駅のすぐ前です（アソーク交差点にあり、歩行者通路でつながっています）。"},korea:{en:"Like a fun themed version of the Harajuku and Shibuya shopping streets: cheaper clothes and lots of cafes. Food court uses a prepaid card in many cases (top up and get a refund of the leftover balance at the counter).",ko:"原宿や渋谷のショッピングストリートをテーマパーク風にしたような雰囲気です。服が安くてカフェも多いです。フードコートはプリペイドカードを使う場合が多く、チャージして、残りの金額はカウンターで払い戻せます。"},tags:["themed","mid-range","food-court","photo","sukhumvit"],geoQuery:"Terminal 21, Asok, Bangkok",mapsQuery:"Terminal 21 Asok Bangkok",imgQuery:"Terminal 21 Bangkok",imgAlt:"Terminal 21 shopping mall interior with themed decor in Bangkok"},{id:"one-bangkok",type:"mall",name:{en:"One Bangkok",ko:"ワン・バンコク",th:"\u0E27\u0E31\u0E19 \u0E41\u0E1A\u0E07\u0E04\u0E47\u0E2D\u0E01"},desc:{en:"A large new mixed-use district near Lumphini Park and Rama IV Road with offices, hotels, retail and dining, built in phases. Shop and restaurant openings keep changing, so check what is open before going.",ko:"ルンピニー公園近くのラマ4世通りにある、大規模な複合開発エリアです。オフィス、ホテル、ショッピング、レストランが段階的にオープンしていて、店舗の開業状況がどんどん変わります。行く前に営業中のお店を確認してください。"},budget:3,why:{en:"A modern, spacious, calm alternative to the busy Siam malls, good for a design-minded walk.",ko:"混み合うサイアムのモールの代わりに、広くて静かな現代的な空間を、デザインを楽しみながら歩きたいときにぴったりです。"},transit:{en:"MRT Lumphini. The official site recommends Exit 1, which links via an underground passage to the Parade zone (tunnel and entry hours are limited, so check). Exit 3 on Wireless Road also lets out next to the site.",ko:"MRTルンピニー駅です。公式案内は1番出口から地下通路でパレード（Parade）エリアにつながるルートをすすめています（通路や入場の時間に制限があるので確認してください）。ウィットタユ通り側の3番出口も敷地の横に出ます。"},korea:{en:"Think of Roppongi Hills or Toranomon Hills rather than an old mall. Not everything is open yet, and opening hours differ by shop and zone.",ko:"古いモールというより、六本木ヒルズや虎ノ門ヒルズのような新しい複合開発エリアをイメージしてください。まだすべてはオープンしておらず、店舗やエリアごとに営業時間が違います。"},tags:["new","mixed-use","design","lumphini","calm"],geoQuery:"One Bangkok, Wireless Road, Bangkok",mapsQuery:"One Bangkok Bangkok",imgQuery:"One Bangkok",imgAlt:"One Bangkok development towers near Lumphini Park in Bangkok"},{id:"emquartier",type:"mall",name:{en:"EmQuartier",ko:"エムクオーティエ",th:"\u0E40\u0E2D\u0E47\u0E21\u0E04\u0E27\u0E2D\u0E40\u0E17\u0E35\u0E22\u0E23\u0E4C"},desc:{en:"A stylish mall in Sukhumvit with a waterfall atrium, Helix food floors, Thai design shops, and cafes. It faces Emporium across the road.",ko:"スクンビットにあるおしゃれなモールです。人工の滝があるアトリウム、ヘリックスのフードフロア、タイのデザインショップ、カフェがあり、道をはさんだ向かいにエンポリアムがあります。"},budget:3,why:{en:"Great for Thai designer shops, a skyline-style rooftop garden, and dining in a quieter area than Siam.",ko:"タイのデザイナーショップ、スカイラインを望むルーフトップガーデン、サイアムより落ち着いた雰囲気のレストランを楽しむのに最適です。"},transit:{en:"BTS Phrom Phong, directly connected by skywalk (Emporium on the other side).",ko:"BTSプロンポン駅からスカイウォークで直結しています（反対側にエンポリアム）。"},korea:{en:"Premium feel similar to Ginza Six, next to Phrom Phong, Bangkok’s Japanese expat hub, full of cafés and Japanese restaurants. For more Japanese food, Thonglor is one BTS stop away.",ko:"銀座シックスのようにセンスのよいプレミアムな雰囲気です。近くのプロンポンは日本人が多く住むバンコクの日本人街で、カフェと日本食レストランがたくさんあります。日本食を楽しむなら、BTSで1駅のトンローにも多くのお店があります。"},tags:["design","rooftop","phrom-phong","premium","food"],geoQuery:"EmQuartier, Bangkok",mapsQuery:"EmQuartier Bangkok",imgQuery:"EmQuartier",imgAlt:"EmQuartier shopping mall in Phrom Phong, Bangkok"},{id:"emporium",type:"mall",name:{en:"Emporium",ko:"エンポリアム",th:"\u0E40\u0E2D\u0E47\u0E21\u0E42\u0E1E\u0E40\u0E23\u0E35\u0E22\u0E21"},desc:{en:"An upscale department-store style mall with luxury brands, Thai designer boutiques and a well-known food court on the upper floors.",ko:"ハイブランド、タイのデザイナーブティック、上の階の有名なフードコートがある高級百貨店スタイルのモールです。"},budget:3,why:{en:"Calm, air-conditioned shopping with a good food court if you do not want a crowded Siam day.",ko:"混雑したサイアムの日を避けたいときに、静かでエアコンの効いたショッピングと、おいしいフードコートが楽しめます。"},transit:{en:"BTS Phrom Phong, directly connected (EmQuartier is across Sukhumvit Road).",ko:"BTSプロンポン駅から直結しています（スクンビット通りをはさんだ向かいがエムクオーティエ）。"},korea:{en:"Feels like a quieter Isetan-style department store. Staff in luxury shops speak English and often also some Japanese.",ko:"より落ち着いた伊勢丹のような百貨店の雰囲気です。高級ブランド店のスタッフは英語で対応でき、日本語が話せる人もよくいます。"},tags:["luxury","calm","food-court","phrom-phong"],geoQuery:"Emporium, Sukhumvit, Bangkok",mapsQuery:"Emporium Bangkok",imgQuery:"Emporium Bangkok",imgAlt:"Emporium shopping mall on Sukhumvit Road in Bangkok"},{id:"central-embassy",type:"mall",name:{en:"Central Embassy",ko:"セントラル・エンバシー",th:"\u0E40\u0E0B\u0E47\u0E19\u0E17\u0E23\u0E31\u0E25 \u0E40\u0E2D\u0E47\u0E21\u0E1A\u0E32\u0E2A\u0E0B\u0E35"},desc:{en:"A high-end mall with luxury brands, Eathai food hall, concept shops and cafes. It is connected to the Park Hyatt and has a quiet atmosphere.",ko:"ハイブランド、イータイ（Eathai）のフードホール、コンセプトストア、カフェがある高級モールです。パーク・ハイアットとつながっていて、落ち着いた雰囲気です。"},budget:4,why:{en:"Best for refined shopping and a food-hall lunch away from the busier Siam malls.",ko:"混み合うサイアムのモールを離れて、上質なショッピングとフードホールのランチを楽しむのに最適です。"},transit:{en:"BTS Phloen Chit, connected by skywalk.",ko:"BTSプルンチット駅からスカイウォークでつながっています。"},korea:{en:"More refined and less crowded than Siam Paragon, comparable to a Ginza luxury department store; prices are high-end.",ko:"サイアム・パラゴンより混んでいなくて、東京の高級百貨店のような雰囲気です。価格帯は高めです。"},tags:["luxury","design","food-hall","quiet","phloen-chit"],geoQuery:"Central Embassy, Bangkok",mapsQuery:"Central Embassy Bangkok",imgQuery:"Central Embassy Bangkok",imgAlt:"Central Embassy shopping mall in Bangkok"},{id:"sim-esim",type:"essential",name:{en:"SIM & eSIM",ko:"SIM＆eSIM",th:"\u0E0B\u0E34\u0E21\u0E01\u0E32\u0E23\u0E4C\u0E14 / \u0E2D\u0E35\u0E0B\u0E34\u0E21"},desc:{en:"Tourist SIMs from Thai carriers (AIS, True) are sold at airport counters and many mall stores. eSIM apps are the easiest if your phone supports it; install before you land.",ko:"タイの通信会社（AIS、True）の観光客向けSIMは、空港のカウンターやショッピングモールの店舗で買えます。スマホがeSIMに対応していれば、到着前に設定しておくのが一番楽です。"},budget:1,why:{en:"Maps, Grab, translation and QR payment all depend on data. Decide before you arrive: airport SIM, mall store SIM, or eSIM.",ko:"地図、Grab、翻訳、QR決済はすべてデータが必要です。到着前に、空港のSIM、店舗のSIM、eSIMのどれにするか決めておきましょう。"},transit:{en:"Airport arrivals halls (BKK, DMK) and mall carrier stores. Bring your passport; SIM registration is required for physical SIMs.",ko:"空港（BKK、DMK）の到着ロビーとショッピングモールの通信会社の店舗で買えます。物理SIMは登録が必要なので、パスポートを持っていってください。"},korea:{en:"Japanese carrier roaming plans and Japanese eSIM sellers exist, usually pricier than a local tourist SIM, but easy. Check your phone is unlocked and compatible with eSIM first. Plans and prices change often.",ko:"日本の通信会社のローミングや、日本のeSIM販売サービスもあります。現地の観光客向けSIMより普通は高めですが、手軽です。まずスマホがSIMロック解除済みで、eSIM対応機種か確認してください。プランや料金はよく変わります。"},tags:["data","airport","passport","esim"],mapsQuery:"AIS shop Bangkok",imgQuery:"SIM card",imgAlt:"A SIM card being inserted into a smartphone",imgIllustrative:!0},{id:"chargers-adapters",type:"essential",name:{en:"Chargers, Cables & Plug Adapters",ko:"充電器・ケーブル・変換プラグ",th:"\u0E17\u0E35\u0E48\u0E0A\u0E32\u0E23\u0E4C\u0E08 \u0E2A\u0E32\u0E22\u0E0A\u0E32\u0E23\u0E4C\u0E08 \u0E41\u0E25\u0E30\u0E2B\u0E31\u0E27\u0E41\u0E1B\u0E25\u0E07\u0E1B\u0E25\u0E31\u0E4A\u0E01"},desc:{en:"Thailand uses 220 V and Type A/B/C sockets (many are universal multi-sockets). Japanese two-flat-pin plugs usually fit; phone shops, MBK stalls and electronics stores sell cables and chargers.",ko:"タイは220Vで、A/B/Cタイプのコンセントが使えます(ユニバーサルのマルチコンセントも多いです)。日本のAタイプ(平行2本ピン)のプラグはたいていそのまま挿せます。スマホショップ、MBKの露店、家電量販店でケーブルや充電器を買えます。"},budget:1,why:{en:"Cable lost or left in the hotel? A replacement is quick to find. Power banks are also sold widely; carry them in your cabin bag on flights, never checked.",ko:"ケーブルをなくしたり、ホテルに忘れたりしても、すぐ代わりが見つかります。モバイルバッテリーもたくさん売っています。飛行機では機内持ち込み荷物にだけ入れてください(預け荷物は不可)。"},transit:{en:"MBK Center (BTS National Stadium) for the cheapest cables; mall electronics shops for branded chargers. Also available at 7-Eleven in a pinch.",ko:"安いケーブルはMBKセンター(BTSナショナルスタジアム駅)、ブランドの充電器はショッピングモールの家電売り場で買えます。急ぎならセブン-イレブンにもあります。"},korea:{en:"Thailand runs on 220 V, higher than Japan’s 100 V. Most phone and laptop chargers accept 100-240 V, so check the label first; Japan-only appliances (for example hair dryers) may not work. Bring a multi-plug or a travel adapter for flat-pin plugs, and check wattage for fast charging.",ko:"タイは日本の100Vより高い220Vです。スマホやノートPCの充電器はほとんどが100〜240V対応なので使えますが、必ず表示を確認してください。ドライヤーなど日本専用の家電は使えないことがあります。平行ピン用にタップか変換プラグを用意し、急速充電はワット数も確認しましょう。"},tags:["220v","power-bank","cables","mbk"],mapsQuery:"phone accessories shop Bangkok",imgQuery:"Type C electrical plug",imgAlt:"Thai wall sockets and plug adapters",imgIllustrative:!0},{id:"supermarkets-premium",type:"essential",name:{en:"Tops & Villa Market Supermarkets",ko:"トップス & ヴィラマーケット",th:"\u0E17\u0E47\u0E2D\u0E1B\u0E2A\u0E4C \u0E41\u0E25\u0E30 \u0E27\u0E34\u0E25\u0E25\u0E48\u0E32 \u0E21\u0E32\u0E23\u0E4C\u0E40\u0E01\u0E47\u0E17"},desc:{en:"Tops (often inside Central malls) and Villa Market (in expat areas such as Phrom Phong and Thonglor) are cleaner, calmer supermarkets with imported snacks, Thai fruit, bakery and ready meals.",ko:"トップス(セントラル系のモール内に多いです)とヴィラマーケット(プロンポン、トンローなど外国人が多いエリア)は、きれいで落ち着いたスーパーです。輸入のお菓子、タイのフルーツ、パン、お弁当があります。"},budget:2,why:{en:"Good for imported products, quality fruit and a calmer shopping trip. Prices are a bit higher than Big C or Lotus's.",ko:"輸入食品、質の良いフルーツ、ゆったりした買い物を求めるときにおすすめです。ビッグCやロータスより少し高めです。"},transit:{en:"Tops is inside many malls (for example Central branches); Villa Market has branches in Phrom Phong and Thonglor. Search the nearest branch on Google Maps.",ko:"トップスはセントラル系などのショッピングモール内に多く、ヴィラマーケットはプロンポンとトンローにあります。Googleマップで近くの店舗を探してください。"},korea:{en:"Like a department-store food hall (depachika) or an upmarket supermarket. Japanese snacks and instant noodles are often stocked.",ko:"デパ地下や高級スーパーのような雰囲気です。日本のお菓子やインスタント麺もよく置いてあります。"},tags:["supermarket","imported","fruit","bakery"],mapsQuery:"Tops supermarket Bangkok",imgQuery:"Tops supermarket Thailand",imgAlt:"Inside a Tops supermarket in Thailand",imgIllustrative:!0},{id:"hypermarkets",type:"essential",name:{en:"Big C & Lotus's Hypermarkets",ko:"ビッグC & ロータス(大型スーパー)",th:"\u0E1A\u0E34\u0E4A\u0E01\u0E0B\u0E35 \u0E41\u0E25\u0E30 \u0E42\u0E25\u0E15\u0E31\u0E2A"},desc:{en:"Thailand's big discount supermarkets for water by the case, snacks, instant noodles, toiletries, fruit and sundries at the best prices.",ko:"ミネラルウォーターのケース買い、お菓子、インスタント麺、日用品、フルーツをいちばん安く買える、タイの大型ディスカウントスーパーです。"},budget:1,why:{en:"Cheapest place to stock a team room with water, drinks and snacks, plus gifts like Thai snacks and instant noodles.",ko:"宿泊先に置く水・飲み物・お菓子を安く買えて、タイのお菓子やカップ麺などのお土産選びにもぴったりです。"},transit:{en:"Several branches in central Bangkok (for example Big C Ratchadamri, Lotus's branches on main roads). Use Google Maps to find the closest one.",ko:"市内に何店舗もあります(例:ビッグC ラチャダムリ、大通り沿いのロータス)。Googleマップで近くの店舗を探してください。"},korea:{en:"Think AEON or Ito-Yokado, with shorter hours in smaller branches. Cashiers may not give bags automatically, and plastic bag rules vary, so bring a tote.",ko:"イオンやイトーヨーカドーのような感じで、小さい店舗は営業時間が短めです。レジ袋の扱いは店舗ごとに違うので、エコバッグを持っておくと便利です。"},tags:["cheap","bulk","snacks","water"],mapsQuery:"Big C supermarket Bangkok",imgQuery:"Big C Thailand",imgAlt:"Big C hypermarket exterior in Thailand",imgIllustrative:!0},{id:"skincare",type:"essential",name:{en:"Skincare & Sun Care",ko:"スキンケア & 日焼け止め",th:"\u0E2A\u0E01\u0E34\u0E19\u0E41\u0E04\u0E23\u0E4C \u0E41\u0E25\u0E30 \u0E01\u0E31\u0E19\u0E41\u0E14\u0E14"},desc:{en:"Pharmacies and beauty chains sell sunscreen, gentle moisturisers and sheet masks. Thai drugstore brands such as Smooth E and Mistine are widely available.",ko:"薬局やビューティーチェーンで日焼け止め、低刺激の保湿剤、シートマスクが買えます。Smooth E、Mistineなどタイのドラッグストアブランドもよく見かけます。"},budget:2,why:{en:"Bangkok sun and humidity are strong. A high-SPF sunscreen, lip balm and a light moisturiser are worth having, and Thai brands make fun, cheap souvenirs.",ko:"バンコクは日差しが強く湿度も高いです。SPF高めの日焼け止め、リップクリーム、軽い保湿剤を持っておくと安心で、タイのブランドは安いお土産にもなります。"},transit:{en:"Watsons, Boots and pharmacies in malls and near BTS stations.",ko:"ショッピングモールやBTS駅近くのワトソンズ、ブーツ、薬局で買えます。"},korea:{en:"Thai sunscreens and lotions have different textures and some are whitening-oriented, so test on your arm first. Japanese sunscreens cost more here; bring your favorites if you are picky.",ko:"タイの日焼け止めやローションはテクスチャーが違い、美白系の商品も多いので、まず腕で試してください。日本の日焼け止めはこちらだと高いので、こだわりがあるなら持参しましょう。"},tags:["sunscreen","moisturizer","thai-brands","souvenir"],mapsQuery:"Watsons Bangkok",imgQuery:"Sunscreen",imgAlt:"Bottles of sunscreen lotion",imgIllustrative:!0},{id:"protein-snacks",type:"essential",name:{en:"Protein Snacks & Light Meals",ko:"プロテイン系の間食 & 軽食",th:"\u0E2D\u0E32\u0E2B\u0E32\u0E23\u0E42\u0E1B\u0E23\u0E15\u0E35\u0E19"},desc:{en:"7-Eleven and supermarkets sell boiled eggs, soy milk, yogurt, ready-to-eat chicken breast packs and tuna. Protein bars are sold in supermarkets and pharmacy chains; whey powder is best bought online or at sports nutrition stores.",ko:"セブン-イレブンやスーパーでゆで卵、豆乳、ヨーグルト、サラダチキン、ツナ缶が買えます。プロテインバーはスーパーや薬局チェーン、ホエイプロテインの粉末はネットかスポーツ栄養の専門店で買うのがおすすめです。"},budget:1,why:{en:"Easy post-practice refuel when you do not want a full meal. Check the label for sugar and allergens.",ko:"練習のあとにがっつり食べたくないとき、手軽にたんぱく質を補給できます。糖質とアレルギー表示は確認してください。"},transit:{en:"7-Eleven (chilled and hot counters), Tops, Big C, Lotus's. Specific brands and stock change.",ko:"セブン-イレブン(冷蔵コーナーと温めコーナー)、トップス、ビッグC、ロータスにあります。ブランドや在庫はその時々で変わります。"},korea:{en:"Japan has more ready-to-eat chicken breast variety; Thai stores lean toward eggs, soy and Thai-style meals. Bring a favorite protein powder if you rely on one.",ko:"日本はサラダチキンの種類が豊富ですが、タイは卵、豆乳、タイ風の食事が中心です。愛用のプロテインパウダーがあれば持参してください。"},tags:["protein","eggs","post-practice","snacks"],mapsQuery:"7-Eleven Bangkok",imgQuery:"Boiled egg",imgAlt:"Peeled boiled eggs",imgIllustrative:!0},{id:"atms-bank-fees",type:"essential",name:{en:"ATMs & Bank Fees",ko:"ATM & 手数料",th:"\u0E15\u0E39\u0E49\u0E40\u0E2D\u0E17\u0E35\u0E40\u0E2D\u0E47\u0E21\u0E41\u0E25\u0E30\u0E04\u0E48\u0E32\u0E18\u0E23\u0E23\u0E21\u0E40\u0E19\u0E35\u0E22\u0E21"},desc:{en:"Thai banks charge a flat fee for withdrawals with foreign cards, commonly around 220 THB per transaction (estimate; some banks differ, and AEON ATMs are reported to be cheaper). Your home bank may add its own fee.",ko:"タイの銀行は、外国のカードでの引き出しに1回ごとの定額手数料がかかります。たいてい1回220バーツ前後(推定)で、銀行によって違い、AEONのATMのほうが安いという報告もあります。日本のカード会社の手数料が別途かかる場合があります。"},budget:1,why:{en:"Fewer, larger withdrawals avoid repeating the flat fee. Always choose to be charged in THB, not in JPY, to avoid bad conversion (DCC).",ko:"定額手数料を何度も払わなくて済むよう、まとめて多めに引き出すのがおすすめです。日本円での決済・引き出しを促す画面(DCC)は断り、必ずバーツ(THB)で進めてください。"},transit:{en:"ATMs are in 7-Eleven, malls and bank branches. Use machines inside bank branches or malls rather than isolated street ATMs.",ko:"コンビニ、ショッピングモール、銀行の支店にATMがあります。人通りの少ない路上のATMより、支店やモール内の機械を使ってください。"},korea:{en:"Japanese ATMs charge small or no fees for domestic use; in Thailand the flat fee is significant. Card payment (Visa/Mastercard) and QR payments are common in malls, but street stalls often need cash. Check your card’s overseas fee and daily limit before the trip.",ko:"日本のATMは国内利用なら手数料が安いか無料のことが多いですが、タイでは定額手数料がかなり大きいです。モールではカード(Visa/Mastercard)やQR決済が一般的ですが、屋台は現金が必要なことが多いです。出国前にカードの海外手数料と1日の限度額を確認してください。"},tags:["cash","fees","dcc","cards"],mapsQuery:"ATM Bangkok",imgQuery:"ATM Thailand",imgAlt:"A bank ATM in Thailand",imgIllustrative:!0},{id:"currency-exchange",type:"essential",name:{en:"Currency Exchange",ko:"両替",th:"\u0E41\u0E25\u0E01\u0E40\u0E1B\u0E25\u0E35\u0E48\u0E22\u0E19\u0E40\u0E07\u0E34\u0E19\u0E15\u0E23\u0E32"},desc:{en:"Independent exchange shops such as SuperRich and Vasu Exchange are well-known in Bangkok and often offer better rates than airports and hotels. Compare the rate boards.",ko:"スーパーリッチ(SuperRich)やバス・エクスチェンジ(Vasu Exchange)などの両替所はバンコクで有名で、空港やホテルよりレートが良いことが多いです。レートボードを見比べましょう。"},budget:1,why:{en:"Get better rates than airport counters and hotels. Exchange only what you need, and bring your passport for larger amounts.",ko:"空港のカウンターやホテルより良いレートで両替できます。必要な分だけ替え、大きな金額はパスポートが必要な場合があります。"},transit:{en:"Look for exchange counters in central areas (for example around Ratchadamri and Siam) and in some malls. Search on Google Maps and check recent reviews.",ko:"市内(ラチャダムリ、サイアム周辺など)や一部のショッピングモールに両替所があります。地図アプリで検索し、最近の口コミを確認してください。"},korea:{en:"In Japan you can exchange at banks or airports, but in Bangkok many travelers bring USD or JPY cash or exchange locally. Rates differ per shop and per bill size, so compare, and avoid airport rates when you can. Count your cash before leaving the counter.",ko:"日本では銀行や空港で両替する人が多いですが、バンコクではドルや日本円の現金を持ってきて現地で替える人が多いです。レートは店ごと、紙幣の額面ごとに違うので比べて、できれば空港のレートは避けましょう。窓口を離れる前に必ずお金を数えてください。"},tags:["exchange","cash","rates","passport"],mapsQuery:"SuperRich currency exchange Bangkok",imgQuery:"Currency exchange Bangkok",imgAlt:"A currency exchange booth with rate board",imgIllustrative:!0},{id:"emergency-supplies",type:"essential",name:{en:"Emergency Supplies Kit",ko:"非常用グッズ",th:"\u0E02\u0E2D\u0E07\u0E43\u0E0A\u0E49\u0E09\u0E38\u0E01\u0E40\u0E09\u0E34\u0E19"},desc:{en:"Power bank, light poncho or compact umbrella, sunscreen, mosquito repellent, oral rehydration salts, plasters and basic meds. All are easy to buy at 7-Eleven, pharmacies and supermarkets.",ko:"モバイルバッテリー、軽いポンチョか折りたたみ傘、日焼け止め、虫よけ、経口補水塩(ORS)、絆創膏、基本的な常備薬です。セブン-イレブン、薬局、スーパーで簡単に買えます。"},budget:1,why:{en:"Sudden rain, heat, mosquitoes or a stomach upset can ruin a day. A small kit prevents most of it. Carry your passport copy or photo and keep medicine in its original packaging; check rules for prescription meds before you travel.",ko:"突然の雨、暑さ、蚊、お腹の不調ひとつで一日が台無しになることもあります。小さなキットでほとんど防げます。パスポートのコピーか写真を持ち、薬は元のパッケージのまま持ち歩いてください。処方薬は出国前に持ち込みのルールを確認しましょう。"},transit:{en:"7-Eleven for ponchos and ORS, pharmacies for meds and repellent, supermarkets for sunscreen.",ko:"ポンチョとORSはセブン-イレブン、薬と虫よけは薬局、日焼け止めはスーパーで買います。"},korea:{en:"Japanese mosquito patches and cold remedies are not always available, so bring your own favorites. For dengue-prone seasons, repellent matters. Seek a doctor for fever or severe symptoms.",ko:"日本の蚊よけパッチや風邪薬はいつも手に入るとは限らないので、使い慣れたものを持参してください。デング熱が心配な時期は虫よけが大切です。熱や強い症状があれば病院へ行きましょう。"},tags:["emergency","poncho","ors","repellent","power-bank"],mapsQuery:"pharmacy near me Bangkok",imgQuery:"Oral rehydration salts",imgAlt:"Oral rehydration salt sachets and a bottle of water",imgIllustrative:!0}],aa=[{id:"tao-kae-noi",kind:"snack",name:{en:"Tao Kae Noi Crispy Seaweed",th:"\u0E40\u0E16\u0E49\u0E32\u0E41\u0E01\u0E48\u0E19\u0E49\u0E2D\u0E22 \u0E2A\u0E32\u0E2B\u0E23\u0E48\u0E32\u0E22\u0E17\u0E2D\u0E14\u0E01\u0E23\u0E2D\u0E1A",ko:"タオケノイ 海苔スナック"},desc:{en:"The iconic Thai crispy seaweed snack with flavors like original and tom yum. Light, salty and easy to pack home.",ko:"タイを代表するサクサクの海苔スナックです。オリジナルやトムヤムなどの味があり、軽くて塩気があるのでお土産にぴったりです。"},price:[15,60],imgQuery:"Tao Kae Noi seaweed",imgAlt:"A pack of Tao Kae Noi crispy seaweed snack"},{id:"dried-mango",kind:"snack",name:{en:"Dried Mango",th:"\u0E21\u0E30\u0E21\u0E48\u0E27\u0E07\u0E2D\u0E1A\u0E41\u0E2B\u0E49\u0E07",ko:"ドライマンゴー"},desc:{en:"Chewy sweet dried Thai mango, a classic gift. Check labels for added sugar and sulfites if sensitive.",ko:"もっちり甘いタイのドライマンゴーは、定番のお土産です。砂糖や亜硫酸塩の添加が気になる方はラベルを確認してください。"},price:[50,200],imgQuery:"Dried mango",imgAlt:"Dried mango slices in a bowl",imgIllustrative:!0},{id:"mama-instant-noodles",kind:"snack",name:{en:"Mama Instant Noodles",th:"\u0E21\u0E32\u0E21\u0E48\u0E32",ko:"ママー インスタント麺"},desc:{en:"Thailand's favorite instant noodles, with tom yum and other Thai flavors. Cheap, fun and easy to bring home.",ko:"タイの国民的インスタント麺です。トムヤムなどタイらしい味があり、安くて楽しく、持ち帰りやすいお土産です。"},price:[8,40],imgQuery:"Mama instant noodles",imgAlt:"Packs of Mama instant noodles"},{id:"m-150",kind:"drink",name:{en:"M-150",th:"\u0E40\u0E2D\u0E47\u0E21 150",ko:"M-150"},desc:{en:"A classic small-bottle Thai energy tonic, sweet and strong. It contains caffeine, so follow the label: one a day at most.",ko:"小瓶に入ったタイの定番エナジードリンクです。甘くて濃い味です。カフェインが入っているので、ラベルを確認して1日1本までにしましょう。"},price:[10,20],imgQuery:"M-150 energy drink",imgAlt:"A bottle of M-150 energy drink",imgIllustrative:!0},{id:"jim-thompson-silk",kind:"souvenir",name:{en:"Jim Thompson Thai Silk",th:"\u0E08\u0E34\u0E21 \u0E17\u0E2D\u0E21\u0E1B\u0E4C\u0E2A\u0E31\u0E19",ko:"ジム・トンプソン シルク"},desc:{en:"A famous Thai silk brand known for scarves, cushion covers and accessories. A premium, gift-worthy souvenir, with prices well above market-stall silk.",ko:"スカーフ、クッションカバー、小物で有名なタイのシルクブランドです。市場のシルクよりずっと高い、プレミアムなお土産です。"},price:[500,6e3],imgQuery:"Jim Thompson silk Bangkok",imgAlt:"Jim Thompson Thai silk scarves and fabrics"}],Va=[{topic:{en:"Hot food counters",ko:"温かい惣菜コーナー"},korea:{en:"Convenience stores sell cold lunch boxes and ready meals; you microwave them yourself, using a self-serve microwave.",ko:"コンビニでお弁当や調理済みの食事を買い、店内の電子レンジで自分で温めます。"},thailand:{en:"Staff at 7-Eleven will usually heat your meal for you at the counter. Many stores also have toasties and steamed buns.",ko:"セブン-イレブンでは、店員さんがレジで温めてくれることが多いです。トーストや肉まんもよくあります。"}},{topic:{en:"Payment & QR",ko:"支払い & QR"},korea:{en:"Cards and mobile pay work almost everywhere, even at stalls.",ko:"カードやモバイル決済は、屋台までほとんどどこでも使えます。"},thailand:{en:"Cards and QR are common in malls and convenience stores, but street stalls and small shops often want cash. Thai QR (PromptPay) may not work for foreign cards, so carry some THB.",ko:"モールやコンビニではカードやQRが一般的ですが、屋台や小さなお店は現金を好むことが多いです。タイのQR(プロンプトペイ)は外国のカードでは使えないことがあるので、バーツの現金を持っておきましょう。"}},{topic:{en:"Bags & plastic",ko:"レジ袋"},korea:{en:"Plastic bags cost a small fee at stores, and many people bring their own.",ko:"レジ袋は有料で、マイバッグを持ち歩く人が多いです。"},thailand:{en:"Rules vary by chain and shop; some give bags, some ask if you need one. Bring a light tote anyway.",ko:"チェーンやお店によって違い、袋をくれる店も、必要か聞いてくれる店もあります。いずれにせよ軽いエコバッグを持っておきましょう。"}},{topic:{en:"ATMs & cash",ko:"ATM & 現金"},korea:{en:"Withdrawals are cheap or free for domestic cards.",ko:"国内のカードなら引き出し手数料は安いか無料です。"},thailand:{en:"Foreign cards usually pay a flat fee (commonly around 220 THB per withdrawal, estimate) plus your bank’s fee. Withdraw larger amounts less often and decline conversion to JPY.",ko:"外国のカードは普通、1回ごとの定額手数料(だいたい220バーツ、推定)に加えてカード会社の手数料もかかります。まとめて多めに、回数を少なく引き出し、円への換算は断りましょう。"}},{topic:{en:"SIM & data",ko:"SIM & データ"},korea:{en:"Roaming or a prepaid SIM is set up before travelling.",ko:"旅行前にローミングやプリペイドSIMを準備します。"},thailand:{en:"Physical SIMs need your passport for registration at the shop. eSIM is easiest, set up before landing. Airport counters are convenient but sometimes pricier.",ko:"物理SIMは店舗でパスポートによる登録が必要です。eSIMがいちばん手軽で、到着前に設定しておきましょう。空港カウンターは便利ですが、少し高いことがあります。"}},{topic:{en:"Matsumoto Kiyoshi vs Thai beauty stores",ko:"マツモトキヨシ vs タイのビューティーショップ"},korea:{en:"Japanese drugstores like Matsumoto Kiyoshi are everywhere, with frequent sales and tax-free service.",ko:"マツモトキヨシのような日本のドラッグストアはどこにでもあり、セールも頻繁で、免税サービスもあります。"},thailand:{en:"No Japanese drugstore chain like Matsumoto Kiyoshi is common in Bangkok as far as we could confirm. Watsons, Boots, Eve and Boy, and Beautrium are the main chains; Japanese and Korean brands are sold at higher prices than in Japan.",ko:"確認できた範囲では、バンコクにはマツモトキヨシのような日本のドラッグストアはほとんどありません。ワトソンズ、ブーツ、Eve and Boy、Beautriumが主なチェーンで、日本や韓国のブランドは日本より高めで売られています。"}},{topic:{en:"Bargaining",ko:"値段交渉"},korea:{en:"Fixed prices in shops; some bargaining at traditional markets.",ko:"お店は定価で、伝統的な市場でだけ値段交渉をすることがあります。"},thailand:{en:"Malls and convenience stores have fixed prices. Market stalls (MBK, Chatuchak) accept polite bargaining; smile, ask for a lower price and walk away if not satisfied.",ko:"モールやコンビニは定価です。市場の露店(MBK、チャトゥチャック)では、礼儀正しく値段交渉できます。笑顔で値下げをお願いし、納得できなければそのまま立ち去ればOKです。"}},{topic:{en:"Late-night shopping",ko:"夜遅くの買い物"},korea:{en:"24-hour convenience stores and some late-night Daiso/mart; malls close around 20:00-22:00.",ko:"24時間営業のコンビニがあり、一部のスーパーは遅くまで開いています。モールは普通20〜22時に閉まります。"},thailand:{en:"Most big malls close around 21:00-22:00 (check each), while 7-Eleven stays open very late and sometimes 24 hours. Alcohol sales have legal time restrictions.",ko:"大型モールはたいてい21〜22時に閉まり(店舗ごとに確認)、セブン-イレブンはかなり遅くまで、24時間営業のところもあります。お酒の販売には法律上の時間制限があります。"}}]});var U,Ta,Jo=S(()=>{U=[{id:"hello",cat:"greetings",en:"Hello",th:"\u0E2A\u0E27\u0E31\u0E2A\u0E14\u0E35{P}",rom:"sa-wat-dee {P}",ko:"こんにちは",ctx:{en:"Works any time of day, for hello and also for goodbye. Say it to shop staff, drivers, hotel staff and anyone older than you.",ko:"時間帯を問わず使える基本のあいさつで、別れるときにも同じように使います。お店の人、運転手さん、ホテルのスタッフ、年上の方など誰にでも使えます。"},level:"polite",note:{en:"Always end with khrap (men) or kha (women). It is like the Japanese です/ます: leave it off and you sound blunt, add it and you sound friendly and respectful. The app switches khrap/kha for you.",ko:"男性は「クラップ」、女性は「カー」で締めます。日本語の「〜です・ます」に近い役割で、付けないとぶっきらぼうに聞こえ、付けると親切で丁寧に聞こえます。アプリが性別に合わせて切り替えます。"}},{id:"wai-greeting",cat:"greetings",en:"The wai (palms-together greeting)",th:"\u0E44\u0E2B\u0E27\u0E49",rom:"wai",ko:"ワイ(両手を合わせるあいさつ)",ctx:{en:"Press your palms together near your chest and give a small nod while saying sa-wat-dee. A deeper wai with hands higher is for monks and elders.",ko:"両手を胸の前で合わせ、軽くうなずきながら「サワッディー」と言います。僧侶や目上の方には、手をもっと高く上げて深くお辞儀をします。"},level:"polite",note:{en:"It is like a Japanese ojigi (bow), but with palms together. You do not need to wai staff who serve you (a smile and a nod is fine); wai back if someone wais you first. A child’s wai is answered with a smile and a nod.",ko:"日本のお辞儀に似ていますが、手を合わせます。接客してくれるスタッフに自分からワイをする必要はなく、笑顔とうなずきで十分です。相手が先にワイをしたら、同じように返してください。子どものワイには、笑顔とうなずきで返せばOKです。"}},{id:"goodbye-see-you",cat:"greetings",en:"See you again",th:"\u0E44\u0E27\u0E49\u0E40\u0E08\u0E2D\u0E01\u0E31\u0E19\u0E43\u0E2B\u0E21\u0E48\u0E19\u0E30{P}",rom:"wai jer gan mai na {P}",ko:"また会いましょう",ctx:{en:"A warm way to say goodbye to someone you have met or worked with. You can also just say sa-wat-dee.",ko:"出会った人や一緒に働いた人と別れるときの、温かいお別れのあいさつです。単に「サワッディー」と言ってもかまいません。"},level:"polite",note:{en:'Thai has a formal "la-kon" for goodbye, but it can sound final, like "farewell". For daily life use sa-wat-dee or this phrase.',ko:"「ラーゴーン(ลาก่อน)」というお別れの表現もありますが、「さらば」のような響きで、日常ではあまり使いません。「サワッディー」かこの表現が自然です。"}},{id:"thank-you",cat:"greetings",en:"Thank you",th:"\u0E02\u0E2D\u0E1A\u0E04\u0E38\u0E13{P}",rom:"khop khun {P}",ko:"ありがとうございます",ctx:{en:"Use it after every service: food arriving, a ride ending, a door held open.",ko:"料理が出てきたとき、車を降りるとき、ドアを押さえてもらったときなど、サービスを受けるたびに使いましょう。"},level:"polite",note:{en:"Say it with a small smile. Thais say it a lot, so it is hard to overdo.",ko:"ほんのり笑顔で言ってみてください。タイの人はよく使うので、言い過ぎて変になることはありません。"}},{id:"thank-you-very-much",cat:"greetings",en:"Thank you very much",th:"\u0E02\u0E2D\u0E1A\u0E04\u0E38\u0E13\u0E21\u0E32\u0E01{P}",rom:"khop khun mak {P}",ko:"本当にありがとうございます",ctx:{en:"When someone goes out of their way to help you: staff who find your lost item, a driver who waits.",ko:"なくしものを見つけてくれたスタッフや、待っていてくれた運転手さんなど、特別に助けてくれた人に使いましょう。"},level:"polite"},{id:"sorry",cat:"greetings",en:"Sorry / I apologize",th:"\u0E02\u0E2D\u0E42\u0E17\u0E29{P}",rom:"khor thot {P}",ko:"すみません(ごめんなさい)",ctx:{en:"When you bump into someone, are late, or make a mistake. Also used to get attention politely.",ko:"人とぶつかったとき、遅れたとき、ミスしたときに使います。丁寧に相手に呼びかけるときにも使います。"},level:"polite",note:{en:"Used a bit like Japanese すみません, covering both an apology and getting someone’s attention. A light \"khor thot\" is enough for small things.",ko:"日本語の「すみません」のように、謝罪と呼びかけの両方に使われます。ちょっとしたことなら、軽く「コートー」だけで十分です。"}},{id:"excuse-me-pass",cat:"greetings",en:"Excuse me (let me pass)",th:"\u0E02\u0E2D\u0E17\u0E32\u0E07\u0E2B\u0E19\u0E48\u0E2D\u0E22{P}",rom:"khor thang noi {P}",ko:"すみません(通してください)",ctx:{en:"On crowded BTS platforms, in malls, or in narrow market lanes when you need to get through.",ko:"混雑したBTSのホーム、ショッピングモール、狭い市場の路地で通らせてもらいたいときに使います。"},level:"polite"},{id:"nice-to-meet-you",cat:"greetings",en:"Nice to meet you",th:"\u0E22\u0E34\u0E19\u0E14\u0E35\u0E17\u0E35\u0E48\u0E44\u0E14\u0E49\u0E23\u0E39\u0E49\u0E08\u0E31\u0E01{P}",rom:"yin-dee thee dai roo-jak {P}",ko:"はじめまして",ctx:{en:"First meeting with partners, staff or event crew. Combine with a small wai.",ko:"現地のパートナーやスタッフ、イベントクルーに初めて会うときに使います。軽いワイと一緒にすると◎です。"},level:"polite"},{id:"how-are-you",cat:"greetings",en:"How are you?",th:"\u0E2A\u0E1A\u0E32\u0E22\u0E14\u0E35\u0E44\u0E2B\u0E21{Q}",rom:"sa-bai dee mai {Q}",ko:"お元気ですか?",ctx:{en:"Friendly check-in with someone you already know. The answer is usually sa-bai dee.",ko:"すでに知っている人に気軽に近況を尋ねるときに使います。たいてい「サバイディー」と返ってきます。"},level:"polite",note:{en:'It is not asked to strangers as often as English "how are you". Among friends you can drop the particle.',ko:"初対面の人に、英語の「How are you」のように習慣的に尋ねることはあまりありません。友達同士なら、文末の「クラップ/カー」は省いてもかまいません。"}},{id:"im-fine",cat:"greetings",en:"I\u2019m fine / doing well",th:"\u0E2A\u0E1A\u0E32\u0E22\u0E14\u0E35{P}",rom:"sa-bai dee {P}",ko:"元気です",ctx:{en:"The standard reply to sa-bai dee mai. Add khop khun (thanks) if you like.",ko:"「サバイディーマイ」への基本の返事です。続けて「コープクン」(ありがとう)を付けてもOKです。"},level:"polite"},{id:"mai-pen-rai",cat:"greetings",en:"No problem / It\u2019s okay",th:"\u0E44\u0E21\u0E48\u0E40\u0E1B\u0E47\u0E19\u0E44\u0E23{P}",rom:"mai pen rai {P}",ko:"大丈夫です / 問題ありません",ctx:{en:'Reply to an apology or small trouble. Also a general "don\u2019t worry about it".',ko:"謝られたときや小さなトラブルがあったときに、「大丈夫ですよ、気にしないで」という意味で使います。"},level:"polite",note:{en:"Close to Japanese 大丈夫です, but it carries a stronger \"let it go\" attitude that Thais value. Use it to stay calm and smiling when plans change.",ko:"日本語の「大丈夫です」に近いですが、「気にしない、流しましょう」という余裕のある姿勢がより強いです。予定が変わっても笑顔で使うと、場の雰囲気が良くなります。"}},{id:"ok-can-do",cat:"greetings",en:"OK / can do",th:"\u0E44\u0E14\u0E49{P}",rom:"dai {P}",ko:"はい、できます / 大丈夫です",ctx:{en:"Agreeing to a request or saying something is possible. Very common one-word answer.",ko:"お願いを受けたり、「できます」と伝えたりするときに使う、とてもよく使われる一言の返事です。"},level:"polite",note:{en:'The opposite is mai dai (cannot). In Thai, a polite "no" is often softened to mai dai or "mai mee" (don\u2019t have) instead of a flat refusal.',ko:"反対は「マイ・ダイ(できません)」です。タイ語では断るときも、はっきり断らず「マイ・ダイ」や「マイ・ミー(ありません)」のようにやわらかく言うことが多いです。"}},{id:"cannot",cat:"greetings",en:"No, can\u2019t / not possible",th:"\u0E44\u0E21\u0E48\u0E44\u0E14\u0E49{P}",rom:"mai dai {P}",ko:"いいえ、できません / 無理です",ctx:{en:"Declining politely, e.g. when a seller offers something you do not want or you cannot do something.",ko:"いらないものを勧められたときや、できないことを頼まれたときに、丁寧に断る言葉です。"},level:"polite",note:{en:'For an offer you do not want, "mai ao" (don\u2019t want) with a smile is the normal street response.',ko:"いらない勧誘には、笑顔で「マイ・アオ(いりません)」と言うのが一般的です。"}},{id:"dont-understand",cat:"greetings",en:"I don\u2019t understand",th:"\u0E44\u0E21\u0E48\u0E40\u0E02\u0E49\u0E32\u0E43\u0E08{P}",rom:"mai khao jai {P}",ko:"わかりません",ctx:{en:'When someone speaks too fast or in a way you cannot follow. Pair with "phoot chaa chaa noi".',ko:"相手の話が速すぎたり、理解できなかったりするときに使います。「プート・チャーチャー・ノーイ」と一緒に使うと◎です。"},level:"polite"},{id:"speak-english",cat:"greetings",en:"Can you speak English?",th:"\u0E1E\u0E39\u0E14\u0E20\u0E32\u0E29\u0E32\u0E2D\u0E31\u0E07\u0E01\u0E24\u0E29\u0E44\u0E14\u0E49\u0E44\u0E2B\u0E21{Q}",rom:"phoot pha-saa ang-grit dai mai {Q}",ko:"英語は話せますか?",ctx:{en:"Before launching into a long question at a shop, clinic or taxi stand.",ko:"お店、クリニック、タクシー乗り場で長い質問をする前に、まず聞いてみましょう。"},level:"polite"},{id:"speak-slowly",cat:"greetings",en:"Please speak slowly",th:"\u0E1E\u0E39\u0E14\u0E0A\u0E49\u0E32\u0E46 \u0E2B\u0E19\u0E48\u0E2D\u0E22{P}",rom:"phoot chaa chaa noi {P}",ko:"ゆっくり話してください",ctx:{en:"When someone speaks too quickly for you to catch.",ko:"相手が速すぎて聞き取れないときに使います。"},level:"polite"},{id:"come-from-korea",cat:"greetings",en:"I’m from Japan",th:"มาจากญี่ปุ่น{P}",rom:"ma jak yee-pun {P}",ko:"日本から来ました",ctx:{en:"Small talk with drivers and shop staff. Thais are often friendly and curious about Japan (anime, food, travel).",ko:"運転手さんやお店のスタッフと気軽に話すときに使います。タイの人はアニメ、食べ物、旅行の影響で日本に好意的な人が多いです。"},level:"polite",note:{en:"Thai drops the subject easily, so no pronoun is needed. That also avoids having to choose between pom (men) and chan / di-chan (women).",ko:"タイ語は主語を簡単に省略します。男性用の「ポム」、女性用の「チャン/ディチャン」といった代名詞を選ぶ必要もありません。"}},{id:"good-luck",cat:"greetings",en:"Good luck",th:"\u0E42\u0E0A\u0E04\u0E14\u0E35{P}",rom:"chok dee {P}",ko:"幸運を祈ります",ctx:{en:"Wishing someone luck before a match, a trip or an exam.",ko:"試合、旅行、試験の前に幸運を祈るときに使います。"},level:"polite"},{id:"congratulations",cat:"greetings",en:"Congratulations",th:"\u0E22\u0E34\u0E19\u0E14\u0E35\u0E14\u0E49\u0E27\u0E22{P}",rom:"yin-dee duai {P}",ko:"おめでとう",ctx:{en:"After a win, a promotion, a birthday or good news.",ko:"勝利、昇進、誕生日、いい知らせがあったときに使います。"},level:"polite"},{id:"not-spicy",cat:"food",en:"Not spicy, please",th:"\u0E44\u0E21\u0E48\u0E40\u0E1C\u0E47\u0E14{P}",rom:"mai phet {P}",ko:"辛くしないでください",ctx:{en:"Say it when ordering. Dishes such as pad kra pao, som tam and tom yum are spicy by default.",ko:"注文するときに伝えましょう。パッ・ガパオ、ソムタム、トムヤムなどの料理は、基本的に辛いです。"},level:"polite",note:{en:"Even \"mai phet\" can still taste spicy to Japanese beginners. If you are sensitive, say \"mai phet leoi\" (not spicy at all) or \"phet noi\".",ko:"「マイ・ペット」と言っても、初心者の方には辛いことがあります。辛いのが苦手なら、「マイ・ペット・ルーイ(全く辛くない)」か「ペット・ノーイ(少しだけ辛く)」を使ってください。"}},{id:"less-spicy",cat:"food",en:"A little spicy",th:"\u0E40\u0E1C\u0E47\u0E14\u0E19\u0E49\u0E2D\u0E22{P}",rom:"phet noi {P}",ko:"少しだけ辛くしてください",ctx:{en:"You want some heat but not the full Thai level.",ko:"少しは辛さがほしいけれど、タイの標準レベルは厳しいときに使います。"},level:"polite"},{id:"no-chilies",cat:"food",en:"No chilies, please",th:"\u0E44\u0E21\u0E48\u0E43\u0E2A\u0E48\u0E1E\u0E23\u0E34\u0E01{P}",rom:"mai sai phrik {P}",ko:"唐辛子は抜いてください",ctx:{en:"For stir-fries, noodle dishes and soups when you want zero chili added.",ko:"炒め物、麺料理、スープで、唐辛子を全く入れてほしくないときに使います。"},level:"polite"},{id:"is-this-spicy",cat:"food",en:"Is this spicy?",th:"\u0E2D\u0E31\u0E19\u0E19\u0E35\u0E49\u0E40\u0E1C\u0E47\u0E14\u0E44\u0E2B\u0E21{Q}",rom:"an-nee phet mai {Q}",ko:"これ、辛いですか?",ctx:{en:"Pointing at a dish or at the menu before ordering.",ko:"注文の前に、メニューや料理を指さして尋ねるときに使います。"},level:"polite"},{id:"no-peanuts",cat:"food",en:"No peanuts, please",th:"\u0E44\u0E21\u0E48\u0E43\u0E2A\u0E48\u0E16\u0E31\u0E48\u0E27\u0E25\u0E34\u0E2A\u0E07{P}",rom:"mai sai thua li-song {P}",ko:"ピーナッツは抜いてください",ctx:{en:'Peanuts often top pad thai, satay sauce and som tam. For a real allergy, use the emergency phrase "phae thua li-song" instead.',ko:"パッタイ、サテのソース、ソムタムにはピーナッツがよく入っています。本当のアレルギーなら、緊急のセクションの「ペー・トゥア・リソン」を使ってください。"},level:"polite"},{id:"no-pork",cat:"food",en:"No pork, please",th:"\u0E44\u0E21\u0E48\u0E43\u0E2A\u0E48\u0E2B\u0E21\u0E39{P}",rom:"mai sai moo {P}",ko:"豚肉は抜いてください",ctx:{en:"Pork is in many dishes. Pick chicken (gai) or another protein.",ko:"豚肉が入った料理が多いです。鶏肉(ガイ)など他の食材に変えてほしいと伝えましょう。"},level:"polite",note:{en:"Broths and sauces may still contain pork. Ask again if it matters for religious or health reasons.",ko:"だしやソースに豚肉が入っていることもあります。宗教や健康上の理由なら、もう一度確認してください。"}},{id:"no-shrimp",cat:"food",en:"No shrimp, please",th:"\u0E44\u0E21\u0E48\u0E43\u0E2A\u0E48\u0E01\u0E38\u0E49\u0E07{P}",rom:"mai sai goong {P}",ko:"エビは抜いてください",ctx:{en:"Useful for fried rice, noodles and tom yum.",ko:"チャーハン、麺、トムヤムなどを注文するときに便利です。"},level:"polite",note:{en:"Dried shrimp and shrimp paste are hidden in many sauces and curry pastes. A real allergy needs the emergency phrase.",ko:"干しエビやエビのペーストは、ソースやカレーペーストに隠れていることが多いです。アレルギーなら緊急のセクションの表現を使ってください。"}},{id:"no-fish-sauce",cat:"food",en:"No fish sauce, please",th:"\u0E44\u0E21\u0E48\u0E43\u0E2A\u0E48\u0E19\u0E49\u0E33\u0E1B\u0E25\u0E32{P}",rom:"mai sai nam pla {P}",ko:"魚醤(ナンプラー)は抜いてください",ctx:{en:"Fish sauce is the salty base of Thai cooking. This request may be hard to fulfil in some dishes, so ask politely.",ko:"魚醤(ナンプラー)はタイ料理の味のベースなので、抜くのが難しい料理もあります。丁寧にお願いしましょう。"},level:"polite"},{id:"no-msg",cat:"food",en:"No MSG, please",th:"\u0E44\u0E21\u0E48\u0E43\u0E2A\u0E48\u0E1C\u0E07\u0E0A\u0E39\u0E23\u0E2A{P}",rom:"mai sai phong choo-rot {P}",ko:"MSG(味の素)は抜いてください",ctx:{en:"If you want to avoid MSG at street stalls. Many places add it or flavor powder.",ko:"屋台でMSG(化学調味料)を避けたいときに使います。多くのお店でMSGや粉末調味料が使われています。"},level:"polite"},{id:"no-coriander",cat:"food",en:"No coriander, please",th:"\u0E44\u0E21\u0E48\u0E43\u0E2A\u0E48\u0E1C\u0E31\u0E01\u0E0A\u0E35{P}",rom:"mai sai phak-chee {P}",ko:"パクチーは抜いてください",ctx:{en:"Coriander is a very common topping on noodles and soups. Say this when ordering.",ko:"麺やスープの上には、パクチーがよくのっています。注文のときに伝えておきましょう。"},level:"polite"},{id:"extra-rice",cat:"food",en:"Extra rice, please",th:"\u0E02\u0E2D\u0E02\u0E49\u0E32\u0E27\u0E40\u0E1E\u0E34\u0E48\u0E21{P}",rom:"khor khao phoem {P}",ko:"ご飯を追加してください",ctx:{en:"After training or a match when one plate is not enough. Extra rice sometimes costs a few baht.",ko:"練習や試合のあとで、1皿では足りないときに使います。ご飯の追加は数バーツ別料金のお店もあります。"},level:"polite"},{id:"takeaway",cat:"food",en:"Take away / to go",th:"\u0E2B\u0E48\u0E2D\u0E01\u0E25\u0E31\u0E1A{P}",rom:"ho glap {P}",ko:"持ち帰りでお願いします",ctx:{en:'Order food to carry out. At cafes you can also say "glap baan" (go home).',ko:"料理をテイクアウトするときに使います。カフェでは「グラップ・バーン(家へ帰る)」とも言います。"},level:"polite"},{id:"eat-here",cat:"food",en:"Eat here",th:"\u0E01\u0E34\u0E19\u0E17\u0E35\u0E48\u0E19\u0E35\u0E48{P}",rom:"gin thee nee {P}",ko:"ここで食べます",ctx:{en:'When asked "eat here or take away?" at a restaurant or food court.',ko:"レストランやフードコートで「こちらで召し上がりますか、お持ち帰りですか?」と聞かれたときの答えです。"},level:"polite"},{id:"delicious",cat:"food",en:"Delicious",th:"\u0E2D\u0E23\u0E48\u0E2D\u0E22{P}",rom:"a-roi {P}",ko:"おいしいです",ctx:{en:'Say it when you finish, or to compliment the cook. Add "mak" (very): a-roi mak.',ko:"食べ終わったときや、料理人をほめるときに使います。「マーク(とても)」を付けて「アロイ・マーク」と言うとさらに◎です。"},level:"polite"},{id:"check-please",cat:"food",en:"Check, please",th:"\u0E04\u0E34\u0E14\u0E40\u0E07\u0E34\u0E19\u0E14\u0E49\u0E27\u0E22{P}",rom:"kit ngoen duai {P}",ko:"お会計をお願いします",ctx:{en:'Ask for the bill at a restaurant. Many locals also say "check bin". A raised hand and eye contact works too.',ko:"レストランでお会計をお願いするときに使います。地元の人は「チェック・ビン」とも言います。手を挙げて目を合わせるのもOKです。"},level:"polite"},{id:"water-please",cat:"food",en:"Plain water, please",th:"\u0E02\u0E2D\u0E19\u0E49\u0E33\u0E40\u0E1B\u0E25\u0E48\u0E32\u0E2B\u0E19\u0E48\u0E2D\u0E22{P}",rom:"khor nam plao noi {P}",ko:"お水をください",ctx:{en:'Water is not always free at tables. Bottled "nam plao" may be charged.',ko:"テーブルのお水がいつも無料とは限りません。ボトル入りの水(「ナーム・プラオ」)は料金がかかることがあります。"},level:"polite"},{id:"vegetarian",cat:"food",en:"Vegetarian, please",th:"\u0E02\u0E2D\u0E41\u0E1A\u0E1A\u0E21\u0E31\u0E07\u0E2A\u0E27\u0E34\u0E23\u0E31\u0E15\u0E34{P}",rom:"khor baep mang-sa-wi-rat {P}",ko:"ベジタリアンでお願いします",ctx:{en:"Say it when ordering. Check that fish sauce, oyster sauce and shrimp paste are left out.",ko:"注文するときに伝えましょう。魚醤、オイスターソース、エビのペーストが抜かれるかも確認してください。"},level:"polite",note:{en:"Look for yellow flags with the character \u0E40\u0E08 (jay): that is strict Buddhist vegan food (no meat, dairy, eggs, garlic or onion, depending on the stall).",ko:"黄色い旗に書かれた「เจ(ジェー)」の文字が目印です。仏教式のヴィーガン料理で、お店によって肉、乳製品、卵、ニンニク、玉ねぎが入っていません。"}},{id:"one-more",cat:"food",en:"One more, please",th:"\u0E02\u0E2D\u0E2D\u0E35\u0E01\u0E2D\u0E31\u0E19\u0E2B\u0E19\u0E36\u0E48\u0E07{P}",rom:"khor eek an neung {P}",ko:"もう1つください",ctx:{en:'Another skewer, dessert or pastry. For drinks say "eek gaeo" (another glass); for plates, "eek jaan".',ko:"串焼き、デザート、パンなどをもう1つ頼むときに使います。飲み物は「イーク・ゲーオ(もう1杯)」、お皿は「イーク・ジャーン」と言います。"},level:"polite"},{id:"with-ice",cat:"food",en:"With ice, please",th:"\u0E43\u0E2A\u0E48\u0E19\u0E49\u0E33\u0E41\u0E02\u0E47\u0E07{P}",rom:"sai nam-khaeng {P}",ko:"氷を入れてください",ctx:{en:"For iced Thai tea, coffee or smoothies. Most Thai drinks come iced by default.",ko:"タイ式ミルクティー、コーヒー、スムージーを注文するときに使います。ほとんどのドリンクは基本的に氷入りです。"},level:"polite"},{id:"no-ice",cat:"food",en:"No ice, please",th:"\u0E44\u0E21\u0E48\u0E43\u0E2A\u0E48\u0E19\u0E49\u0E33\u0E41\u0E02\u0E47\u0E07{P}",rom:"mai sai nam-khaeng {P}",ko:"氷は抜いてください",ctx:{en:"If you want a drink without ice, for example for a cold stomach or sore throat.",ko:"お腹の調子や喉のコンディションのために、氷なしで飲みたいときに使います。"},level:"polite"},{id:"less-sweet",cat:"food",en:"Less sweet, please",th:"\u0E2B\u0E27\u0E32\u0E19\u0E19\u0E49\u0E2D\u0E22{P}",rom:"waan noi {P}",ko:"甘さ控えめにしてください",ctx:{en:"Thai iced tea, coffee and smoothies are very sweet by default. Add this to avoid sugar overload.",ko:"タイ式ミルクティー、コーヒー、スムージーは基本的にとても甘いです。糖分のとりすぎを避けるため、この表現を付けましょう。"},level:"polite"},{id:"no-sugar",cat:"food",en:"No sugar, please",th:"\u0E44\u0E21\u0E48\u0E43\u0E2A\u0E48\u0E19\u0E49\u0E33\u0E15\u0E32\u0E25{P}",rom:"mai sai nam-tan {P}",ko:"砂糖は抜いてください",ctx:{en:"For coffee or tea with zero added sugar. Note that syrup or condensed milk may still be added unless you also say it.",ko:"砂糖なしでコーヒーやお茶を飲むときに使います。シロップや練乳が別に入ることもあるので、一緒に伝えましょう。"},level:"polite"},{id:"recommend",cat:"food",en:"What do you recommend?",th:"\u0E21\u0E35\u0E2D\u0E30\u0E44\u0E23\u0E41\u0E19\u0E30\u0E19\u0E33\u0E44\u0E2B\u0E21{Q}",rom:"mee a-rai nae-nam mai {Q}",ko:"おすすめは何ですか?",ctx:{en:"When the menu is only in Thai or you do not know what to choose.",ko:"メニューがタイ語だけのときや、何を選べばいいかわからないときに使います。"},level:"polite"},{id:"menu-please",cat:"food",en:"Menu, please",th:"\u0E02\u0E2D\u0E40\u0E21\u0E19\u0E39\u0E2B\u0E19\u0E48\u0E2D\u0E22{P}",rom:"khor may-noo noi {P}",ko:"メニューをください",ctx:{en:"Sit down and ask for the menu. In small shops the menu may be on the wall.",ko:"席に着いてメニューをお願いするときに使います。小さなお店では壁にメニューが貼ってあることもあります。"},level:"polite"},{id:"ill-have-this",cat:"food",en:"I\u2019ll have this one",th:"\u0E40\u0E2D\u0E32\u0E2D\u0E31\u0E19\u0E19\u0E35\u0E49{P}",rom:"ao an-nee {P}",ko:"これにします",ctx:{en:'Point at the menu or the dish and order. Add "sorng" (two) etc. for quantity.',ko:"メニューや料理を指さして注文するときに使います。数量は「ソーン(2つ)」などの数字を付ければOKです。"},level:"polite"},{id:"cutlery",cat:"food",en:"Spoon and fork, please",th:"\u0E02\u0E2D\u0E0A\u0E49\u0E2D\u0E19\u0E2A\u0E49\u0E2D\u0E21\u0E2B\u0E19\u0E48\u0E2D\u0E22{P}",rom:"khor chon som noi {P}",ko:"スプーンとフォークをください",ctx:{en:"Thai food is eaten with a spoon (main tool) and fork (pusher). Chopsticks are only for noodle soups.",ko:"タイ料理はスプーン(メインの道具)とフォーク(押し役)で食べます。お箸は麺料理にだけ使います。"},level:"polite",note:{en:"Thais rarely put the fork in the mouth. Push food onto the spoon with the fork.",ko:"タイの人は口にフォークを入れず、フォークで食べ物をスプーンの上に押し乗せて食べます。"}},{id:"how-much",cat:"shopping",en:"How much is this?",th:"\u0E2D\u0E31\u0E19\u0E19\u0E35\u0E49\u0E40\u0E17\u0E48\u0E32\u0E44\u0E2B\u0E23\u0E48{Q}",rom:"an-nee tao-rai {Q}",ko:"これはいくらですか?",ctx:{en:"Point at the item and ask. Works at markets, malls and street stalls.",ko:"品物を指さして尋ねましょう。市場、ショッピングモール、屋台どこでも通じます。"},level:"polite"},{id:"pay-by-card",cat:"shopping",en:"Can I pay by card?",th:"\u0E08\u0E48\u0E32\u0E22\u0E1A\u0E31\u0E15\u0E23\u0E44\u0E14\u0E49\u0E44\u0E2B\u0E21{Q}",rom:"jai bat dai mai {Q}",ko:"カードで払えますか?",ctx:{en:"At small shops and markets, ask before ordering. Some places only take cash or QR.",ko:"小さなお店や市場では、注文の前に先に聞いておきましょう。現金かQRしか使えないお店もあります。"},level:"polite"},{id:"pay-by-qr",cat:"shopping",en:"Can I pay by QR code?",th:"\u0E2A\u0E41\u0E01\u0E19\u0E08\u0E48\u0E32\u0E22\u0E44\u0E14\u0E49\u0E44\u0E2B\u0E21{Q}",rom:"sa-kaen jai dai mai {Q}",ko:"QRコードで払えますか?",ctx:{en:"Many Thai shops use PromptPay QR codes. Foreign cards or apps may or may not work, so ask.",ko:"多くのお店がプロンプトペイのQRを使っています。外国のカードやアプリが使えるかどうかはお店次第なので、聞いてみるのがおすすめです。"},level:"polite"},{id:"another-size",cat:"shopping",en:"Do you have another size?",th:"\u0E21\u0E35\u0E44\u0E0B\u0E2A\u0E4C\u0E2D\u0E37\u0E48\u0E19\u0E44\u0E2B\u0E21{Q}",rom:"mee sai uen mai {Q}",ko:"他のサイズはありますか?",ctx:{en:"Clothes and shoes. Thai sizes can run small, so check the label.",ko:"服や靴を買うときに使います。タイのサイズは小さめなことがあるので、ラベルを必ず確認しましょう。"},level:"polite"},{id:"try-on",cat:"shopping",en:"Can I try this on?",th:"\u0E25\u0E2D\u0E07\u0E44\u0E14\u0E49\u0E44\u0E2B\u0E21{Q}",rom:"long dai mai {Q}",ko:"試着してもいいですか?",ctx:{en:"Before buying clothes. Some night-market stalls do not allow trying on.",ko:"服を買う前に聞いてみましょう。ナイトマーケットの露店には、試着できないところもあります。"},level:"polite"},{id:"discount",cat:"shopping",en:"Can you give a discount?",th:"\u0E25\u0E14\u0E44\u0E14\u0E49\u0E44\u0E2B\u0E21{Q}",rom:"lot dai mai {Q}",ko:"少し安くしてもらえますか?",ctx:{en:"Bargaining is normal at markets such as Chatuchak, but not in malls, convenience stores or fixed-price shops.",ko:"チャトゥチャックのような市場では値段交渉が普通ですが、ショッピングモール、コンビニ、定価のお店ではしません。"},level:"polite",note:{en:"Keep it friendly and smile. A small discount is common; pushing hard for deep cuts is considered rude.",ko:"笑顔でやわらかく聞いてみましょう。少しの値引きはよくありますが、大幅な値下げを強く迫ると失礼に見えます。"}},{id:"too-expensive",cat:"shopping",en:"A bit too expensive",th:"\u0E41\u0E1E\u0E07\u0E44\u0E1B\u0E2B\u0E19\u0E48\u0E2D\u0E22{P}",rom:"phaeng pai noi {P}",ko:"ちょっと高いですね",ctx:{en:"A soft way to start bargaining or to politely decline.",ko:"値段交渉を始めたり、丁寧に断ったりするときのやわらかい表現です。"},level:"polite"},{id:"cheaper",cat:"shopping",en:"Can it be cheaper?",th:"\u0E16\u0E39\u0E01\u0E01\u0E27\u0E48\u0E32\u0E19\u0E35\u0E49\u0E44\u0E14\u0E49\u0E44\u0E2B\u0E21{Q}",rom:"thook gwa nee dai mai {Q}",ko:"もっと安くなりませんか?",ctx:{en:'Second step in bargaining after "phaeng pai noi".',ko:"「ペーン・パイ・ノーイ」の次の段階の値段交渉の表現です。"},level:"polite"},{id:"just-looking",cat:"shopping",en:"Just looking",th:"\u0E02\u0E2D\u0E14\u0E39\u0E40\u0E09\u0E22\u0E46{P}",rom:"khor doo choei-choei {P}",ko:"見ているだけです",ctx:{en:"When staff follow you around or a vendor invites you in. Smile and say it.",ko:"店員さんがついてきたり、売り子さんに呼び込まれたりしたときに、笑顔で伝えましょう。"},level:"polite"},{id:"no-bag",cat:"shopping",en:"No bag needed",th:"\u0E44\u0E21\u0E48\u0E40\u0E2D\u0E32\u0E16\u0E38\u0E07{P}",rom:"mai ao thung {P}",ko:"袋はいりません",ctx:{en:"At 7-Eleven and shops. Plastic bags are being phased out in many stores, so carry a small tote.",ko:"セブン-イレブンやお店で使います。多くの店舗でレジ袋が減らされているので、小さなエコバッグを持っておくと便利です。"},level:"polite"},{id:"heat-it-up",cat:"shopping",en:"Please heat it up",th:"\u0E2D\u0E38\u0E48\u0E19\u0E43\u0E2B\u0E49\u0E2B\u0E19\u0E48\u0E2D\u0E22{P}",rom:"un hai noi {P}",ko:"温めてください",ctx:{en:"At convenience stores with microwaves for rice boxes, sandwiches and toasted buns.",ko:"電子レンジのあるコンビニで、お弁当、サンドイッチ、トーストパンを温めるときに使います。"},level:"polite"},{id:"receipt",cat:"shopping",en:"Receipt, please",th:"\u0E02\u0E2D\u0E43\u0E1A\u0E40\u0E2A\u0E23\u0E47\u0E08{P}",rom:"khor bai-set {P}",ko:"レシートをください",ctx:{en:"Keep receipts for returns and expense reports.",ko:"返品や経費精算のために、レシートは取っておきましょう。"},level:"polite"},{id:"tax-refund",cat:"shopping",en:"Tourist tax refund (VAT refund), please",th:"\u0E02\u0E2D\u0E04\u0E37\u0E19\u0E20\u0E32\u0E29\u0E35\u0E2A\u0E33\u0E2B\u0E23\u0E31\u0E1A\u0E19\u0E31\u0E01\u0E17\u0E48\u0E2D\u0E07\u0E40\u0E17\u0E35\u0E48\u0E22\u0E27\u0E44\u0E14\u0E49\u0E44\u0E2B\u0E21{Q}",rom:"khor khuen pha-see sam-rap nak thong-thiao dai mai {Q}",ko:"旅行者の税金還付(VATリファンド)はできますか?",ctx:{en:"Ask at the register of participating stores before paying. Bring your passport and ask for the refund paperwork and the tax invoice.",ko:"対象店舗のレジで、支払いの前に聞いてください。パスポートを持参し、還付の書類とタックスインボイスをお願いしましょう。"},level:"polite",note:{en:"Rules, minimum spend and eligible stores change, so check the current conditions at the shop and the official tourist VAT refund information.",ko:"条件、最低購入金額、対象店舗は変わることがあります。お店と公式の旅行者向けVAT還付案内で最新情報を確認してください。"}},{id:"deliver-to-hotel",cat:"shopping",en:"Can you deliver to the hotel?",th:"\u0E2A\u0E48\u0E07\u0E44\u0E1B\u0E17\u0E35\u0E48\u0E42\u0E23\u0E07\u0E41\u0E23\u0E21\u0E44\u0E14\u0E49\u0E44\u0E2B\u0E21{Q}",rom:"song pai thee rong-raem dai mai {Q}",ko:"ホテルまで配送してもらえますか?",ctx:{en:"For large or heavy purchases, or when ordering a lot of items for a group.",ko:"大きい物や重い物を買うとき、またはグループでたくさん買うときに聞いてみましょう。"},level:"polite"},{id:"where-is-bts",cat:"transport",en:"Where is the BTS station?",th:"\u0E2A\u0E16\u0E32\u0E19\u0E35\u0E1A\u0E35\u0E17\u0E35\u0E40\u0E2D\u0E2A\u0E2D\u0E22\u0E39\u0E48\u0E17\u0E35\u0E48\u0E44\u0E2B\u0E19{Q}",rom:"sa-tha-nee bee-tee-es yoo thee-nai {Q}",ko:"BTSの駅はどこですか?",ctx:{en:'Ask passers-by, shop staff or security guards. Replace "BTS" with "MRT" for the subway.',ko:"通りがかりの人、お店のスタッフ、警備員さんに聞いてみましょう。地下鉄なら「BTS」の部分を「MRT」に変えてください。"},level:"polite"},{id:"where-is-toilet",cat:"transport",en:"Where is the toilet?",th:"\u0E2B\u0E49\u0E2D\u0E07\u0E19\u0E49\u0E33\u0E2D\u0E22\u0E39\u0E48\u0E17\u0E35\u0E48\u0E44\u0E2B\u0E19{Q}",rom:"hong-nam yoo thee-nai {Q}",ko:"トイレはどこですか?",ctx:{en:"In malls, stations and restaurants. Public toilets can charge a few baht.",ko:"ショッピングモール、駅、レストランで聞いてみましょう。公共トイレは数バーツかかるところもあります。"},level:"polite"},{id:"stop-here",cat:"transport",en:"Please stop here",th:"\u0E08\u0E2D\u0E14\u0E15\u0E23\u0E07\u0E19\u0E35\u0E49\u0E44\u0E14\u0E49\u0E40\u0E25\u0E22{P}",rom:"jot trong-nee dai loei {P}",ko:"ここで止めてください",ctx:{en:"In a taxi or Grab when you reach your drop-off spot.",ko:"タクシーやGrabで、目的地に着いて降りる場所を伝えるときに使います。"},level:"polite"},{id:"get-off-here",cat:"transport",en:"I\u2019ll get off here",th:"\u0E02\u0E2D\u0E25\u0E07\u0E15\u0E23\u0E07\u0E19\u0E35\u0E49{P}",rom:"khor long trong-nee {P}",ko:"ここで降ります",ctx:{en:"On a bus, boat or motorbike taxi. On buses, press the bell or tell the conductor.",ko:"バス、ボート、バイクタクシーで使います。バスではベルを押すか、車掌さんに伝えましょう。"},level:"polite"},{id:"use-meter",cat:"transport",en:"Please use the meter",th:"\u0E40\u0E1B\u0E34\u0E14\u0E21\u0E34\u0E40\u0E15\u0E2D\u0E23\u0E4C\u0E14\u0E49\u0E27\u0E22{P}",rom:"poet mi-ter duai {P}",ko:"メーターを使ってください",ctx:{en:"As you get in a street taxi. If the driver refuses, step out and flag another. Grab is the easy fixed-price alternative.",ko:"流しのタクシーに乗るときに伝えましょう。断られたら降りて別のタクシーを拾います。Grabは料金が決まっていて、手軽な代わりの手段です。"},level:"polite"},{id:"turn-left",cat:"transport",en:"Turn left",th:"\u0E40\u0E25\u0E35\u0E49\u0E22\u0E27\u0E0B\u0E49\u0E32\u0E22{P}",rom:"liao saai {P}",ko:"左に曲がってください",ctx:{en:"Directions to a driver or when guiding someone.",ko:"運転手さんに道を伝えたり、誰かを案内したりするときに使います。"},level:"polite"},{id:"turn-right",cat:"transport",en:"Turn right",th:"\u0E40\u0E25\u0E35\u0E49\u0E22\u0E27\u0E02\u0E27\u0E32{P}",rom:"liao khwa {P}",ko:"右に曲がってください",ctx:{en:"Directions to a driver or when guiding someone.",ko:"運転手さんに道を伝えたり、誰かを案内したりするときに使います。"},level:"polite"},{id:"go-straight",cat:"transport",en:"Go straight",th:"\u0E15\u0E23\u0E07\u0E44\u0E1B{P}",rom:"trong pai {P}",ko:"まっすぐ行ってください",ctx:{en:"Directions in a car or when someone asks you the way.",ko:"車の中で道を案内するときや、誰かに道を聞かれたときに使います。"},level:"polite"},{id:"how-far",cat:"transport",en:"Is it far?",th:"\u0E44\u0E01\u0E25\u0E44\u0E2B\u0E21{Q}",rom:"glai mai {Q}",ko:"遠いですか?",ctx:{en:"Asking whether a place is walkable or how far a destination is.",ko:"歩いて行ける距離か、どのくらい遠いかを聞くときに使います。"},level:"polite"},{id:"how-long",cat:"transport",en:"How long does it take?",th:"\u0E43\u0E0A\u0E49\u0E40\u0E27\u0E25\u0E32\u0E19\u0E32\u0E19\u0E40\u0E17\u0E48\u0E32\u0E44\u0E2B\u0E23\u0E48{Q}",rom:"chai we-la nan tao-rai {Q}",ko:"どのくらい時間がかかりますか?",ctx:{en:"When you are planning arrival times. Bangkok traffic varies a lot by hour, so add buffer time.",ko:"到着時間を計画するときに聞いてみましょう。バンコクの交通は時間帯による差が大きいので、余裕を見ておきましょう。"},level:"polite"},{id:"go-to-airport",cat:"transport",en:"To Suvarnabhumi Airport, please",th:"\u0E44\u0E1B\u0E2A\u0E19\u0E32\u0E21\u0E1A\u0E34\u0E19\u0E2A\u0E38\u0E27\u0E23\u0E23\u0E13\u0E20\u0E39\u0E21\u0E34{P}",rom:"pai sa-nam-bin su-wan-na-phoom {P}",ko:"スワンナプーム空港までお願いします",ctx:{en:'Tell a taxi or Grab driver your destination. For Don Mueang say "sa-nam-bin don-mueang".',ko:"タクシーやGrabの運転手さんに目的地を伝えるときに使います。ドンムアン空港は「サナームビン・ドンムアン」と言います。"},level:"polite"},{id:"can-you-go-to",cat:"transport",en:"Can you go to Siam Paragon?",th:"\u0E44\u0E1B\u0E2A\u0E22\u0E32\u0E21\u0E1E\u0E32\u0E23\u0E32\u0E01\u0E2D\u0E19\u0E44\u0E14\u0E49\u0E44\u0E2B\u0E21{Q}",rom:"pai sa-yam pa-ra-gon dai mai {Q}",ko:"サイアム・パラゴンまで行ってもらえますか?",ctx:{en:"Ask before you get in a street taxi. Swap in any place name. Drivers sometimes refuse short or jammed trips.",ko:"流しのタクシーに乗る前に聞いてみましょう。場所の名前だけ入れ替えればOKです。近い距離や渋滞区間は断られることもあります。"},level:"polite"},{id:"wait-a-moment",cat:"transport",en:"Please wait a moment",th:"\u0E23\u0E2D\u0E2A\u0E31\u0E01\u0E04\u0E23\u0E39\u0E48\u0E19\u0E30{P}",rom:"ro sak-khroo na {P}",ko:"少し待ってください",ctx:{en:"Asking a driver to wait while you drop something off or run into a shop.",ko:"荷物を置いてきたり、お店にちょっと寄ったりするとき、運転手さんに待ってもらうために使います。"},level:"polite"},{id:"slow-down",cat:"transport",en:"Please slow down",th:"\u0E0A\u0E49\u0E32\u0E25\u0E07\u0E2B\u0E19\u0E48\u0E2D\u0E22{P}",rom:"chaa long noi {P}",ko:"少しゆっくり走ってください",ctx:{en:"On a motorbike taxi or in a car when the driver is going too fast.",ko:"バイクタクシーや車で、運転手さんがスピードを出しすぎているときに使います。"},level:"polite"},{id:"which-train",cat:"transport",en:"Does this train go to Siam?",th:"\u0E23\u0E16\u0E44\u0E1F\u0E1F\u0E49\u0E32\u0E02\u0E1A\u0E27\u0E19\u0E19\u0E35\u0E49\u0E44\u0E1B\u0E2A\u0E22\u0E32\u0E21\u0E44\u0E2B\u0E21{Q}",rom:"rot-fai-fa kha-buan nee pai sa-yam mai {Q}",ko:"この電車はサイアムに行きますか?",ctx:{en:"On BTS/MRT platforms when you are unsure about direction. Check the sign for the final station of the line, too.",ko:"BTS/MRTのホームで方向がわからなくなったときに聞いてみましょう。路線の終点駅の案内板も一緒に確認してください。"},level:"polite"},{id:"use-expressway",cat:"transport",en:"Can we take the expressway?",th:"\u0E02\u0E36\u0E49\u0E19\u0E17\u0E32\u0E07\u0E14\u0E48\u0E27\u0E19\u0E44\u0E14\u0E49\u0E44\u0E2B\u0E21{Q}",rom:"khuen thang-duan dai mai {Q}",ko:"高速道路(有料道路)を使ってもいいですか?",ctx:{en:"When you are in a hurry. The toll is paid by the passenger on top of the fare.",ko:"急いでいるときに使います。高速の料金は、運賃とは別に乗客が払います。"},level:"polite"},{id:"check-in",cat:"hotel",en:"I\u2019d like to check in",th:"\u0E02\u0E2D\u0E40\u0E0A\u0E47\u0E01\u0E2D\u0E34\u0E19{P}",rom:"khor chek-in {P}",ko:"チェックインをお願いします",ctx:{en:"At the front desk. Keep your passport handy, since hotels ask for it.",ko:"フロントで伝えましょう。ホテルではパスポートを求められるので、あらかじめ出しておきましょう。"},level:"polite"},{id:"check-out",cat:"hotel",en:"I\u2019d like to check out",th:"\u0E02\u0E2D\u0E40\u0E0A\u0E47\u0E01\u0E40\u0E2D\u0E32\u0E15\u0E4C{P}",rom:"khor chek-out {P}",ko:"チェックアウトをお願いします",ctx:{en:"At the front desk when leaving. Ask them to check the minibar and keep your receipt.",ko:"出発するときにフロントで伝えましょう。ミニバーの確認をお願いして、レシートを受け取ってください。"},level:"polite"},{id:"laundry",cat:"hotel",en:"I\u2019d like to send laundry",th:"\u0E02\u0E2D\u0E2A\u0E48\u0E07\u0E0B\u0E31\u0E01\u0E1C\u0E49\u0E32{P}",rom:"khor song sak pha {P}",ko:"クリーニングをお願いしたいです",ctx:{en:"Hotel laundry can be pricey per item. Ask for the price list or use a nearby coin or self-service laundry for training clothes.",ko:"ホテルのクリーニングは1点ごとの料金が高いことがあります。料金表を確認するか、練習着は近くのコインランドリーやセルフ洗濯店を使いましょう。"},level:"polite"},{id:"room-cleaning",cat:"hotel",en:"Please clean the room",th:"\u0E0A\u0E48\u0E27\u0E22\u0E17\u0E33\u0E04\u0E27\u0E32\u0E21\u0E2A\u0E30\u0E2D\u0E32\u0E14\u0E2B\u0E49\u0E2D\u0E07\u0E43\u0E2B\u0E49\u0E2B\u0E19\u0E48\u0E2D\u0E22{P}",rom:"chuai tham khwam sa-at hong hai noi {P}",ko:"お部屋の掃除をお願いします",ctx:{en:"Call the front desk or tell housekeeping when you leave for the day.",ko:"フロントに電話するか、外出するときにハウスキーピングに伝えましょう。"},level:"polite"},{id:"lost-room-key",cat:"hotel",en:"I lost my room key",th:"\u0E01\u0E38\u0E0D\u0E41\u0E08\u0E2B\u0E49\u0E2D\u0E07\u0E2B\u0E32\u0E22{P}",rom:"kun-jae hong hai {P}",ko:"部屋の鍵をなくしました",ctx:{en:"At the front desk. They will usually reissue a key card after checking your ID.",ko:"フロントで伝えましょう。たいてい本人確認のあと、カードキーを再発行してくれます。"},level:"polite"},{id:"extra-towels",cat:"hotel",en:"Extra towels, please",th:"\u0E02\u0E2D\u0E1C\u0E49\u0E32\u0E40\u0E0A\u0E47\u0E14\u0E15\u0E31\u0E27\u0E40\u0E1E\u0E34\u0E48\u0E21{P}",rom:"khor pha-chet-tua phoem {P}",ko:"タオルを追加でください",ctx:{en:"By phone to housekeeping or at the front desk.",ko:"ハウスキーピングに電話するか、フロントで頼みましょう。"},level:"polite"},{id:"late-checkout",cat:"hotel",en:"Can I check out late?",th:"\u0E02\u0E2D\u0E40\u0E0A\u0E47\u0E01\u0E40\u0E2D\u0E32\u0E15\u0E4C\u0E2A\u0E32\u0E22\u0E44\u0E14\u0E49\u0E44\u0E2B\u0E21{Q}",rom:"khor chek-out sai dai mai {Q}",ko:"遅めにチェックアウトしてもいいですか?",ctx:{en:"Ask the evening before. Late check-out may be free or charged by the hour.",ko:"前の日の夜に先に聞いておきましょう。無料の場合も、1時間ごとの料金がかかる場合もあります。"},level:"polite"},{id:"wifi-password",cat:"hotel",en:"What is the Wi-Fi password?",th:"\u0E23\u0E2B\u0E31\u0E2A\u0E44\u0E27\u0E44\u0E1F\u0E04\u0E37\u0E2D\u0E2D\u0E30\u0E44\u0E23{Q}",rom:"ra-hat wai-fai khue a-rai {Q}",ko:"Wi-Fiのパスワードは何ですか?",ctx:{en:"At hotels, cafes and restaurants. It is often on the receipt or a sign.",ko:"ホテル、カフェ、レストランで聞いてみましょう。レシートや案内板に書かれていることが多いです。"},level:"polite"},{id:"luggage-storage",cat:"hotel",en:"Can you store my luggage?",th:"\u0E1D\u0E32\u0E01\u0E01\u0E23\u0E30\u0E40\u0E1B\u0E4B\u0E32\u0E44\u0E14\u0E49\u0E44\u0E2B\u0E21{Q}",rom:"fak kra-pao dai mai {Q}",ko:"荷物を預かってもらえますか?",ctx:{en:"Before check-in or after check-out. Ask the front desk about their policy.",ko:"チェックイン前やチェックアウト後に使います。預かりのルールはフロントに確認してください。"},level:"polite"},{id:"aircon-not-cold",cat:"hotel",en:"The air conditioner isn\u2019t cold",th:"\u0E41\u0E2D\u0E23\u0E4C\u0E44\u0E21\u0E48\u0E40\u0E22\u0E47\u0E19{P}",rom:"air mai yen {P}",ko:"エアコンが冷えません",ctx:{en:"Report it to the front desk. In Bangkok heat a working aircon matters, so ask them to check or change rooms.",ko:"フロントに伝えましょう。バンコクの暑さではエアコンが大切なので、点検や部屋の変更をお願いしましょう。"},level:"polite"},{id:"breakfast-time",cat:"hotel",en:"What time does breakfast start?",th:"\u0E2D\u0E32\u0E2B\u0E32\u0E23\u0E40\u0E0A\u0E49\u0E32\u0E40\u0E23\u0E34\u0E48\u0E21\u0E01\u0E35\u0E48\u0E42\u0E21\u0E07{Q}",rom:"a-han chao roem gee mong {Q}",ko:"朝食は何時からですか?",ctx:{en:"At check-in or at the restaurant entrance.",ko:"チェックインのときや、レストランの入口で聞いてみましょう。"},level:"polite"},{id:"call-taxi",cat:"hotel",en:"Please call a taxi for me",th:"\u0E0A\u0E48\u0E27\u0E22\u0E40\u0E23\u0E35\u0E22\u0E01\u0E41\u0E17\u0E47\u0E01\u0E0B\u0E35\u0E48\u0E43\u0E2B\u0E49\u0E2B\u0E19\u0E48\u0E2D\u0E22{P}",rom:"chuai riak thaek-see hai noi {P}",ko:"タクシーを呼んでください",ctx:{en:"At the front desk. Ask them to write the destination in Thai for the driver.",ko:"フロントでお願いしましょう。目的地をタイ語で書いてもらうと、さらに便利です。"},level:"polite"},{id:"help",cat:"emergency",en:"Help!",th:"\u0E0A\u0E48\u0E27\u0E22\u0E14\u0E49\u0E27\u0E22{P}",rom:"chuai duai {P}",ko:"助けて!",ctx:{en:"In danger or a serious situation. Say it loudly. Thai emergency calls: police 191, ambulance 1669, tourist police 1155.",ko:"危険な状況や深刻な状況のときに、大きな声で叫びましょう。タイの緊急番号は、警察191、救急1669、ツーリストポリス1155です。"},level:"neutral"},{id:"call-ambulance",cat:"emergency",en:"Call an ambulance",th:"\u0E40\u0E23\u0E35\u0E22\u0E01\u0E23\u0E16\u0E1E\u0E22\u0E32\u0E1A\u0E32\u0E25\u0E14\u0E49\u0E27\u0E22{P}",rom:"riak rot pha-ya-baan duai {P}",ko:"救急車を呼んでください",ctx:{en:"Ask a bystander or staff to call, or dial 1669 yourself.",ko:"周りの人やスタッフにお願いするか、自分で1669に電話しましょう。"},level:"neutral"},{id:"go-to-hospital",cat:"emergency",en:"Please take me to the hospital",th:"\u0E02\u0E2D\u0E44\u0E1B\u0E42\u0E23\u0E07\u0E1E\u0E22\u0E32\u0E1A\u0E32\u0E25\u0E2B\u0E19\u0E48\u0E2D\u0E22{P}",rom:"khor pai rong-pha-ya-baan noi {P}",ko:"病院までお願いします",ctx:{en:"Tell a taxi/Grab driver. Show the hospital name on your phone map for speed.",ko:"タクシーやGrabの運転手さんに伝えましょう。病院の名前を地図アプリで見せると早いです。"},level:"polite"},{id:"call-police",cat:"emergency",en:"Call the police",th:"\u0E40\u0E23\u0E35\u0E22\u0E01\u0E15\u0E33\u0E23\u0E27\u0E08\u0E14\u0E49\u0E27\u0E22{P}",rom:"riak tam-ruat duai {P}",ko:"警察を呼んでください",ctx:{en:"For theft, accidents or threats. Dial 191, or the tourist police on 1155 (English-speaking).",ko:"盗難、事故、脅迫があったときに使います。191か、英語が通じるツーリストポリス1155に電話しましょう。"},level:"neutral"},{id:"allergy-peanut",cat:"emergency",en:"I\u2019m allergic to peanuts",th:"\u0E41\u0E1E\u0E49\u0E16\u0E31\u0E48\u0E27\u0E25\u0E34\u0E2A\u0E07{P}",rom:"phae thua li-song {P}",ko:"ピーナッツアレルギーがあります",ctx:{en:'Say it clearly before ordering. For other allergens, replace "thua li-song" with the item, then ask staff to confirm.',ko:"注文の前にはっきり伝えましょう。他のアレルギーは「トゥア・リソン」の部分をその食材に入れ替えて、スタッフに確認してもらってください。"},level:"polite",note:{en:"This is a real-allergy phrase, not a taste preference. Cross-contamination in wok kitchens is common, so also show the phrase on your phone.",ko:"好みではなく、本当のアレルギー用の文です。中華鍋で調理する環境では交差汚染がよくあるので、スマホにも文を表示して見せましょう。"}},{id:"allergy-seafood",cat:"emergency",en:"I\u2019m allergic to seafood",th:"\u0E41\u0E1E\u0E49\u0E2D\u0E32\u0E2B\u0E32\u0E23\u0E17\u0E30\u0E40\u0E25{P}",rom:"phae a-han tha-le {P}",ko:"海鮮アレルギーがあります",ctx:{en:"Covers shrimp, crab, squid and shellfish. Fish sauce and shrimp paste are hidden in many dishes.",ko:"エビ、カニ、イカ、貝類が含まれます。魚醤とエビのペーストは多くの料理に隠れています。"},level:"polite"},{id:"lost-way",cat:"emergency",en:"I\u2019m lost",th:"\u0E2B\u0E25\u0E07\u0E17\u0E32\u0E07{P}",rom:"long thang {P}",ko:"道に迷いました",ctx:{en:"Ask staff, police or a shopkeeper for help. Show your hotel name on the phone.",ko:"スタッフ、警察、お店の人に助けを求めましょう。ホテルの名前をスマホで見せてください。"},level:"polite"},{id:"lost-wallet",cat:"emergency",en:"I lost my wallet",th:"\u0E01\u0E23\u0E30\u0E40\u0E1B\u0E4B\u0E32\u0E2A\u0E15\u0E32\u0E07\u0E04\u0E4C\u0E2B\u0E32\u0E22{P}",rom:"kra-pao sa-tang hai {P}",ko:"財布をなくしました",ctx:{en:"Tell the police or tourist police and block your cards at once.",ko:"警察かツーリストポリスに伝え、すぐにカードを止めましょう。"},level:"polite"},{id:"lost-passport",cat:"emergency",en:"I lost my passport",th:"\u0E1E\u0E32\u0E2A\u0E1B\u0E2D\u0E23\u0E4C\u0E15\u0E2B\u0E32\u0E22{P}",rom:"pat-sa-pot hai {P}",ko:"パスポートをなくしました",ctx:{en:"Report to the tourist police for a police report, then contact your embassy. Keep a photo of your passport on your phone.",ko:"ツーリストポリスに届け出て紛失証明書をもらい、そのあと大使館に連絡しましょう。パスポートの写真をスマホに保存しておいてください。"},level:"polite"},{id:"thief",cat:"emergency",en:"Thief!",th:"\u0E21\u0E35\u0E02\u0E42\u0E21\u0E22{P}",rom:"mee kha-moy {P}",ko:"泥棒です!",ctx:{en:"If someone snatches a bag or phone. Shout it so people nearby react.",ko:"バッグやスマホをひったくられたときに使います。叫んで周りの人に知らせましょう。"},level:"neutral"},{id:"fire",cat:"emergency",en:"Fire!",th:"\u0E44\u0E1F\u0E44\u0E2B\u0E21\u0E49{P}",rom:"fai mai {P}",ko:"火事です!",ctx:{en:"Shout it, leave the building and call 199 for the fire service.",ko:"大声で叫び、建物から出て、消防199に電話しましょう。"},level:"neutral"},{id:"feel-sick",cat:"emergency",en:"I feel sick",th:"\u0E23\u0E39\u0E49\u0E2A\u0E36\u0E01\u0E44\u0E21\u0E48\u0E2A\u0E1A\u0E32\u0E22{P}",rom:"roo-suek mai sa-bai {P}",ko:"体調が悪いです",ctx:{en:'To staff, a teammate or a pharmacist. "mai sa-bai" means unwell; it is the opposite of "sa-bai dee".',ko:"スタッフ、チームメイト、薬剤師に伝えるときに使います。「マイ・サバーイ」は「体調が悪い」という意味で、「サバイディー」の反対です。"},level:"polite"},{id:"need-doctor",cat:"emergency",en:"I need to see a doctor",th:"\u0E02\u0E2D\u0E1E\u0E1A\u0E2B\u0E21\u0E2D\u0E2B\u0E19\u0E48\u0E2D\u0E22{P}",rom:"khor phop mor noi {P}",ko:"医師に診てもらいたいです",ctx:{en:"At a clinic, hospital or hotel front desk. Many hotels can call a doctor to the room.",ko:"病院、クリニック、ホテルのフロントで伝えましょう。部屋に医師を呼べるホテルも多いです。"},level:"polite"},{id:"stomach-ache",cat:"emergency",en:"I have a stomach ache",th:"\u0E1B\u0E27\u0E14\u0E17\u0E49\u0E2D\u0E07{P}",rom:"puat thong {P}",ko:"お腹が痛いです",ctx:{en:"Common with spicy or street food. Pharmacies can help with mild cases.",ko:"辛い料理や屋台の料理でよくあります。軽い症状なら、薬局で相談できます。"},level:"polite"},{id:"have-fever",cat:"emergency",en:"I have a fever",th:"\u0E21\u0E35\u0E44\u0E02\u0E49{P}",rom:"mee khai {P}",ko:"熱があります",ctx:{en:"To a doctor or pharmacist. Dengue is present in Thailand, so see a doctor if fever persists.",ko:"医師や薬剤師に伝えましょう。タイにはデング熱があるので、熱が続くようなら診察を受けてください。"},level:"polite"},{id:"where-pharmacy",cat:"emergency",en:"Where is a pharmacy?",th:"\u0E23\u0E49\u0E32\u0E19\u0E02\u0E32\u0E22\u0E22\u0E32\u0E2D\u0E22\u0E39\u0E48\u0E17\u0E35\u0E48\u0E44\u0E2B\u0E19{Q}",rom:"ran khai ya yoo thee-nai {Q}",ko:"薬局はどこですか?",ctx:{en:"Pharmacies are everywhere and pharmacists can recommend remedies for mild issues.",ko:"薬局はどこにでもあり、薬剤師が軽い症状に合った薬を勧めてくれます。"},level:"polite"},{id:"call-embassy",cat:"emergency",en:"Please call the Japanese embassy",th:"ช่วยโทรหาสถานทูตญี่ปุ่นให้หน่อย{P}",rom:"chuai tho ha sa-than-thoot yee-pun hai noi {P}",ko:"日本大使館に電話してください",ctx:{en:"For passport loss, arrests or serious accidents. Ask police or hotel staff to help you place the call.",ko:"パスポートの紛失、逮捕、重大な事故のときに使います。警察やホテルのスタッフに電話をつないでもらいましょう。"},level:"polite"},{id:"slang-555",cat:"slang",en:"555 (LOL)",th:"555",rom:"ha ha ha (five-five-five)",ko:"www",ctx:{en:'Texting laughter. Thai for 5 is "ha", so 555 reads "ha ha ha". More 5s means a bigger laugh.',ko:"文字で笑いを表現します。タイ語で5は「ハー(ห้า)」なので、555は「ハハハ」と読みます。5が多いほど大笑いです。"},level:"casual",note:{en:"Same job as Japanese \"www\" or \"草\". Fine in chats with friends and teammates, but you would skip it in formal emails.",ko:"日本語の「www」や「草」と同じ役割です。友達やチームメイトとのチャットならOKですが、正式なメールでは使いません。"}},{id:"slang-jueng",cat:"slang",en:"Wow! Stunning / so impressive",th:"\u0E08\u0E36\u0E49\u0E07",rom:"jueng",ko:"やばい! / すごい",ctx:{en:'Reaction to something eye-catching: a dazzling outfit, a perfect play, a stunning view. Often "jueng mak" (so jueng).',ko:"目を引く素敵な服、完璧なプレー、絶景に反応するときに使います。「ジューン マーク(めっちゃすごい)」のようにも使います。"},level:"slang",note:{en:"Trendy online slang among young people. Not used in formal speech, and it may sound odd to older people.",ko:"若い人たちがネットで使う流行語です。改まった場では使わず、年上の人には不自然に聞こえることがあります。"}},{id:"slang-khot-di",cat:"slang",en:"Super good / insanely good",th:"\u0E42\u0E04\u0E15\u0E23\u0E14\u0E35",rom:"khot dee",ko:"クソいい / めっちゃいい",ctx:{en:'Strong praise among friends. "khot" is an intensifier meaning "extremely" and can be put before other words, like khot a-roi.',ko:"友達同士の強い褒め言葉です。「コット」は「めちゃくちゃ」という強調語で、「コット アロイ」のように他の言葉の前にもつけます。"},level:"slang",note:{en:"\"khot\" comes from a rude word, so keep it to friends, never to elders, staff, or clients. Think of Japanese \"クソ~\" prefixes: casual, can sound crude.",ko:"「コット」は下品な言葉から来た強調語なので、友達同士だけで使ってください。年上の人、スタッフ、取引先には絶対NGです。日本語の「クソ~」のような接頭語に近く、気軽ですが乱暴に聞こえることがあります。"}},{id:"slang-tueng",cat:"slang",en:"Intense / awesome (impressively strong)",th:"\u0E15\u0E36\u0E07",rom:"tueng",ko:"すごい / やばい(実力がすごい)",ctx:{en:'Used by young people and gamers when something or someone is impressively strong, intense or cool. Often "tueng mak".',ko:"若い人やゲーマーが、人でも物でも圧倒的に強くてかっこいいときに使います。「トゥン マーク」のようにも使います。"},level:"slang",note:{en:"Casual slang for friends and online chat. Tone is hype and playful. Not for formal talk.",ko:"友達やオンラインチャット向けのスラングです。ノリがよくて遊び心のある感じなので、改まった場では使いません。"}},{id:"slang-sut-jat",cat:"slang",en:"Absolutely the best / over the top",th:"\u0E2A\u0E38\u0E14\u0E08\u0E31\u0E14",rom:"sut jat",ko:"最高 / 振り切ってる",ctx:{en:'Praising something that reaches the max: food, a performance, a party. Often "sut jat sut jat".',ko:"料理、ライブ、パーティーなど最高レベルのときの褒め言葉です。「スット ジャット スット ジャット」のように繰り返すこともあります。"},level:"slang",note:{en:"Fun, energetic and casual. Fine with friends and in posts; skip it in formal situations.",ko:"楽しくて元気いっぱいのカジュアルな表現です。友達やSNSの投稿ならOKですが、改まった場では避けましょう。"}},{id:"slang-mai-wai-laeo",cat:"slang",en:"I can\u2019t take it anymore (so funny / so cute / so tired)",th:"\u0E44\u0E21\u0E48\u0E44\u0E2B\u0E27\u0E41\u0E25\u0E49\u0E27",rom:"mai wai laeo",ko:"もう無理です(おもしろすぎて / かわいすぎて / 疲れすぎて)",ctx:{en:'Literally "can\u2019t cope any more". Used when you are laughing too hard, overwhelmed by cuteness, or truly worn out. Meaning comes from the context.',ko:"直訳すると「もう耐えられない」です。笑いすぎたとき、かわいすぎるとき、本当に疲れたときのどれにも使います。意味は状況によって変わります。"},level:"casual",note:{en:"Everyday casual Thai. Add khrap/kha when speaking to someone you are not close to.",ko:"日常的な口語です。親しくない人には、文末に「クラップ/カー」といった丁寧語をつけましょう。"}},{id:"slang-pang",cat:"slang",en:"Awesome / spot on / killer",th:"\u0E1B\u0E31\u0E07",rom:"pang",ko:"最高 / キマってる / やばい",ctx:{en:'Praise for outfits, looks, results, ideas or performances that turned out great. Often "pang mak".',ko:"服、ルック、結果、アイデア、ステージなどがすばらしいときの褒め言葉です。「パン マーク」のようにも使います。"},level:"slang",note:{en:"Safe, friendly slang. Common even in the media. Like Japanese \"キマってる\".",ko:"無難で親しみやすい流行語で、メディアでもよく見かけます。日本語の「キマってる」に近いです。"}},{id:"slang-saep",cat:"slang",en:"Delicious (and often spicy)",th:"\u0E41\u0E0B\u0E48\u0E1A",rom:"saep",ko:"おいしい(たいてい辛い)",ctx:{en:"An Isan (northeastern) word for tasty, very popular nationwide. Used for som tam, larb and spicy street food.",ko:"イサーン(東北部)の言葉で「おいしい」という意味で、全国的に人気です。ソムタム、ラープ、辛い屋台料理によく使います。"},level:"casual",note:{en:"Friendly and fun. Vendors love hearing it. Compare Japanese \"おいしい\" with a \"ピリ辛\" kick.",ko:"親しみやすくて楽しい表現なので、屋台のおじさんおばさんも喜びます。日本語の「おいしい」に「ピリ辛」が少し混ざった感じです。"}},{id:"slang-chill",cat:"slang",en:"Chill / relaxed",th:"\u0E0A\u0E34\u0E25",rom:"chill (chin)",ko:"のんびり / まったり",ctx:{en:'Borrowed from English "chill". Said "chin chin" in Thai, it means taking it easy; a chill cafe is a relaxed one.',ko:"英語の「chill」から来た言葉です。タイ語の発音は「チン」で、のんびり楽しむという意味です。「チルなカフェ」は居心地のいいカフェのことです。"},level:"casual"},{id:"slang-hiu-jang",cat:"slang",en:"I\u2019m so hungry!",th:"\u0E2B\u0E34\u0E27\u0E08\u0E31\u0E07",rom:"hiu jang",ko:"お腹すいて死にそう",ctx:{en:'Casual complaint among friends before a meal. "jang" adds feeling, like "so" in English.',ko:"食事の前に友達同士でぼやくときの言葉です。「ジャン」は英語の「so」のように気持ちを強めます。"},level:"casual",note:{en:'Fine with friends and teammates. To staff say polite "hiu khao" (hungry) or just order food.',ko:"友達やチームメイトになら大丈夫です。スタッフには、丁寧に「ヒウ カーオ(お腹がすきました)」と言うか、そのまま注文しましょう。"}},{id:"slang-kreng-jai",cat:"slang",en:"Kreng jai (hesitating to impose on others)",th:"\u0E40\u0E01\u0E23\u0E07\u0E43\u0E08",rom:"kreng jai",ko:"気を遣って、迷惑をかけたくない気持ち",ctx:{en:'A key Thai value: you do not want to trouble, burden or embarrass someone. A Thai person may say "kreng jai" when declining your help or an offer.',ko:"タイ文化の大切な価値観です。相手に迷惑をかけたり、負担をかけたり、恥をかかせたりしたくない気持ちのことです。手助けや申し出を断るときに、タイの人は「クレンチャイ」と言います。"},level:"neutral",note:{en:"It is hard to translate. It is like Japanese \"遠慮\" (enryo) + \"気を遣う\". If a Thai person says kreng jai, offer once more kindly.",ko:"訳しにくい言葉です。日本語の「遠慮」や「気を遣う」気持ちに近いです。タイの人が「クレンチャイ」と言ったら、もう一度やさしく勧めてみてください。"}},{id:"slang-wer",cat:"slang",en:"Exaggerating / over the top",th:"\u0E40\u0E27\u0E48\u0E2D\u0E23\u0E4C",rom:"wer",ko:"大げさ / やりすぎ",ctx:{en:'Said about something exaggerated or too much, e.g. a huge reaction or an over-decorated post. Often "wer mak".',ko:"大げさだったり度が過ぎたりする反応や、盛りすぎた投稿などに使います。「ウー マーク」のようにも使います。"},level:"casual",note:{en:"Casual and teasing. Use only with friends, since it can sound critical.",ko:"カジュアルでからかうような言葉です。批判に聞こえることがあるので、親しい間柄だけで使ってください。"}},{id:"slang-ao-laeo",cat:"slang",en:"Uh-oh / here we go",th:"\u0E40\u0E2D\u0E32\u0E41\u0E25\u0E49\u0E27",rom:"ao laeo",ko:"あーあ、来たか / 始まったぞ",ctx:{en:"Reaction when something is about to go wrong or when an expected problem appears, often with a laugh.",ko:"何かうまくいかなさそうなときや、予想していた問題が起きたときに、笑いながら言う反応です。"},level:"casual"},{id:"slang-mua",cat:"slang",en:"Making it up / messing up / nonsense",th:"\u0E21\u0E31\u0E48\u0E27",rom:"mua",ko:"適当 / でたらめ / めちゃくちゃ",ctx:{en:'When someone guesses randomly, answers carelessly, or is inaccurate. "Phoot mua" = talking nonsense.',ko:"適当に当てずっぽうで答えたり、いい加減だったり、不正確だったりするときに使います。「プート ムア」は「でたらめを言う」という意味です。"},level:"casual",note:{en:"Fine among friends but can sound critical or rude if said about someone\u2019s work or words.",ko:"友達同士なら大丈夫ですが、相手の仕事や発言に使うと非難のように聞こえて失礼になることがあります。"}},{id:"slang-ngong",cat:"slang",en:"Confused / I don\u2019t get it",th:"\u0E07\u0E07",rom:"ngong",ko:"混乱してます / わかりません",ctx:{en:'Used by almost everyone for being puzzled: "ngong mak" = totally confused.',ko:"ほとんどの世代が、戸惑ったりわけがわからなかったりするときに使います。「ンゴン マーク」は「完全に混乱」という意味です。"},level:"casual"},{id:"slang-seng",cat:"slang",en:"Bummed / bored",th:"\u0E40\u0E0B\u0E47\u0E07",rom:"seng",ko:"うんざり / 退屈",ctx:{en:"When plans fall through, you are bored, or something is disappointing.",ko:"計画が狂ったとき、退屈なとき、がっかりしたときに使います。"},level:"casual"},{id:"slang-fin",cat:"slang",en:"So satisfying / blissful",th:"\u0E1F\u0E34\u0E19",rom:"fin",ko:"最高に幸せ / たまらない",ctx:{en:"The feeling of blissful satisfaction: a cold drink on a hot day, a perfect massage, a great fan moment.",ko:"幸せな満足感を表す言葉です。暑い日の冷たい飲み物、完璧なマッサージ、ファンとしての最高の瞬間などで使います。"},level:"casual"},{id:"slang-su-su",cat:"slang",en:"You can do it! / Keep fighting!",th:"\u0E2A\u0E39\u0E49\u0E46",rom:"soo soo",ko:"頑張れ!",ctx:{en:"Encouragement before a match, an exam or hard work. Great to say to teammates.",ko:"試合、試験、大変な仕事の前の応援に使います。チームメイトに言うのにぴったりです。"},level:"casual",note:{en:"Exactly like Japanese \"ファイト\" / \"頑張れ\". Add khrap/kha to make it more polite: soo soo khrap/kha.",ko:"日本語の「ファイト」や「頑張れ」とほぼ同じです。丁寧にするには、「スースー クラップ/カー」のように語尾をつけましょう。"}},{id:"caution-mueng-goo",cat:"slang",en:"\u0E21\u0E36\u0E07 / \u0E01\u0E39 (rude \u201Cyou\u201D / \u201CI\u201D)",th:"\u0E21\u0E36\u0E07 / \u0E01\u0E39",rom:"mueng / goo",ko:"お前 / 俺(とても乱暴な言い方、ほぼ罵り言葉)",ctx:{en:"Heard among very close friends and in movies or games. These are coarse pronouns for \u201Cyou\u201D and \u201CI\u201D.",ko:"とても親しい友達同士や、映画やゲームで聞こえる、乱暴な「あなた」と「私」の代名詞です。"},level:"caution",note:{en:'NEVER use these with staff, elders, strangers or clients. They sound aggressive and insulting. Stay with polite endings (khrap/kha) and "khun" for \u201Cyou\u201D.',ko:"スタッフ、年上の人、知らない人、取引先には絶対に使わないでください。攻撃的で侮辱的に聞こえます。丁寧な語尾(クラップ/カー)と、「あなた」の意味の「クン」を使いましょう。"}},{id:"caution-khwai",cat:"slang",en:"\u0E04\u0E27\u0E32\u0E22 (calling someone stupid)",th:"\u0E04\u0E27\u0E32\u0E22",rom:"khwai",ko:"バカ(罵り言葉)",ctx:{en:'Literally "water buffalo". Used as an insult for \u201Cidiot\u201D. You may hear it in jokes and gaming trash talk.',ko:"もともとは「水牛」の意味で、「バカ、間抜け」という罵り言葉として使われます。冗談やゲーム中のトラッシュトークで耳にすることがあります。"},level:"caution",note:{en:"Offensive. Do not say it to anyone, even as a joke, unless you are very close friends and sure they will laugh. Never in public or toward staff.",ko:"侮辱的な言葉です。とても親しくて、相手が笑ってくれると確信できる場合を除き、冗談でも言わないでください。人前やスタッフには絶対NGです。"}},{id:"caution-ai-ee",cat:"slang",en:"\u0E44\u0E2D\u0E49 / \u0E2D\u0E35 (insulting name prefixes)",th:"\u0E44\u0E2D\u0E49 / \u0E2D\u0E35",rom:"ai / ee",ko:"あの野郎 / あのアマ(呼び名の前につける罵り)",ctx:{en:'Placed before a name or noun: "ai" for men and "ee" for women. Between close friends it can be teasing, but with others it is an insult.',ko:"名前や名詞の前につけます。男性には「アイ」、女性には「イー」です。とても親しい間柄ではからかいになることもありますが、それ以外では侮辱になります。"},level:"caution",note:{en:'Avoid completely. It can start a fight if aimed at a stranger. Use "khun" (Mr/Ms) or "phi" (older sibling) + name for friendly respect.',ko:"完全に避けてください。知らない人に使うとケンカになることもあります。親しみと敬意を示すには、「クン(~さん)」や「ピー(お兄さん/お姉さん)」+名前を使いましょう。"}},{id:"team-deliver-lobby",cat:"team",en:"Please deliver to the lobby",th:"\u0E01\u0E23\u0E38\u0E13\u0E32\u0E2A\u0E48\u0E07\u0E17\u0E35\u0E48\u0E25\u0E47\u0E2D\u0E1A\u0E1A\u0E35\u0E49{P}",rom:"ga-roo-naa song thee lop-bee {P}",ko:"ロビーに配達してください",ctx:{en:"Tell a delivery rider or shop that the package, food or equipment should be dropped at the hotel lobby or reception.",ko:"配達員やお店に、荷物、料理、機材をホテルのロビーやフロントに置いてほしいと伝えるときに使います。"},level:"polite"},{id:"team-package-for-me",cat:"team",en:"Is there a package for me?",th:"\u0E21\u0E35\u0E1E\u0E31\u0E2A\u0E14\u0E38\u0E21\u0E32\u0E2A\u0E48\u0E07\u0E44\u0E2B\u0E21{Q}",rom:"mee phat-sa-doo ma song mai {Q}",ko:"私宛ての荷物は届いていますか?",ctx:{en:"At the hotel front desk to check whether a delivery has arrived.",ko:"ホテルのフロントで、荷物が届いているか確認するときに使います。"},level:"polite"},{id:"team-receive-package",cat:"team",en:"Please receive the package for us",th:"\u0E0A\u0E48\u0E27\u0E22\u0E23\u0E31\u0E1A\u0E1E\u0E31\u0E2A\u0E14\u0E38\u0E43\u0E2B\u0E49\u0E2B\u0E19\u0E48\u0E2D\u0E22{P}",rom:"chuai rap phat-sa-doo hai noi {P}",ko:"荷物を代わりに受け取ってください",ctx:{en:"Ask hotel staff to accept a delivery when nobody is in the room.",ko:"部屋に誰もいないとき、ホテルのスタッフに荷物の受け取りをお願いするときに使います。"},level:"polite"},{id:"team-rooms-together",cat:"team",en:"Can we have rooms next to each other?",th:"\u0E02\u0E2D\u0E2B\u0E49\u0E2D\u0E07\u0E15\u0E34\u0E14\u0E01\u0E31\u0E19\u0E44\u0E14\u0E49\u0E44\u0E2B\u0E21{Q}",rom:"khor hong tit gan dai mai {Q}",ko:"部屋を隣同士にしていただけますか?",ctx:{en:"At check-in for a group. Hotels will try but cannot always guarantee it.",ko:"グループのチェックイン時に使います。ホテルは努力してくれますが、いつも保証されるわけではありません。"},level:"polite"},{id:"team-extra-room",cat:"team",en:"Can you book an extra room?",th:"\u0E0A\u0E48\u0E27\u0E22\u0E08\u0E2D\u0E07\u0E2B\u0E49\u0E2D\u0E07\u0E40\u0E1E\u0E34\u0E48\u0E21\u0E44\u0E14\u0E49\u0E44\u0E2B\u0E21{Q}",rom:"chuai jong hong phoem dai mai {Q}",ko:"部屋を追加で予約していただけますか?",ctx:{en:"When one more person or staff member joins and you need another room.",ko:"メンバーやスタッフがもう1人加わって、部屋が追加で必要なときに使います。"},level:"polite"},{id:"team-where-electronics",cat:"team",en:"Where can I buy computer equipment?",th:"\u0E23\u0E49\u0E32\u0E19\u0E02\u0E32\u0E22\u0E2D\u0E38\u0E1B\u0E01\u0E23\u0E13\u0E4C\u0E04\u0E2D\u0E21\u0E1E\u0E34\u0E27\u0E40\u0E15\u0E2D\u0E23\u0E4C\u0E2D\u0E22\u0E39\u0E48\u0E17\u0E35\u0E48\u0E44\u0E2B\u0E19{Q}",rom:"ran khai up-pa-gon kom-phiw-ter yoo thee-nai {Q}",ko:"パソコン機器はどこで買えますか?",ctx:{en:"When a keyboard, mouse or cable breaks. Ask hotel staff or shopping-mall information; IT malls are a common answer.",ko:"キーボード、マウス、ケーブルが壊れたときは、ホテルのスタッフやショッピングモールの案内所に聞いてみましょう。IT専門のモールを教えてくれることが多いです。"},level:"polite"},{id:"team-have-this-cable",cat:"team",en:"Do you have this charging cable?",th:"\u0E21\u0E35\u0E2A\u0E32\u0E22\u0E0A\u0E32\u0E23\u0E4C\u0E08\u0E41\u0E1A\u0E1A\u0E19\u0E35\u0E49\u0E44\u0E2B\u0E21{Q}",rom:"mee sai chaat baep nee mai {Q}",ko:"この充電ケーブルはありますか?",ctx:{en:"Show the broken cable or a photo on your phone. Shops will usually bring the matchi
