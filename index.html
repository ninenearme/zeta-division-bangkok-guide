32\u0E19\u0E19\u0E49\u0E2D\u0E22{P}",rom:"khor nam an-chan ma-nao wan noi {P}"},fact:{en:"The color change is real chemistry: the flower's pigment turns pink or purple when it meets the acid in the lime.",ko:"色が変わるのは本物の化学反応です。花の色素がライムの酸に触れると、ピンク色や紫色に変わります。"},where:[{name:"Caf\xE9s and drink carts across Bangkok",area:"other",note:{en:"A photo-friendly drink that is also sold at ordinary street carts.",ko:"写真映えするドリンクで、普通の屋台でも売っています。"}}],imgQuery:"Butterfly pea flower tea lemonade",imgAlt:"A blue and purple butterfly pea flower lemonade in a glass",mapsQuery:"butterfly pea lemonade Bangkok"},{id:"watermelon-smoothie",cat:"drinks",name:{en:"Watermelon Smoothie (Taeng Mo Pan)",th:"\u0E41\u0E15\u0E07\u0E42\u0E21\u0E1B\u0E31\u0E48\u0E19",ko:"テンモーパン(スイカスムージー)"},rom:"taeng-mo pan",desc:{en:"Fresh watermelon blended with ice and a splash of syrup into a slushy, cold drink. One of the most popular fruit shakes on a hot Bangkok day.",ko:"新鮮なスイカを氷とシロップと一緒にミキサーにかけて、スラッシュのように作った冷たいドリンクです。暑いバンコクでいちばん人気のあるフルーツシェイクのひとつです。"},ingredients:{en:["watermelon","ice","sugar syrup"],ko:["スイカ","氷","シュガーシロップ"]},spice:0,price:[30,60],allergens:[],pork:"no",seafood:"no",veg:"yes",caffeine:!1,tags:["street","sweet","local-fav","beginner","post-practice"],beginner:{en:"Most stalls add sugar syrup on top of already sweet watermelon. Say 'mai sai nam chueam' (no syrup) and it will still taste sweet. It is mostly water and ice, which makes it a good hydrating option in the heat.",ko:"ほとんどのお店は、すでに甘いスイカにさらにシロップを入れます。「マイサイ・ナムチュアム」(シロップ抜き)と言っても、十分甘いです。ほとんどがスイカと氷なので、暑いときの水分補給にいいです。"},order:{en:"Watermelon smoothie, no syrup.",ko:"スイカスムージーを、シロップ抜きでお願いします。",th:"\u0E02\u0E2D\u0E41\u0E15\u0E07\u0E42\u0E21\u0E1B\u0E31\u0E48\u0E19\u0E44\u0E21\u0E48\u0E43\u0E2A\u0E48\u0E19\u0E49\u0E33\u0E40\u0E0A\u0E37\u0E48\u0E2D\u0E21{P}",rom:"khor taeng-mo pan mai sai nam-chueam {P}"},fact:{en:"Japanese travelers often order it simply as a 'watermelon shake' (suika shake), and it is easy to find under that name on menus.",ko:"日本人旅行者には「スイカシェイク」としてよく注文されていて、メニューでもその名前で見つけやすいです。"},where:[{name:"Fruit-shake carts across Bangkok",area:"other",note:{en:"Found everywhere at fruit stalls, markets and near transport exits.",ko:"フルーツの屋台、市場、公共交通機関の出口付近など、どこでも見かけます。"}}],imgQuery:"Watermelon smoothie Thailand",imgAlt:"Glass of fresh watermelon juice with watermelon slices",mapsQuery:"watermelon smoothie Bangkok"},{id:"roselle-juice",cat:"drinks",name:{en:"Roselle Juice (Nam Krachiap)",th:"\u0E19\u0E49\u0E33\u0E01\u0E23\u0E30\u0E40\u0E08\u0E35\u0E4A\u0E22\u0E1A",ko:"ロゼルジュース(ナム・クラチアップ)"},rom:"nam kra-jiap",desc:{en:"A ruby-red drink brewed from dried roselle (hibiscus) petals, sweetened and served cold or warm. Tart, fruity and refreshing, similar to cranberry juice.",ko:"乾燥したロゼル(ハイビスカス)のがくを煮出して作る、ルビー色の飲み物です。砂糖を入れて、冷たくても温かくても飲みます。酸味があってフルーティーで、クランベリージュースに似ています。"},ingredients:{en:["dried roselle (hibiscus) calyces","water","sugar","ice"],ko:["乾燥ロゼル（ハイビスカス）のがく","水","砂糖","氷"]},spice:0,price:[15,40],allergens:[],pork:"no",seafood:"no",veg:"yes",caffeine:!1,tags:["street","sweet"],beginner:{en:"Naturally tart; vendors balance it with plenty of sugar, so say 'wan noi' if you prefer a sharper taste. It has no caffeine and is a good thirst-quencher.",ko:"もともと酸っぱいので、屋台ではかなり砂糖を入れます。もっと酸味を効かせたいなら「ワーンノーイ」と伝えてください。カフェインがなく、喉の渇きを癒すのにぴったりです。"},order:{en:"Roselle juice, less sweet.",ko:"ロゼルジュースを、甘さ控えめでお願いします。",th:"\u0E02\u0E2D\u0E19\u0E49\u0E33\u0E01\u0E23\u0E30\u0E40\u0E08\u0E35\u0E4A\u0E22\u0E1A\u0E2B\u0E27\u0E32\u0E19\u0E19\u0E49\u0E2D\u0E22{P}",rom:"khor nam kra-jiap wan noi {P}"},fact:{en:"Roselle juice is a classic Thai herbal-style drink sold in bottles and bags in markets, often next to chrysanthemum and pandan drinks.",ko:"ロゼルジュースはタイの代表的なハーブ系ドリンクです。市場でボトルや袋に入れて、菊茶やパンダンのドリンクの隣に並べて売っています。"},where:[{name:"Market drink stalls",area:"other",note:{en:"Usually part of a line of herbal drinks at markets and street carts.",ko:"市場や屋台で、ハーブドリンクのラインナップのひとつとして売っています。"}}],imgQuery:"Roselle juice Thailand",imgAlt:"A glass of red roselle juice with ice",mapsQuery:"roselle juice Bangkok"},{id:"matcha-latte",cat:"drinks",name:{en:"Matcha Latte (Caf\xE9 Culture)",th:"\u0E21\u0E31\u0E17\u0E09\u0E30\u0E25\u0E32\u0E40\u0E15\u0E49",ko:"抹茶ラテ(バンコクのカフェ文化)"},rom:"mat-cha la-te",desc:{en:"Whisked matcha green tea with milk, served iced or hot. Matcha menus are a big part of Bangkok's caf\xE9 scene, and many caf\xE9s offer sweet, creamy and unsweetened options.",ko:"抹茶を溶いて牛乳と合わせたラテで、アイスでもホットでも楽しめます。バンコクのカフェ文化では抹茶メニューが大人気で、甘くてまろやかなものから無糖までいろいろ選べます。"},ingredients:{en:["matcha powder","milk (dairy or plant-based)","sugar syrup (optional)","ice"],ko:["抹茶パウダー","牛乳（普通または植物性）","シュガーシロップ（お好みで）","氷"]},spice:0,price:[80,180],allergens:["dairy"],pork:"no",seafood:"no",veg:"yes",caffeine:!0,tags:["kr-familiar","sweet"],beginner:{en:"Caf\xE9 prices are much higher than street drinks. Matcha contains caffeine, similar to a moderate cup of coffee, so be careful in the evening. Quality and sweetness differ a lot between caf\xE9s; ask for less sweet or no syrup if you want a stronger tea taste.",ko:"カフェの値段は屋台のドリンクよりずっと高いです。抹茶にはカフェインが入っていて、普通のコーヒー1杯くらいなので、夜は気をつけてください。品質や甘さはカフェによって大きく違います。お茶の味をしっかり感じたいなら、甘さ控えめかシロップなしで注文しましょう。"},order:{en:"Iced matcha latte, not sweet.",ko:"アイス抹茶ラテを、甘くしないでお願いします。",th:"\u0E02\u0E2D\u0E21\u0E31\u0E17\u0E09\u0E30\u0E25\u0E32\u0E40\u0E15\u0E49\u0E40\u0E22\u0E47\u0E19 \u0E44\u0E21\u0E48\u0E2B\u0E27\u0E32\u0E19{P}",rom:"khor mat-cha la-te yen mai wan {P}"},fact:{en:"Bangkok has a thriving matcha café scene, with many shops specializing in matcha drinks and desserts alongside Japanese-style cafés.",ko:"バンコクには、抹茶ドリンクやデザートの専門カフェがたくさんあります。日本風のカフェと並んで人気を集めています。"},where:[{name:"Specialty caf\xE9s in Ari and Thonglor",area:"ari",note:{en:"Ari and Thonglor are both full of independent caf\xE9s; search for matcha caf\xE9s on Google Maps near your location.",ko:"アーリーとトンローはどちらも個人経営のカフェが多いです。Googleマップで近くの抹茶カフェを検索してみてください。"}}],imgQuery:"Iced matcha latte",imgAlt:"An iced matcha latte in a clear glass",mapsQuery:"matcha cafe Bangkok"},{id:"chrysanthemum-tea",cat:"drinks",name:{en:"Chrysanthemum Tea (Nam Kek Huay)",th:"\u0E19\u0E49\u0E33\u0E40\u0E01\u0E4A\u0E01\u0E2E\u0E27\u0E22",ko:"菊花茶(ナム・ケックフアイ)"},rom:"nam kek-huai",desc:{en:"A light, floral, sweetened chrysanthemum flower tea served cold or hot. Popular in Chinatown and with a clean, honey-like taste.",ko:"菊の花で淹れた、軽くて香りがよく、ほんのり甘いお茶です。冷たくても温かくても飲みます。チャイナタウンで人気があり、すっきりとしたハチミツのような味わいです。"},ingredients:{en:["dried chrysanthemum flowers","water","sugar"],ko:["乾燥菊の花","水","砂糖"]},spice:0,price:[15,40],allergens:[],pork:"no",seafood:"no",veg:"yes",caffeine:!1,tags:["street","sweet","kr-familiar"],beginner:{en:"Sweet but light, a good palate cleanser after oily food. Japanese kiku-cha is rare and usually unsweetened and hot; the Thai street version is sweeter and often iced, closer to a sweet bottled tea.",ko:"甘いけれど軽いので、油っぽい食事のあとの口直しにぴったりです。日本の菊茶はあまり見かけず、たいてい砂糖なしの温かいお茶ですが、タイの屋台のものはもっと甘くて、冷たくして飲むことが多く、甘いボトル入りのお茶に近いです。"},order:{en:"Chrysanthemum tea, less sweet.",ko:"菊花茶を、甘さ控えめでお願いします。",th:"\u0E02\u0E2D\u0E19\u0E49\u0E33\u0E40\u0E01\u0E4A\u0E01\u0E2E\u0E27\u0E22\u0E2B\u0E27\u0E32\u0E19\u0E19\u0E49\u0E2D\u0E22{P}",rom:"khor nam kek-huai wan noi {P}"},fact:{en:"It arrived with Chinese immigrants, and many Thai-Chinese families treat it as a traditional cooling drink for hot weather.",ko:"中国からの移民が持ち込んだもので、多くの華人系タイ人の家庭で、暑い季節に飲む伝統的な体を冷やす飲み物とされています。"},where:[{name:"Drink stalls around Yaowarat",area:"yaowarat",note:{en:"A staple in Chinatown's drink stalls, sold next to longan and herbal drinks.",ko:"チャイナタウンのドリンク屋台の定番メニューで、龍眼ジュースやハーブドリンクの隣で売っています。"}}],imgQuery:"Chrysanthemum tea",imgAlt:"A glass of chrysanthemum tea with flowers",mapsQuery:"chrysanthemum tea Yaowarat Bangkok"},{id:"soy-milk",cat:"drinks",name:{en:"Thai Soy Milk (Nam Tao Hu)",th:"\u0E19\u0E49\u0E33\u0E40\u0E15\u0E49\u0E32\u0E2B\u0E39\u0E49",ko:"ナム・タオフー(タイ風豆乳)"},rom:"nam tao-hu",desc:{en:"Fresh soy milk, usually sweetened, sold from street carts and market stalls in plastic bags or cups, either warm or iced. Often served with extra toppings like grass jelly, sweet corn or gingko nuts.",ko:"新鮮な豆乳です。普通は砂糖が入っていて、屋台や市場でビニール袋やカップに入れて、温かくても冷たくても売っています。グラスゼリー(仙草ゼリー)、スイートコーン、ぎんなんなどのトッピングを追加してくれることもあります。"},ingredients:{en:["soybeans","water","sugar","pandan (sometimes)"],ko:["大豆","水","砂糖","パンダン（ときどき）"]},spice:0,price:[10,30],allergens:["soy"],pork:"no",seafood:"no",veg:"yes",caffeine:!1,tags:["street","sweet","beginner","kr-familiar"],beginner:{en:"Closer to sweetened Japanese-style soy milk (choisei tonyu) than to unsweetened soy milk; ask for less sweet if needed. A popular breakfast drink, often sold alongside fried dough sticks (pa tong ko).",ko:"日本の調製豆乳のように甘めで、無調整豆乳とは違います。必要なら甘さ控えめにしてもらいましょう。朝の飲み物として人気で、揚げパン(パートンコー)と一緒に売っていることが多いです。"},order:{en:"One soy milk, less sweet.",ko:"豆乳を1杯、甘さ控えめでお願いします。",th:"\u0E02\u0E2D\u0E19\u0E49\u0E33\u0E40\u0E15\u0E49\u0E32\u0E2B\u0E39\u0E49\u0E2B\u0E19\u0E36\u0E48\u0E07\u0E41\u0E01\u0E49\u0E27 \u0E2B\u0E27\u0E32\u0E19\u0E19\u0E49\u0E2D\u0E22{P}",rom:"khor nam tao-hu nueng kaew wan noi {P}"},fact:{en:"Thai soy milk stands are a morning ritual: warm soy milk with fried dough sticks (pa tong ko) is a classic Chinese-Thai breakfast.",ko:"タイの豆乳屋台は朝の日課です。温かい豆乳と揚げパン(パートンコー)は、華人系タイ式の朝ごはんの定番です。"},where:[{name:"Morning market stalls and street carts",area:"other",note:{en:"Especially common in the morning near markets and in Chinatown.",ko:"特に朝、市場の周辺やチャイナタウンでよく見かけます。"}}],imgQuery:"Nam tao hu Thai soy milk",imgAlt:"Soy milk served in a plastic bag at a Thai market",mapsQuery:"Thai soy milk nam tao hu Bangkok"},{id:"passion-fruit-juice",cat:"drinks",name:{en:"Passion Fruit Juice (Nam Sao-wa-rot)",th:"\u0E19\u0E49\u0E33\u0E40\u0E2A\u0E32\u0E27\u0E23\u0E2A",ko:"パッションフルーツジュース(ナム・サオワロット)"},rom:"nam sao-wa-rot",desc:{en:"A tart, aromatic passion fruit juice served over ice, usually sweetened with syrup. Bright, tropical and sharply sour.",ko:"酸味があって香りの強いパッションフルーツジュースで、普通はシロップを入れて氷と一緒に出します。爽やかで南国の味で、酸味が強いです。"},ingredients:{en:["passion fruit pulp","sugar syrup","water","ice"],ko:["パッションフルーツの果肉","シュガーシロップ","水","氷"]},spice:0,price:[30,80],allergens:[],pork:"no",seafood:"no",veg:"yes",caffeine:!1,tags:["sweet"],beginner:{en:"Sour first, sweet second. Caf\xE9s often serve it as a soda or tea mix at higher prices (about 60-100 THB). The seeds are edible but can be a surprise if you do not expect them. Ask for less sweet if you want the fruit taste to stand out.",ko:"最初に酸っぱさ、その次に甘さがきます。カフェではソーダやお茶と混ぜて、もっと高い値段で出しています(約60~100バーツ)。種は食べられますが、知らないと驚くかもしれません。果物の味を引き立てたいなら、甘さ控えめでお願いしましょう。"},order:{en:"Passion fruit juice, less sweet.",ko:"パッションフルーツジュースを、甘さ控えめでお願いします。",th:"\u0E02\u0E2D\u0E19\u0E49\u0E33\u0E40\u0E2A\u0E32\u0E27\u0E23\u0E2A\u0E2B\u0E27\u0E32\u0E19\u0E19\u0E49\u0E2D\u0E22{P}",rom:"khor nam sao-wa-rot wan noi {P}"},fact:{en:"In Thai, passion fruit is sao-wa-rot, a name that often appears on juice carts and caf\xE9 menus.",ko:"タイ語でパッションフルーツは「サオワロット」といいます。ジュースの屋台やカフェのメニューによく出てくる名前です。"},where:[{name:"Fruit-juice stalls and caf\xE9s",area:"other",note:{en:"Usually available at fruit-juice stalls with a menu board of many fruit options.",ko:"いろいろな果物のメニューボードがあるフルーツジュースのお店で、普通に売っています。"}}],imgQuery:"Passion fruit juice",imgAlt:"Glass of passion fruit juice next to halved passion fruits",mapsQuery:"passion fruit juice Bangkok"},{id:"orange-juice",cat:"drinks",name:{en:"Fresh Orange Juice (Nam Som Khan)",th:"\u0E19\u0E49\u0E33\u0E2A\u0E49\u0E21\u0E04\u0E31\u0E49\u0E19",ko:"生オレンジジュース(ナム・ソム・カン)"},rom:"nam som khan",desc:{en:"Oranges squeezed to order from street carts, usually the green-skinned sweet 'som khiao wan' variety. Bright and fresh, with a natural sweet-tart taste.",ko:"屋台で注文を受けてから搾ってくれるオレンジジュースです。普通は皮が緑色の「ソム・キアオ・ワーン」という品種を使います。爽やかで新鮮、自然な甘酸っぱさがあります。"},ingredients:{en:["fresh oranges","ice (optional)","sugar syrup (sometimes)"],ko:["生のオレンジ","氷（お好みで）","シュガーシロップ（ときどき）"]},spice:0,price:[25,60],allergens:[],pork:"no",seafood:"no",veg:"yes",caffeine:!1,tags:["street","beginner","post-practice"],beginner:{en:"Some vendors add sugar syrup, so ask for none if you want the pure juice. Pure squeezed orange juice often costs more than other street drinks because of the fruit; prices vary with the size of the cup.",ko:"シロップを入れるお店もあるので、果汁そのままがいいなら抜いてもらいましょう。果物をたくさん使うので、ほかの屋台ドリンクより高いことがあり、カップのサイズによって値段が変わります。"},order:{en:"Fresh orange juice, no syrup.",ko:"生オレンジジュースを、シロップ抜きでお願いします。",th:"\u0E02\u0E2D\u0E19\u0E49\u0E33\u0E2A\u0E49\u0E21\u0E04\u0E31\u0E49\u0E19\u0E44\u0E21\u0E48\u0E43\u0E2A\u0E48\u0E19\u0E49\u0E33\u0E40\u0E0A\u0E37\u0E48\u0E2D\u0E21{P}",rom:"khor nam som khan mai sai nam-chueam {P}"},fact:{en:"Thai oranges are often green even when ripe, because the tropical climate keeps them from turning orange; do not be put off by the color.",ko:"熱帯の気候のせいで、タイのオレンジは熟しても緑色のことが多いです。色を見て迷わないでください。"},where:[{name:"Street juice carts across Bangkok",area:"other",note:{en:"Look for a cart with a pile of oranges and a manual or electric squeezer.",ko:"オレンジの山と搾り機がある屋台を探してください。"}}],imgQuery:"Fresh orange juice Thailand street",imgAlt:"A street vendor pouring fresh orange juice into a bottle",mapsQuery:"fresh orange juice Bangkok street"}]});var va,za,Wo=S(()=>{va=[{id:"sen-yai",name:{en:"Sen Yai",th:"\u0E40\u0E2A\u0E49\u0E19\u0E43\u0E2B\u0E0D\u0E48",ko:"センヤイ(幅広の米麺)"},rom:"sen yai",desc:{en:"Wide, flat, chewy fresh rice noodles, about as broad as fettuccine. They soak up sauce and char beautifully in a wok.",ko:"フェットチーネくらいの幅の、平たくてモチモチした生の米麺です。ソースをよく吸い、中華鍋で香ばしく焼き付けるのにぴったりです。"},look:{en:"Wide white ribbons, soft and slippery, sometimes sold in folded sheets.",ko:"幅広の白いリボン状で、柔らかくつるつるしています。折りたたんだシート状で売られていることもあります。"},usedIn:[{en:"Pad See Ew",ko:"パットシーユー"},{en:"Pad Kee Mao (drunken noodles)",ko:"パットキーマオ"},{en:"Rad Na",ko:"ラートナー"},{en:"Beef or pork noodle soups",ko:"牛肉・豚肉の麺スープ"}],imgQuery:"Sen yai wide rice noodles",imgAlt:"Wide flat rice noodles used in Thai noodle dishes"},{id:"sen-lek",name:{en:"Sen Lek",th:"\u0E40\u0E2A\u0E49\u0E19\u0E40\u0E25\u0E47\u0E01",ko:"センレック(細い米麺)"},rom:"sen lek",desc:{en:"Thin rice noodles, a little thicker than angel-hair pasta. The default noodle for many classic Thai noodle soups.",ko:"エンジェルヘアのパスタより少し太めの細い米麺です。タイの定番の麺スープ料理の多くで基本の麺として使われます。"},look:{en:"Thin white strands, soft but with a slight chew.",ko:"細くて白い麺で、柔らかいけれど少し歯ごたえがあります。"},usedIn:[{en:"Boat noodles (kuay teow reua)",ko:"ボートヌードル(クイッティアオ・ルア)"},{en:"Tom yum noodles",ko:"トムヤム麺"},{en:"Yen ta fo",ko:"イェンタフォー"},{en:"Clear pork noodle soup",ko:"透き通った豚肉の麺スープ"}],imgQuery:"Sen lek rice noodles",imgAlt:"Thin Thai rice noodles in a bowl"},{id:"sen-mee",name:{en:"Sen Mee",th:"\u0E40\u0E2A\u0E49\u0E19\u0E2B\u0E21\u0E35\u0E48",ko:"センミー(米のビーフン)"},rom:"sen mee",desc:{en:"Very thin rice vermicelli, finer than sen lek, that cook in seconds. Light and delicate, they work for both soup and dry dishes.",ko:"センレックよりさらに細い米のビーフンです。数秒で火が通り、スープにも炒め物にも使えます。軽くて繊細です。"},look:{en:"Hair-thin white strands, often sold dried in bundles.",ko:"髪の毛のように細い白い麺で、乾麺を束にして売っていることが多いです。"},usedIn:[{en:"Mee krob (crispy sweet noodles)",ko:"ミークロープ(カリカリ甘い麺)"},{en:"Stir-fried vermicelli dishes",ko:"ビーフンの炒め物"},{en:"Light soup noodles",ko:"あっさりスープ麺"}],imgQuery:"Rice vermicelli Thai",imgAlt:"Thin dried rice vermicelli noodles"},{id:"ba-mee",name:{en:"Ba Mee",th:"\u0E1A\u0E30\u0E2B\u0E21\u0E35\u0E48",ko:"バミー(卵麺)"},rom:"ba mee",desc:{en:"Yellow wheat-and-egg noodles with a springy bite, like Chinese egg noodles. Different from the rice noodles above and sold fresh at noodle shops.",ko:"小麦粉と卵で作った、黄色くてコシのある麺です。中華風の卵麺に似ていて、上の米麺とは違います。麺屋さんでは生麺を使っていることが多いです。"},look:{en:"Yellow, wavy or straight, with a firm bouncy texture.",ko:"黄色い縮れ麺やストレート麺で、弾力があってプリプリです。"},usedIn:[{en:"Ba mee moo daeng (red roast pork)",ko:"バミー・ムーデーン(チャーシュー麺)"},{en:"Ba mee giew (wonton noodles)",ko:"バミー・キアオ(ワンタン麺)"},{en:"Khao soi",ko:"カオソーイ"},{en:"Dry noodles with crispy pork",ko:"カリカリ豚バラをのせた汁なし麺"}],imgQuery:"Ba mee egg noodles Thailand",imgAlt:"Thai egg noodles with roast pork and greens"},{id:"woon-sen",name:{en:"Woon Sen",th:"\u0E27\u0E38\u0E49\u0E19\u0E40\u0E2A\u0E49\u0E19",ko:"ウンセン(緑豆春雨)"},rom:"woon sen",desc:{en:"Glass noodles made from mung bean starch. They turn clear when cooked and take on the flavor of whatever they are cooked with. Gluten-free.",ko:"緑豆のでんぷんで作った春雨です。火が通ると透明になり、一緒に煮るスープやソースの味を吸い込みます。グルテンフリーです。"},look:{en:"Translucent, springy, slippery strands.",ko:"透き通っていて、弾力があり、つるつるした麺です。"},usedIn:[{en:"Yum Woon Sen (spicy salad)",ko:"ヤム・ウンセン(ピリ辛春雨サラダ)"},{en:"Suki (Thai hot pot)",ko:"スキ"},{en:"Gaeng Jued (clear soup)",ko:"ゲーン・ジュート"},{en:"Goong ob woon sen (baked prawns with glass noodles)",ko:"クン・オップ・ウンセン(エビと春雨の蒸し焼き)"}],imgQuery:"Glass noodles mung bean Thailand",imgAlt:"Cooked translucent glass noodles"},{id:"mama",name:{en:"Mama (Instant Noodles)",th:"\u0E21\u0E32\u0E21\u0E48\u0E32",ko:"ママー(タイのインスタントラーメン)"},rom:"ma-ma",desc:{en:`Thailand's instant noodle brand, so popular that "mama" means instant noodles in general. Thais eat them as soup with an egg, as a spicy salad (yum mama) or stir-fried, as a cheap fast meal or drinking snack.`,ko:"タイを代表するインスタントラーメンのブランドで、「ママー」がインスタントラーメン全般を指す言葉になりました。卵を入れたスープ麺、ピリ辛サラダ(ヤム・ママー)、炒め物などにして、安くて早い食事やおつまみとして食べます。"},look:{en:"Wavy dried wheat noodle block with seasoning sachets, sold in many flavors including pork and tom yum shrimp.",ko:"波状の乾燥麺のブロックとスープの小袋が入っています。豚肉やトムヤムシュリンプなど、味の種類が豊富です。"},usedIn:[{en:"Yum Mama (instant noodle salad)",ko:"ヤム・ママー"},{en:"Instant noodle soup with egg and vegetables",ko:"卵と野菜を入れたインスタントラーメン"},{en:"Mama pad (stir-fried instant noodles)",ko:"ママー・パット(炒めインスタントラーメン)"}],imgQuery:"Mama instant noodles Thailand",imgAlt:"Packs of Mama instant noodles in a Thai shop"}],za=[{step:{en:"Learn the formula: noodle type + broth style + meat. Thais say them in that order, as one string.",ko:"公式を覚えましょう。麺の種類+スープのスタイル+肉の順番です。タイの人はこれを続けて一気に言います。"},th:"\u0E02\u0E2D\u0E40\u0E2A\u0E49\u0E19\u0E40\u0E25\u0E47\u0E01\u0E19\u0E49\u0E33\u0E43\u0E2A\u0E2B\u0E21\u0E39 \u0E2B\u0E19\u0E36\u0E48\u0E07\u0E0A\u0E32\u0E21{P}",rom:"khor sen lek nam sai moo neung chaam {P}"},{step:{en:"Pick the noodle: sen yai (wide), sen lek (thin), sen mee (vermicelli), ba mee (egg noodle) or woon sen (glass noodle).",ko:"麺を選びましょう。センヤイ(幅広)、センレック(細麺)、センミー(ビーフン)、バミー(卵麺)、ウンセン(春雨)。"},th:"\u0E02\u0E2D\u0E40\u0E2A\u0E49\u0E19\u0E43\u0E2B\u0E0D\u0E48{P}",rom:"khor sen yai {P}"},{step:{en:'Soup or dry? "Nam" is soup; "haeng" is dry, mixed with sauce, usually with a small bowl of broth on the side.',ko:"スープか汁なしか?「ナーム」はスープ、「ヘーン」は汁なしでソースを絡めたもので、普通は小さなスープの器が別に付いてきます。"},th:"\u0E02\u0E2D\u0E41\u0E2B\u0E49\u0E07{P}",rom:"khor haeng {P}"},{step:{en:"Choose the broth: nam sai (clear), nam tok (dark, with blood), tom yum (sour-spicy) or yen ta fo (pink, sweet-sour).",ko:"スープを選びましょう。ナムサイ(透き通ったスープ)、ナムトック(血を入れた濃いスープ)、トムヤム(酸っぱ辛い)、イェンタフォー(ピンク色の甘酸っぱい)。"},th:"\u0E02\u0E2D\u0E15\u0E49\u0E21\u0E22\u0E33{P}",rom:"khor tom yam {P}"},{step:{en:"Pick the meat: moo (pork), nuea (beef), gai (chicken), look chin (meatballs) or pla (fish). Tell them what you do not want.",ko:"肉を選びましょう。ムー(豚)、ヌア(牛)、ガイ(鶏)、ルークチン(肉団子)、プラー(魚)。食べられないものは先に伝えてください。"},th:"\u0E02\u0E2D\u0E25\u0E39\u0E01\u0E0A\u0E34\u0E49\u0E19\u0E44\u0E01\u0E48 \u0E44\u0E21\u0E48\u0E43\u0E2A\u0E48\u0E40\u0E25\u0E37\u0E2D\u0E14{P}",rom:"khor look chin gai mai sai leuat {P}"},{step:{en:'Choose the size: "tham-ma-da" is regular and "phi-set" is special (bigger portion or more toppings). Boat noodle bowls are tiny, so order several.',ko:"量を選びましょう。「タムマダー」は普通、「ピセート」は特盛(量が多いか、トッピング追加)です。ボートヌードルは器が小さいので、何杯か頼みます。"},th:"\u0E02\u0E2D\u0E1E\u0E34\u0E40\u0E28\u0E29{P}",rom:"khor phi-set {P}"},{step:{en:"Set the spice level when you order, and say if you want no cilantro. You can season later.",ko:"注文のときに辛さを指定して、パクチーが苦手なら抜きと伝えましょう。味付けはあとから足せます。"},th:"\u0E44\u0E21\u0E48\u0E40\u0E1C\u0E47\u0E14 \u0E44\u0E21\u0E48\u0E43\u0E2A\u0E48\u0E1C\u0E31\u0E01\u0E0A\u0E35{P}",rom:"mai phet mai sai phak-chee {P}"},{step:{en:"Use the condiment caddy on the table: sugar (nam tan), fish sauce (nam pla), chili in vinegar (prik nam som) and chili flakes (prik pon). Thais often add a spoon of sugar and a little vinegar-chili. Taste first, then adjust.",ko:"テーブルの上の調味料セットを使いましょう。砂糖(ナムターン)、魚醤(ナムプラー)、唐辛子入り酢(プリックナムソム)、粉唐辛子(プリックポン)。タイの人は砂糖をスプーン1杯と、唐辛子入り酢を少し入れます。まず味見をして、それから調整しましょう。"},th:"\u0E02\u0E2D\u0E19\u0E49\u0E33\u0E15\u0E32\u0E25\u0E01\u0E31\u0E1A\u0E1E\u0E23\u0E34\u0E01\u0E19\u0E49\u0E33\u0E2A\u0E49\u0E21\u0E2B\u0E19\u0E48\u0E2D\u0E22{P}",rom:"khor nam taan gap phrik nam som noi {P}"},{step:{en:"Pay at the counter or when the staff comes, and finish by saying thanks.",ko:"レジか、スタッフが来たときにお会計をして、最後にお礼を伝えましょう。"},th:"\u0E04\u0E34\u0E14\u0E40\u0E07\u0E34\u0E19\u0E14\u0E49\u0E27\u0E22{P} \u0E02\u0E2D\u0E1A\u0E04\u0E38\u0E13{P}",rom:"khit ngoen duay {P} khop khun {P}"}]});var Oo,qo=S(()=>{Oo=[{id:"cafe-ari-hopping",group:"cafe",title:{en:"Caf\xE9-hopping in Ari: Soi Ari 1 & Soi Ari 4 stretch",ko:"アーリーのカフェ巡り:ソイ・アーリー1&アーリー4の通り"},desc:{en:"Ari is the neighborhood Bangkok locals pick for a slow caf\xE9 afternoon. Two short side streets (Soi Ari 1 and Soi Ari 4) are packed with specialty coffee bars, bakeries, brunch spots and small interior-design shops within walking distance of the BTS station.",ko:"アーリーは、バンコクの地元の人が「カフェの日」にまず思い浮かべるエリアです。BTSの駅から歩ける短い2本の通り(ソイ・アーリー1とソイ・アーリー4)に、スペシャルティコーヒー、ベーカリー、ブランチ、小さなインテリアショップがぎっしり集まっています。"},special:{en:"Low-key, walkable and very photogenic without feeling like a tourist trap. You can do 2\u20133 caf\xE9s in one lazy afternoon and the whole area feels like a calm break from Sukhumvit and Siam.",ko:"観光地っぽさがなく静かで歩きやすいのに、写真映えもします。のんびりした午後に2~3軒のカフェを回れて、スクンビットやサイアムの慌ただしい雰囲気から一息つくのにぴったりです。"},bestTime:["morning","afternoon"],timeText:{en:"10:00\u201317:00; many caf\xE9s open around 8:00\u201310:00 and some close early evening (check Google Maps for current hours)",ko:"10:00〜17:00がおすすめ。カフェによっては8〜10時オープンで夕方早めに閉まるところもあるので、Googleマップで営業時間を必ず確認してくださいね"},cost:{min:150,max:450},costNote:{en:"Specialty coffee \u2248 90\u2013150 THB, matcha/latte drinks \u2248 120\u2013200 THB, a pastry or cake \u2248 100\u2013250 THB (estimates).",ko:"スペシャルティコーヒー90〜150バーツ、抹茶・ラテ系120〜200バーツ、ベーカリー・ケーキ100〜250バーツくらい(推定)です。"},duration:[2,4],area:"ari",locationText:{en:"Soi Ari 1 and Soi Ari 4, Phaya Thai district",ko:"パヤータイ区 ソイ・アーリー1・アーリー4周辺"},transit:{en:"BTS Ari (Sukhumvit Line), then walk into Soi Ari 1 or Soi Ari 4. (Confirm exit on Google Maps.)",ko:"BTSアーリー駅(スクンビットライン)から徒歩でソイ・アーリー1またはアーリー4へ。(出口はGoogleマップで確認してください。)"},indoor:"indoor",crowd:"both",energy:1,tags:["relaxing","photo","date-night","after-practice","rainy-day"],tips:{en:"Weekends get busy from late morning; go on a weekday morning or after 15:00 for seats. Most caf\xE9s are air-conditioned, so this is a great rainy-day plan. Cards are common but keep some cash/QR for small shops.",ko:"週末は午前の遅い時間から混むので、平日の午前か午後3時以降が席を確保しやすいです。ほとんどのお店はエアコンが効いているので、雨の日のプランにもぴったり。カード払いできるお店が多いですが、小さなお店用に現金やQR決済も用意してくださいね。"},geoQuery:"Ari, Phaya Thai, Bangkok",mapsQuery:"cafes in Soi Ari 1 Bangkok",imgQuery:"Ari Bangkok street",imgAlt:"A quiet street in the Ari neighborhood of Bangkok with small shops and caf\xE9s",imgIllustrative:!0},{id:"cafe-song-wat-riverside",group:"cafe",title:{en:"Song Wat Road: old shophouse coffee by the river",ko:"ソンワット通り:古い商店街で楽しむリバーサイドコーヒー"},desc:{en:"Song Wat Road runs parallel to the Chao Phraya River in the old Chinatown trading quarter. Century-old shophouses have been turned into small coffee shops, bakeries and design studios, side by side with rice and spice traders that still work.",ko:"ソンワット通りはチャオプラヤー川と並行して走る、昔ながらのチャイナタウンの交易エリアです。築100年以上の商店ビルを改装した小さなコーヒーショップ、ベーカリー、デザインスタジオが、今も営業しているお米・香辛料の問屋さんと並んでいます。"},special:{en:"You get Bangkok heritage architecture, quiet lanes and a coffee in one stroll. It feels very different from the malls and is one of the most atmospheric caf\xE9 zones in the city.",ko:"バンコクの古い建築、静かな路地、コーヒーを一度に楽しめます。ショッピングモールとはまったく違う雰囲気で、バンコクで最もエモいカフェエリアのひとつです。"},bestTime:["morning","afternoon"],timeText:{en:"10:00\u201316:00; the street is quiet on weekday mornings. Many small shops close early or on certain days (check Google Maps for current hours)",ko:"10:00〜16:00がおすすめ。平日の午前が一番静かです。小さなお店は早く閉まったり定休日があったりするので、Googleマップで営業時間を確認してください"},cost:{min:100,max:400},costNote:{en:"Coffee \u2248 80\u2013150 THB, a pastry \u2248 80\u2013200 THB (estimates). Add a boat ticket if you come by river.",ko:"コーヒー80〜150バーツ、パン80〜200バーツくらい(推定)です。船で行く場合はボート代が別途かかります。"},duration:[1.5,3],area:"song-wat",locationText:{en:"Song Wat Road, Samphanthawong (near Ratchawong Pier)",ko:"サムパンタウォン区 ソンワット通り(ラーチャウォン船着場の近く)"},transit:{en:"Chao Phraya Express Boat to Ratchawong Pier, then walk; or MRT Wat Mangkon / MRT Hua Lamphong plus a taxi or Grab. (Confirm route on Google Maps.)",ko:"チャオプラヤー・エクスプレスボートでラーチャウォン船着場で下船して徒歩。またはMRTワット・マンコン駅/フアランポーン駅からタクシー・Grab。(ルートはGoogleマップで確認してください。)"},indoor:"both",crowd:"both",energy:1,tags:["photo","hidden-gem","relaxing","date-night"],weather:{en:"The street itself is outdoors with little shade. Go before 11:00 or late afternoon in hot season and duck into a caf\xE9 when it rains.",ko:"通りは屋外で日陰があまりありません。暑い時期は11時前か夕方遅めに行って、雨が降ったらカフェに避難しましょう。"},tips:{en:"Watch for trucks and motorbikes squeezing through the narrow street, and do not block working shop doors when taking photos. Combine with Yaowarat street food in the evening.",ko:"狭い道をトラックやバイクが通るので気をつけてください。写真を撮るときは、営業中のお店の入口をふさがないのがマナーです。夜はヤワラートの屋台グルメとセットで回るのがおすすめです。"},geoQuery:"Song Wat Road, Bangkok",mapsQuery:"cafe Song Wat Road Bangkok",imgQuery:"Song Wat Road Bangkok",imgAlt:"Old Chinese-style shophouses along Song Wat Road in Bangkok",imgIllustrative:!1},{id:"cafe-talat-noi-alleys",group:"cafe",title:{en:"Talat Noi alley caf\xE9s: coffee between shrines and garages",ko:"タラートノイの路地カフェ:祠と修理工場のあいだで味わうコーヒー"},desc:{en:"Talat Noi is an old Chinese-Thai riverside community of tiny alleys, auto-parts workshops and shrines. A handful of caf\xE9s have opened inside old houses and warehouses, so you can sip a cold brew in a courtyard right next to a mechanic.",ko:"タラートノイは、狭い路地、部品の修理工場、中国系の祠が集まる川沿いの旧市街エリアです。古い家や倉庫を改装したカフェが数軒あり、修理工場のすぐ隣の中庭でコールドブリューを飲むという、ちょっと変わった体験ができます。"},special:{en:"Gritty-meets-cozy is the whole vibe. It is one of the best places in Bangkok to combine coffee, street photography and a sense of how the old city really works.",ko:"ざらっとしているのに居心地がいい、そんな雰囲気がここの魅力です。コーヒー、ストリートフォト、昔ながらのバンコクの日常を一度に楽しめる場所です。"},bestTime:["morning","afternoon"],timeText:{en:"10:00\u201316:30 (light is good before noon and again late afternoon); check Google Maps for current hours",ko:"10:00〜16:30。正午前と夕方遅めの時間帯は光がきれいです。営業時間はGoogleマップで確認してください"},cost:{min:100,max:350},costNote:{en:"Coffee and a snack \u2248 150\u2013300 THB (estimate).",ko:"コーヒーと軽食で合わせて150〜300バーツくらい(推定)です。"},duration:[1.5,3],area:"talat-noi",locationText:{en:"Talat Noi, Samphanthawong, along Soi Wanit 2 and nearby alleys",ko:"サムパンタウォン区 タラートノイ、ソイ・ワニット2など周辺の路地"},transit:{en:"Boat to Ratchawong Pier then walk, or MRT Hua Lamphong then a ~20 min walk / short Grab. (Confirm route on Google Maps.)",ko:"ボートでラーチャウォン船着場で下船して徒歩、またはMRTフアランポーン駅から徒歩20分ほど/Grab。(ルートはGoogleマップで確認してください。)"},indoor:"both",crowd:"both",energy:2,tags:["hidden-gem","photo","adventurous","relaxing"],weather:{en:"Alleys are outdoors and hot by midday; carry water. Streets can flood briefly in heavy rain.",ko:"路地は屋外なので、日中はかなり暑いです。水を持っていきましょう。豪雨のときは道が一時的に冠水することがあります。"},tips:{en:"Alleys are narrow and shared with motorbikes and workers; keep bags in front. Be respectful at shrines (no flash, no loud talking). Ask before photographing people.",ko:"路地が狭く、バイクや働いている人たちと一緒に使う道なので、バッグは前に抱えてください。祠ではフラッシュや大声を控え、人を撮るときは必ず先に聞いてくださいね。"},geoQuery:"Talat Noi, Bangkok",mapsQuery:"cafe Talat Noi Bangkok",imgQuery:"Talat Noi Bangkok",imgAlt:"A narrow alley in Talat Noi, Bangkok, with old buildings and shrines",imgIllustrative:!1},{id:"cafe-charoen-krung-bakery-coffee",group:"cafe",title:{en:"Charoen Krung creative district: coffee, bakeries & galleries",ko:"チャルンクルン クリエイティブ地区:コーヒー、ベーカリー、ギャラリー"},desc:{en:"Charoen Krung is Bangkok's oldest road and now a creative district. Between Soi Charoen Krung 30 (home to Warehouse 30) and the old Bang Rak streets you will find third-wave coffee shops, bakeries, small galleries and design stores in converted shophouses.",ko:"チャルンクルンはバンコクで最も古い道で、今はクリエイティブな街として人気です。ウェアハウス30があるソイ・チャルンクルン30からバンラックの古い路地まで、改装した商店ビルにサードウェーブ系コーヒーショップ、ベーカリー、小さなギャラリー、デザインショップが続いています。"},special:{en:"It pairs a good coffee with art and design in one walkable stretch, with far fewer tourists than Siam. Perfect for a slow half-day away from the mall circuit.",ko:"おいしいコーヒーとアート・デザインを歩いて一度に楽しめて、サイアムよりも観光客がずっと少なめです。モール巡りから離れて、のんびり半日過ごすのにぴったりです。"},bestTime:["morning","afternoon"],timeText:{en:"10:00\u201317:00; many galleries and shops are closed on Mondays or have short hours (check Google Maps)",ko:"10:00〜17:00がおすすめ。ギャラリーやお店は月曜休みだったり営業時間が短かったりします(Googleマップで確認)"},cost:{min:150,max:500},costNote:{en:"Coffee \u2248 90\u2013160 THB, bakery items \u2248 80\u2013250 THB; most small galleries are free or low-cost (estimates).",ko:"コーヒー90〜160バーツ、ベーカリー80〜250バーツ、小さなギャラリーはほとんど無料か安いです(推定)。"},duration:[2,4],area:"charoen-krung",locationText:{en:"Charoen Krung Road around Soi Charoen Krung 30, Bang Rak",ko:"バンラック ソイ・チャルンクルン30周辺のチャルンクルン通り"},transit:{en:"BTS Saphan Taksin plus a short taxi/Grab, or a Chao Phraya Express boat to a nearby pier and a walk. (Confirm route on Google Maps.)",ko:"BTSサパーンタクシン駅からタクシー・Grabで少し移動するか、チャオプラヤーボートで近くの船着場で下船して徒歩。(ルートはGoogleマップで確認してください。)"},indoor:"both",crowd:"both",energy:1,tags:["relaxing","photo","hidden-gem","date-night"],weather:{en:"Walking between spots is outdoors and sunny; plan short hops or take Grab between clusters in the heat.",ko:"移動区間が屋外で日差しが強いです。暑いときはスポット間をGrabで移動しましょう。"},tips:{en:"This is a spread-out area, so pick 2\u20133 stops on Google Maps first. Pair it with Warehouse 30 for a full creative-district afternoon.",ko:"エリアが広く点在しているので、Googleマップでまず2〜3か所だけ決めて動きましょう。ウェアハウス30とセットにすると、午後のコースにちょうどいいです。"},geoQuery:"Charoen Krung Road, Bang Rak, Bangkok",mapsQuery:"cafe Charoen Krung Soi 30 Bangkok",imgQuery:"Charoen Krung Road Bangkok",imgAlt:"Charoen Krung Road in Bangkok with old buildings and street life",imgIllustrative:!0},{id:"cafe-ekkamai-hopping",group:"cafe",title:{en:"Ekkamai caf\xE9 run: specialty coffee & brunch around Sukhumvit 63",ko:"エカマイ・カフェ巡り:スクンビット63周辺のスペシャルティ&ブランチ"},desc:{en:"Ekkamai (Sukhumvit 63) is a trendy neighborhood with a dense mix of specialty coffee bars, brunch caf\xE9s, bakeries and design shops, many in stylish converted houses. It is a quick BTS hop from Siam or Thonglor.",ko:"エカマイ(スクンビット63)は、スペシャルティコーヒーバー、ブランチカフェ、ベーカリー、デザインショップがぎっしり集まるおしゃれなエリアです。個性的に改装した一軒家風カフェが多く、サイアムやトンローからBTSですぐ着きます。"},special:{en:"A very Bangkok-local taste of caf\xE9 culture with more interesting interiors than the mall chains, and lots of seating and Wi-Fi if you need a laptop break.",ko:"ショッピングモールのチェーンカフェよりインテリアがずっと楽しく、席もWi-Fiも十分あるのでノートPCで作業するのにも向いています。ローカルなカフェ文化をしっかり感じられます。"},bestTime:["morning","afternoon"],timeText:{en:"9:00\u201317:00 for brunch and coffee (check Google Maps for current hours)",ko:"9:00〜17:00 ブランチとコーヒータイムにおすすめ(営業時間はGoogleマップで確認)"},cost:{min:200,max:600},costNote:{en:"Coffee \u2248 100\u2013170 THB; brunch plates \u2248 200\u2013400 THB (estimates).",ko:"コーヒー100〜170バーツ、ブランチメニュー200〜400バーツくらい(推定)です。"},duration:[2,3],area:"ekkamai",locationText:{en:"Sukhumvit 63 (Ekkamai) and nearby sois, Watthana",ko:"ワッタナー区 スクンビット63(エカマイ)と周辺のソイ"},transit:{en:"BTS Ekkamai (Sukhumvit Line); caf\xE9s are a short walk or Grab ride along the soi. (Confirm exit on Google Maps.)",ko:"BTSエカマイ駅(スクンビットライン)。カフェはソイ沿いに歩くか、Grabで少し移動します。(出口はGoogleマップで確認してください。)"},indoor:"indoor",crowd:"both",energy:1,tags:["relaxing","photo","after-practice","rainy-day","date-night"],tips:{en:"Caf\xE9s in houses can be a 10\u201315 min walk from the BTS in the heat; take a motorbike taxi or Grab for longer distances. Weekend brunch is busy, so arrive before 11:00.",ko:"BTSから10〜15分歩くカフェもあるので、暑いときはバイクタクシーやGrabを使いましょう。週末のブランチは混むので、11時前に着くのがおすすめです。"},geoQuery:"Ekkamai, Watthana, Bangkok",mapsQuery:"specialty coffee Ekkamai Bangkok",imgQuery:"Ekkamai Bangkok",imgAlt:"A street in the Ekkamai area of Bangkok with modern buildings",imgIllustrative:!0},{id:"cafe-thonglor-dessert-crawl",group:"cafe",title:{en:"Thonglor dessert crawl: cakes, bingsu & honey toast",ko:"トンロー・スイーツ巡り:ケーキ、かき氷、ハニートースト"},desc:{en:"Thonglor (Sukhumvit 55) is Bangkok's dessert-and-brunch playground: patisseries, Japanese- and Korean-style bingsu spots, soft-serve bars and caf\xE9-restaurants with polished interiors. Thai dessert chains such as After You (famous for its honey toast) also have branches in malls around the city.",ko:"トンロー(スクンビット55)は、バンコクのスイーツ&ブランチの聖地です。パティスリー、日本風・韓国風のかき氷店、ソフトクリームバー、インテリアのきれいなカフェレストランが集まっています。ハニートーストで有名なタイのスイーツチェーンAfter Youも、市内の各ショッピングモールに支店があります。"},special:{en:"The best sweet-tooth night out: share 3–4 desserts across a few spots instead of one big meal. If you love Japanese kakigōri, it will feel familiar, with Thai twists like mango and coconut.",ko:"ご飯の代わりに、スイーツを3〜4個シェアして回る甘いコースにぴったりです。日本のかき氷になじみがあれば、マンゴーやココナッツなどタイらしいトッピングが新鮮に感じられます。"},bestTime:["afternoon","evening","night"],timeText:{en:"14:00\u201322:00; many dessert places stay open until about 22:00 (check Google Maps for current hours)",ko:"14:00〜22:00。スイーツのお店は夜10時ごろまで開いているところが多いです(営業時間はGoogleマップで確認)"},cost:{min:200,max:700},costNote:{en:"Bingsu or cake \u2248 150\u2013300 THB each; honey toast \u2248 200\u2013350 THB to share (estimates).",ko:"かき氷やケーキ1つで150〜300バーツ、ハニートーストはシェアサイズで200〜350バーツ(推定)です。"},duration:[1.5,3],area:"thonglor",locationText:{en:"Sukhumvit 55 (Thonglor) and nearby sois, Watthana",ko:"ワッタナー区 スクンビット55(トンロー)と周辺のソイ"},transit:{en:"BTS Thong Lo (Sukhumvit Line), then Grab or a short walk/motorbike taxi into the soi. (Confirm exit on Google Maps.)",ko:"BTSトンロー駅(スクンビットライン)で下車後、ソイの奥までGrabやバイクタクシー、徒歩で移動します。(出口はGoogleマップで確認してください。)"},indoor:"indoor",crowd:"group",energy:1,tags:["team-bonding","date-night","after-practice","photo","rainy-day","relaxing"],tips:{en:"Thonglor soi is long; do not try to walk it end to end in the heat. Pick 2\u20133 spots near each other on Google Maps. Share plates to taste more.",ko:"トンローのソイは長いので、暑いなか端から端まで歩くと疲れます。Googleマップで近くの2〜3か所だけ選んで行きましょう。お皿をシェアすると、より多くの味を楽しめます。"},geoQuery:"Thonglor, Watthana, Bangkok",mapsQuery:"dessert cafe Thonglor Bangkok",imgQuery:"Bingsu dessert",imgAlt:"A bowl of shaved-ice bingsu dessert with fruit toppings",imgIllustrative:!0},{id:"cafe-siam-matcha-dessert",group:"cafe",title:{en:"Siam matcha & dessert break between shopping",ko:"サイアムでのショッピング合間の抹茶・スイーツタイム"},desc:{en:"Siam is full of mall caf\xE9s and dessert counters in Siam Paragon, Siam Center, Siam Discovery and CentralWorld, plus small caf\xE9s on the Siam Square sois. Matcha lattes, Japanese-style parfaits, bingsu and bubble tea are everywhere, all in air-conditioning.",ko:"サイアムには、サイアム・パラゴン、サイアム・センター、サイアム・ディスカバリー、セントラルワールド内のカフェやスイーツ売り場がたくさんあり、サイアムスクエアの路地にも小さなカフェがあります。抹茶ラテ、和風パフェ、かき氷、タピオカティーを、涼しいエアコンの下で楽しめます。"},special:{en:"The easiest, most convenient caf\xE9 plan in the city. It works any time, requires no planning, and is walkable from everything else in Siam.",ko:"バンコクで一番手軽で便利なカフェプランです。時間を選ばず、計画も要らず、サイアムの他の場所とも全部歩いてつながっています。"},bestTime:["afternoon","evening"],timeText:{en:"11:00\u201321:00 inside malls (mall hours are typically around 10:00\u201322:00; check Google Maps)",ko:"モール内 11:00〜21:00(モールは通常10:00〜22:00営業、Googleマップで確認)"},cost:{min:120,max:400},costNote:{en:"Matcha latte \u2248 120\u2013200 THB, parfait or bingsu \u2248 150\u2013300 THB (estimates).",ko:"抹茶ラテ120〜200バーツ、パフェやかき氷150〜300バーツくらい(推定)です。"},duration:[1,2],area:"siam",locationText:{en:"Siam Square, Siam Center, Siam Paragon, Siam Discovery",ko:"サイアムスクエア、サイアム・センター、サイアム・パラゴン、サイアム・ディスカバリー"},transit:{en:"BTS Siam (Sukhumvit and Silom lines interchange); skywalks connect to the main malls. (Confirm exit on Google Maps.)",ko:"BTSサイアム駅(スクンビットライン・シーロムラインの乗換駅)。スカイウォークで主要なモールとつながっています。(出口はGoogleマップで確認してください。)"},indoor:"indoor",crowd:"both",energy:1,tags:["rainy-day","after-practice","team-bonding","photo","relaxing"],tips:{en:"Weekend afternoons are crowded; popular counters have queues. Malls have strong AC, so bring a light layer.",ko:"週末の午後は人気のお店に行列ができます。モールはエアコンが強めなので、薄手の羽織りものを持っていきましょう。"},geoQuery:"Siam Square, Bangkok",mapsQuery:"matcha cafe Siam Bangkok",imgQuery:"Matcha latte",imgAlt:"A matcha latte in a glass",imgIllustrative:!0},{id:"cafe-phrom-phong-emquartier",group:"cafe",title:{en:"Phrom Phong caf\xE9 afternoon: EmQuartier, Emporium & Benjasiri Park",ko:"プロンポン・カフェの午後:エムクオティエ、エンポリアム、ベンジャシリ公園"},desc:{en:"Phrom Phong has two big malls (EmQuartier and Emporium) with plenty of caf\xE9s, bakeries and dessert counters, a tidy park (Benjasiri Park) for a stroll, and quieter specialty caf\xE9s on the sois off Sukhumvit.",ko:"プロンポンには、エムクオティエとエンポリアムという2つの大型モールがあり、カフェ、ベーカリー、スイーツ売り場が充実しています。散歩にぴったりのベンジャシリ公園や、スクンビット通りから入った路地の静かなスペシャルティカフェもあります。"},special:{en:"A polished, comfortable area with a lot of Japanese-friendly options and easy transit. Good if you want café time plus shopping without leaving the BTS line.",ko:"きれいで居心地のいいエリアで、日本人にも使いやすいお店がたくさんあります。BTSの路線から離れずに、カフェとショッピングを両方楽しめます。"},bestTime:["afternoon","evening"],timeText:{en:"12:00\u201320:00 (malls usually 10:00\u201322:00; check Google Maps for current hours)",ko:"12:00〜20:00がおすすめ(モールは通常10:00〜22:00、Googleマップで確認)"},cost:{min:150,max:500},costNote:{en:"Coffee and a dessert \u2248 250\u2013450 THB at mall caf\xE9s (estimate). The park is free.",ko:"モール内カフェでコーヒーとデザートを合わせて250〜450バーツくらい(推定)。公園は無料です。"},duration:[2,3],area:"phrom-phong",locationText:{en:"Phrom Phong: EmQuartier, Emporium, Benjasiri Park",ko:"プロンポン:エムクオティエ、エンポリアム、ベンジャシリ公園"},transit:{en:"BTS Phrom Phong (Sukhumvit Line); malls connect via the station skywalk. (Confirm exit on Google Maps.)",ko:"BTSプロンポン駅(スクンビットライン)。スカイウォークでモールと直結しています。(出口はGoogleマップで確認してください。)"},indoor:"both",crowd:"both",energy:1,tags:["relaxing","rainy-day","after-practice","date-night","team-bonding"],weather:{en:"Benjasiri Park is outdoors; skip it at midday heat or in rain and stay in the malls.",ko:"ベンジャシリ公園は屋外なので、日中の暑い時間帯や雨の日はモールで過ごしましょう。"},tips:{en:"It is a short BTS ride from Siam or Thonglor, so it combines easily with other plans. Weekends are busy at brunch time.",ko:"サイアムやトンローからBTSですぐなので、他の予定と組み合わせやすいです。週末のブランチタイムは混みます。"},geoQuery:"Phrom Phong, Bangkok",mapsQuery:"cafe Phrom Phong EmQuartier Bangkok",imgQuery:"EmQuartier Bangkok",imgAlt:"The EmQuartier shopping mall in Phrom Phong, Bangkok",imgIllustrative:!1},{id:"photo-talat-noi-film-walk",group:"photo",title:{en:"Film photo walk: Talat Noi & old Charoen Krung",ko:"フィルム写真さんぽ:タラートノイ&オールド・チャルンクルン"},desc:{en:"Bring a film camera, or just your phone, for a walking loop through Talat Noi's narrow lanes, old workshops, shrines, murals and the old Charoen Krung shophouses. It is one of the most photogenic areas in Bangkok.",ko:"フィルムカメラやスマホを持って、タラートノイの狭い路地、古い作業場、祠、壁画、昔ながらのチャルンクルンの商店街を歩いてみましょう。バンコクで一番フォトジェニックなエリアのひとつです。"},special:{en:"Textures, colors and light you will not find in the malls: rusty metal, tiled walls, shrine incense, street art. Mornings give the softest light and fewest people.",ko:"ショッピングモールでは見られない質感や色合いがあります。錆びたトタン、タイル張りの壁、祠のお香、ストリートアートまで。午前は光がやわらかく、人も少なめです。"},bestTime:["morning","afternoon"],timeText:{en:"08:30\u201311:00 for soft light and few people, or 16:00\u201317:30 for golden hour",ko:"やわらかい光と静けさなら08:30〜11:00、ゴールデンアワーなら16:00〜17:30がおすすめ"},cost:{min:0,max:300},costNote:{en:"Walking is free; budget for coffee and a snack or film (estimate).",ko:"歩くのは無料で、コーヒー、軽食、フィルム代だけあれば大丈夫です(推定)。"},duration:[2,3],area:"talat-noi",locationText:{en:"Talat Noi and Charoen Krung Road, Samphanthawong",ko:"サムパンタウォン区 タラートノイとチャルンクルン通り"},transit:{en:"Boat to Ratchawong Pier then walk, or MRT Hua Lamphong plus a ~20 min walk/short Grab. (Confirm route on Google Maps.)",ko:"ボートでラーチャウォン船着場で下船して徒歩、またはMRTフアランポーン駅から徒歩20分ほど/Grab。(ルートはGoogleマップで確認してください。)"},indoor:"outdoor",crowd:"both",energy:2,tags:["photo","hidden-gem","adventurous","relaxing"],weather:{en:"Fully outdoors with little shade and heat from late morning. Go early, carry water, and avoid the rain; wet alleys get slippery.",ko:"すべて屋外で日陰が少なく、午前の遅い時間から暑くなります。早めに行って水を持っていき、雨の日は避けましょう。雨で濡れた路地は滑ります。"},tips:{en:"Narrow lanes are shared with workers and motorbikes. Ask before photographing people, be quiet at shrines, and do not block doorways. Keep your camera strap on and bag in front.",ko:"狭い路地を働いている人やバイクと一緒に使っています。人を撮るときは先に聞いて、祠では静かにして、出入口はふさがないようにしてください。カメラのストラップは首にかけ、バッグは前に抱えましょう。"},geoQuery:"Talat Noi, Bangkok",mapsQuery:"Talat Noi street art Bangkok",imgQuery:"Talat Noi",imgAlt:"Colorful old buildings and shrine details in the Talat Noi neighborhood of Bangkok",imgIllustrative:!1},{id:"photo-mahanakhon-skywalk",group:"photo",title:{en:"Skyline shots at Mahanakhon SkyWalk",ko:"マハナコーン・スカイウォークでスカイラインを撮ろう"},desc:{en:"Mahanakhon is one of Bangkok's tallest towers, with an indoor observation deck, a rooftop bar area and a glass-floor SkyWalk. You get a 360-degree view of the Bangkok skyline, from Silom's towers to the river.",ko:"マハナコーンはバンコクで最も高いビルのひとつで、屋内展望台、ルーフトップバーのスペース、ガラス張りの床のスカイウォークがあります。シーロムの高層ビル群から川まで、360度のバンコクのスカイラインを一望できます。"},special:{en:'The glass-floor shot is the iconic Bangkok skyline photo, and sunset or blue hour is stunning. Good for a "we were here" group photo.',ko:"ガラス床の写真はバンコクを代表するスカイラインショットで、夕日やブルーアワーには本当にきれいです。「ここに来たぞ」というみんなの集合写真を残すのにぴったりです。"},bestTime:["evening"],timeText:{en:"Arrive ~45\u201360 min before sunset (sunset is about 17:45\u201318:15 in Nov\u2013Jan); check Google Maps for current hours",ko:"日没の45〜60分前に到着がおすすめ(11〜1月の日没は17:45〜18:15ごろ)。営業時間はGoogleマップで確認"},cost:{min:800,max:1500},costNote:{en:"Tickets are the priciest item in this list; indoor deck vs rooftop SkyWalk tiers differ (estimate; check the official booking page for current prices).",ko:"このリストのなかでは一番高めです。屋内展望台とルーフトップのスカイウォークでチケット料金が違います(推定。現在の料金は公式予約ページで確認)。"},duration:[1.5,2.5],area:"other",locationText:{en:"King Power Mahanakhon, Silom / Sathorn area",ko:"キングパワー・マハナコーン、シーロム・サトーン エリア"},transit:{en:"BTS Chong Nonsi, then a short walk. (Confirm exit on Google Maps.)",ko:"BTSチョンノンシー駅から徒歩で移動します。(出口はGoogleマップで確認してください。)"},indoor:"both",crowd:"both",energy:2,tags:["photo","date-night","adventurous","team-bonding"],weather:{en:"The SkyWalk is open-air rooftop and can close in heavy rain or strong wind. Check conditions and bring a light layer for the breeze.",ko:"スカイウォークはオープンエアのルーフトップなので、豪雨や強風のときは閉まることがあります。天気を確認して、風よけに薄手の羽織りものを持っていきましょう。"},tips:{en:"Book ahead through the official channel to avoid sell-outs. Wear comfortable shoes and clothes; you may be asked to put on shoe covers for the glass floor. Fear of heights is common here; no pressure.",ko:"売り切れを避けるには、公式チャネルで事前に予約してください。ガラス床では靴カバーを履くよう案内されることがあります。高所恐怖症の方は無理しないでくださいね。"},geoQuery:"King Power Mahanakhon, Bangkok",mapsQuery:"King Power Mahanakhon SkyWalk Bangkok",imgQuery:"Mahanakhon Bangkok",imgAlt:"The Mahanakhon tower in Bangkok with its pixelated spiral facade",imgIllustrative:!1},{id:"photo-wat-arun-sunset-river",group:"photo",title:{en:"Wat Arun at sunset from the river",ko:"チャオプラヤー川から見るワット・アルンの夕日"},desc:{en:"Wat Arun, the Temple of Dawn, glows at sunset across the Chao Phraya River. Ride the cross-river ferry from Tha Tien Pier to the temple, or shoot from the Tha Tien side and from river-view terraces with the temple's silhouette.",ko:"暁の寺ワット・アルンは、夕暮れにチャオプラヤー川の対岸で黄金色に輝きます。ターティエン船着場から対岸の寺院へ渡し船に乗ったり、ターティエン側の川沿いやリバービューのテラスからシルエットを撮ったりできます。"},special:{en:"One of Bangkok's most iconic photos, and the river breeze makes the golden hour comfortable. Easy to combine with Wat Pho and Chinatown nearby.",ko:"バンコクで最も象徴的な写真のひとつです。川風のおかげでゴールデンアワーも涼しく、近くのワット・ポーやチャイナタウンとセットで回りやすいです。"},bestTime:["afternoon","evening"],timeText:{en:"Arrive ~16:30 for golden hour; sunset is around 17:45\u201318:15 in Nov\u2013Jan. Check Google Maps for the temple's current hours and entry rules",ko:"ゴールデンアワーは16:30ごろ到着がおすすめ。11〜1月の日没は17:45〜18:15ごろです。寺院の営業時間と入場ルールはGoogleマップで確認してください"},cost:{min:0,max:350},costNote:{en:"The cross-river ferry is only a few baht; the temple entry for foreign visitors is typically around 100\u2013200 THB, and riverside drinks cost extra (estimates, check on arrival).",ko:"対岸への渡し船は数バーツ程度で、外国人の寺院入場料は通常100〜200バーツ、川沿いのドリンクは別料金です(推定、現地で確認)。"},duration:[1.5,3],area:"riverside",locationText:{en:"Wat Arun and Tha Tien Pier, Chao Phraya River",ko:"ワット・アルンとターティエン船着場、チャオプラヤー川"},transit:{en:"Chao Phraya Express Boat to Tha Tien Pier (near Wat Pho), then cross-river ferry to Wat Arun; or MRT Sanam Chai plus a ~10 min walk to Tha Tien. (Confirm route on Google Maps.)",ko:"チャオプラヤー・エクスプレスボートでターティエン船着場(ワット・ポー近く)で下船し、対岸行きの渡し船でワット・アルンへ。またはMRTサナームチャイ駅からターティエンまで徒歩10分ほど。(ルートはGoogleマップで確認してください。)"},indoor:"outdoor",crowd:"both",energy:2,tags:["photo","date-night","team-bonding","adventurous"],weather:{en:"Outdoors, hot and humid with little shade until late afternoon. Bring water and sunscreen; river conditions can be rough in heavy rain.",ko:"屋外なので夕方遅くまで暑くて湿度が高く、日陰も少ないです。水と日焼け止めを持っていきましょう。豪雨のときは川が荒れることがあります。"},tips:{en:"Temples require covered shoulders and knees; carry a light scarf or long pants. Follow signs for restricted areas and be respectful (no climbing where it is not allowed). Watch your bag on crowded ferries.",ko:"寺院では肩とひざを隠す必要があります。薄手のスカーフや長ズボンを持っていきましょう。立入禁止エリアの表示を守り、禁止されている場所には登らないでください。混み合う渡し船ではバッグに注意しましょう。"},geoQuery:"Wat Arun, Bangkok",mapsQuery:"Wat Arun Bangkok",imgQuery:"Wat Arun sunset",imgAlt:"Wat Arun temple at sunset seen across the Chao Phraya River",imgIllustrative:!1},{id:"photo-warehouse-30",group:"photo",title:{en:"Warehouse 30: creative complex on Charoen Krung",ko:"ウェアハウス30:チャルンクルンのクリエイティブ複合施設"},desc:{en:"Warehouse 30 is a cluster of old WWII-era warehouses on Soi Charoen Krung 30 that were turned into a creative complex with caf\xE9s, design and lifestyle shops, galleries and event spaces. The industrial brick-and-steel structure is very photogenic.",ko:"ウェアハウス30は、ソイ・チャルンクルン30にある第二次世界大戦時代の古い倉庫を改装して、カフェ、デザイン・ライフスタイルショップ、ギャラリー、イベントスペースにした複合文化施設です。レンガと鉄骨の構造がそのまま残っていて、写真映えします。"},special:{en:"It combines architecture, caf\xE9 time and local design in a single stop, so it is an easy first pick in the Charoen Krung area. Works any time of day.",ko:"建築、カフェタイム、ローカルデザインを一度に楽しめるので、チャルンクルンで最初に行くのにちょうどいい場所です。何時に行ってもOKです。"},bestTime:["morning","afternoon"],timeText:{en:"10:00\u201318:00 is a good range; individual shops have their own hours, so check Google Maps",ko:"10:00〜18:00くらいがおすすめです。入っているお店ごとに営業時間が違うので、Googleマップで確認してください"},cost:{min:0,max:400},costNote:{en:"Entry to the complex is free; budget for a coffee or a small shop item (estimate).",ko:"入場は無料で、コーヒーや雑貨を買う分の費用くらいです(推定)。"},duration:[1,2.5],area:"charoen-krung",locationText:{en:"Warehouse 30, Soi Charoen Krung 30, Bang Rak",ko:"バンラック ソイ・チャルンクルン30、ウェアハウス30"},transit:{en:"BTS Saphan Taksin plus a short taxi/Grab, or a river boat to a nearby pier and a walk. (Confirm route on Google Maps.)",ko:"BTSサパーンタクシン駅からタクシー・Grabで少し移動するか、川のボートで近くの船着場で下船して徒歩。(ルートはGoogleマップで確認してください。)"},indoor:"both",crowd:"both",energy:1,tags:["photo","hidden-gem","relaxing","rainy-day","date-night"],weather:{en:"Courtyards are outdoors, but covered areas and shops give shelter from rain and sun.",ko:"中庭は屋外ですが、屋根のあるスペースやお店があるので、雨や日差しを避けられます。"},tips:{en:"Tenants change over time, so treat any specific shop as unconfirmed and check Google Maps first. Combine with a Charoen Krung caf\xE9 or gallery walk.",ko:"入っているお店は変わることがあるので、特定のお店はGoogleマップで確認してください。チャルンクルンのカフェ・ギャラリー散歩とセットで行くのがおすすめです。"},geoQuery:"Warehouse 30, Bangkok",mapsQuery:"Warehouse 30 Charoen Krung Bangkok",imgQuery:"Warehouse 30 Bangkok",imgAlt:"The renovated warehouse complex Warehouse 30 on Charoen Krung Road in Bangkok",imgIllustrative:!1},{id:"photo-bacc-gallery",group:"photo",title:{en:"Bangkok Art and Culture Centre (BACC)",ko:"バンコク・アート・アンド・カルチャー・センター(BACC)"},desc:{en:"BACC is a public contemporary art center in a spiral-ramp building right next to BTS National Stadium. It hosts rotating exhibitions, shops from local designers and a few caf\xE9s and bookstores on the lower floors.",ko:"BACCは、BTSナショナルスタジアム駅のすぐ隣にある、らせん状の建物の現代美術センターです。企画展が入れ替わり、低層階にはローカルデザイナーのショップ、カフェ、書店があります。"},special:{en:'Free or low-cost, air-conditioned and ten minutes from Siam: the easiest "art" stop in Bangkok. The spiral interior is itself a great photo backdrop.',ko:"無料か安くて、エアコンが効いていて、サイアムから歩いて10分です。バンコクで一番手軽な「アート」スポットです。らせん状の館内そのものも写真の背景にぴったりです。"},bestTime:["afternoon"],timeText:{en:"Typically open from about 10:00 to evening and often closed on Mondays; check Google Maps and the current exhibition schedule",ko:"通常10:00ごろから夕方まで、月曜は休館のことが多いです。Googleマップと現在の展示スケジュールを確認してください"},cost:{min:0,max:200},costNote:{en:"Many exhibitions are free; some special shows may charge a small fee (estimate).",ko:"ほとんどの展示は無料で、一部の特別展は少額の入場料がかかる場合があります(推定)。"},duration:[1,2.5],area:"siam",locationText:{en:"Bangkok Art and Culture Centre, Pathum Wan",ko:"パトゥムワン区 バンコク・アート・アンド・カルチャー・センター"},transit:{en:"BTS National Stadium, direct walk from the station. (Confirm exit on Google Maps.)",ko:"BTSナショナルスタジアム駅から直結で歩いて行けます。(出口はGoogleマップで確認してください。)"},indoor:"indoor",crowd:"both",energy:1,tags:["rainy-day","photo","relaxing","after-practice","date-night"],tips:{en:"Photography rules differ by exhibition. Look for signs or ask staff before shooting art. Pair with a Siam Square or MBK stop on the same day.",ko:"撮影ルールは展覧会ごとに違います。作品を撮る前に表示を確認するか、スタッフに聞いてください。同じ日にサイアムスクエアやMBKとセットで回るのがおすすめです。"},geoQuery:"Bangkok Art and Culture Centre, Bangkok",mapsQuery:"Bangkok Art and Culture Centre",imgQuery:"Bangkok Art and Culture Centre",imgAlt:"The curved-ramp building of the Bangkok Art and Culture Centre",imgIllustrative:!1},{id:"photo-yaowarat-neon-night",group:"photo",title:{en:"Yaowarat neon street photography at night",ko:"ヤワラートのネオン夜ストリートフォト"},desc:{en:"Yaowarat Road, Bangkok's Chinatown, lights up after dark with neon shop signs, steaming street-food carts and busy sidewalks. It is one of the best places in the city for moody night street photography.",ko:"バンコクのチャイナタウン、ヤワラート通りは、日が暮れるとネオンの看板、湯気の立つ屋台のカート、にぎわう歩道が一体となります。雰囲気のある夜のストリートフォトを撮るのに最高の場所のひとつです。"},special:{en:"High energy and plenty of color: you can shoot, snack and people-watch in one loop. Great as the last stop of a day trip.",ko:"エネルギーにあふれて色彩も豊かです。写真を撮って、軽く食べて、人間観察まで、ぐるっと一周でできます。一日の最後のコースにぴったりです。"},bestTime:["evening","night"],timeText:{en:"Start around 18:00\u201319:00 when carts open; most street food runs until about 23:00 or later (check Google Maps)",ko:"カートが開く18:00〜19:00にスタートしましょう。屋台は通常夜11時以降まで営業しています(Googleマップで確認)"},cost:{min:0,max:400},costNote:{en:"Photography is free; snacks cost about 40\u2013120 THB each (estimates).",ko:"撮影は無料で、軽食は1つ40〜120バーツくらい(推定)です。"},duration:[1.5,3],area:"yaowarat",locationText:{en:"Yaowarat Road, Samphanthawong (Chinatown)",ko:"サムパンタウォン区 ヤワラート通り(チャイナタウン)"},transit:{en:"MRT Wat Mangkon, then a short walk to Yaowarat Road. (Confirm exit on Google Maps.)",ko:"MRTワット・マンコン駅からヤワラート通りまで歩いてすぐです。(出口はGoogleマップで確認してください。)"},indoor:"outdoor",crowd:"both",energy:3,tags:["photo","late-night","adventurous","team-bonding"],weather:{en:"Evenings are cooler, but sidewalks are crowded and humid. Streets can flood briefly in heavy rain.",ko:"夕方は昼より涼しいですが、歩道は混んでいて蒸し暑いです。豪雨のときは道が一時的に冠水することがあります。"},tips:{en:"Crowds are tight, so keep your phone and wallet secure and carry a small bag in front. Photograph people only with permission, and do not block carts or traffic.",ko:"人が多くて混み合うので、スマホと財布をしっかり管理して、小さなバッグは前に抱えてください。人を撮るときは許可をもらい、カートや車道をふさがないでください。"},geoQuery:"Yaowarat Road, Bangkok",mapsQuery:"Yaowarat Road Bangkok",imgQuery:"Yaowarat Road night",imgAlt:"Neon signs and street stalls on Yaowarat Road in Bangkok at night",imgIllustrative:!1},{id:"photo-pak-khlong-talat-flowers",group:"photo",title:{en:"Pak Khlong Talat flower market and Memorial Bridge",ko:"パクローン・タラート花市場&メモリアル橋"},desc:{en:"Pak Khlong Talat is Bangkok's big wholesale flower market, with mountains of marigolds, orchids and roses just by the river and the Memorial Bridge. It is lively day and night, and a very photogenic spot.",ko:"パクローン・タラートはバンコクの大きな花の卸売市場で、川とメモリアル橋のすぐそばに、マリーゴールド、蘭、バラが山のように積まれています。昼も夜も活気があり、写真映えするスポットです。"},special:{en:"Super colorful photos for very little money, and flowers are really cheap. Pair with the river sunset at Wat Arun or an evening stroll by the Memorial Bridge.",ko:"ほんの少しのお金で色鮮やかな写真が撮れて、お花も本当に安いです。ワット・アルンの夕日やメモリアル橋の夜さんぽとセットにするのがおすすめです。"},bestTime:["morning","evening","night"],timeText:{en:"Busiest at night and early morning; many stalls open nearly around the clock, but check Google Maps for current hours",ko:"夜と早朝が最も活発です。ほぼ24時間営業のお店も多いですが、営業時間はGoogleマップで確認してください"},cost:{min:0,max:200},costNote:{en:"Walking is free; a small bouquet is typically around 50\u2013150 THB (estimate).",ko:"見て回るのは無料で、小さな花束は通常50〜150バーツくらい(推定)です。"},duration:[1,2],area:"riverside",locationText:{en:"Pak Khlong Talat, near Memorial Bridge (Phra Phuttha Yodfa)",ko:"メモリアル橋(プラ・プッタヨートファー橋)近くのパクローン・タラート"},transit:{en:"MRT Sanam Chai then a ~10\u201315 min walk; or Chao Phraya Express Boat to Saphan Phut Pier. (Confirm route on Google Maps.)",ko:"MRTサナームチャイ駅から徒歩10〜15分、またはチャオプラヤーボートでサパーンプット船着場で下船。(ルートはGoogleマップで確認してください。)"},indoor:"outdoor",crowd:"both",energy:2,tags:["photo","hidden-gem","late-night","adventurous"],weather:{en:"Mostly covered walkways but hot and humid; wet floors in the rain, so wear non-slip shoes.",ko:"屋根のある通路が多いですが、暑くて湿度が高いです。雨の日は床が滑るので、滑りにくい靴を履きましょう。"},tips:{en:"Watch for hand carts and delivery bikes; keep to the side of walkways. Ask before photographing vendors and avoid blocking sellers.",ko:"手押し車や配達バイクが通るので、通路の端を歩いてください。お店の人を撮るときは先に聞いて、売り場の前をふさがないでください。"},geoQuery:"Pak Khlong Talat, Bangkok",mapsQuery:"Pak Khlong Talat flower market Bangkok",imgQuery:"Pak Khlong Talat",imgAlt:"Piles of marigolds and flowers at the Pak Khlong Talat flower market in Bangkok",imgIllustrative:!1},{id:"photo-jim-thompson-house",group:"photo",title:{en:"Jim Thompson House: teak house, garden & art",ko:"ジム・トンプソンの家:チーク材の家、庭園、アート"},desc:{en:"The Jim Thompson House is a museum of traditional Thai teak houses assembled by an American silk entrepreneur, set in a lush garden next to a quiet canal. The same site includes the Jim Thompson Art Center, a shop and a caf\xE9.",ko:"ジム・トンプソンの家は、アメリカ人のシルク事業家が伝統的なタイのチーク材の家屋を集めて作った博物館です。静かな運河沿いの緑豊かな庭園の中にあり、同じ敷地にジム・トンプソン・アートセンター、ショップ、カフェがあります。"},special:{en:"A calm, shaded escape just a few minutes from Siam with beautiful architecture, antiques and a garden. A good pick for a quiet, photo-friendly hour.",ko:"サイアムから数分の、静かで木陰のある癒やしスポットです。美しい建築、アンティーク、庭園があって、静かに写真を撮るのにぴったりです。"},bestTime:["morning","afternoon"],timeText:{en:"Typically open in daytime with guided house visits; hours and photo rules change, so check Google Maps and the official site",ko:"通常は日中にガイドツアーで家の内部を見学できます。時間や撮影ルールは変わることがあるので、Googleマップと公式サイトで確認してください"},cost:{min:150,max:400},costNote:{en:"The house tour ticket is about 200\u2013250 THB for foreign visitors; the caf\xE9 and shop are extra (estimate).",ko:"外国人のハウスツアーのチケットは200〜250バーツくらいで、カフェとショップは別料金です(推定)。"},duration:[1,2],area:"siam",locationText:{en:"Jim Thompson House, Soi Kasemsan 2, Pathum Wan",ko:"パトゥムワン区 ソイ・カセームサン2、ジム・トンプソンの家"},transit:{en:"BTS National Stadium, then a short walk to Soi Kasemsan 2. (Confirm exit on Google Maps.)",ko:"BTSナショナルスタジアム駅からソイ・カセームサン2まで歩いてすぐです。(出口はGoogleマップで確認してください。)"},indoor:"both",crowd:"both",energy:1,tags:["photo","relaxing","hidden-gem","date-night"],weather:{en:"The garden is outdoors and shaded; the house tour is indoors, so a drizzle is not a problem but a downpour can slow the walk.",ko:"庭は屋外ですが木陰が多く、家のツアーは屋内なので、小雨なら問題ありません。豪雨のときは移動が大変です。"},tips:{en:"Photography is often restricted inside the house, so ask or look for signs. Remove shoes at the house entrance if asked. Dress modestly.",ko:"家の内部は撮影が制限されていることが多いので、案内表示を確認するか聞いてください。入口で靴を脱ぐよう言われたら従ってください。きちんとした服装がおすすめです。"},geoQuery:"Jim Thompson House, Bangkok",mapsQuery:"Jim Thompson House Bangkok",imgQuery:"Jim Thompson House",imgAlt:"Traditional Thai teak houses in the garden of the Jim Thompson House museum in Bangkok",imgIllustrative:!1},{id:"fashion-siam-square-streetwear",group:"fashion",title:{en:"Siam Square & Siam Center: local streetwear and designer labels",ko:"サイアムスクエア&サイアム・センター:ローカルストリートウェアとデザイナーブランド"},desc:{en:"Siam Center and the Siam Square sois are the heart of Bangkok's youth fashion: Thai designer labels, streetwear boutiques, sneaker and accessory shops, plus international brands in the connected malls. It is where Bangkok's trendsetters shop.",ko:"サイアム・センターとサイアムスクエアの路地は、バンコクの若者ファッションの中心です。タイのデザイナーブランド、ストリートウェアのブティック、スニーカーやアクセサリーのショップ、つながっているモールの海外ブランドまで揃っています。バンコクのトレンドセッターが買い物をする場所です。"},special:{en:"You can shop Thai labels you will not find at home, all in air-conditioning, and everything is within walking distance of BTS Siam. Mix with photo booths and caf\xE9s nearby.",ko:"日本では出会えないタイのブランドを、エアコンの効いた中でショッピングできて、BTSサイアム駅からすべて歩いて行けます。近くのプリクラ(フォトブース)やカフェとセットにすると充実した一日になります。"},bestTime:["afternoon","evening"],timeText:{en:"12:00\u201320:00; malls usually open around 10:00\u201322:00 but small Siam Square shops vary (check Google Maps)",ko:"12:00〜20:00がおすすめ。モールは通常10:00〜22:00営業ですが、サイアムスクエアの小さなお店はまちまちです(Googleマップで確認)"},cost:{min:0,max:3e3},costNote:{en:"Window-shopping is free; local-brand tees and accessories are typically around 500\u20132,500 THB, so set a budget before you go (estimates).",ko:"ウィンドウショッピングは無料で、ローカルブランドのTシャツやアクセサリーは通常500〜2,500バーツほどです。行く前に予算を決めておきましょう(推定)。"},duration:[2,4],area:"siam",locationText:{en:"Siam Center, Siam Discovery and Siam Square",ko:"サイアム・センター、サイアム・ディスカバリー、サイアムスクエア"},transit:{en:"BTS Siam; skywalk and street-level routes connect the malls and Siam Square. (Confirm exit on Google Maps.)",ko:"BTSサイアム駅。スカイウォークと地上の道でモールとサイアムスクエアがつながっています。(出口はGoogleマップで確認してください。)"},indoor:"both",crowd:"both",energy:2,tags:["rainy-day","team-bonding","photo","after-practice"],weather:{en:"Malls are cool inside, but walking between them and Siam Square is outdoors and hot; use the skywalk where possible.",ko:"モールの中は涼しいですが、モールとサイアムスクエアの間は屋外で暑いです。できるだけスカイウォークを使いましょう。"},tips:{en:"Compare prices across floors and try on before buying. Tourist tax refund (VAT) rules apply at some stores; ask at the till. Bring your original passport.",ko:"フロアごとに価格を比べて、試着してから買いましょう。一部の店舗では免税(VAT還付)が可能なので、レジで聞いてみてください。還付の申請にはパスポートの原本が必要です。"},geoQuery:"Siam Center, Bangkok",mapsQuery:"Siam Center Bangkok",imgQuery:"Siam Center Bangkok",imgAlt:"The exterior of the Siam Center shopping mall in Bangkok",imgIllustrative:!1},{id:"fashion-chatuchak-weekend-market",group:"fashion",title:{en:"Chatuchak Weekend Market: vintage, handmade and local brands",ko:"チャトゥチャック・ウィークエンドマーケット:ヴィンテージ、ハンドメイド、ローカルブランド"},desc:{en:"Chatuchak is one of the world's biggest weekend markets, with thousands of stalls selling vintage clothing, secondhand jeans and jackets, handmade accessories and small local fashion brands, alongside home goods, plants and street food.",ko:"チャトゥチャックは世界最大級の週末マーケットで、何千もの屋台でヴィンテージ服、古着のジーンズやジャケット、ハンドメイドのアクセサリー、小さなローカルファッションブランドのほか、生活雑貨、植物、屋台グルメまで売っています。"},special:{en:"The best place in Bangkok for one-off vintage and indie pieces at low prices; haggling is part of the fun. Bring cash and a big bag.",ko:"バンコクで一番安く、ユニークなヴィンテージやインディーズのアイテムが見つかる場所です。値段交渉も楽しみのひとつ。現金と大きめのバッグを持っていきましょう。"},bestTime:["morning","afternoon"],timeText:{en:"Mainly Saturday and Sunday, from morning until early evening; some sections also open Friday evening. Check Google Maps for current hours. Go before noon to beat heat and crowds",ko:"主に土・日の午前から夕方早めまで、一部のエリアは金曜の夜も営業しています。営業時間はGoogleマップで確認してください。暑さと混雑を避けるなら正午前に行きましょう"},cost:{min:200,max:2e3},costNote:{en:"Secondhand tees and tops often start around 100\u2013300 THB; jackets and designer pieces cost more (estimates; prices are negotiable).",ko:"古着のTシャツは通常100〜300バーツから、ジャケットやデザイナーものはもっと高いです(推定、交渉可能)。"},duration:[3,5],area:"other",locationText:{en:"Chatuchak Weekend Market, Chatuchak district",ko:"チャトゥチャック区 チャトゥチャック・ウィークエンドマーケット"},transit:{en:"MRT Kamphaeng Phet or MRT Chatuchak Park, or BTS Mo Chit. (Confirm exit on Google Maps.)",ko:"MRTカムペーンペット駅またはMRTチャトゥチャックパーク駅、BTSモーチット駅で下車。(出口はGoogleマップで確認してください。)"},indoor:"outdoor",crowd:"both",energy:3,tags:["adventurous","team-bonding","photo"],weather:{en:"Very hot and humid with a maze of covered lanes; crowds peak at midday. Bring water, sunscreen and a hand fan. Heavy rain can flood parts of the lanes.",ko:"とても暑くて湿度が高く、屋根のある迷路のような路地です。正午ごろが一番混みます。水、日焼け止め、携帯扇風機を持っていきましょう。豪雨のときは一部の通路が冠水することがあります。"},tips:{en:"Pickpocketing happens in crowds, so keep bags zipped and in front. The market is a maze, so save a pin to the exit or your meeting point. Try on clothes only where it is allowed and bargain politely.",ko:"人混みでスリがいるので、バッグはファスナーを閉めて前に抱えてください。迷路のように複雑なので、出口や集合場所をGoogleマップに保存しておきましょう。試着は可能な場所だけで、値段交渉は丁寧にしてくださいね。"},geoQuery:"Chatuchak Weekend Market, Bangkok",mapsQuery:"Chatuchak Weekend Market Bangkok",imgQuery:"Chatuchak Weekend Market",imgAlt:"Crowded lanes of stalls at Chatuchak Weekend Market in Bangkok",imgIllustrative:!1},{id:"fashion-mbk-art-toys",group:"fashion",title:{en:"MBK Center & Siam art-toy hunt",ko:"MBKセンター&サイアムのアートトイ探し"},desc:{en:"Bangkok has a lively designer-toy scene, with blind boxes, collectible figures and gashapon at shops in MBK Center, Siam Center and other malls. Browse resale and collector stalls in MBK and branded stores in the nearby malls.",ko:"バンコクはデザイナーズトイのカルチャーが盛んで、MBKセンターやサイアム・センターなどで、ブラインドボックス、コレクション用フィギュア、ガチャが手に入ります。MBKではリセールやコレクターの売り場を、近くのモールではブランドの店舗を見て回れます。"},special:{en:"A fun treasure hunt where you can find both mainstream blind boxes and rare collector pieces, and compare prices across floors. Great for fans of figures and anime-style merch.",ko:"メジャーなブラインドボックスからレアなコレクションまで、フロアごとに価格を比べながら探す、宝探しのような楽しさがあります。フィギュアやアニメ系グッズが好きな人にぴったりです。"},bestTime:["afternoon","evening"],timeText:{en:"12:00\u201320:00; MBK is usually open until about 21:00\u201322:00 but stall hours vary (check Google Maps)",ko:"12:00〜20:00がおすすめ。MBKは通常夜9〜10時までですが、売り場ごとに違います(Googleマップで確認)"},cost:{min:0,max:2e3},costNote:{en:"Blind boxes typically cost a few hundred THB each; collector pieces and resale items can be much more (estimates). Set a budget before you start.",ko:"ブラインドボックスは1つ数百バーツが目安で、コレクション品やリセール品はずっと高いことがあります(推定)。始める前に予算を決めておきましょう。"},duration:[1.5,3],area:"siam",locationText:{en:"MBK Center and Siam Center, Pathum Wan",ko:"パトゥムワン区 MBKセンターとサイアム・センター"},transit:{en:"BTS National Stadium for MBK Center (direct walkway); BTS Siam for Siam Center. (Confirm exit on Google Maps.)",ko:"MBKセンターはBTSナショナルスタジアム駅から直結、サイアム・センターはBTSサイアム駅。(出口はGoogleマップで確認してください。)"},indoor:"indoor",crowd:"both",energy:2,tags:["rainy-day","team-bonding","after-practice","adventurous"],tips:{en:"Inspect items for authenticity and sealed packaging; counterfeits exist at lower-end stalls. Fixed-price brand stores do not haggle; MBK market stalls often do. Ask about tax-refund eligibility if you spend a lot.",ko:"本物かどうかと、未開封の状態かどうかを必ず確認してください。安い売り場には偽物がある場合があります。ブランド店は定価販売で、MBKの売り場は値段交渉できることが多いです。たくさん買うなら、免税(VAT還付)の対象かも聞いてみましょう。"},geoQuery:"MBK Center, Bangkok",mapsQuery:"art toy shop MBK Center Bangkok",imgQuery:"MBK Center Bangkok",imgAlt:"The MBK Center shopping mall in Bangkok",imgIllustrative:!0},{id:"fashion-tcdc-grand-postal",group:"fashion",title:{en:"TCDC at the Grand Postal Building: Thai design hub",ko:"グランド・ポスタル・ビルのTCDC:タイのデザインハブ"},desc:{en:"The Thailand Creative & Design Center (TCDC) sits in the historic Grand Postal Building on Charoen Krung Road. It runs design exhibitions, a materials library and a design shop, and often hosts talks and events for creatives.",ko:"TCDC(タイランド・クリエイティブ&デザイン・センター)は、チャルンクルン通りにある歴史的なグランド・ポスタル・ビルにあります。デザイン展、マテリアルライブラリー、デザインショップを運営し、クリエイター向けのトークやイベントもよく開かれます。"},special:{en:"A quiet, air-conditioned way to see how Thai designers think, great for fashion, graphics and product-design fans. Also a great base for the Charoen Krung creative district.",ko:"静かでエアコンの効いた場所で、タイのデザイナーたちの発想に触れられます。ファッション、グラフィック、プロダクトデザインが好きな人におすすめで、チャルンクルンのクリエイティブ地区巡りの拠点にもなります。"},bestTime:["afternoon"],timeText:{en:"Daytime hours; some areas are closed on certain days, so check Google Maps and the current exhibition schedule",ko:"日中の営業で、曜日によって閉まるエリアがあります。Googleマップと現在の展示スケジュールを確認してください"},cost:{min:0,max:300},costNote:{en:"Exhibitions and the library may be free or low-cost; budget for a coffee or a design-shop item (estimate; check current entry rules).",ko:"展示とライブラリーは無料か安いことがあります。コーヒーやデザインショップの小物代くらいを見ておきましょう(推定、最新の入場ルールを確認)。"},duration:[1,2],area:"charoen-krung",locationText:{en:"Grand Postal Building (TCDC), Charoen Krung Road, Bang Rak",ko:"バンラック チャルンクルン通り グランド・ポスタル・ビル(TCDC)"},transit:{en:"BTS Saphan Taksin plus a taxi/Grab, or a river boat to a nearby pier and a walk. (Confirm route on Google Maps.)",ko:"BTSサパーンタクシン駅からタクシー・Grab、または川のボートで近くの船着場で下船して徒歩。(ルートはGoogleマップで確認してください。)"},indoor:"indoor",crowd:"both",energy:1,tags:["rainy-day","relaxing","hidden-gem","photo"],tips:{en:"The center has moved locations in the past, so confirm the current address and opening status on Google Maps before you go. Check which exhibitions are running.",ko:"過去に場所を移したことがあるので、行く前にGoogleマップで現在の住所と営業状況を必ず確認してください。開催中の展示も確認しましょう。"},geoQuery:"TCDC Grand Postal Building, Bangkok",mapsQuery:"TCDC Thailand Creative and Design Center Bangkok",imgQuery:"Grand Postal Building Bangkok",imgAlt:"The historic Grand Postal Building on Charoen Krung Road in Bangkok",imgIllustrative:!1},{id:"fashion-asiatique-riverfront",group:"fashion",title:{en:"Asiatique The Riverfront: night market and boutiques",ko:"アジアティーク・ザ・リバーフロント:ナイトマーケットとブティック"},desc:{en:"Asiatique is a riverside open-air night bazaar built in old shipping warehouses, with hundreds of small shops for clothes, accessories and souvenirs, plus restaurants, a ferris wheel and river views.",ko:"アジアティークは、昔の船荷倉庫を改装した川沿いの屋外ナイトバザールで、服、アクセサリー、お土産を扱う小さなお店が何百軒もあり、レストラン、観覧車、リバービューもあります。"},special:{en:"A relaxed shopping-and-sunset evening with a free shuttle boat ride and plenty of food options. Fun for a team night out.",ko:"無料のシャトルボートで行く、ゆったりしたショッピングと夕日の夜です。食べ物も豊富なので、チームのお出かけに楽しいです。"},bestTime:["evening","night"],timeText:{en:"Opens in the late afternoon and runs until about midnight; check Google Maps and the official schedule",ko:"午後遅めにオープンして夜中の12時ごろまで営業しています。Googleマップと公式スケジュールを確認してください"},cost:{min:0,max:1500},costNote:{en:"Entry is free; clothes and souvenirs vary widely (estimates). A ferris-wheel ride typically costs a few hundred THB.",ko:"入場は無料で、服やお土産は価格の幅が大きいです(推定)。観覧車は通常数百バーツです。"},duration:[2,4],area:"riverside",locationText:{en:"Asiatique The Riverfront, Charoen Krung Road, Bang Kho Laem",ko:"バンコーレーム チャルンクルン通り アジアティーク・ザ・リバーフロント"},transit:{en:"BTS Saphan Taksin, then the free Asiatique shuttle boat from Sathorn (Central) Pier. (Confirm service times and route on Google Maps / Asiatique official channels.)",ko:"BTSサパーンタクシン駅で下車し、サトーン(セントラル)船着場から無料のアジアティーク・シャトルボートに乗ります。(運行時間とルートはGoogleマップや公式チャネルで確認してください。)"},indoor:"outdoor",crowd:"both",energy:2,tags:["date-night","team-bonding","photo","late-night"],weather:{en:"Open-air with some covered areas; hot at dusk and rain can interrupt the market. Check the forecast and bring a small rain jacket.",ko:"屋外のスペースで、屋根があるのは一部です。夕暮れどきも暑く、雨が降ると営業に影響が出ることがあります。天気予報を確認して、薄手のレインジャケットを持っていきましょう。"},tips:{en:"Prices at tourist-oriented shops can be higher than other markets, so compare and bargain politely. Last shuttle-boat times matter; confirm them so you do not get stranded.",ko:"観光客向けのお店は他の市場より高いことがあるので、比べて、丁寧に値段交渉しましょう。シャトルボートの最終時刻は大事なので、帰れなくならないように必ず確認してください。"},geoQuery:"Asiatique The Riverfront, Bangkok",mapsQuery:"Asiatique The Riverfront Bangkok",imgQuery:"Asiatique The Riverfront",imgAlt:"The Asiatique The Riverfront night market with its ferris wheel in Bangkok",imgIllustrative:!1}]});var Do,Yo=S(()=>{Do=[{id:"active-benjakitti-ride",group:"active",title:{en:"Benjakitti Park: Evening Ride, Jog & Skyline Lake Loop",ko:"ベンジャキティ公園 夕方のサイクリング&ジョギング(湖+スカイライン)"},desc:{en:"A big lakeside park in the middle of the city with a smooth loop path for cycling, jogging or a slow walk. The skyline of Sukhumvit rises behind the water, and the next-door Benjakitti Forest Park has an elevated boardwalk through trees.",ko:"都心の真ん中にある大きな湖畔の公園です。サイクリング、ジョギング、散歩にぴったりの平らな周回路があり、湖の向こうにはスクンビットの高層ビル群が広がります。すぐ隣のベンジャキティ・フォレストパークには、木々のあいだを歩ける高架のデッキもあります。"},special:{en:"Flat, easy and safe-feeling, so even non-cyclists can do it. Golden hour over the lake is one of the best free views in Bangkok, and it is a perfect low-key way to stretch out after a long practice day.",ko:"道が平らで安全な感じなので、自転車初心者でも大丈夫です。夕暮れの湖の景色は、バンコクで無料で見られる最高の景色のひとつです。練習のあとのストレッチにもぴったりです。"},bestTime:["evening"],timeText:{en:"About 16:30\u201319:00 for cooler air and golden hour. Avoid midday heat.",ko:"16:30〜19:00ごろがおすすめです。夕方で暑さがやわらぎ、写真もきれいに撮れます。日中は避けましょう。"},cost:{min:0,max:300},costNote:{en:"Entry is normally free. Bike rental, if you want one, is usually a small hourly fee (estimate ~50\u2013150 THB/hour) and may ask for an ID or deposit. Availability varies, so confirm on site.",ko:"入場は通常無料です。レンタル自転車は時間あたり少額(目安50〜150バーツ/時間、推定)で、身分証やデポジットを求められることがあります。状況は変わるので、現地で確認してください。"},duration:[1,2],area:"other",locationText:{en:"Benjakitti Park, Khlong Toei (off Rama IV / Ratchadaphisek Rd)",ko:"ベンジャキティ公園、クローントゥーイ(ラーマ4世通り/ラチャダーピセーク通り付近)"},transit:{en:"MRT Queen Sirikit National Convention Centre (QSNCC) is the closest station; a short walk to the park gates. (Confirm exit on Google Maps.)",ko:"MRTクイーン・シリキット国立コンベンションセンター(QSNCC)駅が最寄りです。公園の入口まで歩いてすぐです。(出口はGoogleマップで必ず確認してください。)"},indoor:"outdoor",crowd:"both",energy:2,tags:["after-practice","team-bonding","relaxing","photo","date-night"],weather:{en:"Go late afternoon: midday sun is brutal and there is little shade on the lake path. Bring water and sunscreen. If air quality is bad (PM2.5 is often higher from about December to March), skip the hard run and walk instead. Rain showers can arrive fast in the rainy season, so check the forecast.",ko:"午後遅めに行きましょう。日中は湖沿いの道に日陰がほとんどなく、本当に暑いです。水と日焼け止めは必須です。PM2.5は12〜3月ごろに悪化することが多いので、数値が高いときはランニングをやめて軽く歩きましょう。雨季はスコールが急に来るので、天気予報を確認してください。"},tips:{en:"Ride/run in the direction of traffic on the path and keep to your lane; weekends get busy with families and bike groups. Park hours and rental rules can change, so confirm on Google Maps. Stay hydrated and avoid the sun for a few hours after hard training.",ko:"道では進行方向を守り、自分のレーンを走ってください。週末は家族連れやサイクリンググループで混みます。公園の営業時間やレンタルの規定は変わることがあるので、Googleマップで確認してください。ハードなトレーニングのあとは水分補給をして、日差しは避けましょう。"},geoQuery:"Benjakitti Park, Bangkok",mapsQuery:"Benjakitti Park Bangkok",imgQuery:"Benjakitti Park",imgAlt:"Lake and skyline at Benjakitti Park in Bangkok",imgIllustrative:!1},{id:"active-lumphini-run-paddle",group:"active",title:{en:"Lumphini Park: Run, Paddle Boat & Meet the Lizards",ko:"ルンピニー公園:ランニング、スワンボート、そしてオオトカゲ見物"},desc:{en:"Bangkok's classic central park, with a loop path around a lake, shaded trees and a skyline backdrop. You can run laps, rent a paddle boat on the lake, or just walk and people-watch. Large Asian water monitor lizards roam the park, which surprises almost every first-timer.",ko:"バンコク都心を代表する公園です。湖を囲む周回路、木陰、その向こうの高層ビルの景色があります。ランニングをしたり、湖でスワンボートに乗ったり、歩きながら人間観察をしたりして楽しめます。大きなミズオオトカゲ(ウォーターモニター)が公園を歩き回っていて、初めて来た人はみんな驚きます。"},special:{en:"Run-friendly, central and easy by train. Around sunset there are often free outdoor aerobic and exercise groups, and at 18:00 the national anthem plays over the park (everyone pauses). Paddle boats on the lake are a cheap, silly team activity.",ko:"ランニングに向いていて、都心なので電車で行きやすいです。夕暮れどきには野外のエアロビや運動のグループがよく集まり、18時には公園に国歌が流れて、みんな立ち止まります。湖のスワンボートは安くて笑えるチームアクティビティです。"},bestTime:["morning","evening"],timeText:{en:"Early morning (about 05:30\u201308:00) or late afternoon to evening (about 16:30\u201319:30). Park hours can change, so check.",ko:"早朝(05:30〜08:00ごろ)か、夕方〜夜(16:30〜19:30ごろ)がおすすめです。開園時間は変わることがあるので確認してください。"},cost:{min:0,max:150},costNote:{en:"Park entry is typically free. Paddle boats cost a small fee (estimate ~40\u2013100 THB per boat, per 30 min). Confirm on site.",ko:"公園の入場は通常無料です。スワンボートは少額です(1隻30分あたり約40〜100バーツ、推定)。現地で確認してください。"},duration:[1,2],area:"other",locationText:{en:"Lumphini Park, Pathum Wan / Silom (Rama IV Rd)",ko:"ルンピニー公園、パトゥムワン/シーロム(ラーマ4世通り)"},transit:{en:"MRT Lumphini station is right by the park; MRT Silom / BTS Sala Daeng are also close. (Confirm exit on Google Maps.)",ko:"MRTルンピニー駅が公園のすぐ隣です。MRTシーロム駅/BTSサラーデーン駅も近いです。(出口はGoogleマップで確認してください。)"},indoor:"outdoor",crowd:"both",energy:3,tags:["after-practice","team-bonding","relaxing","photo"],weather:{en:"Run early or at dusk; midday is dangerously hot for hard efforts. Check the AQI before running (PM2.5 is often higher from about December to March) and switch to walking if it is red. Sudden rain in the wet season.",ko:"ランニングは早朝か夕暮れどきにしましょう。日中の激しい運動は本当に危険です。走る前に大気質(AQI)を確認して(PM2.5は12〜3月ごろに悪い傾向)、赤なら歩くだけに切り替えましょう。雨季はスコールがあります。"},tips:{en:"Keep a respectful distance from the monitor lizards: do not feed, touch or chase them (they bite and whip their tails, and they swim). Keep your phone and valuables zipped. Stand still when the anthem plays at 18:00 in public areas. Direction of travel on the main path is normally counter-clockwise, but follow the crowd.",ko:"オオトカゲとは距離をとってください。餌やり、触る、追いかけるのは禁止です。噛んだり尻尾で叩いたりしますし、泳ぎもします。スマホと貴重品はファスナー付きのバッグに入れましょう。18時に国歌が流れたら、公共エリアでは立ち止まって待つのがマナーです。メインの道の進行方向は通常反時計回りですが、周りの流れに合わせてください。"},geoQuery:"Lumphini Park, Bangkok",mapsQuery:"Lumphini Park Bangkok",imgQuery:"Lumphini Park Bangkok",imgAlt:"Lake and skyline at Lumphini Park in Bangkok",imgIllustrative:!1},{id:"active-pickleball-courts",group:"active",title:{en:"Pickleball in Bangkok: Rent a Court with the Squad",ko:"バンコクでピックルボール:コートを借りてチームで一戦"},desc:{en:"Pickleball has exploded in Bangkok, with courts in sports clubs, condo complexes, rooftop courts and dedicated facilities around Sukhumvit, Rama 9, Ratchada and many other districts. You rent a court by the hour, borrow paddles, and learn the rules in ten minutes.",ko:"バンコクはピックルボールブームです。スクンビット、ラマ9、ラチャダーなどいろいろなエリアに、スポーツクラブ、コンドミニアムの敷地、ルーフトップコート、専用施設があります。コートは時間単位で借りられ、パドルも借りられて、ルールは10分で覚えられます。"},special:{en:"Easy to learn, low injury risk (compared with contact sports), social and competitive at the same time, and perfect for splitting into 2v2 teams. Indoor/covered courts also work in rain or heat.",ko:"覚えやすく、激しい接触スポーツに比べてケガのリスクが低いです。交流と勝負のワクワクを同時に楽しめて、2対2のチーム戦にぴったりです。屋内・屋根付きのコートなら雨や暑さの日でもできます。"},bestTime:["morning","evening"],timeText:{en:"Early morning or after about 17:00 when it cools down. Many courts are busiest on weekday evenings and weekends, so book earlier.",ko:"早朝か、涼しくなる17時以降がおすすめです。平日の夕方と週末が一番混むので、早めに予約しましょう。"},cost:{min:100,max:400},costNote:{en:"Estimate: court rental often ~200\u2013600 THB per hour per court (split among 4 players), plus paddle/ball rental if needed. Prices vary by venue and time of day.",ko:"推定です。コートのレンタルは通常コートあたり1時間200〜600バーツ(4人で割り勘)で、必要ならパドルやボールのレンタル代が加わります。施設や時間帯によって違います。"},duration:[1,2],area:"other",locationText:{en:"Pickleball courts across Bangkok (Sukhumvit, Rama 9, Ratchada and more). Search nearby on Google Maps.",ko:"バンコク各地のピックルボールコート(スクンビット、ラマ9、ラチャダーなど)。Googleマップで近くを検索してください。"},transit:{en:'Depends on the court. Search "pickleball court Bangkok" on Google Maps near your hotel and filter for ones near a BTS/MRT station. Grab is easy for the rest. (Confirm exit on Google Maps.)',ko:"コートによって違います。Googleマップで宿泊先の近くで「pickleball court Bangkok」を検索して、BTS/MRTの近くのコートを選びましょう。それ以外はGrabが便利です。(出口はGoogleマップで確認してください。)"},indoor:"both",crowd:"group",energy:3,tags:["team-bonding","after-practice","adventurous"],weather:{en:"Outdoor courts are hot and slippery after rain; choose covered or indoor ones midday. Drink more than you think, and take breaks in the shade.",ko:"屋外コートは暑く、雨のあとは滑ります。日中は屋根付きか屋内のコートを選びましょう。思っている以上に水を飲んで、日陰で休みながら遊んでください。"},tips:{en:"Book ahead via the venue's LINE/phone/online booking (do not rely on walk-ins in the evening). Ask about paddle rental and whether balls are included. Wear non-marking court shoes. Players who protect their wrists and hands for a living should not overdo it: warm up and stop if anything feels sore.",ko:"施設のLINE/電話/オンラインで事前に予約してください(夕方は飛び込みだとほぼ入れません)。パドルのレンタルやボール込みかどうかも聞いてみましょう。コート用の跡がつかない靴がおすすめです。手や手首が仕事道具なので無理せず、しっかりウォームアップして、少しでも痛みがあればすぐやめてください。"},mapsQuery:"pickleball court Bangkok",imgQuery:"Pickleball",imgAlt:"Players on a pickleball court holding paddles",imgIllustrative:!0},{id:"active-indoor-bouldering",group:"active",title:{en:"Indoor Bouldering: Climb Without Ropes (and Without the Heat)",ko:"室内ボルダリング:ロープなしのクライミング、エアコン付き"},desc:{en:"Bangkok has a growing number of air-conditioned climbing gyms with bouldering walls, mostly low walls over thick padding, so there is no rope or harness. Route colors show difficulty, and most gyms have beginner problems that anyone can try.",ko:"バンコクには、エアコンの効いたクライミングジムが増えています。ボルダリングは厚いマットの上で低い壁を登る方式なので、ロープもハーネスも要りません。色で難易度が分かれていて、初心者向けのルートも多いです。"},special:{en:'Great problem-solving and team-cheering activity that works in any weather. It is also a hit with people who like "puzzle + body" challenges.',ko:"天気に関係なくできて、パズルを解くように体で考える楽しさがあります。お互いに応援し合うので、チームの雰囲気も盛り上がります。"},bestTime:["afternoon","evening"],timeText:{en:"Afternoon or evening. Weekday evenings get busy. Check each gym's opening hours on Google Maps.",ko:"午後か夕方がおすすめです。平日の夕方は混みます。各ジムの営業時間はGoogleマップで確認してください。"},cost:{min:300,max:700},costNote:{en:"Estimate for a day pass plus shoe rental (~300\u2013700 THB). Some gyms charge extra for chalk or a safety briefing for first-timers. Prices vary.",ko:"1日券+シューズレンタルの推定です(300〜700バーツ)。初めてだと安全講習やチョーク代が別にかかるジムもあります。料金は施設によって違います。"},duration:[1,2],area:"other",locationText:{en:'Climbing/bouldering gyms in several districts. Search "bouldering gym Bangkok" on Google Maps.',ko:"いろいろなエリアにあるクライミング/ボルダリングジム。Googleマップで「bouldering gym Bangkok」を検索してください。"},transit:{en:"Depends on the gym; many are near a BTS/MRT station or easy by Grab. Check the route on Google Maps. (Confirm exit on Google Maps.)",ko:"ジムによって違います。BTS/MRTの近くが多く、そうでなければGrabが便利です。Googleマップでルートを確認してください。(出口はGoogleマップで確認してください。)"},indoor:"indoor",crowd:"both",energy:3,tags:["after-practice","team-bonding","rainy-day","adventurous"],tips:{en:"Wear stretchy clothes and bring a small towel; rental shoes are normally available. Tell staff you are a beginner for a quick briefing on falling safely. Be careful with your hands and wrists: players and coaches whose hands are their livelihood should pick easy routes, skip big jumps and stop when forearms get tired. Check your team's rules before doing anything with injury risk.",ko:"伸縮性のある服と小さなタオルを持っていきましょう。シューズはたいてい借りられます。初心者と伝えると、安全な落ち方を簡単に教えてもらえます。手や手首が大事な選手・スタッフは、簡単なルート中心にして大きなジャンプは避け、前腕が疲れたらすぐ休んでください。ケガのリスクがある活動は、事前にチームのルールを確認しましょう。"},mapsQuery:"bouldering gym Bangkok",imgQuery:"Indoor bouldering",imgAlt:"A climber on an indoor bouldering wall with colored holds",imgIllustrative:!0},{id:"active-badminton-courts",group:"active",title:{en:"Badminton Courts: Thailand's Everyday Sport",ko:"バドミントン場：タイの人たちの日常スポーツ"},desc:{en:"Badminton courts are everywhere in Bangkok: in sports centers, mall-adjacent clubs, condos and community halls. You rent a court by the hour and can usually rent rackets and buy shuttlecocks on site.",ko:"バンコクはどこでもバドミントンができます。スポーツセンター、ショッピングモール近くのクラブ、コンド、地域の体育館など、あちこちにあります。コートは時間単位で借りられ、ラケットのレンタルやシャトルの購入はたいてい現地でできます。"},special:{en:"Cheap, easy to organize, and everyone can join regardless of skill. Doubles matches are a good way to split a big group into fun teams.",ko:"安くて、集めやすくて、実力に関係なくみんなで楽しめます。ダブルスの対戦で大人数を楽しくチーム分けするのにもぴったりです。"},bestTime:["morning","evening"],timeText:{en:"Evening is the busiest time for locals; mornings are easiest to book. Check hours on Google Maps.",ko:"地元の人は夕方が一番多く、朝が一番予約しやすいです。営業時間はGoogleマップで確認してください。"},cost:{min:50,max:250},costNote:{en:"Estimate per person when splitting a court for 1 hour (courts roughly 150\u2013500 THB/hour depending on venue, air-conditioned ones cost more). Racket rental and shuttlecocks are small e
