xtras.",ko:"コートを1時間シェアした場合の1人あたりの目安です（コートは1時間およそ150〜500バーツで、エアコン付きは高めです）。ラケットのレンタルやシャトルは少額の追加です。"},duration:[1,2],area:"other",locationText:{en:'Badminton courts across Bangkok. Search "badminton court Bangkok" near your hotel on Google Maps.',ko:"バンコク各地のバドミントンコート。Googleマップでホテル近くを「badminton court Bangkok」で検索してください。"},transit:{en:"Depends on the venue. Pick one near a BTS/MRT station or use Grab. (Confirm exit on Google Maps.)",ko:"施設によって違います。BTS/MRTの近くを選ぶか、Grabを使ってください。（出口はGoogleマップで確認してください。）"},indoor:"both",crowd:"group",energy:3,tags:["after-practice","team-bonding","rainy-day"],weather:{en:"Some courts are open-sided and hot; air-conditioned halls are worth the extra baht. Wind affects shuttlecocks outdoors.",ko:"壁のない開放的なコートは暑く、エアコン付きのホールは追加料金を払う価値があります。屋外は風でシャトルが流されます。"},tips:{en:"Call or message to book the court (many venues use LINE; staff may only speak basic English, so a translation app helps). Wear indoor court shoes. Hands-and-wrists protection: warm up, and stop if your wrist or shoulder feels strained.",ko:"コートの予約は電話かメッセンジャーでしてください（LINEを使う施設が多く、スタッフの英語は基礎レベルのこともあるので、翻訳アプリがあると便利です）。室内用のコートシューズを履いてください。手首・肩は十分にほぐし、無理を感じたらすぐやめてください。"},mapsQuery:"badminton court Bangkok",imgQuery:"Badminton court",imgAlt:"An indoor badminton court with nets and players",imgIllustrative:!0},{id:"active-muay-thai-beginner",group:"active",title:{en:"Beginner Muay Thai Session (Fitness-Style)",ko:"ムエタイ体験クラス（フィットネススタイル）"},desc:{en:"Many Muay Thai gyms offer drop-in group classes for tourists: warm-up, shadowboxing, pad work and basic strikes, then conditioning. You learn the stance, jab, cross, kicks and knees on pads, with no need to spar.",ko:"旅行者向けのドロップイン団体クラスを開いているムエタイジムが多いです。ウォームアップ、シャドー、ミット打ち、基本の打撃、コンディショニングの順で進みます。スタンス、ジャブ、クロス、キック、ヒザ蹴りをミットで習い、スパーリングはしなくて大丈夫です。"},special:{en:'The most "Thailand" workout you can do, a great stress release, and a story to tell. Fitness-style classes are far more beginner-friendly than the intimidating ring scene suggests.',ko:"一番「タイらしい」運動で、ストレス発散に最高、話のネタにもなります。フィットネススタイルのクラスは、リングのイメージよりずっと初心者向けです。"},bestTime:["morning","afternoon","evening"],timeText:{en:"Group classes are often held morning and late afternoon/evening. Ask the gym for its schedule (usually 1\u20132 hours).",ko:"団体クラスは午前と遅めの午後〜夕方に行われることが多いです。ジムにスケジュールを聞いてください（通常1〜2時間）。"},cost:{min:500,max:1500},costNote:{en:"Estimate for a drop-in group class at a tourist-oriented gym (~500\u20131,500 THB). Private lessons cost more. Prices vary, so confirm directly with the gym before you go.",ko:"旅行者向けジムのドロップイン団体クラスの目安です（500〜1,500バーツ）。個人レッスンはもっと高くなります。料金は変わるので、行く前にジムに直接確認してください。"},duration:[1,2],area:"other",locationText:{en:'Muay Thai gyms across Bangkok. Search "Muay Thai beginner class Bangkok" on Google Maps and read recent reviews.',ko:"バンコク各地のムエタイジム。Googleマップで「Muay Thai beginner class Bangkok」を検索して、最近のレビューを読んでください。"},transit:{en:"Depends on the gym. Pick one with good recent reviews that is near a BTS/MRT station or takes a short Grab ride. (Confirm exit on Google Maps.)",ko:"ジムによって違います。最近のレビューが良く、BTS/MRTの近く、またはGrabで短時間で行ける所を選んでください。（出口はGoogleマップで確認してください。）"},indoor:"indoor",crowd:"both",energy:3,tags:["after-practice","team-bonding","adventurous"],tips:{en:'Book directly with the gym, not through street touts. People who approach you in tourist areas offering "cheap fight tickets" or "free training" often add commissions, so skip them. Tell the trainer you are a beginner and want no sparring. Bring water, a towel and shorts; gloves can usually be rented. If you rely on your hands and wrists professionally, ask your team before doing any contact training. Expect a lot of sweat and heat (some gyms have only fans).',ko:"路上の客引きではなく、ジムに直接予約してください。観光地で「安い試合チケット」や「無料体験」と声をかけてくる人は手数料を上乗せしていることが多いので避けましょう。トレーナーには初心者でスパーリングはしないと伝えてください。水、タオル、短パンを持っていきましょう（グローブは通常レンタル可）。手や手首が仕事の要なら、接触を伴うトレーニングの前にチームに相談してください。汗が大量に出ますし、扇風機しかないジムもあります。"},mapsQuery:"Muay Thai beginner class Bangkok",imgQuery:"Muay Thai training",imgAlt:"A beginner practicing Muay Thai kicks on pads at a gym",imgIllustrative:!0},{id:"active-chula-centenary-park-run",group:"active",title:{en:"Chulalongkorn Centenary Park: Easy Loop Run & Rain Garden",ko:"チュラロンコン100周年記念公園：気軽なランニング＆レインガーデン"},desc:{en:"A modern green park by Chulalongkorn University, designed to soak up floodwater, with walking and jogging loops, lawns and a small lake and a green roof. It is compact, easy to reach by train and nice for a short run or walk.",ko:"チュラロンコン大学の隣にある現代的な公園で、雨水をためるように設計されています。ウォーキング/ジョギングコース、芝生、小さな池、グリーンルーフがあります。コンパクトで電車で行きやすく、短いランや散歩にちょうどいいです。"},special:{en:"A cleaner, calmer alternative to the bigger parks, with a modern design and skyline views from the grass. Bigger green space Suan Luang Rama IX in the east is another option if you have a car or Grab.",ko:"大きな公園よりも整っていて静かな選択肢です。デザインがおしゃれで、芝生から都心のスカイラインが見えます。もっと広い緑地がよければ東のスアン・ルアン・ラマ9公園もありますが、Grabか車で行く必要があります。"},bestTime:["morning","evening"],timeText:{en:"Early morning or evening. Park hours can change, so check on Google Maps.",ko:"早朝か夕方がおすすめです。開園時間は変わることがあるので、Googleマップで確認してください。"},cost:{min:0,max:0},costNote:{en:"Free to enter. Water and snacks nearby are cheap.",ko:"入場無料です。近くの水やおやつは安いです。"},duration:[1,2],area:"other",locationText:{en:"Chulalongkorn Centenary Park, Pathum Wan (by Chulalongkorn University)",ko:"チュラロンコン100周年記念公園、パトゥムワン（チュラロンコン大学の隣）"},transit:{en:"MRT Sam Yan station is the closest, a short walk. (Confirm exit on Google Maps.)",ko:"MRTサムヤーン駅が一番近く、歩いてすぐです。（出口はGoogleマップで確認してください。）"},indoor:"outdoor",crowd:"both",energy:2,tags:["after-practice","relaxing","photo","hidden-gem"],weather:{en:"Shade is limited on the open lawn, so avoid midday. It is designed to hold rainwater, so lawns and paths can be wet after storms. Check air quality before running, especially from about December to March.",ko:"開けた芝生エリアは日陰が少ないので、日中は避けてください。雨水をためる設計のため、大雨のあとは芝生や道が濡れていることがあります。特に12〜3月ごろは、走る前に大気質を確認してください。"},tips:{en:"Bring your own water. Keep paths clear for runners and respect any posted rules. Pair it with a coffee or a meal in the university-area streets afterward.",ko:"水は自分で用意してください。道はランナーのために空けておき、掲示のルールを守りましょう。終わったあとは、大学街でコーヒーや食事をするのがおすすめです。"},geoQuery:"Chulalongkorn University Centenary Park, Bangkok",mapsQuery:"Chulalongkorn University Centenary Park Bangkok",imgQuery:"Chulalongkorn University Centenary Park",imgAlt:"Green lawns and a pond at Chulalongkorn University Centenary Park",imgIllustrative:!1},{id:"group-escape-rooms",group:"group",title:{en:"Escape Room Challenge",ko:"脱出ゲームチャレンジ"},desc:{en:"Escape-room venues in Bangkok offer themed rooms for 2–6 players with puzzles to solve in about an hour. Many are around the Siam and Sukhumvit areas and inside malls. Some rooms offer English game masters, and Japanese speakers are usually fine with English instructions.",ko:"バンコクには、2〜6人で1時間ほどパズルを解くテーマ型の脱出ゲーム店があります。サイアム、スクンビット周辺やショッピングモール内に多いです。英語で進行してくれる所もあるので、日本語話者でも英語の案内で十分楽しめます。"},special:{en:"Perfect for teams who like strategy and communication, and it is air-conditioned. Great as an evening activity because it needs no fitness at all.",ko:"戦略やコミュニケーションが好きなチームにぴったりです。エアコン付きで体力もまったく必要ないので、夜のアクティビティに最適です。"},bestTime:["afternoon","evening"],timeText:{en:"Rooms usually run in fixed time slots through the afternoon and evening. Book earlier for evenings and weekends.",ko:"たいてい午後〜夜に時間枠が決まっています。夜と週末は早めに予約してください。"},cost:{min:350,max:700},costNote:{en:"Estimate per person for a ~60-minute room (usually priced per person or per group; often cheaper per person with more players). Prices vary by room and venue.",ko:"約60分の部屋の1人あたりの目安です（1人あたりまたはグループあたりの料金で、人数が多いほど1人あたりは安くなることが多いです）。部屋や店によって違います。"},duration:[1,2],area:"siam",locationText:{en:"Escape-room venues around Siam, Sukhumvit and in malls. Search on Google Maps.",ko:"サイアム、スクンビット、ショッピングモール内の脱出ゲーム店。Googleマップで検索してください。"},transit:{en:"Siam venues are near BTS Siam / National Stadium. Always confirm the exact address on Google Maps. (Confirm exit on Google Maps.)",ko:"サイアムエリアの店はBTSサイアム/ナショナルスタジアム駅の近くです。正確な住所は必ずGoogleマップで確認してください。（出口はGoogleマップで確認してください。）"},indoor:"indoor",crowd:"group",energy:2,tags:["team-bonding","after-practice","rainy-day","late-night"],tips:{en:"Group booking is recommended: reserve the time slot ahead through the venue's own channel (check their page/LINE; do not pay via random links). Ask if the room is available in English and how scary or physical it is. Arrive 10\u201315 minutes early. Keep your phone in a locker if required.",ko:"団体予約がおすすめです。お店の公式チャンネル（ページ/LINE）で事前に予約してください。怪しいリンクから支払わないでください。英語で進行できるか、怖さや体力要素があるかを確認しましょう。10〜15分早く到着し、必要ならスマホはロッカーに入れてください。"},mapsQuery:"escape room Bangkok",imgQuery:"Escape room",imgAlt:"Friends solving puzzles in a themed escape room",imgIllustrative:!0},{id:"group-bowling-night",group:"group",title:{en:"Mall Bowling Night",ko:"ショッピングモールでボウリング一ゲーム"},desc:{en:"Several big Bangkok malls have bowling alleys, usually with arcade or karaoke next door. You rent a lane for a set number of games, rent shoes, and keep scores. It is easy, air-conditioned and works for any skill level.",ko:"バンコクの大型ショッピングモールの多くにボウリング場があり、隣にゲームセンターやカラオケがあることも多いです。レーンをゲーム数単位で借り、シューズもレンタルして、スコアを競います。手軽で涼しく、実力に関係なくみんなで楽しめます。"},special:{en:"Low effort, high laughter, ideal for a big group after a long day, and easy to combine with food in the mall.",ko:"力を使わずにたくさん笑えるので、疲れた一日のあとの大人数にぴったりです。モール内で食事につなげるのも簡単です。"},bestTime:["afternoon","evening","night"],timeText:{en:"Afternoon to evening; many mall venues run until late evening. Check closing times on Google Maps.",ko:"午後〜夜がおすすめで、モール内の施設は夜遅くまで営業している所が多いです。閉店時間はGoogleマップで確認してください。"},cost:{min:100,max:300},costNote:{en:"Estimate per person per game including shoe rental (~100\u2013300 THB). Weekend and peak evening prices can be higher; per-lane packages sometimes work out cheaper for groups.",ko:"シューズレンタル込みの1人1ゲームの目安です（100〜300バーツ）。週末やピーク時間は高くなることがあり、グループはレーンパッケージのほうが安くなる場合があります。"},duration:[1,2],area:"other",locationText:{en:'Bowling alleys inside major malls in Bangkok. Search "bowling Bangkok" on Google Maps.',ko:"バンコクの大型ショッピングモール内のボウリング場。Googleマップで「bowling Bangkok」を検索してください。"},transit:{en:"Mall-based, so usually connected to BTS/MRT. Confirm the exact mall and its station on Google Maps. (Confirm exit on Google Maps.)",ko:"モール内なので、たいていBTS/MRTと直結しています。モールと最寄り駅はGoogleマップで確認してください。（出口はGoogleマップで確認してください。）"},indoor:"indoor",crowd:"group",energy:2,tags:["team-bonding","after-practice","rainy-day"],tips:{en:"Group booking is recommended for 6+ people, especially on weekends. Bring clean socks (shoe rental usually requires them). Stay hydrated; the air-con and the games can make you forget.",ko:"6人以上なら団体予約がおすすめです。特に週末はそうです。シューズのレンタルには靴下が必要なので、きれいな靴下を持っていきましょう。エアコンのせいで気づきにくいので、水分補給も忘れずに。"},mapsQuery:"bowling alley Bangkok",imgQuery:"Bowling alley",imgAlt:"Bowling lanes with balls and pins in an indoor bowling alley",imgIllustrative:!0},{id:"group-karaoke-noraebang",group:"group",title:{en:"Private-Room Karaoke (Japanese-Style Karaoke Box)",ko:"プライベートルームカラオケ（日本のカラオケスタイル）"},desc:{en:"Bangkok has karaoke chains and private-room venues where you rent a room by the hour and pick songs from big English, Thai, J-pop, anime and K-pop libraries. Japanese-style karaoke spots are common around Phrom Phong and Thonglor (Sukhumvit Soi 33–55), and some malls also have regular karaoke boxes.",ko:"バンコクには、部屋を時間単位で借りて、英語・タイ語・J-POP・アニソン・K-POPなどの豊富な曲リストから選べるカラオケチェーンや個室があります。プロンポン・トンロー周辺（スクンビット ソイ33〜55）には日本式のカラオケ店が多く、ショッピングモール内にも普通のカラオケボックスがあります。"},special:{en:"The easiest way to get the whole squad laughing, with no skill needed. Japanese visitors will find the format very familiar.",ko:"実力がいらないので、チーム全員を笑顔にする一番簡単な方法です。日本の方にはおなじみの形式です。"},bestTime:["evening","night"],timeText:{en:"Evening to late night. Hours vary by venue, so check before going.",ko:"夜〜深夜がおすすめです。営業時間は店によって違うので、行く前に確認してください。"},cost:{min:150,max:500},costNote:{en:"Estimate per person for 1\u20132 hours when splitting a room (room prices vary by size and time, often with a drink or food minimum). Prices vary.",ko:"部屋をシェアした場合の1〜2時間の1人あたりの目安です（部屋の広さや時間帯で変わり、ドリンク/フードの最低注文がある場合もあります）。料金は変動します。"},duration:[1,3],area:"other",locationText:{en:"Karaoke rooms around Sukhumvit (including the Japanese-style spots around Phrom Phong and Thonglor) and malls. Search \"karaoke Bangkok\" on Google Maps.",ko:"スクンビット（プロンポン・トンロー周辺の日本式カラオケ含む）とショッピングモール内のカラオケ。Googleマップで「karaoke Bangkok」を検索してください。"},transit:{en:"Phrom Phong (BTS) and Thong Lo (BTS) are the easiest stations for karaoke spots on Sukhumvit. Confirm the exact venue on Google Maps. (Confirm exit on Google Maps.)",ko:"プロンポン駅（BTS）周辺やトンロー駅（BTS）周辺が便利です。正確な店はGoogleマップで確認してください。（出口はGoogleマップで確認してください。）"},indoor:"indoor",crowd:"group",energy:2,tags:["team-bonding","late-night","rainy-day","after-practice"],tips:{en:'Choose proper karaoke/box venues from reputable listings with clear room pricing. Avoid nightlife "KTV" lounges that use hostesses or have unclear bills, which can be pricey or unsafe. Confirm the price per hour and any minimum spend before you book. The legal drinking age in Thailand is 20; venues may ask for ID. Group booking is recommended in the evening.',ko:"評判が良く、部屋の料金がはっきりした正規のカラオケ店を選んでください。ホステスがいる「KTV」ラウンジや、会計が不透明な店は高額だったり危険だったりするので避けましょう。予約前に1時間あたりの料金と最低注文を確認してください。タイの飲酒可能年齢は20歳で、店で身分証を求められることがあります。夜は団体予約がおすすめです。"},mapsQuery:"karaoke Sukhumvit Soi 12 Bangkok",imgQuery:"Karaoke room",imgAlt:"Friends singing in a private karaoke room",imgIllustrative:!0},{id:"group-vr-experience",group:"group",title:{en:"VR Gaming & Immersive Experiences",ko:"VRゲーム＆没入型体験"},desc:{en:"VR arcades and immersive game rooms in Bangkok let you play co-op shooters, rhythm games or free-roam experiences in headsets. They are usually in malls or entertainment complexes, and booking a session slot is common.",ko:"バンコクのVRアーケードや没入型ゲームルームでは、協力型シューター、リズムゲーム、フリーローム体験をヘッドセットで楽しめます。たいていショッピングモールやエンタメ複合施設にあり、時間枠の予約が一般的です。"},special:{en:"Gamers will feel at home, and it gives you a way to play together in a totally different format. Co-op games are great for team coordination.",ko:"ゲーマーには居心地のいい場所で、いつもとまったく違う形で一緒に遊べます。協力ゲームはチームの連携作りにもぴったりです。"},bestTime:["afternoon","evening"],timeText:{en:"Afternoon to evening; session slots are often 30\u201360 minutes. Check venue hours.",ko:"午後〜夜がおすすめです。セッションは30〜60分単位が多いです。営業時間は確認してください。"},cost:{min:300,max:800},costNote:{en:"Estimate per person for a 30\u201360 minute session (~300\u2013800 THB). Free-roam or multi-player rooms can cost more.",ko:"30〜60分セッションの1人あたりの目安です（300〜800バーツ）。フリロームや多人数ルームは高くなることがあります。"},duration:[1,2],area:"other",locationText:{en:'VR arcades in malls and entertainment complexes. Search "VR arcade Bangkok" on Google Maps.',ko:"ショッピングモールやエンタメ複合施設のVRアーケード。Googleマップで「VR arcade Bangkok」を検索してください。"},transit:{en:"Mall-based venues are usually connected to BTS/MRT. Check the exact address on Google Maps. (Confirm exit on Google Maps.)",ko:"モール内の店はたいていBTS/MRTと直結しています。正確な住所はGoogleマップで確認してください。（出口はGoogleマップで確認してください。）"},indoor:"indoor",crowd:"group",energy:2,tags:["team-bonding","after-practice","rainy-day","adventurous"],tips:{en:"Group booking recommended so everyone plays in the same session. Take a break if you feel motion sickness, and drink water. Wear comfortable shoes and keep valuables in lockers. Check age and glasses rules for the headsets.",ko:"全員が同じセッションで遊べるよう、団体予約がおすすめです。酔いを感じたら休んで水を飲んでください。履きやすい靴を履き、貴重品はロッカーへ。ヘッドセットの年齢制限とメガネ着用のルールも確認してください。"},mapsQuery:"VR arcade Bangkok",imgQuery:"Virtual reality headset gaming",imgAlt:"A person wearing a virtual reality headset playing a game",imgIllustrative:!0},{id:"group-arcade-games",group:"group",title:{en:"Arcade Game Centers: Rhythm, Claw Machines & Fighting Games",ko:"ゲームセンター：音ゲー、クレーンゲーム、対戦格闘"},desc:{en:"Bangkok malls have large game centers with rhythm machines, racing seats, fighting games, shooting games, claw machines and photo booths. You buy a game card, load credits and share them across machines.",ko:"バンコクのショッピングモールには、音ゲー、レーシングシート、格闘ゲーム、シューティング、クレーンゲーム、プリクラ風フォトブースがある大きなゲームセンターがあります。ゲームカードを買ってクレジットをチャージし、複数の筐体で使い回します。"},special:{en:"Guaranteed fun for gamers: friendly competition, no booking needed, and easy to do for 30 minutes or 3 hours.",ko:"ゲーマーには間違いなく楽しい場所です。気軽な対戦、予約不要、30分でも3時間でも自由に遊べます。"},bestTime:["afternoon","evening"],timeText:{en:"Afternoon through the mall's closing time (often around 22:00; check).",ko:"午後からモールの閉店時間まで（たいてい22時ごろ、確認してください）。"},cost:{min:100,max:400},costNote:{en:"Estimate per person (~100\u2013400 THB): you load credits onto a card; each play is a few credits. Claw machines are addictive and can cost more than you plan.",ko:"1人あたりの目安です（100〜400バーツ）。カードにクレジットをチャージして、1プレイごとに数クレジットを使います。クレーンゲームは中毒性があるので、予想より使ってしまうかもしれません。"},duration:[1,3],area:"other",locationText:{en:'Game centers in major Bangkok malls. Search "arcade game center Bangkok" on Google Maps.',ko:"バンコクの大型ショッピングモールのゲームセンター。Googleマップで「arcade game center Bangkok」を検索してください。"},transit:{en:"Mall-based, usually connected to BTS/MRT. (Confirm exit on Google Maps.)",ko:"モール内なので、たいていBTS/MRTと直結しています。（出口はGoogleマップで確認してください。）"},indoor:"indoor",crowd:"both",energy:2,tags:["team-bonding","after-practice","rainy-day","late-night"],tips:{en:"Set a credit budget before you start and check whether unused credits can be refunded or kept on the card. Keep your phone and wallet safe in crowded mall areas. Peak times are weekend evenings.",ko:"始める前にクレジットの予算を決め、残ったクレジットが返金されるのか、カードに残るのかを確認してください。混雑したモールではスマホと財布に気をつけましょう。週末の夜が一番混みます。"},mapsQuery:"arcade game center Bangkok",imgQuery:"Video arcade",imgAlt:"Rows of colorful arcade machines in a game center",imgIllustrative:!0},{id:"group-board-game-cafe",group:"group",title:{en:"Board Game Caf\xE9 Afternoon",ko:"ボードゲームカフェでまったり午後"},desc:{en:"Board-game caf\xE9s let you pay a small per-person or per-hour table fee to play from a big library, with staff who explain the rules. They also serve drinks and snacks. You will find them in trendy neighborhoods like Ari and around Siam and university areas.",ko:"ボードゲームカフェは、1人または時間あたりの少額のテーブル代で、たくさんのゲームから選んで遊べ、スタッフがルールも説明してくれます。ドリンクやスナックもあります。アーリー、サイアム、大学街などのおしゃれなエリアに多いです。"},special:{en:"A relaxed way to bond without any physical effort. Games with English rules suit international groups, and card games work great with 4\u20138 people.",ko:"体力を使わずに気軽に仲良くなれます。英語ルールのゲームは多国籍グループにも合い、カードゲームは4〜8人にぴったりです。"},bestTime:["afternoon","evening"],timeText:{en:"Afternoon to evening. Opening hours vary, so check on Google Maps.",ko:"午後〜夜がおすすめです。営業時間は店によって違うので、Googleマップで確認してください。"},cost:{min:100,max:400},costNote:{en:"Estimate per person (~100\u2013400 THB) for a table/time fee plus a drink or snack. Some caf\xE9s have a minimum order per person.",ko:"テーブル/時間料金とドリンクやスナック込みの1人あたりの目安です（100〜400バーツ）。1人あたりの最低注文がある店もあります。"},duration:[2,4],area:"ari",locationText:{en:'Board-game caf\xE9s around Ari, Siam and university areas. Search "board game cafe Bangkok".',ko:"アーリー、サイアム、大学街周辺のボードゲームカフェ。「board game cafe Bangkok」で検索してください。"},transit:{en:"Ari-area caf\xE9s are near BTS Ari. Confirm the exact cafe on Google Maps. (Confirm exit on Google Maps.)",ko:"アーリーエリアのカフェはBTSアーリー駅の近くです。正確なカフェはGoogleマップで確認してください。（出口はGoogleマップで確認してください。）"},indoor:"indoor",crowd:"both",energy:1,tags:["team-bonding","after-practice","rainy-day","relaxing"],tips:{en:"Group booking is recommended for large teams (tables for 6+ fill up fast, especially on weekends). Ask staff to recommend a game for your group size and language level. Handle cards and pieces gently.",ko:"大人数のチームは団体予約がおすすめです（6人以上のテーブルは特に週末にすぐ埋まります）。人数と言語レベルに合ったゲームをスタッフに薦めてもらいましょう。カードやコマは丁寧に扱ってください。"},mapsQuery:"board game cafe Bangkok",imgQuery:"Board game cafe",imgAlt:"People playing a board game around a table at a cafe",imgIllustrative:!0},{id:"group-thai-cooking-class",group:"group",title:{en:"Thai Cooking Class (Market Tour + Hands-On)",ko:"タイ料理教室（市場ツアー＋実習）"},desc:{en:"Bangkok cooking schools run half-day classes where you learn 3\u20135 dishes (like pad thai, tom yum or green curry, plus a dessert) at your own station, often starting with a short market tour. You eat what you cook at the end.",ko:"バンコクの料理教室は半日クラスで、パッタイ、トムヤムクン、グリーンカレー、デザートなど3〜5品を自分の調理台で作ります。短い市場ツアーから始まる所も多く、最後に作った料理を食べます。"},special:{en:"A hands-on way to understand Thai flavors and bring back a skill, not just a souvenir. Perfect for team-building because you cook and eat together.",ko:"お土産ではなく「技術」を持ち帰れる体験です。一緒に作って一緒に食べるので、チームビルディングにぴったりです。"},bestTime:["morning","afternoon","evening"],timeText:{en:"Morning and afternoon classes are common; some offer evening sessions. Classes last roughly 3\u20134 hours.",ko:"午前と午後のクラスが一般的で、夜のクラスがある所もあります。所要時間はおよそ3〜4時間です。"},cost:{min:1e3,max:2200},costNote:{en:"Estimate per person (~1,000\u20132,200 THB), depending on school, number of dishes and whether it includes a market tour. Group rates may apply.",ko:"学校、品数、市場ツアーの有無によって1人あたり約1,000〜2,200バーツが目安です。団体料金がある場合もあります。"},duration:[3,4],area:"other",locationText:{en:'Cooking schools around Sathorn, Silom, Sukhumvit and Old Town. Search "Thai cooking class Bangkok".',ko:"サトーン、シーロム、スクンビット、オールドタウン周辺の料理教室。「Thai cooking class Bangkok」で検索してください。"},transit:{en:"Depends on the school; many are near BTS/MRT or provide pickup. Confirm in the booking message. (Confirm exit on Google Maps.)",ko:"学校によって違います。BTS/MRTの近くだったり、送迎がある所もあります。予約メッセージで確認してください。（出口はGoogleマップで確認してください。）"},indoor:"indoor",crowd:"group",energy:1,tags:["team-bonding","relaxing","rainy-day","date-night"],tips:{en:"Group booking is strongly recommended, ideally a few days ahead. Tell the school about allergies, pork/shellfish avoidance, vegetarian needs and your spice tolerance when booking. Wear closed shoes and light clothes since kitchens are hot. Only book through the school's own official channel or a well-known platform.",ko:"団体予約は必ずしてください。数日前だとなおよいです。予約時に、アレルギー、豚肉/甲殻類が苦手、ベジタリアン、辛さの好みを学校に伝えましょう。キッチンは暑いので、軽い服装でつま先の隠れる靴を履いてください。学校の公式チャンネルか有名な予約プラットフォームからだけ予約してください。"},mapsQuery:"Thai cooking class Bangkok",imgQuery:"Thai cooking class",imgAlt:"Students cooking at stoves in a Thai cooking class",imgIllustrative:!0},{id:"group-pottery-art-workshop",group:"group",title:{en:"Pottery & Art Workshops (Creative Studios)",ko:"陶芸＆アートワークショップ（クリエイティブスタジオ）"},desc:{en:"Small studios around Charoen Krung and trendy neighborhoods run beginner workshops: wheel-throwing or hand-building pottery, paint-your-own ceramics, candle making, sketching and more. You usually get all materials and a teacher in about 2\u20133 hours.",ko:"チャルンクルン周辺やおしゃれなエリアの小さなスタジオで、初心者向けワークショップが開かれています。ろくろ・手びねりの陶芸、絵付け、キャンドル作り、スケッチなどがあります。材料と先生込みで、たいてい2〜3時間です。"},special:{en:"A calm, creative break from screens, with a handmade keepsake. Great for relaxed bonding that is quiet and not physical.",ko:"画面から離れて落ち着いてものづくりができ、手作りの記念品も残ります。静かで体を動かさない癒やし系のチームビルディングにおすすめです。"},bestTime:["morning","afternoon","evening"],timeText:{en:"Fixed class times; book a slot in advance. Check schedules on the studio's own channels.",ko:"授業時間が決まっているので、事前に予約してください。スケジュールはスタジオの公式チャンネルで確認しましょう。"},cost:{min:600,max:1800},costNote:{en:"Estimate per person (~600\u20131,800 THB) depending on the craft and materials. Pottery that needs firing can add a fee and a few days' wait.",ko:"工芸の種類や材料によって1人あたり約600〜1,800バーツが目安です。焼成が必要な陶器は追加料金と数日の待ち時間がかかることがあります。"},duration:[2,3],area:"charoen-krung",locationText:{en:'Creative studios around Charoen Krung and other trendy areas. Search "pottery workshop Bangkok".',ko:"チャルンクルンなどおしゃれなエリアのスタジオ。「pottery workshop Bangkok」で検索してください。"},transit:{en:"Depends on the studio; Charoen Krung studios are reachable by river boat, MRT or Grab. Check the exact address. (Confirm exit on Google Maps.)",ko:"スタジオによって違います。チャルンクルン方面は水上ボート、MRT、Grabで行けます。正確な住所を確認してください。（出口はGoogleマップで確認してください。）"},indoor:"indoor",crowd:"both",energy:1,tags:["relaxing","team-bonding","rainy-day","date-night","hidden-gem"],tips:{en:"Group booking recommended (small studios have limited seats). Ask early about firing time: if your trip is short, choose a workshop where you take the piece with you the same day or can have it shipped. Wear clothes you do not mind getting messy.",ko:"小さなスタジオは席が少ないので、団体予約がおすすめです。滞在が短い場合は、焼成時間を早めに聞いて、当日持ち帰れるか配送できるワークショップを選んでください。汚れてもいい服を着ましょう。"},mapsQuery:"pottery workshop Bangkok",imgQuery:"Pottery workshop",imgAlt:"Hands shaping clay on a pottery wheel in a studio",imgIllustrative:!0},{id:"night-yaowarat-food-walk",group:"night",title:{en:"Yaowarat (Chinatown) Night Food Street Walk",ko:"ヤワラート（中華街）夜の屋台フードストリート散策"},desc:{en:"Yaowarat Road comes alive after dark with neon signs, smoky grills, seafood tables, mango sticky rice, roasted chestnuts and Chinese-Thai stalls squeezed side by side. It is one of Bangkok's most famous street-food scenes and one of the best for a group graze.",ko:"ヤワラート通りは日が暮れるとネオンサイン、煙の立つグリル、シーフードのテーブル、マンゴースティッキーライス、焼き栗、中華系タイ屋台がぎっしり並んで目を覚まします。バンコクで最も有名な屋台街のひとつで、グループでつまみ食いするのに最高です。"},special:{en:"A real night-time Bangkok moment: noisy, glowing, delicious. Perfect for sharing small plates and trying many things for little money.",ko:"本物のバンコクの夜です。にぎやかで、きらめいていて、おいしいです。少ないお金でいろいろ分け合って食べるのにぴったりです。"},bestTime:["evening","night"],timeText:{en:"From about 18:00 to late night. Stalls start setting up in the late afternoon; stall hours and days vary, so check.",ko:"18時ごろから深夜までです。屋台は夕方から準備を始め、店ごとに曜日/時間が違うので確認が必要です。"},cost:{min:300,max:800},costNote:{en:"Estimate per person for grazing several stalls (street dishes roughly 50\u2013200 THB each; seafood and sit-down places cost more). Always check prices before ordering, especially for seafood by weight.",ko:"何軒かの屋台をはしごした場合の1人あたりの目安です（屋台料理はたいてい1品50〜200バーツで、シーフードや座席のある店は高めです）。特にシーフードは重さ単価なので、注文前に必ず値段を確認してください。"},duration:[2,3],area:"yaowarat",locationText:{en:"Yaowarat Road, Samphanthawong (Bangkok's Chinatown)",ko:"ヤワラート通り、サムパンタウォン（バンコクの中華街）"},transit:{en:"MRT Wat Mangkon station is the closest on the Blue Line, a short walk; the river boat to Ratchawong Pier is another option. (Confirm exit on Google Maps.)",ko:"MRTブルーラインのワット・マンコン駅が一番近く、歩いてすぐです。水上ボートでラーチャウォン船着場に降りる方法もあります。（出口はGoogleマップで確認してください。）"},indoor:"outdoor",crowd:"group",energy:2,tags:["team-bonding","after-practice","late-night","photo","adventurous"],weather:{en:"Hot, crowded and loud even at night; carry water, wear breathable clothes and expect sudden rain, which can close open-air stalls. Pavements are narrow and crowded.",ko:"夜でも暑く、混雑していてうるさいです。水を持ち、通気性のいい服を着てください。スコールで屋外の屋台が閉まることもあります。歩道は狭く混んでいるので気をつけてください。"},tips:{en:"Go with a group to share dishes and try more. Ask for prices before ordering and check the bill. Keep wallet and phone in front pockets or a zipped bag because of pickpockets. Watch scooters in the narrow lanes. Vegetarians and people with allergies (shellfish, peanut, egg) should ask carefully, since sauces and broths are often shared. If you drink alcohol, the legal age is 20.",ko:"大人数で行って料理をシェアすると、より多く味わえます。注文前に値段を聞いて、会計を確認してください。スリがいるので、財布とスマホは前ポケットかファスナー付きのバッグに入れましょう。狭い路地ではスクーターに注意してください。ベジタリアンやアレルギー（甲殻類、ピーナッツ、卵）がある人は、ソースやスープを共用していることが多いので慎重に確認してください。お酒を飲む場合、法定年齢は20歳です。"},geoQuery:"Yaowarat Road, Bangkok",mapsQuery:"Yaowarat Road Bangkok street food",imgQuery:"Yaowarat Road night",imgAlt:"Neon signs and food stalls on Yaowarat Road at night",imgIllustrative:!1},{id:"night-banthat-thong-food-walk",group:"night",title:{en:"Banthat Thong Evening Street-Food Walk",ko:"バンタットトーン夜の屋台さんぽ"},desc:{en:"Banthat Thong Road is a student-and-local food street near Chulalongkorn University and the Siam area, with grills, noodle shops, stir-fry stalls, desserts and small restaurants. It is cheaper and less touristy than Yaowarat.",ko:"バンタットトーン通りは、チュラロンコン大学とサイアムの近くにある、学生と地元の人の食べ歩き通りです。グリル、麺屋、炒め物の屋台、デザート、小さな食堂があります。ヤワラートより安く、観光地っぽさも控えめです。"},special:{en:"Local food at local prices near central Bangkok, with a younger crowd vibe. A good option when you want street food without the tourist rush.",ko:"都心の近くで、地元の料理を地元価格で食べられ、若者の雰囲気があります。観光客の混雑なしで屋台グルメを楽しみたいときにおすすめです。"},bestTime:["evening","night"],timeText:{en:"Evening is busiest. Hours differ by shop and stall, so check before you go.",ko:"夜が一番混みます。店や屋台ごとに営業時間が違うので、行く前に確認してください。"},cost:{min:150,max:450},costNote:{en:"Estimate per person for a full evening of grazing (~150\u2013450 THB). Dishes are often 40\u2013120 THB each.",ko:"夜通し食べ歩いた場合の1人あたり約150〜450バーツが目安です。1皿はたいてい40〜120バーツです。"},duration:[1,2],area:"banthat-thong",locationText:{en:"Banthat Thong Road, Pathum Wan",ko:"バンタットトーン通り、パトゥムワン"},transit:{en:"Closest rail options are in the Siam / National Stadium / Sam Yan area; use Google Maps for the walking route, or take Grab. (Confirm exit on Google Maps.)",ko:"最寄りの駅はサイアム / ナショナルスタジアム / サムヤーン方面です。徒歩ルートはGoogleマップで確認するか、Grabに乗ってください。（出口はGoogleマップで確認してください。）"},indoor:"outdoor",crowd:"both",energy:1,tags:["after-practice","team-bonding","late-night","hidden-gem"],weather:{en:"Mostly open-air: hot and humid even in the evening, and rain can interrupt stalls. Bring water and a light layer for the air-con restaurants.",ko:"ほとんど屋外なので、夜でも暑くて蒸し、雨が降ると屋台が止まることがあります。水と、エアコンの効いた食堂用の薄手の羽織りがあると便利です。"},tips:{en:'Look for busy stalls with a quick turnover. Ask before ordering about spice level ("mai phet" means not spicy) and ingredients if you have allergies. Pavements are uneven and cluttered with scooters. Pay in cash with small bills.',ko:"お客さんが多く回転の速い屋台を選んでください。注文時に辛さ（「マイペット」＝辛くない）とアレルギーの材料を聞きましょう。歩道はでこぼこでスクーターも多いです。支払いは現金（小額紙幣）で。"},geoQuery:"Banthat Thong Road, Bangkok",mapsQuery:"Banthat Thong Road food street Bangkok",imgQuery:"Bangkok street food night",imgAlt:"Street-food stalls with grills and noodles at night in Bangkok",imgIllustrative:!0},{id:"night-iconsiam-riverside",group:"night",title:{en:"ICONSIAM & Riverside Evening",ko:"アイコンサイアム＆チャオプラヤー川沿いの夜"},desc:{en:"ICONSIAM is a huge riverside mall on the Thonburi bank with high-end shops, Sook Siam (an indoor Thai floating-market-style food hall), restaurants and river-view terraces. In the evening the waterfront glows and you can watch long-tail boats and cruise ships pass.",ko:"アイコンサイアムは、トンブリー側の川沿いにある巨大なショッピングモールです。ハイエンドのショップ、スック・サイアム（室内の水上マーケット風フードホール）、レストラン、リバービューのテラスがあります。夜は川辺がきらめき、ロングテールボートやクルーズ船が通るのを眺められます。"},special:{en:"Air-conditioned, easy and impressive, with Thai street-food stalls under one roof. A good rainy-evening backup that still feels very Bangkok.",ko:"エアコン完備で手軽、華やかです。タイの屋台料理が一つ屋根の下に集まっています。雨の夜の代替案でも、しっかりバンコクらしさが味わえます。"},bestTime:["evening","night"],timeText:{en:"Late afternoon to evening for the sunset and lights. Mall hours are usually until about 22:00, but check on Google Maps.",ko:"夕暮れと夜景を楽しむなら、夕方〜夜がおすすめです。モールの営業は通常22時ごろまでですが、Googleマップで確認してください。"},cost:{min:0,max:600},costNote:{en:"Entry is free. Estimate per person for a meal and drinks at Sook Siam or restaurants (~150\u2013600 THB). Shopping can obviously cost much more.",ko:"入場は無料です。スック・サイアムやレストランでの食事とドリンクは1人あたり約150〜600バーツが目安です。ショッピングはもっとかかることもあります。"},duration:[2,4],area:"riverside",locationText:{en:"ICONSIAM, Khlong San, on the Chao Phraya River",ko:"アイコンサイアム、クロンサーン、チャオプラヤー川沿い"},transit:{en:"BTS Gold Line Charoen Nakhon station connects to ICONSIAM; free shuttle boats have run from Sathorn Pier (BTS Saphan Taksin), but confirm the schedule on site or Google Maps. (Confirm exit on Google Maps.)",ko:"BTSゴールドラインのチャルン・ナコン駅がアイコンサイアムと直結しています。サトーン船着場（BTSサパーンタクシン駅）から無料シャトルボートが運航されてきましたが、時刻表は現地かGoogleマップで確認してください。（出口はGoogleマップで確認してください。）"},indoor:"both",crowd:"both",energy:1,tags:["team-bonding","date-night","photo","relaxing","rainy-day","late-night"],weather:{en:"Mostly indoors and cool; the riverside terraces are hot at midday but lovely in the evening. Rain does not ruin it.",ko:"ほとんど屋内で涼しいです。川沿いのテラスは日中は暑いですが、夕方は気持ちいいです。雨でも問題ありません。"},tips:{en:"Weekend evenings are very crowded; arrive earlier. Sook Siam is great for tasting several dishes cheaply. Boats and ferry timings vary, so confirm the last boat back before you leave. If you drink alcohol, the legal age is 20.",ko:"週末の夜はとても混むので、少し早めに行きましょう。スック・サイアムでは、いろいろな料理を安く味わえます。船の時間は変わることがあるので、帰りの最終便を必ず確認してください。お酒を飲む場合、法定年齢は20歳です。"},geoQuery:"ICONSIAM, Bangkok",mapsQuery:"ICONSIAM Bangkok",imgQuery:"ICONSIAM",imgAlt:"The ICONSIAM mall on the Chao Phraya River at night",imgIllustrative:!1},{id:"night-asiatique-riverfront",group:"night",title:{en:"Asiatique The Riverfront: Ferris Wheel & Waterfront Dinner",ko:"アジアティーク・ザ・リバーフロント：大観覧車＆川沿いディナー"},desc:{en:"Asiatique is an open-air riverside night market and entertainment complex built around old warehouses, with a giant Ferris wheel, shops, food courts, restaurants and live shows. A free shuttle boat is known to run from Sathorn Pier in the afternoon and evening.",ko:"アジアティークは、古い倉庫を改装した屋外の川沿いナイトマーケット兼エンタメ施設です。巨大な観覧車、ショッピング、フードコート、レストラン、ショーがあります。午後〜夜は、サトーン船着場から無料シャトルボートが出ていることで知られています。"},special:{en:"A touristy-but-fun evening with river breeze, Ferris-wheel skyline views and easy food for big groups.",ko:"観光地っぽいけど楽しい夜です。川風、観覧車から見るスカイライン、大人数でも食べやすい料理があります。"},bestTime:["evening","night"],timeText:{en:"From late afternoon to evening. Opening hours and shuttle times vary, so check before going.",ko:"夕方〜夜がおすすめです。営業時間とシャトルの時間は変わるので、行く前に確認してください。"},cost:{min:0,max:700},costNote:{en:"Entry is normally free. Ferris wheel and show tickets cost extra (estimate a few hundred THB), and a meal is roughly 200\u2013600 THB per person.",ko:"入場は通常無料です。観覧車とショーは別料金です（数百バーツが目安）。食事は1人あたり約200〜600バーツです。"},duration:[2,4],area:"other",locationText:{en:"Asiatique The Riverfront, Charoen Krung Rd, Bang Kho Laem",ko:"アジアティーク・ザ・リバーフロント、チャルンクルン通り、バンコーレーム"},transit:{en:"Free shuttle boat from Sathorn Pier (BTS Saphan Taksin) is commonly used; or Grab/taxi. Confirm the schedule and the last boat back. (Confirm exit on Google Maps.)",ko:"サトーン船着場（BTSサパーンタクシン駅）からの無料シャトルボートがよく使われています。ほかにGrab/タクシーも。運航時間と最終便を確認してください。（出口はGoogleマップで確認してください。）"},indoor:"outdoor",crowd:"both",energy:1,tags:["team-bonding","date-night","photo","relaxing","late-night"],weather:{en:"Open-air and humid even at night; rain can interrupt shows and the wheel. Pack a thin rain jacket in the wet season.",ko:"屋外なので夜でも蒸し暑いです。雨でショーや観覧車が中断することがあります。雨季は薄手のレインジャケットを持っていきましょう。"},tips:{en:"Weekend evenings get crowded. Keep valuables close in the crowd. Check the last shuttle boat or have a Grab plan back. Shop prices at tourist-oriented stalls are often higher, so compare. If you drink alcohol, the legal age is 20.",ko:"週末の夜は混みます。人混みでは貴重品をしっかり管理してください。シャトルボートの最終便を確認するか、帰りのGrabの計画を立てておきましょう。観光客向けの店は値段が高めなので、比較してください。お酒を飲む場合、法定年齢は20歳です。"},geoQuery:"Asiatique The Riverfront, Bangkok",mapsQuery:"Asiatique The Riverfront Bangkok",imgQuery:"Asiatique The Riverfront",imgAlt:"The Ferris wheel and riverside warehouses of Asiatique at night",imgIllustrative:!1},{id:"night-train-night-markets",group:"night",title:{en:"Train Night Market & Jodd Fairs-Style Night Markets",ko:"列車ナイトマーケット＆ジョッドフェアーズ系ナイトマーケット"},desc:{en:"Bangkok's big evening markets, such as the Talad Rot Fai (Train Night Market) in Srinakarin and Ratchada and the Jodd Fairs markets near Rama 9, mix street food, retro stalls, vintage and thrift finds, and live music. They are popular with young locals and visitors.",ko:"バンコクの大型ナイトマーケットには、シーナカリンとラチャダーのタラート・ロットファイ（列車ナイトマーケット）や、ラーマ9世付近のジョッドフェアーズなどがあります。屋台グルメ、レトロな屋台、ヴィンテージ/古着、ライブ音楽が混在しています。地元の若者や旅行者に人気です。"},special:{en:'A lively "eat, browse, repeat" evening for groups with cheap street food and photo-friendly retro stalls.',ko:"「食べて、見て、また食べる」にぎやかな夜です。安い屋台グルメと、写真映えするレトロな屋台があるので、グループにぴったりです。"},bestTime:["evening","night"],timeText:{en:"Markets usually open in the evening, often several days a week (commonly including the weekend) and may close on some days. Availability, location and opening days change, so check on Google Maps or the market's official page before going.",ko:"ナイトマーケットは通常夜に開き、週に数回（週末を含むことが多いです）だけ開く所もあります。休みの曜日がある場合もあります。開催曜日、場所、営業状況は変わるので、行く前にGoogleマップか公式ページで確認してください。"},cost:{min:200,max:600},costNote:{en:"Estimate per person for food and drinks (~200\u2013600 THB); shopping extra. Always bargain politely for non-food items.",ko:"飲食の1人あたり約200〜600バーツが目安で、ショッピングは別です。食べ物以外は、礼儀正しく値段交渉してみましょう。"},duration:[2,3],area:"other",locationText:{en:"Train Night Market (Srinakarin / Ratchada) and Jodd Fairs (Rama 9 area). Confirm which is open.",ko:"列車ナイトマーケット（シーナカリン / ラチャダー）とジョッドフェアーズ（ラーマ9世周辺）。どちらが開いているか確認してください。"},transit:{en:"Depends on the market. Rama 9 / Ratchada markets are linked to the MRT (check the nearest station on Google Maps), while Srinakarin is easiest by Grab. (Confirm exit on Google Maps.)",ko:"マーケットによって違います。ラーマ9世/ラチャダー方面はMRTとつながっています（最寄り駅はGoogleマップで確認）。シーナカリンはGrabが一番楽です。（出口はGoogleマップで確認してください。）"},indoor:"outdoor",crowd:"group",energy:2,tags:["team-bonding","after-practice","late-night","photo","adventurous"],weather:{en:"Mostly open-air and crowded; hot, and rain can empty the market or flood paths in the wet season. Wear comfortable shoes.",ko:"ほとんど屋外で混雑しています。暑く、雨季は雨で人が引いたり道が冠水したりすることがあります。歩きやすい靴を履いてください。"},tips:{en:'Check that the market is actually open that night; many only run on certain days. Carry small cash and keep valuables zipped. Do not buy from sellers pushing wildlife or gimmicky "antique" items. Alcohol: legal age is 20; carry ID.',ko:"その日に本当に開いているか必ず確認してください。曜日限定の所が多いです。小銭の現金を用意し、貴重品はファスナー付きのバッグに入れましょう。野生動物や怪しい「骨董品」を押し売りしてくる売り手からは買わないでください。お酒は法定年齢が20歳なので、身分証を持っていきましょう。"},mapsQuery:"night market Bangkok Talad Rot Fai Jodd Fairs",imgQuery:"Train Night Market Bangkok",imgAlt:"Crowded night market stalls under string lights in Bangkok",imgIllustrative:!0},{id:"night-mahanakhon-skywalk",group:"night",title:{en:"MahaNakhon SkyWalk: Bangkok From 300+ Metres",ko:"マハナコン・スカイウォーク：300m以上の高さから見るバンコク"},desc:{en:"MahaNakhon is the pixelated skyscraper in Sathorn. Its observation deck has indoor panoramic floors, a rooftop level with an outdoor area and a glass tray floor, with a 360-degree view across the city and the river. Going around sunset lets you see Bangkok turn from day to night.",ko:"マハナコンは、サトーンにあるピクセル模様の超高層ビルです。展望台には室内のパノラマフロア、屋外エリアのある屋上階、ガラス床のトレイがあり、街と川を360度見渡せます。日没ごろに行くと、バンコクが昼から夜に変わる様子が見られます。"},special:{en:"The classic Bangkok skyline moment and a great photo stop. It is a splurge but short and easy, so it fits a tight schedule.",ko:"バンコクのスカイラインの定番で、写真スポットです。お金はかかりますが短時間で気軽に行けるので、詰まったスケジュールにも合います。"},bestTime:["evening","night"],timeText:{en:"About 30\u201360 minutes before sunset to catch both day and night views. Opening times and ticket slots vary, so check.",ko:"日没の30〜60分前に行くと、昼と夜の景色の両方が見られます。営業時間とチケットの時間枠は変わるので確認してください。"},cost:{min:900,max:1500},costNote:{en:"Estimate per person for a ticket (~900\u20131,500 THB); sunset slots and combined tickets can cost more, and prices change. Booking in advance is recommended.",ko:"チケット1人あたり約900〜1,500バーツが目安です。日没の時間枠やセットチケットは高くなることがあり、料金は変わります。事前予約がおすすめです。"},duration:[1,2],area:"other",locationText:{en:"MahaNakhon Tower, Silom / Sathorn",ko:"マハナコンタワー、シーロム / サトーン"},transit:{en:"BTS Chong Nonsi station is linked to the tower by a walkway. (Confirm exit on Google Maps.)",ko:"BTSチョンノンシー駅からタワーまで連絡通路があります。（出口はGoogleマップで確認してください。）"},indoor:"both",crowd:"both",energy:1,tags:["photo","date-night","team-bonding","late-night"],weather:{en:"Views depend on haze and clouds; check the forecast and AQI for clarity. If it rains the outdoor rooftop part may close for safety, so confirm.",ko:"景色はもやや雲によって変わります。天気とAQI（大気質指数）を確認してください。雨が降ると安全のため屋外の屋上部分が閉まることがあるので確認してください。"},tips:{en:"Book ahead for sunset. Follow staff instructions on the glass-floor sections and bring a phone strap. Bags and tripods may have to be stored. Wear shoes that suit the rules. Keep the schedule tight: you can be done in about an hour.",ko:"日没の時間帯は事前に予約してください。ガラス床エリアではスタッフの指示に従い、スマホのストラップを用意しましょう。バッグや三脚は預ける必要があるかもしれません。ルールに合った靴を履いてください。スケジュールが詰まっていても、1時間ほどで済ませられます。"},geoQuery:"MahaNakhon, Bangkok",mapsQuery:"MahaNakhon SkyWalk Bangkok",imgQuery:"MahaNakhon SkyWalk",imgAlt:"The MahaNakhon tower and its rooftop observation deck in Bangkok",imgIllustrative:!1},{id:"night-rooftop-bar-view",group:"night",title:{en:"Rooftop Viewpoint Evening (Sky Bars, Mocktails Welcome)",ko:"ルーフトップ夜景ディナー（スカイバー、ノンアルコールもOK）"},desc:{en:"Bangkok has famous high-rise rooftop bars with open-air terraces over the river and the skyline, such as the long-established Sky Bar at lebua State Tower in Sathorn. You go for the view, sit with a drink and stay as long as you like, usually with a dress code.",ko:"バンコクには、川とスカイラインを見下ろす屋外テラスのある有名な高層ルーフトップバーがたくさんあります。サトーンのルブア・ステートタワーのスカイバーは昔からの代表格です。夜景を見に行き、ドリンクを1杯頼んで好きなだけ過ごすスタイルで、たいていドレスコードがあります。"},special:{en:"A glamorous, memorable night view you can enjoy even with a non-alcoholic drink. Great for a special evening out or a team celebration.",ko:"ノンアルコールドリンクでも楽しめる、華やかで思い出に残る夜景です。特別な夜やチームのお祝いにぴったりです。"},bestTime:["evening","night"],timeText:{en:"Around sunset to late evening. Opening hours, queues, and reservation rules vary, so check the venue's own page.",ko:"日没から夜遅くまでです。営業時間、待ち時間、予約ルールは変わるので、お店の公式ページで確認してください。"},cost:{min:500,max:1500},costNote:{en:"Estimate per person (~500\u20131,500 THB) for one or two drinks; cocktails at famous rooftops are expensive and some venues have minimum spends. A mocktail or soft drink is cheaper.",ko:"ドリンク1〜2杯の1人あたり約500〜1,500バーツが目安です。有名ルーフトップのカクテルは高く、最低注文がある店もあります。ノンアルコールドリンクやソフトドリンクのほうが安いです。"},duration:[1,2],area:"other",locationText:{en:"Rooftop bars around Sathorn / Silom / Sukhumvit, e.g. Sky Bar at lebua State Tower",ko:"サトーン / シーロム / スクンビット周辺のルーフトップバー（例：ルブア・ステートタワーのスカイバー）"},transit:{en:"Sky Bar at lebua is a short walk from BTS Saphan Taksin. Other rooftops vary, so use Google Maps. (Confirm exit on Google Maps.)",ko:"ルブアのスカイバーは、BTSサパーンタクシン駅から歩いてすぐです。ほかのルーフトップは場所がそれぞれ違うので、Googleマップを使ってください。（出口はGoogleマップで確認してください。）"},indoor:"both",crowd:"both",energy:1,tags:["date-night","photo","team-bonding","late-night","relaxing"],weather:{en:"Open-air terraces can close during rain or strong wind, and the view needs clear weather. Check the forecast and the venue's rain policy.",ko:"雨や強風のときは屋外テラスが閉まることがあり、景色は晴れていないとよく見えません。天気と、雨天時の営業方針を確認してください。"},tips:{en:"Legal drinking age in Thailand is 20: bring your passport or a photo ID, as staff may check, and order a mocktail if you are under 20 or do not drink. Alcohol sales can be restricted on certain holidays and days, so check. Many rooftops enforce a dress code (usually smart casual: closed shoes, no sports shorts or flip-flops). Reserve a table where possible, and do not leave drinks unattended.",ko:"タイの飲酒可能年齢は20歳です。スタッフが確認することがあるので、パスポートか写真付き身分証を持っていき、20歳未満やお酒を飲まない人はノンアルコールドリンクを頼んでください。特定の祝日や曜日は酒類の販売が制限されることがあるので確認しましょう。多くのルーフトップにはドレスコードがあります（たいていスマートカジュアル：つま先の隠れる靴、スポーツ用の短パンやサンダルは不可）。できればテーブルを予約し、飲み物は置いたまま席を離れないでください。"},geoQuery:"Sky Bar at lebua State Tower, Bangkok",mapsQuery:"Sky Bar lebua State Tower Bangkok",imgQuery:"Sky Bar Bangkok lebua",imgAlt:"A rooftop bar terrace overlooking the Bangkok skyline at night",imgIllustrative:!1},{id:"night-late-night-dessert-hunt",group:"night",title:{en:"Late-Night Dessert Hunt (Honey Toast, Kakigōri, Thai Sweets)",ko:"夜食スイーツ探し（ハニートースト、かき氷、タイのスイーツ）"},desc:{en:"After dinner, Bangkok keeps serving sweets: Thai-style shaved ice and kakigōri-style desserts, honey toast, mango sticky rice stalls, warm Chinese desserts like sesame soup, and dessert cafés open late. Dessert chains such as After You, with branches in malls and trendy neighborhoods, are a safe starting point.",ko:"夕食のあとも、バンコクは甘い誘惑が続きます。タイ風かき氷、ハニートースト、マンゴースティッキーライスの屋台、ごま汁粉のような温かい中華風デザート、遅くまで開いているスイーツカフェなどがあります。ショッピングモールやおしゃれなエリアに店舗があるデザートチェーンのアフター・ユー（After You）は、安心のスタート地点です。"},special:{en:"Cheap, fun, shareable, and a nice cool-down after practice or dinner. Japanese visitors will love the shaved ice and honey toast, with some Thai twists like mango or Thai tea.",ko:"安くて楽しくてシェアしやすく、練習や食事のあとにクールダウンするのにもぴったりです。日本の方はかき氷とハニートーストが好きだと思いますが、マンゴーやタイティーなどのタイ風アレンジもあります。"},bestTime:["evening","night"],timeText:{en:"After dinner until late. Closing times vary a lot by branch and stall, so check on Google Maps.",ko:"夕食後から遅くまでです。閉店時間は店舗や屋台によって大きく違うので、Googleマップで確認してください。"},cost:{min:60,max:250},costNote:{en:"Estimate per person (~60\u2013250 THB): street sweets are cheap; caf\xE9 desserts and shared bingsu cost more.",ko:"1人あたり約60〜250バーツが目安です。屋台スイーツは安く、カフェのデザートやシェアするかき氷は高めです。"},duration:[1,2],area:"thonglor",locationText:{en:'Dessert caf\xE9s and stalls around Thonglor, Siam malls and Yaowarat. Search "After You dessert cafe Bangkok" or "dessert Bangkok".',ko:"トンロー、サイアムのショッピングモール、ヤワラート周辺のスイーツカフェと屋台。「After You dessert cafe Bangkok」か「dessert Bangkok」で検索してください。"},transit:{en:"Thonglor branches are near BTS Thong Lo; mall branches connect to BTS/MRT. Confirm each branch on Google Maps. (Confirm exit on Google Maps.)",ko:"トンロー店はBTSトンロー駅の近くで、モール内の店舗はBTS/MRTと直結しています。各店舗はGoogleマップで確認してください。（出口はGoogleマップで確認してください。）"},indoor:"both",crowd:"both",energy:1,tags:["after-practice","late-night","team-bonding","relaxing","date-night"],weather:{en:"Street sweets are outdoors, so heat and rain apply; caf\xE9s are air-conditioned.",ko:"屋台スイーツは屋外なので暑さや雨の影響を受けますが、カフェはエアコンがあります。"},tips:{en:"Desserts are often shareable: order one per two people. Check for peanut, dairy and egg if you have allergies. Mango sticky rice depends on mango season, so quality varies. Do not eat uncovered street ice and sweets if you have a sensitive stomach and a big schedule ahead.",ko:"デザートはシェアしやすいです。2人で1つの注文がおすすめです。アレルギーがある場合は、ピーナッツ、乳製品、卵を確認してください。マンゴースティッキーライスはマンゴーの旬によって品質が変わります。お腹が敏感で大事な予定が控えているなら、覆いのない屋台の氷系スイーツは避けましょう。"},mapsQuery:"After You dessert cafe Bangkok",imgQuery:"Mango sticky rice",imgAlt:"A plate of mango sticky rice, a popular Thai dessert",imgIllustrative:!0},{id:"night-guided-evening-bike-tour",group:"night",title:{en:"Guided Evening Bike Tour (Small Group, Quiet Routes)",ko:"ガイド付き夜のサイクリングツアー（少人数、静かなルート）"},desc:{en:"Several local operators run evening group bike rides in Bangkok on quieter back lanes and riverside routes, often including a stop for food or a viewpoint. The tour provides bikes, helmets, lights and a guide who handles traffic, so you can focus on the ride.",ko:"バンコクのいくつかの地元の会社が、静かな路地や川沿いのコースで夜のグループサイクリングを運営しています。食事や展望スポットに立ち寄ることが多いです。自転車、ヘルメット、ライト、交通を担当するガイドが付くので、走ることに集中できます。"},special:{en:"The safest way to cycle at night in Bangkok: no navigating traffic alone, cooler air, and lots of hidden alleys that you would miss in a car.",ko:"バンコクで夜に自転車に乗る一番安全な方法です。ひとりで交通をさばく必要がなく、空気も涼しく、車では見逃す路地もたくさん見られます。"},bestTime:["evening","night"],timeText:{en:"Tours typically start late afternoon or evening and last about 3\u20134 hours. Schedules vary by operator.",ko:"ツアーはたいてい夕方〜夜に始まり、約3〜4時間かかります。スケジュールは会社によって違います。"},cost:{min:900,max:1800},costNote:{en:"Estimate per person (~900\u20131,800 THB), depending on whether food, drinks or a boat crossing are included. Check the inclusions before booking.",ko:"食事、ドリンク、ボート利用が含まれるかどうかで、1人あたり約900〜1,800バーツが目安です。予約前に含まれる内容を確認してください。"},duration:[3,4],area:"other",locationText:{en:'Meeting points vary by tour (often Old Town / riverside areas). Search "Bangkok evening bike tour".',ko:"集合場所はツアーによって違います（オールドタウン/川沿いが多いです）。「Bangkok evening bike tour」で検索してください。"},transit:{en:"Depends on the tour's meeting point; the operator will give directions. Use Google Maps to confirm the nearest BTS/MRT/pier. (Confirm exit on Google Maps.)",ko:"ツアーの集合場所によって違います。会社が案内してくれます。Googleマップで最寄りのBTS/MRT/船着場を確認してください。（出口はGoogleマップで確認してください。）"},indoor:"outdoor",crowd:"group",energy:2,tags:["team-bonding","adventurous","photo","late-night","hidden-gem"],weather:{en:"Humid and warm even in the evening; rain can cancel or shorten tours. Wear breathable clothes and closed shoes, and bring a light rain jacket in the wet season.",ko:"夜でも暑くて蒸します。雨でツアーが中止や短縮になることがあります。通気性のいい服とつま先の隠れる靴を着用し、雨季は薄手のレインジャケットを持っていきましょう。"},tips:{en:"Group booking recommended: ask for a private group tour for a big team. Choose an operator with recent good reviews, small groups, lights and helmets, and a clear cancellation policy. Tell the guide about your riding level. Only book through the operator's official channel or a well-known booking platform, and confirm the price. Stay hydrated and follow your guide in traffic.",ko:"団体予約がおすすめです。大きなチームならプライベートグループツアーをリクエストしてください。最近の口コミが良く、少人数で、ライトとヘルメットがあり、キャンセル規定が明確な会社を選びましょう。自転車の経験レベルをガイドに伝えてください。会社の公式チャンネルか有名な予約プラットフォームからだけ予約し、料金を確認してください。水分補給をして、交通の多い区間ではガイドに従ってください。"},mapsQuery:"Bangkok evening bike tour",imgQuery:"Bangkok bicycle tour",imgAlt:"A group of cyclists on a guided bicycle tour in Bangkok",imgIllustrative:!0},{id:"night-photo-walk-talat-noi",group:"night",title:{en:"Night Photo Walk: Talat Noi, Song Wat & Yaowarat Neon",ko:"夜の撮影さんぽ：タラートノーイ、ソンワット、ヤワラートのネオン"},desc:{en:"Talat Noi and Song Wat are old riverside lanes with Chinese shrines, rusty auto-parts shops, street art and quiet alleys, a few minutes from the neon of Yaowarat. After dark, shrines glow red and the river edge is calm, which makes it a great area for atmospheric night photos.",ko:"タラートノーイとソンワットは、中国の祠、錆びた自動車部品店、ストリートアート、静かな路地がある古い川沿いの街で、ヤワラートのネオン街から数分の距離です。夜になると祠が赤く輝き、川辺は静まり返るので、雰囲気のある夜景写真を撮るのにぴったりのエリアです。"},special:{en:"Unique textures and light, and you can combine it with Yaowarat's food street. Phones with night mode do well; no fancy gear needed.",ko:"独特の質感と光があり、ヤワラートの食べ歩きと組み合わせやすいです。ナイトモード付きのスマホで十分で、特別な機材はいりません。"},bestTime:["evening","night"],timeText:{en:"Go at dusk (blue hour, about 17:45\u201319:00) then continue until about 21:00. Alleys get very quiet later at night.",ko:"夕暮れ（ブルーアワー、17:45〜19:00ごろ）に行って、21時ごろまで楽しんでください。夜遅くなると路地はとても静かになります。"},cost:{min:0,max:300},costNote:{en:"Free to walk; add a little for snacks, a drink or a boat ride. Estimate only.",ko:"歩くのは無料です。おやつ、ドリンク、ボート代を少し足してください。あくまで目安です。"},duration:[1,3],area:"talat-noi",locationText:{en:"Talat Noi and Song Wat Road, Samphanthawong, near Yaowarat",ko:"タラートノーイとソンワット通り、サムパンタウォン、ヤワラート付近"},transit:{en:"River boat to Ratchawong Pier, or MRT Wat Mangkon then walk (about 15\u201320 minutes). Confirm the route on Google Maps. (Confirm exit on Google Maps.)",ko:"水上ボートでラーチャウォン船着場に降りるか、MRTワット・マンコン駅から歩きます（約15〜20分）。ルートはGoogleマップで確認してください。（出口はGoogleマップで確認してください。）"},indoor:"outdoor",crowd:"both",energy:1,tags:["photo","hidden-gem","date-night","late-night","adventurous"],weather:{en:"Humid and warm in the evening; narrow lanes with little shade or lighting, and wet pavements after rain. Rain also makes great reflections, but protect your camera.",ko:"夜でも暑くて蒸します。狭い路地は日陰や照明が少なく、雨のあとは路面が滑りやすいです。雨のあとは反射がきれいですが、カメラは守ってください。"},tips:{en:"Stay in busier lanes after about 21:00 and go in a group; some alleys are dim and uneven. Watch for scooters and motorbikes in narrow lanes. Be respectful at shrines and homes: ask before photographing people, avoid flash near worshippers and do not block entrances. Keep camera straps secure to avoid snatching.",ko:"21時以降は人通りの多い道を選び、グループで行動してください。暗くてでこぼこの路地もあります。狭い路地ではバイクに注意しましょう。祠や住宅地ではマナーを守ってください。人を撮る前に許可を取り、参拝者の近くではフラッシュを使わず、入口をふさがないでください。ひったくり防止のため、カメラのストラップはしっかり固定しましょう。"},geoQuery:"Talat Noi, Bangkok",mapsQuery:"Talat Noi Bangkok",imgQuery:"Talat Noi Bangkok",imgAlt:"A narrow alley with a Chinese shrine and street art in Talat Noi, Bangkok",imgIllustrative:!1}]});var W,zo=S(()=>{W=[{id:"gem-loha-prasat",group:"hidden",title:{en:'Loha Prasat at Wat Ratchanatdaram \u2014 the "metal castle"',ko:"ローハ・プラサート（ワット・ラーチャナッダーラーム）— 金属の城の寺院"},desc:{en:"A rare temple tower topped with 37 metal spires, rising in tiers from a stepped base in Bangkok's Old Town. You can walk up the inner spiral to the upper levels for a view over the rooftops and the nearby Golden Mount. It sits quietly beside the Phra Nakhon temple belt and is far less crowded than the Grand Palace.",ko:"37本の金属の尖塔が段々に立ち上がる、珍しい寺院の塔です。内側のらせん階段で上の階まで上がると、オールドタウンの屋根や近くのゴールデンマウントが見渡せます。王宮よりずっと空いているので、静かに見て回れます。"},special:{en:"Loha Prasat is one of only a few of its kind in the world, yet most visitors skip it. The dark metal-and-white look is nothing like the usual gold temples.",ko:"この形式の建築は世界でもほんの少ししかないのに、ほとんどの観光客は素通りしてしまいます。金色のお寺とはまったく違う、暗いメタルの色合いなので、写真映えもします。"},bestTime:["morning","afternoon"],timeText:{en:"Morning or late afternoon is cooler; check Google Maps for current opening hours",ko:"朝か夕方のほうが涼しいです。営業時間はGoogleマップで必ず確認してください"},cost:{min:0,max:50},costNote:{en:"Small entry fee may apply for the tower (estimate). Check on arrival.",ko:"塔の入場料が少額かかる場合があります（目安）。到着してから確認してください。"},duration:[.5,1],area:"other",locationText:{en:"Wat Ratchanatdaram, Maha Chai Road, Old Town (Phra Nakhon)",ko:"オールドタウン（プラナコーン）のマハーチャイ通り、ワット・ラーチャナッダーラーム"},transit:{en:"No direct BTS. MRT Sam Yot is the nearest rail option, then a walk or short Grab. (Confirm station and exit on Google Maps.)",ko:"BTSの直通はありません。MRTサームヨート駅が一番近く、そこから歩くか短くGrabに乗ってください。（駅・出口はGoogleマップで確認してください。）"},indoor:"both",crowd:"both",energy:1,tags:["hidden-gem","photo","relaxing","after-practice"],weather:{en:"The stair climb is partly outdoors and hot at midday. Bring water and avoid noon sun.",ko:"階段の一部が屋外なので、日中はかなり暑いです。水を持って、正午の日差しは避けましょう。"},tips:{en:"Temple dress code: cover shoulders and knees; no shorts or sleeveless tops. Take off shoes where indicated. Keep voices low and do not point feet at Buddha images. Good low-effort stop after a busy day; combine it with the Giant Swing and Ban Bat nearby.",ko:"寺院の服装規定：肩と膝を隠してください（短パン・ノースリーブは不可）。表示のある場所では靴を脱いでください。静かにして、足先を仏像に向けないでください。忙しい日程のあとに気軽に立ち寄れ、近くのジャイアント・スイングやバーン・バートと組み合わせるのがおすすめです。"},geoQuery:"Wat Ratchanatdaram, Bangkok",mapsQuery:"Loha Prasat Wat Ratchanatdaram Bangkok",imgQuery:"Loha Prasat Wat Ratchanatdaram",imgAlt:"Tiered Loha Prasat tower with many metal spires at Wat Ratchanatdaram",imgIllustrative:!1},{id:"gem-giant-swing-wat-suthat",group:"hidden",title:{en:"Giant Swing & Wat Suthat at golden hour",ko:"ジャイアント・スイング＆ワット・スタット — 夕暮れさんぽ"},desc:{en:"The towering red teak Giant Swing (Sao Ching Cha) stands in front of Wat Suthat, a royal temple with a huge Buddha hall and some of Bangkok's finest old murals. The area around the swing is a calm, almost village-like patch of Old Town with Brahmin shrines and old shophouses.",ko:"ワット・スタットの前にそびえる、赤いチーク材の大ブランコ（サオ・チンチャー）です。境内の本堂には大きな仏像と古い壁画があり、ブランコの周辺にはバラモン教の祠や古い商店建築が残っていて、村のような雰囲気です。"},special:{en:"Most tourists pass it in a tuk-tuk. Walking around it at dusk, when the light turns warm and traffic thins, is a quiet local-feeling moment in the middle of the Old Town.",ko:"ほとんどの人はトゥクトゥクで通り過ぎるだけです。夕暮れにゆっくり歩くと、光が暖かくなり車も減って、オールドタウンの真ん中で静かな地元気分を味わえます。"},bestTime:["morning","evening"],timeText:{en:"Early morning or 16:30\u201318:00 for soft light (check temple hours on Google Maps)",ko:"早朝か16:30〜18:00ごろが、柔らかい光でおすすめです（寺院の営業時間はGoogleマップで確認）"},cost:{min:0,max:100},costNote:{en:"The Giant Swing area is free; entering Wat Suthat usually has a small fee (estimate).",ko:"ブランコ(サオチンチャー)周辺は無料で、ワット・スタットの中に入るには少額の入場料がかかるのが普通です(推定)。"},duration:[1,1.5],area:"other",locationText:{en:"Sao Ching Cha / Wat Suthat, Old Town",ko:"オールドタウン、サオチンチャー・ワット・スタット一帯"},transit:{en:"MRT Sam Yot is the closest rail option, then walk or short Grab. (Confirm exit on Google Maps.)",ko:"MRTサムヨート駅がいちばん近いです。そこから歩くか、短い距離をGrabで行きましょう。(出口はGoogleマップで確認してください。)"},indoor:"outdoor",crowd:"both",energy:1,tags:["hidden-gem","photo","relaxing","date-night"],weather:{en:"Little shade around the swing; very hot at midday. Evening is much more comfortable.",ko:"ブランコ周辺は日陰が少なく、日中はとても暑いです。夕方のほうがずっと過ごしやすいです。"},tips:{en:"Temple dress code: shoulders and knees covered; remove shoes inside halls. Not a heavy-walking route, so it suits a rest day. Pair it with Loha Prasat and Ban Bat on the same loop.",ko:"寺院の服装:肩と膝を隠す、本堂の中では靴を脱ぐ。あまり歩かないので休息日にぴったりです。ローハープラサート、バーン・バートと一緒に1コースでまわるのがおすすめです。"},geoQuery:"Giant Swing, Bangkok",mapsQuery:"Giant Swing Wat Suthat Bangkok",imgQuery:"Giant Swing Bangkok",imgAlt:"The red Giant Swing in front of Wat Suthat Bangkok",imgIllustrative:!1},{id:"gem-wat-ratchabophit",group:"hidden",title:{en:"Wat Ratchabophit \u2014 Thai temple with a European-style twist",ko:"ワット・ラーチャボピット — ヨーロッパ風が混ざったタイの寺院"},desc:{en:"A 19th-century royal temple that mixes Thai roofs with European-influenced details and a circular cloister around the central chedi. The inner courtyard is tiled in colorful patterns and feels intimate compared with its famous neighbors.",ko:"19世紀の王室寺院で、タイ式の屋根にヨーロッパ風のディテールが混ざった珍しい建築です。中央の仏塔を丸く囲む回廊があり、中庭はカラフルなタイルで飾られていて、有名な近隣の寺院よりこぢんまりと静かです。"},special:{en:"Architecture fans get something no gold-roofed postcard temple offers: Thai and European styles blended together in a calm, uncrowded setting.",ko:"絵はがきに載る金色の寺院とは違い、タイ式とヨーロッパ式が混ざった建築を、静かにゆっくり見られます。"},bestTime:["morning","afternoon"],timeText:{en:"Morning or late afternoon; check Google Maps for current hours",ko:"午前か夕方がおすすめ。営業時間はGoogleマップで確認"},cost:{min:0,max:50},costNote:{en:"Free or a very small donation/fee (estimate).",ko:"無料か、ごく少額の寄付・入場料程度です(推定)。"},duration:[.5,1],area:"other",locationText:{en:"Wat Ratchabophit, near Wat Pho and Pak Khlong Talat (Old Town)",ko:"ワット・ポーとパーククローンタラート近くのオールドタウン、ワット・ラーチャボピット"},transit:{en:"Walkable from MRT Sanam Chai (about 15 min, confirm on Google Maps) or by Grab; river boat to Tha Tien then a short ride also works.",ko:"MRTサナームチャイ駅から徒歩15分ほどで行けます(Googleマップで確認)。Grabも便利で、ター・ティアン船着場から行ってもOKです。"},indoor:"both",crowd:"both",energy:1,tags:["hidden-gem","photo","relaxing","after-practice"],weather:{en:"Open courtyard with little shade; avoid midday heat.",ko:"中庭は開けていて日陰が少ないです。日中の暑い時間は避けましょう。"},tips:{en:"Dress code: shoulders and knees covered. Remove shoes in prayer halls. A nice add-on with Pak Khlong Talat and Wat Pho.",ko:"服装ルール:肩と膝を隠す、礼拝堂では靴を脱ぐ。パーククローンタラートやワット・ポーと一緒にまわるのにぴったりです。"},geoQuery:"Wat Ratchabophit, Bangkok",mapsQuery:"Wat Ratchabophit Bangkok",imgQuery:"Wat Ratchabophit",imgAlt:"Circular cloister and chedi at Wat Ratchabophit in Bangkok",imgIllustrative:!1},{id:"gem-santichaiprakan-phra-sumen",group:"hidden",title:{en:"Santichaiprakan Park & Phra Sumen Fort at sunset",ko:"サンティチャイプラカーン公園とプラ・スメン砦 — 夕日スポット"},desc:{en:"A small riverside park beside the white, octagonal Phra Sumen Fort, one of the two surviving forts of old Bangkok. Locals come for the breeze, jogging, snacks and sunset over the Chao Phraya, with a leafy old-style feel that is totally different from the Khao San tourist strip just nearby.",ko:"白い八角形のプラ・スメン砦の隣にある、こぢんまりとした川沿いの公園です。昔のバンコクを守った砦のうち、現存する2つのうちの1つです。地元の人たちが風にあたり、ジョギングをして、軽食を食べながらチャオプラヤー川の夕日を眺める場所で、すぐ近くのカオサン通りとは雰囲気がまったく違います。"},special:{en:"Free, breezy, and cooler than almost anywhere in the old city at dusk. You get fort, river and sunset in one stop.",ko:"無料で、夕暮れ時はオールドシティでもほぼいちばん涼しい場所です。砦、川、夕日を一度に楽しめます。"},bestTime:["evening"],timeText:{en:"About an hour before sunset until dusk",ko:"日没の1時間前から日が暮れるまで"},cost:{min:0,max:150},costNote:{en:"Park is free. Budget a little for street snacks or a drink nearby (estimate).",ko:"公園は無料です。近くの軽食や飲み物代を少し見ておきましょう(推定)。"},duration:[1,2],area:"other",locationText:{en:"Phra Arthit Road, Phra Nakhon (Old Town riverside)",ko:"プラ・アーティット通り、プラナコーン(オールドタウンの川沿い)"},transit:{en:"Chao Phraya Express boat to Phra Arthit Pier (N13), then a short walk. (Confirm pier on Google Maps.)",ko:"チャオプラヤー・エクスプレスボートでプラ・アーティット船着場(N13)で降り、少し歩きます。(船着場はGoogleマップで確認)"},indoor:"outdoor",crowd:"both",energy:1,tags:["hidden-gem","relaxing","photo","date-night","after-practice"],weather:{en:"Shade is limited; mosquitoes after dark, so bring repellent. Skip it in heavy rain.",ko:"日陰が少なく、暗くなると蚊が出るので虫よけを持っていきましょう。大雨のときはやめておきましょう。"},tips:{en:"A great low-energy end to a day. Keep valuables close in the evening crowd. Phra Arthit Road has plenty of small caf\xE9s for before or after.",ko:"のんびりと一日を締めくくるのにぴったりです。夕方の混雑時は持ち物に気をつけてください。プラ・アーティット通りには小さなカフェが多く、前後に休憩できます。"},geoQuery:"Santichaiprakan Park, Bangkok",mapsQuery:"Santichaiprakan Park Phra Sumen Fort Bangkok",imgQuery:"Phra Sumen Fort",imgAlt:"White Phra Sumen Fort beside the Chao Phraya River at Santichaiprakan Park",imgIllustrative:!1},{id:"gem-wat-intharawihan",group:"hidden",title:{en:"Wat Intharawihan \u2014 the giant standing Buddha",ko:"ワット・インタラウィハーン — 巨大な立像仏"},desc:{en:"A neighborhood temple in Bang Khun Phrom famous for a very tall golden standing Buddha towering above the surrounding rooftops. It sits in an everyday local area, so you also see how Bangkokians actually use their temples.",ko:"バーンクンプロム地区にある地元のお寺で、周囲の屋根の上にそびえる巨大な黄金の立像仏で有名です。地元の生活圏のど真ん中にあるので、バンコクの人たちが寺院をどう使っているかも一緒に見られます。"},special:{en:"Few foreign visitors come here despite its size, and with quiet streets around it, it feels like a real temple rather than a sight.",ko:"大きさのわりに外国人はほとんど来ず、観光地というより本当に地元のお寺という雰囲気です。"},bestTime:["morning","afternoon"],timeText:{en:"Morning or late afternoon. Check Google Maps for current hours.",ko:"午前か夕方がおすすめ。営業時間はGoogleマップで確認"},cost:{min:0,max:50},costNote:{en:"Usually free, donations welcome (estimate).",ko:"たいてい無料で、寄付は任意です(推定)。"},duration:[.5,1],area:"other",locationText:{en:"Wat Intharawihan, Bang Khun Phrom, near Phra Sumen Fort",ko:"バーンクンプロム、プラ・スメン砦近くのワット・インタラウィハーン"},transit:{en:"Grab or taxi is easiest; it is a short ride from Phra Arthit. (Confirm on Google Maps.)",ko:"Grabかタクシーがいちばん便利です。プラ・アーティットから近い距離です。(Googleマップで確認)"},indoor:"both",crowd:"both",energy:1,tags:["hidden-gem","photo","relaxing"],weather:{en:"Courtyard has limited shade; go early or late.",ko:"中庭は日陰が少ないので、早い時間か夕方に行きましょう。"},tips:{en:"Dress code: shoulders and knees covered. Do not climb on or touch the statue. Pair with Santichaiprakan Park for sunset.",ko:"服装:肩と膝を隠す。仏像に登ったり触ったりしないでください。サンティチャイプラカーン公園の夕日と合わせてまわりましょう。"},geoQuery:"Wat Intharawihan, Bangkok",mapsQuery:"Wat Intharawihan Bangkok standing Buddha",imgQuery:"Wat Intharawihan",imgAlt:"Tall golden standing Buddha statue at Wat Intharawihan, Bangkok",imgIllustrative:!1},{id:"gem-kudi-chin-santa-cruz",group:"hidden",title:{en:"Kudi Chin & Santa Cruz Church \u2014 Portuguese-era Thonburi",ko:"クディ・チーン&サンタクルーズ教会 — ポルトガルの面影が残るトンブリー"},desc:{en:"A small old riverside community in Thonburi where Portuguese, Chinese and Thai descendants have lived for generations. The Santa Cruz Church has a distinctive dome and a calm interior, and the lanes nearby are known for traditional baked sweets (kanom farang) and old wooden houses.",ko:"トンブリーの川沿いにある古い小さな集落で、ポルトガル系、中国系、タイ系の子孫が代々暮らしてきた場所です。サンタクルーズ教会は丸いドームが特徴で内部は落ち着いた雰囲気、路地には伝統の焼き菓子カノム・ファランや昔ながらの木造家屋が残っています。"},special:{en:"It shows a very different, multicultural layer of Bangkok history, and tourists rarely wander the lanes.",ko:"バンコクの歴史の多文化な一面が見られる場所なのに、路地まで歩く観光客はほとんどいません。"},bestTime:["morning","afternoon"],timeText:{en:"Daytime. Church access varies; check Google Maps for current info.",ko:"昼間がおすすめ。教会に入れるかは時期によるので、Googleマップで確認してください"},cost:{min:0,max:150},costNote:{en:"Free to walk; budget a little for sweets and a drink (estimate).",ko:"歩くだけなら無料です。お菓子と飲み物代を少し見ておきましょう(推定)。"},duration:[1,2],area:"other",locationText:{en:"Kudi Chin, Thonburi side near Memorial Bridge",ko:"メモリアル橋近く、トンブリー側のクディ・チーン"},transit:{en:"A short Grab, or river boat/cross-river ferry near Memorial Bridge and then a walk. (Confirm exact pier on Google Maps.)",ko:"Grabで短く行くか、メモリアル橋近くでボートや渡し船に乗って歩きます。(正確な船着場はGoogleマップで確認)"},indoor:"both",crowd:"both",energy:1,tags:["hidden-gem","photo","relaxing","adventurous"],weather:{en:"Walking is mostly outdoors and shade is patchy. Avoid midday heat.",ko:"ほとんど屋外を歩くので、日陰はところどころしかありません。日中の暑い時間は避けましょう。"},tips:{en:"Church dress code applies: shoulders and knees covered, quiet voices. It is an active community, so avoid filming residents without asking.",ko:"教会の服装ルールがあります:肩と膝を隠し、静かにしてください。実際に人が暮らしている場所なので、許可なく住民を撮影するのは避けましょう。"},geoQuery:"Santa Cruz Church, Bangkok",mapsQuery:"Santa Cruz Church Kudi Chin Bangkok",imgQuery:"Santa Cruz Church Bangkok",imgAlt:"Santa Cruz Church with its dome in Kudi Chin, Thonburi",imgIllustrative:!1},{id:"gem-lhong-1919",group:"hidden",title:{en:"Lhong 1919 \u2014 restored Chinese-style riverside compound",ko:"ロン1919 — 修復された中国風の川沿い建築"},desc:{en:"A restored historic Chinese-style compound on the Thonburi riverbank, now a calm spot with courtyards, shrines, small shops and caf\xE9 spaces. Its red-and-green details and river view make it feel like a mini heritage village.",ko:"トンブリーの川沿いにある歴史的な中国風の建物を修復したスペースです。中庭、祠、小さなお店、カフェがあります。赤と緑のディテールと川の景色が合わさって、小さな伝統の村のようです。"},special:{en:"It is beautiful and photogenic yet much quieter than the big riverside malls next door. A good change from glass towers.",ko:"とても綺麗でフォトジェニックなのに、すぐ隣の大型モールよりずっと静かです。ガラス張りのビルばかり見たあとの息抜きにぴったりです。"},bestTime:["afternoon","evening"],timeText:{en:"Late afternoon for light; check Google Maps for current hours",ko:"光がきれいな夕方がおすすめ。営業時間はGoogleマップで確認"},cost:{min:0,max:250},costNote:{en:"Entry is typically free; budget for drinks and snacks (estimate).",ko:"入場はたいてい無料です。飲み物と軽食代を見ておきましょう(推定)。"},duration:[1,2],area:"riverside",locationText:{en:"Lhong 1919, Khlong San riverside, Thonburi",ko:"トンブリー、クローンサーン川沿いのロン1919"},transit:{en:"Grab is simplest. River boats and ICONSIAM-area piers are nearby, but confirm the best route on Google Maps.",ko:"Grabがいちばん簡単です。近くに川のボートやアイコンサイアム側の船着場がありますが、最適なルートはGoogleマップで確認してください。"},indoor:"both",crowd:"both",energy:1,tags:["hidden-gem","photo","relaxing","date-night"],weather:{en:"Courtyards are open air and warm; there are covered corners for rain.",ko:"中庭は屋外なので暑めで、雨をしのげる屋根のある場所もあります。"},tips:{en:"Treat shrines respectfully. Caf\xE9s and shops have their own hours, so confirm before a long trip. Easy to combine with ICONSIAM nearby.",ko:"祠では敬意を持って行動しましょう。カフェやお店ごとに営業時間が違うので、遠出の前に確認してください。近くのアイコンサイアムと一緒にまわりやすいです。"},geoQuery:"Lhong 1919, Bangkok",mapsQuery:"Lhong 1919 Bangkok",imgQuery:"Lhong 1919 Bangkok",imgAlt:"Chinese-style courtyard at Lhong 1919 on the Chao Phraya riverbank",imgIllustrative:!1},{id:"gem-wat-prayoon-turtle-hill",group:"hidden",title:{en:"Wat Prayurawongsawat \u2014 the artificial hill and turtle pond",ko:"ワット・プラユーラウォンサーワート — 人工の丘とカメの池"},desc:{en:"A Thonburi temple near Memorial Bridge known for a small artificial hill topped with a white chedi and a pond full of turtles you can feed. It has a quiet, almost village atmosphere, and the whole visit is a short, gentle outing.",ko:"メモリアル橋近くのトンブリーにある寺院で、白い仏塔がのった小さな人工の丘と、エサやりができるカメでいっぱいの池で有名です。静かで村のような雰囲気があり、短く気軽に立ち寄れます。"},special:{en:"An unusual, low-key stop with a bit of humor: turtles, a mini mountain and a very local setting. Great when everyone is tired but wants something light.",ko:"カメ、ミニ山、とても地元らしい雰囲気と、ちょっとユーモラスでユニークなコースです。みんな疲れているけど軽く何か見たいときにぴったりです。"},bestTime:["morning","afternoon"],timeText:{en:"Daytime; check Google Maps for current hours",ko:"昼間がおすすめ。営業時間はGoogleマップで確認"},cost:{min:0,max:100},costNote:{en:"Usually free; a small amount for turtle food or donation (estimate).",ko:"たいてい無料で、カメのエサ代や寄付に少額かかる程度です(推定)。"},duration:[.5,1],area:"other",locationText:{en:"Wat Prayurawongsawat, Thonburi near Memorial Bridge",ko:"メモリアル橋近くのトンブリー、ワット・プラユーラウォンサーワート"},transit:{en:"Grab, or walk over Memorial Bridge from the Phra Nakhon side. Confirm the walking route and pier on Google Maps.",ko:"Grabか、プラナコーン側からメモリアル橋を歩いて渡りましょう。徒歩ルートと船着場はGoogleマップで確認してください。"},indoor:"outdoor",crowd:"both",energy:1,tags:["hidden-gem","photo","relaxing","after-practice"],weather:{en:"Mostly open air and sunny; skip heavy rain and midday heat.",ko:"ほとんど屋外で日差しが強いです。大雨と日中の暑さは避けましょう。"},tips:{en:"Dress code: shoulders and knees covered. Feed turtles only with the food sold on site, nothing else.",ko:"服装:肩と膝を隠す。カメには現地で売っているエサだけをあげてください。"},geoQuery:"Wat Prayurawongsawat, Bangkok",mapsQuery:"Wat Prayurawongsawat Bangkok turtle",imgQuery:"Wat Prayurawongsawat",imgAlt:"White chedi on a small hill at Wat Prayurawongsawat, Bangkok",imgIllustrative:!1},{id:"gem-holy-rosary-church",group:"hidden",title:{en:"Holy Rosary Church (Wat Kalawar) near Talat Noi",ko:"ホーリー・ロザリー教会(ワット・カラワー)— タラートノーイ近く"},desc:{en:"A historic Roman Catholic church on the Chao Phraya riverbank, built by the Portuguese community and known for its pale fa\xE7ade and elegant interior. It sits quietly near Talat Noi's alleys and Chinese shrines.",ko:"チャオプラヤー川沿いにある歴史あるカトリック教会で、ポルトガル系コミュニティが建てました。淡い色の外観と優雅な内部が特徴で、タラートノーイの路地や中国の祠の近くに静かに佇んでいます。"},special:{en:"Talat Noi is usually seen as a Chinese-Thai neighborhood; this church shows the older Portuguese layer.",ko:"タラートノーイは普通、中国系タイ人の街として知られていますが、この教会はもっと古いポルトガルの層を見せてくれます。"},bestTime:["morning","afternoon"],timeText:{en:"Daytime. Church access varies, so check Google Maps first (do not enter during services).",ko:"昼間がおすすめ。入れるかはGoogleマップで先に確認(ミサの最中は入らないでください)"},cost:{min:0,max:50},costNote:{en:"Free; donations optional (estimate).",ko:"無料で、寄付は任意です(推定)。"},duration:[.5,1],area:"talat-noi",locationText:{en:"Holy Rosary Church (Wat Kalawar), riverside near Talat Noi",ko:"タラートノーイ近くの川沿い、ホーリー・ロザリー教会(ワット・カラワー)"},transit:{en:"Walkable as part of a Talat Noi loop; river boat (Ratchawong Pier area) or MRT Wat Mangkon plus Grab also work. (Confirm on Google Maps.)",ko:"タラートノーイの散歩コースに入れて歩いて行けます。川のボート(ラーチャウォン船着場側)や、MRTワット・マンコーン駅+Grabでも行けます。(Googleマップで確認)"},indoor:"both",crowd:"both",energy:1,tags:["hidden-gem","photo","relaxing"],weather:{en:"Interior is cooler than outside; the walk to it can be hot.",ko:"内部は外より涼しいです。そこまで歩く道のりは暑いかもしれません。"},tips:{en:"Church dress code: shoulders and knees covered, quiet voices. No flash photography, and respect worshippers.",ko:"教会の服装ルール:肩と膝を隠し、静かにしてください。フラッシュ撮影は禁止で、礼拝している人を尊重しましょう。"},geoQuery:"Holy Rosary Church, Bangkok",mapsQuery:"Holy Rosary Church Wat Kalawar Bangkok",imgQuery:"Holy Rosary Church Bangkok",imgAlt:"Holy Rosary Church on the Chao Phraya riverbank in Bangkok",imgIllustrative:!1},{id:"gem-talat-noi-alleys",group:"hidden",title:{en:"Talat Noi back alleys \u2014 shrines, street art and old garages",ko:"タラートノーイの路地 — 祠、ストリートアート、古い修理工場"},desc:{en:"A narrow riverside neighborhood where tiny Chinese shrines, old auto-parts shops, murals and low-key caf\xE9s sit side by side. It is best explored on foot, wandering without a strict plan.",ko:"狭い川沿いの街に、小さな中国の祠、古い自動車部品店、壁画、こぢんまりしたカフェが並んでいます。計画を立てずにぶらぶら歩くのにぴったりです。"},special:{en:'It is a living workshop neighborhood, not a mall-made "vintage" district, which is what makes it so photogenic.',ko:"ショッピングモールが作った「ヴィンテージ」街ではなく、今も工房が動いている街なので、写真を撮ると雰囲気が出ます。"},bestTime:["morning","afternoon"],timeText:{en:"Late morning to late afternoon, weekdays are quieter and many workshops are active",ko:"午前の遅い時間〜夕方。平日は空いていて、工房も多く開いています"},cost:{min:0,max:300},costNote:{en:"Walking is free; budget for coffee or street food (estimate).",ko:"歩くのは無料です。コーヒーや屋台グルメ代を見ておきましょう(推定)。"},duration:[1.5,3],area:"talat-noi",locationText:{en:"Talat Noi, Samphanthawong (riverside)",ko:"タラートノーイ、サムパンタウォン川沿い"},transit:{en:"River boat to the Ratchawong Pier area, or MRT Hua Lamphong then Grab; confirm on Google Maps.",ko:"川のボートでラーチャウォン船着場側で降りるか、MRTフアラムポーン駅+Grabで行きましょう。Googleマップで確認してください。"},indoor:"outdoor",crowd:"both",energy:2,tags:["hidden-gem","photo","adventurous","after-practice"],weather:{en:"Hot and shadeless in places; bring water. Alleys flood slightly in heavy rain.",ko:"日陰のない場所が多く暑いです。水を持っていきましょう。大雨だと路地が少し冠水することがあります。"},tips:{en:"Narrow lanes with scooters; watch your step and your phone. Be respectful at shrines and do not photograph workers closely without asking.",ko:"狭い路地をバイクが通るので、足元とスマホに気をつけてください。祠では敬意を持ち、働いている人を近くから許可なく撮らないでください。"},geoQuery:"Talat Noi, Bangkok",mapsQuery:"Talat Noi Bangkok",imgQuery:"Talat Noi Bangkok",imgAlt:"Narrow alley with murals and shrines in Talat Noi, Bangkok",imgIllustrative:!1},{id:"gem-haroon-mosque",group:"hidden",title:{en:"Haroon Mosque and the Bang Rak mosque community",ko:"ハルーン・モスク — バーンラックのムスリムの街"},desc:{en:"A long-established mosque in the old Bang Rak riverside quarter, surrounded by a small Muslim community with lanes of halal food stalls and homes. Visiting shows a very different side of Bangkok from malls and temples.",ko:"バーンラックの川沿いの古い街にある歴史あるモスクです。周りには小さなムスリムのコミュニティがあり、ハラール屋台や住宅の路地が続いています。ショッピングモールや寺院とは違うバンコクが見られます。"},special:{en:"Bangkok has many communities layered together; this one is calm, local and rarely on tourist maps.",ko:"バンコクはさまざまなコミュニティが重なり合った街ですが、ここは静かで地元らしく、観光マップにはほとんど載りません。"},bestTime:["morning","afternoon"],timeText:{en:"Daytime; avoid prayer times and check Google Maps for access",ko:"昼間がおすすめ。礼拝の時間は避け、見学できるかはGoogleマップで確認"},cost:{min:0,max:200},costNote:{en:"Free to look; budget for halal snacks or lunch nearby (estimate).",ko:"見るだけなら無料です。近くのハラールの軽食やランチ代を見ておきましょう(推定)。"},duration:[1,2],area:"other",locationText:{en:"Haroon Mosque, Bang Rak riverside off Charoen Krung Road",ko:"バーンラックの川沿い、チャルンクルン通りから奥に入ったハルーン・モスク"},transit:{en:"BTS Saphan Taksin plus Grab is easiest; river boats stop nearby but confirm the right pier on Google Maps.",ko:"BTSサパーンタクシン駅+Grabがいちばん便利です。近くに川のボートも停まりますが、船着場はGoogleマップで確認してください。"},indoor:"both",crowd:"both",energy:1,tags:["hidden-gem","relaxing","adventurous"],weather:{en:"Lanes are open-air and hot at midday.",ko:"路地は屋外なので、日中は暑いです。"},tips:{en:"Ask before entering any prayer space; dress modestly (cover shoulders, knees and arms; women may be asked to cover hair). Remove shoes, keep quiet and be discreet with photos. Friday midday and prayer times are busy for worshippers.",ko:"礼拝スペースに入る前に必ず聞いてください。控えめな服装(肩・膝・腕を隠す。女性は髪を覆うよう求められることがあります)。靴を脱ぎ、静かにして、写真は控えめに。金曜の昼と礼拝の時間は信者の方が多いです。"},geoQuery:"Haroon Mosque, Bangkok",mapsQuery:"Haroon Mosque Bang Rak Bangkok",imgQuery:"Haroon Mosque Bangkok",imgAlt:"Haroon Mosque in the Bang Rak district of Bangkok",imgIllustrative:!1},{id:"gem-bangkokian-museum",group:"hidden",title:{en:"The Bangkokian Museum \u2014 a 1930s home in Bang Rak",ko:"バンコキアン博物館 — バーンラックの1930年代の家"},desc:{en:"A small museum in a set of old Bangkok houses in Bang Rak that shows how ordinary families lived in the early to mid 20th century. The rooms are filled with period furniture and household items, in a quiet garden compound.",ko:"バーンラックの古いバンコクの家を博物館にした場所です。20世紀前半〜中頃に一般の家庭がどう暮らしていたかを、当時の家具や生活用品で見せてくれます。静かな庭のあるこぢんまりとした空間です。"},special:{en:"Instead of palaces and kings, it shows everyday life, so it is surprisingly relatable and uncrowded.",ko:"宮殿や王様の話ではなく日常の暮らしを見せてくれるので、意外と共感しやすく、空いています。"},bestTime:["morning","afternoon"],timeText:{en:"Daytime; opening days and hours change, so check Google Maps first",ko:"昼間がおすすめ。開館日と時間は変わることがあるので、先にGoogleマップで確認してください"},cost:{min:0,max:100},costNote:{en:"Free or very low entry (estimate). Check on arrival.",ko:"無料か、入場料がとても安いです(推定)。現地で確認してください。"},duration:[.5,1.5],area:"other",locationText:{en:"Bangkokian Museum, Charoen Krung Soi 43, Bang Rak",ko:"バンコキアン博物館、バーンラック、チャルンクルン ソイ43"},transit:{en:"Grab is simplest; BTS Saphan Taksin is about 2 km away. (Confirm on Google Maps.)",ko:"Grabがいちばん簡単です。BTSサパーンタクシン駅からは約2km離れています。(Googleマップで確認)"},indoor:"indoor",crowd:"both",energy:1,tags:["hidden-gem","relaxing","rainy-day","after-practice"],tips:{en:"Great rainy-day or very low-energy option. Dress modestly and avoid touching exhibits. Check for photo rules inside.",ko:"雨の日や体力が残っていない日にぴったりです。控えめな服装で、展示品には触らないでください。館内の撮影ルールは現地で確認しましょう。"},geoQuery:"Bangkokian Museum, Bangkok",mapsQuery:"Bangkokian Museum Charoen Krung Soi 43 Bangkok",imgQuery:"Bangkokian Museum",imgAlt:"Old wooden house at the Bangkokian Museum in Bang Rak",imgIllustrative:!1},{id:"gem-pak-khlong-talat-flower-market",group:"hidden",title:{en:"Pak Khlong Talat flower market at night",ko:"パーククローンタラート花市場 — 夜の風景"},desc:{en:"Bangkok's big wholesale flower and produce market near the river, famous for piles of jasmine garlands, marigolds, roses and orchids. It is busiest late at night and early morning, and the stalls and alleys are a color-saturated scene.",ko:"川の近くにあるバンコク最大級の卸売の花・青果市場で、ジャスミンの花輪、マリーゴールド、バラ、蘭が山のように積まれています。深夜と早朝にいちばん活気があり、路地ごとに色があふれています。"},special:{en:"Locals buy here for offerings and weddings, so it is practical, not touristy. It is also one of the few things to do at night that costs almost nothing.",ko:"地元の人がお供えや結婚式用に買いに来る市場なので、観光向けではなく実用的です。夜にほとんどお金をかけずに楽しめる数少ないコースでもあります。"},bestTime:["evening","night","morning"],timeText:{en:"Evening and late night are lively; many stalls trade through the night. Check Google Maps for current hours",ko:"夕方〜深夜が活気があります。夜通し開いているお店も多いです。営業時間はGoogleマップで確認"},cost:{min:0,max:200},costNote:{en:"Browsing is free; a flower garland or small bouquet costs little (estimate).",ko:"見るだけなら無料です。花輪や小さな花束は安いです(推定)。"},duration:[1,2],area:"other",locationText:{en:"Pak Khlong Talat, near Memorial Bridge, Old Town riverside",ko:"メモリアル橋近くのオールドタウン川沿い、パーククローンタラート"},transit:{en:"MRT Sanam Chai is about a 5\u201310 min walk, or river boat to the Memorial Bridge pier area. (Confirm pier and exit on Google Maps.)",ko:"MRTサナームチャイ駅から歩いて5〜10分です。またはメモリアル橋の船着場側へボートで行きましょう。(船着場と出口はGoogleマップで確認)"},indoor:"both",crowd:"both",energy:2,tags:["hidden-gem","photo","late-night","adventurous"],weather:{en:"Covered in parts, but hot and crowded; wet floors on rainy nights.",ko:"一部は屋根がありますが、暑くて混んでいます。雨の夜は床が濡れています。"},tips:{en:"Keep bags in front; carts and motorbikes move through lanes. Learn the price before buying. Photograph stalls politely.",ko:"バッグは前に抱えましょう。路地を台車やバイクが通ります。買う前に値段を確認し、お店の人の写真は礼儀正しく撮りましょう。"},geoQuery:"Pak Khlong Talat, Bangkok",mapsQuery:"Pak Khlong Talat flower market Bangkok",imgQuery:"Pak Khlong Talat",imgAlt:"Stalls of flower garlands and flowers at Pak Khlong Talat market",imgIllustrative:!1},{id:"gem-or-tor-kor-market",group:"hidden",title:{en:"Or Tor Kor Market \u2014 Bangkok's premium fresh market",ko:"オートーコー市場 — バンコクのプレミアム生鮮市場"},desc:{en:"A large, clean, well-known fresh market beside Chatuchak, with high-quality fruit, seafood, meat, curry pastes and prepared-food stalls. It is a locals' market, with good sampling and snacking opportunities.",ko:"チャトゥチャックの隣にある、大きくてきれいな有名生鮮市場です。果物、海鮮、肉、カレーペースト、その場で食べられる屋台があります。地元の人が買い物に来る市場で、試食やつまみ食いの楽しみがあります。"},special:{en:"Fresh produce in a very orderly setting, which is great for a first-time market visitor who does not want a messy wet-market jolt. Great fruit and ready-to-eat stalls.",ko:"整った環境なので、初めて市場に行く人でも気軽です。フルーツとその場で食べられるお惣菜が特におすすめです。"},bestTime:["morning","afternoon"],timeText:{en:"Morning is the freshest; check Google Maps for current hours",ko:"午前がいちばん新鮮です。営業時間はGoogleマップで確認"},cost:{min:100,max:400},costNote:{en:"Fruit boxes and snacks cost more than at street stalls but are still reasonable (estimate).",ko:"フルーツセットや軽食は屋台より少し高いですが、手頃な範囲です(推定)。"},duration:[1,2],area:"other",locationText:{en:"Or Tor Kor Market, next to Chatuchak",ko:"チャトゥチャックの隣、オートーコー市場"},transit:{en:"MRT Kamphaeng Phet, a short walk. (Confirm exit on Google Maps.)",ko:"MRTカムペーンペット駅から少し歩けば着きます。(出口はGoogleマップで確認してください。)"},indoor:"both",crowd:"both",energy:1,tags:["hidden-gem","relaxing","rainy-day","after-practice"],weather:{en:"Mostly covered halls; cooler than outdoor markets.",ko:"ほとんどが屋根付きのホールなので、屋外の市場より涼しいです。"},tips:{en:"Great place to buy fruit and ready-to-eat dishes for the room. Wash fruit before eating, and carry cash. Combine with Chatuchak market when you have energy.",ko:"ホテルで食べるフルーツやお惣菜を買うのにぴったりです。果物は洗ってから食べ、現金を持っていきましょう。体力が残っていればチャトゥチャック市場と一緒にまわるのもおすすめです。"},geoQuery:"Or Tor Kor Market, Bangkok",mapsQuery:"Or Tor Kor Market Bangkok",imgQuery:"Or Tor Kor Market",imgAlt:"Fresh fruit stalls at Or Tor Kor Market in Bangkok",imgIllustrative:!1},{id:"gem-khlong-toei-market",group:"hidden",title:{en:"Khlong Toei Market \u2014 the real working wet market",ko:"クロントゥーイ市場 — 本物の地元の生鮮市場"},desc:{en:"One of Bangkok's largest and busiest fresh markets, supplying restaurants and households with vegetables, meat, seafood and flowers. It is noisy, wet and full of life, with early-morning energy you will not find in a mall.",ko:"バンコク最大級で最も忙しい生鮮市場の1つで、レストランや家庭に野菜、肉、海鮮、花を供給しています。うるさくて湿っぽいですが、ショッピングモールでは感じられない早朝の活気があります。"},special:{en:"It is where Bangkok's food actually comes from. Come with curiosity rather than a plan.",ko:"バンコクの食材が実際に集まってくる場所です。計画は立てず、好奇心で行ってみましょう。"},bestTime:["morning"],timeText:{en:"Early morning is the busiest; check Google Maps for current hours",ko:"早朝がいちばん混みます。営業時間はGoogleマップで確認"},cost:{min:0,max:200},costNote:{en:"Looking is free; budget for a market breakfast or snacks (estimate).",ko:"見るだけなら無料です。市場の朝ごはんや軽食代を見ておきましょう(推定)。"},duration:[1,1.5],area:"other",locationText:{en:"Khlong Toei Market, Khlong Toei district",ko:"クロントゥーイ地区、クロントゥーイ市場"},transit:{en:"MRT Khlong Toei, a short walk. (Confirm exit on Google Maps.)",ko:"MRTクロントゥーイ駅から少し歩けば着きます。(出口はGoogleマップで確認)"},indoor:"both",crowd:"both",energy:2,tags:["hidden-gem","adventurous","photo"],weather:{en:"Wet floors and strong smells; wear cl
