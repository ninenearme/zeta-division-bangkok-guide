osed shoes. Heat builds fast.",ko:"床が濡れていて臭いも強いです。つま先の隠れる靴を履きましょう。暑さもすぐに上がります。"},tips:{en:"Not for everyone: it can be crowded and smelly. Watch for carts and forklifts. Avoid taking large bags. Ask before photographing vendors. If anyone offers to guide you, politely decline.",ko:"誰にでも合うわけではありません。混んでいて臭いがあることもあります。台車やフォークリフトに気をつけてください。大きなバッグは避けましょう。お店の人の写真は先に聞いてから撮りましょう。案内すると声をかけてくる人は、丁寧に断りましょう。"},geoQuery:"Khlong Toei Market, Bangkok",mapsQuery:"Khlong Toei Market Bangkok",imgQuery:"Khlong Toei Market",imgAlt:"Busy fresh market stalls at Khlong Toei Market, Bangkok",imgIllustrative:!1},{id:"gem-wang-lang-market",group:"hidden",title:{en:"Wang Lang Market \u2014 Thonburi street-food and snacks",ko:"ワンラン市場 — トンブリーの屋台グルメ"},desc:{en:"A busy riverside market area by Siriraj Hospital where Thonburi locals buy cheap clothes, snacks and street food. The lanes are packed with stalls selling noodles, grilled skewers, sweets and drinks.",ko:"シリラート病院の隣にある川沿いの市場エリアで、トンブリーの地元の人が安い服、軽食、屋台グルメを買いに来ます。麺、串焼き、スイーツ、ドリンクの屋台が路地にぎっしりです。"},special:{en:"It is cheap, local and student-heavy, and the food stalls are a good way to try lots of small things.",ko:"安くて地元らしく、大学生が多いので、いろいろなものを少しずつ食べ歩くのに向いています。"},bestTime:["morning","afternoon"],timeText:{en:"Daytime to early evening; check Google Maps for current hours",ko:"昼〜夕方早め。営業時間はGoogleマップで確認"},cost:{min:50,max:300},costNote:{en:"Dishes about 30\u201380 THB each (estimate), so a snack crawl is cheap.",ko:"1皿だいたい30〜80バーツ(推定)なので、食べ歩きも安く済みます。"},duration:[1,2],area:"other",locationText:{en:"Wang Lang, Thonburi near Siriraj Hospital",ko:"シリラート病院近くのトンブリー、ワンラン"},transit:{en:"Chao Phraya Express boat to Wang Lang (Siriraj) Pier (N10), then walk. (Confirm pier on Google Maps.)",ko:"チャオプラヤー・エクスプレスボートでワンラン(シリラート)船着場(N10)で降り、歩きます。(船着場はGoogleマップで確認)"},indoor:"both",crowd:"both",energy:2,tags:["hidden-gem","adventurous","after-practice","late-night"],weather:{en:"Open lanes, hot and crowded; covered in places.",ko:"開けた路地なので暑くて混んでいます。一部は屋根があります。"},tips:{en:"Hold your phone close in the crowd. Eat where stalls are busy and food is cooked in front of you. Bring small notes.",ko:"混雑の中ではスマホをしっかり持っておきましょう。人が多く、目の前で調理しているお店で食べましょう。小額の紙幣を用意してください。"},geoQuery:"Wang Lang Market, Bangkok",mapsQuery:"Wang Lang Market Bangkok",imgQuery:"Wang Lang Market Bangkok",imgAlt:"Busy food and clothing stalls at Wang Lang Market",imgIllustrative:!1},{id:"gem-bang-nam-phueng-floating-market",group:"hidden",title:{en:"Bang Nam Phueng weekend market in Bang Krachao",ko:"バーンナムプン水上マーケット — バーンクラチャオの週末市場"},desc:{en:'A small weekend market in the green Bang Krachao "lung of Bangkok", more local than the big tourist floating markets. Expect food stalls, handicrafts and a countryside feel, all within the city limits.',ko:"「バンコクの肺」と呼ばれる緑豊かなバーンクラチャオで開かれる小さな週末市場です。大きな観光向け水上マーケットよりずっと地元らしく、食べ物や手工芸品の屋台があります。市内なのに田舎の雰囲気です。"},special:{en:"Greenery, quiet, and local food. It is a gentle day trip that still counts as Bangkok.",ko:"緑の景色、静けさ、地元の食べ物。バンコク市内で気軽に行ける日帰りコースです。"},bestTime:["morning","afternoon"],timeText:{en:"Weekends only, daytime. Hours vary, so check Google Maps before going",ko:"週末の昼間のみ開催です。時間は異なるので、行く前にGoogleマップで確認"},cost:{min:100,max:500},costNote:{en:"Food and small purchases; add transport (estimate).",ko:"食べ物と少しの買い物の費用で、交通費は別です(推定)。"},duration:[2,4],area:"bang-krachao",locationText:{en:"Bang Nam Phueng, Bang Krachao, Phra Pradaeng",ko:"バーンナムプン、バーンクラチャオ、プラプラデーン"},transit:{en:"Grab or taxi is the simplest; public routes need a transfer and a short ferry/boat depending on the way. (Confirm on Google Maps.)",ko:"Grabかタクシーがいちばん簡単です。公共交通機関は乗り換えやボート・フェリーが必要なことがあります。(Googleマップで確認)"},indoor:"outdoor",crowd:"both",energy:2,tags:["hidden-gem","relaxing","photo","adventurous"],weather:{en:"Outdoor; hot at midday and wet in rainy season. Mosquitoes can be strong.",ko:"屋外なので日中は暑く、雨季は雨が降ります。蚊が多いことがあります。"},tips:{en:"Weekend-only; confirm it is open before committing half a day. Bring repellent, sunscreen and cash. Plan a ride back in advance.",ko:"週末のみなので、半日使う前に必ず開いているか確認しましょう。虫よけ、日焼け止め、現金を持ち、帰りの交通手段も事前に考えておきましょう。"},geoQuery:"Bang Nam Phueng, Bangkok",mapsQuery:"Bang Nam Phueng floating market Bang Krachao",imgQuery:"Bang Nam Phueng floating market",imgAlt:"Weekend floating market stalls at Bang Nam Phueng, Bang Krachao",imgIllustrative:!1},{id:"gem-chula-student-eats",group:"hidden",title:{en:"Chulalongkorn University student-food streets",ko:"チュラロンコーン大学周辺 — 学生向けのローカルグルメ通り"},desc:{en:"The lanes around Chulalongkorn University (around Soi Chula 42) fill with cheap student-priced eateries, noodle shops, khao gaeng stalls and dessert places. It is a very local and budget-friendly alternative to the big mall food courts nearby.",ko:"チュラロンコーン大学周辺の路地(ソイ・チュラ42あたり)には、学生向け価格の安い食堂、麺屋、カオゲーン(おかずのせご飯)のお店、スイーツ店が集まっています。近くの大型モールのフードコートよりずっと地元らしくて安いです。"},special:{en:"Good food at student prices without being far from central Siam. Great to try many dishes in small portions.",ko:"サイアム中心部から遠くないのに、学生価格でおいしく食べられます。少量ずついろいろ食べてみるのにぴったりです。"},bestTime:["morning","afternoon","evening"],timeText:{en:"Lunch and dinner rushes are lively; hours vary by shop, so check Google Maps",ko:"ランチとディナーの時間帯が活気があります。お店ごとに時間が違うのでGoogleマップで確認"},cost:{min:50,max:250},costNote:{en:"Typical dishes about 40\u2013100 THB each (estimate).",ko:"1皿だいたい40〜100バーツです(推定)。"},duration:[1,1.5],area:"siam",locationText:{en:"Streets around Chulalongkorn University, near Siam Square",ko:"サイアムスクエア近く、チュラロンコーン大学周辺の路地"},transit:{en:"BTS National Stadium or MRT Sam Yan; then a short walk. (Confirm exits on Google Maps.)",ko:"BTSナショナルスタジアム駅かMRTサームヤーン駅から歩きましょう。(出口はGoogleマップで確認)"},indoor:"both",crowd:"both",energy:1,tags:["hidden-gem","after-practice","team-bonding"],weather:{en:"Many shops are open-front; fans or A/C inside some.",ko:"店先が開けているお店が多く、一部はエアコンがあります。"},tips:{en:'Easy for groups of 3\u20136 to share several dishes. Tell stalls "mai phet" if you want no spice. Check any allergies before ordering.',ko:"3〜6人でいくつかの料理をシェアするのに向いています。辛くしたくないときは「マイペット」と伝えましょう。アレルギーは注文前に必ず伝えてください。"},geoQuery:"Chulalongkorn University, Bangkok",mapsQuery:"Soi Chula 42 street food Bangkok",imgQuery:"Chulalongkorn University Bangkok",imgAlt:"Street food stalls near Chulalongkorn University in Bangkok",imgIllustrative:!0},{id:"gem-thonburi-riverside-cafes",group:"hidden",title:{en:"Thonburi riverside & shophouse caf\xE9s (Khlong San / Wongwian Yai side)",ko:"トンブリーの川沿い・ショップハウスカフェ(クローンサーン/ウォンウィアンヤイ側)"},desc:{en:"Across the river from Old Town, converted wooden and shophouse caf\xE9s sit on side lanes and by the water, offering coffee and Thai desserts away from the busy side of the river. Names change quickly, so pick one with good reviews, good A/C and a river or canal view on Google Maps.",ko:"オールドタウンの対岸、川を渡ったトンブリーには、木造家屋やショップハウスを改装したカフェが路地や水辺にあります。にぎやかな側の川岸とは違い、静かにコーヒーやタイのスイーツを楽しめます。お店の入れ替わりが早いので、Googleマップでレビューが良く、エアコンがあって川や運河が見える店を選びましょう。"},special:{en:"Quiet, slow and relatively cheap, ideal for decompressing between busy days. Specific caf\xE9s change fast, so check recent reviews.",ko:"静かでゆったりしていて、比較的安いので、忙しい日程の合間に一息つくのにぴったりです。カフェは入れ替わりが早いので、最新のレビューを確認してください。"},bestTime:["morning","afternoon"],timeText:{en:"Late morning to afternoon. Hours vary by caf\xE9; check Google Maps",ko:"午前の遅い時間〜午後。カフェごとに時間が違うのでGoogleマップで確認"},cost:{min:80,max:300},costNote:{en:"Coffee or dessert usually 80\u2013180 THB (estimate).",ko:"コーヒーやデザートはたいてい80〜180バーツです(推定)。"},duration:[1,2],area:"riverside",locationText:{en:"Khlong San / Wongwian Yai side lanes, Thonburi",ko:"トンブリー、クローンサーン/ウォンウィアンヤイ側の路地"},transit:{en:"Grab is simplest; BTS Gold Line, MRT Blue Line or river boat depends on the caf\xE9. (Confirm station and exit on Google Maps.)",ko:"Grabがいちばん簡単です。カフェによってBTSゴールドライン、MRTブルーライン、川のボートが便利なことがあります。(駅と出口はGoogleマップで確認)"},indoor:"indoor",crowd:"both",energy:1,tags:["hidden-gem","relaxing","rainy-day","after-practice"],tips:{en:'Search "cafe Khlong San" or "cafe Thonburi" on Google Maps and pick by recent photos and reviews. Check opening days before going.',ko:"Googleマップで「cafe Khlong San」か「cafe Thonburi」で検索し、最新の写真とレビューで選びましょう。行く前に営業日を確認してください。"},mapsQuery:"cafe Khlong San Thonburi Bangkok",imgQuery:"Khlong San Bangkok riverside",imgAlt:"Riverside view in the Khlong San area of Thonburi, Bangkok",imgIllustrative:!0},{id:"gem-ari-side-soi-cafes",group:"hidden",title:{en:"Ari side-soi independent caf\xE9s",ko:"アーリーの路地裏にある個人経営のカフェめぐり"},desc:{en:"Ari's quiet side lanes off the main road hold small independent coffee shops, bakeries and brunch spots in converted houses. You can spend a slow afternoon wandering between them, which fits the district's calm, creative vibe.",ko:"アーリーの大通りから外れた静かな路地には、住宅を改装した個人経営のコーヒーショップ、ベーカリー、ブランチのお店があります。のんびり歩いてカフェをはしごするのにぴったりで、街の穏やかでクリエイティブな雰囲気に合っています。"},special:{en:"Small-batch coffee and local pastries in a residential setting, quieter than the main road. Individual caf\xE9s change often, so use recent reviews.",ko:"住宅街の雰囲気で飲むスペシャルティコーヒーとローカルのベーカリーは、大通りよりずっと静かです。個々のカフェは入れ替わりが多いので、最新のレビューを確認してください。"},bestTime:["morning","afternoon"],timeText:{en:"Morning to mid-afternoon; hours vary and some close one day a week",ko:"朝〜午後の中ごろ。時間はお店ごとに違い、週1日休むお店もあります"},cost:{min:100,max:350},costNote:{en:"Coffee 90\u2013160 THB, pastries extra (estimate).",ko:"コーヒーは90〜160バーツ、パンは別です(推定)。"},duration:[1,3],area:"ari",locationText:{en:"Side sois around Ari BTS (Phaya Thai)",ko:"BTSアーリー駅周辺の路地裏(パヤータイ)"},transit:{en:"BTS Ari, then walk into the side sois. (Confirm exit on Google Maps.)",ko:"BTSアーリー駅で降りて、横道に歩いて入りましょう。(出口はGoogleマップで確認)"},indoor:"indoor",crowd:"both",energy:1,tags:["hidden-gem","relaxing","rainy-day","after-practice","date-night"],tips:{en:'Search "specialty coffee Ari" on Google Maps and pick by recent reviews. Quiet seating is perfect for laptops, but be polite about table time at busy hours.',ko:"Googleマップで「specialty coffee Ari」で検索し、最新のレビューで選びましょう。静かなのでノートPC作業にぴったりですが、混む時間帯は長居しすぎないよう配慮しましょう。"},geoQuery:"Ari, Phaya Thai, Bangkok",mapsQuery:"specialty coffee Ari Bangkok",imgQuery:"Ari Bangkok cafe",imgAlt:"Small independent cafe on a quiet side street in Ari, Bangkok",imgIllustrative:!0},{id:"gem-samsen-phra-athit-cafes",group:"hidden",title:{en:"Samsen & Phra Athit back-lane caf\xE9s",ko:"サームセーン&プラ・アーティットの路地裏カフェ"},desc:{en:"Behind the busy Khao San strip, quieter lanes around Phra Athit and Samsen hide small caf\xE9s in old shophouses, many with art, books and a neighborhood feel. They are a calm break after a day of sightseeing.",ko:"にぎやかなカオサン通りの裏手、プラ・アーティットとサームセーンの路地には、古いショップハウスを改装した小さなカフェが隠れています。アート小物や本があって街の雰囲気が感じられ、観光のあとに静かに休むのにぴったりです。"},special:{en:"Old Bangkok character and quiet seating minutes from tourist crowds. Individual caf\xE9s change, so check recent reviews.",ko:"観光客の人混みから数分離れるだけで、昔ながらのバンコクの雰囲気と静かな席があります。個々のカフェは入れ替わりがあるので、最新のレビューを確認してください。"},bestTime:["morning","afternoon"],timeText:{en:"Daytime; check Google Maps for each caf\xE9's hours",ko:"昼間がおすすめ。カフェごとの営業時間はGoogleマップで確認"},cost:{min:80,max:300},costNote:{en:"Coffee or tea 80\u2013150 THB (estimate).",ko:"コーヒーやお茶は80〜150バーツです(推定)。"},duration:[1,2],area:"other",locationText:{en:"Phra Athit / Samsen, Phra Nakhon",ko:"プラナコーン、プラ・アーティット・サームセーン一帯"},transit:{en:"Chao Phraya Express boat to Phra Arthit Pier (N13), then walk. (Confirm pier on Google Maps.)",ko:"チャオプラヤー・エクスプレスボートでプラ・アーティット船着場(N13)で降り、歩きます。(船着場はGoogleマップで確認)"},indoor:"indoor",crowd:"both",energy:1,tags:["hidden-gem","relaxing","rainy-day","after-practice"],tips:{en:"Combine with Santichaiprakan Park and Phra Sumen Fort for sunset. Check opening days, as small caf\xE9s often close one day a week.",ko:"夕日の時間帯は、サンティチャイプラカーン公園・プラ・スメン砦と合わせてまわりましょう。小さなカフェは週1日休むところが多いので、営業日を確認してください。"},mapsQuery:"cafe Phra Athit Samsen Bangkok",imgQuery:"Phra Athit Road Bangkok",imgAlt:"Old shophouse cafes along Phra Athit Road in Bangkok",imgIllustrative:!0},{id:"gem-ceramic-pottery-workshop",group:"hidden",title:{en:"Drop-in pottery / ceramics workshop (small local studios)",ko:"少人数の陶芸・セラミック1日体験教室(地元の小さな工房)"},desc:{en:"Bangkok has many small independent studios offering short hand-building or wheel-throwing sessions for beginners, usually 2 to 3 hours with all materials included. You make a piece, glaze it, and many studios fire it for later pick-up or shipping.",ko:"バンコクには、初心者向けに手びねりやろくろ成形の短い体験教室を開いている小さな個人工房がたくさんあります。たいてい2〜3時間で、材料費込みです。自分で作って釉薬をかけると、工房で焼いてあとで取りに行ったり配送してくれたりするところが多いです。"},special:{en:"A calm, hands-on, screen-free activity that suits a team looking for something different from gaming and malls.",ko:"ゲームやショッピングモールとは違う体験を探しているチームに合う、静かで画面を見ない手作り体験です。"},bestTime:["morning","afternoon"],timeText:{en:"Daytime sessions; booking ahead is recommended, check each studio on Google Maps",ko:"昼間のクラスが多いです。事前予約がおすすめで、工房ごとにGoogleマップで確認"},cost:{min:800,max:1800},costNote:{en:"Typical beginner class estimate; varies by studio and what you make.",ko:"初心者クラスの目安の推定です。工房や作る作品によって変わります。"},duration:[2,3],area:"other",locationText:{en:"Small studios in Ari, Thonglor/Ekkamai and Thonburi (search on Maps)",ko:"アーリー、トンロー/エカマイ、トンブリーなどの小さな工房(地図で検索)"},transit:{en:'Depends on the studio. Search "pottery workshop Bangkok" on Google Maps and check the nearest BTS/MRT. (Confirm exit on Google Maps.)',ko:"工房によって異なります。Googleマップで「pottery workshop Bangkok」を検索し、最寄りのBTS/MRTを確認しましょう。(出口はGoogleマップで確認)"},indoor:"indoor",crowd:"both",energy:1,tags:["hidden-gem","team-bonding","rainy-day","relaxing","after-practice"],tips:{en:"Book ahead and confirm English or Japanese support, group size and whether firing and pick-up or shipping are included. Wear clothes you do not mind getting muddy, and trim long nails. Hands and wrists work gently, so it is a nice break from mouse/keyboard strain.",ko:"事前に予約し、英語・日本語の案内が可能か、人数、焼成(焼き)と受け取り・配送が含まれるかを確認しましょう。土がついても構わない服を着て、長い爪は切っていきましょう。手首をやさしく使うので、マウスやキーボードで疲れた手の良い休憩になります。"},mapsQuery:"pottery workshop Bangkok",imgQuery:"Pottery workshop hands clay wheel",imgAlt:"Hands shaping clay on a pottery wheel in a workshop",imgIllustrative:!0}]});var be,Vo=S(()=>{be=[{id:"siam",name:{en:"Siam",ko:"サイアム",th:"\u0E2A\u0E22\u0E32\u0E21"},tagline:{en:"Bangkok's shopping and Gen Z crossroads, all linked by skywalk",ko:"スカイウォークでモールがつながる、バンコクのZ世代の遊び場"},personality:{en:"Siam is where two BTS lines cross and half of Bangkok's youth seems to arrive at once. Air-conditioned malls (Siam Paragon, Siam Center, Siam Discovery, CentralWorld) sit shoulder to shoulder, linked by a skywalk, while the low-rise lanes of Siam Square below hold tiny fashion boutiques, dessert caf\xE9s and student-priced eateries. It is loud, bright and unapologetically commercial, and on weekends the crowds are thick. For a first-timer it is the easiest place in the city to eat, shop and cool off in one afternoon.",ko:"BTS2路線が交わるサイアムは、バンコクの若者が一斉に集まる街です。サイアム・パラゴン、サイアムセンター、サイアム・ディスカバリー、セントラルワールドがスカイウォークで連なっているので、エアコンの涼しさの中で一日中歩きまわれます。下のサイアムスクエアの路地には、小さなファッションショップ、スイーツカフェ、学生価格の食堂がぎっしりです。週末は本当に混んでうるさいですが、初めてバンコクに来た人が食べて、買い物して、暑さをしのぐには、これ以上の場所はありません。"},food:[{name:"Somtam Nua (Siam Square)",note:{en:"A Siam Square classic for papaya salad and crispy fried chicken; expect a queue at peak hours and ask for less spicy if you are unsure.",ko:"サイアムスクエアの老舗で、ソムタム(パパイヤサラダ)とカリカリのフライドチキンが人気のお店です。ピーク時は行列ができ、辛さが心配なら辛さ控えめでとお願いしましょう。"},mapsQuery:"Somtam Nua Siam Square Bangkok"},{name:"Mango Tango (Siam Square)",note:{en:"Dessert-only stop built around fresh mango, a popular post-shopping sugar hit.",ko:"生マンゴーをメインにしたデザート専門店です。買い物の途中の糖分補給にぴったりです。"},mapsQuery:"Mango Tango Siam Square Bangkok"},{name:"Paragon Food Hall (Siam Paragon, ground floor)",note:{en:"Big air-conditioned food court and supermarket area; easy, safe, and good for a large group that cannot agree on dinner.",ko:"サイアム・パラゴンの低層階にある大型フードホールです。メニューが豊富で、大人数で意見が分かれるときに便利です。"},mapsQuery:"Paragon Food Hall Siam Paragon Bangkok"},{name:"Food courts and restaurant floors in CentralWorld",note:{en:"Several floors of chain and local restaurants, plenty of Japanese options if you want a familiar meal.",ko:"セントラルワールドの複数のフロアにチェーン店とローカルの食堂があります。和食も多いので、慣れた味が恋しいときにおすすめです。"},mapsQuery:"CentralWorld food court Bangkok"}],cafes:[{name:"After You Dessert Caf\xE9 (Siam Paragon)",note:{en:"Famous for shaved ice and thick honey toast; a classic dessert stop, but waits can be long on weekends.",ko:"かき氷と厚切りハニートーストで有名なデザートカフェです。週末は待ち時間が長くなります。"},mapsQuery:"After You Dessert Cafe Siam Paragon Bangkok"},{name:"Caf\xE9s in Siam Square sois and Siam Discovery",note:{en:"Small, design-forward caf\xE9s tucked in the Siam Square lanes and inside Siam Discovery; walk the sois and pick whichever has a seat.",ko:"サイアムスクエアの路地とサイアム・ディスカバリーの中に、おしゃれな小さなカフェがたくさんあります。路地を歩いて、席が空いているお店を選んでみましょう。"},mapsQuery:"cafe Siam Square Soi Bangkok"}],shopping:[{name:"Siam Center and Siam Discovery",note:{en:"Thai designers, streetwear and lifestyle concept stores; the trendiest of the Siam malls.",ko:"タイのデザイナーブランド、ストリートウェア、ライフスタイルのセレクトショップが集まっています。サイアムのモールの中でいちばんトレンディです。"},mapsQuery:"Siam Discovery Bangkok"},{name:"MBK Center",note:{en:"Old-school mega-mall with hundreds of small stalls for phone accessories, souvenirs and cheap clothes; bargaining is normal and prices are not fixed everywhere.",ko:"スマホアクセサリー、お土産、安い服を売る小さなお店が数百軒集まった昔ながらのモールです。値切り交渉が一般的で、価格が固定でないお店が多いです。"},mapsQuery:"MBK Center Bangkok"},{name:"Siam Paragon and CentralWorld",note:{en:"The big, polished malls for international brands, electronics and cinemas.",ko:"海外ブランド、家電、映画館まで揃った大型で洗練されたモールです。"},mapsQuery:"Siam Paragon Bangkok"}],activities:[{en:"Mall-hop along the skywalk from Siam to Chit Lom, free air-conditioning included",ko:"サイアムからチットロムまでスカイウォークに沿ってモールをはしご(エアコンはおまけ)"},{en:"Browse the fashion boutiques and dessert caf\xE9s in the Siam Square lanes",ko:"サイアムスクエアの路地のファッションショップとスイーツカフェを見てまわる"},{en:"Visit the Jim Thompson House, a quiet teak-house museum near National Stadium BTS",ko:"ナショナルスタジアム駅近くのチーク材の木造家屋博物館、ジム・トンプソンの家を見学する"},{en:"Hunt for souvenirs and phone gear in MBK Center",ko:"MBKセンターでお土産とスマホアクセサリーを探す"},{en:"See the Siam Paragon aquarium (Sea Life) if you want an indoor rainy-day option",ko:"雨の日は、サイアム・パラゴンの水族館(シーライフ)へ"}],duration:{en:"Half day (3\u20135 h)",ko:"半日(3〜5時間)"},budget:{level:2,text:{en:"\u2248 500\u20131,500 THB per person excluding big purchases (estimate)",ko:"1人あたり約500〜1,500バーツ、大きな買い物は除く(推定)"}},bestTime:{en:"Weekday late morning or early afternoon; avoid Saturday evenings if you hate crowds. Malls typically open late morning and close around 21:00\u201322:00 (check each mall).",ko:"平日の午前の遅い時間〜午後の早い時間がいちばんゆったりです。人混みが苦手なら土曜の夜は避けましょう。モールはたいてい午前の遅い時間に開き、夜9〜10時ごろに閉まります(モールごとに確認)。"},stations:[{name:"BTS Siam",line:"BTS Sukhumvit Line and Silom Line interchange"},{name:"BTS National Stadium",line:"BTS Silom Line"},{name:"BTS Chit Lom",line:"BTS Sukhumvit Line"}],route:[{en:"Start: BTS National Stadium; walk to the Jim Thompson House for a calm morning.",ko:"出発:BTSナショナルスタジアム駅。ジム・トンプソンの家で静かな朝を始めましょう。"},{en:"Cross to MBK Center for souvenirs and a quick browse (budget 45\u201360 min).",ko:"MBKセンターに移動してお土産を見てまわります(45〜60分くらい)。"},{en:"Take the skywalk to Siam Discovery and Siam Center for Thai design and streetwear.",ko:"スカイウォークでサイアム・ディスカバリー、サイアムセンターまで歩いて、タイのデザインショップとストリートウェアを見ます。"},{en:"Drop down to Siam Square for lunch (Somtam Nua) and a mango dessert.",ko:"サイアムスクエアに下りてランチ(ソムタム・ヌア)とマンゴーデザート。"},{en:"Finish at Siam Paragon for the food hall or an after-dinner dessert, then BTS from Siam.",ko:"最後はサイアム・パラゴンのフードホールかデザート。そのあとサイアム駅からBTSで帰ります。"}],knowBefore:{en:"Crowded and loud on weekends; keep bags zipped on the skywalk and in MBK. Malls are over-air-conditioned, so carry a thin layer. Bargain only at stalls (MBK, Siam Square), not in department stores.",ko:"週末は本当に混むので、スカイウォークとMBKではバッグを前に抱えましょう。モール内はエアコンが強いので、薄手の羽織りものが必要です。値切りはMBKやサイアムスクエアの屋台だけにして、デパートではしません。"},geoQuery:"Siam Square, Pathum Wan, Bangkok",mapsQuery:"Siam Square Bangkok",imgQuery:"Siam Square Bangkok",imgAlt:"Crowded street and signs at Siam Square in Bangkok"},{id:"ari",name:{en:"Ari",ko:"アーリー",th:"\u0E2D\u0E32\u0E23\u0E35\u0E22\u0E4C"},tagline:{en:"Specialty coffee and a slow, lived-in neighborhood rhythm",ko:"スペシャルティコーヒーと、のんびりした街の雰囲気があるところ"},personality:{en:"Ari feels like the Bangkok that locals actually live in: tree-lined sois, shophouse caf\xE9s, small restaurants and office workers on lunch break. It lacks big landmarks, which is exactly the point; you come to wander, sit by a window with a good coffee and let the afternoon go slowly. The vibe is calmer and more residential than Siam or Sukhumvit. The trade-off is that sights are spread out and sois can be hot with little shade.",ko:"アーリーは、バンコクの人が実際に暮らしている街のような雰囲気です。並木の続く路地、ショップハウスのカフェ、小さな食堂、お昼休みの会社員たちが風景です。大きなランドマークはありませんが、それが魅力です。窓際に座って良いコーヒーを飲みながら、のんびり午後を過ごすのにぴったりです。サイアムやスクンビットよりずっと静かで生活感があります。そのぶん見どころが点在していて、路地は日陰が少なく暑いことがあります。"},food:[{name:"Soi Ari 1 (Phahon Yothin Soi 7) lunch stalls and shophouse eateries",note:{en:"Local Thai lunch spots popular with office workers; look for the places with a queue at 12:00.",ko:"会社員が好んで通うローカルのタイ料理店街です。お昼の12時に行列ができているお店を選べば失敗が少ないです。"},mapsQuery:"Soi Ari 1 restaurants Bangkok"},{name:"Soi Ari 4 casual restaurants and bars",note:{en:"A short soi packed with small restaurants and bars that get livelier after sunset.",ko:"小さなレストランとバーが集まる路地です。日が暮れるとさらに活気が出ます。"},mapsQuery:"Soi Ari 4 Bangkok restaurants"},{name:"Street food near BTS Ari exits",note:{en:"Grilled meats, noodles and fruit stalls around the station; handy for a cheap, quick bite.",ko:"駅周辺に串焼き、麺、フルーツの屋台があります。安く手早く食事を済ませるのに便利です。"},mapsQuery:"street food BTS Ari Bangkok"}],cafes:[{name:"Specialty coffee shops around Soi Ari 1 and Soi Ari 4",note:{en:"Ari has one of Bangkok's densest clusters of independent coffee roasters and brunch caf\xE9s; wander and pick one with natural light.",ko:"アーリーはバンコクでも個人経営のロースタリーとブランチカフェが特に集中しているエリアの1つです。歩きまわって、光がよく入るお店を選んでみましょう。"},mapsQuery:"specialty coffee Ari Bangkok"},{name:"Brunch caf\xE9s in converted houses",note:{en:"Several caf\xE9s are set in renovated homes with small gardens; great for a quiet laptop session or recovery morning.",ko:"改装した住宅に小さな庭のあるカフェが多いです。ノートPC作業や、回復のための静かな朝にぴったりです。"},mapsQuery:"brunch cafe Ari Bangkok"}],shopping:[{name:"Independent boutiques and vintage shops on Soi Ari 4 and nearby sois",note:{en:"Small, low-key fashion and home-goods shops; hours vary, and some open late.",ko:"小さくて控えめなファッション・雑貨のお店です。営業時間はまちまちで、遅く開けるお店もあります。"},mapsQuery:"boutique shops Ari Bangkok"},{name:"Or Tor Kor Market (a short ride away, MRT Kamphaeng Phet)",note:{en:"One of Bangkok's best-known fresh markets, great for tropical fruit and prepared foods. Confirm the route on Google Maps.",ko:"バンコクで指折りの生鮮市場で、トロピカルフルーツやお惣菜がおすすめです。ルートはGoogleマップで確認してください。"},mapsQuery:"Or Tor Kor Market Bangkok"}],activities:[{en:"Coffee-hop between two or three independent caf\xE9s",ko:"個人経営のカフェを2、3軒はしごしてコーヒーを飲む"},{en:"Slow shophouse and mural stroll along Soi Ari 4 and neighboring lanes",ko:"ソイ・アーリー4と周辺の路地をショップハウスと壁画を見ながら散歩する"},{en:"Late lunch with office-worker crowds at a local Thai restaurant",ko:"会社員でにぎわうローカルのタイ料理店で遅めのランチ"},{en:"Evening drink in the small bars off Soi Ari 4",ko:"ソイ・アーリー4の小さなバーで夜の一杯"}],duration:{en:"Half day (3\u20134 h)",ko:"半日(3〜4時間)"},budget:{level:2,text:{en:"\u2248 500\u20131,000 THB per person incl. food & coffee (estimate)",ko:"1人あたり約500〜1,000バーツ、食事・コーヒー込み(推定)"}},bestTime:{en:"Late morning to mid-afternoon on a weekday for coffee; early evening for dinner. Some caf\xE9s close early, so check hours.",ko:"コーヒー目的なら平日の午前の遅い時間〜午後の中ごろ。夕食は早めの夕方がおすすめです。早く閉まるカフェもあるので営業時間を確認してください。"},stations:[{name:"BTS Ari",line:"BTS Sukhumvit Line"},{name:"BTS Sanam Pao",line:"BTS Sukhumvit Line"}],route:[{en:"Start: BTS Ari, exit toward Phahon Yothin Soi 7 (Soi Ari 1).",ko:"出発:BTSアーリー駅。パホンヨーティン7番ソイ(ソイ・アーリー1)方面の出口へ。"},{en:"Walk Soi Ari 1 for breakfast or a first coffee at a shophouse caf\xE9.",ko:"ソイ・アーリー1を歩きながら、ショップハウスのカフェで朝食か最初のコーヒー。"},{en:"Cut across to Soi Ari 4 for boutiques, mural corners and a second caf\xE9.",ko:"ソイ・アーリー4に移動して、ブティック、壁画コーナー、2軒目のカフェ。"},{en:"Lunch at a local Thai spot on one of the sois (follow the lunchtime queue).",ko:"路地のローカルなタイ料理店でランチ(お昼時に行列のできているお店で)。"},{en:"Optional: BTS to Mo Chit/MRT to Kamphaeng Phet for Or Tor Kor Market (confirm route on Google Maps).",ko:"オプション:BTSとMRTでカムペーンペット駅近くのオートーコー市場へ(ルートはGoogleマップで確認)。"}],knowBefore:{en:"Sois are quiet but have little shade; midday heat can be intense. Footpaths are narrow and uneven, so watch for motorbikes. Many caf\xE9s fill up on weekend mornings.",ko:"路地は静かですが日陰が少なく、日中の暑さはかなり厳しいです。歩道は狭くてでこぼこしていて、バイクも通るので気をつけてください。週末の午前はカフェがすぐ満席になります。"},geoQuery:"Ari, Phaya Thai, Bangkok",mapsQuery:"Ari Bangkok",imgQuery:"Ari Bangkok",imgAlt:"A quiet street and caf\xE9s in Ari, Bangkok"},{id:"song-wat",name:{en:"Song Wat",ko:"ソンワット",th:"\u0E16\u0E19\u0E19\u0E17\u0E23\u0E07\u0E27\u0E32\u0E14"},tagline:{en:"Creative caf\xE9s inside crumbling century-old Chinese shophouses",ko:"築100年の中国風ショップハウスに入ったクリエイティブなカフェ通り"},personality:{en:"Song Wat Road runs between Chinatown and the river, a lane of old trading warehouses and narrow Sino-Portuguese shophouses that once served the port. Peeling plaster, tiled facades and heavy wooden doors now share space with specialty coffee, galleries and small design spaces. It is quieter than Yaowarat but not empty, and much of the charm is simply looking up at the architecture. Pavements are tight and traffic can squeeze through at lunchtime, so go slowly.",ko:"ソンワット通りはチャイナタウンとチャオプラヤー川の間を走る、昔の貿易倉庫が並ぶ通りです。かつて港を支えた細い中国・ポルトガル風のショップハウスが連なっています。はがれた漆喰、タイル張りの外観、重厚な木の扉のあいだに、スペシャルティコーヒーのお店、ギャラリー、小さなデザインスペースが入っています。ヤワラートより静かですが、まったく人がいないわけでもなく、上を見上げて建築を眺めるのがいちばんの楽しみです。歩道が狭く、お昼どきは車が通るので、ゆっくり歩きましょう。"},food:[{name:"Old Chinese shophouse eateries along Song Wat Road",note:{en:"Small, no-frills places serving noodles, rice dishes and simple Chinese-Thai plates; many are lunch-focused and close by late afternoon.",ko:"麺、ご飯もの、簡単な中華風タイ料理を出す素朴なお店です。ランチ中心で、夕方になる前に閉まるお店が多いです。"},mapsQuery:"restaurants Song Wat Road Bangkok"},{name:"Yaowarat street food (a short walk east)",note:{en:"The famous Chinatown street-food stretch is walkable from Song Wat for dinner.",ko:"有名なチャイナタウンの屋台通りが歩ける距離なので、夜はそちらに行くのがおすすめです。"},mapsQuery:"Yaowarat Road street food Bangkok"},{name:"Riverside snacks near Ratchawong Pier",note:{en:"Small vendors around the pier area sell drinks and quick bites while you wait for a boat.",ko:"ラーチャウォン船着場周辺では、ボートを待つあいだに飲み物や軽食を買える屋台があります。"},mapsQuery:"Ratchawong Pier Bangkok"}],cafes:[{name:"Specialty coffee shops in renovated Song Wat shophouses",note:{en:"Several independent caf\xE9s occupy restored buildings with high ceilings and original tile floors; hours vary, so check before you walk there.",ko:"修復された建物に、高い天井と昔のタイルの床を生かした個人経営のカフェがあります。営業時間はまちまちなので、歩いて行く前に確認してください。"},mapsQuery:"cafe Song Wat Road Bangkok"},{name:"Small galleries with a coffee counter",note:{en:"Some creative spaces combine a gallery corner and a caf\xE9; a calm place to sit out the afternoon heat.",ko:"ギャラリーとカフェを兼ねた小さなスペースがあります。午後の暑さを避けて休むのにぴったりです。"},mapsQuery:"gallery cafe Song Wat Bangkok"}],shopping:[{name:"Sampeng Lane (Soi Wanit 1) wholesale market",note:{en:"A narrow, crowded alley of wholesale trinkets, stationery and accessories; bring small bills, and watch your bag.",ko:"卸売の雑貨、文房具、アクセサリーが集まる狭くて混んだ路地です。小銭を用意し、バッグに気をつけてください。"},mapsQuery:"Sampeng Lane Bangkok"},{name:"Small design and craft shops on Song Wat Road",note:{en:"A few boutique shops and workshops; limited and irregular opening hours.",ko:"小さなデザイン・クラフトショップが何軒かあります。営業時間は不定期で限られています。"},mapsQuery:"shop Song Wat Road Bangkok"}],activities:[{en:"Photograph the faded Sino-Portuguese shophouse facades and old warehouse doors",ko:"色あせた中国・ポルトガル風のショップハウスの外観と古い倉庫の扉を写真に撮る"},{en:"Spend an afternoon in a caf\xE9 housed in a restored shophouse",ko:"修復されたショップハウスのカフェで午後を過ごす"},{en:"Walk the street end to end and pop into small galleries",ko:"通りを端から端まで歩いて、小さなギャラリーに立ち寄る"},{en:"Continue on foot to Talat Noi or Yaowarat for the rest of the day",ko:"徒歩でタラートノーイかヤワラートに移動して、一日を続ける"}],duration:{en:"Half day (2\u20134 h)",ko:"半日(2〜4時間)"},budget:{level:2,text:{en:"\u2248 400\u2013900 THB per person incl. food & coffee (estimate)",ko:"1人あたり約400〜900バーツ、食事・コーヒー込み(推定)"}},bestTime:{en:"Weekday morning to early afternoon, before shops close and before the heat peaks. Many places are closed on Mondays or close by early evening, so check.",ko:"平日の午前〜午後の早い時間がおすすめです。暑さがピークになる前、お店が閉まる前に。月曜休みや夕方早めに閉まるところが多いので確認してください。"},stations:[{name:"Ratchawong Pier",line:"Chao Phraya Express boat; confirm pier and boat line on Google Maps"},{name:"MRT Wat Mangkon",line:"MRT Blue Line (about a 15\u201320 min walk)"}],route:[{en:"Start: Ratchawong Pier, a short walk to the Song Wat Road entrance.",ko:"出発:ラーチャウォン船着場から、ソンワット通りの入口まで少し歩きます。"},{en:"Walk Song Wat Road, looking up at the shophouse facades and old warehouse doors.",ko:"ソンワット通りを歩きながら、ショップハウスの外観と古い倉庫の扉を見上げます。"},{en:"Coffee break at a caf\xE9 in a restored building.",ko:"修復された建物のカフェでコーヒーブレイク。"},{en:"Detour into Sampeng Lane (Soi Wanit 1) for a market browse.",ko:"サムペン・レーン(ソイ・ワーニット1)に寄り道して市場をのぞきます。"},{en:"Evening: walk to Yaowarat Road for street food (or on to Talat Noi).",ko:"夜:ヤワラート通りまで歩いて屋台グルメ(またはタラートノーイへ)。"}],knowBefore:{en:"Pavements are narrow and shared with trucks and motorbikes; stay alert. Little shade and strong afternoon sun. Many caf\xE9s keep irregular hours, and the area quiets down after dark.",ko:"歩道は狭く、トラックやバイクも通るので、注意が必要です。日陰が少なく、午後の日差しが強いです。カフェの営業時間は不定期で、日が暮れると静かになります。"},geoQuery:"Soi Song Wat, Samphanthawong, Bangkok",mapsQuery:"Song Wat Road Bangkok",imgQuery:"Song Wat Road Bangkok",imgAlt:"Old Chinese-style shophouses along Song Wat Road in Bangkok"},{id:"talat-noi",name:{en:"Talat Noi",ko:"タラートノーイ",th:"\u0E15\u0E25\u0E32\u0E14\u0E19\u0E49\u0E2D\u0E22"},tagline:{en:"Street photography, Chinese-Thai shrines and riverside grit",ko:"路地のスナップ写真、中国・タイの祠、川沿いの無骨な魅力"},personality:{en:"Talat Noi is one of Bangkok's oldest districts, a tangle of alleys beside the river where Chinese shrines, auto-parts workshops, murals and family-run coffee shops all share the same crooked lanes. Incense drifts from small shrines while mechanics hammer metal next door. It is photogenic, but it is also a working neighborhood, so respect people's homes and shops. The mix of old and new, sacred and greasy, is what makes it special.",ko:"タラートノーイはバンコクで最も古い地区の1つです。川沿いの入り組んだ路地に、中国の祠、自動車部品の工房、壁画、家族経営のコーヒーショップがひとつになって並んでいます。小さな祠からは線香の香りが漂い、すぐ隣では整備工が金属を叩いています。フォトジェニックですが、人が暮らし働いている街でもあるので、お店や家には敬意を払ってください。古いものと新しいもの、神聖さと油汚れが混ざり合っているのが、この街の魅力です。"},food:[{name:"Old-style Chinese-Thai eateries in the Talat Noi alleys",note:{en:"Family-run places serving noodles, congee and simple rice dishes, often lunch-focused. Point and smile if there is no English menu.",ko:"麺、お粥、簡単なご飯ものを出す家族経営のお店です。ランチ中心のところが多く、英語メニューがなければ指さしでOKです。"},mapsQuery:"restaurants Talat Noi Bangkok"},{name:"Yaowarat Road night street food (walkable)",note:{en:"Chinatown's food streets are a short walk away and make a natural dinner follow-up.",ko:"チャイナタウンの食べ歩き通りが近いので、夕食はそちらに続けるのが自然です。"},mapsQuery:"Yaowarat Road street food Bangkok"},{name:"Small coffee-shop snacks along Soi Wanit 2 and nearby alleys",note:{en:"Tiny shopfront coffee stalls and traditional sweets; casual and cheap.",ko:"小さな店先のコーヒースタンドと伝統的なお菓子があります。気軽で安いです。"},mapsQuery:"coffee Talat Noi Bangkok"}],cafes:[{name:"Warehouse 30 caf\xE9s and creative spaces",note:{en:"A renovated 1940s warehouse complex off Charoen Krung Soi 30 with caf\xE9s, design shops and a gallery-like feel. Confirm which tenants are open before you go.",ko:"チャルンクルン30番ソイ沿いの、1940年代の倉庫を改装した複合スペースです。カフェ、デザインショップ、ギャラリーのような雰囲気があります。行く前にどのテナントが営業しているか確認してください。"},mapsQuery:"Warehouse 30 Bangkok"},{name:"Independent caf\xE9s in renovated shophouses nearby",note:{en:"A handful of small coffee shops cluster along the alleys; hours are irregular.",ko:"路地沿いに小さなコーヒーショップが何軒か集まっています。営業時間は不定期です。"},mapsQuery:"cafe Talat Noi Bangkok"}],shopping:[{name:"Warehouse 30 design shops",note:{en:"Small creative retail and studios inside the warehouse; more browsing than shopping.",ko:"倉庫内の小さなクリエイティブショップとスタジオです。買い物というより見て楽しむ場所です。"},mapsQuery:"Warehouse 30 Charoen Krung Soi 30 Bangkok"},{name:"Vintage spare-part and antique shops in the alleys",note:{en:"Piles of old auto and machine parts and curios; fun to photograph, rarely practical to buy.",ko:"古い車や機械の部品、骨董品が積まれたお店が並んでいます。写真を撮るには最高ですが、実際に買うにはちょっと微妙です。"},mapsQuery:"antique shops Talat Noi Bangkok"}],activities:[{en:"Street photography: murals, rusty parts, shrine details and riverfront light",ko:"ストリートフォト：壁画、錆びた部品、祠のディテール、川沿いの光"},{en:"Visit small Chinese-Thai shrines (dress modestly, no loud talking, ask before photographing worshippers)",ko:"小さな中華系タイ式の祠を訪問（控えめな服装で、大声は禁止、参拝者を撮る前に許可をもらう）"},{en:"See the Holy Rosary (Kalawar) Church, a historic church near the riverside",ko:"川沿いにある歴史的なホーリーロザリー教会（カラワー教会）を見学"},{en:"Wander the riverside lanes and watch the boats",ko:"川沿いの路地を歩きながら船を眺める"},{en:"Cross to the other bank for Lhong 1919 or ICONSIAM by boat",ko:"ボートで川を渡り、ロン1919やアイコンサイアムへ移動"}],duration:{en:"Half day (2\u20134 h)",ko:"半日（2〜4時間）"},budget:{level:1,text:{en:"\u2248 300\u2013700 THB per person incl. food & coffee (estimate)",ko:"1人あたり約300〜700バーツ、食事・コーヒー込み（目安）"}},bestTime:{en:"Early morning or late afternoon for softer light and cooler air; avoid midday heat. Weekdays are quieter.",ko:"柔らかい光と涼しい空気を楽しむなら、早朝か夕方がおすすめです。真昼は避けて、平日のほうが空いています。"},stations:[{name:"Ratchawong Pier",line:"Chao Phraya Express boat; confirm pier on Google Maps"},{name:"MRT Hua Lamphong",line:"MRT Blue Line (about a 15\u201320 min walk or short ride)"}],route:[{en:"Start: Ratchawong Pier or MRT Hua Lamphong, then walk to Talat Noi.",ko:"出発：ラチャウォン船着き場かMRTファラムポーン駅から、タラートノイまで歩きます。"},{en:"Wander the alley network for murals, old parts shops and small Chinese shrines.",ko:"路地を歩いて、壁画、部品店、小さな中華系の祠を見て回ります。"},{en:"Stop at the Holy Rosary (Kalawar) Church area near the river.",ko:"川の近くのホーリーロザリー教会エリアに立ち寄ります。"},{en:"Coffee or lunch at a small caf\xE9 or eatery in the lanes.",ko:"路地の小さなカフェや食堂でコーヒーかランチ。"},{en:"Finish at Warehouse 30, or walk to Song Wat Road and Yaowarat for dinner.",ko:"最後はウェアハウス30、またはソンワット通りとヤワラートまで歩いてディナー。"}],knowBefore:{en:"Lanes are narrow, uneven and shared with motorbikes and delivery trucks. Dress modestly at shrines, avoid pointing cameras at people, and do not enter workshops uninvited. Heat is intense midday; pack water.",ko:"路地は狭くてでこぼこで、バイクや配達トラックも通ります。祠では控えめな服装を心がけ、人にカメラを向けないでください。許可なく工房に入らないでください。真昼は暑いので水を持っていきましょう。"},geoQuery:"Talat Noi, Samphanthawong, Bangkok",mapsQuery:"Talat Noi Bangkok",imgQuery:"Talat Noi Bangkok",imgAlt:"Narrow alley with murals and old shophouses in Talat Noi, Bangkok"},{id:"charoen-krung",name:{en:"Charoen Krung",ko:"チャルンクルン",th:"\u0E40\u0E08\u0E23\u0E34\u0E0D\u0E01\u0E23\u0E38\u0E07"},tagline:{en:"Galleries, design studios and heritage buildings on Bangkok's oldest road",ko:"バンコク最古の道路沿いにあるギャラリーとデザインスタジオ"},personality:{en:"Charoen Krung is Bangkok's oldest paved road, and its riverside stretch around Bang Rak is where the city's creative scene has been reclaiming old warehouses, colonial-era buildings and shophouses. You can pass a Catholic cathedral, a grand old post office turned design center and a contemporary gallery within a few blocks. It is less polished than Sukhumvit and less packed than Chinatown, which makes it a rewarding wander if you like art, architecture and quiet corners. Distances are longer than they look on the map.",ko:"チャルンクルンはバンコクで最も古い舗装道路です。バーンラック周辺の川沿いエリアは、古い倉庫、コロニアル風の建物、ショップハウスを再生したバンコクのクリエイティブシーンの中心です。数ブロックの間にカトリック教会、郵便局からデザインセンターに生まれ変わった建物、現代的なギャラリーが並びます。スクンビットほど洗練されておらず、ヤワラートほど混んでいないので、アート、建築、静かな一角が好きなら歩く楽しみが大きいです。地図で見るより距離があります。"},food:[{name:"Charoen Krung street and shophouse eateries around Soi 28\u201332",note:{en:"Mixed local lunch spots and street stalls; good for a cheap, unfussy meal between galleries.",ko:"ギャラリーの合間に安く気軽に食べられるローカル食堂や屋台です。"},mapsQuery:"restaurants Charoen Krung Soi 28 Bangkok"},{name:"Riverside restaurants near River City and Si Phraya Pier",note:{en:"Mid-range and upscale river-view dining; check the menu prices before sitting down.",ko:"川の眺めが楽しめる中〜高級レストランです。座る前にメニューの価格を必ず確認してください。"},mapsQuery:"restaurants River City Bangkok"},{name:"Bang Rak local noodle and rice shops",note:{en:"The older Bang Rak blocks are full of small shopfront noodle and rice-curry places that locals use daily.",ko:"古いバーンラックのエリアには、地元の人が毎日通う小さな麺類・ぶっかけご飯のお店がたくさんあります。"},mapsQuery:"noodle shop Bang Rak Bangkok"}],cafes:[{name:"Caf\xE9s in Warehouse 30 and the creative lanes off Soi 30",note:{en:"Coffee in industrial-chic spaces; a great escape from the heat.",ko:"インダストリアルなおしゃれ空間のカフェです。暑さしのぎにぴったりです。"},mapsQuery:"cafe Charoen Krung Soi 30 Bangkok"},{name:"Independent coffee shops around Charoen Krung Soi 28\u201336",note:{en:"A rotating cast of small caf\xE9s in old shophouses; opening hours vary, so confirm on Google Maps.",ko:"古いショップハウスに入っている小さなカフェは入れ替わりが多いです。営業時間はGoogleマップで確認してください。"},mapsQuery:"specialty coffee Charoen Krung Bangkok"}],shopping:[{name:"River City Bangkok (art and antiques)",note:{en:"A riverside complex known for antiques, art galleries and auctions; browse-friendly, rarely cheap.",ko:"骨董品、アートギャラリー、オークションで知られる川沿いの複合施設です。見て回るには楽しいですが、安くはありません。"},mapsQuery:"River City Bangkok"},{name:"Warehouse 30 and nearby design shops",note:{en:"Small studios and shops in the restored warehouse complex.",ko:"復元された倉庫群にある小さなスタジオやショップです。"},mapsQuery:"Warehouse 30 Bangkok"}],activities:[{en:"Gallery-hop between independent art spaces and River City Bangkok",ko:"独立系ギャラリーとリバーシティ・バンコクを巡って展示を見る"},{en:"See the Assumption Cathedral, one of Bangkok's best-known Catholic churches",ko:"バンコクを代表するカトリック教会のひとつ、アサンプション大聖堂を見学"},{en:"Visit the Thailand Creative & Design Center in the old Grand Postal Building",ko:"旧中央郵便局の建物にあるタイ・クリエイティブ＆デザインセンター（TCDC）を訪問"},{en:"Photograph heritage facades and colonial-era buildings along the road",ko:"道沿いの歴史的な建物やコロニアル風の建物を撮影"},{en:"Take a Chao Phraya Express boat from Si Phraya Pier for a river view",ko:"シープラヤ船着き場からチャオプラヤー・エクスプレスに乗って川の景色を楽しむ"}],duration:{en:"Half day (3\u20134 h)",ko:"半日（3〜4時間）"},budget:{level:2,text:{en:"\u2248 500\u20131,200 THB per person incl. food & coffee (estimate; gallery entry mostly free to low)",ko:"1人あたり約500〜1,200バーツ、食事・コーヒー込み（目安、ギャラリーの入場はほぼ無料〜安め）"}},bestTime:{en:"Weekday late morning to afternoon; many galleries close on Mondays and open late. Check hours before you go.",ko:"平日の午前遅めから午後がおすすめです。月曜休みで遅く開くギャラリーが多いので、行く前に確認してください。"},stations:[{name:"Si Phraya / River City Pier",line:"Chao Phraya Express boat; confirm pier on Google Maps"},{name:"MRT Hua Lamphong",line:"MRT Blue Line (a longer walk or short taxi)"},{name:"BTS Saphan Taksin",line:"BTS Silom Line (for the southern end of the road)"}],route:[{en:"Start: Si Phraya Pier / River City Bangkok for galleries and antiques.",ko:"出発：シープラヤ船着き場／リバーシティ・バンコクでギャラリーと骨董品を見ます。"},{en:"Walk to Warehouse 30 on Charoen Krung Soi 30 for a caf\xE9 and design shops.",ko:"チャルンクルン30番ソイのウェアハウス30まで歩いて、カフェとデザインショップへ。"},{en:"Continue along Charoen Krung to the Grand Postal Building (TCDC).",ko:"チャルンクルン沿いに旧中央郵便局の建物（TCDC）まで進みます。"},{en:"Pass the Assumption Cathedral and stop for a late lunch in Bang Rak.",ko:"アサンプション大聖堂を通り過ぎて、バーンラックで遅めのランチ。"},{en:"Finish by boat from the nearby pier or BTS Saphan Taksin (confirm on Google Maps).",ko:"最後は近くの船着き場のボートか、BTSサパーンタクシン駅で（Googleマップで確認）。"}],knowBefore:{en:"The road is long, hot and busy with traffic; use a taxi or Grab between clusters. Opening hours for galleries are irregular, and some are closed on Mondays. Pavements are uneven.",ko:"道が長くて暑く、車も多いです。エリアの間はタクシーかGrabが楽です。ギャラリーの営業時間は不規則で、月曜休みのところもあります。歩道はでこぼこです。"},geoQuery:"Charoen Krung Road, Bang Rak, Bangkok",mapsQuery:"Charoen Krung Road Bangkok",imgQuery:"Charoen Krung Road Bangkok",imgAlt:"Historic buildings along Charoen Krung Road in Bangkok"},{id:"yaowarat",name:{en:"Yaowarat (Chinatown)",ko:"ヤワラート（チャイナタウン）",th:"\u0E40\u0E22\u0E32\u0E27\u0E23\u0E32\u0E0A"},tagline:{en:"Neon, woks and the most intense street-food night in Bangkok",ko:"ネオンと中華鍋の炎、バンコクで一番熱い屋台グルメの夜"},personality:{en:"After sunset Yaowarat Road turns into a river of neon signs, smoke and plastic stools. Stalls spill onto the pavement serving roast duck, grilled seafood, oyster omelets, noodles and Chinese desserts, while gold shops and traditional medicine stores keep their old rhythms. It is touristy at the main stretch, with higher prices and long queues, but the side sois and old-school stalls still feel local. It is loud, hot, crowded and totally worth it.",ko:"日が暮れるとヤワラート通りは、ネオンサインと煙とプラスチックの椅子の川に変わります。屋台が歩道まで広がり、ローストダック、シーフードの炭火焼き、牡蠣のお好み焼き風オムレツ、麺類、中華スイーツを売っています。金行や漢方薬店は変わらず自分たちのペースを守っています。メインの通りは観光客が多く、値段が高く行列も長いですが、脇道や昔ながらの屋台は今でもローカルな雰囲気です。うるさくて暑くて混んでいますが、行く価値は十分あります。"},food:[{name:"Yaowarat Road night street-food stretch",note:{en:"The signature experience: grilled seafood, roast meats, noodles and sweets from the stalls that set up around evening. Check prices before ordering seafood.",ko:"ヤワラートの代表的な体験です。夕方に屋台が開くと、シーフードの焼き物、ローストした肉、麺類、スイーツが楽しめます。シーフードは注文前に必ず値段を確認してください。"},mapsQuery:"Yaowarat Road street food Bangkok"},{name:"T&K Seafood",note:{en:"A famous open-air seafood restaurant on the Yaowarat stretch, usually busy in the evening; ask for prices before ordering by weight.",ko:"ヤワラート通り沿いにある有名な屋外シーフードレストランです。夜はいつも混んでいます。重さ単位で注文するメニューは先に値段を確認してください。"},mapsQuery:"T&K Seafood Yaowarat Bangkok"},{name:"Nai Mong Hoi Tod (oyster omelet)",note:{en:"A well-known Yaowarat spot for crispy oyster omelets and mussel pancakes.",ko:"サクサクの牡蠣オムレツとムール貝のパンケーキで有名なヤワラートのお店です。"},mapsQuery:"Nai Mong Hoi Tod Yaowarat Bangkok"},{name:"Soi Texas (Yaowarat) stalls",note:{en:"A side soi known for old-school street-food stalls, including noodle and congee vendors popular with locals.",ko:"麺類やお粥を売る昔ながらの屋台がある脇道です。地元の人に人気です。"},mapsQuery:"Soi Texas Yaowarat Bangkok"}],cafes:[{name:"Soi Nana caf\xE9s and bars (Chinatown)",note:{en:"A trendy side lane with caf\xE9s, bars and shophouse restaurants for a slower, cooler break from the main road.",ko:"大通りから一歩入ったおしゃれな路地です。カフェ、バー、ショップハウスのレストランがあり、ひと息つくのにぴったりです。"},mapsQuery:"Soi Nana Chinatown Bangkok cafe"},{name:"Traditional Chinese dessert shops",note:{en:"Warm sesame soup, ginkgo sweet soup and herbal jelly; a sweet counterpoint to the savory street food.",ko:"温かいごまのデザート、ぎんなんのデザート、薬草ゼリーなど、塩気のある屋台飯のあとの甘いしめにおすすめです。"},mapsQuery:"Chinese dessert shop Yaowarat Bangkok"}],shopping:[{name:"Sampeng Lane (Soi Wanit 1)",note:{en:"A narrow wholesale lane for cheap accessories, stationery and souvenirs; extremely crowded, so keep your bag in front.",ko:"安いアクセサリー、文房具、お土産を売る卸売の路地です。極端に混むので、バッグは前に持ってください。"},mapsQuery:"Sampeng Lane Bangkok"},{name:"Pahurat Market (Little India fabrics)",note:{en:"A bustling fabric and trimmings market with an Indian flavor, a short walk west of Yaowarat.",ko:"ヤワラートから西へ少し歩くとある、インド風の生地・装飾品市場です。"},mapsQuery:"Pahurat Market Bangkok"}],activities:[{en:"Eat your way along Yaowarat Road after sunset",ko:"日が暮れてからヤワラート通り沿いを食べ歩き"},{en:"Visit Wat Mangkon Kamalawat, a major Chinese Buddhist temple",ko:"中国系仏教寺院ワット・マンコン・カマラワートを訪問"},{en:"Take photos at the Chinatown Gate (Odeon Circle) and the glowing signs",ko:"チャイナタウン・ゲート（オデオン・サークル）と光る看板を撮影"},{en:"Browse Sampeng Lane and Pahurat Market for souvenirs",ko:"サンペーン・レーンとパフラット市場でお土産を見て回る"},{en:"Try late-night sweets before heading back",ko:"帰る前に夜食スイーツをもうひとつ"}],duration:{en:"Evening (2\u20134 h)",ko:"夕方（2〜4時間）"},budget:{level:2,text:{en:"\u2248 400\u20131,000 THB per person depending on how much seafood you order (estimate)",ko:"1人あたり約400〜1,000バーツ、シーフードの注文量によります（目安）"}},bestTime:{en:"From about 18:00 into the night, when the street stalls open. Daytime is for temples, markets and fabrics. Weeknights are less packed than weekends.",ko:"屋台が開く午後6時ごろから夜までが最高です。昼間は寺院、市場、生地屋が中心です。週末より平日の夜のほうが空いています。"},stations:[{name:"MRT Wat Mangkon",line:"MRT Blue Line"},{name:"MRT Hua Lamphong",line:"MRT Blue Line"},{name:"MRT Sam Yot",line:"MRT Blue Line (closer to the Pahurat side)"}],route:[{en:"Start: MRT Wat Mangkon; visit Wat Mangkon Kamalawat.",ko:"出発：MRTワットマンコン駅。ワット・マンコン・カマラワートを訪問。"},{en:"Walk down Yaowarat Road toward the Chinatown Gate (Odeon Circle).",ko:"ヤワラート通りに沿ってチャイナタウン・ゲート（オデオン・サークル）方面へ歩きます。"},{en:"Dinner: sample street food and dip into Soi Texas for a local noodle stop.",ko:"ディナー：屋台グルメを味わい、ソイ・テキサスで地元の麺を一杯。"},{en:"Cut across to Sampeng Lane (Soi Wanit 1) for a quick market browse.",ko:"サンペーン・レーン（ソイ・ワニット1）へ渡って、軽く市場をのぞきます。"},{en:"Continue west to Pahurat Market, then MRT Sam Yot to head home.",ko:"西のパフラット市場まで進んで、MRTサームヨート駅で帰ります。"}],knowBefore:{en:"Very crowded and hot; pickpockets work busy lanes. Agree prices before ordering seafood sold by weight. Keep to the pavement as scooters squeeze through, and bring small bills.",ko:"とても混んでいて暑いです。人の多い路地ではスリに気をつけてください。重さで売るシーフードは先に値段を確認しましょう。スクーターがすり抜けていくので歩道を歩き、小銭を用意してください。"},geoQuery:"Yaowarat Road, Samphanthawong, Bangkok",mapsQuery:"Yaowarat Road Bangkok",imgQuery:"Yaowarat Road night",imgAlt:"Neon signs and street food stalls on Yaowarat Road at night in Bangkok"},{id:"banthat-thong",name:{en:"Banthat Thong",ko:"バンタットトーン",th:"\u0E1A\u0E23\u0E23\u0E17\u0E31\u0E14\u0E17\u0E2D\u0E07"},tagline:{en:"The Thai-Chinese food street the Chula students love",ko:"チュラ大生が愛するタイ式中華の食べ歩き通り"},personality:{en:"Banthat Thong Road, a few minutes from Chulalongkorn University, has become one of Bangkok's trendiest eating streets. Old shophouses now hold Thai-Chinese noodle shops, grill restaurants, hot-pot spots and student-friendly caf\xE9s, so it fills up at lunch and again after dark. The vibe is young, local and slightly chaotic, with prices lower than Siam but queues that can be long. If you want where Bangkok's students actually eat, this is it.",ko:"チュラーロンコーン大学から数分のバンタットトーン通りは、バンコクで最もトレンディな食べ歩き通りのひとつになりました。古いショップハウスにタイ式中華の麺屋、焼肉店、火鍋店、学生に人気のカフェが入っていて、ランチタイムと日が暮れてからの2回混みます。若くてローカルで、ちょっとごちゃごちゃした雰囲気です。サイアムより安いですが、行列は長くなることがあります。バンコクの大学生が実際に食べる場所を探しているなら、ここです。"},food:[{name:"Banthat Thong Road Thai-Chinese noodle and rice shops",note:{en:"Roast duck, pork noodles and Chinese-style rice dishes in small shophouse restaurants; follow the queues of students.",ko:"ローストダック、豚肉の麺、中華風ぶっかけご飯を出す小さなお店です。学生が並んでいるお店についていけば大丈夫です。"},mapsQuery:"Banthat Thong Road restaurants Bangkok"},{name:"Chula Soi area street food (Chulalongkorn University side)",note:{en:"Cheap, filling dishes aimed at students; a good place to try everyday Thai food at everyday prices.",ko:"学生向けの安くてボリュームのある料理です。日常的なタイ料理を日常的な値段で味わえます。"},mapsQuery:"Chula Soi street food Bangkok"},{name:"Sam Yan Mitrtown and Sam Yan Market food options",note:{en:"Food hall and market stalls a short walk south for variety or a rainy-day option.",ko:"南へ少し歩くとフードホールと市場の屋台があります。種類が豊富で、雨の日の代替にもなります。"},mapsQuery:"Sam Yan Market Bangkok"}],cafes:[{name:"Caf\xE9s along Banthat Thong Road and Chula's side sois",note:{en:"Cozy student-friendly caf\xE9s for coffee, matcha and desserts; many have limited seating.",ko:"学生に人気の居心地のいいカフェです。コーヒー、抹茶、デザートがあり、席が少ない店も多いです。"},mapsQuery:"cafe Banthat Thong Bangkok"},{name:"Caf\xE9s in and around Sam Yan Mitrtown",note:{en:"Air-conditioned alternatives with more seating if the street caf\xE9s are full.",ko:"通りのカフェが満席のときに、席に余裕のあるエアコン付きの代替です。"},mapsQuery:"cafe Sam Yan Mitrtown Bangkok"}],shopping:[{name:"Samyan Mitrtown",note:{en:"A modern mall and office complex with shops, a food hall and a library; practical rather than glamorous.",ko:"ショップ、フードホール、図書館がある現代的な複合モールです。華やかというより実用的です。"},mapsQuery:"Samyan Mitrtown Bangkok"},{name:"Chamchuri Square",note:{en:"A compact mall beside the university with casual shops and eateries.",ko:"大学の隣にあるコンパクトなモールで、カジュアルなショップと飲食店があります。"},mapsQuery:"Chamchuri Square Bangkok"}],activities:[{en:"Eat your way along Banthat Thong Road, one shop at a time",ko:"バンタットトーン通りを一軒一軒食べ歩き"},{en:"Wander the Chulalongkorn University campus (respect signage and dress modestly)",ko:"チュラーロンコーン大学のキャンパスを散策（標識を守って控えめな服装で）"},{en:"Rest in Chulalongkorn University Centenary Park on Rama IV",ko:"ラーマ4世通り沿いのチュラーロンコーン大学100周年記念公園で休憩"},{en:"Try a student-priced coffee or dessert stop",ko:"学生価格のコーヒーやデザートに立ち寄る"}],duration:{en:"Half day or evening (2\u20133 h)",ko:"半日または夕方（2〜3時間）"},budget:{level:1,text:{en:"\u2248 250\u2013600 THB per person incl. food & coffee (estimate)",ko:"1人あたり約250〜600バーツ、食事・コーヒー込み（目安）"}},bestTime:{en:"Lunch (11:30\u201313:30) or early evening on weekdays; weekend nights can mean long queues. Hours vary by shop.",ko:"平日のランチ（11:30〜13:30）か早めの夕方がおすすめです。週末の夜は行列が長くなることがあります。営業時間は店ごとに違います。"},stations:[{name:"MRT Sam Yan",line:"MRT Blue Line"},{name:"BTS National Stadium",line:"BTS Silom Line (walkable to the northern end; confirm on Google Maps)"}],route:[{en:"Start: BTS National Stadium or MRT Sam Yan, then walk to Banthat Thong Road.",ko:"出発：BTSナショナルスタジアム駅かMRTサームヤーン駅から、バンタットトーン通りまで歩きます。"},{en:"Walk the road and pick a lunch spot with a queue of locals.",ko:"通りを歩いて、地元の人が並んでいるランチのお店を選びます。"},{en:"Detour into Chula Soi side lanes for a snack or dessert.",ko:"チュラ・ソイの脇道に入って、おやつやデザート。"},{en:"Stroll to Chulalongkorn University Centenary Park to cool down.",ko:"チュラーロンコーン大学100周年記念公園まで歩いてクールダウン。"},{en:"Finish at Samyan Mitrtown, then MRT Sam Yan home.",ko:"サームヤーン・ミットタウンで締めて、MRTサームヤーン駅から帰ります。"}],knowBefore:{en:"Very busy at lunch and after dark; many shops are small with few seats. Pavements are narrow and vendors often use them. Cash is helpful at stalls; confirm exact opening hours since many shops close in the afternoon.",ko:"ランチタイムと夜はとても混み、小さなお店が多くて席が少ないです。歩道は狭く、屋台が使っていることもあります。屋台は現金が便利です。午後に休むお店が多いので営業時間を確認してください。"},geoQuery:"Banthat Thong Road, Pathum Wan, Bangkok",mapsQuery:"Banthat Thong Road Bangkok",imgQuery:"Banthat Thong Road Bangkok",imgAlt:"Street food shops and signs along Banthat Thong Road near Chulalongkorn University"},{id:"thonglor",name:{en:"Thonglor",ko:"トンロー",th:"\u0E17\u0E2D\u0E07\u0E2B\u0E25\u0E48\u0E2D"},tagline:{en:"Modern lifestyle, polished caf\xE9s and Bangkok's stylish side",ko:"おしゃれなカフェとモダンなライフスタイル、バンコクのスタイリッシュな顔"},personality:{en:"Thonglor (Sukhumvit Soi 55) is where well-off Bangkok goes to eat, drink coffee and be seen. The long soi is lined with design-conscious caf\xE9s, Japanese restaurants, boutique bars and small lifestyle malls, and the area has a polished, expat-and-young-professional feel. It is pricier than most of the city and the sidewalks are patchy, but if you want air-conditioned caf\xE9s, good coffee and Instagram-friendly interiors, this is a safe bet. Traffic on the soi can be slow, so BTS plus walking beats a taxi.",ko:"トンロー（スクンビット・ソイ55）は、裕福なバンコクっ子が食べて、コーヒーを飲んで、おしゃれして集まる街です。長いソイにはデザイン感覚の高いカフェ、日本食レストラン、ブティックバー、小さなライフスタイルモールが続き、駐在員や若いビジネスパーソンの雰囲気が強いです。バンコクの平均より高く、歩道は途切れ途切れですが、エアコンの効いたカフェ、おいしいコーヒー、SNS映えするインテリアが目的なら安心して行けます。ソイは渋滞でゆっくりなので、タクシーよりBTSと徒歩のほうが早いです。"},food:[{name:"Japanese and modern Thai restaurants along Thonglor Soi 10\u201317",note:{en:"One of Bangkok's densest stretches of Japanese food, plus upscale Thai and international options; mid to high prices.",ko:"バンコクで日本食が最も密集しているエリアのひとつです。高級タイ料理や多国籍料理もあり、価格は中〜高めです。"},mapsQuery:"restaurants Thonglor Bangkok"},{name:"The Commons (Thonglor)",note:{en:"A casual community mall with a mix of restaurants and caf\xE9s around a courtyard; relaxed for groups.",ko:"中庭を囲んでレストランとカフェが集まるカジュアルなコミュニティモールです。グループで行くのに気楽です。"},mapsQuery:"The Commons Thonglor Bangkok"},{name:"J Avenue (Thonglor Soi 15)",note:{en:"A small lifestyle mall with restaurants and a supermarket, good for easy air-conditioned dining.",ko:"レストランとスーパーがある小さなライフスタイルモールです。エアコンの下で気軽に食事をするのにぴったりです。"},mapsQuery:"J Avenue Thonglor Bangkok"}],cafes:[{name:"Roast Coffee & Eatery (The Commons)",note:{en:"A well-known Thonglor caf\xE9 for specialty coffee and brunch; often busy at weekends.",ko:"スペシャルティコーヒーとブランチで有名なトンローのカフェです。週末は混みます。"},mapsQuery:"Roast Coffee and Eatery Thonglor Bangkok"},{name:"Design-forward caf\xE9s along Soi Thonglor",note:{en:"Many caf\xE9s compete on interiors and latte art; wander between Soi 13 and Soi 17 for the densest cluster.",ko:"インテリアやラテアートを競うカフェがたくさんあります。ソイ13〜17の区間に最も密集しています。"},mapsQuery:"cafe Thonglor Soi 13 Bangkok"},{name:"Dessert and bakery caf\xE9s",note:{en:"Patisseries and ice-cream parlors pop up between the caf\xE9s; good for a sweet break.",ko:"カフェの合間にパティスリーやアイスクリーム店があるので、甘い休憩にぴったりです。"},mapsQuery:"dessert cafe Thonglor Bangkok"}],shopping:[{name:"The Commons and J Avenue",note:{en:"Small lifestyle malls with boutiques, a supermarket and caf\xE9s; more browsing than big hauls.",ko:"ブティック、スーパー、カフェがある小さなライフスタイルモールです。大きな買い物より見て回るのがメインです。"},mapsQuery:"The Commons Thonglor Bangkok"},{name:"Independent design boutiques along Soi Thonglor",note:{en:"Scattered Thai designer and concept shops; look for one-off finds at mid to high prices.",ko:"タイのデザイナーやコンセプトショップが点在しています。中〜高価格帯のここだけの品が見つかります。"},mapsQuery:"boutique Thonglor Bangkok"}],activities:[{en:"Caf\xE9-hop along Soi Thonglor with a long, slow lunch",ko:"ソイ・トンロー沿いでカフェ巡りをしながらゆったりランチ"},{en:"Browse independent boutiques and The Commons courtyard",ko:"独立系ブティックとザ・コモンズの中庭をのぞく"},{en:"Try a Japanese izakaya or omakase-style dinner",ko:"居酒屋やおまかせスタイルのディナーを楽しむ"},{en:"Grab drinks in the small bars after dark",ko:"日が暮れたら小さなバーで一杯"}],duration:{en:"Half day (3\u20134 h)",ko:"半日（3〜4時間）"},budget:{level:3,text:{en:"\u2248 800\u20132,000 THB per person incl. food & coffee (estimate)",ko:"1人あたり約800〜2,000バーツ、食事・コーヒー込み（目安）"}},bestTime:{en:"Late morning to mid-afternoon for caf\xE9s; early evening for dinner. Traffic on the soi is worst 17:00\u201320:00.",ko:"カフェは午前遅め〜午後の中ごろ、ディナーは早めの夕方がおすすめです。ソイの渋滞は午後5〜8時が一番ひどいです。"},stations:[{name:"BTS Thong Lo",line:"BTS Sukhumvit Line"},{name:"BTS Ekkamai",line:"BTS Sukhumvit Line (next station)"}],route:[{en:"Start: BTS Thong Lo; walk into Soi Thonglor (Sukhumvit 55).",ko:"出発：BTSトンロー駅。ソイ・トンロー（スクンビット55）へ歩いて入ります。"},{en:"Coffee at a caf\xE9 near Soi 13 and browse nearby boutiques.",ko:"ソイ13付近のカフェでコーヒー、周辺のブティックをのぞきます。"},{en:"Lunch around Soi 10\u201315 or at J Avenue.",ko:"ソイ10〜15周辺かJアベニューでランチ。"},{en:"Walk to The Commons for dessert and the courtyard.",ko:"ザ・コモンズまで歩いて、デザートと中庭の雰囲気を楽しみます。"},{en:"Optional: BTS one stop to Ekkamai for more indie spots.",ko:"お好みで：BTSで1駅移動して、エカマイでインディーズ系のお店をもっと見ます。"}],knowBefore:{en:"Prices run higher than the Bangkok average. The soi is long, hot and has uneven pavements; use motorbike taxis or a quick Grab for long gaps. Many bars check ID after dark.",ko:"バンコクの平均より物価が高いです。ソイが長くて暑く、歩道もでこぼこなので、長い区間はバイクタクシーかさっとGrabが楽です。夜は身分証を確認するバーが多いです。"},geoQuery:"Thong Lo, Watthana, Bangkok",mapsQuery:"Thonglor Bangkok",imgQuery:"Thong Lo Bangkok",imgAlt:"Street scene and caf\xE9s on Sukhumvit Soi 55 (Thonglor) in Bangkok"},{id:"ekkamai",name:{en:"Ekkamai",ko:"エカマイ",th:"\u0E40\u0E2D\u0E01\u0E21\u0E31\u0E22"},tagline:{en:"Independent shops and restaurants, Thonglor's more relaxed neighbor",ko:"トンローの隣のゆるい街、独立系のショップとレストランのエリア"},personality:{en:"Ekkamai sits next to Thonglor but feels looser and a little more local. It has a mix of independent restaurants, creative shops, Japanese eateries and small bars tucked in the sois, with students and young creatives rather than business crowds. It rewards walking and curiosity rather than a checklist. Some of its best places are down side streets that do not show up on big tourist lists, so use maps and ask around.",ko:"エカマイはトンローの隣ですが、もっとゆるくてローカルな雰囲気です。ソイごとに独立系のレストラン、クリエイティブなショップ、日本食レストラン、小さなバーが隠れていて、ビジネスマンより学生や若いクリエイターが多いです。チェックリストよりも歩く好奇心が合う街です。大きな観光リストに載らない脇道にいいお店が多いので、地図を見ながら、聞いて回ってみてください。"},food:[{name:"Gateway Ekamai food floors",note:{en:"A mall with many Japanese restaurants and food-court options right by the station; easy and air-conditioned.",ko:"駅のすぐ隣のモールです。日本食レストランやフードコートが多く、エアコンが効いていて楽です。"},mapsQuery:"Gateway Ekamai Bangkok"},{name:"Ekkamai Soi 10 restaurants and bars",note:{en:"A strip of independent restaurants and bars, livelier at night; a mix of Thai, Japanese and international.",ko:"独立系のレストランとバーが集まる通りです。夜のほうがにぎやかで、タイ料理、日本食、多国籍料理が混ざっています。"},mapsQuery:"Ekkamai Soi 10 restaurants Bangkok"},{name:"Neighborhood Thai restaurants in the side sois",note:{en:"Small local places serve everyday Thai dishes at fair prices; look for crowds at lunch.",ko:"日常的なタイ料理をお手頃な値段で出す小さなローカル食堂です。ランチタイムに人が多いお店を選びましょう。"},mapsQuery:"Thai restaurant Ekkamai Bangkok"}],cafes:[{name:"Independent caf\xE9s around Ekkamai Soi 10 and Soi 12",note:{en:"Small caf\xE9s with strong coffee and friendly counters; hours vary and some open late.",ko:"濃いコーヒーと親しみやすい雰囲気の小さなカフェです。営業時間はまちまちで、遅くまで開いているところもあります。"},mapsQuery:"cafe Ekkamai Soi 10 Bangkok"},{name:"Caf\xE9s inside Gateway Ekamai",note:{en:"Easy, air-conditioned coffee and dessert stops by the BTS exit.",ko:"BTSの出口のすぐ横にある、エアコン付きのコーヒー・デザートスポットです。"},mapsQuery:"cafe Gateway Ekamai Bangkok"}],shopping:[{name:"Gateway Ekamai",note:{en:"A compact mall with fashion, lifestyle and a Japanese-leaning dining scene.",ko:"ファッション、ライフスタイル、日本食中心の飲食店があるコンパクトなモールです。"},mapsQuery:"Gateway Ekamai Bangkok"},{name:"Independent boutiques on Ekkamai side sois",note:{en:"Small, quirky shops and creative studios scattered around; discover them by walking.",ko:"個性的な小さなショップやクリエイティブスタジオが点在しています。歩いて見つける楽しさがあります。"},mapsQuery:"boutique shops Ekkamai Bangkok"}],activities:[{en:"Walk the Ekkamai side sois and discover small independent shops",ko:"エカマイの脇道を歩いて、小さな独立系ショップを見つける"},{en:"Coffee and a long lunch at a local caf\xE9",ko:"ローカルなカフェでコーヒーとゆったりランチ"},{en:"Try a Japanese meal at Gateway Ekamai or in the sois",ko:"ゲートウェイ・エカマイや路地で日本食を食べる"},{en:"Evening drinks and small live-music or bar spots on Soi 10",ko:"ソイ10の小さなバーやライブミュージックのあるお店で夜のお酒"}],duration:{en:"Half day (2\u20134 h)",ko:"半日（2〜4時間）"},budget:{level:2,text:{en:"\u2248 600\u20131,500 THB per person incl. food & coffee (estimate)",ko:"1人あたり約600〜1,500バーツ、食事・コーヒー込み（目安）"}},bestTime:{en:"Lunch to early evening; some shops open late and bars come alive after dark. Check each place's hours.",ko:"ランチから早めの夕方がおすすめです。遅く開くショップもあり、バーは日が暮れてから活気づきます。営業時間はお店ごとに確認してください。"},stations:[{name:"BTS Ekkamai",line:"BTS Sukhumvit Line"},{name:"BTS Thong Lo",line:"BTS Sukhumvit Line (neighboring station)"}],route:[{en:"Start: BTS Ekkamai; walk to Gateway Ekamai.",ko:"出発：BTSエカマイ駅。ゲートウェイ・エカマイまで歩きます。"},{en:"Wander into Ekkamai Soi 10 for lunch and independent shops.",ko:"エカマイ・ソイ10に入って、ランチと独立系ショップを見ます。"},{en:"Coffee at a small caf\xE9 on a side soi.",ko:"脇道の小さなカフェでコーヒー。"},{en:"Walk or take a short Grab toward Thonglor for more caf\xE9s (optional).",ko:"トンロー方面へ歩くかGrabで移動して、カフェをもっと巡ります（お好みで）。"},{en:"Evening: dinner or a drink back on Soi 10.",ko:"夜：ソイ10に戻って、食事かお酒。"}],knowBefore:{en:"Pavements are patchy and sois are long; distances between spots can be deceptively far in the heat. Use BTS, Grab or motorbike taxi between clusters. Some places have irregular hours.",ko:"歩道が途切れ途切れで、ソイが長いです。暑い日は距離が思ったより遠く感じます。エリアの間はBTS、Grab、バイクタクシーを使いましょう。営業時間が不規則なお店もあります。"},geoQuery:"Ekkamai, Watthana, Bangkok",mapsQuery:"Ekkamai Bangkok",imgQuery:"Ekkamai Bangkok",imgAlt:"Street and BTS Ekkamai area in Bangkok"},{id:"phrom-phong",name:{en:"Phrom Phong",ko:"プロンポン",th:"\u0E1E\u0E23\u0E49\u0E2D\u0E21\u0E1E\u0E07\u0E29\u0E4C"},tagline:{en:"Premium malls, polished dining and a park to cool off in",ko:"高級モール、洗練されたダイニング、そしてひと息つける公園"},personality:{en:"Phrom Phong is Bangkok at its most polished. Emporium and EmQuartier face each other across the BTS and are joined by a skywalk, packed with luxury brands, cinemas, food courts and restaurants. Behind Emporium is Benjasiri Park, a small, green pocket where office workers jog and families picnic. The neighborhood has many Japanese expats, and prices run high. If you want clean, air-conditioned, reliable and a bit upscale, this is where to land.",ko:"プロンポンはバンコクで一番洗練された街です。エンポリアムとエムクオーティエがBTSをはさんでスカイウォークでつながっていて、ハイブランド、映画館、フードコート、レストランがぎっしりです。エンポリアムの裏には、会社員がジョギングし、家族がピクニックに来る小さな緑地、ベンチャシリ公園があります。日本人居住者が多い街なので、物価も高めです。きれいで涼しくて安心で、ちょっと上品な雰囲気がほしいなら、ここです。"},food:[{name:"Emporium food court and restaurant floors",note:{en:"A tidy food court and mid-to-upscale restaurants inside Emporium; reliable and air-conditioned.",ko:"エンポリアム内のきれいなフードコートと、中〜高級レストランです。安心で涼しいです。"},mapsQuery:"Emporium food court Bangkok"},{name:"EmQuartier dining (Helix Quartier and others)",note:{en:"Many restaurants and a food-hall feel across floors; good for groups with different tastes.",ko:"複数の階にレストランが集まり、フードホールのような雰囲気です。好みが違うグループにぴったりです。"},mapsQuery:"EmQuartier restaurants Bangkok"},{name:"Japanese restaurants along Sukhumvit Soi 33/1 and Soi 26",note:{en:"The area has a big Japanese community, so ramen, izakaya and sushi shops are plentiful and good quality.",ko:"日本人居住者が多いエリアなので、ラーメン、居酒屋、寿司のお店がたくさんあり、レベルも高いです。"},mapsQuery:"Japanese restaurants Phrom Phong Bangkok"}],cafes:[{name:"Caf\xE9s inside EmQuartier and Emporium",note:{en:"Plenty of coffee and dessert options right at the shopping complexes; reliable air-conditioned breaks.",ko:"ショッピング施設の中にコーヒーとデザートの選択肢がたくさんあります。頼れるエアコン付きの休憩所です。"},mapsQuery:"cafe EmQuartier Bangkok"},{name:"Caf\xE9s on Sukhumvit Soi 33/1 and Soi 24",note:{en:"Small, quiet caf\xE9s tucked away from the mall crowds.",ko:"モールの人混みから離れた、小さくて静かなカフェです。"},mapsQuery:"cafe Sukhumvit Soi 33/1 Bangkok"}],shopping:[{name:"Emporium",note:{en:"Luxury and designer brands plus Thai fashion; polished and fairly quiet outside peak hours.",ko:"ハイブランドやデザイナーブランド、タイのファッションがあります。ピーク時間以外は比較的静かです。"},mapsQuery:"Emporium Bangkok"},{name:"EmQuartier",note:{en:"A large, airy mall with a famous indoor waterfall feature, restaurants and fashion across multiple levels.",ko:"広々として開放感のある大型モールです。屋内の滝のような構造物が有名で、複数の階にレストランとファッションの店舗があります。"},mapsQuery:"EmQuartier Bangkok"}],activities:[{en:"Shop or window-browse across Emporium and EmQuartier via the skywalk",ko:"スカイウォークでエンポリアムとエムクオーティエを行き来して、ショッピングやウィンドウショッピング"},{en:"Walk or rest in Benjasiri Park behind Emporium",ko:"エンポリアムの裏のベンチャシリ公園で散歩したり休んだりする"},{en:"Catch a movie in a mall cinema on a rainy day",ko:"雨の日にモールの映画館で映画を見る"},{en:"Try a Japanese dinner in the side sois",ko:"脇道で日本食のディナーを楽しむ"}],duration:{en:"Half day (3\u20134 h)",ko:"半日（3〜4時間）"},budget:{level:3,text:{en:"\u2248 800\u20132,500 THB per person excluding shopping (estimate)",ko:"1人あたり約800〜2,500バーツ、ショッピング除く（目安）"}},bestTime:{en:"Weekday afternoons are calm; weekends and evenings fill up. Malls usually open late morning and close around 22:00 (check each mall).",ko:"平日の午後は空いています。週末と夕方は混みます。モールはたいてい午前遅めに開いて、夜10時ごろに閉まります（モールごとに確認）。"},stations:[{name:"BTS Phrom Phong",line:"BTS Sukhumvit Line"}],route:[{en:"Start: BTS Phrom Phong; head into Emporium for the shops and an early lunch.",ko:"出発：BTSプロンポン駅。エンポリアムに入って、ショッピングと早めのランチ。"},{en:"Skywalk across to EmQuartier for more shops and dining.",ko:"スカイウォークでエムクオーティエに渡って、ショッピングと食事を続けます。"},{en:"Walk to Benjasiri Park behind Emporium for fresh air and shade.",ko:"エンポリアムの裏のベンチャシリ公園まで歩いて、外の空気と木陰を楽しみます。"},{en:"Late-afternoon coffee at a caf\xE9 in a side soi.",ko:"夕方遅めに脇道のカフェでコーヒー。"},{en:"Finish with Japanese dinner on Soi 33/1 or back inside the malls.",ko:"夜はソイ33/1の日本食か、またモールの中で。"}],knowBefore:{en:"Higher prices than elsewhere; check bills in restaurants. Malls are strongly air-conditioned. Crowds peak on weekends and in the evening rush hour.",ko:"ほかの地域より値段が高いので、レストランでは会計を確認しましょう。モールはエアコンが強いです。週末と帰宅ラッシュの時間帯は混みます。"},geoQuery:"Phrom Phong, Watthana, Bangkok",mapsQuery:"Phrom Phong Bangkok",imgQuery:"EmQuartier Bangkok",imgAlt:"EmQuartier and Emporium shopping malls in Phrom Phong, Bangkok"},{id:"riverside",name:{en:"Chao Phraya Riverside",ko:"チャオプラヤー川沿い",th:"\u0E23\u0E34\u0E21\u0E41\u0E21\u0E48\u0E19\u0E49\u0E33\u0E40\u0E08\u0E49\u0E32\u0E1E\u0E23\u0E30\u0E22\u0E32"},tagline:{en:"Scenic viewpoints, river boats and Wat Arun at golden hour",ko:"展望ポイント、川の上のボート、夕焼けのワット・アルン"},personality:{en:"The Chao Phraya River is Bangkok's slow, wide spine, and a boat ride is one of the best ways to see the city without sitting in traffic. From the water you get Wat Arun glowing at sunset, old temples, riverside shophouses and skyscrapers all in one view. On the shore, ICONSIAM and Asiatique The Riverfront offer shopping, dining and photo spots with river views. It is touristy and best at golden hour, but the river itself is genuinely beautiful.",ko:"チャオプラヤー川はバンコクを横切る、ゆったりして幅の広い背骨のような存在です。渋滞に巻き込まれずに街を見る一番いい方法のひとつがボートです。水の上からは、夕焼けに輝くワット・アルン、古いお寺、川沿いのショップハウス、高層ビルがひとつの景色に収まります。川岸にはショッピング、食事、フォトスポットがそろったアイコンサイアムとアジアティーク・ザ・リバーフロントがあります。観光客が多くゴールデンアワーが一番ですが、川そのものは本当に美しいです。"},food:[{name:"SookSiam at ICONSIAM",note:{en:"An indoor Thai market-style food area on the ground floor with regional dishes and snacks; air-conditioned and convenient, if somewhat touristy.",ko:"アイコンサイアム1階の屋内タイ市場スタイルのフードエリアです。地方料理やおやつがあり、涼しくて便利ですが、やや観光地っぽいです。"},mapsQuery:"SookSiam ICONSIAM Bangkok"},{name:"Asiatique The Riverfront restaurants",note:{en:"Riverside dining and a night-market-style layout; prices are tourist-level, so check menus.",ko:"川沿いのレストランとナイトマーケット風の造りです。観光地価格なのでメニューを確認してください。"},mapsQuery:"Asiatique The Riverfront Bangkok"},{name:"River-view restaurants near Tha Tien and Wat Arun",note:{en:"Casual riverside spots facing Wat Arun; ideal for a sunset drink, with mid-range prices.",ko:"ワット・アルンを望むカジュアルな川沿いのお店です。夕焼けのドリンクにぴったりで、価格は中間帯です。"},mapsQuery:"restaurant river view Tha Tien Bangkok"}],cafes:[{name:"Caf\xE9s inside ICONSIAM",note:{en:"Plenty of caf\xE9s in the mall with river views on certain floors; busy at weekends.",ko:"モール内にカフェがたくさんあり、一部の階では川の眺めが楽しめます。週末は混みます。"},mapsQuery:"cafe ICONSIAM Bangkok"},{name:"Riverside caf\xE9s near Tha Tien",note:{en:"Small caf\xE9s and drink stands near the pier and Wat Pho; good for a break before or after temples.",ko:"ター・ティアン船着き場とワット・ポー近くの小さなカフェとドリンクスタンドです。お寺の見学の前後に休むのにぴったりです。"},mapsQuery:"cafe near Tha Tien Pier Bangkok"}],shopping:[{name:"ICONSIAM",note:{en:"A huge riverside mall with luxury brands, a floating-market style hall (SookSiam) and views of the river.",ko:"ハイブランド、水上マーケット風のスペース（スックサイアム）、川の眺めがそろった大型の川沿いモールです。"},mapsQuery:"ICONSIAM Bangkok"},{name:"Asiatique The Riverfront",note:{en:"Open-air riverside complex with market-style shops, restaurants and a Ferris wheel; popular at night.",ko:"マーケット風のショップ、レストラン、大観覧車がある屋外の川沿い複合施設です。夜に人気です。"},mapsQuery:"Asiatique The Riverfront Bangkok"}],activities:[{en:"Take a Chao Phraya Express boat for a cheap, scenic ride",ko:"チャオプラヤー・エクスプレスに乗って安く川の景色を楽しむ"},{en:"See Wat Arun glow at sunset from the river or the opposite bank",ko:"川の上や対岸から夕焼けに輝くワット・アルンを見る"},{en:"Visit ICONSIAM and its river-view terraces",ko:"アイコンサイアムと川の眺めが楽しめるテラスを訪問"},{en:"Spend the evening at Asiatique with dinner and the Ferris wheel",ko:"夜はアジアティークで食事と大観覧車"},{en:"Cross the river by small ferry for Wat Arun (confirm the ferry on Google Maps)",ko:"小さな渡し船で川を渡ってワット・アルンへ（運航情報はGoogleマップで確認）"}],duration:{en:"Half day to evening (3\u20135 h)",ko:"半日〜夕方（3〜5時間）"},budget:{level:2,text:{en:"\u2248 500\u20131,500 THB per person incl. boat fares, meals and drinks (estimate; temple entry extra)",ko:"1人あたり約500〜1,500バーツ、船賃・食事・ドリンク込み（目安、寺院の入場料は別）"}},bestTime:{en:"Late afternoon into sunset for the best light and cooler air; avoid midday heat. Check the last boat times before you go.",ko:"光がきれいで涼しい夕方〜夕焼けの時間が最高です。真昼は避けて、最終便の時間は事前に確認してください。"},stations:[{name:"BTS Saphan Taksin (Sathorn Pier)",line:"BTS Silom Line; connect to the Chao Phraya boats and the free hotel/mall shuttle boats"},{name:"Tha Tien Pier (Wat Pho / Wat Arun side)",line:"Chao Phraya Express boat; confirm pier and boat line on Google Maps"},{name:"BTS Charoen Nakhon",line:"BTS Gold Line (for ICONSIAM)"}],route:[{en:"Start: BTS Saphan Taksin, walk to Sathorn Pier and board a Chao Phraya Express boat.",ko:"出発：BTSサパーンタクシン駅からサトーン船着き場まで歩いて、チャオプラヤー・エクスプレスに乗ります。"},{en:"Ride to Tha Tien Pier for Wat Pho and the river views (confirm pier on Google Maps).",ko:"ター・ティアン船着き場へ移動して、ワット・ポーと川の眺め（船着き場はGoogleマップで確認）。"},{en:"Cross the river by small ferry to Wat Arun and walk the terrace.",ko:"小さな渡し船で川を渡ってワット・アルンを訪問し、テラスを歩きます。"},{en:"Return by boat toward Sathorn Pier at golden hour.",ko:"ゴールデンアワーに合わせて、ボートでサトーン船着き場方面へ戻ります。"},{en:"Evening: free shuttle boat from Sathorn Pier to Asiatique or ICONSIAM (check the schedule).",ko:"夜：サトーン船着き場からアジアティークやアイコンサイアムへ行く無料シャトルボート（運行時間を確認）。"}],knowBefore:{en:"Boats are crowded at rush hour. Wear sun protection, hold your bag on the pier, and watch the gap between boat and pier. Temple entry requires modest dress (covered shoulders and knees). Shuttle boats and ferries have limited hours, so confirm times.",ko:"通勤ラッシュの時間帯は船が混みます。日差し対策をして、船着き場ではバッグをしっかり持ってください。船と船着き場の間の隙間に気をつけましょう。寺院は肩と膝を隠す服装が必要です。シャトルボートと渡し船は運行時間が限られているので確認してください。"},geoQuery:"Chao Phraya River, Bangkok",mapsQuery:"Chao Phraya River Bangkok",imgQuery:"Wat Arun Bangkok sunset",imgAlt:"Wat Arun temple on the Chao Phraya River at sunset in Bangkok"},{id:"bang-krachao",name:{en:"Bang Krachao",ko:"バーンクラチャオ",th:"\u0E1A\u0E32\u0E07\u0E01\u0E30\u0E40\u0E08\u0E49\u0E32"},tagline:{en:"Bangkok's green lung: cycling, shade and a slower pace",ko:"バンコクの緑の肺、自転車と木陰とゆっくりした時間"},personality:{en:"Bang Krachao is a leafy river peninsula just across from Khlong Toei, with narrow elevated paths, mangroves, orchards and small canals. It feels like another province, which is the point: after the traffic of central Bangkok, cycling through shaded lanes is a genuine reset. It is not a place for big attractions; it is for slow rides, local snacks and fresh air. Bring water, expect mosquitoes, and know that facilities are basic.",ko:"バーンクラチャオは、クローントゥーイの対岸にあるチャオプラヤー川の緑豊かな半島です。細い高架の遊歩道、マングローブ、果樹園、小さな運河があります。バンコク市内とはまるで別の地方のような雰囲気で、それが魅力です。都心の渋滞のあとに、木陰の道を自転車で走るのは本当にリセットになります。大きな見どころではなく、ゆっくりしたサイクリング、ローカルおやつ、きれいな空気を楽しむ場所です。水を持って、蚊も覚悟してください。設備は基本的なものだけです。"},food:[{name:"Bang Nam Phueng Floating Market (weekends)",note:{en:"A small, touristy floating market with local snacks and grilled foods; typically open on weekends only, so confirm before going.",ko:"ローカルおやつと焼き物がある、観光客向けの小さな水上マーケットです。たいてい週末だけ開くので、行く前に確認してください。"},mapsQuery:"Bang Nam Phueng Floating Market Bangkok"},{name:"Local riverside and roadside eateries on Bang Krachao",note:{en:"Simple, family-run noodle and rice places along the cycling routes; expect basic menus and low prices.",ko:"サイクリングコース沿いの家族経営の食堂です。麺類とぶっかけご飯が中心の素朴なメニューで、値段も安いです。"},mapsQuery:"local restaurant Bang Krachao Bangkok"},{name:"Fruit and drink stalls along the paths",note:{en:"Fresh coconut, fruit and iced drinks for a cooling break between rides.",ko:"ココナッツ、フルーツ、氷入りドリンクの屋台があるので、サイクリングの合間の休憩にぴったりです。"},mapsQuery:"fruit stall Bang Krachao Bangkok"}],cafes:[{name:"Garden-style caf\xE9s along the cycling routes",note:{en:"Several relaxed caf\xE9s with plants and open-air seating; opening hours vary, so check on Google Maps.",ko:"植物と屋外席のあるゆったりしたカフェがいくつかあります。営業時間はまちまちなので、Googleマップで確認してください。"},mapsQuery:"cafe Bang Krachao Bangkok"},{name:"Caf\xE9s near Sri Nakhon Khuean Khan Park",note:{en:"Quiet spots near the park and botanical garden for a snack or iced coffee.",ko:"公園や植物園の近くで、おやつやアイスコーヒーを楽しめる静かなスポットです。"},mapsQuery:"cafe near Sri Nakhon Khuean Khan Park Bangkok"}],shopping:[{name:"Bang Nam Phueng Floating Market craft stalls (weekends)",note:{en:"Small souvenir and craft stalls; limited selection compared with central markets.",ko:"小規模なお土産と工芸品の屋台があります。都心の市場より品ぞろえは少なめです。"},mapsQuery:"Bang Nam Phueng Floating Market Bangkok"}],activities:[{en:"Cycle the shaded elevated paths of the Bang Krachao Green Lung",ko:"バーンクラチャオ・グリーンラングの木陰の高架道を自転車で走る"},{en:"Visit Sri Nakhon Khuean Khan Park and Botanical Garden",ko:"シーナコーン・クエンカン公園と植物園を訪問"},{en:"Cross by small ferry from Wat Khlong Toei Nok pier (confirm on Google Maps)",ko:"ワット・クローントゥーイ・ノーク船着き場から小さな船で渡る（Googleマップで確認）"},{en:"Stop at Bang Nam Phueng Floating Market on a weekend",ko:"週末はバーンナムプン水上マーケットに立ち寄る"},{en:"Rent a bike near the pier and ride at your own pace",ko:"船着き場の近くで自転車を借りて、自分のペースで走る"}],duration:{en:"Half day (3\u20135 h)",ko:"半日（3〜5時間）"},budget:{level:1,text:{en:"\u2248 300\u2013700 THB per person incl. ferry, bike rental and snacks (estimate)",ko:"1人あたり約300〜700バーツ、渡し船・自転車レンタル・おやつ込み（目安）"}},bestTime:{en:"Early morning or late afternoon on a dry day to avoid peak heat; weekends for the floating market. Avoid heavy-rain days.",ko:"昼のピークの暑さを避けて、晴れた日の早朝か夕方がおすすめです。水上マーケットに行くなら週末に。大雨の日は避けてください。"},stations:[{name:"MRT Khlong Toei",line:"MRT Blue Line; then a Grab or motorbike taxi to the pier (confirm on Google Maps)"},{name:"Wat Khlong Toei Nok pier (ferry to Bang Krachao)",line:"Small cross-river ferry; confirm pier and schedule on Google Maps"}],route:[{en:"Start: MRT Khlong Toei, then Grab or motorbike taxi to the Wat Khlong Toei Nok pier.",ko:"出発：MRTクローントゥーイ駅から、Grabかバイクタクシーでワット・クローントゥーイ・ノーク船着き場へ。"},{en:"Take the small ferry across to Bang Krachao.",ko:"小さな船でバーンクラチャオへ渡ります。"},{en:"Rent a bike near the landing and ride the shaded elevated paths.",ko:"船着き場の近くで自転車を借りて、木陰の高架道を走ります。"},{en:"Stop at Sri Nakhon Khuean Khan Park and Botanical Garden for a rest.",ko:"シーナコーン・クエンカン公園と植物園で休憩します。"},{en:"Lunch or snacks at a local eatery, or Bang Nam Phueng on weekends, then ride back to the ferry.",ko:"地元の食堂でランチやおやつ、週末ならバーンナムプン市場に寄ってから、自転車で船着き場へ戻ります。"}],knowBefore:{en:"Bring water, sunscreen, bug spray and cash (card terminals are rare). Paths can be uneven and slippery after rain. Ferry hours are limited, so check the last return time. It is peaceful, but facilities are basic.",ko:"水、日焼け止め、虫よけ、現金を持っていきましょう（カード端末はほとんどありません）。雨のあとは道がでこぼこして滑りやすくなります。船の運航時間が限られているので、最終便の時間を確認してください。穏やかですが、設備は基本的なものだけです。"},geoQuery:"Bang Krachao, Phra Pradaeng, Samut Prakan",mapsQuery:"Bang Krachao Bangkok",imgQuery:"Bang Krachao",imgAlt:"Cycling path through the green landscape of Bang Krachao near Bangkok"}]});var Re,aa,Va,Uo=S(()=>{Re=[{id:"seven-eleven",type:"convenience",name:{en:"7-Eleven",ko:"セブン-イレブン",th:"\u0E40\u0E0B\u0E40\u0E27\u0E48\u0E19 \u0E2D\u0E35\u0E40\u0E25\u0E1F\u0E40\u0E27\u0E48\u0E19"},desc:{en:"Thailand's everywhere-store: drinks, ready meals, toasties, boiled eggs, SIM top-ups, chargers, cold towels and more. You will pass one every few hundred metres.",ko:"タイのどこにでもあるお店。飲料、お弁当、トースト、ゆで卵、SIMのチャージ、充電器、冷たいタオルなど何でもそろいます。数百メートルごとに1軒あります。"},budget:1,why:{en:"Fastest fix for water, electrolytes, a hot snack from the microwave counter or a late-night refuel. Open very late in most locations, often 24 h.",ko:"水、イオン飲料、電子レンジで温めた軽食、夜食まで、いちばん手早く解決できます。ほとんどの店舗が遅くまで開いていて、24時間のところも多いです。"},transit:{en:"Citywide, including inside many BTS/MRT station buildings and malls. Just search the nearest one on Google Maps.",ko:"市内全域にあり、BTS/MRTの駅舎の中やショッピングモールの中にもたくさんあります。Googleマップで一番近いお店を検索すればOKです。"},korea:{en:"Same convenience idea as a Japanese konbini, but staff will microwave your meal and many shops have an All Café coffee counter. Ready-meal choices are Thai (rice dishes, toasties, dumplings). Many stores also sell bottled water, ice and cheap ponchos. The price tag is the price. Buy-one-get-one deals exist but are not very common, so look for promo stickers.",ko:"日本のコンビニとほぼ同じ発想ですが、店員さんがお弁当をその場で温めてくれて、店舗によってはオールカフェのコーヒーコーナーもあります。お弁当はタイ風（ぶっかけご飯、トースト、餃子など）です。ミネラルウォーター、氷、安いレインポンチョも売っています。値札どおりの値段です。1+1のセールもありますが、あまり多くないので、プロモのステッカーを探してください。"},tags:["24h","snacks","hot-food","water","late-night"],mapsQuery:"7-Eleven Bangkok",imgQuery:"7-Eleven Thailand",imgAlt:"A 7-Eleven convenience store storefront in Thailand",imgIllustrative:!0},{id:"lotus-go-fresh",type:"convenience",name:{en:"Lotus's go fresh",ko:"ロータス・ゴー・フレッシュ",th:"\u0E42\u0E25\u0E15\u0E31\u0E2A \u0E42\u0E01 \u0E40\u0E1F\u0E23\u0E0A"},desc:{en:"Lotus's small-format neighborhood supermarket: fresh fruit, ready meals, drinks, toiletries and snacks, usually in a bigger and calmer space than a typical 7-Eleven.",ko:"ロータス系列の近所の小型スーパーです。果物、お弁当、飲み物、日用品、お菓子が、コンビニより広くて落ち着いた空間で選べます。"},budget:1,why:{en:"Good for stocking the room with water, fruit, yogurt and snacks at supermarket prices without walking into a full hypermarket.",ko:"大型スーパーまで行かなくても、水、果物、ヨーグルト、お菓子をスーパー価格で買えます。"},transit:{en:"Scattered across Bangkok, often on busy roads or near BTS/MRT stops. Search the nearest branch on Google Maps; hours vary by branch.",ko:"バンコクのあちこちにあり、大通りや駅の近くに多いです。支店ごとに営業時間が違うので、地図で確認してください。"},korea:{en:"Think of it as a local neighborhood supermarket like back home, with Thai food and a small hot-food counter. Cheaper per item than 7-Eleven for water and drinks.",ko:"惣菜コーナーのあるタイ食材中心の近所のスーパー（近所のスーパー）といったイメージです。水や飲み物はセブン-イレブンよりたいてい安いです。"},tags:["supermarket","fruit","water","ready-meals"],mapsQuery:"Lotus's go fresh Bangkok",imgQuery:"Lotus's go fresh",imgAlt:"Lotus's go fresh small supermarket storefront",imgIllustrative:!0},{id:"mini-big-c",type:"convenience",name:{en:"Mini Big C",ko:"ミニ・ビッグC",th:"\u0E21\u0E34\u0E19\u0E34 \u0E1A\u0E34\u0E4A\u0E01\u0E0B\u0E35"},desc:{en:"Big C's small convenience chain, often a little cheaper than 7-Eleven for drinks and instant noodles, with a Thai grocery selection.",ko:"ビッグC系列の小型コンビニです。飲み物やカップ麺がセブン-イレブンより少し安いことが多く、タイの食料品がそろっています。"},budget:1,why:{en:"Cheap water, snacks, instant noodles and basics when a 7-Eleven is not on the block.",ko:"セブン-イレブンが近くにないときに、水、お菓子、カップ麺などの基本アイテムを安く買えます。"},transit:{en:"Neighborhood locations across Bangkok. Search Mini Big C on Google Maps for the closest branch.",ko:"バンコクの住宅街のあちこちにあります。Googleマップで「Mini Big C」と検索して近い店舗を探してください。"},korea:{en:"Similar to a small Lawson or FamilyMart, but fewer hot meals and rarely 24 h. Good for stocking up on basics rather than late-night food.",ko:"ローソンやファミリーマートの小型店に似ていますが、ホットフードは少なく、24時間営業の店はまれです。夜食より基本的な日用品の買い出しに向いています。"},tags:["cheap","snacks","instant-noodles"],mapsQuery:"Mini Big C Bangkok",imgQuery:"Mini Big C",imgAlt:"A Mini Big C convenience store in Thailand",imgIllustrative:!0},{id:"cj-more",type:"convenience",name:{en:"CJ MORE",ko:"CJモア",th:"\u0E0B\u0E35\u0E40\u0E08 \u0E21\u0E2D\u0E23\u0E4C"},desc:{en:"A Thai neighborhood convenience chain (the former CJ Express) with a compact range of snacks, drinks and daily basics.",ko:"旧CJエクスプレスとして知られていたタイの近所のコンビニチェーンです。お菓子、飲み物、日用品をコンパクトにそろえています。"},budget:1,why:{en:"An alternative to 7-Eleven in residential streets, often with competitive drink and snack prices.",ko:"住宅街でセブン-イレブンの代わりに寄れて、飲み物やお菓子の値段が手頃なことが多いです。"},transit:{en:"Mostly outside the central mall belt, in residential areas and along main roads. Check the nearest branch on Google Maps.",ko:"中心のモール街よりも、住宅エリアや大通り沿いに多いです。Googleマップで近い店舗を確認してください。"},korea:{en:"Despite the name, it is a Thai chain and not connected to any Japanese chain or drugstore (such as Matsumoto Kiyoshi) as far as visitors are concerned, so do not expect Japanese products or J-beauty.",ko:"名前でまぎらわしいですが、タイのチェーンで、旅行者から見て日本のドラッグストア（マツモトキヨシなど）とは関係がありません。日本の商品やジャパンコスメがあると期待しないでください。"},tags:["local","snacks","drinks"],mapsQuery:"CJ MORE Bangkok",imgQuery:"CJ More Thailand",imgAlt:"CJ MORE convenience store in Thailand",imgIllustrative:!0},{id:"siam-paragon",type:"mall",name:{en:"Siam Paragon",ko:"サイアム・パラゴン",th:"\u0E2A\u0E22\u0E32\u0E21\u0E1E\u0E32\u0E23\u0E32\u0E01\u0E2D\u0E19"},desc:{en:"Bangkok's flagship luxury mall with big-name brands, Gourmet Market food hall, a cinema complex and Siam Ocean World aquarium. Great for AC and a huge range of food.",ko:"バンコクを代表するハイエンドモールです。有名ブランド、グルメマーケット（フードホール）、シネコン、サイアム・オーシャンワールド水族館まで入っていて、エアコンがよく効いた屋内コースにぴったりです。"},budget:3,why:{en:"Shop, eat and cool down in one stop. The ground-floor food hall and Gourmet Market are great for trying Thai bites and picking up gifts.",ko:"ショッピング、食事、暑さしのぎを一度に済ませられます。1階のフードホールとグルメマーケットは、タイのおやつを試したりお土産を選んだりするのに最適です。"},transit:{en:"BTS Siam station, connected by a skywalk. Siam Center and Siam Discovery are right next door.",ko:"BTSサイアム駅からスカイウォークですぐつながっています。隣にサイアム・センターとサイアム・ディスカバリーがあります。"},korea:{en:"Feels like Roppongi Hills or an AEON Mall meets a department store food hall. Prices on international brands can be on the high side; sale periods and tourist VAT-refund options exist (rules change, check at the counter).",ko:"六本木ヒルズやイオンモールにデパ地下を合わせたような雰囲気です。海外ブランドは値段が高めなことがあり、セール期間や外国人向けの免税（タックスリファンド）制度もありますが、規定が変わるので店頭で確認してください。"},tags:["luxury","food-hall","aquarium","cinema","air-conditioned","siam"],geoQuery:"Siam Paragon, Bangkok",mapsQuery:"Siam Paragon Bangkok",imgQuery:"Siam Paragon",imgAlt:"The facade of Siam Paragon shopping mall in Bangkok"},{id:"centralworld",type:"mall",name:{en:"CentralWorld",ko:"セントラルワールド",th:"\u0E40\u0E0B\u0E47\u0E19\u0E17\u0E23\u0E31\u0E25\u0E40\u0E27\u0E34\u0E25\u0E14\u0E4C"},desc:{en:"O
