:"Riverside temple; take the express boat to Wat Arun pier, or the cross-river ferry from Tha Tien.",ko:"川沿いのお寺です。急行ボートでワット・アルン船着き場で降りるか、ター・ティエン船着き場から対岸へ渡るフェリーに乗りましょう。"}},{name:{en:"Grand Palace",ko:"王宮"},th:"\u0E1E\u0E23\u0E30\u0E1A\u0E23\u0E21\u0E21\u0E2B\u0E32\u0E23\u0E32\u0E0A\u0E27\u0E31\u0E07",rom:"phra bo-rom-ma-ha-ra-cha-wang",hint:{en:"Dress code applies.",ko:"服装の決まりがあります。"}},{name:{en:"Khao San Road",ko:"カオサン通り"},th:"\u0E16\u0E19\u0E19\u0E02\u0E49\u0E32\u0E27\u0E2A\u0E32\u0E23",rom:"tha-non khao-san",hint:{en:"Backpacker street in the Old Town.",ko:"旧市街にあるバックパッカーの通りです。"}},{name:{en:"Lumphini Park",ko:"ルンピニー公園"},th:"\u0E2A\u0E27\u0E19\u0E25\u0E38\u0E21\u0E1E\u0E34\u0E19\u0E35",rom:"suan lum-phi-ni",hint:{en:"Central park at MRT Si Lom/Lumphini.",ko:"MRTシーロム駅、ルンピニー駅の近くにある都心の公園です。"}},{name:{en:"Victory Monument",ko:"戦勝記念塔"},th:"\u0E2D\u0E19\u0E38\u0E2A\u0E32\u0E27\u0E23\u0E35\u0E22\u0E4C\u0E0A\u0E31\u0E22\u0E2A\u0E21\u0E23\u0E20\u0E39\u0E21\u0E34",rom:"a-nu-sa-wa-ri chai-sa-mo-ra-phum",hint:{en:"BTS station and bus hub.",ko:"BTSの駅で、バスの乗り換え拠点でもあります。"}},{name:{en:"BTS Asok",ko:"BTSアソーク駅"},th:"\u0E2A\u0E16\u0E32\u0E19\u0E35\u0E2D\u0E42\u0E28\u0E01",rom:"sa-tha-ni a-sok",hint:{en:"Interchange with MRT Sukhumvit.",ko:"MRTスクンビット駅と接続しています。"}},{name:{en:"BTS Mo Chit",ko:"BTSモーチット駅"},th:"\u0E2A\u0E16\u0E32\u0E19\u0E35\u0E2B\u0E21\u0E2D\u0E0A\u0E34\u0E15",rom:"sa-tha-ni mo-chit",hint:{en:"Near MRT Chatuchak Park.",ko:"MRTチャトチャック公園駅の近くです。"}},{name:{en:"BTS Phrom Phong",ko:"BTSプロンポン駅"},th:"\u0E2A\u0E16\u0E32\u0E19\u0E35\u0E1E\u0E23\u0E49\u0E2D\u0E21\u0E1E\u0E07\u0E29\u0E4C",rom:"sa-tha-ni phrom-phong",hint:{en:"For EmQuartier and Emporium.",ko:"エムクオーティエ、エンポリアムに行くときに降ります。"}},{name:{en:"MRT QSNCC",ko:"MRTクイーン・シリキット・コンベンションセンター駅"},th:"\u0E2A\u0E16\u0E32\u0E19\u0E35\u0E28\u0E39\u0E19\u0E22\u0E4C\u0E01\u0E32\u0E23\u0E1B\u0E23\u0E30\u0E0A\u0E38\u0E21\u0E41\u0E2B\u0E48\u0E07\u0E0A\u0E32\u0E15\u0E34\u0E2A\u0E34\u0E23\u0E34\u0E01\u0E34\u0E15\u0E34\u0E4C",rom:"sa-tha-ni sun kan-pra-chum haeng-chat si-ri-kit",hint:{en:"For Benjakitti Park.",ko:"ベンチャキティ公園に行くときに降ります。"}},{name:{en:"MRT Hua Lamphong",ko:"MRTフアラムポーン駅"},th:"\u0E2A\u0E16\u0E32\u0E19\u0E35\u0E2B\u0E31\u0E27\u0E25\u0E33\u0E42\u0E1E\u0E07",rom:"sa-tha-ni hua-lam-phong",hint:{en:"Gateway to Chinatown.",ko:"チャイナタウンへの玄関口の駅です。"}}]});var We,ta,Xa,Za,Zo=S(()=>{We=[{id:"emergency-numbers",topic:{en:"Emergency numbers & who to call",ko:"緊急電話番号と連絡先"},icon:"siren",body:{en:"Thailand uses its own emergency numbers (not Japan’s 110/119). Police 191, ambulance 1669, fire 199. For anything involving a tourist (scam, theft, lost passport, language trouble) call the Tourist Police on 1155, which has interpreters on standby.",ko:"タイは日本(110/119)とは緊急番号が違います。警察は191、救急車は1669、消防は199です。詐欺、盗難、パスポートの紛失、言葉が通じないなど、旅行者に関わるトラブルは、通訳が待機している観光警察1155に電話するのが一番ラクです。"},tips:[{en:"Dial the number exactly as written — no +66 and no area code — from a Thai SIM, eSIM or Japanese roaming phone.",ko:"+66や市外局番はつけず、番号をそのままダイヤルしてください。タイのSIM、eSIM、日本のローミング端末のどれでも同じです。"},{en:"Say your location first (hotel / mall / BTS station name). Screenshot your hotel\u2019s name and address in Thai so you can read it out or show it.",ko:"まず今いる場所(ホテル、ショッピングモール、BTS駅の名前)を伝えましょう。ホテルの名前と住所をタイ語でスクリーンショットしておくと、読み上げたり見せたりできて便利です。"},{en:"English can be limited on 191 and 1669. If you can\u2019t be understood, switch to 1155 (Tourist Police) or ask a hotel/restaurant staff member to call for you.",ko:"191と1669は、英語があまり通じないことがあります。通じないときは、1155(観光警察)にかけるか、ホテルやお店のスタッフに代わりに電話してもらいましょう。"},{en:"TAT 1672 is an information/assistance line, not an emergency dispatch \u2014 check its hours before relying on it late at night.",ko:"1672はTATの観光案内・サポート用の電話で、緊急出動の番号ではありません。夜遅くの営業時間は確認が必要です。"}],source:{name:"TAT News \u2013 Tourist Police 1155 / TAT 1672 (older page; 191/199/1669 are standard Thai national numbers)",url:"https://tatnews.org/?p=25686"},type:"fact"},{id:"korean-embassy",topic:{en:"Embassy of Japan & consular help",ko:"在タイ日本国大使館と領事サポート"},icon:"landmark",body:{en:"The Embassy of Japan in Thailand is at 177 Witthayu (Wireless) Road, Lumphini, Pathum Wan, Bangkok 10330. Main line +66-2-207-8500, consular section +66-2-696-3000 (office hours, Mon–Fri). Outside office hours, calling the main line connects to emergency guidance/duty staff. The Japan MOFA (Tokyo) main line is +81-3-3580-3311 — a paid international call.",ko:"在タイ日本国大使館は、バンコクのルンピニー地区、ウィッタユ(ワイヤレス)通り177番地にあります。代表電話は+66-2-207-8500、領事部は+66-2-696-3000(平日の執務時間)です。執務時間外に代表電話へかけると、緊急時の案内や当直の担当者につながります。外務省(東京)の代表電話は+81-3-3580-3311で、国際電話料金がかかります。"},tips:[{en:"Lost or stolen passport: get a police report (Tourist Police / local station) first, then contact the embassy about a new passport or emergency travel document. Keep a photo of your passport page in cloud storage.",ko:"パスポートの紛失・盗難のときは、まず警察署か観光警察で届出の証明書をもらい、そのあと大使館に再発行や帰国のための渡航書について問い合わせましょう。パスポートの顔写真ページは、クラウドにバックアップしておきましょう。"},{en:"The embassy can also guide you on emergencies and passport procedures (per the embassy page).",ko:"大使館に連絡すれば、緊急時の対応や、パスポートの手続きについての案内も受けられます(大使館の案内基準)。"},{en:"Save these numbers offline in your phone before you travel; mobile data may not work in an emergency.",ko:"緊急時にはデータ通信が使えないことがあるので、出発前にこれらの番号をスマホの連絡先に保存しておきましょう。"},{en:"Hours and numbers can change — confirm on the embassy’s official page (th.emb-japan.go.jp).",ko:"営業時間や番号は変わることがあるので、大使館の公式ページ(th.emb-japan.go.jp)でもう一度確認しましょう。"}],source:{name:"Embassy of Japan in Thailand – emergency & consular contacts",url:"https://www.th.emb-japan.go.jp/itprtop_ja/index.html"},checked:"2026-11-17",type:"fact"},{id:"sim-esim",topic:{en:"SIM & eSIM",ko:"SIM・eSIM"},icon:"smartphone",body:{en:"Tourist SIMs and eSIMs are easy to get at the airport, 7-Eleven-type shops and telecom stores, but Thai rules require ID registration. Expect to show your passport (and a face/selfie check) for a physical SIM. Check the current rules with the operator or NBTC, because registration rules were tightened recently.",ko:"空港、コンビニ、通信会社の店舗で、観光客向けのSIMやeSIMは簡単に買えますが、タイでは本人確認の登録が必要です。物理SIMはパスポート(と顔認証)の提示を求められることが多いです。最近、登録ルールが厳しくなったという報道があるので、購入前に通信会社かNBTCで最新のルールを確認してください。"},tips:[{en:"Bring your original passport (not a photo) when buying a physical SIM.",ko:"物理SIMを買うときは、パスポートの原本を必ず持って行きましょう(写真では不可の場合が多いです)。"},{en:"eSIM: check your phone is unlocked and eSIM-compatible, and install it on hotel/airport Wi-Fi before you need it.",ko:"eSIMは、スマホがSIMロック解除済みでeSIM対応かを確認して、空港かホテルのWi-Fiで事前にインストールしておきましょう。"},{en:"Tourist SIMs often have a validity cap (reports say 60 days) and can\u2019t always be topped up \u2014 confirm with the seller.",ko:"観光客向けSIMは有効期限の上限(約60日と報道)があり、チャージできないこともあるので、販売店に確認しましょう。"},{en:"Keep your Japanese SIM safe if you swap physical SIMs (banking/2FA texts), or use eSIM so both stay active.",ko:"物理SIMを入れ替えるときは、日本のSIMを失くさないよう気をつけましょう(認証SMSのため)。eSIMなら2つの回線を同時に使えて便利です。"}],source:{name:"NBTC (Thailand telecom regulator) \u2013 check current SIM rules",url:"https://www.nbtc.go.th/"},type:"advice"},{id:"internet-wifi",topic:{en:"Internet & Wi-Fi",ko:"インターネット・Wi-Fi"},icon:"wifi",body:{en:"Mobile data is fast and cheap across Bangkok, and free Wi-Fi is common in malls, cafes and hotels. Mall/cafe Wi-Fi usually needs a phone number or a code from the receipt; hotel Wi-Fi is fine for browsing but not ideal for competitive play.",ko:"バンコクはモバイルデータが速くて安く、ショッピングモール、カフェ、ホテルには無料Wi-Fiも多いです。モールやカフェのWi-Fiは、電話番号の認証やレシートのコードが必要なことが多く、ホテルのWi-Fiはネット閲覧には十分ですが、対戦ゲームには不安定なことがあります。"},tips:[{en:"Use a VPN or avoid banking on public Wi-Fi.",ko:"公共のWi-Fiでは銀行アプリを避けるか、VPNを使いましょう。"},{en:"Download offline Google Maps for Bangkok and key translations before you go out.",ko:"出かける前に、バンコクのGoogleマップのオフラインマップと、翻訳アプリの言語パックをダウンロードしておきましょう。"},{en:"Carry a power bank \u2014 navigation, Grab and translation drain batteries fast in the heat.",ko:"地図、Grab、翻訳アプリを使うと暑さの中でバッテリーがすぐ減るので、モバイルバッテリーを持って行きましょう。"}],source:{name:"TAT \u2013 Tourism Authority of Thailand",url:"https://www.tourismthailand.org/"},type:"advice"},{id:"currency",topic:{en:"Currency & exchange",ko:"両替・通貨"},icon:"banknote",body:{en:"Thai baht (THB, \u0E3F). Notes come in 20, 50, 100, 500 and 1,000. Well-known exchange counters in Bangkok (e.g. Superrich) usually beat airport counters and hotels, but compare rates. Exchange rates vary daily, so always check the live rate.",ko:"タイの通貨はバーツ(THB、฿)です。紙幣は20、50、100、500、1,000バーツ。バンコク市内の有名な両替所(例:スーパーリッチ)は、たいてい空港やホテルより有利ですが、為替レートは毎日変わるので、必ず比べましょう。"},tips:[{en:"Bring clean, undamaged large-denomination notes if exchanging cash (small or torn notes may get worse rates).",ko:"現金を両替するときは、きれいな高額紙幣のほうが有利なことが多く、古かったり破れたりした紙幣は不利になることがあります。"},{en:"Carry small notes (20/50/100) \u2014 street stalls, tuk-tuks and markets often can\u2019t break 1,000.",ko:"屋台、トゥクトゥク、市場では1,000バーツ札のおつりが出せないことが多いので、20・50・100バーツの紙幣を持っておきましょう。"},{en:"Count change before leaving a counter. Keep exchange receipts.",ko:"窓口を離れる前に両替した金額を数えて、レシートを保管しましょう。"},{en:"Prices shown in this guide are typical-range estimates, not live prices.",ko:"このガイドの価格は一般的な範囲の目安で、リアルタイムの価格ではありません。"}],source:{name:"Bank of Thailand",url:"https://www.bot.or.th/en/home.html"},type:"advice"},{id:"cash-vs-cards",topic:{en:"Cash vs cards",ko:"現金とカード"},icon:"credit-card",body:{en:"Malls, hotels, chains and many cafes take Visa/Mastercard (tap-to-pay is common). Street food, markets, tuk-tuks, motorbike taxis and small shops are mostly cash. Plan on carrying cash every day.",ko:"ショッピングモール、ホテル、チェーン店、多くのカフェではVisa/Mastercard(タッチ決済を含む)が使えます。屋台、市場、トゥクトゥク、バイクタクシー、小さなお店はほとんど現金です。毎日現金を持ち歩くのを基本に考えましょう。"},tips:[{en:"If a terminal asks “THB or JPY?”, choose THB — Dynamic Currency Conversion usually gives a worse rate.",ko:"端末に「THB or JPY?」と聞かれたら、THB(バーツ)を選びましょう。円建て決済(DCC)はたいてい為替レートが不利です。"},{en:"Some small shops add a card surcharge \u2014 ask before paying.",ko:"小さなお店ではカード手数料を上乗せすることもあるので、支払う前に聞きましょう。"},{en:"Tell your card issuer you’re travelling, and keep a backup card in a separate place.",ko:"カード会社に海外で使うことを伝えておき、予備のカードは別の場所に分けて保管しましょう。"}],source:{name:"TAT \u2013 Tourism Authority of Thailand",url:"https://www.tourismthailand.org/"},type:"advice"},{id:"atm-fees",topic:{en:"ATM withdrawals & fees",ko:"ATM出金と手数料"},icon:"landmark",body:{en:"Thai ATMs charge a per-withdrawal fee on foreign cards, widely reported at around 220 THB (some operators differ), on top of your own bank\u2019s overseas fees. The machine usually shows the fee before you confirm. Withdraw larger amounts less often.",ko:"タイのATMは、海外のカードで出金すると1回ごとに手数料がかかり、約220バーツとよく言われています(銀行や機械によって違うことがあります)。日本のカード会社の海外手数料は別です。画面で手数料を確認してから進めましょう。大きな金額を少ない回数で引き出すほうがお得です。"},tips:[{en:"Decline “conversion into JPY” if the ATM offers it; choose to be charged in THB.",ko:"ATMが円換算を提案してきても断って、バーツで引き出してください。"},{en:"Use ATMs inside banks/malls in daylight; cover the keypad, and check for skimmers.",ko:"銀行やモール内のATMを日中に使い、暗証番号は手で隠してください。スキマーが付いていないかも確認しましょう。"},{en:"Check your card’s Thai ATM limit and your Japanese card issuer’s fee beforehand — amounts above are estimates, not official.",ko:"出発前に、カードのタイATM限度額と日本のカード会社の手数料を確認してください。上の金額は公式の確認値ではなく推定です。"}],source:{name:"Wise \u2013 Money & ATMs in Thailand (secondary source)",url:"https://wise.com/au/blog/money-and-banks-in-thailand"},type:"estimate"},{id:"qr-payment",topic:{en:"QR payments & PromptPay for tourists",ko:"QR決済 & プロンプトペイ"},icon:"qr-code",body:{en:"Thais pay with PromptPay QR almost everywhere, but those codes are tied to Thai bank accounts, so Japanese bank apps and cards generally can’t scan them. Foreign visitors mostly rely on cash/cards, or on tourist e-wallets (e.g. TrueMoney-type or tourist wallets) where available. Don’t count on Japanese pay apps working.",ko:"タイの人はほぼどこでもプロンプトペイのQRで支払いますが、このQRはタイの銀行口座に紐づいているため、日本の銀行アプリやカードでは通常スキャンできません。外国人は現金・カードや、旅行者向け電子ウォレット(例：トゥルーマネーなど)を使うことが多いです。PayPayなどの日本のペイアプリが使えるとは期待しないでください。"},tips:[{en:"A few cross-border QR schemes exist for some foreign wallets (e.g. certain Chinese apps); Japanese wallets were not confirmed — check your app before travel.",ko:"一部の海外電子ウォレット(例：中国系アプリ)は国をまたぐQR連携がありますが、日本のペイアプリは確認されていません。出発前に使っているアプリのお知らせを確認してください。"},{en:"Street stalls with a personal PromptPay QR won\u2019t accept foreign apps \u2014 carry cash.",ko:"個人のプロンプトペイQRを使っている屋台は外国のアプリを受け付けないので、現金を用意してください。"}],source:{name:"Wise \u2013 PromptPay for foreigners (secondary source)",url:"https://wise.com/en-th/blog/promptpay-for-foreigners"},type:"advice"},{id:"outlets",topic:{en:"Power outlets & voltage",ko:"コンセント & 電圧"},icon:"plug",body:{en:"Thailand runs on about 220–230 V / 50 Hz. Sockets are commonly Types A, B, C (plus the Thai Type O style) — many are universal “multi-hole” sockets. Japanese chargers with Type A (two flat pins) plugs usually fit. Japan is 100 V, though, so check the label: most phone/laptop chargers are 100–240 V and work without a transformer.",ko:"タイは約220〜230V / 50Hzです。コンセントはA・B・C型(タイ式O型を含む)が多く、マルチソケットもよくあります。日本と同じ平行2本ピンのA型プラグは、たいていそのまま差さります。ただし日本は100Vなので、機器のラベルを確認してください。スマホやノートPCの充電器は100〜240V対応が多く、変圧器なしで使えます。差し込みが緩いときはマルチアダプターを使いましょう。"},tips:[{en:"Bring a universal adapter + a multi-port USB charger for the team\u2019s many devices.",ko:"たくさんの機器を使うので、ユニバーサルアダプターとマルチUSB充電器を持っていきましょう。"},{en:"Check your device label for \u201C100\u2013240V\u201D \u2014 hair tools and old chargers may be single-voltage.",ko:"機器のラベルに「100–240V」とあるか確認してください。ドライヤーや古い充電器は単一電圧のことがあります。"},{en:"Loose sockets happen in older buildings; don\u2019t force plugs.",ko:"古い建物ではコンセントが緩いことがあるので、無理に差し込まないでください。"}],source:{name:"CIA World Factbook \u2013 Thailand travel facts (voltage/plug types)",url:"https://www.cia.gov/the-world-factbook/static/5bd6c7d4b6e4990888c7ff4b4ec99f3d/TH-travel-facts.pdf"},type:"fact"},{id:"heat-sun",topic:{en:"Heat & sun safety",ko:"暑さ & 紫外線対策"},icon:"sun",body:{en:"Bangkok is hot and humid all year; the hottest stretch is roughly March\u2013May. Even in the cooler season (about Nov\u2013Feb) midday sun is strong. Heat exhaustion happens fast if you walk a lot, skip water or drink alcohol in the sun.",ko:"バンコクは一年中暑くて蒸し暑いです。いちばん暑いのはおおよそ3〜5月で、比較的涼しい11〜2月でも日中の日差しは強烈です。たくさん歩いたり、水を飲まなかったり、日中にお酒を飲んだりすると、熱疲労はすぐに起こります。"},tips:[{en:"Drink water regularly and add electrolytes (sports drinks) on long, sweaty days; pale urine = good sign.",ko:"こまめに水を飲み、汗をたくさんかいた日はスポーツドリンクで電解質を補給しましょう。尿の色が薄ければ良いサインです。"},{en:"Wear SPF 50, a cap and breathable clothes; plan outdoor sightseeing before ~11:00 or after ~16:00.",ko:"SPF50の日焼け止めを塗り、帽子と通気性の良い服を用意して、屋外の予定は11時前か16時以降にしましょう。"},{en:"Warning signs: dizziness, headache, nausea, stopped sweating, confusion \u2192 move to shade/AC, cool down, and seek medical help.",ko:"めまい・頭痛・吐き気・汗が止まる・意識がぼんやりするなどの症状が出たら、日陰やエアコンの効いた場所で体を冷やし、病院に行ってください。"},{en:"Malls, BTS stations and 7-Elevens are great AC refuges. Bring a light jacket \u2014 indoors can be freezing.",ko:"モール・BTSの駅・セブンイレブンは、エアコンの効いた良い避難場所です。屋内はものすごく寒いことがあるので、薄手の上着も持っていきましょう。"}],source:{name:"Thai Meteorological Department",url:"https://www.tmd.go.th/en"},type:"advice"},{id:"rainy-season",topic:{en:"Rainy season",ko:"雨季"},icon:"cloud-rain",body:{en:"Bangkok\u2019s rainy season runs roughly May to October, peaking around Aug\u2013Oct. Rain usually comes as short, heavy afternoon/evening downpours. Streets can flood quickly and taxis/Grab get scarce.",ko:"バンコクの雨季はおおよそ5〜10月で、8〜10月にいちばん雨が多くなります。たいてい午後や夕方に短時間で激しく降り、道路がすぐ冠水してタクシーやGrabがつかまりにくくなります。"},tips:[{en:"Carry a compact umbrella or poncho and put electronics in a dry bag.",ko:"折りたたみ傘かレインポンチョを持ち、電子機器は防水ポーチに入れましょう。"},{en:"Wet tiles and metal covers are slippery \u2014 wear shoes with grip, not smooth-soled sandals.",ko:"濡れたタイルやマンホールのふたは滑ります。底がつるつるのサンダルより、グリップのある靴がおすすめです。"},{en:"Leave extra time for transport; BTS/MRT is more reliable than road traffic in heavy rain.",ko:"移動時間は余裕を持って見積もり、大雨のときは道路よりBTS/MRTのほうが頼りになります。"}],source:{name:"Thai Meteorological Department",url:"https://www.tmd.go.th/en"},type:"estimate"},{id:"pm25",topic:{en:"PM2.5 air quality",ko:"微小粒子状物質(PM2.5)"},icon:"wind",body:{en:"Bangkok\u2019s smog season is generally the cool, dry months \u2014 roughly December to March, with some years starting earlier or lasting into April. Bad days can reach unhealthy levels; others are fine. Check the daily reading instead of assuming.",ko:"バンコクのPM2.5シーズンは、おおむね涼しくて乾燥した12〜3月で、年によってはもっと早く始まったり4月まで続いたりします。悪い日は健康に害のあるレベルまで上がりますが、問題ない日もあるので、毎日数値を確認するのがおすすめです。"},tips:[{en:"Check Air4Thai (official PCD site/app) or IQAir before outdoor plans.",ko:"屋外の予定を立てる前に、Air4Thai(タイ公害管理局の公式アプリ・サイト)かIQAirを確認してください。"},{en:"On bad days: swap outdoor activities for malls/museums and wear an N95/KF94 mask.",ko:"悪い日は屋外の予定をモールや博物館に変更し、N95/KF94マスクを着けましょう。"},{en:"Hard training outdoors on a high-PM2.5 day isn\u2019t recommended \u2014 move it indoors.",ko:"数値が高い日の屋外での高強度トレーニングはおすすめしません。屋内に移しましょう。"},{en:"Bring N95 masks from Japan; local pharmacies/7-Elevens also sell masks.",ko:"N95マスクは日本から持っていきましょう。現地の薬局やセブンイレブンでもマスクを売っています。"}],source:{name:"Air4Thai \u2013 Pollution Control Department",url:"https://air4thai.pcd.go.th/"},type:"estimate"},{id:"drinking-water",topic:{en:"Drinking water",ko:"飲料水"},icon:"droplet",body:{en:"Don\u2019t drink Bangkok tap water; stick to sealed bottled water (cheap everywhere) or filtered refill machines at your hotel. Restaurant ice is generally commercially made (cylinders with a hole) and widely considered fine.",ko:"バンコクの水道水は飲まず、密封されたペットボトルの水(どこでも安い)やホテルの浄水機を利用してください。レストランの氷は、たいてい工場で作られた穴あきの円筒形で、安心して口にする人が多いです。"},tips:[{en:"Brushing teeth with tap water is fine for most people; use bottled water if you have a sensitive stomach.",ko:"歯みがきは水道水でもたいてい問題ありませんが、お腹が弱い人はミネラルウォーターを使いましょう。"},{en:"Check the bottle seal; carry a reusable bottle and refill at hotel/gym filters.",ko:"キャップの封が切られていないか確認し、水筒を持ち歩いてホテルやジムの浄水機で水を補充しましょう。"},{en:"Roadside crushed ice/ice shavings from unknown sources \u2014 pass if unsure.",ko:"出どころがわからない屋台のかち割り氷やかき氷の氷は、迷ったらやめておきましょう。"}],source:{name:"TAT \u2013 Tourism Authority of Thailand",url:"https://www.tourismthailand.org/"},type:"advice"},{id:"food-safety",topic:{en:"Food safety & stomach care",ko:"食の衛生 & お腹の不調対策"},icon:"utensils",body:{en:"Street food is a highlight and generally safe if you pick busy stalls with high turnover, food cooked fresh in front of you and hot. Spice, new bacteria and heat can still upset your stomach \u2014 most \u201CBangkok belly\u201D is mild and short.",ko:"屋台料理はバンコクのハイライトで、お客さんの多い屋台で、目の前で作りたてのアツアツを出してくれるところを選べば、たいてい安全です。それでも辛さ・慣れない菌・暑さでお腹を壊すことはありますが、ほとんどは軽く、すぐ治ります。"},tips:[{en:"Pick busy stalls; avoid food sitting out in the heat, raw shellfish and unwashed salads when unsure.",ko:"人が多い屋台を選び、暑い中に長く置かれた料理、生の貝、洗い方が不確かなサラダは避けましょう。"},{en:"Ask for \u201Cmai phet\u201D (not spicy) the first days, and build up gradually.",ko:"最初の数日は「マイペット(辛くしないで)」で注文して、少しずつ慣らしていきましょう。"},{en:"Pack Japanese-brand oral rehydration salts, probiotics and anti-diarrheal basics; Thai pharmacies also have them.",ko:"日本の経口補水液・整腸剤・下痢止めなど基本の常備薬を持っていきましょう。タイの薬局でも買えます。"},{en:"Allergies: show the allergy card in this guide \u2014 fish sauce, shrimp paste, oyster sauce and peanuts are in many dishes.",ko:"アレルギーがある場合は、このガイドのアレルギーカードを見せてください。ナンプラー・カピ(エビペースト)・オイスターソース・ピーナッツを使った料理が多いです。"},{en:"Severe or bloody diarrhea, fever or dehydration \u2192 see a doctor.",ko:"下痢がひどい、血が混じる、熱や脱水症状があるときは、病院に行ってください。"}],source:{name:"TAT \u2013 Tourism Authority of Thailand",url:"https://www.tourismthailand.org/"},type:"advice"},{id:"etiquette",topic:{en:"Everyday etiquette: wai, head & feet",ko:"基本のマナー — ワイ、頭と足"},icon:"hand",body:{en:"Thai culture values calm and respect. The \u201Cwai\u201D (palms together, slight bow) is a polite greeting; a smile and \u201Csawatdee khrap/kha\u201D is enough for tourists. The head is considered the highest and most respected part of the body, and feet the lowest.",ko:"タイは穏やかさと敬意を大切にします。「ワイ」(両手を合わせて軽くおじぎ)は丁寧なあいさつで、旅行者は笑顔と「サワディークラップ/カー」で十分です。頭は体でいちばん高く尊い部分、足はいちばん低い部分とされています。"},tips:[{en:"Don\u2019t touch people\u2019s heads (including kids) or ruffle hair as a joke.",ko:"子どもも含め、他人の頭に触ったり、冗談で髪をくしゃくしゃにしたりしないでください。"},{en:"Don\u2019t point your feet at people or Buddha images, don\u2019t step over people/food, and take your shoes off where there\u2019s a shoe rack.",ko:"足先で人や仏像を指さない、人や食べ物をまたがない、靴箱がある場所では靴を脱ぐようにしましょう。"},{en:"Stay calm in conflict \u2014 raising your voice or losing your temper in public causes \u201Closs of face\u201D and rarely helps.",ko:"もめごとが起きても冷静に対応しましょう。人前で声を荒げると相手の面子をつぶすことになり、かえって逆効果です。"},{en:"Monks: women should not touch a monk or hand things to him directly. Give way and keep a respectful distance.",ko:"僧侶に対しては、女性が体に触れたり物を直接手渡したりしないのがマナーです。道を譲り、距離を保ちましょう。"},{en:"Public displays of heavy affection and loud behavior can offend, especially in temples and with elders.",ko:"過度な愛情表現や大きな音は、特に寺院や目上の人の前では失礼になることがあります。"}],source:{name:"TAT \u2013 Tourism Authority of Thailand",url:"https://www.tourismthailand.org/"},type:"advice"},{id:"monarchy-law",topic:{en:"Monarchy respect & l\xE8se-majest\xE9 law",ko:"王室への敬意 & 不敬罪"},icon:"scale",body:{en:"The Thai monarchy is deeply revered and Thailand\u2019s l\xE8se-majest\xE9 law (Section 112) criminalises defaming or insulting the king, queen, heir or regent \u2014 foreigners can be prosecuted too. Don\u2019t joke about, criticise or post disrespectful content about the royal family, in person or online.",ko:"タイの王室は深く敬愛されており、不敬罪(刑法112条)は国王・王妃・王位継承者などへの誹謗・侮辱を処罰します。外国人も処罰の対象です。直接の発言でもオンラインでも、王室を冗談のネタにしたり、批判したり、失礼な投稿をしたりしないでください。"},tips:[{en:"Stand when the royal anthem plays before cinema screenings, and pause when the national anthem plays at 08:00/18:00 in some public places (e.g. stations, parks).",ko:"映画館で王室賛歌が流れたら起立し、8時・18時に一部の公共の場(駅・公園など)で国歌が流れたら、いったん立ち止まって敬意を示しましょう。"},{en:"Never step on or deface Thai banknotes/coins (they carry the king\u2019s portrait) \u2014 if one falls, don\u2019t stamp on it.",ko:"紙幣・硬貨には国王の肖像があるので、踏んだり落書きしたりしないでください。落としても足で踏まないようにしましょう。"},{en:"Treat royal portraits (common on streets and buildings) respectfully; no memes, no sarcasm.",ko:"街中や建物に掲げられた王室の写真に敬意を払い、ミームや皮肉な表現は避けましょう。"},{en:"Treat Buddha images with respect: no posing disrespectfully, no climbing, no tattoos/prints of Buddha used as decoration in a careless way.",ko:"仏像の前で失礼なポーズを取ったり、よじ登ったりしないでください。仏像を軽い気持ちで飾りに使った服やタトゥーにも注意しましょう。"}],source:{name:"TAT \u2013 Tourism Authority of Thailand",url:"https://www.tourismthailand.org/"},type:"fact"},{id:"temple-dress",topic:{en:"Temple & Grand Palace dress code",ko:"寺院・王宮の服装規定"},icon:"church",body:{en:"Temples and the Grand Palace require modest dress: shoulders and knees covered, no see-through, ripped or very short clothes, no sleeveless tops, no flip-flops at some sites. Rules are strictly enforced at the Grand Palace.",ko:"寺院と王宮では、肩と膝を隠した控えめな服装が必要です。透ける服・破れた服・短い服・ノースリーブはNGで、場所によってはビーチサンダルも不可です。王宮は特に厳しく取り締まっています。"},tips:[{en:"Bring a light scarf/long pants or a sarong; shop stalls near some sites rent or sell cover-ups (price estimates vary).",ko:"薄手のスカーフや長ズボン、サロンを持っていきましょう。一部の観光地の近くでは、レンタルや販売もしています(価格はまちまちです)。"},{en:"Take off shoes before entering a temple hall, don\u2019t point feet at Buddha statues, step over thresholds rather than on them.",ko:"本堂に入る前に靴を脱ぎ、仏像に足先を向けず、敷居は踏まずにまたいで入りましょう。"},{en:"Be quiet, no flash photos during worship, and ask before photographing monks.",ko:"静かにして、礼拝中はフラッシュを切り、僧侶を撮影するときは先に許可を取りましょう。"},{en:"Check opening hours and dress rules on the official site/signs the day you go.",ko:"訪問当日に、公式サイトや現地の案内で営業時間と服装規定を確認してください。"}],source:{name:"Grand Palace official (Bureau of the Royal Household)",url:"https://www.royalgrandpalace.th/en/home"},type:"advice"},{id:"transport-safety",topic:{en:"Transport & road safety",ko:"交通 & 道路の安全"},icon:"car-taxi-front",body:{en:"BTS/MRT are the safest, most predictable way to get around. Use Grab/Bolt or insist on the meter for taxis. Traffic drives on the LEFT; motorbikes weave and ignore pedestrian space. Thai road accident rates are high, so be extra careful at crossings.",ko:"移動はBTS/MRTがいちばん安全で予測しやすいです。タクシーはGrab/Boltを使うか、メーターを倒してもらうよう伝えてください。車は左側通行で、バイクが歩道まで入ってくることもあります。交通事故が多いので、横断歩道でも油断しないでください。"},tips:[{en:"Look RIGHT first when crossing (traffic comes from the right) and use overpasses where possible.",ko:"道を渡るときは、まず右を見てください(車は右から来ます)。できれば歩道橋を使いましょう。"},{en:"Motorbike taxis (\u201Cwin\u201D): you must ask for a helmet; many tourists get injured \u2014 check your travel insurance covers motorbike use.",ko:"バイクタクシーでは必ずヘルメットをかぶってください。事故が多いので、保険がバイク乗車を補償するか確認しましょう。"},{en:"Rent a scooter only if you have a valid license and insurance \u2014 many policies refuse claims without them.",ko:"スクーターのレンタルは、有効な免許と保険がある場合だけにしましょう。ないと保険請求を断られることが多いです。"},{en:"In Grab: check plate and driver photo, share your trip; do not get into a car that doesn\u2019t match.",ko:"Grabではナンバープレートとドライバーの写真を確認し、乗車情報の共有をオンにしましょう。情報が合わない車には乗らないでください。"},{en:"Chao Phraya boats/Express: stay seated, hold bags, watch the gap at piers.",ko:"チャオプラヤー川のボートでは座って乗り、バッグをしっかり持ち、船着き場の隙間に気をつけてください。"}],source:{name:"Department of Land Transport \u2013 Thailand",url:"https://www.dlt.go.th/en/"},type:"advice"},{id:"scams",topic:{en:"Common tourist scams",ko:"よくある観光客向け詐欺"},icon:"shield-alert",body:{en:"Most Bangkok visits are trouble-free, but a few repeat scams target tourists: the gem/\u201Cgovernment sale\u201D scam, the \u201Ctemple is closed today\u201D tuk-tuk redirect, taxis refusing the meter, and over-priced bar bills. Walk away calmly \u2014 you never owe anyone anything.",ko:"バンコク旅行はほとんど問題なく過ごせますが、観光客を狙った繰り返しの詐欺がいくつかあります。宝石・「政府セール」詐欺、トゥクトゥク運転手の「寺院は今日休み」という誘導、メーターを使わないタクシー、ぼったくりバーの請求書などです。落ち着いてその場を離れれば大丈夫です。誰にもお金を払う義務はありません。"},tips:[{en:"Gem scam: a friendly stranger or tuk-tuk driver says a \u201Cspecial government gem sale\u201D is on \u2014 it never is. Skip it.",ko:"宝石詐欺：親切な見知らぬ人やトゥクトゥクの運転手が「政府の特別宝石セール」と言ってきたら、100%詐欺です。行かないでください。"},{en:"\u201CClosed temple\u201D scam: someone says the Grand Palace/temple is closed today and offers a cheap tuk-tuk tour. Check opening hours yourself on the official site.",ko:"「寺院休み」詐欺：王宮や寺院が今日は閉まっていると言って、安いトゥクトゥクツアーを勧めてきます。営業しているかどうかは公式サイトで自分で確認しましょう。"},{en:"Taxis: if the driver refuses the meter or quotes a flat price, get out and take another or use Grab. Don\u2019t accept \u201Cmeter broken.\u201D",ko:"タクシー：メーターを拒否したり定額を言ってきたりしたら、降りて別のタクシーに乗るかGrabを使いましょう。「メーターが壊れている」は受け入れないでください。"},{en:"Jet-ski/boat rental scams (more common at beach resorts like Pattaya/Phuket than Bangkok): staff claim \u201Cdamage\u201D you didn\u2019t cause and demand cash. Take photos/video before and after; never leave your passport as deposit.",ko:"ジェットスキー・ボートのレンタル詐欺(バンコクよりパタヤやプーケットなどのビーチに多い)：やっていない「破損」を主張して現金を要求されます。借りる前後に写真や動画を撮り、パスポートを担保として預けないでください。"},{en:"Bars/clubs: check the menu prices before ordering, never hand over your card, and verify the bill. Bar \u201Cping-pong show\u201D touts often push inflated bills.",ko:"バー・クラブ：注文前にメニューの価格を確認し、カードは預けず、会計をしっかり確認しましょう。客引きのいる店はぼったくり請求が多いです。"},{en:"Fake \u201Cfriendly student/guide\u201D offers near big sights, and fake ticket sellers \u2014 only buy tickets at official counters.",ko:"主要な観光地の近くにいる「親切な学生・ガイド」や偽のチケット売りには注意し、チケットは公式の窓口でだけ買いましょう。"},{en:"If scammed: note the plate/place, call Tourist Police 1155.",ko:"被害に遭ったら、ナンバープレートや場所を記録して、ツーリストポリス1155に通報してください。"}],source:{name:"TAT \u2013 Tourist safety & Tourist Police",url:"https://www.tourismthailand.org/"},type:"advice"},{id:"nightlife-safety",topic:{en:"Nightlife, bags & personal safety",ko:"夜の遊び & 持ち物の安全"},icon:"moon",body:{en:"Bangkok is generally safe for visitors, but petty theft, drink spiking and bag snatching happen in crowded areas and nightlife districts. Keep valuables close and your wits about you.",ko:"バンコクは旅行者にとって概ね安全ですが、混雑した場所や繁華街ではスリ・飲み物への薬物混入・ひったくりが起こることがあります。貴重品は身近に置き、気を引き締めておきましょう。"},tips:[{en:"Never leave your drink unattended; open drinks from strangers are a bad idea.",ko:"飲み物を置いたまま席を離れず、知らない人から渡された飲み物は飲まないでください。"},{en:"Keep phones out of back pockets and bags in front in markets (Chatuchak) and BTS rush hour.",ko:"チャトゥチャック市場やBTSのラッシュ時は、スマホを後ろポケットに入れず、バッグは前に抱えましょう。"},{en:"Use the hotel safe for passport/spare cash; carry a photo/copy of the passport.",ko:"パスポートや予備の現金はホテルの金庫に置き、パスポートのコピーか写真を持ち歩きましょう。"},{en:"Go home in groups at night and use Grab rather than street touts.",ko:"夜は複数人で帰り、客引きではなくGrabを使いましょう。"}],source:{name:"TAT \u2013 Tourist safety",url:"https://www.tourismthailand.org/"},type:"advice"},{id:"pharmacies-hospitals",topic:{en:"Pharmacies & hospitals",ko:"薬局 & 病院"},icon:"cross",body:{en:"Pharmacies are everywhere (look for the green cross; chains like Boots and Watsons are common). Bangkok has internationally known private hospitals such as Bumrungrad International, Bangkok Hospital, Samitivej and the public Chulalongkorn Hospital. Private hospitals are costly; travel insurance is strongly recommended.",ko:"薬局はどこにでもあります(緑の十字が目印で、ブーツやワトソンズなどのチェーンも多いです)。バンコクには、バムルンラード・インターナショナル、バンコク病院、サミティヴェート(日本人医師・通訳のいる病院もあります)といった国際的に知られた私立病院と、公立のチュラロンコン病院があります。私立病院は高額なので、旅行保険を強くおすすめします。"},tips:[{en:"Pharmacists can often help with minor issues; write the generic drug name (not the Japanese brand name) in English.",ko:"軽い症状は薬剤師に相談できます。日本の商品名ではなく、成分名(英語)を伝えてください。"},{en:"Prescription/controlled meds (e.g. ADHD, sleep or strong painkillers): bring the original packaging, a prescription and an English doctor\u2019s letter, and check Thai rules before you travel.",ko:"処方薬や管理対象の薬(ADHD薬・睡眠薬・強い鎮痛剤など)は、元の包装、処方箋、英文の診断書を用意し、出国前にタイの規定を確認してください。"},{en:"Major private hospitals often have international patient/interpreter services; Japanese-language support may exist but is not confirmed here — ask when you call.",ko:"大きな私立病院には、外国人患者向けサービスや通訳サービスがあるところが多いです。日本語対応はここでは確認できていないので、電話で問い合わせてください。"},{en:"Save your hotel\u2019s Thai address, your insurance number and allergies on your phone.",ko:"ホテルのタイ語の住所、保険番号、アレルギー情報をスマホに保存しておきましょう。"},{en:"Emergency: call 1669 or ask someone nearby to take you to the closest ER.",ko:"緊急時は1669に電話するか、近くの人に最寄りの救急外来へ連れて行ってもらうよう頼んでください。"}],source:{name:"Bumrungrad International Hospital (example private hospital)",url:"https://www.bumrungrad.com/"},type:"advice"},{id:"alcohol-rules",topic:{en:"Alcohol rules",ko:"お酒のルール"},icon:"wine",body:{en:"Legal drinking/purchase age is 20. Since 29 May 2026, alcohol may generally be sold from 11:00 to 24:00 (the old 14:00\u201317:00 afternoon ban is gone), with different hours for airports, hotels and licensed entertainment venues. Sales or drinking are restricted in temples, government offices, petrol stations, public parks and public transport, and on some official/religious days.",ko:"飲酒・購入できる年齢は20歳です。2026年5月29日から、お酒は原則11:00〜24:00に販売できます(以前の14〜17時の販売禁止は廃止)。空港・ホテル・風俗営業の娯楽施設には別の時間が適用されます。寺院・官公庁・ガソリンスタンド・公園・公共交通機関と、一部の祝日・宗教上の日は、販売や飲酒が制限されます。"},tips:[{en:"Carry your passport or ID photo \u2014 young-looking visitors are often asked for ID.",ko:"若く見えると身分証の提示を求められるので、パスポートのコピーか写真を用意しましょう。"},{en:"Sales can be banned on some election and major Buddhist holidays \u2014 plan ahead.",ko:"選挙日や仏教の主要な祝日には酒類の販売が禁止されることがあるので、事前に計画しましょう。"},{en:"Don\u2019t drink and ride/drive. Don\u2019t drink in the heat without water.",ko:"飲酒後の運転やバイクは絶対にやめて、暑い中で飲むときは水も一緒に飲みましょう。"},{en:"Rules change; hotel and venue staff know current hours.",ko:"ルールは変わることがあるので、ホテルや店のスタッフに最新の時間を聞いてみましょう。"}],source:{name:"TAT News \u2013 Alcohol sales and consumption rules updated in Thailand (May 2026)",url:"https://www.tatnews.org/2026/05/alcohol-sales-and-consumption-rules-updated-in-thailand/"},checked:"2026-11-17",type:"fact"},{id:"vaping-smoking",topic:{en:"Vaping, e-cigarettes & smoking",ko:"電子タバコ & 喫煙のルール"},icon:"cigarette-off",body:{en:"E-cigarettes, vapes, shisha and e-shisha are illegal in Thailand (ban since 2014); TAT advises visitors not to bring devices, accessories or e-liquid. Tourists have been fined or arrested; later 2026 reports mention a possible policy debate but we found no confirmed change \u2014 treat vaping as banned. Smoking is also banned in many indoor spaces, public transport, beaches, parks, markets and airport terminals.",ko:"電子タバコ・ベイプ・水タバコ(シーシャ)・電子シーシャは、タイでは違法です(2014年から禁止)。TATは、機器・アクセサリー・リキッドを持ち込まないよう案内しています。観光客が罰金を科されたり逮捕されたりした例もあります。2026年の一部の報道では規制の見直し議論に触れていますが、確定した変更は確認できなかったので、事実上禁止と考えてください。タバコも、ほとんどの屋内、公共交通機関、ビーチ、公園、市場、空港ターミナルで禁止です。"},tips:[{en:"Do NOT bring vapes or pods \u2014 even in a carry-on or transiting. They can be confiscated and you may be fined or arrested.",ko:"ベイプやポッドは、機内持ち込みでも乗り継ぎでも、絶対に持ち込まないでください。没収されたうえ、罰金や逮捕につながることがあります。"},{en:"Airports\u2019 terminals are smoke-free; use designated outdoor smoking areas only (fine up to 5,000 THB per violation was announced for airport public areas).",ko:"空港ターミナルは禁煙なので、指定された屋外の喫煙エリアだけを使ってください(空港の公共エリアでは1件につき最大5,000バーツの罰金が告示されています)。"},{en:"Beaches, parks, zoos, markets and sports venues are smoke-free zones too.",ko:"ビーチ・公園・動物園・市場・スポーツ施設も禁煙エリアです。"},{en:"Dispose of cigarette butts in bins; littering is fined.",ko:"吸い殻はゴミ箱に捨てましょう。ポイ捨ては罰金の対象です。"}],source:{name:"TAT News \u2013 Anti-smoking laws in Thailand",url:"https://www.tatnews.org/2019/11/tat-highlights-anti-smoking-laws-in-thailand/"},checked:"2026-11-17",type:"fact"},{id:"drug-laws",topic:{en:"Drugs & cannabis",ko:"麻薬・大麻のルール"},icon:"ban",body:{en:"Thailand has strict drug laws. Cannabis flower has been a controlled substance since late June 2025: recreational use was never legal, and tourists can\u2019t use, buy, carry or transport it without a valid Thai prescription (max 30 days supply). Walk-in shop products may be unlicensed. Other drugs carry severe penalties, including long jail terms.",ko:"タイの薬物取り締まりはとても厳しいです。大麻の花は2025年6月末から管理対象で、嗜好目的の使用は一度も合法になったことがありません。旅行者は、タイで発行された有効な処方箋がなければ、使用・購入・所持・運搬ができません(最大30日分)。店頭で売られている製品は無許可の可能性があります。ほかの薬物は長期の懲役を含む重い罰則があります。"},tips:[{en:"Japanese law may also punish drug use abroad (including cannabis) — avoid all of it.",ko:"日本の法律では、海外での薬物使用(大麻を含む)も処罰される可能性があります。絶対にやめてください。"},{en:"Don\u2019t carry anything for strangers; don\u2019t accept edibles/gummies/vapes from others.",ko:"知らない人の荷物を代わりに持たず、お菓子・グミ・ベイプなどを人から受け取らないでください。"},{en:"Your own prescription medicines are fine if legal in Thailand \u2014 carry the original packaging and prescription; check Thai FDA rules for controlled drugs.",ko:"自分の処方薬は、タイで認められている範囲なら問題ありません。元の包装と処方箋を持ち、管理対象の薬はタイ食品医薬品局(FDA)の規定を確認してください。"},{en:"Questions: Thai FDA hotline 1556.",ko:"問い合わせはタイFDAホットライン1556。"}],source:{name:"TAT News \u2013 Cannabis flower now strictly regulated in Thailand (June 2025)",url:"https://www.tatnews.org/2025/06/cannabis-flower-now-strictly-regulated-in-thailand-important-notice-for-tourists/"},checked:"2026-11-17",type:"fact"},{id:"tipping",topic:{en:"Tipping",ko:"チップの習慣"},icon:"hand-coins",body:{en:"Tipping is not mandatory in Thailand. In restaurants, check whether a ~10% service charge is already on the bill; if not, rounding up or leaving small change is appreciated. Amounts below are typical estimates, not rules.",ko:"タイではチップは義務ではありません。レストランでは、会計にサービス料(通常10%)がすでに含まれているか確認し、なければ小銭を残すか切り上げると喜ばれます。以下の金額は一般的な目安で、決まりではありません。"},tips:[{en:"Street food stalls: no tip expected.",ko:"屋台：チップは不要です。"},{en:"Taxis: round up the fare to the nearest 10 THB (estimate). Grab: optional.",ko:"タクシー：料金を10バーツ単位に切り上げる程度(目安)。Grabは任意です。"},{en:"Massage / spa: about 50\u2013100 THB for a standard session (estimate).",ko:"マッサージ・スパ：標準コースで50〜100バーツほど(目安)。"},{en:"Hotel porters or housekeeping: 20\u201350 THB is a common gesture (estimate).",ko:"ホテルのポーター・ハウスキーピング：20〜50バーツほどが一般的です(目安)。"}],source:{name:"TAT \u2013 Tourism Authority of Thailand",url:"https://www.tourismthailand.org/"},type:"estimate"},{id:"vat-refund",topic:{en:"VAT refund for tourists",ko:"旅行者向けVAT還付"},icon:"receipt",body:{en:"Foreign tourists can reclaim VAT on goods from shops showing the \u201CVAT REFUND FOR TOURISTS\u201D sign if they spend at least 2,000 THB (incl. VAT) at one shop on one day and at least 5,000 THB in total. Show your passport at purchase so the shop issues form P.P.10, attach original tax invoices, and take the goods out of Thailand within 60 days.",ko:"「VAT REFUND FOR TOURISTS」の表示がある店で、同じ店・同じ日に2,000バーツ以上(VAT込み)、合計5,000バーツ以上を購入すれば、外国人旅行者は付加価値税の還付を受けられます。購入時にパスポートを見せてP.P.10の書類をもらい、原本の税務請求書を添付して、購入日から60日以内に商品をタイから持ち出してください。"},tips:[{en:"Before check-in, show the goods and P.P.10 to Customs; luxury items (jewellery, watches, glasses, pens, etc.) need a second inspection at the VAT refund office after passport control.",ko:"チェックイン前に税関で商品とP.P.10を見せてください。宝飾品・時計・メガネ・ペンなどの高額品は、出国審査の後に還付事務所で追加検査が必要です。"},{en:"Keep goods unpacked/accessible in carry-on or until Customs inspects them; arrive at the airport early.",ko:"税関の検査が終わるまでは、荷物をすぐ開けられる状態にしておき、空港には早めに行きましょう。"},{en:"Payout options and any fees are explained at the refund counter and on the Revenue Department site \u2014 check there for the current method.",ko:"還付の受け取り方法や手数料は、還付カウンターや歳入局(Revenue Department)のサイトで最新の案内を確認してください。"}],source:{name:"Revenue Department \u2013 VAT Refund for Tourists",url:"https://vrtmap.rd.go.th/gps/en/Conditions.aspx"},checked:"2026-11-17",type:"fact"},{id:"lost-stolen",topic:{en:"Lost or stolen items & police reports",ko:"紛失・盗難への対処"},icon:"search",body:{en:"For theft or loss, ask the Tourist Police (1155) or go to the nearest station for a police report \u2014 you\u2019ll need it for insurance and a passport replacement. For items lost on transit or in a taxi, contact the operator or Grab support.",ko:"盗難や紛失のときは、ツーリストポリス(1155)に連絡するか、最寄りの警察署で被害届の証明書をもらってください。保険請求やパスポートの再発行に必要です。交通機関やタクシーでの忘れ物は、運営会社かGrabのサポートに問い合わせましょう。"},tips:[{en:"Block lost cards immediately via your card issuer\u2019s overseas number.",ko:"カードをなくしたら、カード会社の海外用の番号にすぐ連絡して利用を止めてください。"},{en:"Take photos of your passport, visa/entry stamp and insurance papers and store them in the cloud.",ko:"パスポート・ビザ/入国スタンプ・保険書類を写真に撮って、クラウドに保存しておきましょう。"},{en:"Phone lost? Use Find My / Find My Device before wiping.",ko:"スマホをなくしたら、データを消す前に「探す」機能を先に試しましょう。"}],source:{name:"Embassy of Japan in Thailand",url:"https://www.th.emb-japan.go.jp/itprtop_ja/index.html"},type:"advice"},{id:"travel-insurance",topic:{en:"Travel insurance & medical costs",ko:"旅行保険 & 医療費"},icon:"badge-check",body:{en:"Private Bangkok hospitals can be expensive for foreigners, so take travel insurance covering medical care, evacuation and motorbike/sports use if relevant. Pay upfront and file claims later unless the hospital has direct billing with your insurer.",ko:"バンコクの私立病院は外国人には高額になることがあるので、医療費・緊急搬送・(必要なら)バイク/スポーツ利用を補償する旅行保険に入りましょう。保険会社とキャッシュレス提携がない病院では、先に支払って後で請求します。"},tips:[{en:"Keep itemized receipts and a medical report (English) for claims.",ko:"請求のために、項目ごとの領収書と英文の診断書を保管しておきましょう。"},{en:"Check whether esports/competition injuries and pre-existing conditions are covered.",ko:"大会やスポーツでのケガ、持病が補償対象になるか確認しましょう。"},{en:"Save your insurer\u2019s 24h emergency number in your phone.",ko:"保険会社の24時間緊急連絡先をスマホに保存しておきましょう。"}],source:{name:"Embassy of Japan in Thailand – consular guidance",url:"https://www.th.emb-japan.go.jp/itprtop_ja/index.html"},type:"advice"}],ta=Object.assign([{num:"191",label:{en:"Police",ko:"警察"}},{num:"1669",label:{en:"Medical emergency / ambulance",ko:"救急医療 / 救急車"}},{num:"199",label:{en:"Fire",ko:"消防"}},{num:"1155",label:{en:"Tourist Police",ko:"ツーリストポリス"}},{num:"1672",label:{en:"TAT tourism information",ko:"TAT観光案内"}}],{note:{en:"Dial these numbers exactly as written (no +66, no area code) from a Thai SIM/eSIM or a Japanese roaming phone. Japan’s 110/119 are NOT needed or used in Thailand. 1155 (Tourist Police) has interpreters on standby; English can be limited on 191/1669. 1672 is an information line, not emergency dispatch — check its hours. Embassy of Japan in Thailand: +66-2-207-8500 (main line; outside office hours it connects to emergency guidance/duty staff); consular section +66-2-696-3000 (Mon–Fri office hours). Japan MOFA (Tokyo) main line: +81-3-3580-3311 (paid international call).",ko:"タイのSIM/eSIMでも日本のローミング携帯でも、+66や市外局番なしで番号をそのまま押せばつながります。日本の110/119はタイでは必要なく、使われません。1155(ツーリストポリス)は通訳スタッフが待機していて、191・1669は英語があまり通じないことがあります。1672は案内電話で緊急出動ではないため、受付時間を確認してください。在タイ日本国大使館：+66-2-207-8500(代表。閉館時間外は緊急対応の当直につながります)、領事部 +66-2-696-3000(平日の執務時間内)。外務省(東京)代表：+81-3-3580-3311(有料の国際電話)。"}}),Xa=ta.note,Za=[{id:"help",en:"Help me!",ko:"助けてください！",th:"\u0E0A\u0E48\u0E27\u0E22\u0E14\u0E49\u0E27\u0E22{P}",rom:"chuai duai {P}"},{id:"ambulance",en:"Please call an ambulance.",ko:"救急車を呼んでください。",th:"\u0E0A\u0E48\u0E27\u0E22\u0E40\u0E23\u0E35\u0E22\u0E01\u0E23\u0E16\u0E1E\u0E22\u0E32\u0E1A\u0E32\u0E25\u0E2B\u0E19\u0E48\u0E2D\u0E22{P}",rom:"chuai riak rot pha-ya-baan noi {P}"},{id:"hospital",en:"Please take me to the hospital.",ko:"病院に連れて行ってください。",th:"\u0E0A\u0E48\u0E27\u0E22\u0E1E\u0E32\u0E44\u0E1B\u0E42\u0E23\u0E07\u0E1E\u0E22\u0E32\u0E1A\u0E32\u0E25\u0E2B\u0E19\u0E48\u0E2D\u0E22{P}",rom:"chuai phaa pai rong-pha-ya-baan noi {P}"},{id:"police",en:"Please call the police.",ko:"警察を呼んでください。",th:"\u0E0A\u0E48\u0E27\u0E22\u0E40\u0E23\u0E35\u0E22\u0E01\u0E15\u0E33\u0E23\u0E27\u0E08\u0E2B\u0E19\u0E48\u0E2D\u0E22{P}",rom:"chuai riak tam-ruat noi {P}"},{id:"tourist-police",en:"I need the Tourist Police (1155).",ko:"ツーリストポリス(1155)に連絡したいです。",th:"\u0E02\u0E2D\u0E15\u0E34\u0E14\u0E15\u0E48\u0E2D\u0E15\u0E33\u0E23\u0E27\u0E08\u0E17\u0E48\u0E2D\u0E07\u0E40\u0E17\u0E35\u0E48\u0E22\u0E27{P}",rom:"khor tit-tor tam-ruat thong-thiao {P}"},{id:"fire",en:"Fire! Please call the fire department.",ko:"火事です！消防署に連絡してください。",th:"\u0E44\u0E1F\u0E44\u0E2B\u0E21\u0E49{P} \u0E0A\u0E48\u0E27\u0E22\u0E40\u0E23\u0E35\u0E22\u0E01\u0E23\u0E16\u0E14\u0E31\u0E1A\u0E40\u0E1E\u0E25\u0E34\u0E07\u0E2B\u0E19\u0E48\u0E2D\u0E22{P}",rom:"fai mai {P} chuai riak rot dap-phloeng noi {P}"},{id:"allergy",en:"I am allergic to ____. Does this dish contain ____?",ko:"私は____のアレルギーがあります。この料理に____は入っていますか？",th:"\u0E41\u0E1E\u0E49 ____ {P} \u0E08\u0E32\u0E19\u0E19\u0E35\u0E49\u0E21\u0E35 ____ \u0E44\u0E2B\u0E21{Q}",rom:"phae ____ {P} jaan nee mee ____ mai {Q}",extra:[{en:"Peanut",ko:"ピーナッツ",th:"\u0E16\u0E31\u0E48\u0E27\u0E25\u0E34\u0E2A\u0E07",rom:"thua li-song"},{en:"Shrimp / shellfish",ko:"エビ / 甲殻類",th:"\u0E01\u0E38\u0E49\u0E07 / \u0E2D\u0E32\u0E2B\u0E32\u0E23\u0E17\u0E30\u0E40\u0E25\u0E40\u0E1B\u0E25\u0E37\u0E2D\u0E01\u0E41\u0E02\u0E47\u0E07",rom:"kung / aa-haan tha-le pluek khaeng"},{en:"Egg",ko:"卵",th:"\u0E44\u0E02\u0E48",rom:"khai"},{en:"Milk",ko:"乳",th:"\u0E19\u0E21",rom:"nom"},{en:"Gluten / wheat",ko:"グルテン / 小麦",th:"\u0E01\u0E25\u0E39\u0E40\u0E15\u0E19 / \u0E41\u0E1B\u0E49\u0E07\u0E2A\u0E32\u0E25\u0E35",rom:"kloo-ten / paeng saa-lee"},{en:"Soy",ko:"大豆",th:"\u0E16\u0E31\u0E48\u0E27\u0E40\u0E2B\u0E25\u0E37\u0E2D\u0E07",rom:"thua lueang"},{en:"Fish",ko:"魚",th:"\u0E1B\u0E25\u0E32",rom:"plaa"},{en:"Sesame",ko:"ごま",th:"\u0E07\u0E32",rom:"ngaa"},{en:"Tree nuts",ko:"ナッツ類",th:"\u0E16\u0E31\u0E48\u0E27\u0E40\u0E1B\u0E25\u0E37\u0E2D\u0E01\u0E41\u0E02\u0E47\u0E07",rom:"thua pluek khaeng"},{en:"Crab",ko:"カニ",th:"\u0E1B\u0E39",rom:"poo"},{en:"Squid / octopus",ko:"イカ / タコ",th:"\u0E2B\u0E21\u0E36\u0E01",rom:"muek"},{en:"Fish sauce (in many dishes)",ko:"ナンプラー(多くの料理に入っています)",th:"\u0E19\u0E49\u0E33\u0E1B\u0E25\u0E32",rom:"nam-plaa"},{en:"Oyster sauce",ko:"オイスターソース",th:"\u0E19\u0E49\u0E33\u0E21\u0E31\u0E19\u0E2B\u0E2D\u0E22",rom:"nam-man hoi"},{en:"Shrimp paste",ko:"カピ(エビペースト)",th:"\u0E01\u0E30\u0E1B\u0E34",rom:"ka-pi"}]},{id:"severe-allergy",en:"I have a severe allergy. I can\u2019t breathe. I need a hospital now.",ko:"重いアレルギーがあります。息ができません。今すぐ病院に行きたいです。",th:"\u0E41\u0E1E\u0E49\u0E23\u0E38\u0E19\u0E41\u0E23\u0E07{P} \u0E2B\u0E32\u0E22\u0E43\u0E08\u0E44\u0E21\u0E48\u0E2D\u0E2D\u0E01{P} \u0E02\u0E2D\u0E44\u0E1B\u0E42\u0E23\u0E07\u0E1E\u0E22\u0E32\u0E1A\u0E32\u0E25\u0E14\u0E48\u0E27\u0E19{P}",rom:"phae run-raeng {P} hai-jai mai ok {P} khor pai rong-pha-ya-baan duan {P}"},{id:"lost",en:"I\u2019m lost. Can you help me find my way?",ko:"道に迷いました。道を教えてもらえますか？",th:"\u0E2B\u0E25\u0E07\u0E17\u0E32\u0E07{P} \u0E0A\u0E48\u0E27\u0E22\u0E1A\u0E2D\u0E01\u0E17\u0E32\u0E07\u0E2B\u0E19\u0E48\u0E2D\u0E22{P}",rom:"long thaang {P} chuai bok thaang noi {P}"},{id:"lost-passport",en:"I lost my passport. I need to file a police report.",ko:"パスポートをなくしました。警察に届け出たいです。",th:"\u0E17\u0E33\u0E1E\u0E32\u0E2A\u0E1B\u0E2D\u0E23\u0E4C\u0E15\u0E2B\u0E32\u0E22{P} \u0E02\u0E2D\u0E44\u0E1B\u0E41\u0E08\u0E49\u0E07\u0E04\u0E27\u0E32\u0E21{P}",rom:"tham phat-sa-pot hai {P} khor pai jaeng-khwaam {P}"},{id:"stolen",en:"My bag was stolen. Please call the police.",ko:"バッグを盗まれました。警察を呼んでください。",th:"\u0E01\u0E23\u0E30\u0E40\u0E1B\u0E4B\u0E32\u0E16\u0E39\u0E01\u0E02\u0E42\u0E21\u0E22{P} \u0E0A\u0E48\u0E27\u0E22\u0E40\u0E23\u0E35\u0E22\u0E01\u0E15\u0E33\u0E23\u0E27\u0E08\u0E2B\u0E19\u0E48\u0E2D\u0E22{P}",rom:"kra-pao thuuk kha-moy {P} chuai riak tam-ruat noi {P}"},{id:"need-doctor",en:"I need to see a doctor.",ko:"診察を受けたいです。",th:"\u0E02\u0E2D\u0E1E\u0E1A\u0E2B\u0E21\u0E2D\u0E2B\u0E19\u0E48\u0E2D\u0E22{P}",rom:"khor phop mor noi {P}"},{id:"unwell",en:"I feel unwell.",ko:"体調が悪いです。",th:"\u0E44\u0E21\u0E48\u0E2A\u0E1A\u0E32\u0E22{P}",rom:"mai sa-baai {P}",extra:[{en:"Headache",ko:"頭痛",th:"\u0E1B\u0E27\u0E14\u0E2B\u0E31\u0E27",rom:"puat hua"},{en:"Stomach ache",ko:"腹痛",th:"\u0E1B\u0E27\u0E14\u0E17\u0E49\u0E2D\u0E07",rom:"puat thong"},{en:"Nausea",ko:"吐き気",th:"\u0E04\u0E25\u0E37\u0E48\u0E19\u0E44\u0E2A\u0E49",rom:"khluen-sai"},{en:"Diarrhea",ko:"下痢",th:"\u0E17\u0E49\u0E2D\u0E07\u0E40\u0E2A\u0E35\u0E22",rom:"thong sia"},{en:"Fever",ko:"熱があります",th:"\u0E21\u0E35\u0E44\u0E02\u0E49",rom:"mee khai"},{en:"Dizzy",ko:"めまいがします",th:"\u0E40\u0E27\u0E35\u0E22\u0E19\u0E2B\u0E31\u0E27",rom:"wian hua"},{en:"Fainted / heat stroke",ko:"失神 / 熱中症",th:"\u0E40\u0E1B\u0E47\u0E19\u0E25\u0E21 / \u0E25\u0E21\u0E41\u0E14\u0E14",rom:"pen lom / lom daet"},{en:"Chest pain",ko:"胸の痛み",th:"\u0E40\u0E08\u0E47\u0E1A\u0E2B\u0E19\u0E49\u0E32\u0E2D\u0E01",rom:"jep naa-ok"},{en:"Can\u2019t breathe",ko:"息ができません",th:"\u0E2B\u0E32\u0E22\u0E43\u0E08\u0E44\u0E21\u0E48\u0E2D\u0E2D\u0E01",rom:"hai-jai mai ok"}]},{id:"accident",en:"There\u2019s been an accident. Someone is injured.",ko:"事故が起きました。けが人がいます。",th:"\u0E40\u0E01\u0E34\u0E14\u0E2D\u0E38\u0E1A\u0E31\u0E15\u0E34\u0E40\u0E2B\u0E15\u0E38{P} \u0E21\u0E35\u0E04\u0E19\u0E1A\u0E32\u0E14\u0E40\u0E08\u0E47\u0E1A{P}",rom:"koet u-bat-ti-het {P} mee khon baat-jep {P}"},{id:"embassy",en:"Please call the Japanese embassy.",ko:"日本大使館に連絡してください。",th:"ช่วยโทรหาสถานทูตญี่ปุ่นหน่อย{P}",rom:"chuai thoh haa sa-thaan-thuut yee-pun noi {P}"},{id:"call-friend",en:"Please call my friend / teammate for me.",ko:"私の友達(チームメイト)に代わりに電話してください。",th:"\u0E0A\u0E48\u0E27\u0E22\u0E42\u0E17\u0E23\u0E2B\u0E32\u0E40\u0E1E\u0E37\u0E48\u0E2D\u0E19\u0E43\u0E2B\u0E49\u0E2B\u0E19\u0E48\u0E2D\u0E22{P}",rom:"chuai thoh haa phuean hai noi {P}"},{id:"interpreter",en:"Do you speak English? I need a Japanese interpreter.",ko:"英語は話せますか？日本語の通訳が必要です。",th:"พูดภาษาอังกฤษได้ไหม{Q} ขอล่ามภาษาญี่ปุ่นหน่อย{P}",rom:"phuut phaa-saa ang-grit dai mai {Q} khor lam phaa-saa yee-pun noi {P}"},{id:"pharmacy",en:"Where is the nearest pharmacy?",ko:"いちばん近い薬局はどこですか？",th:"\u0E23\u0E49\u0E32\u0E19\u0E02\u0E32\u0E22\u0E22\u0E32\u0E17\u0E35\u0E48\u0E43\u0E01\u0E25\u0E49\u0E17\u0E35\u0E48\u0E2A\u0E38\u0E14\u0E2D\u0E22\u0E39\u0E48\u0E17\u0E35\u0E48\u0E44\u0E2B\u0E19{Q}",rom:"raan khaai yaa thee klai thee-sut yoo thee-nai {Q}"}]});var eo,et=S(()=>{eo=[{id:"loy-krathong-2026-bangkok",title:{en:"Loy Krathong 2026 \u2014 Bangkok riverside & Rattanakosin programme",ko:"ロイクラトン2026 — バンコクのチャオプラヤー川沿い & ラタナコーシン地区のイベント"},blurb:{en:`The full moon falls on 24 Nov 2026, and Bangkok's city-run Loy Krathong programme (the "Rattanakosin Waterways" theme) runs 17\u201329 Nov with five activity sites, including Rama VIII Bridge and Phra Sumen Fort, plus a route linking Wat Saket, Wat Ratchanatdaram, Wat Thepthidaram and Mahakan Fort. Expect krathong floating, cultural shows and crafts. Site-by-site dates differ slightly between announcements, so check the venue on the day.`,ko:"2026年のロイクラトンは満月の11月24日です。バンコク都が開催する公式プログラム(ラタナコーシンの水路がテーマ)は11/17〜11/29に、ラマ8世橋やプラスメン砦など5か所で行われ、ワット・サケット、ワット・ラーチャナダー、ワット・テープティダー、マハーカーン砦をつなぐコースもあります。クラトン流し、伝統芸能、工芸体験をまとめて楽しめます。会場ごとの日程は発表によって少し違うので、行く前にもう一度確認するのがおすすめです。"},dates:"2026-11-17 to 2026-11-29",where:{en:"Rama VIII Bridge, Phra Sumen Fort, Wat Saket / Mahakan Fort area (Old Town), and other BMA sites",ko:"ラマ8世橋、プラスメン砦、ワット・サケット・マハーカーン砦周辺(旧市街)など"},kind:"festival",source:{name:"TAT News \u2014 Loi Krathong 2026 lights up Thailand's rivers and historic cities",url:"https://www.tatnews.org/2026/11/loi-krathong-2026-lights-up-thailands-rivers-and-historic-cities/"},checked:"2026-11-17",mapsQuery:"Mahakan Fort Bangkok"},{id:"enchanting-waterways-mahakan-fort",title:{en:"The Enchanting Waterways of Rattanakosin (Mahakan Fort)",ko:"ラタナコーシンの水路の魔法(マハーカーン砦)"},blurb:{en:'A BMA-organised Loy Krathong evening event, 23\u201325 Nov, 17:00\u201322:00. It features khon and likay performances, krathong and flower-garland workshops, a recreated period-style market, photo spots and food stalls. Free Thai-style outfits ("Chud Thai") are offered for visitors who want to dress up.',ko:"バンコク都の文化・スポーツ・観光局が開くロイクラトンの夕方のイベントで、11/23〜11/25の毎日17:00〜22:00に開催されます。コーン(仮面舞踊劇)とリケ(大衆舞踊劇)の公演、クラトンや花飾りづくりの体験、昔の市場を再現したエリア、フォトスポット、屋台があります。タイの伝統衣装(チュット・タイ)を無料で借りて着られるそうです。チームメイトと写真を撮るのにぴったりです。"},dates:"2026-11-23 to 2026-11-25",where:{en:"Mahakan Fort, Wat Saket, Wat Ratchanatdaram and Wat Thepthidaram (Old Town, Phra Nakhon)",ko:"マハーカーン砦、ワット・サケット、ワット・ラーチャナダー、ワット・テープティダー(旧市街、プラナコーン)"},kind:"event",source:{name:"The Nation Thailand \u2014 Bangkok plans Loy Krathong at 5 sites from November 17",url:"https://www.nationthailand.com/news/tourism/40072970"},checked:"2026-11-17",mapsQuery:"Mahakan Fort Bangkok"},{id:"vijit-chao-phraya-2026",title:{en:"Vijit Chao Phraya 2026 \u2014 riverside light festival",ko:"ウィジット・チャオプラヤー2026 — 川沿いの光の祭典"},blurb:{en:"A free light festival along both banks of the Chao Phraya, running nightly 18:00\u201322:00 at 19 sites between Rama VIII Bridge and Rama III Bridge. Venues include Wat Arun, ICONSIAM and Asiatique Charoen Nakhon Pier. Fireworks and drone shows (800+ drones at Wat Arun) happen on selected dates only, so check the programme before planning around them.",ko:"チャオプラヤー川の両岸19か所(ラマ8世橋〜ラマ3世橋の区間)で、毎晩18:00〜22:00に開かれる無料の光の祭典です。ワット・アルン、アイコンサイアム、アジアティーク・チャルンクルン船着き場などが含まれます。花火とドローンショー(ワット・アルンは800機以上)は特定の日だけなので、先にスケジュールを確認してください。夕方に川沿いを散歩しながら写真を撮るのにおすすめです。"},dates:"2026-11-13 to 2026-12-13",where:{en:"19 riverside sites between Rama VIII Bridge and Rama III Bridge (Wat Arun, ICONSIAM, Asiatique pier)",ko:"ラマ8世橋〜ラマ3世橋の間の川沿い19か所(ワット・アルン、アイコンサイアム、アジアティークの船着き場など)"},kind:"festival",source:{name:"The Nation Thailand \u2014 Vijit Chao Phraya opens as TAT targets over 1.4m visitors",url:"https://www.nationthailand.com/news/40073491"},checked:"2026-11-17",mapsQuery:"Wat Arun Bangkok"},{id:"kings-birthday-fathers-day-2026",title:{en:"King Bhumibol's Birthday / Father's Day (5 Dec) \u2014 public holiday",ko:"プミポン国王誕生日・父の日(12/5)— 祝日"},blurb:{en:"Thailand's National Day, King Bhumibol's Birthday and Father's Day fall on 5 Dec, a Saturday in 2026; the holiday listing shows Monday 7 Dec as the observed day. Expect closed government offices and banks, and a respectful, patriotic mood with yellow decorations and tributes. Check opening hours of shops and venues in advance; a specific 2026 illumination schedule could not be confirmed, so none is listed.",ko:"タイの国の日であり、プミポン国王誕生日・父の日でもある12月5日は、2026年は土曜日で、祝日一覧では12月7日(月)が振替休日になっています。官公庁と銀行はお休みで、黄色い飾りや追悼の雰囲気が街のあちこちで見られます。お店や施設の営業時間は事前に確認してください。今年の特別なライトアップの日程は確認できなかったので、記載していません。"},dates:"2026-12-05 to 2026-12-07",where:{en:"Nationwide, tributes concentrated in Old Town / Ratchadamnoen area",ko:"全国(バンコクでは旧市街・ラチャダムヌン通り周辺が中心)"},kind:"event",source:{name:"OfficeHolidays \u2014 King Bhumibol's Birthday in Thailand 2026",url:"https://www.officeholidays.com/countries/thailand/king-bhumibols-birthday.php"},checked:"2026-11-17",mapsQuery:"Ratchadamnoen Avenue Bangkok"},{id:"one-bangkok-christmas-2026",title:{en:"Onederous Christmas 2026 at One Bangkok",ko:"ワン・バンコクのクリスマス2026(Onederous Christmas)"},blurb:{en:"One Bangkok's festive season runs until 4 Jan 2027 with a giant Christmas tree, a Christmas train, hot-air-balloon and tunnel installations. Onederous Christmas Market is at One Bangkok Park 1\u201325 Dec and at The Storeys Square 5 Dec\u20133 Jan, with live jazz Thu\u2013Sun 18:00\u201322:00 from 19 Nov to 13 Dec.",ko:"ワン・バンコクの年末シーズンは2027年1月4日まで続きます。巨大クリスマスツリー、クリスマス列車、熱気球やトンネルのフォトスポットなどがあります。クリスマスマーケットはワン・バンコク・パークで12/1〜12/25、ザ・ストーリーズ・スクエアで12/5〜1/3に開かれ、11/19〜12/13の木〜日曜18:00〜22:00にはライブジャズもあります。練習の後に気軽に見に行ける夜景スポットです。"},dates:"2026-11-13 to 2027-01-04",where:{en:"One Bangkok, Wireless Road (Lumphini / Phloen Chit area)",ko:"ワン・バンコク(ワイヤレス・ロード、ルンピニー・プルンチット近く)"},kind:"event",source:{name:"The Nation Thailand (press release) \u2014 Onederous Christmas 2026: A Onederous Voyage",url:"https://www.nationthailand.com/pr-news/40073448"},checked:"2026-11-17",mapsQuery:"One Bangkok"},{id:"amazing-thailand-countdown-iconsiam",title:{en:"Amazing Thailand Countdown 2027 at ICONSIAM",ko:"アメイジング・タイランド・カウントダウン2027(アイコンサイアム)"},blurb:{en:"TAT and ICONSIAM announced a five-day New Year celebration, 27\u201331 Dec, at ICONSIAM's River Park on the Chao Phraya. Organisers promise a 1,400 m fireworks display, 200+ Thai and international performers and regional Thai food. Riverside areas get very crowded on 31 Dec, so go early.",ko:"タイ国政府観光庁(TAT)とアイコンサイアムが発表した5日間の新年イベントで、12/27〜12/31にチャオプラヤー川沿いのアイコンサイアム・リバーパークで開かれます。1,400m規模の花火、タイと海外のアーティスト200人以上のパフォーマンス、各地のタイ料理が用意されるそうです。12/31は川沿いがものすごく混むので、早めに行きましょう。"},dates:"2026-12-27 to 2026-12-31",where:{en:"ICONSIAM River Park, Khlong San (Chao Phraya riverside)",ko:"アイコンサイアム・リバーパーク、クロンサーン(チャオプラヤー川沿い)"},kind:"event",source:{name:"Pattaya Mail (NNT) \u2014 Bangkok prepares for spectacular five-day Amazing Thailand Countdown 2027",url:"https://www.pattayamail.com/thailandnews/bangkok-prepares-for-spectacular-five-day-amazing-thailand-countdown-2027-571818"},checked:"2026-11-17",mapsQuery:"ICONSIAM Bangkok"},{id:"one-bangkok-countdown-2027",title:{en:"One Bangkok Countdown Celebration 2027",ko:"ワン・バンコク カウントダウン2027"},blurb:{en:"On the evening of 31 Dec 2026, One Bangkok plans live concerts by Thai and international acts, followed by a panoramic fireworks display over the skyline. The line-up had not been announced as of the source (13 Nov 2026).",ko:"12月31日の夜、ワン・バンコクでタイと海外のアーティストによるライブが行われ、その後スカイライン上空で花火が上がる予定です。出演者は、情報源の時点(2026年11月13日)ではまだ発表されていません。人出が多いので、移動の計画を事前に立てておきましょう。"},dates:"2026-12-31 to 2026-12-31",where:{en:"One Bangkok, Wireless Road",ko:"ワン・バンコク(ワイヤレス・ロード)"},kind:"event",source:{name:"The Nation Thailand (press release) \u2014 Onederous Christmas 2026: A Onederous Voyage",url:"https://www.nationthailand.com/pr-news/40073448"},checked:"2026-11-17",mapsQuery:"One Bangkok"},{id:"cool-season-2026",title:{en:"Cool season has started \u2014 milder, drier Bangkok weather",ko:"バンコクのクールシーズン開始 — 少し涼しく、湿気も控えめ"},blurb:{en:"The Thai Meteorological Department says winter officially began on 9 Nov 2026, with Bangkok forecast to cool by 1\u20133\xB0C. An earlier forecast expected Bangkok lows of about 19\u201321\xB0C, with the coolest stretch from late December to early February, but a strengthening El Ni\xF1o may keep the season warmer than usual. It is still sunny by day, so pack sunscreen plus a light layer for evenings.",ko:"タイ気象局(TMD)は、11月9日から公式に冬(クールシーズン)が始まったと発表し、バンコクは1〜3°Cほど涼しくなる見込みです。先の予報ではバンコクの最低気温は19〜21°C程度、いちばん涼しい時期は12月下旬〜2月上旬とされていましたが、エルニーニョの影響で例年より寒くならない可能性があります。昼はまだ日差しが強いので、日焼け止めと夜用の薄手の上着を持っていきましょう。"},dates:"2026-11-09 to 2027-02-15",where:{en:"Bangkok and upper Thailand",ko:"バンコクおよびタイ北部・中部"},kind:"seasonal",source:{name:"The Nation Thailand (9 Nov 2026, winter start) + The Star/ANN (15 Oct 2026, TMD seasonal forecast to ~mid-Feb)",url:"https://www.nationthailand.com/news/40073277"},checked:"2026-11-17"}]});var na,at=S(()=>{na={"food/mango-sticky-rice":[13.72397,100.57933],"exp/cafe-ari-hopping":[13.77971,100.54462],"exp/cafe-song-wat-riverside":[13.73636,100.51134],"exp/cafe-talat-noi-alleys":[13.73345,100.51297],"exp/cafe-charoen-krung-bakery-coffee":[13.72113,100.51622],"exp/cafe-ekkamai-hopping":[13.74133,100.58989],"exp/cafe-thonglor-dessert-crawl":[13.73151,100.58168],"exp/cafe-siam-matcha-dessert":[13.7446,100.5331],"exp/cafe-phrom-phon
